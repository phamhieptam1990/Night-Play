<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="shared/guard.js"></script>
<script src="shared/device.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Night Pass · Night Play</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12141F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237C5CFF'/%3E%3Cpath d='M40 40A16 16 0 1 1 26 16a13 13 0 0 0 14 24z' fill='%23fff'/%3E%3C/svg%3E">
<script>
/* Xác định app gọi tới (?from=popplay/index.html) để dùng đúng thương hiệu + màu; chạy trước khi vẽ nên không nháy màu */
const DEFAULT_HOME = "cozyplay/index.html";
const MOON = '<path d="M42 40A16 16 0 1 1 26 14a13 13 0 0 0 16 26z" fill="#fff"/><circle cx="44" cy="20" r="2.5" fill="#fff"/>';
const PLAY = '<path d="M25 18l22 14-22 14z" fill="#fff"/>';
const logo = (p, c) => '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="' + c + '"/>' + p + '</svg>';
const APPS = {
  cozyplay:{ brand:"Night Play", theme:"dark", color:{ light:"#F3F0FA", dark:"#12141F" }, logo:logo(MOON, "#7C5CFF") },
  popplay: { brand:"Pop Play",   theme:null,   color:{ light:"#F3F0FA", dark:"#12141F" }, logo:logo(PLAY, "#FF5A1F") }
};
/* Trang quay về: ?from= (đường dẫn tương đối, an toàn) → referrer cùng origin → mặc định */
const HOME = (() => {
  const ok = p => p && /^[\w\-./]+(#[\w-]+)?$/.test(p) && !p.startsWith("/") && !p.includes("..") && !p.includes("//") && !/subscribe\.html/.test(p);
  const f = new URLSearchParams(location.search).get("from");
  if(ok(f)) return f;
  try{
    const r = new URL(document.referrer);
    if(r.origin === location.origin && !/subscribe\.html/.test(r.pathname)){
      const rel = r.pathname.slice(location.pathname.replace(/[^/]*$/, "").length).replace(/\/$/, "/index.html");
      if(ok(rel)) return rel;
    }
  }catch(e){}
  return DEFAULT_HOME;
})();
const APPKEY = APPS[HOME.split("/")[0]] ? HOME.split("/")[0] : "cozyplay", APP = APPS[APPKEY];
try{var t=localStorage.getItem("theme")}catch(e){}
document.documentElement.dataset.app = APPKEY;
document.documentElement.dataset.np = "";   /* bật giao diện Night Pass (shared/nightpass-ui.css) */
document.documentElement.dataset.theme = t || APP.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="preload" href="shared/fonts/inter-var-latin-vi.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/bars.css">
<style>
/* Bảng màu theo từng app: cozyplay (tím đêm) / popplay (cam) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* Header giống landing */
.nav{flex:none;position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.2px;min-width:0;color:var(--ink);text-decoration:none}
.mark svg{width:36px;height:36px;flex:none;display:block}
.mark .mk{display:flex}
.mark span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{position:relative;display:flex;gap:10px;align-items:center}
.ico{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.back{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
@media (max-width:520px){.back{width:44px;padding:0}.back span{display:none}}
.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
#langMenu{position:absolute;top:54px;right:0;min-width:150px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:none;z-index:6}
#langMenu.on{display:block}
#langMenu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:none;font-size:16px;font-weight:600}
#langMenu button[aria-checked=true]{background:var(--accent);color:var(--on-accent)}
/* Ngôn ngữ: công tắc VI | EN luôn hiện, một chạm là đổi (thay cho nút địa cầu + danh sách thả xuống) */
#langMenu{position:static;display:inline-flex;min-width:0;width:auto;padding:3px;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);top:auto;right:auto}
#langMenu button{display:inline-block;width:auto;height:38px;padding:0 14px;border-radius:19px;background:none;color:var(--muted);font-size:15px;font-weight:800;text-align:center}
#langMenu button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
@media (max-width:520px){#langMenu button{padding:0 11px;height:34px;font-size:14px}}
/* Nội dung chính: cuộn riêng nếu màn quá thấp */
main{flex:1;min-height:0;overflow-y:auto;padding:0 16px 8px}
.in{max-width:1280px;margin:0 auto}
.hero{text-align:center;padding:clamp(6px,1.4vh,14px) 0 clamp(4px,1vh,10px)}
.hero h1{margin:0;font-size:clamp(22px,min(4vw,4.4vh),32px);line-height:1.1;font-weight:800;letter-spacing:-.5px}
.hero p{margin:4px auto 0;max-width:520px;opacity:.85;font-size:clamp(13px,1.9vh,15px)}
@media (max-height:860px){.hero p{display:none}}
/* Footer giống landing */
.foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding:6px 16px 6px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--hero1))}
.foot .mark{font-size:16px}.foot .mark svg{width:28px;height:28px}
.fcol{display:flex;flex-wrap:wrap;gap:0 14px}
.fcol a,.fcol button{padding:8px 0;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;background:none}
.fcol a:hover,.fcol button:hover{color:var(--accent)}
.foot p{margin:0 0 0 auto;font-size:12px;opacity:.75}
@media (max-width:640px){.foot p,.foot .mark span:last-child{display:none}}
.status{margin:0 auto 20px;padding:14px 18px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);font-weight:700;text-align:center;display:none}
.status.on{display:block;border:2px solid var(--ok)}
/* Các bước */
.steps{list-style:none;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 8px;padding:0;max-width:420px}
.steps li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted)}
.steps li b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--panel);border:2px solid var(--line);flex:none}
.steps li.on{color:var(--ink)}.steps li.on b{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps li.done{color:var(--ink2)}.steps li.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.bar{flex:1;height:2px;background:var(--line);border-radius:2px;min-width:30px}
.step:focus{outline:none}
/* Bước 1: chọn gói */
.plans{display:grid;gap:16px;grid-template-columns:1fr;max-width:1100px;margin:12px auto 0}
@media(min-width:600px){.plans{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.plans{grid-template-columns:repeat(4,1fr)}}
.plan{position:relative;text-align:left;padding:14px 16px 12px;border-radius:20px;background:var(--panel);box-shadow:var(--shadow);border:3px solid transparent;display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.plan:hover{transform:translateY(-2px)}
.plan[aria-checked=true]{border-color:var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--panel)),var(--panel))}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan h3{margin:0;font-size:17px}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.plan[aria-checked=true] .rd{border-color:var(--accent);background:var(--accent)}
.plan[aria-checked=true] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.price{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.price small{font-size:14px;font-weight:600;opacity:.75}
.per{font-size:12.5px;color:var(--muted);font-weight:600;display:block;min-height:18px}
.desc{font-size:13.5px;line-height:1.4;opacity:.9;display:block;margin:0 0 4px}
.inc{display:flex;flex-direction:column;gap:5px;margin-top:2px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;line-height:1.3}
.inc>span{display:flex;align-items:flex-start;gap:8px}
.inc .ck{margin:1px 0 0;flex:none}
.valid{margin-top:auto;padding-top:6px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.badge{position:absolute;top:-12px;left:16px;padding:3px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800}
.save{color:var(--ok);font-weight:700;font-size:13px}
.next{position:sticky;bottom:0;z-index:2;max-width:none;margin:10px -16px 0;padding:10px 16px 8px;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.next .cta{margin:0 auto;max-width:420px;padding:14px}
/* So sánh */
h2{font-size:20px;margin:30px 0 12px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);font-size:15px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.7;background:transparent}
td:first-child{font-weight:600}
td:not(:first-child),th:not(:first-child){text-align:left;white-space:nowrap}
th.pro,td.pro{width:42%}
th:nth-child(2),td.fr{width:24%}
td.fr{opacity:.8}
th.pro{background:var(--accent);color:var(--on-accent);opacity:1;font-size:13px;letter-spacing:.04em}
th.pro svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px}
td.pro{background:color-mix(in srgb,var(--accent) 11%,transparent);font-weight:700;border-bottom-color:color-mix(in srgb,var(--accent) 18%,var(--line))}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;vertical-align:middle;margin-right:6px;flex:none}
.ck svg{width:12px;height:12px;display:block}
td.fr .ck{background:var(--line);color:var(--ink)}
/* Thanh toán */
.pay{display:grid;gap:16px;margin:12px auto 0;max-width:960px}
@media(min-width:760px){.pay{grid-template-columns:1.1fr 1fr;align-items:start}}
.linkbtn{display:inline-flex;align-items:center;gap:6px;margin:0 auto;padding:8px 4px;background:none;color:var(--accent);font-weight:700;font-size:15px}
.s2top{max-width:960px;margin:0 auto}
.card{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:20px}
.card h2{margin:0 0 12px;font-size:18px}
label.f{display:block;font-weight:600;margin:12px 0 6px}
input[type=email],.dlg input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:16px}
input[type=email][aria-invalid=true]{border-color:var(--warn)}
.err{color:var(--warn);font-size:13px;margin:6px 0 0;min-height:18px}
.methods{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.m{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg);border:2px solid var(--line);text-align:left;font-weight:600}
.m[aria-checked=true]{border-color:var(--accent);background:var(--card)}
.m i{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:#fff}
.order{border:2px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--panel)),var(--panel))}
.card.order h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;opacity:.65;font-weight:700}
.sum{list-style:none;margin:0;padding:0}
.sum li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.sum li>span:first-child{opacity:.7}
.sum li>span:last-child{font-weight:700;text-align:right}
.sum .hd>span{white-space:nowrap}
.sum .hd{padding:0 0 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.sum .hd>span:first-child{opacity:1;font-size:19px;font-weight:800}
.sum .chip{padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:800}
.sum .pm>span:last-child{display:inline-flex;align-items:center;gap:8px}
.sum .pm i{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-style:normal;font-weight:800;font-size:10px;color:#fff}
.sum li.t{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.sum li.t>span:first-child{opacity:1;font-size:15px;font-weight:700}
.sum li.t>span:last-child{font-size:26px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.cta{display:flex;align-items:center;justify-content:center;gap:8px}
.cta svg{width:18px;height:18px;flex:none}
.cta{width:100%;margin-top:16px;padding:16px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:17px}
.cta:disabled{opacity:.5;cursor:not-allowed}
.fine{font-size:12.5px;opacity:.8;margin:12px 0 0}
/* Hộp thanh toán / kết quả */
dialog{border:0;border-radius:24px;padding:0;background:var(--panel);color:var(--ink);width:min(440px,calc(100% - 32px));box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:22px;text-align:center}
.dlg h3{margin:0 0 8px;font-size:20px}
/* Hộp Khôi phục gói: biểu tượng + tiêu đề + mô tả + ô nhập có nhãn + dòng lỗi giữ chỗ + hai nút cùng cỡ */
.dlg .ic{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--accent) 16%,var(--panel));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.dlg h3{margin-bottom:6px}
.dlg .sub{margin:0 0 16px;font-size:14px;line-height:1.45;opacity:.75}
.dlg .fld{display:block;text-align:left;margin:0 0 6px;font-size:13px;font-weight:700;opacity:.8}
.dlg input{display:block;margin:0;text-align:left}
.dlg input.otp{text-align:center;font-size:26px;font-weight:800;letter-spacing:.5em;padding:12px 12px 12px calc(12px + .5em);font-variant-numeric:tabular-nums}
.dlg .err{min-height:20px;margin:8px 0 0;font-size:13px;font-weight:600;text-align:left;color:#d6336c}
.dlg .row{margin-top:10px}
.dlg .row button{min-height:48px}
.qr{width:200px;height:200px;margin:12px auto;border-radius:16px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--panel) 0 50%) 0 0/24px 24px;opacity:.15;border:6px solid var(--panel)}
.kv{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.kv span{opacity:.7;flex:0 0 auto}.kv b{margin-left:auto;text-align:right;word-break:break-all}.cp{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}.mut{opacity:.7;font-size:13px;margin:4px 0}
.demo{margin:8px 0;padding:10px;border-radius:12px;background:#FFD93D;color:#3a2e00;font-size:13px;font-weight:700}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:14px;border-radius:14px;font-weight:700}
.p{background:var(--accent);color:var(--on-accent)}
.s{background:var(--bg);border:2px solid var(--line)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== KHÔNG CUỘN: JS tăng data-dens (0→4) cho tới khi vừa khung nhìn ===== */
html[data-dens="1"] #cmp,html[data-dens="1"] #plansH,html[data-dens="2"] #cmp,html[data-dens="2"] #plansH,html[data-dens="3"] #cmp,html[data-dens="3"] #plansH,html[data-dens="4"] #cmp,html[data-dens="4"] #plansH{display:none}
html:not([data-dens="0"]) .hero p{display:none}
html[data-dens="2"] .hero,html[data-dens="3"] .hero,html[data-dens="4"] .hero{padding:4px 0 2px}
html[data-dens="2"] .hero h1,html[data-dens="3"] .hero h1,html[data-dens="4"] .hero h1{font-size:22px}
html[data-dens="4"] .hero{display:none}
/* bước 1 */
html[data-dens="2"] .plan,html[data-dens="3"] .plan,html[data-dens="4"] .plan{padding:10px 14px 8px;gap:2px}
html[data-dens="2"] .per,html[data-dens="3"] .per,html[data-dens="4"] .per{display:none}
html[data-dens="2"] .plans,html[data-dens="3"] .plans,html[data-dens="4"] .plans{gap:12px;margin-top:10px}
html[data-dens="3"] .inc,html[data-dens="4"] .inc{display:none}
html[data-dens="4"] .desc{display:none}
html[data-dens="2"] .steps,html[data-dens="3"] .steps,html[data-dens="4"] .steps{margin-bottom:4px}
html[data-dens="3"] .next,html[data-dens="4"] .next{margin-top:6px;padding:6px 16px 4px}
html[data-dens="3"] .next .cta,html[data-dens="4"] .next .cta{padding:11px}
/* bước 2 */
html:not([data-dens="0"]) #s2 .card h2{display:none}
html[data-dens="2"] #s2 .sum .dur,html[data-dens="2"] #s2 .sum .pm,html[data-dens="3"] #s2 .sum .dur,html[data-dens="3"] #s2 .sum .pm,html[data-dens="4"] #s2 .sum .dur,html[data-dens="4"] #s2 .sum .pm{display:none}
html[data-dens="3"] #s2 .card,html[data-dens="4"] #s2 .card{padding:10px 12px}
html[data-dens="3"] #s2 .m,html[data-dens="4"] #s2 .m{padding:6px 10px}
html[data-dens="3"] #s2 .linkbtn,html[data-dens="4"] #s2 .linkbtn{padding:2px 4px}
html[data-dens="3"] #s2 .pay,html[data-dens="4"] #s2 .pay{gap:8px;margin-top:4px}
html[data-dens="3"] #s2 .cta,html[data-dens="4"] #s2 .cta{margin-top:8px;padding:11px}
html[data-dens="4"] #s2 .fine{font-size:11px;line-height:1.3;margin-top:4px}
html[data-dens="4"] .foot p{display:none}
html[data-dens="3"] #s2 .sum .hd,html[data-dens="4"] #s2 .sum .hd{display:none}
html[data-dens="4"] #s2 .sum li:not(.t){display:none}
html[data-dens="4"] .steps{display:none}
html[data-dens="4"] #s2 .card{padding:8px 12px}
html[data-dens="4"] #s2 .fine{margin:3px 0 0}
html[data-dens="4"] #s2 .methods{gap:6px;margin-top:4px}
html[data-dens="4"] #s2 label.f{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}   /* vẫn đọc được bằng trình đọc màn hình */
html[data-dens="4"] #s2 .m{font-size:13px;padding:5px 8px;gap:8px}
html[data-dens="4"] #s2 .m i{width:22px;height:22px}
html[data-dens="4"] #s2 input[type=email]{padding:9px 12px}
/* phần đầu/cuối trang gọn hơn trên màn hình thấp / điện thoại */
@media (max-height:720px){.nav{padding:6px 16px}.nav .ico,.nav .back{height:40px;min-width:40px}.nav .ico{width:40px}.mark svg{width:32px;height:32px}}
@media (max-width:360px){.m span{font-size:12.5px;line-height:1.15}.fcol{gap:0 10px}.fcol a,.fcol button{font-size:12px}}

  .plans{grid-template-columns:1fr;gap:14px}

  .ph{grid-column:1;grid-row:1;justify-content:flex-start;gap:10px}
  .rd{order:-1}
  .plan .price{grid-column:2;grid-row:1;text-align:right;font-size:22px}
  .per{grid-column:2;grid-row:2;text-align:right;font-size:12px}
  .desc{grid-column:1;grid-row:2;margin:0;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

}
@media (prefers-reduced-motion:reduce){.plan{transition:none}}

  acctH:"Account", email:"Email (for receipt and restoring your pass)", emailBad:"Please enter a valid email.",

};

/* ===== TIỆN ÍCH ===== */
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let lang = (()=>{ const q=new URLSearchParams(location.search).get("lang"); if(q&&i18n[q]) return q; try{ const s=localStorage.getItem("lang"); if(s&&i18n[s]) return s; }catch(e){}
  for(const l of (navigator.languages||[navigator.language||""])){ const c=String(l).split("-")[0].toLowerCase(); if(i18n[c]) return c; } return "vi"; })();
const T = k => i18n[lang][k] ?? k;
const vnd = n => n.toLocaleString(lang==="vi"?"vi-VN":"en-US") + "đ";
const fmtDate = d => new Date(d).toLocaleDateString(lang==="vi"?"vi-VN":"en-GB");
const addDays = (from, n) => { const d = new Date(from); d.setDate(d.getDate()+n); return d; };

let planId = "month", methodId = "momo";
const plan = () => PLANS.find(p => p.id === planId);
const method = () => METHODS.find(m => m.id === methodId);

/* Gói đang có: {plan, exp(ISO), email}. Cộng dồn nếu mua khi còn hạn */
const getPass = () => store.get("pass");
const isActive = p => p && new Date(p.exp) > new Date();

/* ===== VẼ ===== */
const CK = '<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
const fill = (k, v) => T(k).replace(/\{(\w+)\}/g, (_, x) => v[x]);
function renderPlans(){
  const box = $("plans"); box.textContent = "";
  const monthly = PLANS.find(p=>p.id==="month").price;
  PLANS.forEach(p => {
    const b = document.createElement("button");
    b.type="button"; b.className="plan" + (p.best ? " best" : ""); b.setAttribute("role","radio"); b.setAttribute("aria-checked", p.id===planId);
    const per = {day:"perDay",week:"perWeek",month:"perMonth",year:"perYear"}[p.id];
    const cap = p.id[0].toUpperCase() + p.id.slice(1);
    const save = p.id==="year" ? `<span class="save">${T("save")} ${Math.round((1 - p.price/(monthly*12))*100)}%</span>` : "";
    b.innerHTML = (p.best?`<span class="badge">${T("best")}</span>`:"") +
      `<span class="ph"><h3>${T(p.key)}</h3><span class="rd" aria-hidden="true"></span></span>` +
      `<span class="price">${vnd(p.price)}<small>${T(per)}</small></span>` +
      `<span class="per">${p.days>1 ? fill("perDayAbout", { p: vnd(Math.round(p.price/p.days)) }) : "&nbsp;"} ${save}</span>` +
      `<span class="desc">${T("desc"+cap)}</span>` +
      `<span class="inc"><span>${CK}${T("inc1")}</span><span>${CK}${T("inc2")}</span><span>${CK}${T("inc3")}</span></span>` +
      `<span class="valid">${fill("valid", { n: p.days })}</span>`;
    b.addEventListener("click", () => { planId = p.id; renderPlans(); renderSum(); renderNext(); const c = box.querySelector("[aria-checked=true]"); c && c.focus({ preventScroll:true }); });
    box.appendChild(b);
  });
}
function renderNext(){ $("next").firstChild.textContent = T("toPay") + " " + vnd(plan().price); }
/* Hai bước: 1 = chọn gói, 2 = tài khoản + đơn hàng */
function go(n, push){
  $("s1").hidden = n !== 1; $("s2").hidden = n !== 2;
  $("st1").className = n === 1 ? "on" : "done"; $("st2").className = n === 2 ? "on" : "";
  $("st1").toggleAttribute("aria-current", n === 1); $("st2").toggleAttribute("aria-current", n === 2);
  if(n === 1) $("st1").setAttribute("aria-current", "step"); else $("st2").setAttribute("aria-current", "step");
  if(push) history.pushState({ s:n }, "");
  document.querySelector("main").scrollTop = 0;
  $("s" + n).focus({ preventScroll:true });
  fitSoon();
}
function renderCmp(){
  const ck = CK;
  const crown = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';
  const row = (l, a, b, icon) => `<tr><td>${T(l)}</td><td class="fr">${icon ? ck : ""}${a}</td><td class="pro">${ck}${b}</td></tr>`;
  $("cmp").innerHTML =
   `<thead><tr><th>${T("feat")}</th><th>${T("free")}</th><th class="pro">${crown}${T("pass")}</th></tr></thead><tbody>` +
   row("f1", T("f1a"), T("f1b")) + row("f2", T("f2a"), T("f2b")) +
   row("f3", "", "", true).replace(/<td class="pro">(.*?)<\/td>/, `<td class="pro">${ck}</td>`) +
   row("f5", T("f5a"), T("f5b")) + row("f6", T("f6a"), T("f6b")) + row("f7", T("f7a"), T("f7b")) + row("f8", T("f8a"), T("f8b")) + row("f4", T("f4v"), T("f4v"), false) + "</tbody>";
}
function renderMethods(){
  const box = $("methods"); box.textContent = "";
  METHODS.forEach(m => {
    const b = document.createElement("button");
    b.type="button"; b.className="m"; b.setAttribute("role","radio"); b.setAttribute("aria-checked", m.id===methodId);
    b.innerHTML = `<i style="background:${m.c}">${m.tag}</i><span>${m.name}</span>`;
    b.addEventListener("click", () => { methodId = m.id; renderMethods(); renderSum(); });
    box.appendChild(b);
  });
}
function expiryFor(p){
  const cur = getPass(), from = isActive(cur) ? new Date(cur.exp) : new Date();
  return addDays(from, p.days);
}
function renderSum(){
  const p = plan();
  $("sum").innerHTML =
   `<li class="hd"><span>Night Pass</span><span class="chip">${T(p.key)}</span></li>
    <li class="dur"><span>${T("dur")}</span><span>${p.days} ${T("days")}</span></li>
    <li><span>${T("expires")}</span><span>${fmtDate(expiryFor(p))}</span></li>
    <li class="pm"><span>${T("payWith")}</span><span><i style="background:${method().c}">${method().tag}</i>${method().name}</span></li>
    <li class="t"><span>${T("total")}</span><span>${vnd(p.price)}</span></li>`;
  $("buy").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span></span>';
  $("buy").lastChild.textContent = T(isActive(getPass()) ? "renew" : "buy") + " " + vnd(p.price);
}
function renderStatus(){
  const s = $("status"), p = getPass();
  if(!p){ s.className="status"; return; }
  s.className = "status on";
  s.style.borderColor = isActive(p) ? "var(--ok)" : "var(--warn)";
  if(!isActive(p)){ s.textContent = T("expired"); return; }
  s.textContent = T("active") + " " + fmtDate(p.exp);
  const ex = document.createElement("span"); ex.className = "ex"; ex.id = "stEx"; ex.textContent = T("extra"); s.appendChild(ex);
  loadDevices();
}
/* Số thiết bị đang dùng gói (GET /api/pass có sẵn; lỗi/mất mạng thì bỏ qua, không báo lỗi) */
let devQ = 0;
async function loadDevices(){
  const p = getPass(); if(!PAY_API || !p || !p.token || !isActive(p)) return;
  const my = ++devQ;
  try{
    const r = await fetch(PAY_API + "/pass", { headers: { Authorization: "Bearer " + p.token } });
    if(!r.ok || my !== devQ) return;
    const d = await r.json(), ex = $("stEx");
    if(d && d.devices && ex){ ex.textContent = fill("devices", d.devices) + " · " + T("extra"); fitSoon(); }
  }catch(e){}
}
function applyLang(){
  document.documentElement.lang = lang;
  $("steps").setAttribute("aria-label", T("stepsL"));
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T(e.dataset.t); });
  $("themeBtn").setAttribute("aria-label", lang==="vi"?"Sáng / Tối":"Light / Dark");
  document.title = T("title") + " · " + APP.brand;
  $("hName").textContent = APP.brand; $("fName").textContent = APP.brand;
  $("fHome").textContent = T("home"); $("restore").textContent = T("restore");
  const fm = $("fMail"); fm.href = "mailto:" + EMAIL; fm.textContent = T("contact");
  const fp = $("fPriv"); fp.href = PRIVACY_URL; fp.textContent = T("privacy");
  $("fTerms").textContent = lang === "vi" ? "Điều khoản" : "Terms";
  $("madeBy").textContent = "© " + new Date().getFullYear() + " " + APP.brand + ". " + T("rights");
  $("fine").innerHTML = esc(T("fine")) + ' <a href="terms.html" target="_blank" rel="noopener">' + esc(T("terms2")) + "</a>";
  renderPlans(); renderNext(); renderCmp(); renderMethods(); renderSum(); renderStatus();
  if(window.fitSoon) fitSoon();
}

/* ===== THANH TOÁN ===== */
const dlg = $("dlg"), body = $("dlgBody");
const openDlg = html => { body.innerHTML = html; const h = body.querySelector("h3"); if(h){ h.id = "dlgT"; dlg.setAttribute("aria-labelledby", "dlgT"); } if(!dlg.open) dlg.showModal(); };
const closeDlg = () => { if(dlg.open) dlg.close(); };
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

function activate(email, server){
  /* server = { exp (ms), plan, token } khi chạy thật; không có = DEMO */
  const p = plan(), exp = server ? new Date(server.exp) : expiryFor(p);
  store.set("pass", { plan: server ? server.plan : p.id, exp: exp.toISOString(), email, token: server ? server.token : undefined });
  renderStatus(); renderSum();
  openDlg(`<div class="ic" aria-hidden="true">👑</div><h3>${T("okTitle")}</h3><p>${T("okTxt")} <b>${fmtDate(exp)}</b></p>
    <div class="row"><button class="p" id="goPlay">${T("play")}</button></div>`);
  $("goPlay").onclick = () => { location.href = HOME; };
}
const api = async (path, opt = {}) => {
  const r = await fetch(PAY_API + path, { ...opt, headers: { "Content-Type": "application/json", ...(opt.headers||{}) } });
  let d = {}; try { d = await r.json(); } catch(e){}
  if(!r.ok) throw Object.assign(new Error(d.error || "http"), { status: r.status });
  return d;
};
let pollTimer = null, tickTimer = null;
const stopTimers = () => { clearInterval(pollTimer); clearInterval(tickTimer); };
dlg.addEventListener("close", stopTimers);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const errDlg = e => { openDlg(`<div class="ic" aria-hidden="true">⚠️</div><h3>${T(e && e.status === 429 ? "slow" : "err")}</h3><div class="row"><button class="p" id="x">${T("close")}</button></div>`); $("x").onclick = closeDlg; };

function showOrder(o, email){
  const row = (l, v, cp) => `<div class="kv"><span>${T(l)}</span><b>${esc(v)}</b>${cp ? `<button type="button" class="cp" data-c="${esc(v)}">${T("copy")}</button>` : ""}</div>`;
  openDlg(`<h3>${T("payTitle")}</h3><p class="mut">${T("scanTxt")}</p>
    <img class="qrimg" alt="QR" src="${esc(o.qr)}" width="220" height="220">
    ${o.bank.name ? row("bankL", o.bank.name) : ""}${row("accL", o.bank.account, 1)}${o.bank.holder ? row("holdL", o.bank.holder) : ""}
    ${row("amtL", String(o.amount), 1).replace(esc(String(o.amount)), esc(vnd(o.amount)))}${row("codeL", o.code, 1)}
    <p class="mut" style="font-size:12px">${T("keep")}</p>
    <p id="st" role="status" style="font-weight:700">${T("waiting")} <span id="left"></span></p>
    <div class="row"><button class="s" id="x">${T("cancel")}</button></div>`);
  $("x").onclick = closeDlg;
  const qi = body.querySelector(".qrimg"); if(qi) qi.onerror = () => qi.remove();   // không tải được ảnh QR: vẫn còn số tài khoản + nội dung để chuyển tay
  body.querySelectorAll(".cp").forEach(b => b.onclick = async () => { try{ await navigator.clipboard.writeText(b.dataset.c); b.textContent = T("copied"); setTimeout(()=>b.textContent=T("copy"),1200);}catch(e){} });
  const tick = () => { const s = Math.max(0, Math.round((o.expiresAt - Date.now())/1000)); $("left").textContent = T("left") + " " + Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
  tick(); tickTimer = setInterval(tick, 1000);
  const expired = () => { stopTimers(); openDlg(`<div class="ic" aria-hidden="true">⏳</div><h3>${T("orderExp")}</h3><div class="row"><button class="s" id="x">${T("close")}</button><button class="p" id="again">${T("again")}</button></div>`); $("x").onclick = closeDlg; $("again").onclick = startPay; };
  pollTimer = setInterval(async () => {
    try{
      const d = await api("/orders/" + o.orderId);
      if(d.status === "paid"){ stopTimers(); if(!d.token){ restoreStep1("paidOther"); } else activate(email, d); }   // token null: đơn đã được thiết bị khác nhận (hoặc chưa có khoá thiết bị) → khôi phục bằng email
      else if(d.status === "expired" || Date.now() > o.expiresAt + 60000) expired();
    }catch(e){ /* mạng chập chờn: thử lại ở lần poll sau */ }
  }, 3000);
}
async function startPay(){
  const email = $("email").value.trim(), er = $("emailErr");
  if(!validEmail(email)){ $("email").setAttribute("aria-invalid","true"); er.textContent = T("emailBad"); $("email").focus(); return; }
  $("email").removeAttribute("aria-invalid"); er.textContent = "";
  const p = plan(), m = method();

  if(PAY_API){
    /* Server tạo đơn + trả QR. Quyền lợi CHỈ được cấp khi server nhận webhook tiền về, client chỉ poll trạng thái. */
    $("buy").disabled = true;
    try{
      const o = await api("/orders", { method:"POST", body: JSON.stringify({ plan:p.id, method:m.id, email }) });
      showOrder(o, email);
    }catch(e){ errDlg(e); }
    finally{ $("buy").disabled = false; }
    return;
  }
  /* DEMO: không thu tiền thật, chỉ mô phỏng luồng */
  openDlg(`<h3>${T("payTitle")}</h3><div class="demo">${T("demo")}</div><div class="qr" aria-hidden="true"></div>
    <p><b>${vnd(p.price)}</b> ${T("via")} ${m.name}</p>
    <div class="row"><button class="s" id="x">${T("cancel")}</button><button class="p" id="ok">${T("paid")}</button></div>`);
  $("x").onclick = closeDlg;
  $("ok").onclick = () => activate(email);
}
$("buy").addEventListener("click", startPay);
$("next").addEventListener("click", () => go(2, true));
$("prev").addEventListener("click", () => { if(history.state && history.state.s === 2) history.back(); else go(1); });
addEventListener("popstate", () => go(history.state && history.state.s === 2 ? 2 : 1));
$("email").addEventListener("input", () => { $("email").removeAttribute("aria-invalid"); $("emailErr").textContent = ""; });

function restoreStep1(note){
  if(!PAY_API){ openDlg(`<h3>${T("rTitle")}</h3><p>${T("rNone")}</p><div class="row"><button class="p" id="x">${T("close")}</button></div>`); $("x").onclick = closeDlg; return; }
  openDlg(`<div class="ic" aria-hidden="true">🔑</div><h3>${T("rTitle")}</h3>${note ? `<p class="note" role="status">${T(note)}</p>` : ""}<p class="sub">${T("rEmail")}</p>
    <label class="fld" for="rE">Email</label><input id="rE" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="${esc($("email").value.trim())}">
    <p class="err" id="rErr" role="alert"></p><div class="row"><button class="s" id="x">${T("cancel")}</button><button class="p" id="go">${T("rSend")}</button></div>`);
  $("x").onclick = closeDlg;
  $("rE").addEventListener("keydown", e => { if(e.key === "Enter") $("go").click(); });
  $("go").onclick = async () => {
    const email = $("rE").value.trim();
    if(!validEmail(email)){ $("rErr").textContent = T("emailBad"); return; }
    $("go").disabled = true;
    try{ await api("/restore", { method:"POST", body: JSON.stringify({ email }) }); restoreStep2(email); }
    catch(e){ errDlg(e); }
  };
}
function restoreStep2(email){
  openDlg(`<div class="ic" aria-hidden="true">✉️</div><h3>${T("rTitle")}</h3><p class="sub">${T("rSent")}</p>
    <label class="fld" for="rO">${T("rCode")}</label><input id="rO" class="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"><p class="err" id="rErr" role="alert"></p>
    <div class="row"><button class="s" id="x">${T("cancel")}</button><button class="p" id="go">${T("rOk")}</button></div>`);
  $("x").onclick = closeDlg;
  const otp = $("rO"); otp.addEventListener("input", () => { otp.value = otp.value.replace(/\D/g, "").slice(0, 6); $("rErr").textContent = ""; });
  otp.addEventListener("keydown", e => { if(e.key === "Enter") $("go").click(); });
  $("go").onclick = async () => {
    if($("go").disabled) return;
    $("go").disabled = true;
    try{
      const d = await api("/restore/verify", { method:"POST", body: JSON.stringify({ email, otp: $("rO").value.trim() }) });
      if(!d.active || !d.token){ $("rErr").textContent = T("rNo"); $("go").disabled = false; return; }
      store.set("pass", { plan: d.plan, exp: new Date(d.exp).toISOString(), email, token: d.token });
      renderStatus(); renderSum(); closeDlg();
    }catch(e){ if(e.status === 429) errDlg(e); else { $("rErr").textContent = T(e.status ? "rBad" : "err"); $("go").disabled = false; } }
  };
}
$("restore").addEventListener("click", () => restoreStep1());
$("restore2").addEventListener("click", () => restoreStep1());
if(location.hash === "#restore") setTimeout(() => restoreStep1(), 0);   // từ banner "Khôi phục Night Pass" (shared/inapp.js)
dlg.addEventListener("click", e => { if(e.target === dlg) closeDlg(); });

/* ===== NGÔN NGỮ + THEME ===== */
const menu = $("langMenu");
for(const k in i18n){
  const b = document.createElement("button");
  b.type = "button"; b.dataset.l = k; b.textContent = k.toUpperCase(); b.title = i18n[k].name; b.lang = k; b.setAttribute("aria-pressed", String(k === (typeof lang !== "undefined" ? lang : "")));
  b.addEventListener("click", () => { setLang(k, true); });
  menu.appendChild(b);
}
function setLang(l, save){
  lang = l;
  if(save) try{ localStorage.setItem("lang", l); }catch(e){}
  applyLang();
  menu.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  document.querySelector("meta[name=theme-color]").content = APP.color[t];
  try{ localStorage.setItem("theme", t); }catch(e){}
}
$("themeBtn").addEventListener("click", () => setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
document.querySelectorAll("[data-logo]").forEach(e => { e.innerHTML = APP.logo; });
["back","navHome","fHome"].forEach(id => { $(id).href = HOME; });
document.querySelector("meta[name=theme-color]").content = APP.color[document.documentElement.dataset.theme];
const ps = new URLSearchParams(location.search).get("plan");
if(ps && PLANS.some(p => p.id === ps)) planId = ps;
const em = (getPass()||{}).email; if(em) $("email").value = em;
setLang(lang);
try{ history.replaceState(null, ""); }catch(e){}   // tải lại ở bước 2: trạng thái cũ {s:2} còn trong lịch sử làm nút "Đổi gói" kẹt ở bước 2

/* Bàn phím ảo (iOS/Android): hộp thoại bám theo vùng nhìn thấy, ô nhập đang gõ luôn nằm trong tầm mắt */
if(window.visualViewport){
  const vv = visualViewport, upd = () => {
    const r = document.documentElement.style; r.setProperty("--vvh", vv.height + "px"); r.setProperty("--vvt", vv.offsetTop + "px");
    dlg.classList.toggle("kb", vv.height < innerHeight * .8);
  };
  vv.addEventListener("resize", upd); vv.addEventListener("scroll", upd);
}
document.addEventListener("focusin", e => { if(e.target.matches && e.target.matches("input")) setTimeout(() => { try{ e.target.scrollIntoView({ block:"center" }); }catch(_){} }, 300); });

/* Không cuộn: tăng mức thu gọn (0→4) cho tới khi nội dung vừa khung nhìn */
let densQ = 0;
function fitDensity(){
  const m = document.querySelector("main"), de = document.documentElement;
  for(let d = 0; d <= 4; d++){ de.dataset.dens = d; if(m.scrollHeight <= m.clientHeight + 1) return; }
}
var fitSoon = () => { cancelAnimationFrame(densQ); densQ = requestAnimationFrame(fitDensity); };
addEventListener("resize", fitSoon);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitSoon);
fitDensity();

/* Hạn chế DevTools: xem shared/guard.js */
</script>
