<!doctype html>
<html lang="vi" data-app="hub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Hạn chế Developer</title>
<script>
try{var t=localStorage.getItem("theme")}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
(function(){var q=new URLSearchParams(location.search).get("lang"),s=null;try{s=localStorage.getItem("lang")}catch(e){}
var l=[q,s].find(function(x){return x==="vi"||x==="en"})||(/^vi/i.test(navigator.language||"")?"vi":"en");document.documentElement.lang=l;})();
</script>
<link rel="stylesheet" href="shared/theme.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100dvh;overflow:hidden}
main{width:min(440px,100%);text-align:center;background:var(--card);border-radius:26px;padding:30px 26px;box-shadow:var(--shadow)}
.ic{width:64px;height:64px;margin:0 auto 14px;display:block;color:var(--warn)}
h1{margin:0 0 8px;font-size:clamp(21px,5vw,26px);line-height:1.25}
p{margin:0 0 20px;color:var(--ink2);line-height:1.55;font-size:15.5px}
.row{display:flex;gap:10px}
a,button{flex:1;display:inline-flex;align-items:center;justify-content:center;height:48px;border-radius:14px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;border:0}
.p{background:var(--accent);color:var(--on-accent)}
.s{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main role="alert">
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></svg>
  <h1 id="h"></h1><p id="p"></p>
  <div class="row"><a class="s" id="home" href="index.html"></a><button class="p" id="re" type="button"></button></div>
</main>
<script src="shared/guard.js"></script>
<script>
const vi = document.documentElement.lang === "vi";
document.title = vi ? "Hạn chế Developer" : "Developer tools restricted";
document.getElementById("h").textContent = vi ? "Chế độ Developer bị hạn chế" : "Developer mode is restricted";
document.getElementById("p").textContent = vi
  ? "Chúng tôi phát hiện công cụ dành cho nhà phát triển đang mở. Vui lòng đóng chúng rồi tải lại trang để tiếp tục."
  : "We detected that developer tools are open. Please close them and reload the page to continue.";
document.getElementById("home").textContent = vi ? "Trang chủ" : "Home";
document.getElementById("re").textContent = vi ? "Tải lại trang" : "Reload page";
/* quay lại đúng trang đang xem (chỉ nhận đường dẫn tương đối, an toàn) */
const from = new URLSearchParams(location.search).get("from") || "";
const ok = /^\/[\w\-./]*(\?[\w\-./=&%]*)?$/.test(from) && !from.startsWith("//") && !/restricted\.html/.test(from);
document.getElementById("re").addEventListener("click", () => { location.href = ok ? from : "index.html"; });
</script>
<script src="shared/updated.js"></script>
</body>
</html>
