*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer}

.nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.2px}
.mark svg{width:34px;height:34px}
a.mark{min-height:44px;text-decoration:none;color:inherit}a.mark:hover span{text-decoration:underline}
.tools{position:relative;display:flex;gap:10px;align-items:center}
.ico{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap;box-shadow:var(--shadow)}
.pill svg{width:20px;height:20px;flex:none}

.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
#langMenu{position:absolute;top:54px;right:0;min-width:150px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:none;z-index:6}
#langMenu.on{display:block}
#langMenu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:none;font-size:16px;font-weight:600}
#langMenu button[aria-checked=true]{background:var(--ink);color:var(--bg)}

#langMenu{position:static;display:inline-flex;min-width:0;width:auto;padding:3px;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);top:auto;right:auto}
#langMenu button{display:inline-block;width:auto;height:38px;padding:0 14px;border-radius:19px;background:none;color:var(--muted);font-size:15px;font-weight:800;text-align:center}
#langMenu button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
@media (max-width:520px){#langMenu button{padding:0 11px;height:34px;font-size:14px}}

html,body{background:var(--bg)}body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 50% at 30% 40%,color-mix(in srgb,#7C5CFF 14%,transparent),transparent),radial-gradient(45% 40% at 85% 90%,color-mix(in srgb,#FF5A1F 10%,transparent),transparent)}
html[data-theme=dark] body::before{background:
 radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 14%,#FFE9A8,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 62%,#fff,transparent),radial-gradient(1px 1px at 24% 88%,#FFE9A8,transparent),radial-gradient(1px 1px at 60% 36%,#fff,transparent),radial-gradient(1px 1px at 5% 55%,#fff,transparent),radial-gradient(1.3px 1.3px at 66% 92%,#fff,transparent),
 radial-gradient(55% 55% at 32% 42%,rgba(124,92,255,.34),transparent),radial-gradient(40% 35% at 88% 100%,rgba(255,138,76,.16),transparent),linear-gradient(180deg,#12141F 0,#1A1640 55%,#12141F 100%)}
main{flex:1;min-height:0;display:flex;padding:0 16px;overflow:hidden}
.hubsys{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(8px,1.6dvh,18px);width:100%;max-width:1180px;margin:0 auto}
.orbwrap{flex:none;container-type:size;width:100%;height:min(43dvh,calc((100vw - 32px) * .8333),420px);display:grid;place-items:center}
.hubsys .orbstage{width:min(100cqw,120cqh);touch-action:none;border-radius:26px}
.hubsys .sat{touch-action:none}
html[data-theme=dark] .hubsys .orbstage{background:radial-gradient(circle at 50% 50%,rgba(124,92,255,.28),transparent 62%);border-color:rgba(124,92,255,.28);box-shadow:none}
.side{flex:none;width:100%;min-width:0;max-width:560px;display:grid;gap:clamp(6px,1.4dvh,14px);justify-items:center;text-align:center}
h1{margin:0;font-size:clamp(22px,min(6vw,3.8dvh),44px);line-height:1.1;letter-spacing:-.6px;font-weight:800}
.sub{margin:0;color:var(--ink2);font-size:clamp(14px,2dvh,17px);max-width:34em}
.resume{display:none;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);font-weight:700;font-size:14.5px;text-decoration:none}
.resume.on{display:inline-flex}.resume b{font-weight:800}.resume .ri{font-size:20px;line-height:1}
.doors{display:grid;gap:10px;width:100%;grid-template-columns:1fr}
.world{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px 8px 10px;border-radius:20px;text-decoration:none;color:#fff;box-shadow:var(--shadow);text-align:left;transition:transform .2s,box-shadow .2s}
.world.pop{background:linear-gradient(135deg,#B83A09,#C2410C)}
.world.night{background:linear-gradient(135deg,#3B2A9E,#5B3FD6)}
.world .di{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:23px;line-height:1;background:rgba(255,255,255,.2)}
.world .dt{display:grid;gap:1px;min-width:0;flex:1}
.world .tag{font-size:12px;font-weight:700;letter-spacing:.03em;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.world h2{margin:0;font-size:20px;line-height:1.15;font-weight:800}

.world .go{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;background:#fff;font-weight:800;font-size:15px;color:#1F1B18;white-space:nowrap}

.world.on{transform:scale(1.03);z-index:2;outline:3px solid #fff;outline-offset:-3px}
.world.pop.on{box-shadow:0 0 0 3px #FF8A55,0 12px 36px rgba(255,90,31,.5)}
.world.night.on{box-shadow:0 0 0 3px #A18BFF,0 12px 36px rgba(124,92,255,.55)}

.foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:4px 18px;flex-wrap:wrap;padding:8px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--hero1,transparent))}
.foot #copy{order:1}.foot nav{order:2}.foot .site-upd{order:3;flex:none;width:auto;margin-left:auto;padding:0;font-size:12px}
.foot nav{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.foot a{text-decoration:none;font-weight:600}.foot a:hover{color:var(--ink)}
/* Footer gọn khi các liên kết đã gom vào menu ⋯: chữ bản quyền + ngày cập nhật xếp dọc bên trái, nút ⋯ bên phải */
.foot:has(.bars-more){display:grid;grid-template-columns:1fr auto;align-items:center;justify-items:start;gap:0 12px;padding:6px 16px}
.foot:has(.bars-more) #copy{grid-column:1;grid-row:1;font-size:12.5px}
.foot:has(.bars-more) .site-upd{grid-column:1;grid-row:2;width:auto;margin:0;text-align:left;padding:0;font-size:11.5px}
.foot:has(.bars-more) .bars-more{grid-column:2;grid-row:1 / span 2;order:0}
@media (prefers-reduced-motion:reduce){.world,.go svg,.world .go svg{transition:none}.world.on{transform:none}}

       tNight:"For grown-ups", dNight:"Evening unwind games: cards, chess, puzzles and more.", gNight:"Enter Night Play",
       pass:"Night Pass", upgrade:"Night Pass: unlock all games", theme:"Light / Dark", lang:"Language", privacy:"Privacy", contact:"Contact", rights:"All rights reserved.", resume:"Continue:", stage:"Two game orbits: drag to spin, hover to pause", play:"Play " }
};
const $ = id => document.getElementById(id);
let lang = (() => {
  try{ const s = localStorage.getItem("lang"); if(s && i18n[s]) return s; }catch(e){}
  for(const l of (navigator.languages || [navigator.language || ""])){ const c = String(l).split("-")[0].toLowerCase(); if(i18n[c]) return c; }
  return "vi";
})();
function applyLang(){
  const t = i18n[lang];
  document.documentElement.lang = lang;
  ["h1","sub","tPop","dPop","gPop","tNight","dNight","gNight"].forEach(k => { $(k).textContent = t[k]; });
  { const at = lang === "vi" ? "Giới thiệu" : "About", ah = lang === "vi" ? "/?landing=1" : "/en/?landing=1";
    $("aboutTxt").textContent = at; $("about").textContent = at; $("aboutLink").href = ah; $("about").href = ah;
    $("aboutLink").setAttribute("aria-label", lang === "vi" ? "Giới thiệu Play Hub" : "About Play Hub"); }
  $("priv").textContent = t.privacy; $("terms").textContent = lang === "vi" ? "Điều khoản" : "Terms"; $("mail").textContent = t.contact;
  $("copy").textContent = "© " + new Date().getFullYear() + " Play Hub. " + t.rights;
  $("passBtn").href = "../subscribe.html?from=play/index.html&lang=" + lang; $("passBtn").lastChild.textContent = t.pass; $("passBtn").setAttribute("aria-label", t.upgrade);
  $("themeBtn").setAttribute("aria-label", t.theme);
  $("pass2").textContent = t.pass; $("pass2").href = $("passBtn").href;
  $("aPop").href = "../popplay/index.html"; $("aNight").href = "../cozyplay/index.html";
  /* quỹ đạo: nhãn game theo ngôn ngữ (nguồn tên = shared/multi-games.js), nhãn sân khấu + nút âm thanh */
  $("orbsys").setAttribute("data-lang", lang); $("stage").setAttribute("aria-label", t.stage);
  const MG = window.NPMultiGames;
  document.querySelectorAll("a.sat").forEach(a => { const id = (a.getAttribute("href").split("#")[1] || ""), g = MG && MG.get(id); if(g){ const n = g[lang] || g.vi; a.setAttribute("aria-label", t.play + n); a.title = n; } });
  { const sb = document.querySelector(".orbsnd"), on = sb.getAttribute("aria-pressed") === "true";
    sb.setAttribute("aria-label", lang === "vi" ? (on ? "Tắt âm thanh quỹ đạo" : "Bật âm thanh quỹ đạo") : (on ? "Turn orbit sound off" : "Turn orbit sound on")); }
  showResume();
  menu.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
}
const menu = $("langMenu");
for(const k in i18n){
  const b = document.createElement("button");
  b.type = "button"; b.dataset.l = k; b.textContent = k.toUpperCase(); b.title = i18n[k].name; b.lang = k; b.setAttribute("aria-pressed", String(k === (typeof lang !== "undefined" ? lang : "")));
  b.addEventListener("click", () => { lang = k; try{ localStorage.setItem("lang", k); }catch(e){} applyLang(); });
  menu.appendChild(b);
}
const THEME_COLOR = { light:"#F6F4F1", dark:"#12141F" };
function setTheme(t, save){
  document.documentElement.dataset.theme = t;
  document.querySelector("meta[name=theme-color]").content = THEME_COLOR[t];
  if(save) try{ localStorage.setItem("theme", t); }catch(e){}
}
$("themeBtn").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
setTheme(document.documentElement.dataset.theme);
/* Ván dở (np-resume:<id>, giữ 7 ngày): chip "Chơi tiếp" thay cho dòng phụ; nếu làm tràn màn hình thì ẩn đi (hub không bao giờ cuộn) */
function showResume(){
  const chip = $("resume"), MG = window.NPMultiGames; let best = null;
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i); if(!k || k.indexOf("np-resume:") !== 0) continue;
      const id = k.slice(10), g = MG && MG.get(id), r = JSON.parse(localStorage.getItem(k) || "null");
      if(!g || !r || !r.state || typeof r.state !== "object" || r.daily) continue;
      const age = Date.now() - r.ts; if(!(age >= 0 && age < 7 * 864e5)) continue;
      if(!best || r.ts > best.ts) best = { id, g, ts: r.ts };
    }
  }catch(e){}
  chip.classList.remove("on"); $("sub").hidden = false;
  if(!best) return;
  const t = i18n[lang];
  $("rtx").textContent = t.resume; $("rname").textContent = (best.g.icon || "") + " " + (best.g[lang] || best.g.vi);
  chip.href = "../" + best.g.portal + "/index.html#" + best.id; chip.classList.add("on");
  const m = document.querySelector("main");
  if(m.scrollHeight > m.clientHeight + 1){ chip.classList.remove("on"); }
}
addEventListener("resize", showResume);
applyLang();
</script>
