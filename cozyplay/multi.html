<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
#app{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column}
/* thanh trên (dọc/máy tính) hoặc cột bên trái (điện thoại ngang): ← | tên | khay thumbnail game tập trung đang chơi dở | + */
#rail{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px;min-height:60px;background:var(--panel);border-bottom:1px solid var(--line)}
.rb{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.rb.go{background:var(--accent);color:var(--on-accent);border-color:transparent}
#ttl{flex:none;font-weight:800;font-size:15px;white-space:nowrap}
#tray{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
.tc{flex:none;position:relative;width:52px;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:22px;padding:0}
.tc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tc .sc{position:absolute;left:0;right:0;bottom:0;background:rgba(10,8,25,.72);color:#fff;font:800 10px/14px system-ui;text-align:center}
.tc .pz{position:absolute;right:2px;top:1px;font-size:10px}
.tc.wide{width:auto;min-width:104px;max-width:150px;grid-template-columns:48px 1fr;justify-items:start;text-align:left;padding:0 8px 0 0}
.tc.wide .im{position:relative;width:48px;height:100%;display:grid;place-items:center}
.tc.wide .tx{min-width:0;font-size:11px;line-height:1.2;padding-left:2px;overflow:hidden}.tc.wide .tx b{display:block;font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
#more{flex:none;font-weight:800;font-size:12px;color:var(--muted)}
#perf{flex:none;font-size:12px;font-weight:800;color:var(--warn);display:none;max-width:120px;line-height:1.15}
#perf.on{display:block}
#grid{position:relative;flex:1;min-height:0;min-width:0;margin:6px;display:grid;gap:6px;overflow:hidden}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:700;padding:24px;line-height:1.4}
#empty[hidden]{display:none}
.fr{position:relative;min-width:0;min-height:0;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.fr.hid{display:none}
.fr.sel{box-shadow:0 0 0 3px var(--accent)}
.fr.po-open{z-index:5}
.fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0b18;display:block}
.mi,.hm{position:absolute;top:0;height:44px;min-width:44px;padding:0 9px;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.45;z-index:6;transition:opacity .15s}
.mi{right:0}.hm{left:0;z-index:9}
.hm[hidden]{display:none}
.hm:hover,.hm:focus-visible,.hm.on{opacity:1}
.bd{display:none;font:800 11px/18px system-ui;padding:0 6px;border-radius:9px;background:rgba(14,12,32,.72);color:#fff;border:1px solid rgba(255,255,255,.35);font-variant-numeric:tabular-nums;white-space:nowrap}.bd.on{display:block}
.fr.po-open .bd{display:none}
.mi i,.hm i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(14,12,32,.72);color:#fff;border:1px solid rgba(255,255,255,.35)}
.mi:hover,.mi:focus-visible,.fr.po-open .mi{opacity:1}
.mi svg,.hm svg{width:16px;height:16px}
#hp{position:absolute;z-index:10;left:6px;top:40px;width:min(230px,calc(100% - 12px));padding:10px;border-radius:16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);display:none;flex-direction:column;gap:8px}
#hp.on{display:flex}#hp .hr{display:flex;gap:8px}#hp .hr .rb{flex:1;border-radius:12px;width:auto}#hpTray{display:flex;flex-direction:column;gap:6px}#hpTray .tc.wide{width:100%;max-width:none}#hpPerf{font-size:12px;font-weight:800;color:var(--warn)}
.pn .sw{width:100%;margin-top:6px;min-height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;font-weight:700;font-size:12px;text-align:left}.pn .sw[hidden]{display:none}.pn .sw::after{content:"";flex:none;width:34px;height:20px;border-radius:99px;background:var(--line);box-shadow:inset 0 0 0 2px transparent}.pn .sw[aria-pressed=true]::after{background:var(--accent)}
body.bare #rail{display:none}
.pn{position:absolute;z-index:7;top:40px;right:6px;width:min(212px,calc(100% - 12px));padding:10px;border-radius:16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);display:none;font-size:13px}
.fr.po-open .pn{display:block}
.pn .pt{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}.pn .pt b{font-size:14px;line-height:1.15}.pn .pt span{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}
.pn .pr{display:flex;justify-content:space-between;padding:2px 0;color:var(--ink2)}.pn .pr b{color:var(--ink);font-variant-numeric:tabular-nums}
.pn .pb{display:flex;gap:6px;margin-top:8px}
.pn .pb button{flex:1;min-width:0;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.pn .pb button.x{background:var(--warn);color:#fff;border-color:transparent}
.pn .pb svg{width:20px;height:20px}
.po{position:absolute;inset:0;z-index:4;display:none;place-items:center;text-align:center;background:rgba(10,8,25,.55);color:#fff;font-weight:800;padding:20px;cursor:pointer;line-height:1.35}
.fr.paused .po{display:grid}
.cd{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:rgba(10,8,25,.55);color:#fff;font:900 min(34vmin,120px)/1 system-ui;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.fr.counting .cd{display:grid}
.ld{position:absolute;inset:0;z-index:3;display:grid;place-items:center;color:var(--muted);font-weight:700;background:var(--card);pointer-events:none}
.fr.ready .ld{display:none}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(6,5,16,.62);display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
#sheet[hidden]{display:none}
.sh{width:min(720px,100%);height:min(560px,100%);display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.sh header{flex:none;display:flex;align-items:center;gap:8px}.sh header h2{flex:1;margin:0;font-size:17px}
.chips{flex:none;display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:transparent}
#tiles{flex:1;min-height:0;display:grid;gap:8px;align-content:start}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;border-radius:14px;background:var(--card);border:2px solid transparent;text-align:center;min-height:0}
.tile .ti{font-size:26px;line-height:1}.tile b{font-size:12px;line-height:1.15;max-height:2.3em;overflow:hidden}.tile i{font-style:normal;font-size:10px;color:var(--muted);font-weight:700}
.tile[aria-pressed=true]{border-color:var(--accent)}
.tile[aria-pressed=true]::after{content:"✓";position:absolute;top:3px;right:6px;font-weight:900;color:var(--accent)}
.tile.open{opacity:.7}
.tile .tg{position:absolute;left:4px;top:2px;font-size:10px}
.sh footer{flex:none;display:flex;align-items:center;gap:8px}
#pg{flex:1;text-align:center;font-weight:800;color:var(--muted);font-size:13px}
.btn{min-height:44px;padding:0 18px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:800}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;max-width:min(92vw,420px);padding:8px 14px;border-radius:99px;background:rgba(20,18,30,.92);color:#fff;font:700 13px/1.3 system-ui;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}

#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}
#lock[hidden]{display:none}

/* điện thoại ngang / màn thấp: cột bên trái thay cho thanh trên (khung game cần chiều cao) */
body.side #app{flex-direction:row}
body.side #rail{flex-direction:column;border-bottom:0;border-right:1px solid var(--line);padding:6px;min-height:0;width:60px;justify-content:flex-start}
body.side #ttl{display:none}
body.side #tray{flex-direction:column;justify-content:flex-start;width:100%}
body.side .tc{width:46px;height:44px}
body.side #perf{max-width:50px;font-size:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      else { b.innerHTML = im + (sc != null ? '<span class="sc">' + sc + '</span>' : "") + (it.wasPlaying ? '<span class="pz">⏸</span>' : ""); }
      b.addEventListener("click", function () { closeHp(); switchTo(it); }); tr.appendChild(b);
    });
    if (list.length > shown.length) { var m = document.createElement("span"); m.id = "more"; m.textContent = "+" + (list.length - shown.length); tr.appendChild(m); }
  }

  /* ---------- chọn game (bảng chọn có phân trang, không cuộn) ---------- */
  var pool = function () { return M.ids().filter(function (id) { var g = M.get(id); return (ALL || (POP ? g.portal === "popplay" : g.portal === "cozyplay")) && prefs.off.indexOf(id) < 0; }); };
  function selFits(ids) {
    var par = ids.filter(function (i) { return M.flag(i).mode === "parallel"; }), foc = ids.filter(function (i) { return M.flag(i).mode === "focus"; });
    var slots = slotItems().filter(function (i) { return !(main && i === main && foc.length); });   /* khung chính sẽ bị thay */
    var list = slots.concat(par.map(function (i) { return { g: M.flag(i) }; })).concat(foc.length ? [{ g: M.flag(foc[0]) }] : []);
    return list.length <= CAP.slots && fits(list);
  }
  function openSheet() {
    closePanels(); sheetSel = []; page = 0; $("shT").textContent = t().pick; $("bStart").textContent = t().start; $("sheet").hidden = false;
    var box = $("flt"); box.textContent = "";
    [["all", t().all], ["parallel", t().par], ["focus", t().foc]].forEach(function (d) { var b = document.createElement("button"); b.type = "button"; b.textContent = d[1]; b.dataset.f = d[0]; b.setAttribute("aria-pressed", String(flt === d[0])); b.addEventListener("click", function () { flt = d[0]; page = 0; renderSheet(); }); box.appendChild(b); });
    renderSheet();
  }
  function closeSheet() { $("sheet").hidden = true; }
  function renderSheet() {
    $("flt").querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.f === flt)); });
    var ids = pool().filter(function (i) { return flt === "all" || M.flag(i).mode === flt; }), box = $("tiles"), r = box.getBoundingClientRect();
    var cols = Math.max(2, Math.floor((r.width + 8) / 112)), rows = Math.max(1, Math.floor((r.height + 8) / 92)), per = cols * rows, pages = Math.max(1, Math.ceil(ids.length / per));
    page = Math.min(page, pages - 1); box.style.gridTemplateColumns = "repeat(" + cols + ",1fr)"; box.style.gridAutoRows = "84px"; box.textContent = "";
    ids.slice(page * per, page * per + per).forEach(function (id) {
      var g = M.flag(id), b = document.createElement("button"), open = !!find(id); b.type = "button"; b.className = "tile" + (open ? " open" : ""); b.dataset.id = id;
      b.innerHTML = '<span class="ti"></span><b></b><i></i>'; b.querySelector(".ti").textContent = g.icon; b.querySelector("b").textContent = gname(id);
      b.querySelector("i").textContent = open ? t().open : g.mode === "parallel" ? t().parTag : t().focTag;
      if (ALL) { var tg = document.createElement("span"); tg.className = "tg"; tg.textContent = g.portal === "popplay" ? "Pop" : "Night"; b.appendChild(tg); }
      b.setAttribute("aria-pressed", String(sheetSel.indexOf(id) >= 0)); b.title = g.why;
      b.addEventListener("click", function () {
        if (open) { closeSheet(); var it = find(id); if (it.where === "tray") switchTo(it); else select(it); return; }
        var k = sheetSel.indexOf(id); if (k >= 0) sheetSel.splice(k, 1); else { var next = sheetSel.concat([id]); if (!selFits(next)) { toast(t().selMax); return; } sheetSel = next; }
        renderSheet();
      });
      box.appendChild(b);
    });
    $("pg").textContent = t().page + " " + (page + 1) + "/" + pages + (sheetSel.length ? " · " + t().sel + " " + sheetSel.length : "");
    $("pgPrev").disabled = page <= 0; $("pgNext").disabled = page >= pages - 1; $("bStart").disabled = !sheetSel.length;
  }
  async function startSelected() {
    var ids = sheetSel.slice(); closeSheet(); sheetSel = [];
    var par = ids.filter(function (i) { return M.flag(i).mode === "parallel"; }), foc = ids.filter(function (i) { return M.flag(i).mode === "focus"; });
    for (var i = 0; i < par.length; i++) await addOne(par[i]);
    if (foc.length) { await addOne(foc[0]); for (var j = 1; j < foc.length; j++) await addTray(foc[j]); }
    renderTray();
  }

  /* ---------- hết giờ / máy chậm ---------- */
  function showLock() { items.slice().forEach(function (it) { if (it.fr) it.fr.remove(); it.el.remove(); }); items = []; main = sel = null; closeSheet(); renderTray(); $("lkH").textContent = t().timeH; $("lkP").textContent = t().timeP; $("lkGo").textContent = t().home; $("lock").hidden = false; }
  setInterval(function () {
    if (document.hidden || !alive().length) return;
    if (today() !== day) { day = today(); usedSec = 0; }
    usedSec++; if (usedSec % 5 === 0) { try { localStorage.setItem("usage", JSON.stringify({ d: day, s: usedSec })); } catch (e) {} }
    if (isTimeUp()) { try { localStorage.setItem("usage", JSON.stringify({ d: day, s: usedSec })); } catch (e) {} showLock(); }
  }, 1000);
  /* đo thời gian khung hình của host: > 24ms kéo dài ~4 giây → tạm dừng khung phụ; < 20ms kéo dài ~8 giây → cho thêm khung lại (khung đã tạm dừng chờ người chơi bấm tiếp) */
  var bad = 0, good = 0;
  (function () {
    var last = performance.now(), ema = 16;
    function f(ts) {
      var dt = ts - last; last = ts; if (dt > 0 && dt < 500 && !document.hidden) ema = ema * 0.9 + dt * 0.1; var fake = forceSlow;
      if (ema > 24 || fake) { bad++; good = 0; } else { good++; bad = 0; }
      if (!slow && bad > 4 * 50) setSlow(true);
      if (slow && !forceSlow && good > 8 * 50) setSlow(false);
      requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
    window.__npPerfTick = function (n) { if (n) bad = 4 * 50 + 1; };
  })();
  function setSlow(on) {
    slow = on; bad = good = 0; $("perf").classList.toggle("on", on); $("perf").textContent = on ? t().slow : ""; $("hpPerf").textContent = on ? t().slow : ""; if (on) toast(t().slow);
    if (on) items.forEach(function (it) { if (it.where === "slot" && it !== sel && !it.userPaused) { it.autoPaused = true; sync(it); } });
  }

  /* ---------- khởi động ---------- */
  function applyText() {
    $("ttl").textContent = t().title; $("bBack").setAttribute("aria-label", t().back); $("bAdd").setAttribute("aria-label", t().add); $("bAdd").title = t().add; $("bBack").title = t().back; $("shX").setAttribute("aria-label", "×");
    document.title = t().title + " · " + (POP ? "Pop Play" : "Night Play");
  }
  function onResize() {
    document.body.classList.toggle("side", innerWidth > innerHeight && innerHeight <= 640);
    $("ttl").style.display = innerWidth < 520 && !document.body.classList.contains("side") ? "none" : "";
    layout(); renderTray(); if (!$("sheet").hidden) renderSheet();
  }
  $("bBack").addEventListener("click", function () { location.href = PORTAL_HOME; });
  $("hm").addEventListener("click", function (e) { e.stopPropagation(); var open = !$("hp").classList.contains("on"); closePanels(); if (open) { $("hp").classList.add("on"); $("hm").classList.add("on"); } });
  $("hHome").addEventListener("click", function () { location.href = PORTAL_HOME; }); $("hAdd").addEventListener("click", function () { closeHp(); openSheet(); });
  $("bAdd").addEventListener("click", openSheet); $("shX").addEventListener("click", closeSheet); $("bStart").addEventListener("click", startSelected);
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
  $("pgPrev").addEventListener("click", function () { page--; renderSheet(); }); $("pgNext").addEventListener("click", function () { page++; renderSheet(); });
  $("lkGo").addEventListener("click", function () { location.href = PORTAL_HOME; });
  grid.addEventListener("pointerdown", function (e) { if (!e.target.closest(".pn,.mi,#hp,#hm")) closePanels(); }, true);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (!$("sheet").hidden) closeSheet(); else closePanels(); return; } if (sel && sel.fr && !e.target.closest("button")) { try { sel.fr.contentWindow.focus(); } catch (x) {} } });
  try { new ResizeObserver(function () { clearTimeout(onResize.r); onResize.r = setTimeout(layout, 30); }).observe(grid); } catch (e) {}
  addEventListener("orientationchange", function () { setTimeout(onResize, 120); setTimeout(onResize, 450); });
  try { if (window.visualViewport) visualViewport.addEventListener("resize", function () { clearTimeout(onResize.t); onResize.t = setTimeout(onResize, 60); }); } catch (e) {}
  addEventListener("resize", function () { clearTimeout(onResize.t); onResize.t = setTimeout(onResize, 60); });
  addEventListener("pagehide", function () { items.forEach(function (it) { try { it.fr.contentWindow.NPResume.flush(); } catch (e) {} }); });
  /* API cho bài đo (scripts/cozygame/check-multi.js) và gỡ lỗi */
  window.NPMulti = { booted: false, caps: function () { return CAP; }, add: addOne, addTray: addTray, switchTo: function (id) { var it = find(id); return it ? switchTo(it) : null; }, select: function (id) { var it = find(id); if (it) select(it); },
    close: function (id) { var it = find(id); if (it) closeItem(it); }, evict: function (id) { var it = find(id); if (it && it.fr) evict(it); }, setSlow: setSlow, isSlow: function () { return slow; },
    items: function () { return items.map(function (i) { var r = i.el.getBoundingClientRect(); return { id: i.id, mode: i.mode, where: i.where, alive: !!i.fr, ready: i.ready, sel: sel === i, paused: !!(i.userPaused || i.autoPaused), sentPaused: i.sentPaused, saved: !!i.saved, hud: i.hud, thumb: !!i.thumb, counting: i.counting, rect: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)] }; }); },
    frame: function (id) { var it = find(id); return it && it.fr; }, alive: function () { return alive().length; }, main: function () { return main && main.id; }, plan: plan, overlaps: overlaps, fits: function (ids) { return fits(ids.map(function (i) { return { g: M.flag(i) }; })); } };
  applyText(); onResize();
  if (isTimeUp()) showLock();
  else {
    var pre = (Q.get("games") || "").split(",").filter(function (i) { return i && M.get(i); });
    if (pre.length) (async function () { for (var i = 0; i < pre.length; i++) { var g = M.flag(pre[i]); if (g.mode === "focus" && main) await addTray(pre[i]); else await addOne(pre[i]); } window.NPMulti.booted = true; })();
    else { openSheet(); window.NPMulti.booted = true; }
  }
})();
</script>
