<head>
<meta charset="utf-8">

<title>Sống Sót Đến Cuối Tháng</title>
<title>Đường Ray</title>
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
/* Sống Sót Đến Cuối Tháng — game Cozy Play. Luôn vừa một màn hình. */
:root{--bg:#FFF6DD;--panel:#ffffff;--ink:#33280f;--muted:#7a6a3a;--accent:#d97706;--on:#ffffff;--good:#2f9e44;--bad:#e03131;--line:#f0dba0;--pbg:linear-gradient(#ffe9a8,#fff9e6);--field:#fff4cc;--field2:#ffe59a;
 --display:"Bungee","Arial Black",system-ui,sans-serif;--body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme="dark"]{--bg:#1d1806;--panel:#2e2610;--ink:#fff3cc;--muted:#d9c47a;--accent:#ffb020;--on:#2a1c00;--good:#51cf66;--bad:#ff6b6b;--line:#4a3f1c;--pbg:linear-gradient(#3b3010,#1d1806);--field:#2a2209;--field2:#3a3012}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--body);color:var(--ink)}
body{display:flex;justify-content:center}
#play{position:relative;height:100dvh;width:min(100vw,62dvh,520px);container-type:size;overflow:hidden;background:var(--pbg);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.45}.deco i{position:absolute;font-style:normal;font-size:9cqw;animation:fl 9s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-3cqw) rotate(8deg)}}
.top{position:absolute;left:3cqw;right:3cqw;top:2.5cqw;height:9cqw;display:flex;align-items:center;gap:2cqw;z-index:3}
.top h1{margin:0;flex:1;font:400 4.8cqw/1.05 var(--display);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:9cqw;height:9cqw;min-width:36px;min-height:36px;border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent);border-radius:50%;background:var(--panel);color:var(--ink);font:800 3.6cqw var(--body);cursor:pointer;display:grid;place-items:center;box-shadow:0 .5cqw 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.ib:active{transform:translateY(.5cqw);box-shadow:none}
.scr{position:absolute;left:4cqw;right:4cqw;top:14cqw;bottom:3cqw;display:flex;flex-direction:column;gap:2.4cqw;z-index:2;justify-content:center}
.card{background:var(--panel);border:.5cqw solid var(--line);border-radius:4cqw;padding:2.6cqw;box-shadow:0 1.2cqw 0 rgba(0,0,0,.14)}
.btn{border:0;border-radius:99cqw;min-height:44px;padding:2.4cqw 5cqw;font:800 4.2cqw var(--body);background:var(--accent);color:var(--on);cursor:pointer;box-shadow:0 1cqw 0 rgba(0,0,0,.26)}
.btn.alt{background:var(--panel);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent);box-shadow:0 .6cqw 0 color-mix(in srgb,var(--ink) 18%,transparent)}.btn:active{transform:translateY(.6cqw)}
.row{display:flex;gap:2.2cqw;align-items:center;justify-content:center}.grow{flex:1}.mut{color:color-mix(in srgb,var(--ink) 68%,transparent);font-size:3.3cqw}
.chips{display:flex;gap:2cqw;justify-content:center;flex-wrap:wrap}.chip{background:var(--panel);border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:99cqw;padding:1.2cqw 3cqw;font-size:3.5cqw;font-weight:800}
.hero{text-align:center;font-size:18cqw;line-height:1.05}
.dbtn{display:flex;align-items:center;gap:3cqw;text-align:left;width:100%}.dbtn .n{font:400 7cqw var(--display)}
.tys{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}.fbox{display:flex;flex-direction:column;gap:1.4cqw;padding:2cqw;border:1.5px dashed color-mix(in srgb,var(--ink) 28%,transparent);border-radius:4cqw}.lvc{font:700 3cqw var(--body);color:var(--muted);text-align:center}.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw}.lv{border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);background:var(--panel);color:var(--ink);border-radius:3cqw;min-height:40px;font:800 3.2cqw var(--body);cursor:pointer}.lv.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.ty{position:relative;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);background:var(--panel);color:var(--ink);border-radius:3cqw;padding:1.6cqw .6cqw;font:800 2.6cqw var(--body);min-height:44px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.6cqw}.ty .e{display:block;font-size:6.8cqw;line-height:1.1}.ty .t{display:flex;align-items:center;justify-content:center;min-height:2.3em;line-height:1.15;overflow-wrap:anywhere}
.ty.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel));box-shadow:0 0 0 .5cqw color-mix(in srgb,var(--accent) 45%,transparent)}.ty.lock{opacity:.8}.ty.lock::after{content:'🔒';position:absolute;top:.4cqw;right:1cqw;font-size:3.4cqw}
/* ván chơi */
#game{gap:1.6cqw;justify-content:flex-start}
.stats{display:flex;gap:2cqw}.st{flex:1;background:var(--panel);border:.5cqw solid var(--line);border-radius:3cqw;padding:1cqw 2cqw;text-align:center}.st b{display:block;font:400 5.4cqw var(--display);color:var(--accent);line-height:1.1}.st span{font-size:2.8cqw;color:color-mix(in srgb,var(--ink) 65%,transparent);font-weight:800}
#cvw{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
canvas#cv{border-radius:3cqw;background:linear-gradient(var(--field),var(--field2));border:.5cqw solid var(--line);touch-action:none;display:block;box-shadow:0 1cqw 0 rgba(0,0,0,.14)}
.hint{text-align:center;margin:0;background:var(--panel);border:.5cqw solid var(--line);border-radius:99cqw;padding:1.2cqw 3.4cqw;justify-self:center;align-self:center;max-width:100%}
/* kết thúc */
.big{font:400 11cqw var(--display);color:var(--accent);text-align:center;line-height:1.1}.rk{text-align:center;font:800 4.6cqw var(--body)}
.hat{display:flex;gap:1.4cqw;justify-content:center;flex-wrap:wrap;font-size:7.4cqw;min-height:9cqw}
.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:7;display:flex;flex-direction:column;justify-content:center;gap:2.4cqw;padding:5cqw;text-align:center}
.ov h2{margin:0;font:400 6cqw var(--display);color:var(--accent)}.ov p{margin:0;font-size:3.9cqw;line-height:1.35}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}.skc{position:relative;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:3.4cqw;padding:2.2cqw;background:var(--panel);color:var(--ink);font:800 3.6cqw var(--body);cursor:pointer;min-height:44px}.skc.on{border-color:var(--accent)}.sk .skc{display:flex;align-items:center;gap:2.6cqw;text-align:left;padding:2cqw 2.6cqw}.sk .skc:last-child:nth-child(odd){grid-column:1/-1}.skc .e{font-size:9.5cqw;line-height:1;flex:none}.skc .sx{display:flex;flex-direction:column;gap:.9cqw;min-width:0}.skc .sx b{font:900 3.7cqw/1.15 var(--body)}.skc .sx small{font:700 2.7cqw/1.2 var(--body);opacity:.75}.skc.lock{opacity:.85}.skc.lock::after{content:'🔒';position:absolute;top:1.4cqw;right:2cqw;font-size:3.8cqw}
.near{margin:0;text-align:center;font:900 4cqw var(--body);color:var(--accent);padding:1.4cqw 3cqw;border-radius:99cqw;border:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}.btn.hot{animation:hotp 1s ease-in-out infinite}@keyframes hotp{50%{transform:scale(1.07);box-shadow:0 0 0 1.2cqw color-mix(in srgb,var(--accent) 30%,transparent)}}
.rule{position:absolute;left:50%;top:27%;transform:translateX(-50%);width:86%;max-width:420px;box-sizing:border-box;z-index:8;pointer-events:none;padding:2.6cqw 3.6cqw;border-radius:4cqw;border:1.5px solid color-mix(in srgb,var(--accent) 70%,transparent);background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);box-shadow:0 2cqw 6cqw rgba(0,0,0,.35);animation:ruleIn .3s ease-out}.rule h3{margin:0 0 1.4cqw;font:900 4.2cqw var(--body);color:var(--accent)}.rule p{margin:.8cqw 0 0;font:700 3.3cqw/1.35 var(--body)}.rule.out{opacity:0;transition:opacity .35s}@keyframes ruleIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
.toast{position:absolute;left:50%;top:auto;bottom:15cqw;transform:translateX(-50%);background:color-mix(in srgb,var(--panel) 94%,transparent);color:var(--ink);border:.5cqw solid var(--accent);padding:2.2cqw 4cqw;border-radius:4cqw;font:800 3.6cqw/1.3 var(--body);z-index:9;width:max-content;max-width:88%;text-align:center;box-shadow:0 1.4cqw 5cqw rgba(0,0,0,.4),0 0 4cqw color-mix(in srgb,var(--accent) 35%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tgt{display:flex;align-items:center;gap:2cqw;background:var(--panel);border:.5cqw solid var(--line);border-radius:99cqw;padding:.8cqw 3cqw;font:800 3.2cqw var(--body)}.tgt i{flex:1;height:2.2cqw;border-radius:9cqw;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;font-style:normal}.tgt b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ff5a3d);transition:width .3s}.tgt.beat{border-color:var(--good);box-shadow:0 0 3cqw color-mix(in srgb,var(--good) 55%,transparent)}.tgt.beat b{background:var(--good)}
.st.pulse{animation:stp .35s ease-out}@keyframes stp{40%{transform:scale(1.18);border-color:var(--accent)}}
@container (max-height:640px){#hSub,#hNote{display:none}.hero{font-size:12cqw}.ty .e{font-size:6cqw}}
@container (max-height:520px){.hero{display:none}.hint{display:none}}
#bSkin{min-width:44px;min-height:44px}
.row>.btn.alt.grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:2.4cqw;padding-right:2.4cqw;font-size:min(3.9cqw,15px)}
#dS{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}.dbtn .grow{min-width:0}#dT{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%;vertical-align:top}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eb2{position:absolute;z-index:9;pointer-events:none;font-size:6.4cqw;line-height:1;font-style:normal;animation:eb2 .9s ease-out forwards}@keyframes eb2{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt));opacity:0}}#play.pro .stats .st{border-color:var(--accent);box-shadow:0 0 3cqw color-mix(in srgb,var(--accent) 35%,transparent)}@media (prefers-reduced-motion:reduce){.eb2{display:none}}
/* Dễ dùng trên web: con trỏ tay, rê chuột nổi nút, viền rõ khi bấm Tab */
.btn,.ib,.ty,.lv,.skc,.opt,button{cursor:pointer}.btn:disabled,button:disabled{cursor:default}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-.4cqw)}.btn.alt:not(:disabled):hover{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}.ib:hover,.ty:hover,.skc:hover,.lv:hover{border-color:var(--accent);filter:brightness(1.06)}}
.btn:focus-visible,.ib:focus-visible,.ty:focus-visible,.lv:focus-visible,.skc:focus-visible,button:focus-visible{outline:.7cqw solid var(--accent);outline-offset:.5cqw}

/* màn kết thúc: thẻ kết quả nổi bật theo màu giao diện, nút chia sẻ lớn, nút phụ có chữ */
#end .res{text-align:center;position:relative;overflow:hidden;border:0;padding:6cqw 3cqw 5cqw;border-radius:6cqw;color:#fff;background:radial-gradient(120% 90% at 50% -10%,color-mix(in srgb,var(--accent) 80%,#fff) 0,transparent 55%),linear-gradient(160deg,color-mix(in srgb,var(--accent) 62%,#14141f),color-mix(in srgb,var(--accent) 34%,#14141f));box-shadow:0 1.6cqw 0 rgba(0,0,0,.28),0 0 7cqw color-mix(in srgb,var(--accent) 38%,transparent)}
#end .res::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 18deg);pointer-events:none}
#end .res>*{position:relative}
#end .res .mut{color:rgba(255,255,255,.88);font:800 4.2cqw var(--body);letter-spacing:.02em}
#end .res .big{color:#fff;font-size:21cqw;line-height:1.02;margin:1.2cqw 0 2.2cqw;text-shadow:0 .8cqw 0 rgba(0,0,0,.28),0 0 5cqw color-mix(in srgb,var(--accent) 70%,transparent);animation:endPop .6s cubic-bezier(.2,1.4,.4,1) both}
#end .res .rk{display:inline-block;padding:1.4cqw 5cqw;border-radius:99cqw;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.45);color:#fff;font:800 4.6cqw var(--body)}
@keyframes endPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#end .res .big{animation:none}}
#end .hat{display:none}
#end .chips{gap:2cqw}#end .chip{font-weight:800;padding:1.6cqw 3.4cqw}
#end>.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(17cqw,1fr));gap:2.4cqw}
#end>.row #bShare{grid-column:1/-1;min-height:14cqw;font-size:5cqw;border-radius:99cqw;animation:endGlow 2.4s ease-in-out infinite}
@keyframes endGlow{50%{box-shadow:0 1cqw 0 rgba(0,0,0,.26),0 0 5cqw color-mix(in srgb,var(--accent) 65%,transparent)}}
@media (prefers-reduced-motion:reduce){#end>.row #bShare{animation:none}}
#end>.row .btn.alt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqw;padding:2.2cqw 1cqw;border-radius:4.4cqw;font-size:6cqw;line-height:1}
#end>.row .btn.alt::after{content:attr(data-l);font:800 max(10px,2.9cqw)/1.1 var(--body);letter-spacing:0;white-space:nowrap}

#sv{flex:1;min-height:0;display:flex;flex-direction:column;gap:2.4cqw;position:relative}
#svTop{display:flex;align-items:center;justify-content:space-between;gap:2cqw;font:800 3.6cqw var(--body)}
#svDay{font:400 5.4cqw var(--display);color:var(--accent)}
#svBars{flex:1;display:flex;flex-direction:column;gap:1.2cqw;max-width:56%}
.svb{height:3cqw;border-radius:9cqw;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden}.svb i{display:block;height:100%;width:50%;border-radius:9cqw;transition:width .35s}
#svM2{background:linear-gradient(90deg,#f59e0b,#22c55e)}#svS2{background:linear-gradient(90deg,#ef4444,#ec4899)}
#svCal{display:none}#svTimer{display:none;height:3cqw;border-radius:9cqw;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden}#svTimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f59e0b)}#svB3w{display:none}#svB3{background:linear-gradient(90deg,#6366f1,#22d3ee)}
#play[data-ty="2"] #svTimer{display:block}#play[data-ty="3"] #svB3w{display:block}#play[data-ty="1"] #svCard{border-color:#dc2626;box-shadow:0 0 0 1cqw color-mix(in srgb,#dc2626 22%,transparent),0 1.4cqw 0 rgba(0,0,0,.14)}#play[data-ty="2"] #svCard{border-style:dashed}
#svEnv{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;background:color-mix(in srgb,var(--panel) 90%,transparent);border-radius:4cqw;text-align:center}#svEnv h3{margin:0;font:800 5cqw var(--body);color:var(--accent)}#svEnv .row{display:flex;gap:3.4cqw}#svEnv button{font-size:19cqw;line-height:1;background:linear-gradient(#ef4444,#b91c1c);border:0;border-radius:3cqw;padding:3cqw 2.6cqw;cursor:pointer;box-shadow:0 1.2cqw 0 #7f1d1d}#svEnv button:hover{transform:translateY(-1cqw)}#svEnv button.open{background:#fff3c4;font:900 6cqw var(--body);color:#7a4a00;box-shadow:0 1.2cqw 0 #b45309}
#svCard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqw;text-align:center;background:var(--panel);border:.5cqw solid var(--line);border-radius:5cqw;padding:5cqw 4.4cqw;box-shadow:0 1.4cqw 0 rgba(0,0,0,.14);touch-action:pan-y;user-select:none;cursor:grab;position:relative;will-change:transform}
#svAv{font-size:20cqw;line-height:1}#svTxt{font:800 5.2cqw/1.3 var(--body)}#svTg{font:700 3cqw var(--body);color:var(--muted);min-height:4cqw}
#svBtns{display:flex;gap:2.4cqw}#svBtns .btn{flex:1;min-height:15cqw;font-size:4.1cqw;line-height:1.15;padding:2cqw 2.4cqw}
#svNo{background:var(--panel);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent)}
#svRes{min-height:6cqw;text-align:center;font:800 4.2cqw var(--body)}
.svfl{position:absolute;z-index:6;pointer-events:none;font:900 6.4cqw var(--body);left:50%;top:30%;transform:translateX(-50%);animation:svfl 1s ease-out forwards;text-shadow:0 .4cqw 0 rgba(0,0,0,.2)}.svfl.neg{color:var(--bad)}.svfl.pos{color:var(--good)}@keyframes svfl{to{transform:translate(-50%,-14cqw);opacity:0}}
#sv.lock #svBtns .btn{opacity:.55;pointer-events:none}
.pfx{position:absolute;left:50%;top:46%;width:14cqw;height:14cqw;margin:-7cqw 0 0 -7cqw;border-radius:50%;border:1.2cqw solid var(--accent);box-shadow:0 0 5cqw var(--accent),inset 0 0 4cqw var(--accent);pointer-events:none;z-index:9;animation:pfx .85s ease-out forwards}.pfx.b{animation-delay:.14s;border-color:#fff}@keyframes pfx{from{transform:scale(.2);opacity:.95}to{transform:scale(4.6);opacity:0}}#play.pglow::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:8;box-shadow:inset 0 0 14cqw var(--accent);animation:pgl .7s ease-out forwards}@keyframes pgl{from{opacity:1}to{opacity:0}}@media (prefers-reduced-motion:reduce){.pfx,#play.pglow::after{display:none}}
</style>

<body>
<div id="play">
  <div class="deco" id="deco"></div>
  <div class="top"><button class="ib" id="bBk" type="button" hidden aria-label="←">←</button><h1 id="ttl"></h1><button class="ib" id="bRe" type="button" hidden>↻</button><button class="ib" id="bBoard" type="button">🏆</button><button class="ib" id="bSnd" type="button">🔊</button><button class="ib" id="bLang" type="button"></button></div>
  <section class="scr" id="home">
    <div class="hero" id="hHero">💰📅</div>
    <p class="mut" id="hSub" style="text-align:center;margin:0;font-size:3.6cqw"></p>
    <div class="tys" id="tys"></div>
    <button class="btn dbtn" id="bDaily" type="button"><span class="n" id="dN"></span><span class="grow"><b id="dT"></b><br><span id="dS" style="font-size:3.3cqw;opacity:.85"></span></span><span>▶</span></button>
    <div class="row"><button class="btn alt grow" id="bFree" type="button"></button><button class="ib" id="bSkin" type="button" style="width:12cqw;height:12cqw">🎨</button></div>
    <div class="chips" id="hChips"></div>
    <p class="mut" id="hNote" style="text-align:center;margin:0"></p>
