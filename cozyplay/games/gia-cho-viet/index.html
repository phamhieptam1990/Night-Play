*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}

body{display:flex;justify-content:center}

.top{position:absolute;left:3cqw;right:3cqw;top:2.5cqw;height:9cqw;display:flex;align-items:center;gap:2cqw;z-index:2}

.ib{width:9cqw;height:9cqw;min-width:36px;min-height:36px;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink);font:800 3.6cqw var(--body);cursor:pointer;display:grid;place-items:center}
.scr{position:absolute;left:4cqw;right:4cqw;top:14cqw;bottom:3cqw;display:flex;flex-direction:column;gap:2.4cqw;z-index:1}

.btn.alt{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink);box-shadow:none}.btn:active{transform:translateY(.6cqw)}
.big{font:400 9cqw var(--display);color:var(--accent)}
.row{display:flex;gap:2.4cqw;align-items:center;justify-content:center}.grow{flex:1}
.mut{color:var(--muted);font-size:3.4cqw}
/* trang chủ */
#home,#round,#end{justify-content:center}#home .hero{text-align:center;font-size:20cqw;line-height:1}
.dbtn{display:flex;align-items:center;gap:3cqw;text-align:left;width:100%}.dbtn .n{font:400 7cqw var(--display)}
/* vòng chơi */
.dots{display:flex;gap:2cqw;justify-content:center}.dots i{width:5cqw;height:5cqw;border-radius:50%;background:color-mix(in srgb,var(--ink) 1800%,transparent);display:grid;place-items:center;font-size:3cqw;font-style:normal}.dots i.on{background:var(--accent)}
.item{text-align:center;padding:3cqw}.item .em{font-size:22cqw;line-height:1.05}.item .nm{font:800 6.4cqw/1.15 var(--body)}.item .un{color:var(--muted);font-size:4cqw}
.price{text-align:center;font:400 10.5cqw var(--display);color:var(--accent);min-height:13cqw}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:11cqw;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3.2cqw;border-radius:9cqw;background:linear-gradient(90deg,var(--good),#ffd24a,var(--bad))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10cqw;height:10cqw;margin-top:-3.4cqw;border-radius:50%;background:#fff;border:1cqw solid var(--accent);box-shadow:0 .8cqw 0 rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:3.2cqw;border-radius:9cqw;background:linear-gradient(90deg,var(--good),#ffd24a,var(--bad))}
input[type=range]::-moz-range-thumb{width:8cqw;height:8cqw;border-radius:50%;background:#fff;border:1cqw solid var(--accent)}
.rng{display:flex;justify-content:space-between;color:var(--muted);font-size:3.2cqw;margin-top:-1cqw}
.rev{text-align:center}.rev .real{font:400 8cqw var(--display);color:var(--good)}.rev .pts{font:800 5.4cqw var(--body)}
.bar{height:3.4cqw;border-radius:9cqw;background:color-mix(in srgb,var(--ink) 1400%,transparent);overflow:hidden;margin-top:1.4cqw}.bar b{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}
/* kết thúc */
.sq{font-size:9cqw;letter-spacing:.8cqw;text-align:center}.rk{text-align:center;font:800 5cqw var(--body)}
.chips{display:flex;gap:2cqw;justify-content:center;flex-wrap:wrap}.chip{background:color-mix(in srgb,var(--ink) 1200%,transparent);border-radius:99cqw;padding:1.2cqw 3cqw;font-size:3.6cqw;font-weight:800}
/* lớp phủ */

.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:7;display:flex;flex-direction:column;justify-content:center;gap:2.6cqw;padding:5cqw;text-align:center}
.ov h2{margin:0;font:400 6cqw var(--display);color:var(--accent)}.ov .btn.alt,.ov .skc{background:var(--panel)}.ov p{margin:0;color:var(--ink);font-size:4cqw;line-height:1.35}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}.skc{position:relative;border:.5cqw solid var(--line);border-radius:3.4cqw;padding:2.4cqw;background:var(--panel);color:var(--ink);font:800 3.8cqw var(--body);cursor:pointer;min-height:44px}.skc.on{border-color:var(--accent)}.skc .e{font-size:9cqw;display:block}.skc.lock{opacity:.7}.skc.lock::after{content:"🔒";position:absolute;top:1.2cqw;right:2cqw;font-size:4cqw}
.toast{position:absolute;left:50%;bottom:6cqw;transform:translateX(-50%);background:#fff;color:#111;padding:2cqw 4cqw;border-radius:99cqw;font-weight:800;font-size:3.8cqw;z-index:9;white-space:nowrap}
@container (max-height:780px){.rv .rng{display:none}.rv .item .em{font-size:14cqw}}
@container (max-height:440px){.rng{display:none}.item .em{font-size:13cqw}.item .nm{font-size:5.4cqw}.price{font-size:8.5cqw;min-height:10cqw}.rev .real{font-size:6.6cqw}.rev .pts{font-size:4.4cqw}.scr{gap:1.6cqw}}
.ib{background:var(--panel);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent);box-shadow:0 .5cqw 0 color-mix(in srgb,var(--ink) 18%,transparent);font-weight:800}
.ib:active{transform:translateY(.5cqw);box-shadow:none}
.btn.alt{background:var(--panel);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent);box-shadow:0 .6cqw 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.chip,.hint{background:var(--panel);border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);color:var(--ink)}
.mut{color:color-mix(in srgb,var(--ink) 68%,transparent)}
.mod{border-color:color-mix(in srgb,var(--ink) 45%,transparent);background:var(--panel)}.mod.on{background:color-mix(in srgb,var(--accent) 30%,var(--panel));border-color:var(--accent)}
.cat,.opt,.skc{border-color:color-mix(in srgb,var(--ink) 40%,transparent)}.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel))}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/*sk-rows*/.sk .skc{display:flex;align-items:center;gap:2.6cqw;text-align:left;padding:2cqw 2.6cqw}.sk .skc:last-child:nth-child(odd){grid-column:1/-1}.sk .skc .e{font-size:9.5cqw;line-height:1;flex:none}
</style>
