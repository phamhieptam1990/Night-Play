<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đập Deadline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||"dark";</script>
<style>
/* Layout: one-screen arcade desk — scoreboard strip, 3×3 desk of pop-up sticky notes, stamp-smash feedback */
:root{
  /* Bảng màu lấy từ landing Night Play (sáng) */
  --bg:#F3F0FA; --desk:#E2DCF5; --slot:#D3CAEE; --line:#CFC6EA;
  --ink:#1C1833; --muted:#5E5780; --panel:#fff;
  --accent:#6A48F0; --on-accent:#fff;
  --note:#ffe25c; --note-hot:#ff8a5c;   /* giấy note vàng giữ nguyên cho dễ nhận biết */
  --stamp:#d7263d; --good:#12a150;      /* dấu XONG đỏ / cà phê xanh */
  --display:"Bungee", "Arial Black", system-ui, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0E1020; --desk:#171A30; --slot:#232748; --line:#2C3160;
  --ink:#ECEEFF; --muted:#9AA0C8; --panel:#1A1D36;
  --accent:#9B83FF; --on-accent:#0E0A24;
  --note:#f5d63d; --note-hot:#ff7a4a; --stamp:#ff4d5e; --good:#3ddc84;
  color-scheme:dark}

/* Bề rộng khu chơi: tối đa 560px, co lại theo chiều rộng và chiều cao màn hình để luôn vừa một màn và nằm giữa */
:root{--w:max(150px,min(560px,100vw - 32px,100dvh - 300px))}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}   /* một màn hình, không cuộn */
/* Canh giữa game theo cả chiều ngang lẫn dọc; chừa 76px trên/dưới cho nút Home và đồng hồ của trang chủ */
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:64px;padding-bottom:16px;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  -webkit-user-select:none;user-select:none}
.top{width:100%;max-width:var(--w);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,32px);margin:0;letter-spacing:.5px;line-height:1}
h1 span{color:var(--accent)}
.icon-btn{font:600 13px var(--body);background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.icon-btn:focus-visible,.cell:focus-visible,.big:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stats{width:100%;max-width:var(--w);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column}
.stat small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.timebar{width:100%;max-width:var(--w);height:8px;background:var(--slot);border-radius:99px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .2s linear}

.desk-wrap{position:relative;width:100%;max-width:var(--w);display:grid;grid-template-columns:minmax(0,1fr)}
.desk,.overlay{grid-area:1/1}
.desk{background:var(--desk);border:2px solid var(--line);border-radius:22px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:100%;box-sizing:border-box}
.cell::before{content:"";display:block;padding-top:100%}
.cell{position:relative;display:block;width:100%;background:var(--slot);border-radius:12px;overflow:hidden;border:none;padding:0;cursor:pointer;touch-action:manipulation}
.cell::after{content:"";position:absolute;left:10%;right:10%;bottom:8%;height:10%;background:rgba(0,0,0,.12);border-radius:50%}
.note{position:absolute;top:8%;right:8%;bottom:8%;left:8%;border-radius:4px;background:var(--note);color:#1d2a36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:6px;box-shadow:0 6px 0 rgba(0,0,0,.18);transform:translateY(115%) rotate(-3deg);transition:transform .14s ease-out;z-index:1}
.note.up{transform:translateY(0) rotate(-3deg)}
.note .ico{font-size:36px;font-size:clamp(26px,9vw,46px);line-height:1}
.note .lbl{font-weight:800;font-size:13px;font-size:clamp(11px,3.2vw,15px);line-height:1.15;margin-top:4px}
.note.hot{background:var(--note-hot)}
.note.coffee{background:#fff;border:3px dashed var(--good)}
.note.coffee .lbl{color:#1b6b47}
.note.hit{transition:transform .18s ease-in;transform:translateY(115%) rotate(8deg) scale(.9)}
.stampmark{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.stampmark span{font-family:var(--display);color:var(--stamp);border:4px solid var(--stamp);border-radius:8px;padding:2px 8px;font-size:clamp(16px,5vw,26px);transform:rotate(-14deg) scale(1.6);opacity:0;animation:stamp .5s ease-out forwards;background:var(--panel);background:color-mix(in srgb,var(--panel) 70%,transparent)}
.stampmark.good span{color:var(--good);border-color:var(--good)}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(1.8)}25%{opacity:1;transform:rotate(-14deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-14deg) scale(1)}}
.float{position:absolute;font-family:var(--display);font-size:18px;pointer-events:none;z-index:3;animation:rise .8s ease-out forwards;color:var(--ink)}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
.desk[data-n="4"]{gap:8px;padding:10px}.desk[data-n="5"]{gap:6px;padding:8px}.desk[data-n="6"]{gap:5px;padding:7px}
.desk:not([data-n="3"]) .cell{border-radius:10px}
.desk[data-n="4"] .note .ico{font-size:calc(var(--w)*.1)}.desk[data-n="4"] .note .lbl{font-size:calc(var(--w)*.03);margin-top:2px}
.desk[data-n="5"] .note .ico{font-size:calc(var(--w)*.08)}.desk[data-n="6"] .note .ico{font-size:calc(var(--w)*.065)}
.desk[data-n="5"] .note .lbl,.desk[data-n="6"] .note .lbl{display:none}
.desk[data-n="4"] .note{padding:3px}.desk[data-n="5"] .note,.desk[data-n="6"] .note{padding:1px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.desk[data-n="5"] .stampmark span,.desk[data-n="6"] .stampmark span{font-size:calc(var(--w)*.04);padding:1px 4px;border-width:2px}
.chip.dim{opacity:.4}
.modebar.sm .chip{font-size:12px;padding:3px 9px;min-height:28px}
.desk.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.shout{min-height:24px;font-weight:800;font-size:16px;text-align:center;color:var(--accent)}

.overlay{position:relative;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;box-sizing:border-box;z-index:5;overflow:hidden;min-height:0}
.overlay h2{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(22px,6vw,30px);text-wrap:balance}
.overlay p{margin:0;max-width:36ch;line-height:1.5;color:var(--muted)}
.overlay .rank{font-family:var(--display);font-size:clamp(20px,6vw,28px);color:var(--accent)}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
.legend span{background:var(--panel);border:1.5px solid var(--line);border-radius:99px;padding:3px 10px}
.big{font-family:var(--display);font-size:20px;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 32px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.tip{font-size:13px;color:var(--muted)}
/* ===== Chọn chế độ / độ khó / giao diện (bản trả phí mở khóa bằng Night Pass) ===== */
.sel{font-size:12.5px;color:var(--muted);font-weight:600}
.sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:12px;background:rgba(8,9,20,.68);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet[hidden]{display:none}
.sheet-in{width:min(430px,100%);max-height:calc(100dvh - 24px);overflow:hidden;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--display);font-size:18px}
.sec small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--body);padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.lock{opacity:.75}.chip i{font-style:normal;font-size:11px}
.chip:focus-visible,.sh-f button:focus-visible,.pw-row a:focus-visible,.pw-row button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sdesc{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.sh-f{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.proNote{font-size:12.5px;color:var(--muted)}
.pw-in p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}.pw-in ul{margin:2px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.pw-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.pw-row a.big{font-size:16px;padding:10px 22px;text-decoration:none;display:inline-block}
@media (max-height:620px){.sdesc,.pw-in ul{display:none}.sheet-in{gap:6px;padding:10px 12px}.sec small{margin-bottom:3px}.chip{padding:5px 10px;min-height:32px}.pw-row a.big{padding:8px 18px}}
@media (max-height:420px){.sec small{display:none}.chip{font-size:12px;padding:4px 9px;min-height:28px}.sh-h{font-size:15px}}
.top .icon-btn{display:inline-flex;align-items:center;gap:4px;min-height:34px}
.probadge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font:700 11px/1.5 var(--body);letter-spacing:.04em;vertical-align:middle;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.modebar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0}.modebar .chip{font-size:12.5px;padding:5px 10px;min-height:32px}
.top .bl{display:none}
.top .icon-btn{white-space:nowrap}
@media (min-width:481px) and (max-aspect-ratio:11/10),(min-width:481px) and (min-height:521px){.top{justify-content:flex-end}.top h1{flex:1 0 100%}}   /* tiêu đề một dòng riêng, 4 nút nằm gọn một hàng ở mọi ngôn ngữ */
#pauseOv{display:flex;background:var(--bg)}#pauseOv[hidden]{display:none}   /* đặc: không nhìn lén bàn chơi khi tạm dừng */
@media (max-width:480px){.top{justify-content:flex-end}.top h1{flex:1 0 100%}.top .icon-btn{padding:4px 10px}}
/* ===== Luôn vừa một màn hình: thu gọn dần theo chiều cao ===== */
@media (max-height:760px){.overlay{gap:8px;padding:12px}.overlay .tip{display:none}.stat{padding:4px 10px}.stat b{font-size:21px}.shout{min-height:20px;font-size:15px}}
@media (max-height:640px){.overlay p{display:none}.overlay .legend span{padding:2px 8px;font-size:12px}.overlay .big{font-size:17px;padding:9px 26px}.overlay h2{font-size:clamp(18px,5vw,24px)}.overlay .rank{font-size:clamp(16px,5vw,22px)}}
@media (max-height:600px){body{gap:8px;padding-top:60px}.top h1{font-size:22px}.icon-btn{padding:4px 12px}.overlay .legend{display:none}.overlay{gap:6px}.stat small{font-size:10px}}
/* Xoay ngang (màn hình thấp): bàn chơi to nhất, nằm GIỮA; chữ/bảng điểm dạt hai bên và tự mờ đi khi đang chơi, sáng lại khi có điểm hoặc sắp hết giờ */
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:max(150px,min(100dvh - 16px,100vw - 260px))}
  body{display:grid;grid-template-columns:minmax(0,1fr) var(--w) minmax(0,1fr);grid-template-rows:1fr auto auto 1fr;column-gap:12px;row-gap:8px;padding:8px 12px;align-content:stretch;justify-items:stretch}
  .desk-wrap{grid-column:2;grid-row:1 / span 4;align-self:center;justify-self:center}
  .top{grid-column:1;grid-row:2;max-width:none;flex-direction:column;align-items:flex-start;gap:6px}
  .shout{grid-column:1;grid-row:3;text-align:left;min-height:18px;font-size:13px}
  .stats{grid-column:3;grid-row:2;max-width:none;grid-template-columns:1fr;gap:5px}
  .timebar{grid-column:3;grid-row:3;max-width:none;align-self:start}
  .top h1{font-size:17px;line-height:1.15}.icon-btn{padding:4px 10px;font-size:12px}.top .bl{display:none!important}
  .stat{flex-direction:row;align-items:baseline;justify-content:space-between;padding:3px 10px;border-radius:10px}.stat small{font-size:10px}.stat b{font-size:18px}
  .overlay p,.overlay .legend,.overlay .tip{display:none}.overlay h2{font-size:clamp(16px,3.6vh,22px)}.overlay .big{font-size:16px;padding:8px 22px}
  .top,.shout,.stats,.timebar{transition:opacity .45s ease}
  body.hud-dim .top,body.hud-dim .shout,body.hud-dim .stats,body.hud-dim .timebar{opacity:.18}
}
@media (prefers-reduced-motion: reduce){.note,.note.hit{transition:none}.desk.shake{animation:none}.float{animation-duration:.01s}}
</style>
</head>
<body>

<div class="top">
  <h1><span id="titleTxt"></span><span class="probadge" id="proBadge" hidden></span></h1>
  <button class="icon-btn" id="pauseBtn" type="button" hidden><span aria-hidden="true" id="pauseIco">⏸</span><span class="bl" id="pauseTxt"></span></button>
  <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true"><span aria-hidden="true" id="soundIco">🔊</span><span class="bl" id="soundTxt"></span></button>
  <button class="icon-btn" id="setupBtn" type="button" aria-haspopup="dialog"><span aria-hidden="true">⚙</span><span class="bl" id="setupTxt"></span></button>
  <button class="icon-btn" id="langBtn" type="button"><span aria-hidden="true">🌐</span> <span id="langTxt">VI</span></button>
</div>

<div class="stats">
  <div class="stat"><small data-i="score"></small><b id="score">0</b></div>
  <div class="stat"><small data-i="combo"></small><b id="combo">×0</b></div>
  <div class="stat"><small id="timeLbl"></small><b id="time">45s</b></div>
</div>
<div class="timebar"><i id="bar"></i></div>

<div class="desk-wrap">
  <div class="desk" id="desk"></div>
  <div class="overlay" id="overlay"></div>
  <div class="overlay" id="pauseOv" hidden role="dialog" aria-labelledby="pauseT"><h2 id="pauseT"></h2><p id="pauseP"></p><button class="big" id="resumeBtn" type="button"></button></div>
</div>
<div class="shout" id="shout" aria-live="polite"></div>

<div class="sheet" id="setup" hidden role="dialog" aria-modal="true" aria-labelledby="setupT">
  <div class="sheet-in">
    <div class="sh-h"><span id="setupT" data-i="setup.t"></span><button class="icon-btn" id="setupX" type="button">✕</button></div>
    <div class="sec"><small data-i="setup.mode"></small><div class="chips" id="chipModes"></div><p class="sdesc" id="modeDesc"></p></div>
    <div class="sec"><small data-i="setup.diff"></small><div class="chips" id="chipDiffs"></div></div>
    <div class="sec"><small data-i="setup.skin"></small><div class="chips" id="chipSkins"></div></div>
    <div class="sec"><small data-i="setup.grid"></small><div class="chips" id="chipGrids"></div></div>
    <div class="sh-f"><button class="icon-btn" id="statsBtn" type="button"></button><span class="proNote" id="proNote"></span></div>
  </div>
</div>
<div class="sheet" id="statsP" hidden role="dialog" aria-modal="true" aria-labelledby="statsT">
  <div class="sheet-in">
    <div class="sh-h"><span id="statsT" data-i="stats.t"></span><button class="icon-btn" id="statsX" type="button">✕</button></div>
    <div id="statsBody"></div>
  </div>
</div>
<div class="sheet" id="pay" hidden role="dialog" aria-modal="true" aria-labelledby="payT">
  <div class="sheet-in pw-in">
    <div class="sh-h"><span id="payT"></span><button class="icon-btn" id="payX0" type="button">✕</button></div>
    <div id="payBody"></div>
  </div>
</div>

<script>
const PESTS=[
  {ico:"📧",lbl:"Email GẤP!!!",en:"URGENT email!!!",pts:10},
  {ico:"📅",lbl:"Họp 5 phút thôi",en:"Quick 5-min meeting",pts:10},
  {ico:"📞",lbl:"Sếp gọi",en:"Boss calling",pts:15,hot:true},
  {ico:"⏰",lbl:"Deadline hôm qua",en:"Deadline was yesterday",pts:20,hot:true},
  {ico:"📊",lbl:"Excel #REF!",en:"Excel #REF!",pts:10},
  {ico:"🖨️",lbl:"Máy in kẹt giấy",en:"Printer jam",pts:10},
  {ico:"💬",lbl:"\"Em ơi, tí nhé\"",en:"\"Got a sec?\"",pts:10},
  {ico:"🔁",lbl:"Sửa lần cuối (v7)",en:"Final edit (v7)",pts:15,hot:true},
  {ico:"🐌",lbl:"Wifi chập chờn",en:"Flaky wifi",pts:10},
  {ico:"📝",lbl:"Báo cáo tuần",en:"Weekly report",pts:10},
];
const COFFEE={ico:"☕",lbl:"Cà phê +3s",en:"Coffee +3s",coffee:true};
const SHOUTS={vi:["Gọn gàng!","Đóng dấu luôn!","Không cần họp lại!","Inbox zero!","Sếp duyệt rồi!","Chiến quá!","Xả stress thành công!"],en:["Clean!","Stamped it!","No meeting needed!","Inbox zero!","Boss approved!","Crushing it!","Stress relieved!"]};
const RANKS=[
  [0,"Thực tập sinh ngơ ngác","Mới khởi động thôi. Uống ngụm nước rồi thử lại nhé.","Confused intern","Just warming up. Sip some water and try again."],
  [150,"Nhân viên chăm chỉ","Bớt được vài cái deadline rồi đó.","Hard worker","You cleared a few deadlines."],
  [350,"Trưởng nhóm bình tĩnh","Phiền toái nào cũng xử gọn.","Calm team lead","Every hassle handled."],
  [600,"Chiến thần KPI","Văn phòng nên treo ảnh bạn ở sảnh.","KPI champion","The office should hang your photo in the lobby."],
  [900,"Huyền thoại tan làm đúng giờ","Không deadline nào sống sót.","Clock-out-on-time legend","No deadline survives."],
];
const ROUND=45;
/* ===== NGÔN NGỮ (vi / en): ?lang= → localStorage "lang" → ngôn ngữ trình duyệt ===== */
const I18N={vi:{
 title:'Đập <span>Deadline</span>',docTitle:"Đập Deadline",score:"Điểm",combo:"Combo",left:"Còn lại",sound:"Âm thanh",on:"Bật",off:"Tắt",modes:"Chế độ",pause:"Tạm dừng",resume:"Tiếp tục",lang:"Ngôn ngữ",close:"Đóng",
 pausedT:"Tạm dừng",pausedP:"Thời gian đang dừng. Nhấn Tiếp tục để chơi tiếp.",

function buildGrid(n){   /* dựng lại bàn chơi n×n ô (3 = miễn phí, 4–6 = Night Pass) */
  if(gridN===n)return;gridN=n;
  cells.forEach(c=>clearTimeout(c.timer));cells.length=0;desk.textContent="";
  desk.style.gridTemplateColumns="repeat("+n+",1fr)";desk.dataset.n=n;
for(let i=0;i<n*n;i++){
  const c=document.createElement("button");
  c.className="cell";c.id="cell"+i;c.setAttribute("aria-label",t("cell",{n:i+1}));

const DD={rnd:Math.random,modes:{},diffs:{},skins:{"default":{id:"default"}},grids:{g3:{id:"g3",n:3,mult:1,extra:0}},hooks:{},pro:null,sel:{mode:"classic",diff:"normal",skin:"default",grid:"g3"},want:null,baseThwack:null};

  tick(){timeLeft-=.1;if(timeLeft<=0){timeLeft=0;end()}},timeText:()=>Math.ceil(timeLeft)+"s",timeBar:()=>timeLeft/ROUND};

function audio(){if(!sound)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}}
function thwack(good){
  const a=audio();if(!a)return;const t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type=good?"triangle":"square";
  o.frequency.setValueAtTime(good?520:180+Math.min(combo,10)*25,t);
  o.frequency.exponentialRampToValueAtTime(good?980:60,t+.12);
  g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.17);
  // short noise burst for the "stamp" thud
  const len=a.sampleRate*.06,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);

}

function show(st,item,stay){
  st.item=item;st.up=true;
  st.note.className="note"+(item.hot?" hot":"")+(item.coffee?" coffee":"");
  st.note.querySelector(".ico").textContent=item.ico;
  st.note.querySelector(".lbl").textContent=(LANG==="en"&&item.en)||item.lbl;
  void st.note.offsetWidth;st.note.classList.add("up");
  clearTimeout(st.timer);
  st.timer=setTimeout(()=>{ if(st.up){ hide(st); if(!item.coffee&&!paused){combo=0;render();mode.onMiss&&mode.onMiss(item)} } },stay);
}
function hide(st){st.up=false;st.item=null;st.note.classList.remove("up")}

function spawn(){
  if(!running)return;
  const free=cells.filter(c=>!c.up),R=DD.rnd;
  const progress=Math.min(1,mode.progress());            // càng chơi càng nhanh
  if(free.length){
    const st=free[Math.floor(R()*free.length)];
    const item=mode.pick?mode.pick(R,progress):(R()<mode.coffeeP?COFFEE:PESTS[Math.floor(R()*PESTS.length)]);
    show(st,item,mode.stay(progress)*diff.stay);
    if(free.length>1&&R()<mode.dbl(progress)){
      const st2=free.filter(c=>c!==st)[Math.floor(R()*(free.length-1))];
      show(st2,PESTS[Math.floor(R()*PESTS.length)],mode.stay2(progress)*diff.stay);
    }
  }
  for(let k=0;k<(grid.extra|0);k++){   /* lưới lớn: thêm giấy nổi cùng lúc */
    const fr=cells.filter(c=>!c.up);if(fr.length>1&&R()<.55)show(fr[Math.floor(R()*fr.length)],PESTS[Math.floor(R()*PESTS.length)],mode.stay2(progress)*diff.stay);
  }
  spawnT=setTimeout(spawn,mode.gap(progress)*diff.gap);
}

function hit(st,e){
  if(!running||paused)return;
  if(!st.up){combo=0;render();buzz();desk.classList.remove("shake");void desk.offsetWidth;desk.classList.add("shake");return}
  const item=st.item;clearTimeout(st.timer);
  st.up=false;st.note.classList.add("hit");
  setTimeout(()=>{st.note.classList.remove("hit");if(!st.up)st.note.classList.remove("up")},180);
  const mark=document.createElement("div");mark.className="stampmark"+(item.coffee?" good":"");
  mark.innerHTML="<span>"+(item.coffee?(mv(mode.coffeeText)||"+3S"):t("done"))+"</span>";st.el.appendChild(mark);setTimeout(()=>mark.remove(),520);
  let gained=0;

  else{
    const now=performance.now();combo=(now-lastHit<1400)?combo+1:1;lastHit=now;best=Math.max(best,combo);
    gained=Math.round(item.pts*(1+Math.floor(combo/5))*diff.score*(grid.mult||1));score+=gained;thwack(false);hudPulse(1600);
    if(combo>0&&combo%5===0)say("Combo ×"+combo+"! "+SHOUTS[LANG][Math.floor(Math.random()*SHOUTS[LANG].length)]);

  desk.parentElement.appendChild(f);setTimeout(()=>f.remove(),800);

  document.body.classList.remove("hud-dim"); clearTimeout(hudT);

function start(from){

    (helper?'':'<div class="modebar" id="modeBar" role="group" aria-label="'+t("setup.mode")+'"></div><div class="modebar sm" id="gridBar" role="group" aria-label="'+t("setup.grid")+'"></div>')+'<div class="sel" id="selLine"></div>'+(helper?'':'<button class="big" id="againBtn">'+t("end.again")+'</button>')+
    '<div class="tip"></div>';
  ov.querySelector("h2").textContent=mv(e.mode.title)||t("end.title");ov.querySelector(".rank").textContent=e.r[en?3:1];
  ov.querySelector(".desc").textContent=e.r[en?4:2]+(e.newRec?" "+t("end.newrec"):"")+(e.mode.endLine?" "+e.mode.endLine(e.score):"");
  ov.querySelector(".tip").textContent=helper?t("end.helper"):t("end.tip");
  ov.hidden=false;DD.refresh&&DD.refresh();
  const ab=$("againBtn");if(ab)ab.focus({preventScroll:true});
}
let resumeFrom=(window.NP&&NP.helper&&NP.initialState&&NP.initialState.timeLeft)?NP.initialState:null;
function renderStart(){
  const ov=$("overlay"),rf=resumeFrom;
  ov.innerHTML='<h2>'+(rf?t("resume.h"):t("start.h"))+'</h2><p>'+(rf?(rf.mode==="endless"?t("resume.pl",{l:rf.lives|0,n:rf.score|0}):t("resume.p",{s:Math.ceil(Math.min(ROUND,rf.timeLeft)),n:rf.score|0})):t("start.p"))+'</p>'+
    (rf?'<div class="legend"><span>'+t("leg1")+'</span><span>'+t("leg2")+'</span><span>'+t("leg3")+'</span><span>'+t("leg4")+'</span></div>':'<div class="modebar" id="modeBar" role="group" aria-label="'+t("setup.mode")+'"></div><div class="modebar sm" id="gridBar" role="group" aria-label="'+t("setup.grid")+'"></div>')+
    '<div class="sel" id="selLine"></div><button class="big" id="startBtn">'+(rf?t("resume.btn"):t("start.btn"))+'</button><div class="tip">'+(rf?"":t("start.tip"))+'</div>';
  if(rf){   /* thanh điểm / thời gian hiện đúng tiến trình bạn bè đã chơi, không phải 0 / 45s */
    $("score").textContent=rf.score|0;$("combo").textContent="×"+(rf.combo|0);
    if(rf.mode==="endless"){const l=Math.max(0,Math.min(5,rf.lives|0));$("time").textContent="♥".repeat(l)+"♡".repeat(Math.max(0,3-l))}
    else{const s=Math.min(ROUND,rf.timeLeft);$("time").textContent=Math.ceil(s)+"s";$("bar").style.transform="scaleX("+Math.max(0,Math.min(1,s/ROUND))+")"}
  }
  ovKind="start";DD.refresh&&DD.refresh();
}
let starting=false;
async function go(from){
  if(starting)return;starting=true;
  if(helperPro){try{await helperPro}catch(e){}}
  const m=(from&&from.timeLeft?DD.modes[from.mode]:DD.modes[DD.sel.mode])||DD.modes.classic,sb=$("startBtn");
  try{ if(m.prepare){ if(sb)sb.disabled=true; await m.prepare() } }
  catch(e){ say(t("dailyErr")); starting=false; if(sb)sb.disabled=false; return }
  starting=false;if(sb)sb.disabled=false;start(from);
}
$("overlay").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="startBtn"){const f=resumeFrom;resumeFrom=null;go(f)}else if(b.id==="againBtn")go(null)});
$("pauseBtn").addEventListener("click",()=>{if(paused&&pausedBy==="user")resumeRound("user");else pauseRound("user")});
$("resumeBtn").addEventListener("click",()=>resumeRound("user"));
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running&&!paused)pauseRound("user")});   /* rời tab / khoá màn hình: tự tạm dừng */
addEventListener("keydown",e=>{if((e.key==="p"||e.key==="P")&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&running&&[...document.querySelectorAll(".sheet")].every(x=>x.hidden)){if(paused&&pausedBy==="user")resumeRound("user");else pauseRound("user")}});
if(window.NP){
  NP.state(()=>{
    if(!running)return null;
    const sk=DD.sel.skin||"default",free=mode.id==="classic"&&diff.id==="normal"&&sk==="default"&&grid.id==="g3";
    if(!free&&!DD.ticket)return mode.id==="classic"&&diff.id==="normal"&&grid.id==="g3"?{score:score,combo:combo,best:best,timeLeft:Math.round(timeLeft*10)/10}:null;
    const st={score:score,combo:combo,best:best,timeLeft:mode.id==="endless"?ROUND:Math.round(timeLeft*10)/10};
    if(!free){st.mode=mode.id;st.diff=diff.id;st.skin=sk;st.grid=grid.id;st.tk=DD.ticket}   /* vé 24 giờ: bạn bè chơi tiếp đúng chế độ trả phí, không phải Night Pass */
    if(mode.snap)Object.assign(st,mode.snap());
    return st;
  });
  NP.onPause(()=>pauseRound("parent"),()=>resumeRound("parent"));
}
/* ===== Giao diện chọn chế độ, khóa Night Pass, tải mã bản trả phí ===== */
DD.catalog={
  modes:[{id:"classic",ico:"⏱️",free:1},{id:"endless",ico:"♾️"},{id:"daily",ico:"📅"},{id:"boss",ico:"👔"}],
  diffs:[{id:"easy"},{id:"normal",free:1},{id:"hard"},{id:"rage"}],
  skins:[{id:"default",free:1},{id:"cafe"},{id:"retro"}],
  grids:[{id:"g3",n:3,free:1},{id:"g4",n:4},{id:"g5",n:5},{id:"g6",n:6}]
};
const PFX={modes:"m.",diffs:"d.",skins:"s."};
const catName=(kind,x)=>kind==="grids"?x.n+"×"+x.n:t(PFX[kind]+x.id+(kind==="modes"?".name":""));
const catDesc=x=>t("m."+x.id+".desc");
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const escH=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const unlocked=(kind,id)=>{const c=DD.catalog[kind].find(x=>x.id===id);return !!(c&&c.free)||!!DD[kind][id]};
const KEY={modes:"mode",diffs:"diff",skins:"skin",grids:"grid"};
const passToken=()=>{try{const p=JSON.parse(localStorage.getItem("pass"));return p&&p.token}catch(e){return null}};
const track=(f,k)=>{try{fetch("/api/paywall",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({f,k}),keepalive:true}).catch(()=>{})}catch(e){}};
function applySkin(){const sk=DD.skins[DD.sel.skin]?DD.sel.skin:"default";if(sk==="default")delete document.documentElement.dataset.skin;else document.documentElement.dataset.skin=sk}
function openSheet(id){$(id).hidden=false;const f=$(id).querySelector("button,a");f&&f.focus({preventScroll:true})}
function closeSheet(id){$(id).hidden=true}
const gridForced=()=>{const m=DD.modes[DD.sel.mode];return m&&m.lockGrid||null};
function pickItem(kind,x){
  if(kind==="grids"&&gridForced()){say(t("gridLocked"));return}   /* Thử thách ngày luôn 3×3 */
  if(!unlocked(kind,x.id)){DD.paywall(kind==="modes"?x.id:kind==="diffs"?"diff":kind==="grids"?"grid":"skin");return}
  DD.want[KEY[kind]]=x.id;LS.set("dd-sel",DD.want);DD.refresh();
}
DD.refresh=function(){
  const w=DD.want||(DD.want=Object.assign({mode:"classic",diff:"normal",skin:"default"},LS.get("dd-sel",{})));
  for(const kind of ["modes","diffs","skins","grids"]){const k=KEY[kind];DD.sel[k]=unlocked(kind,w[k])?w[k]:(kind==="modes"?"classic":kind==="diffs"?"normal":kind==="grids"?"g3":"default")}
  applySkin();
  if(!running){const gm=DD.modes[DD.sel.mode],gn=(DD.grids[gm&&gm.lockGrid?gm.lockGrid:DD.sel.grid]||DD.grids.g3).n;if(!(window.NP&&NP.helper&&resumeFrom))buildGrid(gn)}   /* xem trước bàn chơi đã chọn */
  for(const kind of ["modes","diffs","skins","grids"]){
    const box=$({modes:"chipModes",diffs:"chipDiffs",skins:"chipSkins",grids:"chipGrids"}[kind]);box.textContent="";
    for(const x of DD.catalog[kind]){
      const fg=kind==="grids"&&gridForced(),lock=!unlocked(kind,x.id),on=fg?x.id===fg:DD.sel[KEY[kind]]===x.id,b=document.createElement("button");
      b.type="button";b.className="chip"+(on?" on":"")+(lock?" lock":"")+(fg&&!on?" dim":"");b.setAttribute("aria-pressed",on);
      b.innerHTML=(x.ico?x.ico+" ":"")+escH(catName(kind,x))+(lock?' <i aria-hidden="true">🔒</i>':"");
      if(lock)b.setAttribute("aria-label",t("lockedLbl",{n:catName(kind,x)}));
      b.onclick=()=>pickItem(kind,x);
      box.appendChild(b);
    }
  }
  const mb=$("modeBar");   /* thanh chế độ ngay trên màn hình bắt đầu / kết thúc */
  if(mb){mb.textContent="";for(const x of DD.catalog.modes){
    const lock=!unlocked("modes",x.id),on=DD.sel.mode===x.id,b=document.createElement("button");
    b.type="button";b.className="chip"+(on?" on":"")+(lock?" lock":"");b.setAttribute("aria-pressed",on);
    b.innerHTML=x.ico+" "+escH(catName("modes",x))+(lock?' <i aria-hidden="true">🔒</i>':"");
    if(lock)b.setAttribute("aria-label",t("lockedLbl",{n:catName("modes",x)}));
    b.onclick=()=>pickItem("modes",x);mb.appendChild(b);
  }}
  const gb=$("gridBar");   /* chọn cỡ bàn ngay trên màn bắt đầu / kết thúc */
  if(gb){gb.textContent="";for(const x of DD.catalog.grids){
    const fg=gridForced(),lock=!unlocked("grids",x.id),on=fg?x.id===fg:DD.sel.grid===x.id,b=document.createElement("button");
    b.type="button";b.className="chip"+(on?" on":"")+(lock?" lock":"")+(fg&&!on?" dim":"");b.setAttribute("aria-pressed",on);
    b.innerHTML=catName("grids",x)+(lock?' <i aria-hidden="true">🔒</i>':"");
    if(lock)b.setAttribute("aria-label",t("lockedLbl",{n:catName("grids",x)}));
    b.onclick=()=>pickItem("grids",x);gb.appendChild(b);
  }}
  const pb=$("proBadge");if(pb){pb.hidden=!DD.pro||!!DD.pro.helper;pb.textContent=DD.pro?(DD.pro.trial?"★ "+t("badge.trial"):"★ Night Pass"):""}
  const m=DD.catalog.modes.find(x=>x.id===DD.sel.mode),d=DD.catalog.diffs.find(x=>x.id===DD.sel.diff);
  let desc=catDesc(m);if(DD.sel.mode==="daily"&&DD.dailyInfo)desc+=t("dailyToday",{g:DD.dailyInfo.goal})+(DD.streakInfo&&DD.streakInfo()?t("streak",{n:DD.streakInfo()}):"");
  $("modeDesc").textContent=desc;
  const lockD=DD.modes[DD.sel.mode]&&DD.modes[DD.sel.mode].lockDiff;
  const sl=$("selLine");if(sl)sl.textContent=m.ico+" "+catName("modes",m)+" · "+(lockD?t("d.normal"):catName("diffs",d))+(DD.sel.skin!=="default"?" · "+catName("skins",DD.catalog.skins.find(x=>x.id===DD.sel.skin)):"")+(gridShown().id!=="g3"?" · "+gridShown().n+"×"+gridShown().n:"");
  $("proNote").textContent=DD.pro?(DD.pro.trial?t("pro.trial"):t("pro.active")):t("pro.locked");
  $("statsBtn").textContent=(DD.pro&&DD.pro.stats?"📊 ":"🔒 ")+t("stats.btn");
};
const gridShown=()=>{const m=DD.modes[DD.sel.mode];return DD.grids[m&&m.lockGrid?m.lockGrid:DD.sel.grid]||DD.grids.g3};
const subUrl=()=>"../../../subscribe.html?from="+encodeURIComponent("cozyplay/index.html#dap-deadline")+"&plan=month";
let lastPay=null;
DD.paywall=function(f,silent){
  lastPay=f;if(!silent)track(f,"view");
  const today=new Date().toLocaleDateString("en-CA"),trial=f==="endless"&&LS.get("dd-trial","")!==today;
  $("payT").textContent=t("pw."+f+".t");
  $("payBody").innerHTML='<p>'+escH(t("pw."+f+".d"))+'</p><ul><li>'+t("pw.b1")+'</li><li>'+t("pw.b2")+'</li><li>'+t("pw.b3")+'</li></ul>'+
    '<div class="pw-row"><a class="big" id="payGo" target="_top" href="'+subUrl()+'">'+t("pw.go")+'</a>'+(trial?'<button class="icon-btn" id="payTrial" type="button">'+t("pw.trial")+'</button>':'')+'<button class="icon-btn" id="payX" type="button">'+t("pw.later")+'</button></div>';
  $("payGo").onclick=()=>track(f,"click");
  $("payX").onclick=()=>closeSheet("pay");
  if(trial)$("payTrial").onclick=async()=>{
    try{ await DD.loadPro(true); LS.set("dd-trial",today); DD.want=Object.assign(DD.want||{},{mode:"endless"}); DD.refresh(); closeSheet("pay"); closeSheet("setup"); say(t("pw.trialSay")) }
    catch(e){ $("payBody").insertAdjacentHTML("afterbegin",'<p style="color:var(--stamp)">'+t("pw.tried")+'</p>') }
  };
  openSheet("pay");
};
DD.loadPro=async function(trial,ticket){
  const t=ticket||passToken(),r=await fetch("/api/pro/dap-deadline.js"+(trial?"?trial=1":""),{headers:t?{Authorization:"Bearer "+t}:{},cache:"no-store"});
  if(!r.ok)throw new Error("pro_"+r.status);
  DD.baseThwack=window.thwack;new Function("DD",await r.text())(DD);
  if(!trial&&!ticket&&passToken())fetch("/api/pro/ticket",{method:"POST",headers:{Authorization:"Bearer "+passToken()},cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ticket)DD.ticket=j.ticket}).catch(()=>{});   /* vé cho bạn bè chơi hộ */
};
DD.lockPro=function(){   /* hết lượt dùng thử: trả về bản miễn phí */
  for(const k of ["endless","daily","boss"])delete DD.modes[k];for(const k of ["easy","hard","rage"])delete DD.diffs[k];delete DD.skins.cafe;delete DD.skins.retro;for(const k of ["g4","g5","g6"])delete DD.grids[k];
  DD.pro=null;DD.hooks.onHit=null;DD.hooks.onEnd=null;if(DD.baseThwack)window.thwack=DD.baseThwack;DD.want=Object.assign(DD.want||{},{mode:"classic",diff:"normal",skin:"default",grid:"g3"});DD.refresh();
};
$("setupBtn").addEventListener("click",()=>{ if(running){say(t("busy"));return} DD.refresh();openSheet("setup") });
$("setupX").addEventListener("click",()=>closeSheet("setup"));
$("statsX").addEventListener("click",()=>closeSheet("statsP"));$("payX0").addEventListener("click",()=>closeSheet("pay"));
$("statsBtn").addEventListener("click",()=>{ if(DD.pro&&DD.pro.stats&&DD.openStats){DD.openStats();openSheet("statsP")}else DD.paywall("stats") });
for(const id of ["setup","statsP","pay"])$(id).addEventListener("click",e=>{if(e.target===$(id))closeSheet(id)});
addEventListener("keydown",e=>{if(e.key==="Escape")for(const id of ["pay","statsP","setup"])if(!$(id).hidden){closeSheet(id);break}});
if(window.NP&&NP.helper){$("setupBtn").hidden=true}   /* người chơi hộ chỉ chơi 1 lượt, không tự đổi chế độ */
let helperPro=null;
{const HS=window.NP&&NP.helper&&NP.initialState;
 if(HS&&HS.tk&&HS.mode&&/^h\.\d{13}\.[\w-]{43}$/.test(HS.tk)){DD.ticket=HS.tk;   /* chơi hộ một ván Night Pass: tải mã bằng vé tạm */
   helperPro=DD.loadPro(false,HS.tk).then(()=>{DD.want=Object.assign(DD.want||{},{mode:HS.mode,diff:HS.diff,skin:HS.skin,grid:HS.grid||"g3"});DD.refresh()}).catch(()=>{})}}
if(!(window.NP&&NP.helper)&&passToken())DD.loadPro(false).catch(()=>{});   /* có Night Pass: mở khóa các chế độ trả phí */

function syncSound(){$("soundIco").textContent=sound?"🔊":"🔇";$("soundTxt").textContent=" "+t("sound")+": "+t(sound?"on":"off");$("soundBtn").setAttribute("aria-pressed",sound);$("soundBtn").setAttribute("aria-label",t("sound")+": "+t(sound?"on":"off"))}
$("soundBtn").addEventListener("click",()=>{sound=!sound;syncSound()});
function applyLang(){
  document.documentElement.lang=LANG;document.title=t("docTitle");$("titleTxt").innerHTML=t("title");
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=t(e.dataset.i)});
  $("setupTxt").textContent=" "+t("modes");$("setupBtn").setAttribute("aria-label",t("modes"));$("langTxt").textContent=LANG.toUpperCase();$("langBtn").setAttribute("aria-label",t("lang"));$("langBtn").title=t("lang");
  for(const id of ["setupX","statsX","payX0"])$(id).setAttribute("aria-label",t("close"));
  $("pauseT").textContent=t("pausedT");$("pauseP").textContent=t("pausedP");$("resumeBtn").textContent="▶ "+t("resume");
  cells.forEach((c,i)=>c.el.setAttribute("aria-label",t("cell",{n:i+1})));
  syncSound();syncPauseBtn();render();
  if(!running){if(ovKind==="end"&&endInfo)renderEnd();else renderStart()}
  DD.refresh();
  if(!$("pay").hidden&&lastPay)DD.paywall(lastPay,true);
  if(!$("statsP").hidden&&DD.openStats)DD.openStats();
}
function setLang(l,save){LANG=l;if(save)try{localStorage.setItem("lang",l)}catch(e){}applyLang()}
$("langBtn").addEventListener("click",()=>setLang(LANG==="vi"?"en":"vi",true));
DD.t=t;DD.addI18n=d=>{for(const l in d)Object.assign(I18N[l]||(I18N[l]={}),d[l])};Object.defineProperty(DD,"lang",{get:()=>LANG});
applyLang();
</script>
