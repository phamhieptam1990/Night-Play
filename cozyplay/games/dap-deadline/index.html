<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/device.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đập Deadline</title>
<link rel="preload" href="../../../shared/fonts/inter-var-latin-vi.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../../shared/fonts.css">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||"dark";</script>
<style>
/* Layout: one-screen arcade desk — scoreboard strip, 3×3 desk of pop-up sticky notes, stamp-smash feedback */
:root{
  /* Bảng màu lấy từ landing Night Play (sáng) */
  --bg:#F3F0FA; --desk:#E2DCF5; --slot:#D3CAEE; --line:#CFC6EA;
  --ink:#1C1833; --muted:#5E5780; --panel:#fff;
  --accent:#6A48F0; --on-accent:#fff;
  --note:#ffe25c; --note-hot:#ff8a5c;   /* giấy note vàng giữ nguyên cho dễ nhận biết */
  --stamp:#d7263d; --good:#12a150;      /* dấu XONG đỏ / cà phê xanh */
  --display:var(--font);
  --body:var(--font);
}
:root[data-theme="dark"]{
  --bg:#0E1020; --desk:#171A30; --slot:#232748; --line:#2C3160;
  --ink:#ECEEFF; --muted:#9AA0C8; --panel:#1A1D36;
  --accent:#9B83FF; --on-accent:#0E0A24;
  --note:#f5d63d; --note-hot:#ff7a4a; --stamp:#ff4d5e; --good:#3ddc84;
  color-scheme:dark}

/* Bề rộng khu chơi: tối đa 560px, co lại theo chiều rộng và chiều cao màn hình để luôn vừa một màn và nằm giữa */
:root{--w:max(150px,min(760px,100vw - 32px,100dvh - 300px))}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}   /* một màn hình, không cuộn */
/* Canh giữa game theo cả chiều ngang lẫn dọc; chừa 76px trên/dưới cho nút Home và đồng hồ của trang chủ */
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:64px;padding-bottom:16px;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  -webkit-user-select:none;user-select:none}
.top{width:100%;max-width:var(--w);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,32px);margin:0;letter-spacing:.5px;line-height:1}
h1 span{color:var(--accent)}
.icon-btn{font:600 13px var(--body);background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.icon-btn:focus-visible,.cell:focus-visible,.big:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stats{width:100%;max-width:var(--w);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column}
.stat small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.timebar{width:100%;max-width:var(--w);height:8px;background:var(--slot);border-radius:99px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .2s linear}

.desk-wrap{position:relative;width:100%;max-width:var(--w);display:grid;grid-template-columns:minmax(0,1fr)}
.desk,.overlay{grid-area:1/1}
.desk{background:var(--desk);border:2px solid var(--line);border-radius:22px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:100%;box-sizing:border-box}
.cell::before{content:"";display:block;padding-top:100%}
.cell{position:relative;display:block;width:100%;background:var(--slot);border-radius:12px;overflow:hidden;border:none;padding:0;cursor:pointer;touch-action:manipulation}
.cell::after{content:"";position:absolute;left:10%;right:10%;bottom:8%;height:10%;background:rgba(0,0,0,.12);border-radius:50%}
.note{position:absolute;top:8%;right:8%;bottom:8%;left:8%;border-radius:4px;background:var(--note);color:#1d2a36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:6px;box-shadow:0 6px 0 rgba(0,0,0,.18);transform:translateY(115%) rotate(-3deg);transition:transform .14s ease-out;z-index:1}
.note.up{transform:translateY(0) rotate(-3deg)}
.note .ico{font-size:36px;font-size:clamp(26px,9vw,46px);line-height:1;flex:none}
.note .lbl{font-weight:800;font-size:13px;font-size:clamp(11px,3.2vw,15px);line-height:1.15;margin-top:4px;max-width:100%;min-height:0;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.note .lbl.long{font-size:clamp(9px,2.5vw,12px);line-height:1.1}
.note.hot{background:var(--note-hot)}
.note.coffee{background:#fff;border:3px dashed var(--good)}
.note.coffee .lbl{color:#1b6b47}
.note.hit{transition:transform .18s ease-in;transform:translateY(115%) rotate(8deg) scale(.9)}
.stampmark{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.stampmark span{font-family:var(--display);font-weight:800;color:var(--stamp);border:4px solid var(--stamp);border-radius:8px;padding:2px 8px;font-size:clamp(16px,5vw,26px);transform:rotate(-14deg) scale(1.6);opacity:0;animation:stamp .5s ease-out forwards;background:var(--panel);background:color-mix(in srgb,var(--panel) 70%,transparent)}
.stampmark.good span{color:var(--good);border-color:var(--good)}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(1.8)}25%{opacity:1;transform:rotate(-14deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-14deg) scale(1)}}
.float{position:absolute;font-family:var(--display);font-weight:800;font-size:18px;pointer-events:none;z-index:3;animation:rise .8s ease-out forwards;color:var(--ink)}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
.desk[data-n="4"]{gap:8px;padding:10px}.desk[data-n="5"]{gap:6px;padding:8px}.desk[data-n="6"]{gap:5px;padding:7px}
.desk:not([data-n="3"]) .cell{border-radius:10px}
.desk[data-n="4"] .note .ico{font-size:calc(var(--w)*.1)}.desk[data-n="4"] .note .lbl{font-size:calc(var(--w)*.03);margin-top:2px}
.desk[data-n="5"] .note .ico{font-size:calc(var(--w)*.08)}.desk[data-n="6"] .note .ico{font-size:calc(var(--w)*.065)}
.desk[data-n="5"] .note .lbl,.desk[data-n="6"] .note .lbl{display:none}
.desk[data-n="4"] .note{padding:3px}.desk[data-n="5"] .note,.desk[data-n="6"] .note{padding:1px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.desk[data-n="5"] .stampmark span,.desk[data-n="6"] .stampmark span{font-size:calc(var(--w)*.04);padding:1px 4px;border-width:2px}
.chip.dim{opacity:.4}
/* ===== TRANG THÁCH ĐẤU: thẻ VS, thước đo kỷ lục, đếm ngược, kết quả thắng/thua ===== */
.probadge.chb{background:var(--stamp);color:#fff}
#leftBox{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
#leftBox #mood{margin-right:0}
#chTrack{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font:800 12.5px var(--body);white-space:nowrap}
#chTrack[hidden]{display:none}
#chTrack .cb{width:64px;height:7px;border-radius:7px;background:var(--slot);overflow:hidden}
#chTrack .cb i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .2s}
#chTrack.beat{border-color:#e9b949;color:#e9b949}#chTrack.beat .cb i{background:#e9b949}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0}
.vs-p{display:flex;flex-direction:column;align-items:center;min-width:92px;padding:8px 10px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
.vs-p.you{border-color:var(--accent)}
.vs-e{font-size:40px;line-height:1.1}.vs-p b{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1}.vs-p small{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.vs-x{font-family:var(--display);font-weight:800;font-size:30px;color:var(--stamp);text-shadow:0 2px 0 rgba(0,0,0,.25);animation:vsp 1.1s ease-in-out infinite}
@keyframes vsp{50%{transform:scale(1.25) rotate(-6deg)}}
.cd{position:fixed;left:50%;top:50%;z-index:60;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:min(30vw,170px);color:var(--accent);text-shadow:0 6px 0 rgba(0,0,0,.3),0 0 40px color-mix(in srgb,var(--accent) 60%,transparent);pointer-events:none;animation:cdp .6s ease-out forwards}
@keyframes cdp{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
.overlay h2.chw{color:#e9b949;text-shadow:0 0 24px rgba(233,185,73,.55)}.overlay h2.chl{color:var(--stamp)}
@media (prefers-reduced-motion:reduce){.vs-x,.cd{animation:none}}
@media (max-height:640px){.vs-e{font-size:30px}.vs-p b{font-size:24px}.vs-p{padding:5px 8px;min-width:76px}.vs-x{font-size:22px}}

@media (max-width:340px),(max-height:600px){.sheet-in .chip{padding:5px 8px;font-size:12px;min-height:30px}.sheet-in{gap:5px}.sec small{margin-bottom:2px}}
@media (max-height:420px){.sheet-in{gap:3px;padding:7px 10px}.sec small{display:none}.sheet-in .chip{padding:3px 8px;min-height:26px;font-size:11.5px}.chips{gap:4px}.proNote,.sdesc{display:none}.sh-h{font-size:14px}}
/* ===== NHÂN VẬT NGƯỜI YÊU (mặt đổi theo tâm trạng) + KHOE ĐIỂM / THÁCH ĐẤU ===== */
#mood{position:relative;display:flex;align-items:center;margin-right:auto}
#mood[hidden]{display:none}
#moodFace{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:24px;line-height:1;background:var(--panel);transition:border-color .3s,box-shadow .3s}
#moodFace.pulse{animation:cbump .3s ease-out}
#moodSay{position:absolute;top:calc(100% + 4px);left:0;z-index:9;pointer-events:none;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:700;font-size:13px;white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
#moodSay.on{opacity:1;transform:none}
.sheet-in.share{align-items:center;gap:8px}
#shCanvas{display:block;height:min(58dvh,calc(100dvh - 190px));width:auto;max-width:100%;aspect-ratio:9/16;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sh-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.sh-row .icon-btn{flex:1 1 auto;justify-content:center}
#shLink{width:100%;font:600 12px var(--body);padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
#shLink[hidden]{display:none}
#shStatus{min-height:16px;font-size:12.5px;color:var(--muted);text-align:center;margin:0}
#shareBtn,#rankBtn{margin-top:2px}
@media (max-height:520px){.sheet-in.share{flex-direction:row;flex-wrap:wrap;justify-content:center;width:min(640px,100%)}#shCanvas{height:calc(100dvh - 50px)}.sh-col{flex:1 1 200px;display:flex;flex-direction:column;gap:8px}}

/* ===== HIỆU ỨNG COMBO: nóng dần theo bậc (5 / 10 / 20 / 30), thanh đếm thời gian giữ combo, bùng nổ ở mốc, báo khi mất ===== */
.stat{position:relative}
#comboStat::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:3px;background:var(--accent);opacity:0;transform:scaleX(var(--cm,0));transform-origin:left;transition:transform .1s linear,opacity .2s}
#comboStat:not([data-t="0"])::after{opacity:.95}
#comboStat[data-t="1"]{border-color:var(--note-hot)}
#comboStat[data-t="2"]{border-color:var(--note-hot);box-shadow:0 0 14px color-mix(in srgb,var(--note-hot) 55%,transparent)}
#comboStat[data-t="3"],#comboStat[data-t="4"]{border-color:var(--stamp);box-shadow:0 0 18px color-mix(in srgb,var(--stamp) 60%,transparent);animation:cheat 1s ease-in-out infinite}
#comboStat[data-t="1"] b,#comboStat[data-t="2"] b{color:var(--note-hot)}
#comboStat[data-t="3"] b,#comboStat[data-t="4"] b{color:var(--stamp)}
#comboStat[data-t="4"]::after{background:var(--stamp)}
#comboStat.bump b{display:inline-block;animation:cbump .26s ease-out}
#comboStat.lose{animation:close .35s}
@keyframes cbump{40%{transform:scale(1.4)}}
@keyframes cheat{50%{box-shadow:0 0 28px color-mix(in srgb,var(--stamp) 80%,transparent)}}
@keyframes close{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.desk.cglow{animation:cglow .7s ease-out}
@keyframes cglow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 75%,transparent)}100%{box-shadow:0 0 0 24px transparent}}
.cpop{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:8;pointer-events:none;text-align:center;white-space:nowrap;animation:cpop 1s ease-out forwards}
.cpop b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(34px,11vw,64px);line-height:1;color:var(--accent);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.cpop span{display:block;margin-top:2px;font-weight:800;font-size:clamp(13px,4vw,20px);color:var(--ink);text-shadow:0 2px 10px var(--bg),0 0 4px var(--bg)}
.cpop.t3 b,.cpop.t4 b{color:var(--stamp)}
.cpop.lost{top:8%}.cpop.lost b{font-size:clamp(15px,4.4vw,22px);color:var(--muted);text-shadow:none}
@keyframes cpop{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%{opacity:1;transform:translateX(-50%) scale(1.15)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-26px) scale(1)}}
.cf{position:absolute;pointer-events:none;z-index:7;font-size:clamp(16px,4.5vw,26px);animation:cf .95s ease-out forwards}
@keyframes cf{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){#comboStat,#comboStat.bump b,#comboStat.lose,.desk.cglow{animation:none}.cf{display:none}.cpop{animation-duration:.01s;opacity:1}}

.modebar .chip{position:relative}
.modebar .chip.ib{width:46px;height:46px;min-height:0;padding:0;border-radius:50%;display:inline-grid;place-items:center}
.modebar .chip.ib .ie{font-size:23px;line-height:1}
.modebar.sm .chip.ib{width:40px;height:40px;min-height:0;padding:0}.modebar.sm .chip.ib .ie{font-size:20px}
.modebar .chip i{position:absolute;top:-3px;right:-3px;font-size:11px;font-style:normal;line-height:1;background:var(--panel);border-radius:50%;padding:2px}
.overlay .sel{display:none}   /* tên chế độ đã có trên các icon, không lặp lại bằng chữ */
.top h1.lt{font-size:clamp(16px,4.6vw,24px)}
.top h1.lt .probadge{margin-left:6px}
.top h1{white-space:nowrap;min-width:0;max-width:100%}.probadge{white-space:nowrap;flex:none}   /* min-width:0 → tiêu đề KHÔNG nới rộng hơn khung chơi; chữ dài thì được thu nhỏ bằng fitTitle() */
.modebar[hidden]{display:none}
.big.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:16px;padding:9px 26px}
.modebar.sm .chip{font-size:12px;padding:3px 9px;min-height:28px}
.desk.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.shout{min-height:24px;font-weight:800;font-size:16px;text-align:center;color:var(--accent)}

.overlay{position:relative;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;box-sizing:border-box;z-index:5;overflow:hidden;min-height:0}
.overlay h2{font-family:var(--display);font-weight:800;margin:0;font-size:clamp(22px,6vw,30px);text-wrap:balance}
.overlay p{margin:0;max-width:36ch;line-height:1.5;color:var(--muted)}
.overlay .rank{font-family:var(--display);font-weight:800;font-size:clamp(20px,6vw,28px);color:var(--accent)}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
.legend span{background:var(--panel);border:1.5px solid var(--line);border-radius:99px;padding:3px 10px}
.big{font-family:var(--display);font-weight:800;font-size:20px;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 32px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.tip{font-size:13px;color:var(--muted)}
/* ===== Chọn chế độ / độ khó / giao diện (bản trả phí mở khóa bằng Night Pass) ===== */
.sel{font-size:12.5px;color:var(--muted);font-weight:600}
.sheet{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px;box-sizing:border-box;background:rgba(8,9,20,.68);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet[hidden]{display:none}
.sheet-in{box-sizing:border-box;width:min(430px,100%);max-height:calc(100dvh - 32px);overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel) 38%);color:var(--ink);border:2px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:24px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 56px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05) inset}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;padding-bottom:8px;border-bottom:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.sec small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--body);padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.lock{opacity:.75}.chip i{font-style:normal;font-size:11px}
.chip:focus-visible,.sh-f button:focus-visible,.pw-row a:focus-visible,.pw-row button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sdesc{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.sh-f{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.proNote{font-size:12.5px;color:var(--muted)}
.pw-in p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}.pw-in ul{margin:2px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.pw-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.pw-row a.big{font-size:16px;padding:10px 22px;text-decoration:none;display:flex;align-items:center;justify-content:center;flex:1 1 100%;order:-1;min-height:48px;white-space:nowrap;box-sizing:border-box}.pw-row .icon-btn{min-height:44px;flex:1 1 auto;white-space:nowrap}
@media (max-height:620px){.sdesc,.pw-in ul{display:none}.sheet-in{gap:6px;padding:10px 12px}.sec small{margin-bottom:3px}.chip{padding:5px 10px;min-height:32px}.pw-row a.big{padding:8px 18px;min-height:44px}}
@media (max-height:420px){.sec small{display:none}.chip{font-size:12px;padding:4px 9px;min-height:28px}.sh-h{font-size:15px}}

function audio(){if(!sound)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}}
function thwack(good){
  const a=audio();if(!a)return;const t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type=good?"triangle":"square";
  o.frequency.setValueAtTime(good?520:180+Math.min(combo,10)*25,t);
  o.frequency.exponentialRampToValueAtTime(good?980:60,t+.12);
  g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.17);
  // short noise burst for the "stamp" thud
  const len=a.sampleRate*.06,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),g2=a.createGain();s.buffer=b;g2.gain.value=.25;s.connect(g2).connect(a.destination);s.start(t);
}
function buzz(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="sawtooth";o.frequency.value=110;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.13)}

function fitLbl(lb,note){   /* chữ trên giấy luôn nằm TRỌN trong tờ giấy: thu nhỏ dần; vẫn không vừa thì ẩn chữ, chỉ còn biểu tượng */
  lb.style.fontSize="";lb.style.display="";
  if(getComputedStyle(lb).display==="none")return;

    b.type="button";b.className="chip"+(on?" on":"")+(lock?" lock":"")+(fg&&!on?" dim":"");b.setAttribute("aria-pressed",on);
    iconChip(b,x.ico,catName("packs",x),lock);
    b.onclick=()=>pickItem("packs",x);pbr.appendChild(b);
  }}
  const ptb=$("partnerBar");
  if(ptb){ptb.textContent="";ptb.hidden=curPackId()!=="lover";if(!ptb.hidden)for(const x of DD.catalog.partners){
    const on=DD.sel.partner===x.id,b=document.createElement("button");b.type="button";b.className="chip"+(on?" on":"");b.setAttribute("aria-pressed",on);
    iconChip(b,x.ico,catName("partners",x),false);b.onclick=()=>pickItem("partners",x);ptb.appendChild(b);
  }}
  syncPackText();renderMood();
  const gb=$("gridBar");   /* chọn cỡ bàn ngay trên màn bắt đầu / kết thúc */
  if(gb){gb.textContent="";for(const x of DD.catalog.grids){
    const fg=gridForced(),lock=!unlocked("grids",x.id),on=fg?x.id===fg:DD.sel.grid===x.id,b=document.createElement("button");
    b.type="button";b.className="chip"+(on?" on":"")+(lock?" lock":"")+(fg&&!on?" dim":"");b.setAttribute("aria-pressed",on);
    b.innerHTML=catName("grids",x)+(lock?' <i aria-hidden="true">🔒</i>':"");
    b.title=catName("grids",x);b.setAttribute("aria-label",lock?t("lockedLbl",{n:catName("grids",x)}):catName("grids",x));
    b.onclick=()=>pickItem("grids",x);gb.appendChild(b);
  }}
  const pb=$("proBadge");if(pb){pb.hidden=!DD.pro||!!DD.pro.helper;pb.textContent=DD.pro?(DD.pro.trial?"★ "+t("badge.trial"):"★ Night Pass"):"";pb.removeAttribute("data-full");fitTitle()}
  const m=DD.catalog.modes.find(x=>x.id===DD.sel.mode),d=DD.catalog.diffs.find(x=>x.id===DD.sel.diff);
  let desc=catDesc(m);if(DD.sel.mode==="daily"&&DD.dailyInfo)desc+=t("dailyToday",{g:DD.dailyInfo.goal})+(DD.streakInfo&&DD.streakInfo()?t("streak",{n:DD.streakInfo()}):"");
  $("modeDesc").textContent=desc;renderHome();
  const lockD=DD.modes[DD.sel.mode]&&DD.modes[DD.sel.mode].lockDiff;
  const sl=$("selLine");if(sl)sl.textContent=m.ico+" "+catName("modes",m)+" · "+(lockD?t("d.normal"):catName("diffs",d))+(DD.sel.skin!=="default"?" · "+catName("skins",DD.catalog.skins.find(x=>x.id===DD.sel.skin)):"")+(gridShown().id!=="g3"?" · "+gridShown().n+"×"+gridShown().n:"")+(curPackId()!=="deadline"?" · "+catName("packs",DD.catalog.packs.find(x=>x.id===curPackId()))+(curPackId()==="lover"?" "+DD.catalog.partners.find(x=>x.id===DD.sel.partner).ico:""):"");
  $("proNote").textContent=DD.pro?(DD.pro.trial?t("pro.trial"):t("pro.active")):t("pro.locked");
  $("statsBtn").textContent=(DD.pro&&DD.pro.stats?"📊 ":"🔒 ")+t("stats.btn");
};
const gridShown=()=>{const m=DD.modes[DD.sel.mode];return DD.grids[m&&m.lockGrid?m.lockGrid:DD.sel.grid]||DD.grids.g3};
function setTitle(){   /* tên game dài → thu nhỏ chữ để không đẩy nút và huy hiệu xuống */
  const h=pk("title");$("titleTxt").innerHTML=h;document.title=pk("docTitle");
  const long=h.replace(/<[^>]*>/g,"").length>15;$("titleTxt").parentElement.classList.toggle("lt",long);fitTitle();
}
function fitTitle(){   /* tiêu đề + huy hiệu luôn nằm CHUNG MỘT DÒNG: thu nhỏ chữ dần; vẫn không vừa thì huy hiệu chỉ còn biểu tượng */
  const h=document.querySelector(".top h1");if(!h)return;
  const badges=[...h.querySelectorAll(".probadge")];
  badges.forEach(b=>{if(b.dataset.full)b.textContent=b.dataset.full});h.style.fontSize="";
  const wrapped=()=>{const k=[...h.children].filter(e=>!e.hidden&&e.getClientRects().length),r=h.getBoundingClientRect();return h.scrollWidth>h.clientWidth||(k.length&&k[k.length-1].getBoundingClientRect().right>r.right+.5)};   /* h1 không xuống dòng: tràn ngang = không vừa */
  if(!wrapped())return;
  const base=parseFloat(getComputedStyle(h).fontSize)||24;
  for(let fs=Math.floor(base)-1;fs>=15;fs--){h.style.fontSize=fs+"px";if(!wrapped())return}
  badges.forEach(b=>{if(!b.hidden&&b.textContent){b.dataset.full=b.textContent;b.textContent=b.textContent.trim().charAt(0)}});
  if(wrapped())h.style.fontSize="";
}
addEventListener("resize",()=>fitTitle());
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitTitle());
function syncPackText(){   /* tên game / mô tả đổi theo loại game đang chọn */
  setTitle();
  if(!running&&ovKind==="start"&&!resumeFrom){const ov=$("overlay"),h=ov.querySelector("h2"),p=ov.querySelector("p");if(!CH){if(h)h.innerHTML=pk("start.h");if(p)p.innerHTML=pk("start.p")}}
  else if(!running&&ovKind==="end"&&endInfo&&!CH){const h=$("overlay").querySelector("h2");if(h)h.textContent=mv(endInfo.mode.title)||pk("end.title")}
}
const subUrl=()=>"../../../subscribe.html?from="+encodeURIComponent("cozyplay/index.html#dap-deadline")+"&plan=month";
let lastPay=null;
DD.paywall=function(f,silent){
  lastPay=f;if(!silent)track(f,"view");
  const today=new Date().toLocaleDateString("en-CA"),trial=f==="endless"&&LS.get("dd-trial","")!==today;
  $("payT").textContent=t("pw."+f+".t");
  $("payBody").innerHTML='<p>'+escH(t("pw."+f+".d"))+'</p><ul><li>'+t("pw.b1")+'</li><li>'+t("pw.b2")+'</li><li>'+t("pw.b3")+'</li></ul>'+
    '<div class="pw-row"><a class="big" id="payGo" target="_top" href="'+subUrl()+'">'+t("pw.go")+'</a>'+(trial?'<button class="icon-btn" id="payTrial" type="button">'+t("pw.trial")+'</button>':'')+'<button class="icon-btn" id="payX" type="button">'+t("pw.later")+'</button></div>';
  $("payGo").onclick=()=>track(f,"click");
  $("payX").onclick=()=>closeSheet("pay");
  if(trial)$("payTrial").onclick=async()=>{
    try{ await DD.loadPro(true); LS.set("dd-trial",today); DD.want=Object.assign(DD.want||{},{mode:"endless"}); DD.refresh(); closeSheet("pay"); closeSheet("setup"); say(t("pw.trialSay")) }
    catch(e){ $("payBody").insertAdjacentHTML("afterbegin",'<p style="color:var(--stamp)">'+t("pw.tried")+'</p>') }
  };
  openSheet("pay");
};
const fetchT=(u,o,ms)=>{const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({signal:c.signal},o)).finally(()=>clearTimeout(id))};
DD.loadPro=async function(trial,ticket){
  /* Mất mạng / mạng yếu: dùng bản trả phí đã lưu lần trước (chỉ khi Night Pass trên máy còn hạn) → người chơi không thấy khác gì */
  const t=ticket||passToken(),cacheable=!trial&&!ticket;let src=null,r=null;
  try{r=await fetchT("/api/pro/dap-deadline.js"+(trial?"?trial=1":""),{headers:t?{Authorization:"Bearer "+t}:{},cache:"no-store"},8000)}catch(e){r=null}
  if(r&&r.ok){src=await r.text();if(cacheable)LS.set("dd-pro-src",{src})}
  else{
    if(r&&r.status>=400&&r.status<500&&r.status!==429){if(r.status===401&&cacheable)try{localStorage.removeItem("dd-pro-src")}catch(e){}throw new Error("pro_"+r.status)}
    const c=cacheable?LS.get("dd-pro-src",null):null,p=LS.get("pass",null);
    if(c&&c.src&&p&&p.exp&&new Date(p.exp)>new Date())src=c.src;else throw new Error("pro_offline");
  }
  DD.baseThwack=window.thwack;new Function("DD",src)(DD);
  if(cacheable)DD.fetchTicket();
};
DD.fetchTicket=function(){   /* vé cho bạn bè chơi hộ; tự thử lại khi mạng về */
  const t=passToken();if(!t||(window.NP&&NP.helper)||!DD.pro||DD.pro.trial)return;
  fetchT("/api/pro/ticket",{method:"POST",headers:{Authorization:"Bearer "+t},cache:"no-store"},6000).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ticket){DD.ticket=j.ticket;DD.ticketAt=Date.now()}}).catch(()=>{});
};
addEventListener("online",()=>{if(!DD.ticket)DD.fetchTicket();if(!DD.pro&&passToken()&&!(window.NP&&NP.helper))DD.loadPro(false).catch(()=>{})});
setInterval(()=>{if(!DD.ticket||Date.now()-(DD.ticketAt||0)>20*36e5)DD.fetchTicket()},60000);
DD.lockPro=function(){   /* hết lượt dùng thử: trả về bản miễn phí */
  for(const k of ["endless","daily","boss"])delete DD.modes[k];for(const k of ["easy","hard","rage"])delete DD.diffs[k];delete DD.skins.cafe;delete DD.skins.retro;delete DD.skins.neon;delete DD.skins.sakura;for(const k of ["g4","g5","g6"])delete DD.grids[k];delete DD.packs.animals;delete DD.packs.lover;
  DD.pro=null;DD.hooks.onHit=null;DD.hooks.onEnd=null;if(DD.baseThwack)window.thwack=DD.baseThwack;DD.want=Object.assign(DD.want||{},{mode:"classic",diff:"normal",skin:"default",grid:"g3",pack:"deadline"});DD.refresh();
};
$("setupBtn").addEventListener("click",()=>{ if(running){say(t("busy"));return} DD.refresh();openSheet("setup") });
$("setupX").addEventListener("click",()=>closeSheet("setup"));
$("bHelp").addEventListener("click",()=>{$("howT").textContent=t("help.t");$("howB").innerHTML="<b>"+t("start.h")+"</b><br>"+t("start.p")+"<br><small style='opacity:.75'>"+t("start.tip")+"</small>";$("howL").innerHTML=[1,2,3,4].map(i=>"<span style='padding:3px 10px;border-radius:99px;border:1.5px solid var(--line)'>"+t("leg"+i)+"</span>").join("");openSheet("howS")});
$("howX").addEventListener("click",()=>closeSheet("howS"));
$("statsX").addEventListener("click",()=>closeSheet("statsP"));$("payX0").addEventListener("click",()=>closeSheet("pay"));
$("statsBtn").addEventListener("click",()=>{ if(DD.pro&&DD.pro.stats&&DD.openStats){DD.openStats();openSheet("statsP")}else DD.paywall("stats") });
for(const id of ["setup","statsP","pay"])$(id).addEventListener("click",e=>{if(e.target===$(id))closeSheet(id)});
addEventListener("keydown",e=>{if(e.key==="Escape")for(const id of ["pay","statsP","setup","howS"])if(!$(id).hidden){closeSheet(id);break}});
if(window.NP&&NP.helper){$("setupBtn").hidden=true}   /* người chơi hộ chỉ chơi 1 lượt, không tự đổi chế độ */
let helperPro=null;
if(CH){   /* mở bằng link thách đấu: chơi đúng ván Cổ điển 45 giây, cùng loại game với người thách, không đổi cài đặt */
  $("setupBtn").hidden=true;$("chBadge").hidden=false;$("chBadge").textContent="⚔ "+t("ch.badge");fitTitle();$("chTrack").hidden=false;DD.want={mode:"classic",diff:"normal",skin:"default",grid:"g3",pack:"deadline",partner:CH.pt};
  if(CH.p!=="deadline"&&CH.tk&&!(window.NP&&NP.helper)){DD.ticket=CH.tk;helperPro=DD.loadPro(false,CH.tk).then(()=>{DD.want.pack=CH.p;DD.refresh()}).catch(()=>{})}
}
{const HS=window.NP&&NP.helper&&NP.initialState;
 if(HS&&HS.tk&&HS.mode&&/^h\.\d{13}\.[\w-]{43}$/.test(HS.tk)){DD.ticket=HS.tk;   /* chơi hộ một ván Night Pass: tải mã bằng vé tạm */
   helperPro=DD.loadPro(false,HS.tk).then(()=>{DD.want=Object.assign(DD.want||{},{mode:HS.mode,diff:HS.diff,skin:HS.skin,grid:HS.grid||"g3",pack:HS.pack||"deadline",partner:HS.partner||"f"});DD.refresh()}).catch(()=>{})}}
if(!(window.NP&&NP.helper)&&passToken())DD.loadPro(false).catch(()=>{});   /* có Night Pass: mở khóa các chế độ trả phí */

function syncSound(){const b=$("bSnd");b.textContent=sound?"🔊":"🔇";b.setAttribute("aria-pressed",sound);b.setAttribute("aria-label",t("sound")+": "+t(sound?"on":"off"));b.title=t("sound")+": "+t(sound?"on":"off")}
$("bSnd").addEventListener("click",()=>{sound=!sound;if(window.NPAudio)NPAudio.set(sound);syncSound()});
function applyLang(){
  document.documentElement.lang=LANG;setTitle();
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=t(e.dataset.i)});
  $("setupTxt").textContent=" "+t("modes");$("setupBtn").setAttribute("aria-label",t("modes"));$("bLang").textContent=LANG==="vi"?"EN":"VI";$("bLang").setAttribute("aria-label",t("lang"));$("bHelp").setAttribute("aria-label",t("help.t"));$("bHelp").title=t("help.t");$("bLang").title=t("lang");$("bBk").title=t("home.back");$("bBk").setAttribute("aria-label",t("home.back"));
  for(const id of ["setupX","statsX","payX0","howX"])$(id).setAttribute("aria-label",t("close"));
  $("pauseT").textContent=t("pausedT");$("pauseP").textContent=t("pausedP");$("resumeBtn").textContent="▶ "+t("resume");$("restartOv").textContent="↻ "+t("restart");$("restartBtn").setAttribute("aria-label",t("restart"));$("restartBtn").title=t("restart");
  cells.forEach((c,i)=>c.el.setAttribute("aria-label",t("cell",{n:i+1})));
  syncSound();syncPauseBtn();render();
  cells.forEach(st=>{const it=st.item||st.last;if(!it)return;const lb=st.note.querySelector(".lbl"),tx=(LANG==="en"&&it.en)||it.lbl;   /* cả thẻ vừa bị đập/đang tụt xuống (st.item đã null nhưng chữ còn trong DOM) */
  lb.textContent=tx;lb.classList.toggle("long",tx.length>16);try{fitLbl(lb,st.note)}catch(e){}});   /* thẻ đang hiện trên bàn đổi chữ tại chỗ */
  if(!running){if(ovKind==="end"&&endInfo)renderEnd();else if(ovKind!=="home")renderStart()}
  DD.refresh();
  if(!$("pay").hidden&&lastPay)DD.paywall(lastPay,true);
  if(!$("statsP").hidden&&DD.openStats)DD.openStats();
}
function setLang(l,save){LANG=l;if(save)try{localStorage.setItem("lang",l)}catch(e){}applyLang()}
$("bLang").addEventListener("click",()=>setLang(LANG==="vi"?"en":"vi",true));
DD.t=t;DD.addI18n=d=>{for(const l in d)Object.assign(I18N[l]||(I18N[l]={}),d[l])};Object.defineProperty(DD,"lang",{get:()=>LANG});
applyLang();
if(HOME_OK()&&!resumeFrom)showHome();
