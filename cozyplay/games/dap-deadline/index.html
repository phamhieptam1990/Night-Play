<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đập Deadline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<script>try{var t=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=t||"dark";</script>
<style>
/* Layout: one-screen arcade desk — scoreboard strip, 3×3 desk of pop-up sticky notes, stamp-smash feedback */
:root{
  /* Bảng màu lấy từ landing Night Play (sáng) */
  --bg:#F3F0FA; --desk:#E2DCF5; --slot:#D3CAEE; --line:#CFC6EA;
  --ink:#1C1833; --muted:#5E5780; --panel:#fff;
  --accent:#6A48F0; --on-accent:#fff;
  --note:#ffe25c; --note-hot:#ff8a5c;   /* giấy note vàng giữ nguyên cho dễ nhận biết */
  --stamp:#d7263d; --good:#12a150;      /* dấu XONG đỏ / cà phê xanh */
  --display:"Bungee", "Arial Black", system-ui, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0E1020; --desk:#171A30; --slot:#232748; --line:#2C3160;
  --ink:#ECEEFF; --muted:#9AA0C8; --panel:#1A1D36;
  --accent:#9B83FF; --on-accent:#0E0A24;
  --note:#f5d63d; --note-hot:#ff7a4a; --stamp:#ff4d5e; --good:#3ddc84;
  color-scheme:dark}

/* Bề rộng khu chơi: tối đa 560px, co lại theo chiều rộng và chiều cao màn hình để luôn vừa một màn và nằm giữa */
:root{--w:max(150px,min(560px,100vw - 32px,100dvh - 300px))}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}   /* một màn hình, không cuộn */
/* Canh giữa game theo cả chiều ngang lẫn dọc; chừa 76px trên/dưới cho nút Home và đồng hồ của trang chủ */
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:64px;padding-bottom:16px;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  -webkit-user-select:none;user-select:none}
.top{width:100%;max-width:var(--w);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,32px);margin:0;letter-spacing:.5px;line-height:1}
h1 span{color:var(--accent)}
.icon-btn{font:600 13px var(--body);background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.icon-btn:focus-visible,.cell:focus-visible,.big:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stats{width:100%;max-width:var(--w);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column}
.stat small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.timebar{width:100%;max-width:var(--w);height:8px;background:var(--slot);border-radius:99px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .2s linear}

.desk-wrap{position:relative;width:100%;max-width:var(--w);display:grid;grid-template-columns:minmax(0,1fr)}
.desk,.overlay{grid-area:1/1}
.desk{background:var(--desk);border:2px solid var(--line);border-radius:22px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:100%;box-sizing:border-box}
.cell::before{content:"";display:block;padding-top:100%}
.cell{position:relative;display:block;width:100%;background:var(--slot);border-radius:12px;overflow:hidden;border:none;padding:0;cursor:pointer;touch-action:manipulation}
.cell::after{content:"";position:absolute;left:10%;right:10%;bottom:8%;height:10%;background:rgba(0,0,0,.12);border-radius:50%}
.note{position:absolute;top:8%;right:8%;bottom:8%;left:8%;border-radius:4px;background:var(--note);color:#1d2a36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:6px;box-shadow:0 6px 0 rgba(0,0,0,.18);transform:translateY(115%) rotate(-3deg);transition:transform .14s ease-out;z-index:1}
.note.up{transform:translateY(0) rotate(-3deg)}
.note .ico{font-size:36px;font-size:clamp(26px,9vw,46px);line-height:1}
.note .lbl{font-weight:800;font-size:13px;font-size:clamp(11px,3.2vw,15px);line-height:1.15;margin-top:4px}
.note.hot{background:var(--note-hot)}
.note.coffee{background:#fff;border:3px dashed var(--good)}
.note.coffee .lbl{color:#1b6b47}
.note.hit{transition:transform .18s ease-in;transform:translateY(115%) rotate(8deg) scale(.9)}
.stampmark{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.stampmark span{font-family:var(--display);color:var(--stamp);border:4px solid var(--stamp);border-radius:8px;padding:2px 8px;font-size:clamp(16px,5vw,26px);transform:rotate(-14deg) scale(1.6);opacity:0;animation:stamp .5s ease-out forwards;background:var(--panel);background:color-mix(in srgb,var(--panel) 70%,transparent)}
.stampmark.good span{color:var(--good);border-color:var(--good)}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(1.8)}25%{opacity:1;transform:rotate(-14deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-14deg) scale(1)}}
.float{position:absolute;font-family:var(--display);font-size:18px;pointer-events:none;z-index:3;animation:rise .8s ease-out forwards;color:var(--ink)}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
.desk.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.shout{min-height:24px;font-weight:800;font-size:16px;text-align:center;color:var(--accent)}

.overlay{position:relative;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;box-sizing:border-box;z-index:5;overflow:hidden;min-height:0}
.overlay h2{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(22px,6vw,30px);text-wrap:balance}
.overlay p{margin:0;max-width:36ch;line-height:1.5;color:var(--muted)}
.overlay .rank{font-family:var(--display);font-size:clamp(20px,6vw,28px);color:var(--accent)}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
.legend span{background:var(--panel);border:1.5px solid var(--line);border-radius:99px;padding:3px 10px}
.big{font-family:var(--display);font-size:20px;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 32px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.tip{font-size:13px;color:var(--muted)}
/* ===== Luôn vừa một màn hình: thu gọn dần theo chiều cao ===== */
@media (max-height:760px){.overlay{gap:8px;padding:12px}.overlay .tip{display:none}.stat{padding:4px 10px}.stat b{font-size:21px}.shout{min-height:20px;font-size:15px}}
@media (max-height:640px){.overlay p{display:none}.overlay .legend span{padding:2px 8px;font-size:12px}.overlay .big{font-size:17px;padding:9px 26px}.overlay h2{font-size:clamp(18px,5vw,24px)}.overlay .rank{font-size:clamp(16px,5vw,22px)}}
@media (max-height:600px){body{gap:8px;padding-top:60px}.top h1{font-size:22px}.icon-btn{padding:4px 12px}.overlay .legend{display:none}.overlay{gap:6px}.stat small{font-size:10px}}
/* màn hình ngang thấp (điện thoại xoay ngang): bảng điểm bên trái, bàn chơi bên phải */
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:max(150px,min(100dvh - 24px,100vw - 340px))}
  body{display:grid;grid-template-columns:minmax(150px,1fr) var(--w);grid-template-rows:1fr auto auto auto auto 1fr;align-content:stretch;justify-content:center;column-gap:20px;row-gap:8px;padding:12px 16px}
  .top{grid-column:1;grid-row:2;max-width:none}.stats{grid-column:1;grid-row:3;max-width:none}.timebar{grid-column:1;grid-row:4;max-width:none}.shout{grid-column:1;grid-row:5}.desk-wrap{grid-column:2;grid-row:1 / span 6;align-self:center}
  .overlay p,.overlay .legend,.overlay .tip{display:none}.overlay h2{font-size:clamp(16px,3.4vh,22px)}
}
@media (prefers-reduced-motion: reduce){.note,.note.hit{transition:none}.desk.shake{animation:none}.float{animation-duration:.01s}}
</style>
</head>
<body>

<div class="top">
  <h1>Đập <span>Deadline</span></h1>
  <button class="icon-btn" id="soundBtn" aria-pressed="true">Âm thanh: Bật</button>
</div>

<div class="stats">
  <div class="stat"><small>Điểm</small><b id="score">0</b></div>
  <div class="stat"><small>Combo</small><b id="combo">×0</b></div>
  <div class="stat"><small>Còn lại</small><b id="time">45s</b></div>
</div>
<div class="timebar"><i id="bar"></i></div>

<div class="desk-wrap">
  <div class="desk" id="desk"></div>
  <div class="overlay" id="overlay">
    <h2>Hết giờ làm thì đập nốt deadline</h2>
    <p>Phiền toái văn phòng sẽ ló lên từ bàn làm việc. Chạm thật nhanh để đóng dấu <b>XONG</b>. Gặp ly cà phê thì chạm để được thêm giờ.</p>
    <div class="legend"><span>📧 Email gấp</span><span>📅 Họp</span><span>📞 Sếp gọi</span><span>☕ +3 giây</span></div>
    <button class="big" id="startBtn">Bắt đầu đập</button>
    <div class="tip">45 giây · chơi xong nhớ đứng dậy vươn vai · v3</div>
  </div>
</div>
<div class="shout" id="shout" aria-live="polite"></div>

<script>
const PESTS=[
  {ico:"📧",lbl:"Email GẤP!!!",pts:10},
  {ico:"📅",lbl:"Họp 5 phút thôi",pts:10},
  {ico:"📞",lbl:"Sếp gọi",pts:15,hot:true},
  {ico:"⏰",lbl:"Deadline hôm qua",pts:20,hot:true},
  {ico:"📊",lbl:"Excel #REF!",pts:10},
  {ico:"🖨️",lbl:"Máy in kẹt giấy",pts:10},
  {ico:"💬",lbl:"\"Em ơi, tí nhé\"",pts:10},
  {ico:"🔁",lbl:"Sửa lần cuối (v7)",pts:15,hot:true},
  {ico:"🐌",lbl:"Wifi chập chờn",pts:10},
  {ico:"📝",lbl:"Báo cáo tuần",pts:10},
];
const COFFEE={ico:"☕",lbl:"Cà phê +3s",coffee:true};
const SHOUTS=["Gọn gàng!","Đóng dấu luôn!","Không cần họp lại!","Inbox zero!","Sếp duyệt rồi!","Chiến quá!","Xả stress thành công!"];
const RANKS=[
  [0,"Thực tập sinh ngơ ngác","Mới khởi động thôi. Uống ngụm nước rồi thử lại nhé."],
  [150,"Nhân viên chăm chỉ","Bớt được vài cái deadline rồi đó."],
  [350,"Trưởng nhóm bình tĩnh","Phiền toái nào cũng xử gọn."],
  [600,"Chiến thần KPI","Văn phòng nên treo ảnh bạn ở sảnh."],
  [900,"Huyền thoại tan làm đúng giờ","Không deadline nào sống sót."],
];
const ROUND=45;
const desk=document.getElementById("desk");
const $=id=>document.getElementById(id);
const cells=[];
for(let i=0;i<9;i++){
  const c=document.createElement("button");
  c.className="cell";c.id="cell"+i;c.setAttribute("aria-label","Ô bàn "+(i+1));
  const n=document.createElement("div");n.className="note";n.innerHTML='<div class="ico"></div><div class="lbl"></div>';
  c.appendChild(n);desk.appendChild(c);
  const st={el:c,note:n,item:null,timer:0,up:false};
  if(window.PointerEvent)c.addEventListener("pointerdown",e=>{e.preventDefault();hit(st,e)});
  else c.addEventListener("touchstart",e=>{e.preventDefault();hit(st,e)},{passive:false});
  c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();hit(st)}});
  cells.push(st);
}

let score=0,combo=0,best=0,timeLeft=ROUND,running=false,spawnT=0,tickT=0,lastHit=0,sound=true,ac=null;

function audio(){if(!sound)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}}
function thwack(good){
  const a=audio();if(!a)return;const t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type=good?"triangle":"square";
  o.frequency.setValueAtTime(good?520:180+Math.min(combo,10)*25,t);
  o.frequency.exponentialRampToValueAtTime(good?980:60,t+.12);
  g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.17);
  // short noise burst for the "stamp" thud
  const len=a.sampleRate*.06,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),g2=a.createGain();s.buffer=b;g2.gain.value=.25;s.connect(g2).connect(a.destination);s.start(t);
}
function buzz(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="sawtooth";o.frequency.value=110;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.13)}

function show(st,item,stay){
  st.item=item;st.up=true;
  st.note.className="note"+(item.hot?" hot":"")+(item.coffee?" coffee":"");
  st.note.querySelector(".ico").textContent=item.ico;
  st.note.querySelector(".lbl").textContent=item.lbl;
  void st.note.offsetWidth;st.note.classList.add("up");
  clearTimeout(st.timer);
  st.timer=setTimeout(()=>{ if(st.up){ hide(st); if(!item.coffee){combo=0;render()} } },stay);
}
function hide(st){st.up=false;st.item=null;st.note.classList.remove("up")}

function spawn(){
  if(!running)return;
  const free=cells.filter(c=>!c.up);
  const progress=1-timeLeft/ROUND;            // speeds up over the round
  if(free.length){
    const st=free[Math.floor(Math.random()*free.length)];
    const item=Math.random()<.08?COFFEE:PESTS[Math.floor(Math.random()*PESTS.length)];
    show(st,item,1250-progress*550);
    if(progress>.4&&Math.random()<.35&&free.length>1){
      const st2=free.filter(c=>c!==st)[Math.floor(Math.random()*(free.length-1))];
      show(st2,PESTS[Math.floor(Math.random()*PESTS.length)],1150-progress*500);
    }
  }
  spawnT=setTimeout(spawn,720-progress*360);
}

function hit(st,e){
  if(!running)return;
  if(!st.up){combo=0;render();buzz();desk.classList.remove("shake");void desk.offsetWidth;desk.classList.add("shake");return}
  const item=st.item;clearTimeout(st.timer);
  st.up=false;st.note.classList.add("hit");
  setTimeout(()=>{st.note.classList.remove("hit");if(!st.up)st.note.classList.remove("up")},180);
  const mark=document.createElement("div");mark.className="stampmark"+(item.coffee?" good":"");
  mark.innerHTML="<span>"+(item.coffee?"+3S":"XONG")+"</span>";st.el.appendChild(mark);setTimeout(()=>mark.remove(),520);
  let gained=0;
  if(item.coffee){timeLeft=Math.min(ROUND,timeLeft+3);thwack(true)}
  else{
    const now=performance.now();combo=(now-lastHit<1400)?combo+1:1;lastHit=now;best=Math.max(best,combo);
    gained=item.pts*(1+Math.floor(combo/5));score+=gained;thwack(false);
    if(combo>0&&combo%5===0)say("Combo ×"+combo+"! "+SHOUTS[Math.floor(Math.random()*SHOUTS.length)]);
  }
  const f=document.createElement("div");f.className="float";f.textContent=item.coffee?"+3s":"+"+gained;
  const r=st.el.getBoundingClientRect(),dr=desk.parentElement.getBoundingClientRect();
  f.style.left=(r.left-dr.left+r.width/2-16)+"px";f.style.top=(r.top-dr.top+8)+"px";
  desk.parentElement.appendChild(f);setTimeout(()=>f.remove(),800);
  render();
}

let shoutT=0;
function say(t){$("shout").textContent=t;clearTimeout(shoutT);shoutT=setTimeout(()=>$("shout").textContent="",1400)}
function render(){
  $("score").textContent=score;$("combo").textContent="×"+combo;
  $("time").textContent=Math.ceil(timeLeft)+"s";$("bar").style.transform="scaleX("+(timeLeft/ROUND)+")";
}

function start(){
  audio();
  score=0;combo=0;best=0;timeLeft=ROUND;running=true;lastHit=0;
  cells.forEach(hide);$("overlay").hidden=true;render();say("Bắt đầu! Đập hết đi!");window.NP&&NP.start();
  clearTimeout(spawnT);spawn();
  clearInterval(tickT);
  tickT=setInterval(()=>{timeLeft-=.1;if(timeLeft<=0){timeLeft=0;end()}render()},100);
}
function end(){
  running=false;clearInterval(tickT);clearTimeout(spawnT);cells.forEach(c=>{clearTimeout(c.timer);hide(c)});
  let r=RANKS[0];for(const x of RANKS)if(score>=x[0])r=x;
  let hi=0;try{hi=+localStorage.getItem("dapdeadline-hi")||0;if(score>hi)localStorage.setItem("dapdeadline-hi",score)}catch(e){}
  const ov=$("overlay");
  ov.innerHTML='<h2>Tan làm!</h2><div class="rank"></div><p class="desc"></p>'+
    '<div class="legend"><span>Điểm: <b>'+score+'</b></span><span>Combo cao nhất: <b>×'+best+'</b></span>'+
    '<span>Kỷ lục: <b>'+Math.max(hi,score)+'</b></span></div>'+
    '<button class="big" id="againBtn">Đập thêm ván nữa</button>'+
    '<div class="tip">Hít sâu 4 giây, thở ra 4 giây, rồi quay lại làm việc nhé.</div>';
  ov.querySelector(".rank").textContent=r[1];ov.querySelector(".desc").textContent=r[2]+(score>hi&&hi>0?" Kỷ lục mới!":"");
  ov.hidden=false;
  window.NP&&NP.result({score:score,extra:{combo:best}});
  if(window.NP&&NP.helper){   /* người chơi hộ: chỉ 1 lượt, không chơi lại */
    ov.querySelector("#againBtn").remove();ov.querySelector(".tip").textContent="Cảm ơn bạn đã chơi hộ! Kết quả đang được gửi cho bạn của bạn.";
  }else{$("againBtn").addEventListener("click",start);$("againBtn").focus();}
}

$("startBtn").addEventListener("click",start);
$("soundBtn").addEventListener("click",e=>{sound=!sound;e.currentTarget.textContent="Âm thanh: "+(sound?"Bật":"Tắt");e.currentTarget.setAttribute("aria-pressed",sound)});
render();
</script>
</body>
</html>
