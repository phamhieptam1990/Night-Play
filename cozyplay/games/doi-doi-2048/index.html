<style>
:root{--bg:#F3F0FA;--panel:#ffffff;--ink:#1C1833;--muted:#6B6488;--accent:#d96a00;--on:#ffffff;--good:#1a9a55;--bad:#d23b3b;--line:#d7cfee;--pbg:linear-gradient(#ece6ff,#F7F4FC);--board:#d9d0f0;--cell:#c8bde8;
 --display:"Bungee","Arial Black",system-ui,sans-serif;--body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme="dark"]{--bg:#0E1020;--panel:#1b2040;--ink:#f3f0ff;--muted:#a9a3c9;--accent:#ffb020;--on:#2a1a00;--good:#3ddc84;--bad:#ff6b6b;--line:#323a70;--pbg:linear-gradient(#1d2250,#0E1020);--board:#272c5a;--cell:#1b2040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--body);color:var(--ink)}
body{display:flex;justify-content:center}
#play{position:relative;height:100dvh;width:min(100vw,62dvh,520px);container-type:size;overflow:hidden;background:var(--pbg);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.top{position:absolute;left:3cqw;right:3cqw;top:2.5cqw;height:9cqw;display:flex;align-items:center;gap:2cqw;z-index:2}
.top h1{margin:0;flex:1;font:400 4.8cqw/1.05 var(--display);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:9cqw;height:9cqw;min-width:36px;min-height:36px;border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent);border-radius:50%;background:var(--panel);color:var(--ink);font:800 3.6cqw var(--body);cursor:pointer;display:grid;place-items:center;box-shadow:0 .5cqw 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.ib:active{transform:translateY(.5cqw);box-shadow:none}
.scr{position:absolute;left:4cqw;right:4cqw;top:14cqw;bottom:3cqw;display:flex;flex-direction:column;gap:2.4cqw;z-index:1;justify-content:center}
.card{background:var(--panel);border:.5cqw solid var(--line);border-radius:4cqw;padding:2.6cqw;box-shadow:0 1.2cqw 0 rgba(0,0,0,.18)}
.btn{border:0;border-radius:99cqw;min-height:44px;padding:2.4cqw 5cqw;font:800 4.2cqw var(--body);background:var(--accent);color:var(--on);cursor:pointer;box-shadow:0 1cqw 0 rgba(0,0,0,.28)}
.btn.alt{background:var(--panel);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent);box-shadow:0 .6cqw 0 color-mix(in srgb,var(--ink) 18%,transparent)}.btn:active{transform:translateY(.6cqw)}
.row{display:flex;gap:2.2cqw;align-items:center;justify-content:center}.grow{flex:1}.mut{color:color-mix(in srgb,var(--ink) 68%,transparent);font-size:3.3cqw}
.chips{display:flex;gap:2cqw;justify-content:center;flex-wrap:wrap}.chip{background:var(--panel);border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:99cqw;padding:1.2cqw 3cqw;font-size:3.5cqw;font-weight:800}
.hero{text-align:center;font-size:19cqw;line-height:1.05}
.dbtn{display:flex;align-items:center;gap:3cqw;text-align:left;width:100%}.dbtn .n{font:400 7cqw var(--display)}
/* ván chơi */
#game{gap:2cqw}
.stats{display:flex;gap:2cqw}.st{flex:1;background:var(--panel);border:.5cqw solid var(--line);border-radius:3cqw;padding:1.4cqw 2cqw;text-align:center}.st b{display:block;font:400 6cqw var(--display);color:var(--accent);line-height:1.1}.st span{font-size:2.9cqw;color:color-mix(in srgb,var(--ink) 65%,transparent);font-weight:800}
.board{position:relative;align-self:center;width:min(92cqw,calc(100cqh - 66cqw));aspect-ratio:1;background:var(--board);border-radius:3.4cqw;container-type:size;box-shadow:0 1.2cqw 0 rgba(0,0,0,.2)}
.cell{position:absolute;width:22.5%;height:22.5%;border-radius:12%;background:var(--cell);opacity:.8}
.tile{position:absolute;width:22.5%;height:22.5%;border-radius:12%;display:grid;place-items:center;left:calc(var(--c)*25% + 1.25%);top:calc(var(--r)*25% + 1.25%);transition:left .11s ease,top .11s ease;font-size:15cqw;line-height:1;background:linear-gradient(145deg,hsl(var(--h) 85% 82%),hsl(var(--h) 75% 62%));box-shadow:0 .8cqw 0 hsl(var(--h) 60% 42%);color:#222}
.tile i{font-style:normal;filter:drop-shadow(0 .5cqw .5cqw rgba(0,0,0,.25))}.tile small{position:absolute;right:7%;bottom:3%;font:800 5.4cqw var(--body);color:hsl(var(--h) 60% 22%);opacity:.8}
.tile.new{animation:pop .18s ease-out}.tile.mg{animation:pulse .2s ease-out}.tile.go{transition:none}
@keyframes pop{from{transform:scale(.3);opacity:.2}}@keyframes pulse{50%{transform:scale(1.22)}}
.tys{display:grid;grid-template-columns:repeat(4,1fr);gap:1.8cqw}.ty{position:relative;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);background:var(--panel);color:var(--ink);border-radius:3cqw;padding:1.6cqw .6cqw;font:800 2.9cqw var(--body);min-height:44px;cursor:pointer;text-align:center}.ty .e{display:block;font-size:7.4cqw;line-height:1.1}.ty.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel));box-shadow:0 0 0 .5cqw color-mix(in srgb,var(--accent) 45%,transparent)}.ty.lock{opacity:.8}.ty.lock::after{content:'🔒';position:absolute;top:.4cqw;right:1cqw;font-size:3.4cqw}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}.skc{position:relative;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:3.4cqw;padding:2.2cqw;background:var(--panel);color:var(--ink);font:800 3.6cqw var(--body);cursor:pointer;min-height:44px}.skc.on{border-color:var(--accent)}.skc .e{font-size:9cqw;display:block}.skc.lock{opacity:.75}.skc.lock::after{content:'🔒';position:absolute;top:1.2cqw;right:2cqw;font-size:4cqw}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.5}.deco i{position:absolute;font-style:normal;font-size:9cqw;animation:fl 9s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-3cqw) rotate(8deg)}}
.tgt{display:flex;align-items:center;gap:2cqw;background:var(--panel);border:.5cqw solid var(--line);border-radius:99cqw;padding:.8cqw 3cqw;font:800 3.2cqw var(--body)}.tgt i{flex:1;height:2.2cqw;border-radius:9cqw;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;font-style:normal}.tgt b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ff5a3d);transition:width .3s}.tgt.beat{border-color:var(--good);box-shadow:0 0 3cqw color-mix(in srgb,var(--good) 55%,transparent)}.tgt.beat b{background:var(--good)}
.st.pulse{animation:stp .35s ease-out}@keyframes stp{40%{transform:scale(1.18);border-color:var(--accent)}}
.lad{display:flex;justify-content:center;gap:1cqw;flex-wrap:wrap;font-size:5.4cqw}.lad i{font-style:normal;opacity:.28;filter:grayscale(1)}.lad i.on{opacity:1;filter:none}.lad i.cur{transform:scale(1.35);filter:drop-shadow(0 0 1.2cqw var(--accent))}
.hint{text-align:center}
/* kết thúc */
.big{font:400 11cqw var(--display);color:var(--accent);text-align:center;line-height:1.1}.bt{font-size:26cqw;text-align:center;line-height:1}.rk{text-align:center;font:800 5cqw var(--body)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;width:36cqw;margin:0 auto;font-size:7cqw;text-align:center;line-height:1.1}.mini span{background:var(--cell);border-radius:1.6cqw;min-height:8cqw}
.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:7;display:flex;flex-direction:column;justify-content:center;gap:2.6cqw;padding:5cqw;text-align:center}
.ov h2{margin:0;font:400 6cqw var(--display);color:var(--accent)}.ov p{margin:0;font-size:4cqw;line-height:1.35}
.toast{position:absolute;left:50%;bottom:6cqw;transform:translateX(-50%);background:#fff;color:#111;padding:2cqw 4cqw;border-radius:99cqw;font-weight:800;font-size:3.6cqw;z-index:9;max-width:92%;text-align:center}
@container (max-height:640px){#hSub,#hNote,#hLad{display:none}.hero{font-size:13cqw}.ty .e{font-size:6cqw}}
@container (max-height:520px){.hero{font-size:9cqw}.lad{display:none}.st b{font-size:5cqw}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>
<script>
"use strict";
const GID="doi-doi-2048",$=id=>document.getElementById(id),N=4,MAXS=20000,DAILY_CAP=50;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pickLang=()=>{const q=new URLSearchParams(location.search).get("lang");let st=null;try{st=localStorage.getItem("lang")}catch(e){}return [q,st].find(x=>x==="vi"||x==="en")||(/^vi/i.test(navigator.language||"")?"vi":"en")};
let LANG=pickLang();
/* thang đổi đời: ghép 2 món giống nhau ⇒ lên bậc */
const LADDER=[["🥚","Trứng","Egg"],["🐣","Gà con","Chick"],["🐔","Gà mái","Hen"],["🐖","Heo","Pig"],["🐄","Bò","Cow"],["🌾","Thửa ruộng","Rice field"],["🛖","Nhà tranh","Hut"],["🏠","Nhà cấp 4","Small house"],["🏡","Nhà vườn","Garden house"],["🏢","Nhà phố","Townhouse"],["🏰","Biệt thự","Villa"]];
const HUE=[48,38,28,350,330,120,95,200,170,265,300];
const TYPES=[["🏰","Đổi Đời","Life Upgrade"],["🍜","Ẩm Thực","Foodie"],["🚀","Vũ Trụ","Space"],["💰","Tiền Tài","Money"]];
const CATALOG=[[["basic","Cơ bản","Basic","🥚"],["farm","Nông trại","Farm","🌾"],["night","Đêm sao","Starry night","🌙"],["sakura","Anh đào","Sakura","🌸"],["neon","Neon","Neon","⚡"]],[["std","Mặc định","Classic","🍜"],["street","Vỉa hè","Street food","🍢"],["fine","Nhà hàng sang","Fine dining","🍷"],["candy","Kẹo ngọt","Candy","🍭"],["retro","Quán xưa","Retro café","☕"]],[["std","Mặc định","Classic","🚀"],["nebula","Tinh vân","Nebula","🌌"],["mars","Sao Hỏa","Mars","🔴"],["aurora","Cực quang","Aurora","🌠"],["retro8","Game 8-bit","8-bit","👾"]],[["std","Mặc định","Classic","💰"],["gold","Vàng ròng","Pure gold","👑"],["jade","Ngọc bích","Jade","🍀"],["cyber","Tiền số","Cyber","💻"],["vault","Két sắt","Vault","🔐"]]];
const RANKS=[["Ở trọ","Renting"],["Có ruộng","Landowner"],["Có nhà","Homeowner"],["Chủ nhà phố","Townhouse owner"],["Đại gia biệt thự","Villa tycoon"]];
const rankOf=l=>l>=11?4:l>=10?3:l>=8?2:l>=6?1:0;
const I18={vi:{rankHint:"Chơi “Đề hôm nay” để lên bảng điểm nhé!",title:"Đổi Đời 2048",sub:"Ghép 2 món giống nhau để lên bậc. Từ quả trứng tới biệt thự!",daily:"Đề hôm nay",dS:"Cả nước cùng một bàn · 50 nước",done:"Hôm nay bạn được {s} · chơi lại để cao hơn",free:"🎲 Chơi thoải mái",streak:"🔥 {n} ngày",best:"🏆 Cao nhất {n}",tot:"🎮 {n} ván",note:"Vuốt hoặc dùng phím mũi tên. Chỉ để giải trí.",
 sc:"Điểm",mv:"Nước đi",bt:"Cao nhất",left:"Còn {n} nước",moves:"{n} nước",endT:"Ván kết thúc",endN:"Hết nước đi!",endC:"Hết lượt {n} nước",vsC:"Thách đấu: bạn {a} — người gửi {b}",win:"Bạn lên đời cao hơn! 🎉",lose:"Chưa bằng, thử lại nhé!",tie:"Hòa!",ch:"Bạn bị thách!",chP:"Bạn bè đạt {s} điểm trong {m} nước, cùng một bàn. Bạn làm được không?",chGo:"Chơi thử",
 skin:"Giao diện",lockP:"Loại chơi và giao diện này dành cho Night Pass. Dùng thử 1 ván mỗi ngày hoặc mở khoá tất cả.",trial:"🎈 Dùng thử 1 ván",go:"Mở Night Pass",tried:"Hôm nay bạn đã dùng thử rồi",chL:"Bàn thách đấu thuộc loại “{t}” (Night Pass). Dùng thử 1 ván để nhận thách.",tgt:"⚔ Mục tiêu {n}",beat:"Vượt điểm bạn bè rồi! 🎉",rem:"Đấu lại cùng bàn",cmb:["Hay!","Giỏi!","Tuyệt!","Siêu hạng!"],lvl:"Lên đời: {a}!",share:"Đổi Đời 2048",ask:"Bạn lên đời cao hơn mình không?",copied:"Đã chép — dán cho bạn bè nhé!",reached:"Tới",first:"🎉 Đổi đời thành công: Biệt thự!"},
 en:{rankHint:"Play “Today's round” to make the leaderboard!",title:"Life Upgrade 2048",sub:"Merge two of the same to level up. From an egg to a villa!",daily:"Today's board",dS:"Everyone plays the same board · 50 moves",done:"Today you scored {s} · play again to beat it",free:"🎲 Free play",streak:"🔥 {n} days",best:"🏆 Best {n}",tot:"🎮 {n} games",note:"Swipe or use arrow keys. Just for fun.",
 sc:"Score",mv:"Moves",bt:"Best",left:"{n} moves left",moves:"{n} moves",endT:"Game over",endN:"No moves left!",endC:"Out of moves ({n})",vsC:"Challenge: you {a} — sender {b}",win:"You upgraded higher! 🎉",lose:"Not quite — try again!",tie:"Tie!",ch:"You're challenged!",chP:"A friend scored {s} in {m} moves on this exact board. Can you beat it?",chGo:"Try it",
 skin:"Theme",lockP:"This game type and theme are for Night Pass. Try one round a day or unlock everything.",trial:"🎈 Try 1 round",go:"Get Night Pass",tried:"You already used today's trial",chL:"This challenge uses the “{t}” type (Night Pass). Try one round to accept.",tgt:"⚔ Target {n}",beat:"You passed your friend! 🎉",rem:"Rematch same board",cmb:["Nice!","Great!","Awesome!","Legendary!"],lvl:"Level up: {a}!",share:"Life Upgrade 2048",ask:"Can you upgrade higher than me?",copied:"Copied — paste it to a friend!",reached:"Reached",first:"🎉 Made it: a villa!"}};
const T=(k,o)=>{let s=(I18[LANG][k]!=null?I18[LANG][k]:I18.vi[k]);if(typeof s==="string"&&o)for(const x in o)s=s.replace("{"+x+"}",o[x]);return s};
const nm=l=>LANG==="vi"?lad()[l-1][1]:lad()[l-1][2];
const isDark=()=>document.documentElement.dataset.theme==="dark";
addEventListener("storage",e=>{if(e.key==="theme"){document.documentElement.dataset.theme=e.newValue||"light";applySkin()}});
/* ===== RNG / NGÀY ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fnv=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const dayKey=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date());
const dayNo=k=>Math.floor((Date.parse(k+"T00:00:00Z")-Date.parse("2026-01-01T00:00:00Z"))/864e5)+1;
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function parseCh(h){try{const m=/[#&]ch=([A-Za-z0-9_-]{1,200})/.exec(h||"");if(!m)return null;let t=m[1].replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const o=JSON.parse(decodeURIComponent(escape(atob(t))));
 if(o&&Number.isInteger(o.s)&&o.s>=0&&o.s<=4294967295&&Number.isInteger(o.sc)&&o.sc>=0&&o.sc<=MAXS){const mv=Number.isInteger(o.mv)&&o.mv>=5&&o.mv<=500?o.mv:DAILY_CAP;const t=Number.isInteger(o.t)&&o.t>=0&&o.t<=3?o.t:0;return{s:o.s,sc:o.sc,mv,t}}return null}catch(e){return null}}
/* ===== LOẠI GAME / GIAO DIỆN (Night Pass) ===== */
const PF={pro:null,ticket:null,types:TYPES,
 lad:[LADDER,null,null,null],hue:[HUE,null,null,null],ranks:[RANKS,null,null,null],sub:[[I18.vi.sub,I18.en.sub],null,null,null],
 skins:[{basic:{}},{},{},{}],
 skinSel:(()=>{const v=LS.get("d48-skin",[]);return Array.from({length:4},(_,i)=>Array.isArray(v)&&typeof v[i]==="string"&&/^[a-z0-9]{3,10}$/.test(v[i])?v[i]:(i?"std":"basic"))})()};
let TY=(()=>{const v=LS.get("d48-type",0);return Number.isInteger(v)&&v>=0&&v<4?v:0})();
const tLocked=t=>!PF.lad[t];
