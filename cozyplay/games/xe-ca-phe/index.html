:root{--bg:#FFF6E6;--panel:#ffffff;--ink:#3a2410;--muted:#7a5a3a;--accent:#e0661a;--on:#ffffff;--good:#1a9a55;--bad:#d23b3b;--line:#ecd2a6;--pbg:linear-gradient(#ffe9bf,#fff6e6);--field:#fff1d6;--field2:#f5dba6;
