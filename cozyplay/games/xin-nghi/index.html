<style>
:root{--bg:#F3F0FA;--panel:#ffffff;--ink:#1C1833;--muted:#6B6488;--accent:#e0661a;--on:#ffffff;--good:#1a9a55;--bad:#d23b3b;--line:#d7cfee;--pbg:linear-gradient(#fff0e2,#F7F4FC);--display:"Bungee","Arial Black",system-ui,sans-serif;--body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme="dark"]{--bg:#0E1020;--panel:#1d2147;--ink:#f3f0ff;--muted:#a9a3c9;--accent:#ff8a3d;--on:#2a1200;--good:#3ddc84;--bad:#ff5c6c;--line:#343b73;--pbg:linear-gradient(#2a2160,#0E1020)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--body);color:var(--ink)}
body{display:flex;justify-content:center}
#play{position:relative;height:100dvh;width:min(100vw,66dvh,520px);container-type:size;overflow:hidden;background:var(--pbg);color:var(--ink)}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.45}.deco i{position:absolute;font-style:normal;font-size:9cqw;animation:fl 9s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-3cqw) rotate(8deg)}}
.top{position:absolute;left:3cqw;right:3cqw;top:2.5cqw;height:9cqw;display:flex;align-items:center;gap:2cqw;z-index:2}
.top h1{margin:0;flex:1;font:400 4.3cqw/1.05 var(--display);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:9cqw;height:9cqw;min-width:36px;min-height:36px;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink);font:800 3.6cqw var(--body);cursor:pointer;display:grid;place-items:center}
.scr{position:absolute;left:4cqw;right:4cqw;top:14cqw;bottom:3cqw;display:flex;flex-direction:column;gap:2.2cqw;z-index:1}
.card{background:var(--panel);border:.5cqw solid var(--line);border-radius:4cqw;padding:2.6cqw;box-shadow:0 1.2cqw 0 rgba(0,0,0,.25)}
.btn{border:0;border-radius:99cqw;min-height:44px;padding:2.4cqw 5cqw;font:800 4.2cqw var(--body);background:var(--accent);color:var(--on);cursor:pointer;box-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.btn.alt{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink);box-shadow:none}.btn:active{transform:translateY(.6cqw)}.btn:disabled{opacity:.45}
.row{display:flex;gap:2.2cqw;align-items:center;justify-content:center}.grow{flex:1}.mut{color:var(--muted);font-size:3.3cqw}
.boss{display:flex;gap:3cqw;align-items:center}.boss .av{font-size:17cqw;line-height:1;position:relative}.boss .av small{position:absolute;right:-2cqw;bottom:-1cqw;font-size:8cqw}
.bub{flex:1;background:#fff;color:#1c1833;border-radius:3.4cqw;padding:2.2cqw 3cqw;font-weight:800;font-size:3.6cqw;line-height:1.3;position:relative}.bub::before{content:"";position:absolute;left:-2cqw;top:6cqw;border:2.4cqw solid transparent;border-right-color:#fff;border-left:0}
.hints{display:flex;gap:1.6cqw;flex-wrap:wrap}.hint{background:color-mix(in srgb,var(--ink) 1200%,transparent);border-radius:99cqw;padding:1cqw 2.6cqw;font-size:3.3cqw;font-weight:800}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:2.2cqw}.cat{border:.5cqw solid var(--line);background:var(--panel);color:var(--ink);border-radius:3.4cqw;padding:2cqw;font:800 3.8cqw var(--body);min-height:44px;cursor:pointer;text-align:center}.cat .e{display:block;font-size:9cqw;line-height:1.1}.cat:active{transform:scale(.97)}
.opt{display:block;width:100%;text-align:left;border:.5cqw solid var(--line);background:var(--panel);color:var(--ink);border-radius:3cqw;padding:2.2cqw 3cqw;font:600 3.7cqw/1.3 var(--body);min-height:44px;cursor:pointer;margin-bottom:1.8cqw}.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--ink) 1400%,transparent)}
.mods{display:flex;gap:2cqw}.mod{flex:1;border:.5cqw solid var(--line);background:transparent;color:var(--ink);border-radius:3cqw;min-height:44px;font:800 3.3cqw var(--body);cursor:pointer;padding:1cqw}.mod.on{border-color:var(--accent);background:color-mix(in srgb,var(--ink) 1600%,transparent)}
textarea{width:100%;height:20cqw;border-radius:3cqw;border:.5cqw solid var(--line);background:var(--panel);color:var(--ink);font:600 3.8cqw var(--body);padding:2cqw;resize:none}
.stamp{font:400 11cqw var(--display);border:1.2cqw solid;padding:.6cqw 3cqw;border-radius:2cqw;transform:rotate(-8deg);display:inline-block;animation:st .35s cubic-bezier(.2,1.6,.4,1) both}@keyframes st{from{transform:rotate(-8deg) scale(2.4);opacity:0}}
.stamp.ok{color:var(--good);border-color:var(--good)}.stamp.no{color:var(--bad);border-color:var(--bad)}.stamp.half{color:#ffd24a;border-color:#ffd24a}
.quote{font-style:italic;font-size:3.8cqw;line-height:1.35}.meter{height:3.6cqw;border-radius:9cqw;background:color-mix(in srgb,var(--ink) 1400%,transparent);overflow:hidden}.meter b{display:block;height:100%;background:linear-gradient(90deg,var(--bad),#ffd24a,var(--good));width:0;transition:width .7s}
.chips{display:flex;gap:2cqw;justify-content:center;flex-wrap:wrap}.chip{background:color-mix(in srgb,var(--ink) 1200%,transparent);border-radius:99cqw;padding:1.2cqw 3cqw;font-size:3.5cqw;font-weight:800}

.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:7;display:flex;flex-direction:column;justify-content:center;gap:2.6cqw;padding:5cqw;text-align:center}
.ov h2{margin:0;font:400 6cqw var(--display);color:var(--accent)}.ov .btn.alt,.ov .skc{background:var(--panel)}.ov p{margin:0;font-size:4cqw;line-height:1.35}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}.skc{position:relative;border:.5cqw solid var(--line);border-radius:3.4cqw;padding:2.2cqw;background:var(--panel);color:var(--ink);font:800 3.6cqw var(--body);cursor:pointer;min-height:44px}.skc.on{border-color:var(--accent)}.skc .e{font-size:9cqw;display:block}.skc.lock{opacity:.7}.skc.lock::after{content:"🔒";position:absolute;top:1.2cqw;right:2cqw;font-size:4cqw}
.toast{position:absolute;left:50%;bottom:6cqw;transform:translateX(-50%);background:#fff;color:#111;padding:2cqw 4cqw;border-radius:99cqw;font-weight:800;font-size:3.6cqw;z-index:9;max-width:92%;text-align:center}
#home,#ask,#res{justify-content:center}
@container (max-height:440px){#aHints{display:none}.boss .av{font-size:12cqw}.opt{margin-bottom:1cqw}}
.ib{background:var(--panel);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent);box-shadow:0 .5cqw 0 color-mix(in srgb,var(--ink) 18%,transparent);font-weight:800}
.ib:active{transform:translateY(.5cqw);box-shadow:none}
.btn.alt{background:var(--panel);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 38%,transparent);box-shadow:0 .6cqw 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.chip,.hint{background:var(--panel);border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);color:var(--ink)}
.mut{color:color-mix(in srgb,var(--ink) 68%,transparent)}
.mod{border-color:color-mix(in srgb,var(--ink) 45%,transparent);background:var(--panel)}.mod.on{background:color-mix(in srgb,var(--accent) 30%,var(--panel));border-color:var(--accent)}
.cat,.opt,.skc{border-color:color-mix(in srgb,var(--ink) 40%,transparent)}.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel))}
.top h1{text-shadow:0 .3cqw 0 color-mix(in srgb,var(--bg) 70%,transparent)}
.tgt{display:flex;align-items:center;gap:2cqw;background:var(--panel);border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:99cqw;padding:.8cqw 3cqw;font:800 3.2cqw var(--body)}.tgt i{flex:1;height:2.2cqw;border-radius:9cqw;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;font-style:normal}.tgt b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ff5a3d)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/*sk-rows*/.sk .skc{display:flex;align-items:center;gap:2.6cqw;text-align:left;padding:2cqw 2.6cqw}.sk .skc:last-child:nth-child(odd){grid-column:1/-1}.sk .skc .e{font-size:9.5cqw;line-height:1;flex:none}
</style>

  <div class="deco" id="deco"></div>
  <div class="top"><button class="ib" id="bBk" type="button" hidden aria-label="←">←</button><h1 id="ttl"></h1><button class="ib" id="bBoard" type="button">🏆</button><button class="ib" id="bSnd" type="button">🔊</button><button class="ib" id="bLang" type="button">EN</button></div>

    <div class="row"><button class="btn alt grow" id="bPractice" type="button"></button><button class="ib" id="bSkin" type="button" style="width:12cqw;height:12cqw">🎨</button></div>
    <div class="chips" id="hChips"></div>

  </section>
  <section class="scr" id="ask" hidden>
    <div class="card boss"><div class="av" id="aAv"></div><div class="bub" id="aBub"></div></div>

    <div class="hints" id="aHints"></div>
    <div id="stepA"><div class="mut" id="sAT" style="margin-bottom:1.6cqw"></div><div class="cats" id="cats"></div></div>
    <div id="stepB" hidden>
      <div id="opts"></div><textarea id="own" maxlength="90" hidden></textarea>
      <div class="mods" id="mods"></div>
      <div class="row" style="margin-top:2cqw"><button class="btn alt" id="bBack" type="button">←</button><button class="btn alt" id="bOwn" type="button">✍️</button><button class="btn grow" id="bSend" type="button"></button></div>
    </div>
  </section>
  <section class="scr" id="res" hidden>
    <div class="card" style="text-align:center"><div class="boss" style="justify-content:center"><div class="av" id="rAv"></div><div class="stamp" id="rSt"></div></div><div class="bub" id="rBub" style="margin-top:2.4cqw;text-align:left"></div></div>
    <div class="card"><div class="mut" id="rQT"></div><div class="quote" id="rQ"></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><span class="mut" id="rMT"></span><b id="rPct" style="font:400 7cqw var(--display);color:var(--accent)"></b></div><div class="meter"><b id="rBar"></b></div></div>
    <div class="chips" id="rChips"></div><p class="mut" style="text-align:center;margin:0" id="rVs"></p>
    <div class="row"><button class="btn grow" id="bShare" type="button">📤</button><button class="btn alt" id="bRem" type="button" hidden aria-label="rematch">🔁</button><button class="btn alt" id="bAgain" type="button" aria-label="new">🎲</button><button class="btn alt" id="bHome" type="button">🏠</button></div>
    <p class="mut" id="eLeg" style="text-align:center;margin:0" hidden></p>
  </section>
  <div class="ov" id="ovCh" hidden><h2 id="chH"></h2><p id="chP"></p><div class="row"><button class="btn alt" id="chNo" type="button">✕</button><button class="btn grow" id="chGo" type="button"></button></div></div>
  <div class="ov" id="ovSkin" hidden><h2 id="skH"></h2><div class="sk" id="skG"></div><button class="btn alt" id="skX" type="button">✕</button></div>
  <div class="ov" id="ovPay" hidden><h2>👑 Night Pass</h2><p id="pwP"></p><div class="row" style="flex-wrap:wrap"><button class="btn alt" id="pwNo" type="button">✕</button><button class="btn alt" id="pwTrial" type="button"></button><a class="btn" id="pwGo" target="_top" style="text-decoration:none"></a></div></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script>
"use strict";
const GID="xin-nghi",$=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pickLang=()=>{const q=new URLSearchParams(location.search).get("lang");let st=null;try{st=localStorage.getItem("lang")}catch(e){}return [q,st].find(x=>x==="vi"||x==="en")||(/^vi/i.test(navigator.language||"")?"vi":"en")};
let LANG=pickLang();
/* ===== NỘI DUNG ===== */
const CATS=[
 {id:"sick",e:"🤒",vi:"Ốm đau",en:"Sick",base:50,proof:1,d:[["Em sốt 39 độ, đứng không vững ạ.","I have a 39°C fever and can barely stand."],["Em bị ngộ độc thực phẩm sau bữa trưa qua.","I got food poisoning from yesterday's lunch."],["Lưng em đau, nằm xuống là không dậy nổi ạ.","My back is out — once I lie down I can't get up."]]},
 {id:"family",e:"👨‍👩‍👧",vi:"Gia đình",en:"Family",base:55,proof:1,d:[["Nhà em có việc gia đình gấp ạ.","There's a family emergency at home."],["Con em ốm, em phải đưa đi khám ạ.","My kid is sick, I have to take them to the doctor."],["Bà ngoại em lên thăm, em phải ra bến xe đón ạ.","My grandma is visiting, I have to pick her up."]]},
 {id:"trip",e:"✈️",vi:"Đi chơi",en:"Trip",base:25,proof:0,d:[["Em đã đặt vé đi biển từ 3 tháng trước rồi ạ.","I booked a beach trip three months ago."],["Đám cưới bạn thân em, em vắng là hết bạn ạ.","It's my best friend's wedding — skip it and I lose a friend."],["Em cần ra khỏi thành phố đúng 1 ngày thôi ạ.","I just need to leave the city for exactly one day."]]},
 {id:"absurd",e:"🛸",vi:"Siêu nhiên",en:"Wild",base:20,proof:0,d:[["Em bị người ngoài hành tinh bắt cóc, chưa về kịp ạ.","I was abducted by aliens and haven't made it back."],["Con mèo ngồi lên laptop, em không nỡ gọi nó dậy.","My cat is sleeping on my laptop and I can't wake her."],["Sao Thủy nghịch hành, em không dám ra khỏi nhà.","Mercury is in retrograde and I'm not leaving the house."]]},
 {id:"personal",e:"💼",vi:"Việc riêng",en:"Errands",base:35,proof:1,d:[["Em phải đi gia hạn giấy tờ ở phường ạ.","I have to renew my paperwork at the ward office."],["Em có lịch khám răng hẹn từ tháng trước ạ.","I have a dentist appointment from last month."],["Xe em chết giữa đường, em phải đi sửa ạ.","My bike died on the road and I have to fix it."]]},
 {id:"honest",e:"🙏",vi:"Thật thà",en:"Honest",base:45,proof:0,d:[["Em kiệt sức, xin nghỉ 1 ngày để nạp lại năng lượng ạ.","I'm exhausted and need one day to recharge."],["Em xin nghỉ vì thật sự hôm nay chưa muốn đi làm ạ.","I really don't feel like working today."],["Em cần nghỉ ngơi cho tinh thần ạ, mai em làm bù.","I need a mental-health day — I'll make it up tomorrow."]]}];
const MODS=[{id:"cry",e:"🥹",vi:"Giọng mếu",en:"Teary",b:5},{id:"proof",e:"📎",vi:"Kèm giấy tờ",en:"With proof",b:0},{id:"tea",e:"🧋",vi:"Mời trà sữa",en:"Bubble tea",b:8}];
const MOODS=[{e:"😡",vi:"Sếp đang gắt",en:"Boss is grumpy",b:-15},{e:"😐",vi:"Sếp bình thường",en:"Boss is neutral",b:0},{e:"😄",vi:"Sếp đang vui",en:"Boss is happy",b:15}];
const DAYS=[{id:"normal",e:"📅",vi:"Ngày thường",en:"Regular day",b:0},{id:"deadline",e:"🔥",vi:"Deadline gấp",en:"Urgent deadline",b:-20},{id:"monday",e:"😵",vi:"Thứ Hai uể oải",en:"Monday blues",b:-8}];
const HOLI=[[1,1,"Tết Dương lịch","New Year"],[30,4,"30/4","Reunification Day"],[1,5,"1/5","Labour Day"],[2,9,"Quốc khánh","National Day"],[20,11,"Ngày Nhà giáo","Teachers' Day"]];
const TET={2026:[2,17],2027:[2,6],2028:[1,26]};

 no:[["Không được. Hôm nay đang thiếu người.","No. We're short-staffed today."],["Lý do này sếp nghe 3 lần rồi.","I've heard that excuse three times already."],["Từ chối. Deadline không đợi ai cả.","Denied. Deadlines wait for no one."]],
 half:[["Duyệt NỬA ngày thôi. Chiều quay lại làm.","Half a day only. Be back this afternoon."],["Sếp cho nghỉ buổi sáng, chiều online nhé.","Morning off, online this afternoon."]]};
