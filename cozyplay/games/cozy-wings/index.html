<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cánh Nhỏ Phiêu Lưu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");</script>
<style>
/* Cánh Nhỏ Phiêu Lưu (Cozy Play) — 5 chuyến bay nhẹ nhàng, mỗi chuyến một cách điều khiển riêng, 3 độ khó. Luôn vừa một màn hình. */
:root{--bg:#FFF6EC;--ink:#3b2a1d;--muted:#8a6f5a;--panel:#fff;--line:#f0d9c0;--accent:#FF5A1F;--on-accent:#fff;--sky1:#bfe8ff;--sky2:#eefaff;--good:#2fbf71;--warn:#ffb020;--shadow:0 8px 24px rgba(120,70,20,.18);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 196px)*.75),520px)}
:root[data-theme="dark"]{--bg:#1B2340;--ink:#F2F4FF;--muted:#a9b2d8;--panel:#26305a;--line:#38437a;--accent:#FF7A45;--on-accent:#2a1204;--sky1:#243a7a;--sky2:#3b57a6;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.ib[hidden]{display:none}
.ask{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border-radius:20px;background:var(--panel);box-shadow:var(--shadow)}
.ask .ib{width:44px;height:44px;box-shadow:none;background:var(--accent);color:var(--on-accent)}
#askBtn[hidden]{display:none}#askTxt{flex:1;font-size:clamp(18px,5.6vw,28px);font-weight:800;line-height:1.1;text-align:center}
#askTxt .big{display:inline-block;min-width:1.3em;padding:0 .25em;border-radius:12px;background:var(--accent);color:var(--on-accent);margin:0 2px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.sc{font-size:22px;font-weight:800;display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--warn)}.dots i.miss{background:var(--muted);opacity:.55}
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));box-shadow:var(--shadow);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov[hidden]{display:none}
.ov{color:var(--ink)}.ov .card,.ov .nums button,.ov .sk,.ov .ghost{color:var(--ink)}.ov .big{color:var(--on-accent)}   /* màu chữ của hộp thoại KHÔNG thừa hưởng từ bố cục (vd. Máy game để chữ trắng) */
.ov h2{margin:0;font-size:clamp(24px,7.4vw,38px);font-weight:800;line-height:1.05}
.ov p{margin:0;font-size:clamp(14px,4vw,19px);color:var(--muted);font-weight:700}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);text-align:left;font-size:clamp(17px,5vw,24px);font-weight:800}
.card .e{font-size:clamp(30px,9vw,44px);line-height:1}
.card small{display:block;font-size:.62em;color:var(--muted);font-weight:700}
.card.lock{opacity:.92}.card.lock::after{content:"🔒";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:22px}
.card{padding:0}
.card .main{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;background:none;text-align:left;font:inherit;color:inherit;min-width:0;border-radius:22px}
.card .skinBtn{width:48px;height:48px;margin-right:10px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,var(--panel));font-size:22px;display:grid;place-items:center;flex:none;position:relative}
.card .skinBtn i{position:absolute;right:-4px;top:-4px;font-size:12px;font-style:normal;background:var(--panel);border-radius:50%;padding:1px}
.card:active{transform:scale(.97)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 5px 6px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);font-size:12.5px;font-weight:800;line-height:1.05}
.sk img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:11px;background:var(--line)}
.sk.on{outline:3px solid var(--accent)}.sk.lock img{filter:saturate(.8)}
.sk.lock::after{content:"🔒";position:absolute;right:6px;top:6px;font-size:16px;background:var(--panel);border-radius:50%;padding:2px 3px;line-height:1}
.sk:active{transform:scale(.96)}
.big{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:12px 28px;font-size:clamp(18px,5vw,24px);font-weight:800;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 22px;font-size:clamp(15px,4.2vw,19px);font-weight:800;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stars{font-size:clamp(34px,11vw,56px);letter-spacing:.06em}
.nums{display:flex;gap:12px;justify-content:center}
.nums button{width:clamp(64px,20vw,92px);height:clamp(64px,20vw,92px);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);font-size:clamp(30px,9vw,46px);font-weight:800}
.nums button:active{transform:scale(.93)}.nums button.ok{background:var(--good);color:#fff}.nums button.no{opacity:.4}
.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:4;padding:6px 16px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-weight:800;font-size:clamp(16px,4.8vw,22px);pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast{color:var(--ink)}.toast.on{opacity:1}
@media (max-width:360px){.ask{padding:4px 8px}}
.app[data-layout]{transition:none}
/* ngang (xoay điện thoại): bàn chơi ở giữa-phải, bảng tin bên trái */
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}.ask{min-height:48px}.hud{flex-direction:column;align-items:flex-start}
  .ov{gap:6px;padding:10px}.ov h2{font-size:22px}.ov p{display:none}.card{font-size:15px}.card .main{padding:5px 10px;gap:8px}.card .skinBtn{width:36px;height:36px;font-size:16px;margin-right:6px}.card .e{font-size:26px}.card small{display:none}.skgrid{grid-template-columns:repeat(6,1fr);gap:4px}.sk{font-size:9px;padding:3px}.sk span{display:none}.cards{gap:6px}.nums button{width:56px;height:56px;font-size:28px}.stars{font-size:30px}
}
/* --- độ khó, thanh lửa, hộp chọn nhỏ gọn cho 5 chuyến --- */
.difs{display:flex;gap:6px;justify-content:center}
.dif{padding:7px 18px;border-radius:999px;background:var(--panel);color:var(--ink);font-weight:800;font-size:clamp(14px,4vw,17px);box-shadow:var(--shadow);border:2px solid transparent}
.dif.on{background:var(--accent);color:var(--on-accent)}
.mt{display:inline-block;vertical-align:middle;width:84px;height:10px;border-radius:10px;background:rgba(0,0,0,.25);overflow:hidden;margin-left:6px}.mt i{display:block;height:100%;background:linear-gradient(90deg,#ff7a1a,#ffd23f);border-radius:10px;transition:width .15s}
#askTxt{font-size:clamp(14px,4.2vw,20px)}
.toast{white-space:normal;width:max-content;max-width:88%;text-align:center;line-height:1.2;padding:7px 14px;border-radius:18px}
.sk img{aspect-ratio:1/1}
@media (max-height:780px){#ovPay{gap:8px}#ovPay p{font-size:13px;line-height:1.25}}
@media (max-height:640px){#ovPay p{font-size:12px;line-height:1.25}.sk{padding:3px 3px 4px;font-size:11px}.skgrid{gap:5px;max-width:300px}}
.ov .cards{gap:7px}.card .main{padding:7px 12px}.card .e{font-size:clamp(26px,8vw,36px)}.card{font-size:clamp(15px,4.5vw,20px)}
@media (max-height:700px){.ov{gap:8px;padding:12px}.ov h2{font-size:clamp(20px,6vw,28px)}.ov .cards{gap:5px}.card .main{padding:4px 10px}.card .e{font-size:24px}.card small{font-size:.66em}.card .skinBtn{width:38px;height:38px;font-size:18px}.dif{padding:5px 14px}}
@media (max-height:600px){.card small{display:none}}
@media (max-height:520px) and (min-aspect-ratio:11/10){#ovPay h2{font-size:17px}#ovPay .big{padding:5px 12px;font-size:13px;line-height:1.1}#ovPay .ghost{padding:4px 10px;font-size:12px}#ovPay .row{gap:5px}#ovStart h2{display:none}.cards{display:flex;flex-direction:column;max-width:none;gap:3px}.card .main{padding:2px 8px;gap:6px}.card .e{font-size:20px}.card .skinBtn{width:28px;height:28px;font-size:13px;margin-right:4px}.card{font-size:13px}.difs .dif{padding:2px 10px;font-size:12px}.ov{gap:3px}.mt{width:56px}}
[hidden]{display:none!important}
/* màu nền đổi theo độ khó: Dễ = bạc hà, Vừa = hổ phách, Khó = đỏ rực trên nền tối */
body{transition:background .4s,color .4s}
:root[data-diff="easy"]{--bg:#E6F8EE;--accent:#1FB574;--line:#cdeedc}
:root[data-diff="easy"][data-theme="dark"]{--bg:#0E2A22;--accent:#2FD68E;--panel:#173b30;--line:#245443;--on-accent:#06281b}
:root[data-diff="mid"]{--bg:#FFF0D6;--accent:#FF8A1F;--line:#f6dbb0}
:root[data-diff="mid"][data-theme="dark"]{--bg:#2b1a0a;--accent:#FFA33D;--panel:#40280f;--line:#5c3d18;--on-accent:#2a1204}
:root[data-diff="hard"],:root[data-diff="hard"][data-theme="dark"]{--bg:#1c0710;--ink:#ffe9ee;--muted:#d99aa8;--panel:#34121f;--line:#53202f;--accent:#FF3B4E;--on-accent:#fff;--shadow:0 8px 24px rgba(255,40,70,.28)}
:root[data-diff="hard"] .play{box-shadow:0 0 0 2px #ff3b4e,0 0 28px rgba(255,59,78,.55)}
:root[data-diff="mid"] .play{box-shadow:0 0 0 2px #ff8a1f,0 8px 24px rgba(255,138,31,.35)}
:root[data-diff="easy"] .play{box-shadow:0 0 0 2px #1fb574,0 8px 24px rgba(31,181,116,.3)}
/* màn chọn chuyến bay: ô ảnh lớn, không chữ */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;max-width:340px}
.tile{position:relative;grid-column:span 2;border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.tile:nth-child(4){grid-column:2/span 2}.tile:nth-child(5){grid-column:4/span 2}
.tile .main{display:block;width:100%;padding:0;background:none;border-radius:inherit}
.tile img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--line)}
.tile.daily{grid-column:1/-1;order:-1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:linear-gradient(90deg,var(--accent),#7a5cff);color:#fff;font-weight:800;font-size:18px}
.tile.daily .de{font-size:30px;line-height:1}.tile.daily .dm,.tile.daily .df{font-size:16px}
.tile .tb{position:absolute;left:6px;top:6px;width:34px;height:34px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
.tile .best{position:absolute;left:6px;bottom:6px;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:12px}
.tile .skinBtn{position:absolute;right:5px;bottom:5px;width:34px;height:34px;margin:0;border-radius:50%;background:var(--panel);font-size:17px;display:grid;place-items:center}
.tile .skinBtn i{position:absolute;right:-3px;top:-3px;font-size:11px;font-style:normal;background:var(--panel);border-radius:50%;padding:1px}
.tile:active{transform:scale(.97)}
.dif{width:48px;height:48px;padding:0;border-radius:50%;font-size:22px;display:grid;place-items:center}
@media (max-height:700px){.tile img{aspect-ratio:1/1}.tile .tb{width:28px;height:28px;font-size:16px}.dif{width:40px;height:40px;font-size:18px}.tiles{gap:6px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){.tiles{grid-template-columns:repeat(5,1fr);gap:4px}.tile,.tile:nth-child(4),.tile:nth-child(5){grid-column:auto}.tile img{aspect-ratio:3/4}.tile .tb,.tile .skinBtn{width:22px;height:22px;font-size:12px}.tile .best{display:none}.dif{width:30px;height:30px;font-size:14px}}   /* thuộc tính hidden luôn thắng display:flex của từng lớp */
/* --- màn giải thích cách chơi trước khi bắt đầu --- */
#ovHow{background:color-mix(in srgb,var(--bg) 60%,transparent);padding:10px;-webkit-backdrop-filter:none;backdrop-filter:none}#ovHow h2{background:var(--panel);color:var(--ink);padding:4px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:clamp(20px,6vw,28px)}
.hwE{display:none}
#ovHow p{background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--ink);padding:3px 12px;border-radius:999px;font-size:clamp(12px,3.6vw,15px)}
.hwL li{display:flex;align-items:center;gap:10px}.hwL li b{font-size:1.5em;line-height:1;width:1.4em;text-align:center;flex:none}
.hwL{list-style:none;margin:0;padding:4px 6px;display:flex;flex-direction:column;gap:0;width:100%;max-width:420px;text-align:left;background:var(--panel);border-radius:20px;box-shadow:var(--shadow)}
.hwL li{color:var(--ink);padding:8px 8px;font-weight:800;font-size:clamp(12px,3.4vw,15px);line-height:1.25}.hwL li+li{border-top:1.5px dashed var(--line)}
@media (max-height:600px){#ovHow{gap:4px;padding:8px}#ovHow h2{font-size:18px;padding:2px 12px}.hwL li{padding:2px 6px;font-size:12px}.hwL li b{font-size:1.15em}#ovHow .ib2{width:40px;height:40px;font-size:18px}#ovHow .big{padding:6px 18px;font-size:15px}}
@media (max-height:700px){#hwR{display:none}#ovHow{gap:6px}.hwL li b{font-size:1.25em}.hwL li{padding:5px 6px;font-size:12.5px}#ovHow .big{padding:8px 22px;font-size:17px}#ovHow .ghost{padding:6px 16px;font-size:14px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){#ovHow h2{font-size:16px;padding:2px 12px}.hwE{display:none}#ovHow p{display:none}.hwL li{padding:3px 8px;font-size:11px}#ovHow .big{padding:5px 16px;font-size:14px}}
/* --- thách đấu · khoe điểm · combo --- */
#chTrack{display:flex;align-items:center;gap:6px;font:800 12.5px var(--display);white-space:nowrap;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--ink)}#chTrack[hidden]{display:none}
#chTrack .cb{width:46px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}#chTrack .cb i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .2s}#chTrack.beat{color:#e9b949}#chTrack.beat .cb i{background:#e9b949}
.cmb{font-weight:800;color:var(--accent);font-size:15px}
.cpop{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:4;pointer-events:none;font-weight:800;font-size:clamp(22px,7vw,34px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px var(--accent);white-space:nowrap;animation:cpop 1s ease-out forwards}
@keyframes cpop{0%{opacity:0;transform:translateX(-50%) scale(.4)}20%{opacity:1;transform:translateX(-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-26px) scale(1)}}
.vs{display:flex;align-items:center;justify-content:center;gap:12px}.vs-p{display:flex;flex-direction:column;align-items:center;min-width:86px;padding:8px 10px;border-radius:16px;background:var(--panel);border:2px solid var(--line);color:var(--ink)}.vs-p.you{border-color:var(--accent)}
.vs-e{font-size:36px;line-height:1.1}.vs-p b{font-size:30px;line-height:1.1}.vs-p small{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}.vs-x{font-size:28px;font-weight:800;color:#e63946;animation:vsp 1.1s ease-in-out infinite}
@keyframes vsp{50%{transform:scale(1.25) rotate(-6deg)}}
.cd{position:absolute;left:50%;top:50%;z-index:6;transform:translate(-50%,-50%);font-weight:800;font-size:min(34vw,160px);color:var(--accent);text-shadow:0 6px 0 rgba(0,0,0,.3);pointer-events:none;animation:cdp .6s ease-out forwards}
@keyframes cdp{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
.ov h2.chw{color:#e9b949}.ov h2.chl{color:#e63946}
#ovEnd{cursor:pointer}.enT{font-weight:800;opacity:.95;animation:enpulse 1.4s ease-in-out infinite}@keyframes enpulse{50%{opacity:.72}}@media (prefers-reduced-motion:reduce){.enT{animation:none}}
#ovShare .row{gap:6px}#ovShare .ib2{width:44px;height:44px;font-size:20px}#ovShare .ib2.main{width:54px;height:54px;font-size:24px}
.ib2{width:50px;height:50px;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:23px;display:grid;place-items:center;flex:none}.ib2.main{width:62px;height:62px;background:var(--accent);color:var(--on-accent);font-size:27px}.ib2:active{transform:scale(.92)}
#ovShare{justify-content:space-between;padding:12px}#shCanvas{flex:1 1 0;min-height:0;width:auto;max-width:100%;aspect-ratio:9/16;border-radius:14px;box-shadow:var(--shadow);background:#000}
.toast{z-index:9}
#shLink{width:86%;font:12px monospace;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}#shLink[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.vs-x,.cd,.cpop{animation:none}.cpop{opacity:1}}
@media (max-height:640px){.vs-e{font-size:28px}.vs-p b{font-size:24px}.vs-p{padding:5px 8px;min-width:70px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){#ovShare .ib2,#ovShare .ib2.main{width:32px;height:32px;font-size:15px}#ovShare{flex-direction:row;justify-content:center;gap:8px;padding:6px}#ovShare .row{flex-direction:column;flex-wrap:nowrap}#shCanvas{flex:0 1 auto;height:100%;max-height:100%;width:auto}.ib2{width:38px;height:38px;font-size:18px}.ib2.main{width:46px;height:46px;font-size:21px}}

const sfx={flap:()=>tone(520,.08,"triangle",.06),jump:()=>{tone(380,.1,"sine",.08);tone(620,.12,"sine",.07,.06)},splash:()=>tone(180,.14,"sawtooth",.04),good:()=>{tone(660,.1,"triangle",.1);tone(990,.14,"triangle",.1,.07)},bad:()=>{tone(200,.25,"sawtooth",.09);tone(140,.25,"sine",.08,.05)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.12,i*.1)),up:()=>[659,784,988,1319].forEach((f,i)=>tone(f,.14,"triangle",.1,i*.07))};

const TAU=Math.PI*2;
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function disc(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function glow(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(255,255,255,0)");c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function sky(c,stops){const g=c.createLinearGradient(0,0,0,H);stops.forEach((s,i)=>g.addColorStop(i/Math.max(1,stops.length-1),s));c.fillStyle=g;c.fillRect(0,0,W,H)}
function hillsL(c,S,col,y,h,sp,w,seed){const off=S.t*sp,base=H*y;c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W+8;x+=8)c.lineTo(x,base-h*(.5+.5*Math.sin((x+off)/w+(seed||0))));c.lineTo(W,H);c.closePath();c.fill()}
function cloudsL(c,S,col,y,n,sp,a){const per=W/n+90;c.globalAlpha=a==null?.9:a;c.fillStyle=col;for(let i=0;i<n+2;i++){const x=((i*per-S.t*sp)%(per*(n+2)))-60,yy=H*y+Math.sin(i*3)*24;c.beginPath();c.ellipse(x,yy,38,15,0,0,TAU);c.ellipse(x+24,yy+5,28,12,0,0,TAU);c.ellipse(x-22,yy+6,24,11,0,0,TAU);c.fill()}c.globalAlpha=1}
PF.u={rrect,disc,glow,sky,hillsL,cloudsL,TAU,EMO};

function newState(type,opts){
  const dl=opts&&opts.daily,D=DIFF[dl?"mid":diff],sk=curSkin(type);
  return {daily:!!dl,rngA:dl?mulberry32(dl.seed):null,rngB:dl?mulberry32((dl.seed^0x9e3779b9)>>>0):null,log:[],type,ty:PF.types[type],D,hearts:D.hearts,score:0,passed:0,got:0,t:0,speed:105*D.sp,obs:[],items:[],parts:[],inv:0,shake:0,over:false,endT:0,pairId:0,sinceSpawn:0,spawnAt:60,
    skin:sk,pal:Object.assign({},PAL[type],sk&&sk.pal||{}),h:{y:H/2,vy:0,rot:0},c:{}};
}
function addScore(n){const S=PF.S;S.score=Math.min(4999,S.score+Math.round(n*S.D.mult));$("sc").textContent=S.score;if(typeof chRender==="function")chRender()}
function renderHearts(){const S=PF.S;$("dots").textContent=S?"❤️".repeat(Math.max(0,S.hearts))+"🖤".repeat(Math.max(0,S.D.hearts-S.hearts)):""}
const fx=p=>{try{window.NPFx&&NPFx.buzz(p)}catch(e){}};   /* rung nhẹ khi trúng / combo / nhặt vật */
function damage(S,why){
  if(S.inv>0||S.over)return;S.hearts--;fx([70,40,70]);if(S.log.length<48)S.log.push("🟥");S.combo=0;$("cmb").textContent="";S.inv=1.5;S.shake=.45;sfx.bad();renderHearts();
  for(let i=0;i<8;i++)S.parts.push({x:BX,y:S.h.y,vx:rfx(-90,90),vy:rfx(-120,40),life:.8,g:MR()<.5?"💥":"✨",s:16});
  if(S.hearts<=0){S.over=true;S.endT=.6;S.h.vy=-120;toast(t("dead"),900)}else toast(t(why==="out"?"out":"hit",{n:S.hearts}),1100)}
function burst(x,y,glyph,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=40+Math.random()*80;PF.S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.6+Math.random()*.4,g:glyph,s:14+rn(8)})}}
function hitRect(S,o,m){m=m||0;const hx=BX,hy=S.h.y,r=HR-2;return hx+r>o.x+m&&hx-r<o.x+o.w-m&&hy+r>o.y+m&&hy-r<o.y+o.h-m}
function pairPass(S,o){if(!o.passed&&o.x+o.w<BX-HR){o.passed=true;if(o.sc){S.passed++;addScore(10);bump(S);if(S.log.length<48)S.log.push("🟩")}}}
function takeItems(S,r){for(const it of S.items){if(it.got)continue;if(Math.hypot(it.x-BX,it.y-S.h.y)<(it.r||12)+HR){it.got=true;S.got++;fx(8);addScore(5);bump(S);sfx.good();burst(it.x,it.y,"✨",4);if(S.ty.onItem)S.ty.onItem(S,it)}}}
function gapY(S,g){const sf=PF.safe,lo=sf.top+g/2+30,hi=H-sf.bottom-g/2-30;return lo>=hi?H/2:rf(lo,hi)}

  update(S,dt){const c=S.c,A=130*S.D.wind;c.wt-=dt;if(c.wt<=0){c.wt=rf(3.5,6);c.wtar=pickOf([-1,0,1,1,-1])*A}c.wind+=(c.wtar-c.wind)*Math.min(1,dt*1.3);
    const h=S.h;h.vy=Math.min(260,h.vy+(520+c.wind)*dt);h.y+=h.vy*dt;h.rot=clamp(h.vy/420,-.5,.7);if(h.y>H-20){h.y=H-20;h.vy=0}if(h.y<18){h.y=18;h.vy=0}
    if(MR()<dt*6&&Math.abs(c.wind)>20)c.gust.push({x:rfx(0,W),y:c.wind>0?-6:H+6,v:c.wind>0?1:-1,l:rfx(14,30)});c.gust.forEach(g=>{g.y+=g.v*(160+Math.abs(c.wind))*dt;g.x-=S.speed*.6*dt});c.gust=c.gust.filter(g=>g.y>-40&&g.y<H+40)},
  spawn(S){const g=150*S.D.gap,cy=gapY(S,g),id=++S.pairId;S.obs.push({k:"web",x:W+30,y:0,w:48,h:cy-g/2,sc:true},{k:"thorn",x:W+30,y:cy+g/2,w:48,h:H-cy-g/2,sc:false});S.items.push({k:"item",x:W+54,y:cy,r:12});S.spawnAt=rf(195,235)},
  onItem(S,it){const c=S.c;c.pollen++;if(c.pollen%5===0&&c.hive<5){c.hive++;addScore(20);toast(t("hive",{n:c.hive}),1500);sfx.up()}},
  hud(S){const w=S.c.wind;return t("hud.bee",{w:t(w>25?"w.down":w<-25?"w.up":"w.calm"),n:S.c.hive})},
  paintBack(c,S){c.strokeStyle="rgba(255,255,255,.55)";c.lineWidth=2;c.lineCap="round";for(const g of S.c.gust){c.beginPath();c.moveTo(g.x,g.y);c.lineTo(g.x-3,g.y+g.v*g.l);c.stroke()}}
};

/* ===== LOẠI 2: CÁ CHUỒN VƯỢT SÓNG (chạm nhảy, giữ lặn) ===== */

  init(S){const yw=Math.round(H*.56);S.c={yw,norm:yw+22,deep:yw+112,air:false,vy:0,down:false,dT:0,dive:false,pearls:0};S.h.y=S.c.norm},

  update(S,dt){const c=S.c,h=S.h;if(c.down){c.dT+=dt;if(c.dT>=.24&&!c.air)c.dive=true}

    else{const tar=c.dive?c.deep:c.norm;h.y+=(tar-h.y)*Math.min(1,dt*9);h.rot=clamp((tar-h.y)/80,-.4,.5)}h.vy=c.vy},
  spawn(S){const c=S.c,r=RNG(),gull=r<.34;

    else S.obs.push({k:"boat",x:W+30,y:c.yw-16,w:48,h:76,sc:true});
    const air=RNG()<.5;S.items.push({k:"item",x:W+30+rf(110,150),y:air?c.yw-82:c.deep,r:12});S.spawnAt=rf(235,285)},
  onItem(S){S.c.pearls++},
  hud(S){return t("hud.fish",{n:S.c.pearls})},
  hitTest(S,o){const m=3;if(o.k==="gull")return S.h.y<S.c.yw+46&&Math.abs(o.x+o.w/2-BX)<22;return hitRect(S,o,m)}
};

  if(navigator.share){try{await navigator.share({title:t("title"),text,url});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(url);shStatus(t("share.copied"))}catch(e){const i=$("shLink");i.value=url;i.hidden=false;i.focus();i.select();shStatus(t("share.copyHint"))}});
function renderStart(){   /* màn bắt đầu: bình thường, hoặc thẻ VS khi mở bằng link thách đấu */
  const ch=!!CH&&!HELPER;$("cards").hidden=ch;$("diffs").hidden=ch;$("vsBox").hidden=!ch;$("chGo").hidden=!ch;
  if(ch){$("stH").textContent=t("ch.h");$("vsE").textContent=ICO[CH.t];$("vsS").textContent=CH.s;$("vsR").textContent=t("ch.rival");$("vsY").textContent=t("ch.you");$("chGo").textContent=t("ch.go")}
  else{$("stH").textContent=t("st.h")}$("stH").hidden=!ch;
  document.querySelectorAll(".skinBtn").forEach(b=>b.hidden=HELPER);if(HELPER)$("diffs").hidden=true}
$("chGo").addEventListener("click",()=>{if(CH.sk&&CH.sk!=="default"&&PF.skins[CH.t]&&PF.skins[CH.t][CH.sk])PF.skinSel[CH.t]=CH.sk;
  openHow(CH.t,async()=>{showOv(null);chBeat=false;await countdown();startRound(CH.t)})});



/* ===== THỬ THÁCH HÔM NAY: cả nước cùng một chặng (cùng chuyến bay, cùng độ khó Vừa, cùng hạt giống) ===== */
const DAILY_BASE=Date.UTC(2026,10,1);
function dailyInfo(){const k=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date()),[y,m,d]=k.split("-").map(Number),n=Math.round((Date.UTC(y,m-1,d)-DAILY_BASE)/864e5)+1;let h=2166136261;for(const ch of "cw"+k){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return{key:k,n,seed:h>>>0,type:TYPES[h%TYPES.length]}}
const dayBefore=k=>{const[y,m,d]=k.split("-").map(Number);return new Intl.DateTimeFormat("en-CA",{timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,d-1)))};
function dailyStore(){return Object.assign({streak:0,last:"",best:{}},LS.get("cw-daily",{}))}
function dailyDone(S){const di=dailyInfo(),st=dailyStore();if(st.last!==di.key){st.streak=st.last===dayBefore(di.key)?st.streak+1:1;st.last=di.key}st.best[di.key]=Math.max(st.best[di.key]||0,S.score);const ks=Object.keys(st.best).sort().slice(-14),nb={};ks.forEach(x=>nb[x]=st.best[x]);st.best=nb;LS.set("cw-daily",st);return st}
function startDaily(){const di=dailyInfo();chBeat=false;startRound(di.type,null,{daily:di})}
function openDaily(){const di=dailyInfo();openHow(di.type,startDaily,false,"mid")}


/* chơi lại tức thì: chạm vào chỗ trống của màn kết thúc (hoặc phím Cách / Enter) là bay luôn */
function retry(){if(HELPER||!endInfo)return;if(endInfo.daily)startDaily();else{chBeat=false;startRound(CH&&!HELPER?CH.t:(PF.cur||"bee"))}}
$("ovEnd").addEventListener("pointerdown",e=>{if(e.target.closest("button")||performance.now()-endAt<450)return;retry()});
addEventListener("keydown",e=>{if((e.code==="Space"||e.key==="Enter")&&!e.repeat&&!$("ovEnd").hidden&&performance.now()-endAt>450){e.preventDefault();retry()}});

/* ===== MÀN GIẢI THÍCH: chạm vào chuyến bay → đọc cách chơi → bấm Bắt đầu mới bay ===== */
let howGo=null;
function openHow(type,onGo,mid,dif){
  const D=DIFF[dif||diff];$("hwH").textContent=ICO[type]+" "+t("ty."+type);
  $("hwL").innerHTML=[1,2,3].map(i=>{const m=/^(\S+)\s+([\s\S]*)$/.exec(t("how."+type+"."+i));return "<li><b>"+m[1]+"</b><span>"+m[2]+"</span></li>"}).join("");$("hwR").textContent=t("how.rule",{h:D.hearts,m:D.mult});
  $("hwGo").textContent=t(mid?"how.resume":"how.go");$("hwBack").hidden=!!mid||HELPER;
  howGo=onGo||(()=>startRound(type));showOv("ovHow");
  if(!mid){const id=PF.skinSel[type]||"default",sk=id==="default"?null:(PF.skins[type]||{})[id];applyLayout(sk?sk.layout:"classic");setTimeout(()=>{if(!howGo||running)return;try{PF.preview(type,sk?id:"default",ctx)}catch(e){}},70)}}   /* nền = cảnh của chuyến bay (đúng giao diện đang chọn) */
$("hwGo").addEventListener("click",()=>{const f=howGo;howGo=null;if(f)f()});
$("hwBack").addEventListener("click",()=>{howGo=null;goHome()});

/* ===== VÒNG ĐỜI VÁN CHƠI ===== */
const ovs=["ovStart","ovPause","ovEnd","ovPay","ovSkin","ovShare","ovHow"];
function showOv(id){for(const o of ovs)$(o).hidden=(o!==id)}
function applyLayout(l){PF.safe=l==="full"?{top:112,bottom:64,pad:34}:l==="window"?{top:64,bottom:64,pad:64}:{top:0,bottom:0,pad:34};const a=document.querySelector(".app");if(l&&l!=="classic")a.dataset.layout=l;else delete a.dataset.layout;setTimeout(fit,30)}
PF.applyLayout=applyLayout;
function startRound(type,resume,opts){
  if(!PF.types[type])return;audio();chBeat=false;
  const sk=curSkin(type);applyLayout(sk?sk.layout:"classic");
  PF.S=newState(type,opts);document.documentElement.dataset.diff=PF.S.D.id;PF.cur=type;if(!HELPER&&window.NPFx)NPFx.recStart(cv,75000);running=true;paused=false;pausedBy=null;showOv(null);$("pauseBtn").hidden=false;$("sc").textContent="0";
  const S=PF.S;S.h.y=H/2;S.ty.init(S);if(resume){S.score=Math.max(0,Math.min(4999,resume.score|0));S.hearts=Math.max(1,Math.min(S.D.hearts,resume.hearts|0||S.D.hearts));S.t=Math.max(0,+resume.t||0);S.combo=resume.combo|0;$("sc").textContent=S.score}
  $("cmb").textContent="";renderHearts();if(CH&&!HELPER){$("chTrack").hidden=false;chRender()}else $("chTrack").hidden=true;$("askTxt").innerHTML=S.ty.hud(S);window.NP&&NP.start();
}
PF.startRound=startRound;
function finishRound(){
  const S=PF.S;if(!S||S.over===2)return;S.over=2;running=false;$("pauseBtn").hidden=true;
  const best=LS.get("cw-best",{}),k=S.daily?"daily:"+dailyInfo().key:S.type+":"+S.D.id,isNew=S.score>(best[k]||0);if(isNew){best[k]=S.score;LS.set("cw-best",best)}
  sfx.win();$("enH").textContent=t(isNew&&S.score>0?"en.h.new":"en.h");$("enP").textContent=t("en.p",{n:S.score});$("enD").textContent=t("en.d",{t:t("ty."+S.type),d:t("dif."+S.D.id)});
  const skid=PF.skinSel[S.type];endInfo={score:S.score,type:S.type,diff:S.D.id,sk:skid&&skid!=="default"&&PF.skins[S.type]&&PF.skins[S.type][skid]?skid:"default",ch:CH&&!HELPER?CH.s:0,daily:S.daily?dailyInfo():null,log:S.log.slice(),hearts:S.hearts};
  endAt=performance.now();if(window.NPFx&&!HELPER)NPFx.recStop().then(b=>{if(endInfo)endInfo.video=b&&b.size>2000?b:null;if(!$("ovShare").hidden)$("shVid").hidden=!(endInfo&&endInfo.video)});if(S.daily){const ds=dailyStore();dailyDone(S);$("enD").textContent="📅 "+t("daily.t",{n:dailyInfo().n})}
  let hd=null;if(CH&&!HELPER){const w=S.score>CH.s,l=S.score<CH.s;hd=(w?"🏆 ":l?"😅 ":"🤝 ")+t(w?"ch.winT":l?"ch.loseT":"ch.tieT");$("enH").className=w?"chw":l?"chl":"chw";$("enD").textContent=t(w?"ch.win":l?"ch.lose":"ch.tie",{b:CH.s})}else{$("enH").className=""}
  if(hd)$("enH").textContent=hd;if(HELPER)$("enD").textContent=t("end.helper");
  $("shareBtn").hidden=HELPER;$("rankBtn").hidden=!(window.NP&&!HELPER&&S.score>0);$("againBtn").hidden=HELPER;$("homeBtn2").hidden=HELPER;$("enT").textContent=HELPER?"":t("en.tap");
  showOv("ovEnd");window.NP&&NP.result({score:S.score,extra:{type:S.type,diff:S.D.id}});
  if(PF.pro&&PF.pro.trial)setTimeout(()=>PF.lockPro(),0);
}
function goHome(){if(window.NPAudio)NPAudio.silence();if(window.NPFx)NPFx.recDrop();applyDiffTheme();$("chTrack").hidden=true;$("cmb").textContent="";applyLayout("classic");running=false;paused=false;PF.S=null;$("pauseBtn").hidden=true;$("sc").textContent="0";$("dots").textContent="";$("askTxt").textContent=t("st.p");showOv("ovStart");renderStart();renderCards();draw()}
function pauseRound(by){if(!running||paused)return;paused=true;pausedBy=by==="user"?"user":"parent";if(pausedBy==="user")$("ovPause").hidden=false}
function resumeRound(by){if(!paused)return;if(by==="parent"&&pausedBy==="user")return;paused=false;pausedBy=null;$("ovPause").hidden=true;last=performance.now()}
$("pauseBtn").addEventListener("click",()=>pauseRound("user"));$("resumeBtn").addEventListener("click",()=>resumeRound("user"));
$("homeBtn1").addEventListener("click",goHome);$("homeBtn2").addEventListener("click",goHome);
$("againBtn").addEventListener("click",retry);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running&&!paused)pauseRound("user")});

/* điều khiển: chạm / giữ / kéo */
const ptY=e=>{const r=$("play").getBoundingClientRect();return (e.clientY-r.top)/r.height*H};
let pDown=false;
$("play").addEventListener("pointerdown",e=>{if(e.target.closest(".ov")||e.target.closest("button"))return;const S=PF.S;if(!S||!running||paused||S.over)return;e.preventDefault();pDown=true;try{$("play").setPointerCapture(e.pointerId)}catch(x){}if(S.ty.down)S.ty.down(S,0,ptY(e))});
$("play").addEventListener("pointermove",e=>{const S=PF.S;if(!pDown||!S||!running||paused)return;if(S.ty.move)S.ty.move(S,0,ptY(e))});
const pUp=()=>{if(!pDown)return;pDown=false;const S=PF.S;if(S&&S.ty.up)S.ty.up(S)};
$("play").addEventListener("pointerup",pUp);$("play").addEventListener("pointercancel",pUp);
let kHeld=false;
addEventListener("keydown",e=>{const S=PF.S;if(e.repeat)return;if(e.code==="Space"||e.key==="ArrowUp"||e.key==="ArrowDown"){if(S&&running&&!paused&&!S.over){if(e.key==="ArrowUp"||e.key==="ArrowDown"){if(S.ty.key){e.preventDefault();S.ty.key(S,e.key);return}}if(S.ty.down&&!(S.type==="kite")){e.preventDefault();kHeld=true;S.ty.down(S,0,null)}}}else if((e.key==="p"||e.key==="P")&&running){paused?resumeRound("user"):pauseRound("user")}});
addEventListener("keyup",e=>{if((e.code==="Space"||e.key==="ArrowUp")&&kHeld){kHeld=false;const S=PF.S;if(S&&S.ty.up)S.ty.up(S)}});
$("askBtn").addEventListener("click",()=>{const S=PF.S;if(S&&running&&!paused&&!S.over){pauseRound("user");$("ovPause").hidden=true;openHow(S.type,()=>{showOv(null);resumeRound("user")},true)}});
/* nút ❔ chỉ có nghĩa khi đang bay (xem lại cách chơi của chính ván đó); ở màn chọn chuyến thì ẩn, tránh nhảy sang chuyến khác */
setInterval(()=>{const on=!!(PF.S&&running&&!PF.S.over&&!paused);$("askBtn").hidden=!on},150);
$("soundBtn").addEventListener("click",()=>{sound=!sound;if(window.NPAudio)NPAudio.set(sound);syncSound()});
function syncSound(){$("soundBtn").textContent=sound?"🔊":"🔇";$("soundBtn").setAttribute("aria-label",t("sound")+(sound?"":" (off)"))}
$("langBtn").addEventListener("click",()=>{LANG=LANG==="vi"?"en":"vi";try{localStorage.setItem("lang",LANG)}catch(e){}applyLang()});

/* ===== MÀN CHỌN CHUYẾN + ĐỘ KHÓ + KHOÁ NIGHT PASS ===== */
const passToken=()=>{try{const p=JSON.parse(localStorage.getItem("pass"));return p&&p.token}catch(e){return null}};
const track=(f,k)=>{try{fetch("/api/paywall",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({f,k}),keepalive:true}).catch(()=>{})}catch(e){}};
const subUrl=()=>"../../../subscribe.html?from="+encodeURIComponent("cozyplay/index.html#cozy-wings")+"&plan=month";
const ICO={bee:"🐝",fish:"🐟",lantern:"🏮",kite:"🪁",bug:"🐞"};
const DIFF_ICO={easy:"🌱",mid:"⚡",hard:"🔥"};
function applyDiffTheme(){document.documentElement.dataset.diff=diff}
function renderDiff(){const box=$("diffs");box.textContent="";applyDiffTheme();["easy","mid","hard"].forEach(id=>{const b=document.createElement("button");b.type="button";b.className="dif"+(diff===id?" on":"");b.textContent=DIFF_ICO[id];b.setAttribute("aria-label",t("dif."+id));b.setAttribute("aria-pressed",diff===id);b.onclick=()=>{diff=id;LS.set("cw-diff",id);renderDiff();renderCards()};box.appendChild(b)})}
function renderCards(){
  const box=$("cards");box.textContent="";const best=LS.get("cw-best",{});
  let dailyEl=null;
  if(!CH&&!HELPER){const di=dailyInfo(),st=dailyStore(),bs=st.best[di.key],d=document.createElement("button");d.type="button";d.className="tile daily";
    d.innerHTML='<span class="dd">📅 #'+di.n+'</span><span class="de">'+ICO[di.type]+'</span><span class="dm">'+(bs?'🏆 '+bs:'🆕')+'</span>'+(st.streak&&(st.last===di.key||st.last===dayBefore(di.key))?'<span class="df">🔥 '+st.streak+'</span>':'');d.setAttribute("aria-label",t("daily.t",{n:di.n})+" — "+t("ty."+di.type));d.onclick=openDaily;dailyEl=d}
  for(const id of PF.order){
    const sel=PF.skinSel[id],prem=sel&&sel!=="default"&&PF.skins[id]&&PF.skins[id][sel],bs=best[id+":"+diff],tid=prem?sel:"default";
    const c=document.createElement("div");c.className="tile";
    const m=document.createElement("button");m.type="button";m.className="main";m.innerHTML='<img alt="" src="thumbs/'+id+'-'+tid+'.jpg" loading="lazy" onerror="this.style.visibility=\'hidden\'"><span class="tb" aria-hidden="true">'+ICO[id]+'</span>'+(bs?'<span class="best">🏆 '+bs+'</span>':'');m.setAttribute("aria-label",t("ty."+id)+" — "+t("ty."+id+".d"));m.onclick=()=>openHow(id);
    const k=document.createElement("button");k.type="button";k.className="skinBtn";k.innerHTML='🎨'+(prem?"<i>★</i>":"");k.setAttribute("aria-label",t("sk.pick"));k.onclick=()=>openSkins(id);
    c.appendChild(m);c.appendChild(k);box.appendChild(c);
  }
  if(dailyEl)box.appendChild(dailyEl);
}
const THUMB=(ty,id)=>"thumbs/"+ty+"-"+id+".jpg";
const skLocked=(ty,id)=>id!=="default"&&!(PF.skins[ty]&&PF.skins[ty][id]);
let skFor=null,payFor=null;
function openSkins(ty){
  skFor=ty;$("skH").textContent="🎨 "+t("ty."+ty);const g=$("skGrid");g.textContent="";
  for(const id of PF.catalog[ty]){
    const locked=skLocked(ty,id),b=document.createElement("button");b.type="button";b.className="sk"+(locked?" lock":"")+((PF.skinSel[ty]||"default")===id?" on":"");
    b.innerHTML='<img alt="" src="'+THUMB(ty,id)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'"><span>'+t("sk."+ty+"."+id)+'</span>';
    b.setAttribute("aria-label",locked?t("lockedLbl",{n:t("sk."+ty+"."+id)}):t("sk."+ty+"."+id));
    b.onclick=()=>locked?openPay(ty,id):chooseSkin(ty,id);g.appendChild(b);
  }
  showOv("ovSkin");
}
function chooseSkin(ty,id){PF.skinSel[ty]=id;LS.set("cw-skin",PF.skinSel);renderCards();openHow(ty)}
$("skBack").addEventListener("click",()=>showOv("ovStart"));
function openPay(ty,id){
  payFor={ty,id};track("wing_skin","view");
  $("pwH").textContent=t("pw.h");$("pwP").textContent=t("pw.p",{name:t("sk."+ty+"."+id)});$("pwGo").textContent="🔐 "+t("pw.go");$("pwLater").textContent=t("pw.later");
  const tried=LS.get("cw-trial","")===new Date().toLocaleDateString("en-CA");
  $("pwTrial").hidden=tried;$("pwTrial").textContent="🎈 "+t("pw.trial");showOv("ovPay");
}
$("pwLater").addEventListener("click",()=>skFor?openSkins(skFor):showOv("ovStart"));
$("pwGo").addEventListener("click",()=>{track("wing_skin","click");window.top.location.href=subUrl()});
$("pwTrial").addEventListener("click",async()=>{
  try{await PF.loadPro(true);LS.set("cw-trial",new Date().toLocaleDateString("en-CA"));track("wing_skin","trial");const f=payFor;const old=PF.skinSel[f.ty];PF.skinSel[f.ty]=f.id;PF.skinRestore={ty:f.ty,old};renderCards();openHow(f.ty)}
  catch(e){toast(t("pw.tried"),2200);showOv("ovStart")}
});

/* ===== BẢN TRẢ PHÍ (máy chủ gửi về cho người có Night Pass; có lưu để dùng khi mất mạng) ===== */
const fetchT=(u,o,ms)=>{const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({signal:c.signal},o)).finally(()=>clearTimeout(id))};
PF.loadPro=async function(trial,ticket){
  const tk=ticket||passToken(),cacheable=!trial&&!ticket;let src=null,r=null;
  try{r=await fetchT("/api/pro/cozy-wings.js"+(trial?"?trial=1":""),{headers:tk?{Authorization:"Bearer "+tk}:{},cache:"no-store"},8000)}catch(e){r=null}
  if(r&&r.ok){src=await r.text();if(cacheable)LS.set("cw-pro-src",{src})}
  else{
    if(r&&r.status>=400&&r.status<500&&r.status!==429){if(r.status===401&&cacheable)try{localStorage.removeItem("cw-pro-src")}catch(e){}throw new Error("pro_"+r.status)}
    const c=cacheable?LS.get("cw-pro-src",null):null,p=LS.get("pass",null);
    if(c&&c.src&&p&&p.exp&&new Date(p.exp)>new Date())src=c.src;else throw new Error("pro_offline");
  }
  new Function("PF",src)(PF);renderCards();if(cacheable)PF.fetchTicket();
};
PF.fetchTicket=function(){const tk=passToken();if(!tk||HELPER||!PF.pro||PF.pro.trial)return;fetchT("/api/pro/ticket",{method:"POST",headers:{Authorization:"Bearer "+tk},cache:"no-store"},6000).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ticket){PF.ticket=j.ticket;PF.ticketAt=Date.now()}}).catch(()=>{})};
addEventListener("online",()=>{if(!PF.ticket)PF.fetchTicket()});setInterval(()=>{if(PF.pro&&!PF.pro.trial&&(!PF.ticket||Date.now()-(PF.ticketAt||0)>20*36e5))PF.fetchTicket()},60000);
PF.lockPro=function(){PF.skins={};PF.pro=null;if(PF.skinRestore){const r=PF.skinRestore;if(r.old)PF.skinSel[r.ty]=r.old;else delete PF.skinSel[r.ty];PF.skinRestore=null}renderCards();applyLayout("classic")};

/* ===== NGÔN NGỮ ===== */
function applyLang(){
  document.documentElement.lang=LANG;document.title=t("docTitle");$("title").textContent=t("title");$("langBtn").textContent=LANG.toUpperCase();$("langBtn").setAttribute("aria-label",t("lang"));
  renderStart();$("paH").textContent=t("pause");$("resumeBtn").setAttribute("aria-label",t("resume"));$("homeBtn1").setAttribute("aria-label",t("home"));$("skBack").setAttribute("aria-label",t("home"));$("againBtn").setAttribute("aria-label",t("again"));$("homeBtn2").setAttribute("aria-label",t("home"));$("shareBtn").setAttribute("aria-label",t("share.btn"));$("rankBtn").setAttribute("aria-label",t("rank.btn"));$("hwBack").setAttribute("aria-label",t("how.back"));
  $("pauseBtn").setAttribute("aria-label",t("pause"));$("askBtn").setAttribute("aria-label",t("how"));cv.setAttribute("aria-label",t("title"));syncSound();renderDiff();renderCards();renderStart();
  if(PF.S&&PF.S.ty)$("askTxt").innerHTML=PF.S.ty.hud(PF.S);else $("askTxt").textContent=t("st.p");
}
addEventListener("storage",e=>{if(e.key==="theme")document.documentElement.dataset.theme=e.newValue||"light"});

/* ===== CẦU NỐI VỚI TRANG CHA ===== */
if(window.NP){
  NP.state(()=>{const S=PF.S;if(!S||!running||S.over)return null;const st={type:S.type,diff:S.D.id,score:S.score,hearts:S.hearts,t:Math.round(S.t*10)/10,combo:S.combo|0},sk=PF.skinSel[S.type];
    if(sk&&sk!=="default"&&PF.skins[S.type]&&PF.skins[S.type][sk]&&PF.ticket&&!(PF.pro&&PF.pro.trial)){st.sk=sk;st.tk=PF.ticket}return st});
  NP.onPause(()=>pauseRound("parent"),()=>resumeRound("parent"));
}
if(!HELPER&&passToken())PF.loadPro(false).catch(()=>{});
applyLang();fit();requestAnimationFrame(loop);
if(!HELPER&&!CH&&location.hash==="#daily")openDaily();
if(CH&&CH.tk&&CH.sk!=="default")PF.loadPro(false,CH.tk).then(()=>{PF.skinSel[CH.t]=CH.sk}).catch(()=>{});   /* link thách đấu kèm vé: chơi đúng giao diện của người thách */
if(HS&&TYPES.includes(HS.type)&&DIFF[HS.diff]){   /* chơi hộ: vào thẳng đúng chuyến bay đang dở của bạn, giữ điểm và tim */
  diff=HS.diff;applyDiffTheme();const go=()=>{renderStart();startRound(HS.type,HS)};
  if(HS.tk&&TICKET_RE.test(HS.tk)&&/^[a-z]{3,10}$/.test(HS.sk||""))PF.loadPro(false,HS.tk).then(()=>{PF.skinSel[HS.type]=HS.sk}).catch(()=>{}).finally(go);else go()}
