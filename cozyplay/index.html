<!doctype html>
<html lang="en" data-app="cozyplay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Night Play</title>
<meta name="description" content="Night games to unwind after a long day. No ads, no personal tracking.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F0FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1020" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Night Play">
<meta property="og:description" content="Night games to unwind after a long day. No ads, no personal tracking.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237C5CFF'/%3E%3Cpath d='M40 40A16 16 0 1 1 26 16a13 13 0 0 0 14 24z' fill='%23fff'/%3E%3C/svg%3E">
<script>
/* Chạy trước khi vẽ trang: áp theme đã lưu hoặc theo máy, nên không bị nháy màu */
try{var t=localStorage.getItem("theme")}catch(e){}
document.documentElement.dataset.theme=t||"dark";
</script>
<link rel="stylesheet" href="../shared/theme.css">
<style>
/* ===== THEME: đổi màu chủ đạo ở --accent (sáng) và --accent trong khối dark ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
/* Nút đổi theme / ngôn ngữ */
.tools{position:relative;display:flex;gap:10px;align-items:center}
/* Thanh điều hướng dính trên cùng */
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.2px;min-width:0}
.mark svg,.mk{width:36px;height:36px;flex:none}
a.mark{color:inherit;text-decoration:none}
.mark span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;text-decoration:none;box-shadow:var(--shadow);white-space:nowrap}
.pill svg{width:20px;height:20px;flex:none}
@media (max-width:520px){.pill{width:44px;padding:0}.pill span{display:none}}
.ico{width:48px;height:48px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center}
.ico svg{width:26px;height:26px}
.sun{display:none}
[data-theme=dark] .sun{display:block}
[data-theme=dark] .moon{display:none}
#langMenu{position:absolute;top:56px;right:0;min-width:150px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:none}
#langMenu.on{display:block}
#langMenu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:none;font-size:16px;font-weight:600}
#langMenu button[aria-checked=true]{background:var(--accent);color:var(--on-accent)}
/* Hero thương hiệu */
.hero{position:relative;text-align:center;padding:44px 16px 28px;margin:0 0 8px;background:radial-gradient(700px 260px at 50% 0,var(--hero1),transparent 70%)}
.hero h1{margin:0 auto;max-width:760px;font-size:clamp(32px,7vw,56px);line-height:1.08;letter-spacing:-1px;font-weight:800}
.hero .desc{margin:14px auto 0;max-width:540px;font-size:clamp(15px,2.6vw,18px);line-height:1.55;opacity:.85}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0 0;padding:0;list-style:none}
.trust li{display:flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700}
.trust li:before{content:"✓";color:var(--accent);font-weight:900}
.logo{width:96px;height:96px;display:block;margin:0 auto 12px;filter:drop-shadow(var(--shadow));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
/* Lưới: 2 cột điện thoại, 3-4 cột tablet, tối đa 6 cột desktop. Khoảng cách >= 16px */
main{max-width:1200px;margin:0 auto;padding:8px 16px 24px}
#grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
@media (min-width:600px){#grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media (min-width:900px){#grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1200px){#grid{grid-template-columns:repeat(6,1fr)}}
.tile{aspect-ratio:1;min-width:140px;padding:0;border-radius:28px;background:var(--card);
  overflow:hidden;box-shadow:var(--shadow);transition:transform .15s ease}
.tile img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile.pop{animation:pop .15s ease}
@keyframes pop{50%{transform:scale(1.12)}}
.foot{margin-top:32px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--hero1))}
.fin{max-width:1200px;margin:0 auto;padding:36px 16px 20px;display:grid;gap:28px;grid-template-columns:1fr 1fr}
.fbrand{grid-column:1/-1}
@media (min-width:760px){.fin{grid-template-columns:2fr 1fr 1fr}.fbrand{grid-column:auto}}
.fbrand p{max-width:340px;margin:12px 0 0;font-size:14px;line-height:1.5;opacity:.8}
.fcol h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;opacity:.65}
.fcol a{display:block;padding:8px 0;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.fcol a:hover{color:var(--accent)}
.fbar{max-width:1200px;margin:0 auto;padding:16px 16px 28px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.fbar p{margin:0;opacity:.75}
#lock{position:relative;width:56px;height:56px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center}
#lock .ic{width:28px;height:28px}
#ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
#ring circle{fill:none;stroke:var(--accent);stroke-width:5;stroke-dasharray:163.4;stroke-dashoffset:163.4}
/* Lớp phủ game */
#stage{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;z-index:10;background:#000;display:none;overflow:hidden;contain:strict}
html.playing,html.playing body{overflow:hidden;height:100%}
#stage.on{display:block}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .35s ease}
#stage iframe.show{opacity:1}
#home{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:2;
  width:44px;height:44px;border-radius:50%;padding:0;background:rgba(255,255,255,.34);color:#fff;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.7);
  display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.12)}
#home svg{width:24px;height:24px;filter:drop-shadow(0 0 1px rgba(0,0,0,.95)) drop-shadow(0 0 1.5px rgba(0,0,0,.8)) drop-shadow(0 1px 3px rgba(0,0,0,.5))}
#home:hover{background:rgba(255,255,255,.4)}
#home:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* Ẩn khi đang chơi; chỉ hiện khi người dùng vuốt (cảm ứng) hoặc đưa chuột lên mép trên */
#home{opacity:0;pointer-events:none;transform:translateY(-10px);transition:opacity .25s ease,transform .25s ease}
#home.show,#home:focus-visible{opacity:1;pointer-events:auto;transform:none}
#edge{display:none}
#stage.edge #edge{display:block;position:absolute;top:0;left:0;right:0;height:22px;z-index:1}   /* dự phòng nếu game khác domain (không nghe được cử chỉ bên trong) */
@media (prefers-reduced-motion:reduce){#home{transition:none}}
/* Màn hình loading: phủ kín, che mọi giật hình lúc vào fullscreen, mờ dần khi game sẵn sàng */
#loader{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:linear-gradient(180deg,var(--hero1),var(--bg));pointer-events:none;transition:opacity .35s ease,visibility .35s}
#loader.off{opacity:0;visibility:hidden}
#loader .logo{width:112px;height:112px;margin:0}
#bar{width:min(220px,60vw);height:10px;border-radius:5px;background:var(--line);overflow:hidden}
#bar b{display:block;height:100%;width:40%;border-radius:5px;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
/* Khu vực phụ huynh */
#gate{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px}
#gate.on{display:grid}
/* ===== SETTINGS ===== */
.box{display:flex;flex-direction:column;background:var(--panel);border-radius:26px;width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);user-select:text;-webkit-user-select:text}
.gh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 14px 22px;border-bottom:1px solid var(--line)}
.gt{display:flex;align-items:center;gap:10px;min-width:0}
.gt svg{width:26px;height:26px;flex:none;color:var(--accent)}
.gt h2{margin:0;font-size:20px;font-weight:800}
.gx{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.gx svg{width:20px;height:20px}
.gb{flex:1;min-height:0;overflow-y:auto;padding:16px 22px 6px}
.promo{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:14px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:800;text-decoration:none}
.promo svg{width:22px;height:22px;flex:none}
.promo span{flex:1}
.gs{background:var(--bg);border-radius:18px;padding:16px;margin-bottom:14px}
.gs h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:600;font-size:15px}
.chips button[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.urow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.used{margin:0;font-size:14px;font-weight:600}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.meter[hidden]{display:none}
.meter b{display:block;height:100%;width:0;border-radius:4px;background:var(--accent);transition:width .3s}
.meter.hot b{background:#E5484D}
.sec{padding:7px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:600;font-size:13px;flex:none}
.gs select{width:100%;padding:12px;font-size:16px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.gf{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.gf a{color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;opacity:.8}
.gf a:hover{color:var(--accent);opacity:1}
#close{margin-left:auto;padding:12px 28px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px}
@media (max-width:520px){.gb{padding:14px 14px 4px}.gh{padding-left:16px}.gf{padding-left:14px;padding-right:14px}#close{width:100%;margin:6px 0 0}}
/* Cài đặt phụ huynh */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.opt{background:none;padding:0;font-size:12px;font-weight:600;text-align:center}
.opt img{display:block;width:100%;aspect-ratio:1;border-radius:14px;border:3px solid transparent;margin-bottom:4px}
.opt[aria-pressed=true] img{border-color:var(--accent)}
.opt[aria-pressed=false] img{opacity:.35;filter:grayscale(1)}
/* Hết giờ chơi + thanh thời gian còn lại */
#sleep{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 16px;padding:14px 18px;border-radius:24px;background:var(--panel);box-shadow:var(--shadow);font-weight:700}
#sleep[hidden]{display:none}
#sleep svg{width:48px;height:48px;flex:none}
body.timeup #grid{opacity:.35;filter:grayscale(1)}
/* Thời gian còn lại: trong game (góc trên phải) và ở trang chủ */
.left{display:none;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.left.on{display:inline-flex}
.left.low{background:#E5484D;color:#fff}
.left svg{width:24px;height:24px;flex:none}
#tleft{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:2;pointer-events:none}
#hleft{display:none;margin:0 auto 16px;width:max-content}
#hleft.on{display:flex}
#tbar{position:absolute;left:0;right:0;bottom:0;height:6px;z-index:2;pointer-events:none;display:none}
#tbar.on{display:block}
#tbar b{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform 1s linear}
@media (prefers-reduced-motion:reduce){.logo,.tile,.tile.pop,#bar b{animation:none;transition:none}}

/* ===== VỪA MỘT MÀN HÌNH: nav + hero + lưới game + footer luôn nằm gọn trong khung nhìn ===== */
html,body{height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.nav,.hero,.foot{flex:none}
.hero{padding:clamp(8px,2.2vh,28px) 16px clamp(6px,1.4vh,16px);margin:0}
.hero h1{font-size:clamp(24px,min(5vw,6vh),48px)}
.hero .desc{margin-top:clamp(4px,1vh,12px);font-size:clamp(14px,2vh,17px)}
.trust{margin-top:clamp(8px,1.6vh,16px)}
main{flex:1;min-height:0;width:100%;max-width:1200px;display:flex;flex-direction:column;padding:8px 16px 12px;overflow-y:auto}
#grid{flex:1;min-height:0;display:grid;gap:var(--g,16px);grid-template-columns:repeat(var(--c,3),var(--s,140px));grid-auto-rows:var(--s,140px);justify-content:center;align-content:center}
.tile{min-width:0;width:var(--s);height:var(--s);border-radius:clamp(14px,15%,28px)}
#sleep,#hleft{flex:none}
/* Footer gọn một hàng */
.foot{margin:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 18px;padding:6px 16px calc(6px + env(safe-area-inset-bottom))}
.fin,.fbar{display:contents}
.fbrand{order:1;grid-column:auto}
.fbrand p,.fcol h4,#fGames{display:none}
.fbrand .mark{font-size:16px}.fbrand .mark svg{width:28px;height:28px}
.fcol{order:2;display:flex;flex-wrap:wrap;gap:0 14px}
.fcol a{padding:8px 0;font-size:14px}
.fbar p{order:3;font-size:12px;margin-left:auto}
#lock{order:4;width:44px;height:44px}
#lock .ic{width:22px;height:22px}
@media (max-width:640px){
  .fbar p{display:none}
  #lock{margin-left:auto}
  .foot{justify-content:flex-start}
}
@media (max-height:620px){.trust,.hero .desc{display:none}}
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <a class="mark" id="hubLink" href="../index.html"><svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="var(--accent)"/><path d="M42 40A16 16 0 1 1 26 14a13 13 0 0 0 16 26z" fill="#fff"/><circle cx="44" cy="20" r="2.5" fill="#fff"/></svg><span id="hName"></span></a>
  <div class="tools">
    <a id="hubBtn" class="ico" href="../index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3L2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></a>
    <a id="passBtn" class="pill" href="#"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg><span></span></a>
    <button id="themeBtn" class="ico" type="button" aria-label="Theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
    <button id="langBtn" class="ico" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
    </button>
    <div id="langMenu" role="menu"></div>
  </div>
</nav>
<header class="hero">
  <h1 id="hSlogan"></h1>
  <p class="desc" id="hDesc"></p>
  <ul class="trust"><li id="tAds"></li><li id="tTrack"></li><li id="tFree"></li></ul>
</header>
<main>
  <div id="sleep" hidden>
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M36 30A16 16 0 1 1 20 8a13 13 0 0 0 16 22z" fill="#FFD93D"/><path d="M30 6h8l-8 8h8M38 18h5l-5 5h5" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="sleepTxt"></span>
  </div>
  <div id="hleft" class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span></span></div>
  <div id="grid"></div>
</main>
<footer class="foot">
  <div class="fin">
    <div class="fbrand"><div class="mark"><svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="var(--accent)"/><path d="M42 40A16 16 0 1 1 26 14a13 13 0 0 0 16 26z" fill="#fff"/><circle cx="44" cy="20" r="2.5" fill="#fff"/></svg><span id="fName"></span></div><p id="fTag"></p></div>
    <nav class="fcol" aria-labelledby="fH1"><h4 id="fH1"></h4><a id="fHub" href="../index.html"></a><a id="fGames" href="#grid"></a><a id="fPass" href="#"></a></nav>
    <nav class="fcol" aria-labelledby="fH2"><h4 id="fH2"></h4><a id="fMail" href="#"></a><a id="fPriv" href="#" target="_blank" rel="noopener"></a></nav>
  </div>
  <div class="fbar"><p id="madeBy"></p>
  <button id="lock" type="button" aria-label="Settings">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <svg id="ring" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" pathLength="163.4"/></svg>
  </button></div>
</footer>

<div id="stage" role="dialog" aria-modal="true">
  <div id="loader" aria-hidden="true">
    <svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="var(--accent)"/><path d="M42 40A16 16 0 1 1 26 14a13 13 0 0 0 16 26z" fill="#fff"/><circle cx="44" cy="20" r="2.5" fill="#fff"/></svg>
    <div id="bar"><b></b></div>
  </div>

const art = {

  quiz: `<circle cx="256" cy="256" r="160" fill="#fff"/><path d="M200 220c0-60 112-60 112 0 0 40-56 40-56 90" fill="none" stroke="#1C1833" stroke-width="30" stroke-linecap="round"/><circle cx="256" cy="372" r="19" fill="#1C1833"/>`

/* ===== DANH SÁCH GAME: thêm game mới = thêm 1 object vào mảng ===== */
const games = [
  { id:"dap-deadline", name:{vi:"Đập Deadline",en:"Smash Deadline"}, thumb:face("#DFE7EE","#8FA6BC",art.deadline), url:"games/dap-deadline/index.html" },
  { id:"game-1", name:{vi:"Bài Poker",en:"Poker"},        thumb:face("#6A48F0","#2B1B8A",art.cards),  url:"games/game1/index.html" },
  { id:"game-2", name:{vi:"Xúc xắc",en:"Dice"},           thumb:face("#E5484D","#7A1020",art.dice),   url:"games/game2/index.html" },
  { id:"game-3", name:{vi:"Cờ vua",en:"Chess"},           thumb:face("#2F3A6B","#0E1020",art.chess),  url:"games/game3/index.html" },
  { id:"game-4", name:{vi:"Xếp hình",en:"Puzzle"},        thumb:face("#14B8A6","#0B5C60",art.puzzle), url:"games/game4/index.html" },
  { id:"game-5", name:{vi:"2048",en:"2048"},              thumb:face("#FAF8EF","#BBADA0",art.tiles),  url:"games/game5/index.html" },
  { id:"game-6", name:{vi:"Rắn săn mồi",en:"Snake"},      thumb:face("#4ADE80","#166534",art.snake),  url:"games/game6/index.html" },
  { id:"game-7", name:{vi:"Dò mìn",en:"Minesweeper"},    thumb:face("#FBBF24","#B45309",art.mine),   url:"games/game7/index.html" },
  { id:"game-8", name:{vi:"Đố vui",en:"Trivia"},         thumb:face("#F472B6","#9D174D",art.quiz),   url:"games/game8/index.html" }
];

/* ===== NGÔN NGỮ ===== */
let lang = DEFAULT_LANG;
const $ = id => document.getElementById(id);
function detectLang(){
  try{ const s = localStorage.getItem("lang"); if(s && i18n[s]) return s; }catch(e){}
  for(const l of (navigator.languages || [navigator.language || ""])){
    const c = String(l).split("-")[0].toLowerCase();
    if(i18n[c]) return c;
  }
  return DEFAULT_LANG;
}
const pageTitle = () => BRAND + " · " + i18n[lang].slogan;
function applyLang(){
  const t = i18n[lang];
  document.documentElement.lang = lang;
  document.title = pageTitle();
  document.querySelector('meta[name=description]').content = t.desc;
  document.querySelector('meta[property="og:title"]').content = pageTitle();
  $("hName").textContent = BRAND;
  $("hSlogan").textContent = t.slogan;
  $("hDesc").textContent = t.desc;
  $("madeBy").textContent = "© " + new Date().getFullYear() + " " + BRAND + ". " + t.rights;
  $("fName").textContent = BRAND; $("fTag").textContent = t.desc;
  $("tAds").textContent = t.noAds; $("tTrack").textContent = t.noTrack; $("tFree").textContent = t.free;
  $("fH1").textContent = t.product; $("fH2").textContent = t.support;
  $("fGames").textContent = t.games; $("fHub").textContent = t.hub;
  $("hubBtn").setAttribute("aria-label", t.hub); $("hubBtn").title = t.hub; $("hubLink").setAttribute("aria-label", t.hub + " – " + BRAND);
  const fm = $("fMail"); fm.href = "mailto:" + EMAIL; fm.textContent = t.contact;
  const fp = $("fPriv"); fp.href = PRIVACY_URL; fp.textContent = t.privacy;
  const SUB = "../subscribe.html?from=cozyplay/index.html&lang=" + lang;
  $("passBtn").href = SUB; $("passBtn").lastChild.textContent = t.pass; $("passBtn").setAttribute("aria-label", t.upgrade);
  $("fPass").href = SUB; $("fPass").textContent = t.pass;
  document.querySelector('meta[property="og:description"]').content = t.desc;
  $("lock").setAttribute("aria-label", t.parents);
  $("themeBtn").setAttribute("aria-label", t.theme);
  $("langBtn").setAttribute("aria-label", t.lang);
  $("home").setAttribute("aria-label", t.home);
  $("gTitle").textContent = t.parents;
  $("gLang").textContent = t.lang;
  $("close").textContent = t.close; $("gX").setAttribute("aria-label", t.close);
  const u = $("pass"); $("passTxt").textContent = t.upgrade; u.href = "../subscribe.html?from=cozyplay/index.html&lang=" + lang;
  const m = $("mail"); m.href = "mailto:" + EMAIL; m.textContent = t.contact;
  const p = $("priv"); p.href = PRIVACY_URL; p.textContent = t.privacy;
  $("gTimeH").textContent = t.timeH;
  $("gGamesH").textContent = t.gamesH;
  $("resetT").textContent = t.reset;
  $("sleepTxt").textContent = t.timesUp;
  updateSleep();
  setTileLabels();
  renderPrefs();
}

/* ===== ÂM THANH "POP" (Web Audio, không dùng file) ===== */
let ac;
function pop(){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(900, t + .09);
    g.gain.setValueAtTime(.25, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .14);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .15);
  }catch(e){}
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

/* ===== CÀI ĐẶT PHỤ HUYNH: game được phép + giới hạn thời gian (lưu localStorage) ===== */
const TIME_OPTS = [0, 15, 30, 45, 60, 90, 120];   // phút/ngày, 0 = không giới hạn. Sửa danh sách tại đây
let prefs = { limit: 0, off: [] };                 // off = id các game bị ẩn
try{ Object.assign(prefs, JSON.parse(localStorage.getItem("prefs")) || {}); }catch(e){}
const savePrefs = () => { try{ localStorage.setItem("prefs", JSON.stringify(prefs)); }catch(e){} };
const today = () => new Date().toLocaleDateString("sv");   // YYYY-MM-DD theo giờ máy
let usedSec = 0;
try{ const u = JSON.parse(localStorage.getItem("usage")); if(u && u.d === today()) usedSec = u.s; }catch(e){}
const saveUsed = () => { try{ localStorage.setItem("usage", JSON.stringify({ d: today(), s: usedSec })); }catch(e){} };
const isTimeUp = () => prefs.limit > 0 && usedSec >= prefs.limit * 60;
const enabled = () => games.filter(g => !prefs.off.includes(g.id));
const gname = g => g.name[lang] || g.name[DEFAULT_LANG];

let timer = 0, day = today();
function updateSleep(){
  const up = isTimeUp();
  document.body.classList.toggle("timeup", up);
  $("sleep").hidden = !up;
  const bar = $("tbar");
  bar.classList.toggle("on", prefs.limit > 0);
  const rem = Math.max(0, prefs.limit * 60 - usedSec), txt = Math.floor(rem / 60) + ":" + String(rem % 60).padStart(2, "0");
  [$("tleft"), $("hleft")].forEach(e => {
    e.classList.toggle("on", prefs.limit > 0 && !up);
    e.classList.toggle("low", rem <= 60);          // còn dưới 1 phút: chuyển đỏ
    e.lastChild.textContent = txt;
  });
  $("hleft").setAttribute("aria-label", i18n[lang].left + " " + txt);
  bar.firstChild.style.transform = "scaleX(" + (prefs.limit > 0 ? Math.max(0, 1 - usedSec / (prefs.limit * 60)) : 1) + ")";
}
function startTimer(){
  stopTimer(); updateSleep();
  timer = setInterval(() => {
    if(document.hidden) return;                    // không tính lúc ẩn tab
    if(today() !== day){ day = today(); usedSec = 0; }
    usedSec++;
    if(usedSec % 5 === 0) saveUsed();
    updateSleep();
    if(isTimeUp()) goHome();                       // hết giờ: tự về trang chủ
  }, 1000);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer = 0; saveUsed(); updateSleep(); } }

function renderPrefs(){
  const t = i18n[lang], tOpts = $("timeOpts"), gOpts = $("gameOpts");
  tOpts.textContent = ""; gOpts.textContent = "";
  TIME_OPTS.forEach(m => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", prefs.limit === m);
    b.textContent = m ? m + " " + t.min : t.off;
    b.addEventListener("click", () => { prefs.limit = m; savePrefs(); updateSleep(); renderPrefs(); });
    tOpts.appendChild(b);
  });
  $("usedTxt").textContent = t.usedToday + ": " + Math.floor(usedSec / 60) + (prefs.limit ? " / " + prefs.limit : "") + " " + t.min;
  const mt = $("meter"); mt.hidden = !prefs.limit;
  if(prefs.limit){ const pc = Math.min(1, usedSec / (prefs.limit * 60)); mt.firstChild.style.width = (pc * 100) + "%"; mt.classList.toggle("hot", pc >= .9); }
  games.forEach(g => {
    const on = !prefs.off.includes(g.id), b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.setAttribute("aria-pressed", on);
    b.innerHTML = '<img alt="" draggable="false" width="84" height="84"><span></span>';
    b.firstChild.src = g.thumb; b.lastChild.textContent = gname(g);
    b.addEventListener("click", () => {
      const off = prefs.off.includes(g.id);
      if(!off && enabled().length === 1) return;   // luôn giữ ít nhất 1 game
      prefs.off = off ? prefs.off.filter(x => x !== g.id) : prefs.off.concat(g.id);
      savePrefs(); renderGrid(); renderPrefs();
    });
    gOpts.appendChild(b);
  });
}
$("resetT").addEventListener("click", () => { usedSec = 0; saveUsed(); updateSleep(); renderPrefs(); });

/* ===== LƯỚI ===== */
const grid = $("grid");
function setTileLabels(){
  grid.querySelectorAll(".tile").forEach(b => b.setAttribute("aria-label", gname(games.find(g => g.id === b.dataset.id))));
}
function renderGrid(){
  grid.textContent = "";
  enabled().forEach((g, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile"; b.dataset.id = g.id;
    const img = new Image();
    img.src = g.thumb; img.width = 512; img.height = 512; img.alt = ""; img.draggable = false;
    img.decoding = "async";
    if(i >= EAGER) img.loading = "lazy";
    b.appendChild(img);
    b.addEventListener("click", () => {
      if(isTimeUp()) return;                       // hết giờ: không mở game
      pop();
      if(!reduceMotion.matches){ b.classList.add("pop"); setTimeout(() => b.classList.remove("pop"), 150); }
      setTimeout(() => { pushed = true; location.hash = g.id; }, reduceMotion.matches ? 0 : 150);
    });
    grid.appendChild(b);
  });
  setTileLabels(); fitGrid();
}
/* Chọn số cột + cỡ ô lớn nhất để toàn bộ game nằm gọn trong khung, không cuộn */
function fitGrid(){
  const n = grid.children.length, w = grid.clientWidth, h = grid.clientHeight;
  if(!n || !w || !h) return;
  const g = w >= 600 ? 20 : 12;
  let best = { s:0, c:1 };
  for(let c = 1; c <= n; c++){
    const r = Math.ceil(n / c), s = Math.min((w - (c - 1) * g) / c, (h - (r - 1) * g) / r);
    if(s > best.s) best = { s, c };
  }
  grid.style.setProperty("--g", g + "px");
  grid.style.setProperty("--c", best.c);
  grid.style.setProperty("--s", Math.max(72, Math.min(260, Math.floor(best.s))) + "px");
}
new ResizeObserver(fitGrid).observe(grid);
addEventListener("resize", fitGrid);
document.addEventListener("contextmenu", e => { if(!e.target.closest(".box")) e.preventDefault(); });
document.addEventListener("dragstart", e => e.preventDefault());

/* ===== MỞ / ĐÓNG GAME ===== */
const stage = $("stage");
let frame = null, pushed = false;
const AUTO_FULLSCREEN = false;   // true: tự bật Fullscreen API (có thể giật trên một số máy)
const MIN_LOAD = 700;            // Màn loading hiện tối thiểu (ms) để không nháy
/* Nút quay lại: hiện vài giây khi vào game (làm gợi ý), sau đó ẩn; vuốt xuống từ phần trên màn hình hoặc đưa chuột lên mép trên để hiện lại */
let homeT = 0;
function revealHome(ms = 3000){
  const h = $("home"); h.classList.add("show"); clearTimeout(homeT);
  homeT = setTimeout(function again(){ if(h.matches(":hover") || document.activeElement === h){ homeT = setTimeout(again, 1500); } else h.classList.remove("show"); }, ms);
}
function hideHome(){ clearTimeout(homeT); $("home").classList.remove("show"); }
function watchSwipe(doc){
  let sx = 0, sy = 0, on = false;
  doc.addEventListener("touchstart", e => { const t = e.touches[0], H = (doc.documentElement.clientHeight || innerHeight); sx = t.clientX; sy = t.clientY; on = e.touches.length === 1 && sy <= H * 0.3; }, { passive:true });
  doc.addEventListener("touchmove", e => { if(!on) return; const t = e.touches[0]; if(Math.hypot(t.clientX - sx, t.clientY - sy) >= 40){ on = false; revealHome(); } }, { passive:true });
  doc.addEventListener("mousemove", e => { if(e.clientY <= 56) revealHome(); }, { passive:true });
}
watchSwipe(document);
(() => { const e = $("edge"); let sy = null;
  e.addEventListener("touchstart", ev => { sy = ev.touches[0].clientY; }, { passive:true });
  e.addEventListener("touchmove", ev => { if(sy !== null && Math.abs(ev.touches[0].clientY - sy) >= 15){ sy = null; revealHome(); } }, { passive:true });
  e.addEventListener("mouseenter", () => revealHome()); })();
function openGame(g){
  if(frame) return;
  window.Track && Track.play("cozyplay", g.id, g.name.vi || g.name.en);   // đếm lượt chơi ẩn danh
  const u = new URL(g.url, location.href), loader = $("loader"), t0 = performance.now();
  u.searchParams.set("lang", lang);
  const f = frame = document.createElement("iframe");
  f.allow = "autoplay; fullscreen";
  f.title = g.name[lang] || g.name[DEFAULT_LANG];
  loader.classList.remove("off");
  stage.appendChild(f);
  stage.classList.add("on");
  document.documentElement.classList.add("playing");   // khoá cuộn trang nền
  startTimer(); revealHome(3500);
  document.title = f.title;
  let started = false;
  // Chỉ hiện game khi: đã tải xong + loading đủ MIN_LOAD
  f.addEventListener("load", () => {
    try{ if(f.contentDocument){ watchSwipe(f.contentDocument); stage.classList.remove("edge"); } else stage.classList.add("edge"); }
    catch(e){ stage.classList.add("edge"); }   // game khác domain: dùng dải cảm ứng ở mép trên
    setTimeout(() => { if(frame !== f) return; f.classList.add("show"); loader.classList.add("off"); },
      Math.max(0, MIN_LOAD - (performance.now() - t0)));
  });
  // Đợi chuyển fullscreen xong rồi mới tải game, tránh giật vì 2 việc nặng chạy cùng lúc
  const start = () => { if(started || frame !== f) return; started = true; f.src = u.href; };
  if(AUTO_FULLSCREEN){
    try{
      const rf = stage.requestFullscreen || stage.webkitRequestFullscreen, r = rf && rf.call(stage);
      r && r.then ? r.then(() => setTimeout(start, 150), start) : setTimeout(start, 200);
    }catch(e){ start(); }
  }else{
    requestAnimationFrame(() => requestAnimationFrame(start));   // đợi loading vẽ xong rồi mới tải game
  }
  setTimeout(start, 600);        // dự phòng nếu trình duyệt không báo xong fullscreen
}
function closeGame(){
  if(!frame) return;
  window.Track && Track.stop();
  hideHome();
  frame.remove(); frame = null; stopTimer();          // xoá iframe: giải phóng bộ nhớ, dừng âm thanh
  stage.classList.remove("on");
  document.documentElement.classList.remove("playing");
  document.title = pageTitle();
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}
function route(){
  const g = games.find(x => x.id === location.hash.slice(1));
  g && !prefs.off.includes(g.id) && !isTimeUp() ? openGame(g) : closeGame();
}
addEventListener("hashchange", route);
$("fGames").addEventListener("click", e => { e.preventDefault(); grid.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "start" }); });
function goHome(){
  if(pushed){ pushed = false; history.back(); }
  else{ history.replaceState(null, "", location.pathname + location.search); route(); }
}
$("home").addEventListener("click", goHome);

/* ===== KHU VỰC PHỤ HUYNH: giữ HOLD_MS mới mở ===== */
const lock = $("lock"), ringC = document.querySelector("#ring circle"), gate = $("gate");
let raf = 0, t0 = 0;
function holdTick(now){
  const p = Math.min((now - t0) / HOLD_MS, 1);
  ringC.style.strokeDashoffset = 163.4 * (1 - p);
  if(p >= 1){ stopHold(); renderPrefs(); gate.classList.add("on"); $("gTitle").focus(); }
  else raf = requestAnimationFrame(holdTick);
}
function stopHold(){ cancelAnimationFrame(raf); raf = 0; ringC.style.strokeDashoffset = 163.4; }
lock.addEventListener("pointerdown", e => { e.preventDefault(); if(!raf){ t0 = performance.now(); raf = requestAnimationFrame(holdTick); } });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => lock.addEventListener(ev, stopHold));
lock.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " ") e.preventDefault(); });
const closeGate = () => gate.classList.remove("on");
$("close").addEventListener("click", closeGate);
$("gX").addEventListener("click", closeGate);
gate.addEventListener("click", e => { if(e.target === gate) closeGate(); });
addEventListener("keydown", e => { if(e.key === "Escape" && gate.classList.contains("on")) closeGate(); });
const sel = $("langSel");
for(const k in i18n){ const o = new Option(i18n[k].name, k); sel.add(o); }
function setLang(l, save){
  lang = l; sel.value = l;
  if(save) try{ localStorage.setItem("lang", l); }catch(e){}
  applyLang();
  menu.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", b.dataset.l === l));
}
sel.addEventListener("change", () => setLang(sel.value, true));

/* ===== NÚT ĐỔI NGÔN NGỮ ===== */
const menu = $("langMenu"), langBtn = $("langBtn");
for(const k in i18n){
  const b = document.createElement("button");
  b.type = "button"; b.dataset.l = k; b.setAttribute("role", "menuitemradio"); b.textContent = i18n[k].name;
  b.addEventListener("click", () => { setLang(k, true); toggleMenu(false); });
  menu.appendChild(b);
}
function toggleMenu(on){
  menu.classList.toggle("on", on);
  langBtn.setAttribute("aria-expanded", on);
}
langBtn.addEventListener("click", e => { e.stopPropagation(); toggleMenu(!menu.classList.contains("on")); });
document.addEventListener("click", e => { if(!e.target.closest("#langMenu")) toggleMenu(false); });

/* ===== NÚT ĐỔI THEME (lưu lựa chọn; chưa chọn thì theo máy) ===== */
const THEME_COLOR = { light:"#F3F0FA", dark:"#0E1020" };   // đổi cùng màu --bg
function setTheme(t, save){
  document.documentElement.dataset.theme = t;
  document.querySelectorAll("meta[name=theme-color]").forEach(m => m.content = THEME_COLOR[t]);
  if(save) try{ localStorage.setItem("theme", t); }catch(e){}
}
$("themeBtn").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
  try{ if(localStorage.getItem("theme")) return; }catch(x){}
  setTheme(e.matches ? "dark" : "light");
});

/* ===== KHỞI ĐỘNG ===== */
lang = detectLang();
renderGrid();
updateSleep();
setTheme(document.documentElement.dataset.theme);
setLang(lang);
route();

/* ===== CHẶN MỞ DEVTOOLS (chỉ cản người dùng thường; không phải bảo mật thật) ===== */
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if(e.key === "F12" ||
     (mod && e.shiftKey && "ijcke".includes(k)) ||      // Ctrl/Cmd+Shift+I/J/C/K/E
     (e.metaKey && e.altKey && "ijcu".includes(k)) ||    // Cmd+Opt+I/J/C/U (Mac)
     (e.ctrlKey && k === "u")){                          // Ctrl+U xem mã nguồn
    e.preventDefault(); e.stopPropagation();
  }
}, true);
</script>
