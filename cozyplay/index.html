<meta name="theme-color" content="#F3F0FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1020" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
/* Chạy trước khi vẽ trang: áp theme đã lưu hoặc theo máy, nên không bị nháy màu */
try{var t=localStorage.getItem("theme")}catch(e){}
document.documentElement.dataset.theme=t||"dark";
</script>
<link rel="preload" href="../shared/fonts/inter-var-latin-vi.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/bars.css">
<link rel="stylesheet" href="../shared/align.css">
<link rel="stylesheet" href="../shared/rails.css">
<link rel="stylesheet" href="../shared/hud.css">
<style>
/* ===== THEME: đổi màu chủ đạo ở --accent (sáng) và --accent trong khối dark ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font);
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
/* Nút đổi theme / ngôn ngữ */
.tools{position:relative;display:flex;gap:10px;align-items:center}
/* Thanh điều hướng dính trên cùng */
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.2px;min-width:0}
.mark svg,.mk{width:36px;height:36px;flex:none}
a.mark{color:inherit;text-decoration:none}
.mark span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;text-decoration:none;box-shadow:var(--shadow);white-space:nowrap}
.pill svg{width:20px;height:20px;flex:none}
@media (max-width:520px){.pill{width:44px;padding:0}.pill span{display:none}}
.ico{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center}
.ico svg{width:26px;height:26px}
.sun{display:none}
[data-theme=dark] .sun{display:block}
[data-theme=dark] .moon{display:none}
#langMenu{position:absolute;top:56px;right:0;min-width:150px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:none}
#langMenu.on{display:block}
#langMenu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:none;font-size:16px;font-weight:600}
#langMenu button[aria-checked=true]{background:var(--accent);color:var(--on-accent)}
/* Ngôn ngữ: công tắc VI | EN luôn hiện, một chạm là đổi (thay cho nút địa cầu + danh sách thả xuống) */
#langMenu{position:static;display:inline-flex;min-width:0;width:auto;padding:3px;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);top:auto;right:auto}
#langMenu button{display:inline-block;width:auto;height:38px;padding:0 14px;border-radius:19px;background:none;color:var(--muted);font-size:15px;font-weight:800;text-align:center}
#langMenu button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
@media (max-width:520px){#langMenu button{padding:0 11px;height:34px;font-size:14px}}
/* Hero thương hiệu */
.hero{position:relative;text-align:center;padding:44px 16px 28px;margin:0 0 8px;background:radial-gradient(700px 260px at 50% 0,var(--hero1),transparent 70%)}
.hero h1{margin:0 auto;max-width:760px;font-size:clamp(32px,7vw,56px);line-height:1.08;letter-spacing:-1px;font-weight:800}
.hero .desc{margin:14px auto 0;max-width:540px;font-size:clamp(15px,2.6vw,18px);line-height:1.55;opacity:.85}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0 0;padding:0;list-style:none}
.trust li{display:flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700}
.trust li:before{content:"✓";color:var(--accent);font-weight:900}
/* Rê chuột / chạm vào khẩu hiệu và 3 cam kết: đổi màu cho nổi bật */
.trust li{cursor:default;transition:background .18s,color .18s,border-color .18s,transform .18s,box-shadow .18s}
.trust li:before{transition:color .18s}
.trust li:hover,.trust li:active{background:var(--accent);color:var(--on-accent);border-color:transparent;transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.trust li:hover:before,.trust li:active:before{color:var(--on-accent)}
.hero h1{transition:color .2s,text-shadow .2s;cursor:default}
.hero h1:hover,.hero h1:active{color:var(--accent);text-shadow:0 4px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
@media (prefers-reduced-motion:reduce){.trust li,.hero h1{transition:none}.trust li:hover{transform:none}}
.logo{width:96px;height:96px;display:block;margin:0 auto 12px;filter:drop-shadow(var(--shadow));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
/* Lưới: 2 cột điện thoại, 3-4 cột tablet, tối đa 6 cột desktop. Khoảng cách >= 16px */
main{max-width:1200px;margin:0 auto;padding:8px 16px 24px}
#grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
@media (min-width:600px){#grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media (min-width:900px){#grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1200px){#grid{grid-template-columns:repeat(6,1fr)}}
.tile{aspect-ratio:1;min-width:140px;padding:0;border-radius:28px;background:var(--card);
  overflow:hidden;box-shadow:var(--shadow);transition:transform .15s ease}
.tile img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile.pop{animation:pop .15s ease}
/* Rê chuột / chạm giữ vào game: phóng to nhẹ + lắc nhẹ để người chơi biết bấm được */
.tile{transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,filter .22s;will-change:transform}
@media (hover:hover){
  .tile:hover{transform:scale(1.09);box-shadow:0 14px 30px rgba(0,0,0,.35);filter:brightness(1.06) saturate(1.1);z-index:2;animation:wiggle .5s ease .08s}
}
.tile:focus-visible{transform:scale(1.07)}
.tile:active{transform:scale(.95);animation:none}
@keyframes wiggle{0%{rotate:0deg}30%{rotate:-3deg}60%{rotate:2.5deg}100%{rotate:0deg}}
@keyframes pop{50%{transform:scale(1.12)}}
.foot{margin-top:32px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--hero1))}
.fin{max-width:1200px;margin:0 auto;padding:36px 16px 20px;display:grid;gap:28px;grid-template-columns:1fr 1fr}
.fbrand{grid-column:1/-1}
@media (min-width:760px){.fin{grid-template-columns:2fr 1fr 1fr}.fbrand{grid-column:auto}}
.fbrand p{max-width:340px;margin:12px 0 0;font-size:14px;line-height:1.5;opacity:.8}
.fcol h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;opacity:.65}
.fcol a{display:block;padding:8px 0;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.fcol a:hover{color:var(--accent)}
.fbar{max-width:1200px;margin:0 auto;padding:16px 16px 28px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.fbar p{margin:0;opacity:.75}
#lock{position:relative;width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--accent) 22%,var(--panel));color:var(--accent);border:2px solid var(--accent);box-sizing:border-box;box-shadow:var(--shadow),inset 0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);display:grid;place-items:center}
#lock .ic{width:28px;height:28px}
#ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
#ring circle{fill:none;stroke:var(--accent);stroke-width:5;stroke-dasharray:163.4;stroke-dashoffset:163.4}
/* Lớp phủ game */
#stage{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;z-index:10;background:#000;display:none;overflow:hidden;contain:strict}
html.playing,html.playing body{overflow:hidden;height:100%}
#stage.on{display:block}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .35s ease}
#stage iframe.show{opacity:1}
#home{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:2;
  width:44px;height:44px;border-radius:50%;padding:0;background:rgba(255,255,255,.34);color:#fff;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.7);
  display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.12)}
#home svg{width:24px;height:24px;filter:drop-shadow(0 0 1px rgba(0,0,0,.95)) drop-shadow(0 0 1.5px rgba(0,0,0,.8)) drop-shadow(0 1px 3px rgba(0,0,0,.5))}
#home:hover{background:rgba(255,255,255,.4)}
#home:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* Ẩn khi đang chơi; chỉ hiện khi người dùng vuốt (cảm ứng) hoặc đưa chuột lên mép trên */
#home{opacity:0;pointer-events:none;transform:translateY(-10px);transition:opacity .25s ease,transform .25s ease}
#home.show,#home:focus-visible{opacity:1;pointer-events:auto;transform:none}
#edge{display:none}
#stage.edge #edge{display:block;position:absolute;top:0;left:0;right:0;height:22px;z-index:1}   /* dự phòng nếu game khác domain (không nghe được cử chỉ bên trong) */
@media (prefers-reduced-motion:reduce){#home{transition:none}}
/* Màn hình loading: phủ kín, che mọi giật hình lúc vào fullscreen, mờ dần khi game sẵn sàng */
#loader{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:linear-gradient(180deg,var(--hero1),var(--bg));pointer-events:none;transition:opacity .35s ease,visibility .35s}
#loader.off{opacity:0;visibility:hidden}
#loader .logo{width:112px;height:112px;margin:0}
#bar{width:min(220px,60vw);height:10px;border-radius:5px;background:var(--line);overflow:hidden}
#bar b{display:block;height:100%;width:40%;border-radius:5px;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
/* Khu vực phụ huynh */
#gate{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px}
#gate.on{display:grid}
/* ===== SETTINGS ===== */
.box{display:flex;flex-direction:column;background:var(--panel);border-radius:26px;width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);user-select:text;-webkit-user-select:text}
.gh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 14px 22px;border-bottom:1px solid var(--line)}
.gt{display:flex;align-items:center;gap:10px;min-width:0}
.gt svg{width:26px;height:26px;flex:none;color:var(--accent)}
.gt h2{margin:0;font-size:20px;font-weight:800}
.gx{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.gx svg{width:20px;height:20px}
.gb{flex:1;min-height:0;overflow-y:auto;padding:16px 22px 6px}
.promo{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:14px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:800;text-decoration:none}
.promo svg{width:22px;height:22px;flex:none}
.promo span{flex:1}
.gs{background:var(--bg);border-radius:18px;padding:16px;margin-bottom:14px}
.gs h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:600;font-size:15px}
.chips button[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.urow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.used{margin:0;font-size:14px;font-weight:600}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.meter[hidden]{display:none}
.meter b{display:block;height:100%;width:0;border-radius:4px;background:var(--accent);transition:width .3s}
.meter.hot b{background:#E5484D}
.sec{padding:7px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:600;font-size:13px;flex:none}
.gs select{width:100%;padding:12px;font-size:16px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.gf{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.gf a{color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;opacity:.8}
.gf a:hover{color:var(--accent);opacity:1}
#close{margin-left:auto;padding:12px 28px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px}
@media (max-width:520px){.gb{padding:14px 14px 4px}.gh{padding-left:16px}.gf{padding-left:14px;padding-right:14px}#close{width:100%;margin:6px 0 0}}
/* Cài đặt phụ huynh */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.opt{background:none;padding:0;font-size:12px;font-weight:600;text-align:center}
.opt img{display:block;width:100%;aspect-ratio:1;border-radius:14px;border:3px solid transparent;margin-bottom:4px}
.opt[aria-pressed=true] img{border-color:var(--accent)}
.opt[aria-pressed=false] img{opacity:.35;filter:grayscale(1)}

/* ===== popup phụ huynh: danh sách game dạng slide + tìm kiếm/lọc, bố cục gọn ===== */
.box{width:min(520px,100%)}
.gs{padding:14px}.gs h3{margin:0}
.gsg .ghd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
#gCount{font-size:12px;font-weight:800;opacity:.7;white-space:nowrap}
.gtools{display:flex;gap:8px;margin-bottom:8px}
#gQ{flex:1;min-width:0;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:15px;padding:0 12px;-webkit-appearance:none;appearance:none}
#gQ:focus{outline:none;border-color:var(--accent)}
#gAll{flex:none;min-height:44px;padding:0 12px;border-radius:12px;font-weight:800;font-size:13px}
.gcats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding-bottom:2px}.gcats::-webkit-scrollbar{display:none}
.gcats button{flex:none;min-height:36px;padding:0 14px;border-radius:99px;background:var(--panel);border:2px solid var(--line);color:var(--ink);font-weight:700;font-size:13px}
.gcats button[aria-pressed=true]{background:var(--accent);color:var(--on-accent,#fff);border-color:transparent}
#gameOpts{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;gap:0}
#gameOpts::-webkit-scrollbar{display:none}
#gameOpts .pg{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:min-content;gap:10px 6px;align-content:start}
#gameOpts .opt{min-width:0;color:var(--ink)}
#gameOpts .opt img{width:56px;height:56px;aspect-ratio:auto;margin:0 auto 4px;border-radius:14px}
#gameOpts .opt span{display:block;font-size:10.5px;line-height:1.15;max-height:2.35em;overflow:hidden;word-break:break-word}
.gnone{grid-column:1/-1;text-align:center;padding:22px 8px;font-size:14px;opacity:.7}
#gNav{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;min-height:36px}
#gNav .gn{width:36px;height:36px;border-radius:50%;background:var(--panel);border:2px solid var(--line);color:var(--ink);font-size:20px;line-height:1;font-weight:800;padding:0}
#gNav .gn:disabled{opacity:.35}
#gDots{display:flex;align-items:center;justify-content:center;gap:0;color:var(--accent);min-width:0}
#gDots button{width:24px;height:24px;padding:0;background:none;border:0;display:grid;place-items:center;color:inherit}
#gDots button::after{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.28;transition:all .2s}
#gDots button[aria-current=true]::after{opacity:1;width:18px;border-radius:5px}
@media (orientation:landscape) and (max-height:520px){.box{width:min(900px,100%)}.gb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:0 14px;align-items:start}.gb .promo{grid-column:1/-1}.gs{margin-bottom:10px}#gameOpts .opt img{width:48px;height:48px}}

/* gọn: nút thời gian 4 cột, chân popup một hàng, ẩn thông báo sự kiện khi popup mở */
.gs{margin-bottom:10px;padding:12px}
#timeOpts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#timeOpts button{min-height:40px;padding:0 4px;font-size:13px;border-radius:12px;white-space:nowrap}
.urow{margin-top:8px}.urow .used{font-size:13px;margin:0}
@media (max-width:520px){.gf{flex-wrap:nowrap;gap:10px 14px;padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.gf a{font-size:13px;white-space:nowrap}#close{width:auto!important;margin:0 0 0 auto!important;min-height:44px;padding:0 20px;flex:none}}
body:has(#gate.on) .ns-toast{display:none!important}
.gcats[hidden],#gNav[hidden]{display:none!important}
@media (orientation:landscape) and (max-height:520px){.gb .promo{padding:8px 14px;min-height:0}.gs h3{font-size:12px}#gQ{height:38px}#gAll{min-height:38px}.gcats button{min-height:32px}#timeOpts button{min-height:34px}.gsg .ghd{margin-bottom:6px}.gtools,.gcats{margin-bottom:6px}#gNav{margin-top:4px}}
/* Hết giờ chơi + thanh thời gian còn lại */
#sleep{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 16px;padding:14px 18px;border-radius:24px;background:var(--panel);box-shadow:var(--shadow);font-weight:700}
#sleep[hidden]{display:none}
#sleep svg{width:48px;height:48px;flex:none}
body.timeup #grid{opacity:.35;filter:grayscale(1)}
/* Thời gian còn lại: trong game (góc trên phải) và ở trang chủ */
.left{display:none;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.left.on{display:inline-flex}
.left.low{background:#E5484D;color:#fff}
.left svg{width:24px;height:24px;flex:none}

let lang = DEFAULT_LANG;

function detectLang(){
  try{ const s = localStorage.getItem("lang"); if(s && i18n[s]) return s; }catch(e){}
  for(const l of (navigator.languages || [navigator.language || ""])){
    const c = String(l).split("-")[0].toLowerCase();
    if(i18n[c]) return c;
  }
  return DEFAULT_LANG;
}
const pageTitle = () => BRAND + " · " + i18n[lang].slogan;

  const t = i18n[lang]; renderFind();
  document.documentElement.lang = lang;
  document.title = pageTitle();
  document.querySelector('meta[name=description]').content = t.desc;
  document.querySelector('meta[property="og:title"]').content = pageTitle();
  $("hName").textContent = BRAND;
  $("hSlogan").textContent = t.slogan;
  $("hDesc").textContent = t.desc;
  $("madeBy").textContent = "© " + new Date().getFullYear() + " " + BRAND + ". " + t.rights;
  $("fName").textContent = BRAND; $("fTag").textContent = t.desc;
  $("tAds").textContent = t.noAds; $("tTrack").textContent = t.noTrack; $("tFree").textContent = t.free;
  $("fH1").textContent = t.product; $("fH2").textContent = t.support;
  $("fGames").textContent = t.games; $("fHub").textContent = t.hub; $("fRank").textContent = t.rank; $("fHelp").textContent = t.helpRes;

function pop(){

    if(ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.frequency.setValueAtTime(520, t);

}

const gdots = $("gdots"), MIN_TILE = 64;

function fitGrid(){
  const n = grid.children.length, w = grid.clientWidth, h = grid.clientHeight;
  if(!n || !w || !h) return;

  const g = w >= 600 ? 20 : 12;

    grid.querySelectorAll(".sn").forEach(t => t.classList.remove("sn")); gdots.textContent = "";

  }

  gPage = { step: c * (s + gx), n: pages, per };

}
function buildDots(){

  startTimer(); revealHome(3500);
  document.title = f.title;
  let started = false;
  // Chỉ hiện game khi: đã tải xong + loading đủ MIN_LOAD
  f.addEventListener("load", () => {
    try{ if(f.contentDocument){ watchSwipe(f.contentDocument); stage.classList.remove("edge"); } else stage.classList.add("edge"); }
    catch(e){ stage.classList.add("edge"); }   // game khác domain: dùng dải cảm ứng ở mép trên
    setTimeout(() => { if(frame !== f) return; f.classList.add("show"); loader.classList.add("off"); },
      Math.max(0, MIN_LOAD - (performance.now() - t0)));
  });
  // Đợi chuyển fullscreen xong rồi mới tải game, tránh giật vì 2 việc nặng chạy cùng lúc
  const start = () => { if(started || frame !== f) return; started = true; f.src = u.href; };
  if(AUTO_FULLSCREEN){
    try{
      const rf = stage.requestFullscreen || stage.webkitRequestFullscreen, r = rf && rf.call(stage);
      r && r.then ? r.then(() => setTimeout(start, 150), start) : setTimeout(start, 200);
    }catch(e){ start(); }
  }else{
    requestAnimationFrame(() => requestAnimationFrame(start));   // đợi loading vẽ xong rồi mới tải game
  }
  setTimeout(start, 600);        // dự phòng nếu trình duyệt không báo xong fullscreen
}
/* Tắt HẲN âm thanh của game cũ (giọng đọc + Web Audio) trước khi rời / mở game khác */
function silenceGame(f){
  try{ if(f && f.contentWindow) f.contentWindow.postMessage({ np:1, type:"stopAudio" }, location.origin); }catch(e){}
  try{ if(f && f.contentWindow && f.contentWindow.NPAudio) f.contentWindow.NPAudio.kill(); }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
function closeGame(){
  if(!frame) return;
  silenceGame(frame);
  try{ frame.contentWindow.NPResume && frame.contentWindow.NPResume.flush(); }catch(e){}   // lưu ván dở trước khi gỡ iframe
  window.Track && Track.stop();
  hideHome();
  frame.remove(); frame = null; stopTimer();          // xoá iframe: giải phóng bộ nhớ, dừng âm thanh
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}   // giọng đọc có thể còn trong hàng đợi của tab
  stage.classList.remove("on");
  document.documentElement.classList.remove("playing");
  document.title = pageTitle();
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  /* về trang chủ: tính lại bố cục lưới (cỡ cửa sổ có thể đã đổi lúc đang chơi) */
  requestAnimationFrame(() => { try{ fitGrid(); }catch(e){} setTimeout(() => { try{ fitGrid(); }catch(e){} }, 250); });
  try{ window.NPPortalUI && NPPortalUI.refresh(); }catch(e){}   // ván dở vừa lưu -> thẻ "Chơi tiếp"
}
/* hỏi trước khi thoát ván đang chơi (shared/exitconfirm.js trong game): 🏠 / Back của trình duyệt */
let exitOK = 0, curId = "";
function gamePlaying(){ try{ const w = frame && frame.contentWindow; return !!(w && w.NPExit && w.NPExit.playing()); }catch(e){ return false; } }
function askLeave(go){
  try{ const w = frame.contentWindow; w.NPExit.ask(() => { try{ w.NPExit.allow(); }catch(e){} exitOK = Date.now() + 1500; go(); }); }
  catch(e){ exitOK = Date.now() + 1500; go(); }
}
function route(){
  const g = games.find(x => x.id === location.hash.slice(1));
  if(g) curId = g.id;
  if(!g && frame && Date.now() > exitOK && gamePlaying()){   // Back của trình duyệt khi game không tự giữ mục lịch sử: quay lại mục game rồi hỏi
    const id = curId; history.forward();
    setTimeout(() => { if(location.hash.slice(1) !== id) history.pushState(null, "", "#" + id); }, 250);
    askLeave(() => { history.back(); });
    return;
  }
  g && !prefs.off.includes(g.id) && !isTimeUp() ? openGame(g) : closeGame();
}
addEventListener("hashchange", route);
$("fGames").addEventListener("click", e => { e.preventDefault(); grid.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "start" }); });
function goHome(){
  if(frame && Date.now() > exitOK && gamePlaying()){ askLeave(goHome); return; }
  try{ if(frame && frame.contentWindow.NPResume && frame.contentWindow.NPResume.exitPlay()) return; }catch(e){}   // đang chơi: về màn chọn của game trước, bấm lần nữa mới đóng game
  if(pushed){ pushed = false; history.back(); }
  else{ history.replaceState(null, "", location.pathname + location.search); route(); }
}
$("home").addEventListener("click", goHome);

/* ===== KHU VỰC PHỤ HUYNH: giữ HOLD_MS mới mở ===== */
const lock = $("lock"), ringC = document.querySelector("#ring circle"), gate = $("gate");
let raf = 0, t0 = 0;
function holdTick(now){
  const p = Math.min((now - t0) / HOLD_MS, 1);
  ringC.style.strokeDashoffset = 163.4 * (1 - p);
  if(p >= 1){ stopHold(); const openGate = () => { renderPrefs(); gate.classList.add("on"); $("gTitle").focus(); }; if(window.ParentGate) ParentGate.ask(openGate); else openGate(); }
  else raf = requestAnimationFrame(holdTick);
}
function stopHold(){ cancelAnimationFrame(raf); raf = 0; ringC.style.strokeDashoffset = 163.4; }
lock.addEventListener("pointerdown", e => { e.preventDefault(); if(!raf){ t0 = performance.now(); raf = requestAnimationFrame(holdTick); } });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => lock.addEventListener(ev, stopHold));
lock.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " ") e.preventDefault(); });
const closeGate = () => gate.classList.remove("on");
$("close").addEventListener("click", closeGate);
$("gX").addEventListener("click", closeGate);
gate.addEventListener("click", e => { if(e.target === gate) closeGate(); });
addEventListener("keydown", e => { if(e.key === "Escape" && gate.classList.contains("on")) closeGate(); });
function setLang(l, save){
  lang = l;
  if(save) try{ localStorage.setItem("lang", l); }catch(e){}
  applyLang();
  menu.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
}

/* ===== NÚT ĐỔI NGÔN NGỮ ===== */
const menu = $("langMenu");
for(const k in i18n){
  const b = document.createElement("button");
  b.type = "button"; b.dataset.l = k; b.textContent = k.toUpperCase(); b.title = i18n[k].name; b.lang = k; b.setAttribute("aria-pressed", String(k === (typeof lang !== "undefined" ? lang : "")));
  b.addEventListener("click", () => { setLang(k, true); });
  menu.appendChild(b);
}

/* ===== NÚT ĐỔI THEME (lưu lựa chọn; chưa chọn thì theo máy) ===== */
const THEME_COLOR = { light:"#F3F0FA", dark:"#0E1020" };   // đổi cùng màu --bg
function setTheme(t, save){
  document.documentElement.dataset.theme = t;
  document.querySelectorAll("meta[name=theme-color]").forEach(m => m.content = THEME_COLOR[t]);
  if(save) try{ localStorage.setItem("theme", t); }catch(e){}
}
$("themeBtn").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
  try{ if(localStorage.getItem("theme")) return; }catch(x){}
  setTheme(e.matches ? "dark" : "light");
});

/* ===== THẺ HÔM NAY / CHƠI TIẾP + HUY HIỆU (shared/portalui.js) ===== */
function openFromPortal(g, resume){
  if(frame || isTimeUp() || prefs.off.includes(g.id)) return;
  pop();
  const old = g.url; if(resume) g.url = old + (old.indexOf("?") < 0 ? "?" : "&") + "resume=1";   // cùng cách rails.js mở ván dở
  pushed = true; location.hash = g.id; setTimeout(() => { g.url = old; }, 800);
}
NPPortalUI.init({ portal:"cozy", games:games, getLang:() => lang, enabled, open:openFromPortal,
  onTopic:() => { renderGrid(); $("noRes").hidden = grid.children.length > 0; } });   // chip chủ đề: dựng lại lưới (fitGrid dàn lại một màn hình, chỉ số trang cập nhật)

/* ===== KHỞI ĐỘNG ===== */
lang = detectLang();
updateSleep();
setTheme(document.documentElement.dataset.theme);
setLang(lang);   // chữ hero/chân trang có TRƯỚC khi dàn lưới (nếu không lưới dàn lúc chữ còn trống rồi nhảy lại)
renderGrid();
route();

/* ===== CHẶN MỞ DEVTOOLS (chỉ cản người dùng thường; không phải bảo mật thật) ===== */
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if(e.key === "F12" ||
     (mod && e.shiftKey && "ijcke".includes(k)) ||      // Ctrl/Cmd+Shift+I/J/C/K/E
     (e.metaKey && e.altKey && "ijcu".includes(k)) ||    // Cmd+Opt+I/J/C/U (Mac)
     (e.ctrlKey && k === "u")){                          // Ctrl+U xem mã nguồn
    e.preventDefault(); e.stopPropagation();
  }
}, true);

      if(frame && curId === g.id){ if(resume){ try{ frame.contentWindow.NPResume && frame.contentWindow.NPResume.flush(); }catch(e){} const u = new URL(frame.src); u.searchParams.set("resume","1"); frame.src = u.href; } return; }
