<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt bộ icon 2D — so với emoji gốc</title>
<style>
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#12102a;color:#eee;padding:20px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:#aab}
.row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.g{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;flex:1 1 560px}
.c{border-radius:18px;padding:10px 6px 8px;text-align:center;border:1.5px solid rgba(255,255,255,.2)}
.dark{background:linear-gradient(160deg,#1E1B4A,#12132A);color:#C9CCF0}
.light{background:#fff7ea;color:#3a2a55;border-color:#d9c9ad}
.c .e{font-size:56px;line-height:56px;height:56px;display:grid;place-items:center}
.c .e .npic{width:56px;height:56px}
.c small{display:block;font-size:11px;margin-top:4px;opacity:.8}
h2{font-size:14px;margin:18px 0 8px;color:#fff}
.sw{display:flex;gap:10px;margin:8px 0 16px}.sw button{border:0;border-radius:99px;padding:8px 14px;font:700 13px system-ui;cursor:pointer;color:#fff}
</style></head><body>
<h1>Bộ icon 2D (sticker) — đối chiếu với emoji gốc</h1>
<p>Hàng trên mỗi khối: emoji gốc đang dùng. Hàng dưới: bộ SVG vẽ lại. Nút đổi theme bên dưới cho thấy icon ăn theo màu theme. Game vẫn dùng emoji cho tới khi bạn duyệt.</p>
<div class="sw" id="sw"></div>
<h2>Nền thẻ tối (Night)</h2><div class="row"><div class="g" id="d1"></div></div><div class="row"><div class="g" id="d2"></div></div>
<h2>Nền thẻ sáng (Pop)</h2><div class="row"><div class="g" id="l1"></div></div><div class="row"><div class="g" id="l2"></div></div>
<script src="shared/npicon.js"></script>
<script>
var EM={stopwatch:"⏱️",music:"🎵",dice:"🎲",runner:"🏃",ring:"⭕",eyeoff:"🙈",ghost:"👻",cut:"🥮",spin:"🔄",pizza:"🍕",fog:"🌫️",palette:"🎨",swirl:"🌀",bulb:"💡",tornado:"🌪️",pen:"✍️",arrow:"➡️",brain:"🧠",twice:"✌️",drizzle:"🌦️",storm:"⛈️",car:"🚗",torch:"🔦",scooter:"🛵",sparkle:"🆕",ice:"🧊",truck:"🚚",moneybag:"💰",envelope:"🧧",hourglass:"⏳",cap:"🎓",bamboo:"🎋",island:"🏝️",raincloud:"🌧️",ox:"🐂",calendar:"📅",play:"▶️",trash:"🗑️",crown:"👑",lock:"🔒"};
var C1="#7C5CFF",MODE="contrast";
function render(){["d2","l2"].forEach(function(id){var g=document.getElementById(id);g.innerHTML="";NPIcon.names().forEach(function(n){g.insertAdjacentHTML("beforeend",'<div class="c '+(id==="d2"?"dark":"light")+'"><div class="e">'+NPIcon.svg(n,{c1:C1,mode:MODE})+'</div><small>'+n+'</small></div>')})})}
["d1","l1"].forEach(function(id){var g=document.getElementById(id);NPIcon.names().forEach(function(n){g.insertAdjacentHTML("beforeend",'<div class="c '+(id==="d1"?"dark":"light")+'"><div class="e">'+EM[n]+'</div><small>'+n+'</small></div>')})});
var T=[["Tím","#7C5CFF"],["Cam","#FF8A3D"],["Xanh lá","#2FBF71"],["Xanh dương","#2E8BFF"],["Hồng","#FF5C9E"]];
var sw=document.getElementById("sw");
T.forEach(function(t){var b=document.createElement("button");b.textContent=t[0];b.style.background=t[1];b.onclick=function(){C1=t[1];document.documentElement.style.setProperty("--accent",t[1]);render()};sw.appendChild(b)});
[["Tương phản","contrast"],["Cùng tông","match"],["Màu gốc","off"]].forEach(function(m){var b=document.createElement("button");b.textContent=m[0];b.style.background="#444";b.onclick=function(){MODE=m[1];render()};sw.appendChild(b)});
render();
</script></body></html>
