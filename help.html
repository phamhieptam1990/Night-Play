<!doctype html>
<html lang="vi" data-app="hub">
<head>
<meta charset="utf-8">
<script src="shared/guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141F">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='32' height='64' fill='%23FF5A1F'/%3E%3Crect x='32' width='32' height='64' fill='%237C5CFF'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23fff'/%3E%3C/svg%3E">
<title>Chơi hộ bạn · Play Hub</title>
<script>
try{var t=localStorage.getItem("theme")}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
(function(){var q=new URLSearchParams(location.search).get("lang"),s=null;try{s=localStorage.getItem("lang")}catch(e){}
var l=[q,s].find(function(x){return x==="vi"||x==="en"})||(/^vi/i.test(navigator.language||"")?"vi":"en");document.documentElement.lang=l;})();
</script>
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/bars.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.nav{flex:none;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--ink);text-decoration:none}
.mark svg{width:34px;height:34px;flex:none}
.tools{position:relative;display:flex;gap:10px;align-items:center}
.ico{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;padding:0}.ico svg{width:22px;height:22px}
.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
.seg{display:inline-flex;background:var(--panel);box-shadow:var(--shadow);border-radius:22px;padding:3px}
.seg button{background:none;border-radius:19px;height:38px;padding:0 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
main{flex:1;min-height:0;display:grid;place-items:center;padding:12px 16px}
.card{width:min(460px,100%);background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:clamp(16px,4vh,28px) clamp(16px,5vw,26px);text-align:center}
.card .em{width:60px;height:60px;margin:0 auto 10px;display:block;color:var(--accent)}
h1{margin:0 0 4px;font-size:clamp(21px,5vw,26px);line-height:1.2}
.game{margin:0 0 10px;color:var(--accent);font-weight:800;font-size:17px}
.card p{margin:0 0 10px;color:var(--ink2);font-size:15px}
ul.how{list-style:none;margin:10px 0 14px;padding:0;text-align:left;display:grid;gap:8px}
ul.how li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
ul.how b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:13px}
.cta{width:100%;height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:17px}
.cta:disabled{opacity:.5}
.sec{width:100%;height:46px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);font-weight:700;margin-top:8px}
.small{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.err{color:var(--warn);min-height:20px;font-size:14px;margin:8px 0 0}
.big{font-size:56px;font-weight:800;line-height:1.05;color:var(--accent);margin:6px 0 0;font-variant-numeric:tabular-nums}
/* màn hình chơi */
#stage{position:fixed;inset:0;z-index:20;background:#000;display:none}
#stage.on{display:block}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#tag{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:700;pointer-events:none;white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis}
#quit{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.7);color:#fff;font-size:20px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#res{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:rgba(8,9,20,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:16px}
#res.on{display:grid}
@media (max-height:700px),(max-width:380px){ul.how{display:none}.card .em{width:44px;height:44px;margin-bottom:6px}.card{padding:14px 18px}.card p{margin-bottom:6px}.small{margin-top:8px}}
@media (max-height:600px){.card .em{display:none}.small{font-size:12px;line-height:1.35}h1{font-size:20px}.cta{height:46px}}
.foot{flex:none;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;padding:6px 16px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--hero1));font-size:13px}
.foot a{padding:6px 0;color:var(--ink);text-decoration:none}
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <a class="mark" href="index.html"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#7C5CFF"/><path d="M0 0h32v64H0z" fill="#FF5A1F" clip-path="inset(0 round 18px 0 0 18px)"/><circle cx="32" cy="32" r="13" fill="#fff"/></svg><span>Play Hub</span></a>
  <div class="tools">
    <div class="seg" role="group" id="langSeg"><button type="button" data-l="vi" lang="vi" aria-label="Tiếng Việt">VI</button><button type="button" data-l="en" lang="en" aria-label="English">EN</button></div>
    <button id="themeBtn" class="ico" type="button" aria-label="Theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </div>
</nav>
<main><section class="card" id="card" aria-live="polite"></section></main>
<footer class="foot"><a id="fHome" href="index.html"></a><a id="fPriv" href="privacy.html"></a></footer>

<div id="stage" role="dialog" aria-modal="true">
  <div id="tag"></div>
  <button id="quit" type="button" aria-label="Close">✕</button>
  <div id="res"><section class="card" id="resCard"></section></div>
</div>

<script src="shared/social.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id), root = document.documentElement;
const TXT = {
  vi: { bad: "Link không hợp lệ", badP: "Đường link này bị thiếu hoặc sai. Hãy nhờ bạn của bạn gửi lại link.", used: "Link này đã được dùng hoặc đã hết hạn", usedP: "Mỗi link chỉ dùng được một lần và hết hạn sau 24 giờ.", slow: "Thao tác quá nhanh, vui lòng thử lại sau ít phút.",
        t: "Bạn được nhờ chơi hộ một lượt!", p: "Một người bạn muốn bạn chơi hộ họ một lượt. Kết quả sẽ được gửi về cho bạn ấy.", s1: "Bạn chơi đúng một lượt, không cần tài khoản.", s2: "Điểm của bạn được mã hoá rồi gửi cho người nhờ, họ xem ngay trong game của họ.", s3: "Link chỉ dùng được một lần và bạn không thể chia sẻ tiếp.",
        start: "Bắt đầu chơi hộ", resume: "Tiếp tục chơi hộ", privacy: "Chúng tôi không lưu thông tin của bạn. Kết quả được mã hoá, máy chủ không đọc được và xoá ngay khi người nhờ nhận.", playing: "Bạn đang chơi hộ", sending: "Đang gửi kết quả…",
        doneT: "Đã gửi kết quả!", doneP: "Cảm ơn bạn đã chơi hộ. Người bạn của bạn sẽ thấy kết quả ngay.", pts: "điểm", more: "Khám phá Play Hub", retry: "Gửi lại", sendErr: "Chưa gửi được kết quả. Vui lòng thử lại.", close: "Đóng", home: "Trang chủ", priv: "Quyền riêng tư", title: "Chơi hộ bạn · Play Hub", theme: "Sáng / Tối" },
  en: { bad: "Invalid link", badP: "This link is missing or incorrect. Ask your friend to send it again.", used: "This link was already used or has expired", usedP: "Each link works once and expires after 24 hours.", slow: "Too many tries, please wait a few minutes.",
        t: "You've been asked to play a round!", p: "A friend would like you to play one round for them. The result will be sent back to them.", s1: "You play exactly one round, no account needed.", s2: "Your score is encrypted and sent to your friend, who sees it right in their game.", s3: "The link works once and you can't share it further.",
        start: "Start playing for them", resume: "Continue playing for them", privacy: "We don't store your info. The result is encrypted, the server can't read it, and it's deleted as soon as your friend receives it.", playing: "You're playing for a friend", sending: "Sending result…",
        doneT: "Result sent!", doneP: "Thanks for playing for them. Your friend will see it right away.", pts: "points", more: "Explore Play Hub", retry: "Send again", sendErr: "Couldn't send the result. Please try again.", close: "Close", home: "Home", priv: "Privacy", title: "Play for a friend · Play Hub", theme: "Light / Dark" }
};
const L = () => TXT[root.lang === "en" ? "en" : "vi"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = '<svg class="em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>';
const WARN = '<svg class="em" style="color:var(--warn)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/></svg>';

/* link: help.html#<id 22 ký tự>.<khoá 43 ký tự>.<game> — phần sau # không bao giờ được gửi lên máy chủ */
const parts = location.hash.slice(1).split(".");
const id = parts[0], key = parts[1], game = parts[2];
const valid = /^[A-Za-z0-9_-]{22}$/.test(id || "") && /^[A-Za-z0-9_-]{43}$/.test(key || "") && NPS.GAMES[game];
const tokKey = "np_help_" + id;
const getTok = () => { try { return sessionStorage.getItem(tokKey); } catch (e) { return null; } };
const setTok = v => { try { sessionStorage.setItem(tokKey, v); } catch (e) {} };
let result = null, stage = "intro";

function view() {
  const t = L(), card = $("card"); document.title = t.title; $("fHome").textContent = t.home; $("fPriv").textContent = t.priv; $("themeBtn").setAttribute("aria-label", t.theme);
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === root.lang)));
  if (!valid) { card.innerHTML = WARN + "<h1>" + esc(t.bad) + "</h1><p>" + esc(t.badP) + '</p><a href="index.html">' + esc(t.more) + "</a>"; return; }
  if (stage === "used") { card.innerHTML = WARN + "<h1>" + esc(t.used) + "</h1><p>" + esc(t.usedP) + '</p><a href="index.html">' + esc(t.more) + "</a>"; return; }
  if (stage === "done") { card.innerHTML = ICON + "<h1>" + esc(t.doneT) + '</h1><div class="big">' + (result.score | 0) + "</div><p>" + esc(t.pts) + " · " + esc(NPS.gameName(game)) + "</p><p>" + esc(t.doneP) + '</p><button class="cta" id="more" type="button">' + esc(t.more) + "</button>"; $("more").onclick = () => { location.href = "index.html"; }; return; }
  card.innerHTML = ICON + "<h1>" + esc(t.t) + '</h1><p class="game">' + esc(NPS.gameName(game)) + "</p><p>" + esc(t.p) + '</p><ul class="how"><li><b>1</b><span>' + esc(t.s1) + "</span></li><li><b>2</b><span>" + esc(t.s2) + "</span></li><li><b>3</b><span>" + esc(t.s3) + '</span></li></ul><button class="cta" id="go" type="button">' + esc(getTok() ? t.resume : t.start) + '</button><p class="err" id="err" role="alert"></p><p class="small">' + esc(t.privacy) + "</p>";
  $("go").onclick = start;
}
let starting = false;
function start() {
  if (starting) return; starting = true;
  const btn = $("go"); btn.disabled = true;
  (getTok() ? Promise.resolve(getTok()) : NPS.claim(id).then(tok => { setTok(tok); return tok; }))
    .then(play).catch(e => { starting = false; if (e.message === "slow") { btn.disabled = false; $("err").textContent = L().slow; } else { stage = "used"; view(); } });
}
function play() {
  const g = NPS.GAMES[game], f = document.createElement("iframe"), u = new URL(g.url, location.href);
  u.searchParams.set("helper", "1"); u.searchParams.set("lang", root.lang);
  f.allow = "autoplay"; f.title = NPS.gameName(game); f.src = u.href;
  $("stage").querySelectorAll("iframe").forEach(x => x.remove()); $("stage").insertBefore(f, $("tag"));
  $("tag").textContent = L().playing + " · " + NPS.gameName(game); $("stage").classList.add("on"); $("res").classList.remove("on"); root.classList.add("playing");
}
$("quit").onclick = () => { starting = false; $("stage").classList.remove("on"); $("stage").querySelectorAll("iframe").forEach(x => x.remove()); view(); };
addEventListener("message", e => {
  const f = $("stage").querySelector("iframe"); if (e.origin !== location.origin || !f || e.source !== f.contentWindow || !e.data || e.data.np !== 1 || e.data.type !== "result" || result) return;
  result = { v: 1, game, score: e.data.score | 0, extra: e.data.extra || null, at: Date.now() };
  setTimeout(send, 900);
});
function send() {
  const t = L(); $("res").classList.add("on"); $("resCard").innerHTML = ICON + "<h1>" + (result.score | 0) + " " + esc(t.pts) + "</h1><p>" + esc(t.sending) + "</p>";
  NPS.sendResult(id, getTok(), key, result).then(() => {
    try { sessionStorage.removeItem(tokKey); } catch (e) {} stage = "done"; $("stage").classList.remove("on"); $("stage").querySelectorAll("iframe").forEach(x => x.remove()); root.classList.remove("playing"); view();
  }).catch(() => {
    $("resCard").innerHTML = WARN + "<h1>" + (result.score | 0) + " " + esc(t.pts) + "</h1><p>" + esc(t.sendErr) + '</p><button class="cta" id="re" type="button">' + esc(t.retry) + "</button>"; $("re").onclick = send;
  });
}
function setLang(l, save) { root.lang = l; if (save) try { localStorage.setItem("lang", l); } catch (e) {} if (!$("stage").classList.contains("on")) view(); else $("tag").textContent = L().playing + " · " + NPS.gameName(game); }
document.querySelectorAll("#langSeg button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l, true)));
$("themeBtn").addEventListener("click", () => { const n = root.dataset.theme === "dark" ? "light" : "dark"; root.dataset.theme = n; document.querySelector("meta[name=theme-color]").content = n === "dark" ? "#12141F" : "#F6F4F1"; try { localStorage.setItem("theme", n); } catch (e) {} });
view();
</script>
<script src="shared/bars.js"></script>
</body>
</html>
