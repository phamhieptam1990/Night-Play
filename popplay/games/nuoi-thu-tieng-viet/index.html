<body>
<div class="app">
  <div class="side">
    <div class="top">
      <h1 id="title" class="pt-title" data-pt="nuoi-thu-tieng-viet">Nhà Của Bi</h1>
      <button class="ib" id="homeBtn" type="button" aria-label="Về màn chọn" hidden>🏠</button>
      <button class="ib" id="soundBtn" type="button" aria-label="Âm thanh">🔊</button>
    </div>
  </div>
  <div class="play" id="play">
      <section class="scr" id="home">
        <div class="hscene"><div class="hwin"></div><div class="hfloor"></div></div>
        <div class="tiles"><button class="tile" id="playTile" type="button" aria-label="Vào nhà của Bi" data-nic="play"></button></div>
      </section>
      <section class="scr" id="room" hidden>
        <div class="rm" id="rm" data-zone="living">
          <div class="rbox">
            <div class="ce"></div>
            <div class="wb"><div class="bunt"></div><div class="props" id="props"></div></div>
            <div class="wl"></div><div class="wr"></div><div class="fl"><div class="shine"></div></div>
          </div>
          <div class="pw" id="pw"><div class="in"><img id="pet" src="../../../shared/art/nuoi-thu/cun.svg" alt="Bi, chú cún con">
            <img class="mud" src="../../../shared/art/nuoi-thu/cun-ban.svg" alt=""><img class="fit" id="fit" alt="" hidden>
            <div class="foam" id="foam"></div></div><img class="want" id="want" alt="" hidden></div>
          <div class="say" id="say"></div><div class="dark" id="dark"></div><div class="rstats" id="rStats"></div>
        </div>
        <div class="dock" id="dock"><div class="tray" id="tray"></div><div class="zbar" id="zbar" role="tablist"></div></div>
      </section>
      <div class="ov" id="ovCh" hidden>
        <h2 id="chH">Thách đấu!</h2><div class="ris" id="chR"></div>
        <div class="row"><button class="ib2" id="chNo" data-nic="close" type="button" aria-label="Đóng"></button><button class="go" id="chGo" data-nic="play" type="button" aria-label="Chơi">
</button></div>
      </div>
      <div class="ov" id="ovEnd" hidden>
        <h2 id="enH"></h2><div class="ris" id="enR"></div>
        <div class="row"><button class="ib2" id="enNo" data-nic="close" type="button" aria-label="Xong"></button>
<button class="go" id="enGo" data-nic="play" type="button" aria-label="Chơi lại"></button>
<button class="ib2" id="enShare" data-nic="share" type="button" aria-label="Thách bạn" hidden></button></div>
      </div>
      <div class="mgh" id="mgh" hidden><span class="mgs-n"><img src="../../../shared/art/nuoi-thu/sao.svg" alt=""><b id="mgScore">0</b></span>
<div class="mgtb"><i id="mgTime"></i></div><span class="mgc" id="mgCombo"></span></div><div class="cdn" id="mgCd" hidden></div>
      <div class="toast" id="toast" role="status"></div>
  </div>
</div>
<script src="../../../shared/worldkit/world-kit.js"></script>
