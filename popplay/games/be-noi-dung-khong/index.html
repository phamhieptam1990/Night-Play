<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/device.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Nói Đúng Không?</title>
<link rel="preload" href="../../../shared/fonts/inter-var-latin-vi.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../../shared/fonts.css">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Bé Nói Đúng Không? — game hỏi "2 + 3 = ?", bé NÓI TO đáp án (hoặc chạm 1 trong 3 nút to). Nhân vật nghe, nhảy múa khi đúng.
   Micro chỉ bật sau khi phụ huynh đồng ý; game KHÔNG ghi / lưu / gửi âm thanh. Thẻ & clip khoe chỉ dựng từ CHỮ phiên âm trong bộ nhớ ván chơi. Luôn vừa một màn hình. */
:root{--bg:#F4F0FF;--ink:#2d2250;--muted:#7a6fa6;--panel:#fff;--line:#e0d8fb;--accent:#7A5CFF;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--warn:#ffb020;--shadow:0 8px 24px rgba(70,40,160,.16);
  --display:var(--font);--w:min(calc(100vw - 24px),calc((100dvh - 176px)*.75),760px)}
:root[data-theme="dark"]{--bg:#1B1740;--ink:#F2F0FF;--muted:#b3acdc;--panel:#2a2562;--line:#3b3580;--accent:#9a82ff;--on-accent:#150a40;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800}
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sb:linear-gradient(#ffe3c2,#ffd1e0);--pb:linear-gradient(#efe6ff,#d9ecff);--sp:#fff;--si:#2d2250;--sa:#7A5CFF;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid rgba(255,255,255,.9);--sh:0 1cqw 3cqw rgba(0,0,0,.18)}
/* ===== Night Pass: hình giao diện quanh sân khấu, mỗi lần bé nói đúng nổ hình theo chủ đề, phát sáng — bản free không có ===== */
.stage .stg-o{position:absolute;z-index:3;pointer-events:none;font-size:8cqw;line-height:1;font-style:normal;opacity:.92;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.3));animation:stgf 3s ease-in-out infinite}
.stage .stg-o.a{left:1.6cqw;top:1.6cqw}.stage .stg-o.b{right:1.6cqw;bottom:1.6cqw;animation-delay:-1.4s}.stage .stg-o.c{left:1.6cqw;bottom:1.6cqw;font-size:6cqw;animation-delay:-2.2s}
@keyframes stgf{50%{transform:translateY(-1.4cqw) rotate(6deg)}}
.eb{position:absolute;z-index:9;pointer-events:none;font-size:8cqw;line-height:1;font-style:normal;left:50%;top:38%;animation:ebur 1s ease-out forwards}
@keyframes ebur{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--rt))}}
.pro .qcard{box-shadow:var(--sh),0 0 4cqw color-mix(in srgb,var(--sa) 55%,transparent)}.pro .ab{box-shadow:var(--sh),0 0 2.4cqw color-mix(in srgb,var(--sa) 60%,transparent)}.pro .stage{box-shadow:var(--sh),0 0 4cqw color-mix(in srgb,var(--sa) 45%,transparent)}
.tile .tdc{position:absolute;left:2cqw;top:1.8cqw;font-size:5cqw;line-height:1;letter-spacing:.4cqw;pointer-events:none;filter:drop-shadow(0 .4cqw .4cqw rgba(0,0,0,.25))}
@media (prefers-reduced-motion:reduce){.stage .stg-o{animation:none}.eb{display:none}}
#home,#arena{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:linear-gradient(#cfe4ff,#f0e6ff)}
.lvs{display:flex;gap:2cqw;align-items:center;background:rgba(255,255,255,.72);border-radius:999px;padding:1cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:max(12.4cqw,36px);border-radius:999px;background:transparent;color:#2d2250;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.dbar{flex:none;height:max(12.4cqw,36px);border-radius:999px;background:linear-gradient(90deg,var(--accent),#ff6fb0);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.5cqw;font-weight:800;font-size:4.6cqw;box-shadow:var(--sh)}
.dbar:active{transform:scale(.98)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.6cqw}
.tile{position:relative;border-radius:5cqw;background:var(--pb);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:1cqw;overflow:hidden;text-align:center}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:21cqw;line-height:1}.tile b{font-size:6cqw;line-height:1.05;font-weight:800}
.tile .sk{position:absolute;right:1.6cqw;top:1.6cqw;width:max(12.5cqw,36px);height:max(12.5cqw,36px);border-radius:50%;background:var(--sp);font-size:6cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.6cqw;top:-.6cqw;font-size:3.2cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
.tile .op{position:absolute;left:2.4cqw;top:2cqw;font-size:7cqw;font-weight:800;opacity:.85}
/* ---- sân khấu ---- */
#arena{display:grid;grid-template-rows:50cqw minmax(0,1fr) 14cqw 21cqw;gap:2cqw;padding:2.2cqw 3cqw;background:var(--pb)}
.stage{position:relative;border-radius:var(--rad);overflow:hidden;border:var(--bd);box-shadow:var(--sh);background:var(--sb)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.dc{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dc i{position:absolute;font-style:normal;font-size:5.5cqw;opacity:.34;animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(60cqw) rotate(40deg)}}
.bub{position:absolute;left:50%;top:2cqw;transform:translateX(-50%);max-width:92%;min-width:20cqw;padding:1.2cqw 4cqw;border-radius:5cqw;background:var(--sp);color:var(--si);font-weight:800;font-size:6.4cqw;line-height:1.1;text-align:center;box-shadow:var(--sh);z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub.live{opacity:.8;font-style:italic}.bub.ok{background:var(--good);color:#fff}.bub.no{background:#ffe9ea;color:#a02a2f}
.qcard{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqw;background:var(--sp);color:var(--si);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);padding:1cqw 2cqw;text-align:center;overflow:hidden}
.qp{font-size:4.4cqw;font-weight:800;line-height:1.1;opacity:.8}
.qb{font-size:17cqw;font-weight:800;line-height:1.05;white-space:nowrap}.qb.let{font-size:26cqw}
.qb.cnt{white-space:normal;line-height:1.08;max-width:100%;word-break:break-all}
.microw{display:flex;align-items:center;gap:3cqw;min-height:0}
.mic{flex:none;width:max(14cqw,36px);height:max(14cqw,36px);border-radius:50%;background:var(--sp);color:var(--si);box-shadow:var(--sh);font-size:7cqw;display:grid;place-items:center;border:var(--bd);position:relative}
.mic.off{opacity:.75}.mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.mic.live::after{content:"";position:absolute;inset:-1cqw;border-radius:50%;border:.7cqw solid var(--bad);animation:ring 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.mh{flex:1;min-width:0;font-weight:800;font-size:4.2cqw;line-height:1.15;color:var(--si);background:var(--sp);border-radius:999px;padding:1.6cqw 3.4cqw;box-shadow:var(--sh);opacity:.92;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ans{display:flex;gap:2.6cqw;justify-content:center;min-height:0}
.ab{flex:1;max-width:30cqw;border-radius:var(--rad);background:var(--sa);color:var(--sa2);font-size:12cqw;font-weight:800;border:var(--bd);box-shadow:var(--sh);padding:0;line-height:1}
.ab:active{transform:scale(.94)}
.ab.good{background:var(--good)!important;color:#fff!important;animation:newpop .5s cubic-bezier(.2,1.6,.4,1)}
.ab.bad{background:#cfc7e0!important;color:#6a6180!important;animation:shake .35s;pointer-events:none}
.ab.hint{animation:pulse .7s 3}
@keyframes shake{20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.4cqw)}80%{transform:translateX(1.4cqw)}}
@keyframes newpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.cdn{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font-size:55cqw;font-weight:800;color:#fff;background:rgba(20,20,60,.55);text-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.paused #arena{filter:blur(3px);pointer-events:none}
.toast{position:absolute;left:50%;top:70%;transform:translateX(-50%);z-index:9;padding:1.4cqw 4cqw;border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4.2cqw;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center}
.toast.on{opacity:1}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:4cqw;text-align:center;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7.4cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700}
.ov p.note{font-size:3.4cqw;line-height:1.25;font-weight:600;background:var(--panel);border-radius:3cqw;padding:2cqw 3cqw;text-align:left}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2.4cqw 1.4cqw;font-weight:800;font-size:4.5cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:8cqw;width:9cqw;text-align:center;flex:none;line-height:1}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:1cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow)}
.sc{font-size:13cqw;font-weight:800;line-height:1}.sc span{font-size:6cqw;opacity:.6}
.dots{font-size:5.4cqw;letter-spacing:.3cqw;line-height:1.1;max-width:100%}
.reward{font-size:20cqw;line-height:1;animation:newpop .9s cubic-bezier(.2,1.6,.4,1) both}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center}
.ib2{width:max(13cqw,36px);height:max(13cqw,36px);border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:16cqw;height:16cqw;font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.cta{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow);min-height:max(11cqw,36px)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
.clipcv{width:64cqw;height:80cqw;border-radius:4cqw;box-shadow:var(--shadow);background:#fff}
@media (max-width:360px){.hud{font-size:18px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}
}
.combo{position:absolute;left:2cqw;top:2cqw;z-index:3;padding:.6cqw 3cqw;border-radius:999px;background:linear-gradient(90deg,#ff9a4a,#ff4f8a);color:#fff;font-weight:800;font-size:6.2cqw;line-height:1.1;box-shadow:var(--sh);transition:opacity .5s}
.combo.t1{background:linear-gradient(90deg,#ffb020,#ff6a3a)}.combo.t2{background:linear-gradient(90deg,#ff4f8a,#b040ff)}.combo.t3{background:linear-gradient(90deg,#ffd54a,#ff8a00);color:#4a2a00;box-shadow:0 0 4cqw #ffd54a}
.combo.pop{animation:cbpop .45s cubic-bezier(.2,1.8,.4,1)}.combo.off{opacity:0}
@keyframes cbpop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.cpop{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:3;font-weight:800;font-size:9cqw;color:#fff;-webkit-text-stroke:.6cqw #ff4f8a;paint-order:stroke fill;text-shadow:0 1cqw 0 rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;animation:cppop 1.2s ease-out both}
.cpop.t3{-webkit-text-stroke-color:#ff8a00;color:#fff6a0}
@keyframes cppop{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.dc i,.reward,.mic.on,.mic.live::after,.combo.pop,.cpop{animation:none}.cpop{opacity:1}}
/* nút biểu tượng luôn có viền cùng màu biểu tượng để nổi trên mọi nền/giao diện */
.ib,.ib2{border:1.5px solid color-mix(in srgb,currentColor 42%,transparent)!important;box-sizing:border-box}
.ib:not(:disabled),.ib2:not(:disabled){filter:none}
/*skgrid-center*/.skgrid{display:flex!important;flex-wrap:wrap;justify-content:center;--n:3;--gg:2.4cqw;gap:var(--gg)!important}.skgrid>*{flex:0 0 calc((100% - (var(--n) - 1)*var(--gg))/var(--n))!important;min-width:0;box-sizing:border-box}
</style>
<script src="../../../shared/offline.js" defer></script>
<link rel="stylesheet" href="../../../shared/poplandscape.css">
<link rel="stylesheet" href="../../../shared/popnp.css">
<link rel="stylesheet" href="../../../shared/poptitle.css"><script src="../../../shared/poptitle.js" defer></script>
<link rel="stylesheet" href="../../../shared/endui.css"><script src="../../../shared/endui.js" defer></script>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="top">
      <h1 id="title" class="pt-title" data-pt="be-noi-dung-khong"></h1>
      <button class="ib" id="homeBtn" type="button" hidden>🏠</button>
      <button class="ib" id="soundBtn" type="button">🔊</button>
      <button class="ib" id="langBtn" type="button" style="font-size:14px;font-weight:800">VI</button>
    </div>
    <div class="hud"><span id="hl"></span><span id="hr"></span></div>
  </div>
  <div class="play" id="play">
    <div id="home"></div>
    <div id="arena" hidden>
      <div class="stage" id="stage"><canvas id="cv"></canvas><div class="dc" id="dc"></div><div class="combo off" id="combo"></div><div class="cpop" id="cpop" hidden></div><div class="bub" id="bub" hidden></div></div>
      <div class="qcard"><div class="qp" id="qp"></div><div class="qb" id="qb"></div></div>
      <div class="microw"><button class="mic off" id="micBtn" type="button">🎤</button><div class="mh" id="micHint"></div></div>
      <div class="ans" id="ans"></div>
    </div>
    <div class="cdn" id="cdn" hidden></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="ov" id="ovHow" hidden>
      <h2 id="hwH"></h2><div class="row"><span class="chip" id="hwC"></span></div>
      <ul class="hwL" id="hwL"></ul>
      <div class="row"><button class="ib2" id="hwBack" type="button">←</button><button class="cta" id="hwGo" type="button"></button></div>
    </div>
    <div class="ov" id="ovCh" hidden>
      <h2 id="chH"></h2><div class="sc" id="chV"></div><p id="chP"></p>
      <div class="row"><button class="ib2" id="chNo" type="button">✕</button><button class="cta" id="chGo" type="button"></button></div>
    </div>
    <div class="ov" id="ovEnd" hidden>
      <h2 id="enH"></h2><div class="reward" id="enR"></div><div class="sc" id="enS"></div><div class="dots" id="enD"></div><p id="enC" hidden></p><p id="enP"></p><p class="note" id="enN"></p>
      <div class="row"><button class="ib2 main" id="againBtn" type="button">▶</button><button class="ib2" id="shareBtn" type="button" hidden>📤</button><button class="ib2" id="clipBtn" type="button">🎬</button><button class="ib2" id="homeBtn2" type="button">🏠</button><button class="ib2" id="rankBtn" type="button" hidden>🏆</button></div>
    </div>
    <div class="ov" id="ovClip" hidden>
      <canvas class="clipcv" id="clipCv" width="540" height="675"></canvas>
      <p id="clipNote"></p>
      <div class="row"><button class="ib2" id="clipX" type="button">✕</button><button class="ib2 main" id="clipRe" type="button">↻</button><button class="ib2" id="clipSh" type="button">📤</button></div>
    </div>
    <div class="ov" id="ovSkin" hidden>
      <h2 id="skH"></h2><div class="skgrid" id="skGrid"></div><button class="ghost" id="skBack" type="button"></button>
    </div>
    <div class="ov" id="ovPay" hidden>
      <h2 id="pwH"></h2><p id="pwP"></p>
      <div class="row"><button class="cta" id="pwGo" type="button"></button></div>
      <div class="row"><button class="ghost" id="pwTrial" type="button"></button><button class="ghost" id="pwLater" type="button"></button></div>

  new Function("PF",src)(PF);if(PF.pro&&!PF.pro.trial){const ad=LS.get("bn-auto",[]);let ch=0;for(let t=0;t<4;t++)if(!ad[t]){ad[t]=1;ch=1;if(PF.skinSel[t]==="basic"){const f=Object.keys(PF.skins[t]).find(i=>i!=="basic");if(f)PF.skinSel[t]=f}}if(ch){LS.set("bn-auto",ad);LS.set("bn-skin",PF.skinSel)}}if(!G&&!$("home").hidden)renderHome();if(cacheable)PF.fetchTicket()};
PF.fetchTicket=function(){const tk=passToken();if(!tk||HELPER||!PF.pro||PF.pro.trial)return;fetchT("/api/pro/ticket",{method:"POST",headers:{Authorization:"Bearer "+tk},cache:"no-store"},6000).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ticket){PF.ticket=j.ticket;PF.ticketAt=Date.now()}}).catch(()=>{})};

  if(!G)renderHome();else if(G.over)renderEnd()}

if(window.NP){

    if(PF.pro&&!PF.pro.trial&&PF.ticket){st.tk=PF.ticket;const sk=PF.skinSel[G.t];if(sk&&sk!=="basic"&&PF.skins[G.t][sk])st.sk=sk}return st});   /* chơi hộ: bạn chơi tiếp đúng chỗ đang dở */
  NP.onPause(()=>{paused=true;micStop();$("play").classList.add("paused");if(window.speechSynthesis)speechSynthesis.cancel()},()=>{paused=false;$("play").classList.remove("paused");if(G&&G.open)micStart()});
}

if(okHS){
  const go=()=>begin(HS.t,{seed:HS.s,lv:HS.lv,resume:{r:HS.r,sc:HS.sc,hist:(HS.h||"").split("")}}),okT=HS.tk&&/^h\.\d{13}\.[\w-]{43}$/.test(HS.tk);
  if(okT)PF.loadPro(false,HS.tk).then(()=>{if(/^[a-z]{3,10}$/.test(HS.sk||"")&&PF.skins[HS.t][HS.sk])PF.skinSel[HS.t]=HS.sk}).catch(()=>{}).finally(go);else go();
}else{goHome();if(!HELPER){CH=parseCh();if(CH)openCh();else if(location.hash==="#daily")startDaily()}}

  qFor(t,lv,seed,r){const sv=RNG;RNG=mulberry32((seed^Math.imul(r+1,2654435761))>>>0);try{return Q[t](lv)}finally{RNG=sv}},
