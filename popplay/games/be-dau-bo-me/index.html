<title>Bé Đấu Bố Mẹ</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Bé Đấu Bố Mẹ — hai người chơi chung MỘT điện thoại, màn hình chia đôi (nửa trên lật ngược cho bố mẹ). Ai chạm đúng trước được 1 điểm.
   Bố mẹ gặp câu khó hơn, nút nhỏ và nhảy lung tung → bé luôn có cơ hội thắng. Luôn vừa một màn hình. */
:root{--bg:#FFF6EC;--ink:#3b2a1d;--muted:#8a6f5a;--panel:#fff;--line:#f0d9c0;--accent:#FF5A1F;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--warn:#ffb020;--shadow:0 8px 24px rgba(120,70,20,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 150px)*.75),520px)}
:root[data-theme="dark"]{--bg:#1B2340;--ink:#F2F4FF;--muted:#a9b2d8;--panel:#26305a;--line:#38437a;--accent:#FF7A45;--on-accent:#2a1204;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800}
.hud b{font-size:1.1em}
/* ---- sân khấu ---- */
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sb:linear-gradient(#ffe3c2,#ffd1e0);--pb:linear-gradient(#e0d4ff,#c6e4ff);--sp:#fff;--si:#3b2a1d;--sa:#ff5a1f;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid rgba(255,255,255,.9);--sh:0 1cqw 3cqw rgba(0,0,0,.18)}
#home,#arena{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:linear-gradient(#bfe8ff,#e6f6d8)}
.lvs{display:flex;gap:2cqw;justify-content:center;align-items:center;background:rgba(255,255,255,.7);border-radius:999px;padding:1.2cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:11cqw;border-radius:999px;background:transparent;color:#3b2a1d;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:2.4cqw}
.tile{position:relative;border-radius:var(--rad);background:var(--sb);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:1cqw;overflow:hidden;text-align:center}
.tile:nth-child(5){grid-column:1/-1}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:15cqw;line-height:1}.tile b{font-size:4.6cqw;line-height:1.05;font-weight:800}
.tile .sk{position:absolute;right:1.6cqw;bottom:1.6cqw;width:9cqw;height:9cqw;border-radius:50%;background:var(--sp);font-size:4.6cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:2.8cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
.tile .bd{position:absolute;left:2cqw;top:1.6cqw;font-size:4cqw;font-weight:800;opacity:.8}
/* ---- đấu trường ---- */
#arena{display:flex;flex-direction:column}
.half{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2cqw;padding:2.4cqw 3cqw;overflow:hidden}
.half.kid{background:var(--sb)}.half.par{background:var(--pb);transform:rotate(180deg)}
.half>*{position:relative;z-index:1}.half>.dc{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dc i{position:absolute;font-style:normal;font-size:6cqw;opacity:.26;animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(80cqh) rotate(40deg)}}
.mid{flex:none;height:8.4cqw;display:flex;align-items:center;justify-content:center;gap:4cqw;background:rgba(20,20,40,.72);color:#fff;font-weight:800;font-size:4.8cqw;z-index:2}
.mid i{font-style:normal;opacity:.85}
.qcard{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqw;background:var(--sp);color:var(--si);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);padding:1cqw 2cqw;text-align:center;overflow:hidden}
.qp{font-size:4.4cqw;font-weight:800;line-height:1.1;opacity:.85}
.qb{font-size:12cqw;font-weight:800;line-height:1.08;word-break:break-word}.qb.huge{font-size:19cqw}
.qb.cnt{letter-spacing:.4cqw}
.ans{flex:none;display:flex;gap:2.4cqw;width:100%;justify-content:center}
.ab{flex:1;max-width:29cqw;height:17.5cqw;border-radius:var(--rad);background:var(--sa);color:var(--sa2);font-size:9.5cqw;font-weight:800;border:var(--bd);box-shadow:var(--sh);padding:0;line-height:1}
.ab:active{transform:scale(.94)}
.par .ab{flex:0 0 19cqw;height:11.5cqw;font-size:6cqw;max-width:19cqw}
.par .ans{gap:3cqw}
.ab.good{background:var(--good)!important;color:#fff!important}
.ab.bad{background:var(--bad)!important;color:#fff!important;animation:shake .35s}
.half.lock .ab{opacity:.45}
.half.win::after{content:"✓";position:absolute;inset:0;z-index:3;display:grid;place-items:center;font-size:40cqw;color:#fff;background:rgba(47,191,113,.55);animation:newpop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes shake{20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.4cqw)}80%{transform:translateX(1.4cqw)}}
@keyframes newpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.cdn{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font-size:55cqw;font-weight:800;color:#fff;background:rgba(20,20,40,.55);text-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.paused #arena{filter:blur(3px);pointer-events:none}
.toast{position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:9;padding:1.2cqw 4cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4.2cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:4cqw;text-align:center;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7.6cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2.2cqw 1.4cqw;font-weight:800;font-size:4.4cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:7cqw;width:8cqw;text-align:center;flex:none;line-height:1}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:1cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow)}
.vs{display:flex;align-items:center;justify-content:center;gap:4cqw;font-size:12cqw;font-weight:800}.vs span{font-size:9cqw}
.reward{font-size:24cqw;line-height:1;animation:newpop .9s cubic-bezier(.2,1.6,.4,1) both}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center}
.ib2{width:13cqw;height:13cqw;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:17cqw;height:17cqw;font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.big{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
@media (max-width:360px){.hud{font-size:18px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.dc i,.reward,.half.win::after{animation:none}}
</style>

</div>

    b.onclick=()=>locked?openPay(t,id):chooseSkin(t,id);g.appendChild(b);
  }
  showOv("ovSkin");
}
function chooseSkin(t,id){PF.skinSel[t]=id;LS.set("bd-skin",PF.skinSel);renderHome();openHow(t)}
$("skBack").onclick=()=>showOv(null);
function openPay(t,id){
  payFor={t,id};track("duel_skin","view");
  $("pwH").textContent=T("pw.h");$("pwP").textContent=T("pw.p",{name:T("sk."+t+"."+id)});$("pwGo").textContent="🔐 "+T("pw.go");$("pwLater").textContent=T("pw.later");
  $("pwTrial").hidden=LS.get("bd-trial","")===today();$("pwTrial").textContent="🎈 "+T("pw.trial");showOv("ovPay");
}
$("pwLater").onclick=()=>openSkins(skFor);
$("pwGo").onclick=()=>{track("duel_skin","click");gateBack="ovPay";openGate()};
$("pwTrial").onclick=async()=>{
  try{await PF.loadPro(true);LS.set("bd-trial",today());track("duel_skin","trial");const f=payFor,old=PF.skinSel[f.t];PF.skinSel[f.t]=f.id;PF.skinRestore={t:f.t,old};begin(f.t)}
  catch(e){toast(T("pw.tried"),2200);showOv(null)}
};
function openGate(){
  const a=6+rand(0,3),b=4+rand(0,4),ans=a+b,opts=shuffle([ans,ans+rand(1,2),ans-rand(1,2)]);
  $("gtH").textContent=T("gt.h");$("gtP").textContent=T("gt.p",{a,b});$("gtX").textContent=T("gt.x");$("gtNums").innerHTML="";
  opts.forEach(n=>{const x=document.createElement("button");x.type="button";x.textContent=n;x.onclick=()=>{if(n===ans)window.top.location.href=subUrl();else showOv(gateBack)};$("gtNums").appendChild(x)});showOv("ovGate");
}
$("gtX").onclick=()=>showOv(gateBack);
const fetchT=(u,o,ms)=>{const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({signal:c.signal},o)).finally(()=>clearTimeout(id))};
PF.loadPro=async function(trial,ticket){
  const tk=ticket||passToken(),cacheable=!trial&&!ticket;let src=null,r=null;
  try{r=await fetchT("/api/pro/be-dau-bo-me.js"+(trial?"?trial=1":""),{headers:tk?{Authorization:"Bearer "+tk}:{},cache:"no-store"},8000)}catch(e){r=null}
  if(r&&r.ok){src=await r.text();if(cacheable)LS.set("bd-pro-src",{src})}
  else{
    if(r&&r.status>=400&&r.status<500&&r.status!==429){if(r.status===401&&cacheable)try{localStorage.removeItem("bd-pro-src")}catch(e){}throw new Error("pro_"+r.status)}
    const c=cacheable?LS.get("bd-pro-src",null):null,p=LS.get("pass",null);
    if(c&&c.src&&p&&p.exp&&new Date(p.exp)>new Date())src=c.src;else throw new Error("pro_offline");
  }
  new Function("PF",src)(PF);if(!G&&!$("home").hidden)renderHome();
};
PF.lockPro=function(){for(let t=0;t<5;t++)for(const id of Object.keys(PF.skins[t]))if(id!=="basic")delete PF.skins[t][id];PF.pro=null;if(PF.skinRestore){const r=PF.skinRestore;PF.skinSel[r.t]=r.old||"basic";PF.skinRestore=null}};

/* ===== NGÔN NGỮ / ÂM THANH ===== */
function applyLang(){
  document.documentElement.lang=LANG;document.title=T("docTitle");$("title").textContent=T("title");$("langBtn").textContent=LANG.toUpperCase();$("langBtn").setAttribute("aria-label",T("lang"));
  $("soundBtn").setAttribute("aria-label",T("sound"));$("homeBtn").setAttribute("aria-label",T("home"));$("homeBtn2").setAttribute("aria-label",T("home"));$("rankBtn").setAttribute("aria-label",T("rank.btn"));syncSound();
  if(!G)renderHome();else if(G.over)renderEnd();
}
function syncSound(){$("soundBtn").textContent=sound?"🔊":"🔇"}
$("soundBtn").onclick=()=>{sound=!sound;if(window.NPAudio)NPAudio.set(sound);else if(!sound&&window.speechSynthesis)speechSynthesis.cancel();syncSound()};
$("langBtn").onclick=()=>{const mid=G&&!G.over;LANG=LANG==="vi"?"en":"vi";try{localStorage.setItem("lang",LANG)}catch(e){}applyLang();if(mid)begin(G.t)};   /* chữ cái vi/en khác nhau → làm lại ván bằng bộ chữ mới */
$("homeBtn").onclick=()=>{if(!HELPER)goHome()};
$("againBtn").onclick=()=>{if(G)begin(G.t)};
$("homeBtn2").onclick=goHome;
$("rankBtn").onclick=()=>{window.NP&&NP.brag&&NP.brag()};
addEventListener("keydown",e=>{if(G&&G.over&&!HELPER&&(e.key==="Enter"||e.key===" ")&&!$("ovEnd").hidden){e.preventDefault();begin(G.t)}});
addEventListener("storage",e=>{if(e.key==="theme")document.documentElement.dataset.theme=e.newValue||"light"});

/* ===== CẦU NỐI VỚI TRANG CHA ===== */
if(window.NP){
  NP.state(()=>null);   /* hai người chơi chung một máy: không có "chơi hộ giữa chừng" */
  NP.onPause(()=>{paused=true;$("play").classList.add("paused");if(window.speechSynthesis)speechSynthesis.cancel()},()=>{paused=false;$("play").classList.remove("paused")});
}
if(passToken()&&!HELPER)PF.loadPro(false).catch(()=>{});
applyLang();goHome();
window.BD={get G(){return G},begin,goHome,PF,Q,tap,openHow,get prog(){return prog},setLv(n){LVL=n},solve(side){const i=G.q[side].a;tap(side,i)},wrong(side){const q=G.q[side];tap(side,q.o.findIndex((_,i)=>i!==q.a))}};
</script>
