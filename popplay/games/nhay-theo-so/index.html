<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/device.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhảy Theo Số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"></noscript>
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Nhảy Theo Số — màn hình hiện phép tính "3 + 2", nhạc vang lên, bé nhảy / vỗ tay / dậm chân / vẫy tay đúng 5 lần.
   Đếm bằng nút to (luôn có) hoặc bằng camera (chỉ khi phụ huynh đồng ý; xử lý 100% trên máy, không ghi/lưu/gửi hình). Luôn vừa một màn hình. */
:root{--bg:#FFF3F8;--ink:#3b1d2e;--muted:#8a5c72;--panel:#fff;--line:#f3d3e2;--accent:#FF4F8B;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--warn:#ffb020;--shadow:0 8px 24px rgba(140,40,90,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 150px)*.75),760px)}
:root[data-theme="dark"]{--bg:#2a1033;--ink:#FFF0F7;--muted:#d6a9c4;--panel:#40204f;--line:#5b3470;--accent:#FF6FA3;--on-accent:#2a0a18;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800}
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sb:linear-gradient(#ffd6ea,#ffc2d9);--sp:#fff;--si:#3b1d2e;--sa:#ff4f8b;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid rgba(255,255,255,.9);--sh:0 1cqw 3cqw rgba(0,0,0,.18)}
#home,#arena{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:linear-gradient(#ffd9ec,#e4e0ff)}
.lvs{display:flex;gap:2cqw;justify-content:center;align-items:center;background:rgba(255,255,255,.7);border-radius:999px;padding:1.2cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:11cqw;border-radius:999px;background:transparent;color:#3b1d2e;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.dbar{flex:none;height:10.4cqw;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7a5cff);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.5cqw;font-weight:800;font-size:4.6cqw;box-shadow:var(--sh)}
.dbar:active{transform:scale(.98)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.6cqw}
.tile{position:relative;border-radius:var(--rad);background:var(--sb);color:var(--tc,var(--si));border:var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;padding:1cqw;overflow:hidden;text-align:center}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:24cqw;line-height:1}.tile b{font-size:6.6cqw;line-height:1.05;font-weight:800}
.tile .sk{position:absolute;right:1.6cqw;top:1.6cqw;width:10cqw;height:10cqw;border-radius:50%;background:var(--sp);font-size:5cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:3cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
/* ---- đang chơi ---- */
#arena{display:flex;flex-direction:column;gap:1.6cqw;padding:2cqw;background:var(--sb);overflow:hidden}
#arena>*{position:relative;z-index:1}
#arena>.dc{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dc i{position:absolute;font-style:normal;font-size:6cqw;opacity:.26;animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(120cqh) rotate(40deg)}}
.qbox{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:1.4cqw 2cqw;background:var(--sp);color:var(--si);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);text-align:center}
.qp{font-size:4.2cqw;font-weight:800;line-height:1.1;opacity:.8}
.qx{display:flex;align-items:center;justify-content:center;gap:1.6cqw;font-size:15cqw;font-weight:800;line-height:1.05;white-space:nowrap}
.qx.l1{font-size:10cqw}.qx.l2{font-size:11.5cqw}.qx .pic{letter-spacing:-.5cqw}.qx i{font-style:normal;opacity:.7}.qx .eq{font-size:.7em;opacity:.55}
.pips{display:flex;gap:1.1cqw;justify-content:center;flex-wrap:wrap;min-height:4.2cqw}
.pips b{width:3.8cqw;height:3.8cqw;border-radius:50%;background:color-mix(in srgb,var(--si) 16%,transparent);display:block}
.pips b.on{background:var(--good)}.pips b.over{background:var(--bad)}
.stage{position:relative;flex:1;min-height:0;border-radius:var(--rad);overflow:hidden;border:var(--bd);box-shadow:var(--sh);background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
/* ===== Night Pass: cảnh trang trí, nhịp đếm nổ hình theo chủ đề, nhịp đếm bằng biểu tượng giao diện — bản free không có ===== */
.stg-o{position:absolute;z-index:3;pointer-events:none;font-size:9cqw;line-height:1;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.35));animation:stgf 3s ease-in-out infinite}
.stg-o.a{left:1.6cqw;top:1.6cqw}.stg-o.b{right:1.6cqw;bottom:1.6cqw;animation-delay:-1.2s}.stg-o.c{left:1.4cqw;top:38%;font-size:6.4cqw;animation-delay:-2s}
@keyframes stgf{50%{transform:translateY(-1.4cqw) rotate(6deg)}}
.eb.top{z-index:9;top:42%}
.eb{position:absolute;z-index:4;pointer-events:none;font-size:7.4cqw;line-height:1;left:50%;top:60%;animation:ebur .95s ease-out forwards}
@keyframes ebur{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.25) rotate(var(--rt))}}
.pro .pips b{width:auto;height:auto;border-radius:0;background:none!important;font-size:4.6cqw;line-height:1;opacity:.28;filter:grayscale(1)}.pro .pips b::before{content:var(--pip,"⭐")}
.pro .pips b.on{opacity:1;filter:none;animation:pipp .35s ease-out}.pro .pips b.over{opacity:1;filter:none;transform:rotate(180deg)}@keyframes pipp{40%{transform:scale(1.6)}}
.pro .qbox{box-shadow:var(--sh),0 0 4cqw color-mix(in srgb,var(--sa) 55%,transparent)}.pro .tap{animation:tpulse 1.8s ease-in-out infinite}@keyframes tpulse{50%{box-shadow:var(--sh),0 1.2cqw 0 color-mix(in srgb,var(--sa) 55%,#000),0 0 4cqw var(--sa)}}
.tile .tdc{position:absolute;left:2cqw;top:1.8cqw;font-size:5cqw;line-height:1;letter-spacing:.4cqw;pointer-events:none;filter:drop-shadow(0 .4cqw .4cqw rgba(0,0,0,.25))}
@media (prefers-reduced-motion:reduce){.stg-o,.pro .tap,.pro .pips b.on{animation:none}.eb{display:none}}
.cam{position:absolute;left:2cqw;bottom:2cqw;width:21cqw;height:16cqw;border-radius:3cqw;overflow:hidden;border:.7cqw solid #fff;background:rgba(0,0,0,.45);padding:0;box-shadow:var(--sh)}
.cam canvas{width:100%;height:100%;display:block;image-rendering:pixelated;filter:blur(.5px)}
.cam::after{content:"📷";position:absolute;right:.6cqw;top:.2cqw;font-size:3.6cqw}
.ctl{flex:none;display:flex;gap:2.4cqw;align-items:center}
.tap{flex:1;height:20cqw;border-radius:var(--rad);background:var(--sa);color:var(--sa2);border:var(--bd);box-shadow:var(--sh),0 1.2cqw 0 color-mix(in srgb,var(--sa) 55%,#000);font-size:12cqw;line-height:1;display:flex;align-items:center;justify-content:center}
.tap:active{transform:translateY(.8cqw) scale(.98)}
.okb{flex:none;width:20cqw;height:20cqw;border-radius:50%;background:var(--good);color:#fff;font-size:10cqw;font-weight:800;box-shadow:var(--sh);display:grid;place-items:center}
.okb:active{transform:scale(.94)}
.cdn{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font-size:55cqw;font-weight:800;color:#fff;background:rgba(40,10,40,.55);text-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.paused #arena{filter:blur(3px);pointer-events:none}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:9;padding:1.4cqw 4cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:5cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.4cqw)}80%{transform:translateX(1.4cqw)}}
@keyframes newpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:4cqw;text-align:center;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7.6cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700}
.ov p.sm{font-size:3.5cqw;line-height:1.25}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2.2cqw 1.4cqw;font-weight:800;font-size:4.4cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:7cqw;width:8cqw;text-align:center;flex:none;line-height:1}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:1cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow);min-height:9cqw}
.chip.tg{border:.5cqw solid transparent}.chip.tg.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--panel))}
.sc{font-size:24cqw;line-height:1;font-weight:800;color:var(--accent);animation:newpop .8s cubic-bezier(.2,1.6,.4,1) both}.sc small{font-size:.28em;color:var(--muted)}
.reward{font-size:20cqw;line-height:1;animation:newpop .9s cubic-bezier(.2,1.6,.4,1) both}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center}
.ib2{width:13cqw;height:13cqw;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:17cqw;height:17cqw;font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.bgo{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
.vid{width:60cqw;max-height:56cqw;border-radius:4cqw;background:#000;box-shadow:var(--shadow)}
.ghost.sv{text-decoration:none;display:inline-block}
.recdot{width:6cqw;height:6cqw;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (max-width:360px){.hud{font-size:18px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.dc i,.reward,.sc,.shake{animation:none}}
/* nút biểu tượng luôn có viền cùng màu biểu tượng để nổi trên mọi nền/giao diện */
.ib,.ib2{border:1.5px solid color-mix(in srgb,currentColor 42%,transparent)!important;box-sizing:border-box}
.ib:not(:disabled),.ib2:not(:disabled){filter:none}
/*skgrid-center*/.skgrid{display:flex!important;flex-wrap:wrap;justify-content:center;--n:3;--gg:2.4cqw;gap:var(--gg)!important}.skgrid>*{flex:0 0 calc((100% - (var(--n) - 1)*var(--gg))/var(--n))!important;min-width:0;box-sizing:border-box}
</style>
<script src="../../../shared/offline.js" defer></script>
<link rel="stylesheet" href="../../../shared/poplandscape.css">
<link rel="stylesheet" href="../../../shared/endui.css"><script src="../../../shared/endui.js" defer></script>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="top">
      <h1 id="title"></h1>
      <button class="ib" id="homeBtn" type="button" hidden>🏠</button>
      <button class="ib" id="soundBtn" type="button">🔊</button>
      <button class="ib" id="langBtn" type="button" style="font-size:14px;font-weight:800">VI</button>
    </div>
    <div class="hud"><span id="hl"></span><span id="hr"></span></div>
  </div>
  <div class="play" id="play">
    <div id="home"></div>
    <div id="arena" hidden>
      <div class="dc"></div>
      <div class="qbox"><div class="qp" id="qp"></div><div class="qx" id="qx"></div><div class="pips" id="pips"></div></div>
      <div class="stage" id="stage"><canvas id="cv"></canvas><button class="cam" id="cam" type="button" hidden><canvas id="camc" width="64" height="48"></canvas></button></div>
      <div class="ctl"><button class="tap" id="tap" type="button"></button><button class="okb" id="okb" type="button">✓</button></div>
    </div>
    <div class="cdn" id="cdn" hidden></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="ov" id="ovHow" hidden>
      <h2 id="hwH"></h2><div class="row"><span class="chip" id="hwC"></span><button class="chip tg" id="hwCam" type="button"></button></div>
      <ul class="hwL" id="hwL"></ul>
      <div class="row"><button class="ib2" id="hwBack" type="button">←</button><button class="bgo" id="hwGo" type="button"></button></div>
    </div>
    <div class="ov" id="ovCh" hidden>
      <h2 id="chH"></h2><div class="sc" id="chV"></div><p id="chP"></p>
      <div class="row"><button class="ib2" id="chNo" type="button">✕</button><button class="bgo" id="chGo" type="button"></button></div>
    </div>
    <div class="ov" id="ovEnd" hidden>
      <h2 id="enH"></h2><div class="sc" id="enV"></div><div class="reward" id="enR"></div><p id="enP"></p>
      <div class="row"><button class="ib2 main" id="againBtn" type="button">▶</button><button class="ib2" id="shareBtn" type="button" hidden>📤</button><button class="ib2" id="clipBtn" type="button" hidden>🎬</button><button class="ib2" id="homeBtn2" type="button">🏠</button><button class="ib2" id="rankBtn" type="button" hidden>🏆</button></div>
    </div>
    <div class="ov" id="ovSkin" hidden>
      <h2 id="skH"></h2><div class="skgrid" id="skGrid"></div><button class="ghost" id="skBack" type="button"></button>
    </div>
    <div class="ov" id="ovPay" hidden>
      <h2 id="pwH"></h2><p id="pwP"></p>
      <div class="row"><button class="bgo" id="pwGo" type="button"></button></div>
      <div class="row"><button class="ghost" id="pwTrial" type="button"></button><button class="ghost" id="pwLater" type="button"></button></div>
    </div>
    <div class="ov" id="ovGate" hidden>
      <h2 id="gtH"></h2><p id="gtP"></p><p class="sm" id="gtN"></p><div class="nums" id="gtNums"></div><button class="ghost" id="gtX" type="button"></button>
    </div>
    <div class="ov" id="ovClip" hidden>
      <h2 id="clH"></h2><div class="recdot" id="clDot"></div><video class="vid" id="clVid" controls playsinline muted hidden></video><p class="sm" id="clP"></p>
      <div class="row"><button class="ib2" id="clX" type="button">✕</button><button class="ib2 main" id="clShare" type="button" hidden>📤</button><a class="ib2 sv" id="clSave" hidden>💾</a></div>
    </div>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LANG=(()=>{const q=new URLSearchParams(location.search).get("lang");if(q==="vi"||q==="en")return q;try{const s=localStorage.getItem("lang");if(s==="vi"||s==="en")return s}catch(e){}return /^vi/i.test(navigator.language||"")?"vi":"en"})();
let RNG=Math.random;const MR=Math.random;   /* RNG: bộ ngẫu nhiên của phép tính — đặt theo hạt giống để hai nhà chơi CÙNG bộ phép tính; Math.random chỉ dùng cho hiệu ứng thẩm mỹ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=(a,b)=>a+Math.floor(RNG()*(b-a+1)),pick=a=>a[Math.floor(RNG()*a.length)];

const PICS=["🍎","🍓","⭐","🐥","🍪","🎈","🐟","🌸"];
function genQ(lv){
  const pic=pick(PICS);let a,b,op="+";
  if(lv===1){a=rand(1,4);b=rand(1,5-a)}
  else if(lv===2){if(RNG()<.2){op="−";a=rand(3,10);b=rand(1,a-1)}else{a=rand(1,8);b=rand(1,10-a)}}
  else{if(RNG()<.4){op="−";a=rand(5,15);b=rand(1,a-1)}else{a=rand(1,12);b=rand(1,15-a)}}
  return{a,b,op,ans:op==="+"?a+b:a-b,pic};
}
function genQs(seed,lv){const out=[];for(let r=0;r<ROUNDS;r++){RNG=mulberry32((seed^Math.imul(r+1,2654435761))>>>0);out.push(genQ(lv))}RNG=MR;return out}
function exprHtml(q,lv){
  const op="<i>"+(q.op==="+"?"+":"−")+"</i>",pic=(n,k)=>'<span class="pic" style="font-size:'+Math.min(lv===1?10:11,(k||88)/(n*1.2)).toFixed(1)+'cqw">'+q.pic.repeat(n)+"</span>";

/* ===== BỘ ĐẾM TRÊN MÁY: nhận khung xám 64×48, đếm số nhịp nhảy / vỗ / dậm / vẫy (không lưu, không gửi hình) =====
   Nhảy & dậm chân: ước lượng vận tốc DỌC của vùng chuyển động (so khớp khối giữa 2 khung): lên rồi xuống = 1 lần.
   Vẫy tay: vận tốc NGANG ở nửa trên: qua rồi lại = 1 lần. Vỗ tay: hai bên mở rộng rồi khép lại thật gọn = 1 lần.
   Chống đếm đôi: thời gian chờ giữa hai lần + phải có pha "lên/mở" mới tính pha "xuống/khép" kế tiếp. */
const CAW=64,CAH=48,CPAR=[
  {ax:"y",r0:0,r1:CAH,cd:380,amp:2.2,th:.8,win:900},          /* nhảy */
  {ax:"c",r0:3,r1:CAH-4,cd:260,sh:8,win:800},            /* vỗ tay */
  {ax:"y",r0:CAH*.5,r1:CAH,cd:300,amp:1.4,th:.7,win:800},      /* dậm chân */
  {ax:"x",r0:0,r1:CAH*.62,cd:300,amp:3,th:.9,win:900}];       /* vẫy tay */
function Counter(type){this.type=type;this.P=CPAR[type];this.mask=new Uint8Array(CAW*CAH);this.reset()}
Counter.prototype.reset=function(){this.prev=null;this.v=0;this.first=this.P.ax==="y"?-1:0;this.seen=-1e9;this.acc=0;this.last=-1e9;this.pk=0;this.pkT=0;this.closed=false;this.minS=0;this.dbg={}};
Counter.prototype.clapDone=function(t){this.pk=0;this.closed=false;if(t-this.last<this.P.cd)return 0;this.last=t;return 1};
Counter.prototype.flow=function(P,g,ax){
  const m=this.mask,R=6;let best=0,bc=1e9,costs=[];
  for(let d=-R;d<=R;d++){let s=0,n=0;
    for(let y=this.y0;y<this.y1;y++)for(let x=0;x<CAW;x++){const i=y*CAW+x;if(!m[i])continue;const xx=ax==="x"?x+d:x,yy=ax==="y"?y+d:y;if(xx<0||xx>=CAW||yy<0||yy>=CAH)continue;s+=Math.abs(P[i]-g[yy*CAW+xx]);n++}
    const c=n>8?s/n+1.2*Math.abs(d):1e9;costs.push(c);if(c<bc){bc=c;best=d}}
  const k=best+R;if(k>0&&k<2*R&&costs[k-1]<1e8&&costs[k+1]<1e8){const a=costs[k-1],b=costs[k],c=costs[k+1],den=a-2*b+c;if(den>1e-6)best+=Math.max(-.5,Math.min(.5,.5*(a-c)/den))}
  return best;
};
Counter.prototype.push=function(g,t){
  const P=this.P,prev=this.prev;this.prev=Uint8Array.from(g);if(!prev)return 0;
  const m=this.mask;this.y0=Math.floor(P.r0);this.y1=Math.ceil(P.r1);let mass=0,all=0,sx=0,sxx=0;m.fill(0);
  for(let y=0;y<CAH;y++)for(let x=0;x<CAW;x++){const i=y*CAW+x;if(Math.abs(g[i]-prev[i])>22){all++;if(y>=this.y0&&y<this.y1){m[i]=1;mass++;sx+=x;sxx+=x*x}}}
  const roi=(this.y1-this.y0)*CAW,valid=mass>=roi*.012&&all<CAW*CAH*.5;this.dbg={mass:mass,all:all,valid:valid};
  if(P.ax==="c"){   /* vỗ tay: độ tản ngang σ của vùng chuyển động: rộng (hai tay mở) → thu hẹp mạnh (khép) → dừng hoặc mở lại = 1 nhịp */
    let sg=-1;if(valid){const mx=sx/mass;sg=Math.sqrt(Math.max(0,sxx/mass-mx*mx));this.dbg.sg=sg}
    if(this.pk>0&&t-this.pkT>P.win){this.pk=0;this.closed=false}
    if(valid){
      if(sg>=P.sh&&sg>=this.pk){this.pk=sg;this.pkT=t;this.closed=false}
      if(this.pk>0&&sg<=this.pk*.6&&sg<=14&&(!this.closed||sg<this.minS)){this.closed=true;this.minS=sg}
      else if(this.closed&&sg>this.minS+3.5)return this.clapDone(t);
    }else if(this.closed)return this.clapDone(t);
    return 0;
  }
  let d=0;if(valid)d=this.flow(prev,g,P.ax);
  this.v=.45*this.v+.55*d;this.dbg.d=d;this.dbg.v=this.v;
  const v=this.v,sg=v<-P.th?-1:v>P.th?1:0;
  if(sg!==0){
    if(this.first===0)this.first=sg;
    if(sg===this.first){this.seen=t;this.acc+=Math.abs(v)}
    else if(t-this.seen<P.win&&this.acc>=P.amp&&t-this.last>=P.cd){this.last=t;this.seen=-1e9;this.acc=0;return 1}
  }else if(t-this.seen>P.win)this.acc=0;
  return 0;
};

    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:320},height:{ideal:240}},audio:false});

  if(!G)renderHome();else if(G.over)renderEnd();else{renderQ();$("tap").setAttribute("aria-label",T("ty")[G.t])}
}

  if(G&&!G.over&&G.open&&(e.key===" "||e.key==="Enter")&&!e.repeat&&document.activeElement&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();beat("key")}
});

document.addEventListener("visibilitychange",()=>{if(document.hidden){camStop();musStop();hush();freezeTimers();return}if(G&&!G.over&&G.q&&!paused){thawTimers();musStart(G.grid.t0,G.grid.ms);if(wantCam)camStart()}});
addEventListener("pagehide",()=>{camStop();musStop()});

let HS=null;
if(window.NP){
  NP.state(()=>{if(!G||G.over||!G.q)return null;const st={t:G.t,lv:G.lv,s:G.seed,r:G.r,f:G.first,cb:G.combo,mc:G.maxC,hs:G.hist.join(""),rs:Math.round(G.rs*100),rn:G.rn};
    if(PF.pro&&!PF.pro.trial&&PF.ticket){st.tk=PF.ticket;const sk=PF.skinSel[G.t];if(sk&&sk!=="basic"&&PF.skins[G.t][sk])st.sk=sk}return st});   /* chơi hộ: bạn chơi tiếp đúng chỗ đang dở */
  NP.onPause(()=>{paused=true;$("play").classList.add("paused");musStop();camStop();freezeTimers();if(window.speechSynthesis)speechSynthesis.cancel()},()=>{paused=false;$("play").classList.remove("paused");thawTimers();if(G&&!G.over&&G.q){musStart(G.grid.t0,G.grid.ms);if(wantCam)camStart()}});
  const I=NP.initialState;if(I&&Number.isInteger(I.t)&&I.t>=0&&I.t<4&&Number.isInteger(I.lv)&&I.lv>=1&&I.lv<=3&&Number.isInteger(I.s)&&I.s>=0&&I.s<=4294967295&&Number.isInteger(I.r)&&I.r>=0&&I.r<ROUNDS)HS=I;
}
if(passToken()&&!HELPER)PF.loadPro(false).catch(()=>{});
applyLang();goHome();
if(HS){
  const go=()=>{const rs=Math.max(0,Math.min(I_(HS.rs,0,10000),10000))/100,hs=/^[12]{0,10}$/.test(HS.hs||"")?HS.hs.split(""):[];begin(HS.t,{seed:HS.s,lv:HS.lv,r:HS.r,first:I_(HS.f,0,10),rs,rn:I_(HS.rn,0,200),cb:I_(HS.cb,0,10),mc:I_(HS.mc,0,10),hist:hs,log:genQs(HS.s,HS.lv).slice(0,HS.r).map((q,i)=>({a:q.a,b:q.b,op:q.op,ans:q.ans,tries:1}))})},okT=HS.tk&&/^h\.\d{13}\.[\w-]{43}$/.test(HS.tk);
  if(okT)PF.loadPro(false,HS.tk).then(()=>{if(/^[a-z]{3,10}$/.test(HS.sk||"")&&PF.skins[HS.t][HS.sk])PF.skinSel[HS.t]=HS.sk}).catch(()=>{}).finally(go);else go();
}else if(!HELPER){CH=parseCh();if(CH)openCh();else if(location.hash==="#daily")startDaily()}
function I_(v,a,z){return Number.isInteger(v)?Math.max(a,Math.min(z,v)):a}
window.NH={Counter,CPAR,drawCard,drawScene,rig,shareText,shareLink,dailyInfo,parseCh,b64e,startDaily,genQs,get CAH(){return CAH},get G(){return G},get cam(){return cam},get want(){return wantCam},begin,goHome,PF,beat,fakeBeat(n){let k=0;for(let i=0;i<(n||1);i++)if(beat("fake"))k++;return k},okPress,settle,
  solve(){const n=G.q.ans;for(let i=0;i<n;i++)beat("fake");settle()},overshoot(){const n=G.q.ans;for(let i=0;i<=n;i++)beat("fake")},
  get prog(){return prog},audioKill,hush,freezeTimers,get V(){return V},MAXV,get SC(){return SC},setLv(n){LVL=n},openClip,makeClip,setCam(v){wantCam=!!v},bpmOf};
