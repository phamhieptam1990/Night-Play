<head>
<meta charset="utf-8">

<title>Chim Bay Học Vui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");</script>
<style>
/* Chim Bay Học Vui — game bay cho bé: bay qua cổng đúng chữ / số, không có "chết", sai chỉ chậm lại. Luôn vừa một màn hình. */
:root{--bg:#FFF6EC;--ink:#3b2a1d;--muted:#8a6f5a;--panel:#fff;--line:#f0d9c0;--accent:#FF5A1F;--on-accent:#fff;--sky1:#bfe8ff;--sky2:#eefaff;--good:#2fbf71;--warn:#ffb020;--shadow:0 8px 24px rgba(120,70,20,.18);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 196px)*.75),520px)}
:root[data-theme="dark"]{--bg:#1B2340;--ink:#F2F4FF;--muted:#a9b2d8;--panel:#26305a;--line:#38437a;--accent:#FF7A45;--on-accent:#2a1204;--sky1:#243a7a;--sky2:#3b57a6;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.ib[hidden]{display:none}
.ask{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border-radius:20px;background:var(--panel);box-shadow:var(--shadow)}
.ask .ib{width:44px;height:44px;box-shadow:none;background:var(--accent);color:var(--on-accent)}
#askTxt{flex:1;font-size:clamp(18px,5.6vw,28px);font-weight:800;line-height:1.1;text-align:center}
#askTxt .big{display:inline-block;min-width:1.3em;padding:0 .25em;border-radius:12px;background:var(--accent);color:var(--on-accent);margin:0 2px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.sc{font-size:22px;font-weight:800;display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--warn)}.dots i.miss{background:var(--muted);opacity:.55}
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));box-shadow:var(--shadow);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov[hidden]{display:none}
.ov{color:var(--ink)}.ov .card,.ov .nums button,.ov .sk,.ov .ghost{color:var(--ink)}.ov .big{color:var(--on-accent)}   /* màu chữ của hộp thoại KHÔNG thừa hưởng từ bố cục (vd. Máy game để chữ trắng) */
.ov h2{margin:0;font-size:clamp(24px,7.4vw,38px);font-weight:800;line-height:1.05}
.ov p{margin:0;font-size:clamp(14px,4vw,19px);color:var(--muted);font-weight:700}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);text-align:left;font-size:clamp(17px,5vw,24px);font-weight:800}
.card .e{font-size:clamp(30px,9vw,44px);line-height:1}
.card small{display:block;font-size:.62em;color:var(--muted);font-weight:700}
.card.lock{opacity:.92}.card.lock::after{content:"🔒";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:22px}
.card{padding:0}
.card .main{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;background:none;text-align:left;font:inherit;color:inherit;min-width:0;border-radius:22px}
.card .skinBtn{width:48px;height:48px;margin-right:10px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,var(--panel));font-size:22px;display:grid;place-items:center;flex:none;position:relative}
.card .skinBtn i{position:absolute;right:-4px;top:-4px;font-size:12px;font-style:normal;background:var(--panel);border-radius:50%;padding:1px}
.card:active{transform:scale(.97)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 5px 6px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);font-size:12.5px;font-weight:800;line-height:1.05}
.sk img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:11px;background:var(--line)}
.sk.on{outline:3px solid var(--accent)}.sk.lock img{filter:saturate(.8)}
.sk.lock::after{content:"🔒";position:absolute;right:6px;top:6px;font-size:16px;background:var(--panel);border-radius:50%;padding:2px 3px;line-height:1}
.sk:active{transform:scale(.96)}
.big{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:12px 28px;font-size:clamp(18px,5vw,24px);font-weight:800;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 22px;font-size:clamp(15px,4.2vw,19px);font-weight:800;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stars{font-size:clamp(34px,11vw,56px);letter-spacing:.06em}
.nums{display:flex;gap:12px;justify-content:center}
.nums button{width:clamp(64px,20vw,92px);height:clamp(64px,20vw,92px);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);font-size:clamp(30px,9vw,46px);font-weight:800}
.nums button:active{transform:scale(.93)}.nums button.ok{background:var(--good);color:#fff}.nums button.no{opacity:.4}
.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:4;padding:6px 16px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-weight:800;font-size:clamp(16px,4.8vw,22px);pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast{color:var(--ink)}.toast.on{opacity:1}
@media (max-width:360px){.ask{padding:4px 8px}}
.app[data-layout]{transition:none}
/* ngang (xoay điện thoại): bàn chơi ở giữa-phải, bảng tin bên trái */
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}.ask{min-height:48px}.hud{flex-direction:column;align-items:flex-start}
  .ov{gap:6px;padding:10px}.ov h2{font-size:22px}.ov p{display:none}.card{font-size:15px}.card .main{padding:5px 10px;gap:8px}.card .skinBtn{width:36px;height:36px;font-size:16px;margin-right:6px}.card .e{font-size:26px}.card small{display:none}.skgrid{grid-template-columns:repeat(6,1fr);gap:4px}.sk{font-size:9px;padding:3px}.sk span{display:none}.cards{gap:6px}.nums button{width:56px;height:56px;font-size:28px}.stars{font-size:30px}
}
/* --- tiến độ học / chuỗi ngày --- */
.ov input#pgName{width:min(250px,80%);text-align:center;font:800 17px inherit;font-family:inherit;padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.streakBig{font-size:clamp(20px,6vw,28px);font-weight:800;color:var(--ink)}
.week{display:flex;gap:6px;justify-content:center}.week span{width:34px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted)}
.week i{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:15px}.week .on i{background:var(--warn)}.week .td{color:var(--ink)}
.pgrows{display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px}
.pgr{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:7px 12px;box-shadow:var(--shadow);text-align:left;font-weight:800;font-size:14px;color:var(--ink)}
.pgr .e{font-size:24px;line-height:1}.pgr .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.pgr .bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.pgr .bar b{display:block;height:100%;background:var(--good);border-radius:9px}
.ov .st{font-size:clamp(16px,4.6vw,22px);font-weight:800;color:var(--ink)}.ov .st[hidden]{display:none}
.ov .ghost.sm{padding:8px 16px;font-size:14px}
#ovProg{gap:6px}#ovProg h2{display:none}#ovProg .streakBig{font-size:clamp(17px,5vw,22px)}#ovProg .week i{width:26px;height:26px;font-size:13px}#ovProg .week span{width:30px;font-size:10px}
#ovProg .pgr{padding:5px 10px;font-size:13px;gap:8px}#ovProg .pgr .e{font-size:20px}#ovProg #pgPrac{font-size:13px}
#ovProg .big{padding:8px 20px;font-size:clamp(15px,4.2vw,19px)}#ovProg .ghost{padding:7px 16px;font-size:14px}
@media (max-height:460px){#ovProg .week,#ovProg #pgPrac,#ovProg .streakBig+*{display:none}#ovProg .pgrows{flex-direction:row;max-width:520px}#ovProg .pgr{flex-direction:column;padding:5px 8px;font-size:11px;flex:1}#ovProg .pgr .e{font-size:18px}#ovProg input#pgName{padding:4px 10px;font-size:14px}#ovProg .big{padding:5px 14px;font-size:14px;white-space:nowrap}#ovProg .ghost{padding:5px 12px;font-size:13px}#ovProg .pgr span{white-space:normal;line-height:1.1}.streakBig{font-size:16px}.ov .st{display:block!important;font-size:14px}}
@media (max-height:620px){#ovProg .pgrows{flex-direction:row;max-width:520px}#ovProg .pgr{flex-direction:column;padding:5px 8px;font-size:11px;flex:1;text-align:center}#ovProg .pgr .m{width:100%}#ovProg .pgr .e{font-size:18px}#ovProg .pgr span{white-space:normal;line-height:1.1}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="../../../shared/offline.js" defer></script>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="top">
      <h1 id="title"></h1>
      <button class="ib" id="pauseBtn" type="button" hidden>⏸</button>
      <button class="ib" id="soundBtn" type="button">🔊</button>
      <button class="ib" id="langBtn" type="button" style="font-size:14px;font-weight:800">VI</button>
    </div>
    <div class="ask"><button class="ib" id="askBtn" type="button">🔊</button><b id="askTxt" aria-live="polite"></b></div>
    <div class="hud"><span class="sc">⭐ <b id="sc">0</b></span><span class="dots" id="dots"></span></div>
  </div>
  <div class="play" id="play">
    <canvas id="cv" role="img"></canvas>
    <div class="toast" id="toast" role="status"></div>

    <div class="ov" id="ovStart">
      <h2 id="stH"></h2>
      <div class="cards" id="cards"></div>
      <button class="ghost sm" id="pgBtn" type="button"></button>
    </div>
    <div class="ov" id="ovPause" hidden>
      <h2 id="paH"></h2>
      <button class="big" id="resumeBtn" type="button"></button>
      <button class="ghost" id="homeBtn1" type="button"></button>
    </div>
    <div class="ov" id="ovQ" hidden>
      <h2 id="qH"></h2><p id="qP"></p>
      <div class="nums" id="nums"></div>
    </div>
    <div class="ov" id="ovEnd" hidden>
      <h2 id="enH"></h2>
      <div class="stars" id="enStars"></div>
      <p id="enP"></p><div class="st" id="enS"></div>
      <div class="row"><button class="big" id="againBtn" type="button"></button><button class="ghost" id="homeBtn2" type="button"></button><button class="ghost" id="pgBtn2" type="button"></button></div>
    </div>
    <div class="ov" id="ovProg" hidden>
      <h2 id="pgH"></h2>
      <input id="pgName" maxlength="14" autocomplete="off" enterkeyhint="done">
      <div class="streakBig" id="pgStreak"></div>
      <div class="week" id="pgWeek"></div>
      <div class="pgrows" id="pgRows"></div>
      <p id="pgPrac"></p>
      <div class="row"><button class="big" id="pgShare" type="button"></button><button class="ghost" id="pgBack" type="button"></button></div>
    </div>
    <div class="ov" id="ovSkin" hidden>
      <h2 id="skH"></h2>
      <div class="skgrid" id="skGrid"></div>
      <button class="ghost" id="skBack" type="button"></button>
    </div>
    <div class="ov" id="ovPay" hidden>
      <h2 id="pwH"></h2><p id="pwP"></p>
      <div class="row"><button class="big" id="pwGo" type="button"></button></div>
      <div class="row"><button class="ghost" id="pwTrial" type="button"></button><button class="ghost" id="pwLater" type="button"></button></div>
    </div>
    <div class="ov" id="ovGate" hidden>
      <h2 id="gtH"></h2><p id="gtP"></p>
      <div class="nums" id="gtNums"></div>
      <button class="ghost" id="gtX" type="button"></button>
    </div>
  </div>
</div>

  makeWave(i,S){

    if(lvl===1){a=1+rn(3);b=1+rn(5-a)}else if(lvl===2){a=1+rn(9);b=1+rn(10-a)}else if(rn(2)){minus=true;a=3+rn(8);b=1+rn(a-1)}else{a=1+rn(9);b=1+rn(10-a)}
    const ans=minus?a-b:a+b;let ds=[];[1,-1,2,-2,3].forEach(d=>{const v=ans+d;if(v>=0&&v<=12&&ds.indexOf(v)<0)ds.push(v)});ds=shuffle(ds).slice(0,2);
    const q=a+(minus?" − ":" + ")+b+" = ?";
    return {item:"M:"+a+(minus?"-":"+")+b,ask:q,askPlain:q,speak:t(minus?"say.mathMinus":"say.math",{a,b}),hint:t("hintN",{n:ans}),rings:shuffle([ans].concat(ds)).map(v=>({label:String(v),ok:v===ans}))}}};
const CLUSTERS=3;
PF.types.stars={id:"stars",hero:"🐤",custom:true,total:4,name:()=>t("ty.stars"),
  init(S){S.custom={seg:0,clusters:0,list:[],caught:0,lastX:0,right:0,wait:false};setAsk(t("ask.stars"),t("ask.stars"),t("ask.stars"))},
  update(S,dt,sp){
    const c=S.custom,b=S.bird;if(c.wait)return;
    if(c.clusters<CLUSTERS&&(!c.list.length||c.lastX<W-200)){const k=1+rn(3),base=PF.safe.top+60+rn(Math.max(40,H-PF.safe.top-PF.safe.bottom-120)),dir=rn(2)?1:-1;
      for(let i=0;i<k;i++)c.list.push({x:W+40+i*38,y:Math.max(60,Math.min(H-60,base+dir*i*34)),got:false});c.lastX=W+40+(k-1)*38;c.clusters++}
    c.lastX-=sp*dt;
    c.list.forEach(st=>{st.x-=sp*dt;if(!st.got&&Math.abs(st.x-BX)<30&&Math.abs(st.y-b.y)<32){st.got=true;c.caught++;addScore(5);sfx.star();burst(st.x,st.y,"✨",5)}});
    c.list=c.list.filter(st=>st.x>-40);
    if(c.clusters>=CLUSTERS&&!c.list.length){c.wait=true;const seg=c.seg,n=c.caught;
      const next=()=>{c.seg++;c.clusters=0;c.caught=0;c.list=[];c.lastX=0;c.wait=false;if(c.seg>=S.ty.total)finishRound()};
      if(n>0)PF.askNumber(n,ok=>{Prog.rec("S:"+n,ok);if(ok){c.right++;addScore(20);markDot(seg,1)}else markDot(seg,2);next()});
      else{Prog.rec("S:0",false);markDot(seg,2);toast(t("miss"),1300);setTimeout(next,900)}}},
  draw(c,S){const sk=S.skin;c.font="34px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";c.textAlign="center";c.textBaseline="middle";
    S.custom.list.forEach(st=>{if(st.got)return;const yy=st.y+Math.sin(S.t*5+st.x)*3;if(sk&&sk.star)sk.star(c,st.x,yy,S);else c.fillText("⭐",st.x,yy)})}};

    skin:curSkin(type),bird:{y:H/2,vy:0,rot:0,wob:0},parts:[],clouds:Array.from({length:5},(_,i)=>({x:Math.random()*W,y:40+Math.random()*(H-160),s:.6+Math.random()*.9,v:6+Math.random()*10})),dots:Array(PF.types[type].total).fill(0),ask:"",askPlain:"",custom:{}};
}

/* ===== VẬT LÝ NHẸ NHÀNG (không có thua) ===== */
function flap(){if(!running||paused)return;const S=PF.S;S.bird.vy=-215;sfx.flap();if(S.ty.onFlap)S.ty.onFlap(S)}
function stepBird(S,dt){const b=S.bird;b.vy=Math.min(250,b.vy+520*dt);b.y+=b.vy*dt;
  const pd=PF.safe.pad;if(b.y>H-pd){b.y=H-pd;b.vy=-110}if(b.y<pd){b.y=pd;b.vy=Math.max(0,b.vy)}
  b.rot+=((Math.max(-.5,Math.min(.6,b.vy/330)))-b.rot)*Math.min(1,dt*8);if(b.wob>0)b.wob=Math.max(0,b.wob-dt)}
function burst(x,y,glyph,n){const gl=PF.S.skin&&PF.S.skin.glyphs;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*120;PF.S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,g:gl?pickOf(gl):glyph,life:.9,s:16+Math.random()*10})}}
PF.burst=burst;

function laneYs(){const sf=PF.safe,a=sf.top+40,z=H-sf.bottom-40,c=(a+z)/2,sp=Math.min(.27*H,(z-a)/2);return shuffle([c-sp,c,c+sp])}
function spawnWave(S){
  const ty=S.ty,def=ty.makeWave(S.spawned,S),lanes=laneYs();
  const w={x:W+70,idx:S.spawned,item:def.item,ask:def.ask,askPlain:def.askPlain,speak:def.speak,hint:def.hint,answer:def.answer,rings:def.rings.map((r,i)=>Object.assign({y:lanes[i%3]},r)),done:false,res:null};
  S.waves.push(w);S.spawned++;
}
function evalWave(S,w){
  const b=S.bird,hit=w.rings.find(r=>Math.abs(r.y-b.y)<R+10);w.done=true;
  if(w.item)Prog.rec(w.item,!!(hit&&hit.ok));
  if(hit&&hit.ok){w.res="ok";S.correct++;S.streak++;addScore(10+(S.streak>=3?5:0));markDot(w.idx,1);sfx.good();burst(BX,b.y,pickOf(["⭐","✨","🌟"]),12);toast(pickOf(t("right")),1100);S.celebrate=.4}
  else{w.res=hit?"wrong":"miss";S.wrong++;S.streak=0;markDot(w.idx,2);sfx.bad();S.slow=1.1;b.wob=.9;toast(hit?pickOf(t("wrong")):t("miss"),1500);
    const ok=w.rings.find(r=>r.ok);if(ok){w.hintT=1.6;if(w.hint)setTimeout(()=>{if(running&&!paused)say(w.hint)},350)}}
}

function update(dt){
  const S=PF.S;if(!S||S.over)return;S.t+=dt;
  S.slow=Math.max(0,S.slow-dt);const sp=S.speed*(S.slow>0?.45:1);
  stepBird(S,dt);
  for(const c of S.clouds){c.x-=c.v*dt;if(c.x<-80){c.x=W+60;c.y=40+Math.random()*(H-160)}}
  for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt}S.parts=S.parts.filter(p=>p.life>0);
  if(S.celebrate>0)S.celebrate-=dt;
  if(S.ty.custom){S.ty.update(S,dt,sp);return}
  if(S.spawned<S.ty.total&&(!S.waves.length||S.waves[S.waves.length-1].x<W-250)){spawnWave(S);const w=S.waves[S.waves.length-1];if(S.spawned===1)setAsk(w.ask,w.askPlain,w.speak)}
  for(const w of S.waves){w.x-=sp*dt;if(w.hintT>0)w.hintT-=dt;if(!w.done&&w.x<=BX){evalWave(S,w);S.done++;
      const nx=S.waves.find(v=>!v.done);if(nx)setAsk(nx.ask,nx.askPlain,nx.speak)}}
  S.waves=S.waves.filter(w=>w.x>-90);
  if(S.done>=S.ty.total&&!S.waves.some(w=>!w.done)&&!S.endT){S.endT=.9}
  if(S.endT){S.endT-=dt;if(S.endT<=0)finishRound()}
}

/* ===== VẼ ===== */
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const RING=["#ff8fb1","#ffd166","#7bdcb5"];
function draw(){
  const S=PF.S;ctx.setTransform(DPR*K,0,0,DPR*K,0,0);ctx.clearRect(0,0,W,H);
  if(!S)return;
  const sk=S.skin;
  if(sk&&sk.bg)sk.bg(ctx,S);else for(const c of S.clouds){ctx.globalAlpha=.75;ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(c.x,c.y,34*c.s,16*c.s,0,0,7);ctx.ellipse(c.x+22*c.s,c.y+4*c.s,26*c.s,13*c.s,0,0,7);ctx.ellipse(c.x-20*c.s,c.y+5*c.s,22*c.s,11*c.s,0,0,7);ctx.fill()}ctx.globalAlpha=1;
  /* cổng có chữ / số */
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const w of S.waves){
    w.rings.forEach((r,i)=>{const pul=(w.hintT>0&&r.ok)?1+.08*Math.sin(S.t*14):1;ctx.save();ctx.translate(w.x,r.y);ctx.scale(pul,pul);
      if(sk&&sk.gate){sk.gate(ctx,r,i,w.hintT>0&&r.ok,S);ctx.restore();return}
      ctx.fillStyle=(w.hintT>0&&r.ok)?"rgba(255,235,120,.95)":"rgba(255,255,255,.88)";ctx.strokeStyle=RING[i%3];ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle="#3b2a1d";ctx.font='800 '+(String(r.label).length>2?34:46)+'px "Baloo 2",system-ui,sans-serif';ctx.fillText(r.label,0,3);ctx.restore()});
  }
  if(S.ty.draw)S.ty.draw(ctx,S);
  /* nhân vật */
  const b=S.bird,hero=S.ty.hero;ctx.save();ctx.translate(BX,b.y+(b.wob>0?Math.sin(S.t*38)*4*b.wob:0));ctx.rotate(S.type==="math"?b.rot*.6:b.rot);
  const sc=S.celebrate>0?1.2:1;ctx.scale(sc,sc);
  if(sk&&sk.hero)sk.hero(ctx,S,b);else if(S.type==="math")drawPlane(ctx);else{ctx.scale(-1,1);ctx.font="46px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";ctx.fillText(hero,0,0)}   /* 🐤 nhìn sang trái → lật để bay sang phải */
  ctx.restore();
  for(const p of S.parts){ctx.globalAlpha=Math.max(0,p.life);ctx.font=p.s+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";ctx.fillText(p.g,p.x,p.y)}ctx.globalAlpha=1;
}
function drawPlane(c){   /* tàu bay tự vẽ (emoji ✈️ quay mỗi nền tảng một hướng) */
  c.lineJoin="round";c.lineWidth=3;c.strokeStyle="#5b8def";
  c.fillStyle="#e9f1ff";c.beginPath();c.moveTo(-14,3);c.lineTo(-30,26);c.lineTo(-17,26);c.lineTo(8,3);c.closePath();c.fill();c.stroke();   /* cánh */
  c.fillStyle="#ff8fb1";c.beginPath();c.moveTo(-26,-3);c.lineTo(-38,-22);c.lineTo(-24,-22);c.lineTo(-12,-3);c.closePath();c.fill();c.stroke();   /* đuôi */
  c.fillStyle="#ffffff";c.beginPath();c.ellipse(0,0,34,12,0,0,7);c.fill();c.stroke();   /* thân */
  c.fillStyle="#7bdcb5";c.beginPath();c.arc(20,-1,7,Math.PI,0);c.fill();   /* mũi */
  c.fillStyle="#5b8def";for(const x of [-12,-2,8]){c.beginPath();c.arc(x,-2,3,0,7);c.fill()}   /* cửa sổ */
}
function fit(){const r=$("play").getBoundingClientRect();if(!r.width)return;DPR=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);K=r.width/W;H=Math.max(380,Math.min(820,Math.round(W*r.height/r.width)));PF.dim.H=H;if(PF.S&&PF.S.bird)PF.S.bird.y=Math.min(PF.S.bird.y,H-PF.safe.pad);draw()}

  PF.S=newState(type);applyLayout(PF.S.skin?PF.S.skin.layout:"classic");PF.cur=type;running=true;paused=false;pausedBy=null;showOv(null);$("pauseBtn").hidden=false;$("sc").textContent="0";renderDots();

  sfx.win();$("enH").textContent=t("en.h"+stars);$("enStars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);$("enP").textContent=t("en.p",{n:S.score});showOv("ovEnd");

  window.NP&&NP.result({score:S.score,extra:{type:S.type}});
  const pr=Prog.finish(),sk=Prog.streak();$("enS").textContent=sk.n>1?t("end.streak",{n:sk.n}):t("end.first");$("enS").hidden=!!(window.NP&&NP.helper);

$("soundBtn").addEventListener("click",()=>{sound=!sound;if(window.NPAudio)NPAudio.set(sound);else if(!sound&&window.speechSynthesis)speechSynthesis.cancel();syncSound()});
function syncSound(){$("soundBtn").textContent=sound?"🔊":"🔇";$("soundBtn").setAttribute("aria-label",t("sound")+(sound?"":" (off)"))}
$("langBtn").addEventListener("click",()=>{LANG=LANG==="vi"?"en":"vi";try{localStorage.setItem("lang",LANG)}catch(e){}applyLang()});

/* ===== MÀN CHỌN TRÒ + KHOÁ NIGHT PASS + CỔNG PHỤ HUYNH ===== */
const passToken=()=>{try{const p=JSON.parse(localStorage.getItem("pass"));return p&&p.token}catch(e){return null}};
const track=(f,k)=>{try{fetch("/api/paywall",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({f,k}),keepalive:true}).catch(()=>{})}catch(e){}};
const subUrl=()=>"../../../subscribe.html?from="+encodeURIComponent("popplay/index.html#pop-fly")+"&plan=month";
function renderCards(){
  const box=$("cards");box.textContent="";pgBtnText();
  for(const id of PF.order){
    const sel=PF.skinSel[id],prem=sel&&sel!=="default"&&PF.skins[id]&&PF.skins[id][sel];
    const c=document.createElement("div");c.className="card";
    const ico={letters:"🐤",stars:"⭐",math:"✈️"}[id];
    const m=document.createElement("button");m.type="button";m.className="main";m.innerHTML='<span class="e" aria-hidden="true">'+ico+'</span><span>'+t("ty."+id)+'<small>'+t("ty."+id+".d")+'</small></span>';m.setAttribute("aria-label",t("ty."+id));m.onclick=()=>startRound(id);
    const k=document.createElement("button");k.type="button";k.className="skinBtn";k.innerHTML='🎨'+(prem?"<i>★</i>":"");k.setAttribute("aria-label",t("sk.pick"));k.onclick=()=>openSkins(id);
    c.appendChild(m);c.appendChild(k);box.appendChild(c);
  }
}
const THUMB=(ty,id)=>"thumbs/"+ty+"-"+id+".jpg";
const skLocked=(ty,id)=>id!=="default"&&!(PF.skins[ty]&&PF.skins[ty][id]);
let skFor=null,payFor=null;
function openSkins(ty){
  skFor=ty;$("skH").textContent="🎨 "+t("ty."+ty);$("skBack").textContent=t("home");const g=$("skGrid");g.textContent="";
  for(const id of PF.catalog[ty]){
    const locked=skLocked(ty,id),b=document.createElement("button");b.type="button";b.className="sk"+(locked?" lock":"")+((PF.skinSel[ty]||"default")===id?" on":"");
    b.innerHTML='<img alt="" src="'+THUMB(ty,id)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'"><span>'+t("sk."+ty+"."+id)+'</span>';
    b.setAttribute("aria-label",locked?t("lockedLbl",{n:t("sk."+ty+"."+id)}):t("sk."+ty+"."+id));
    b.onclick=()=>locked?openPay(ty,id):chooseSkin(ty,id);g.appendChild(b);
  }
  showOv("ovSkin");
}
function chooseSkin(ty,id){PF.skinSel[ty]=id;LS.set("pf-skin",PF.skinSel);renderCards();startRound(ty)}
$("skBack").addEventListener("click",()=>showOv("ovStart"));
function openPay(ty,id){
  payFor={ty,id};track("fly_skin","view");
  $("pwH").textContent=t("pw.h");$("pwP").textContent=t("pw.p",{name:t("sk."+ty+"."+id)});$("pwGo").textContent="🔐 "+t("pw.go");$("pwLater").textContent=t("pw.later");
  const tried=LS.get("pf-trial","")===new Date().toLocaleDateString("en-CA");
  $("pwTrial").hidden=tried;$("pwTrial").textContent="🎈 "+t("pw.trial");showOv("ovPay");
}
$("pwLater").addEventListener("click",()=>skFor?openSkins(skFor):showOv("ovStart"));
$("pwGo").addEventListener("click",()=>{track("fly_skin","click");gateBack="ovPay";openGate()});
$("pwTrial").addEventListener("click",async()=>{
  try{await PF.loadPro(true);LS.set("pf-trial",new Date().toLocaleDateString("en-CA"));track("fly_skin","trial");const f=payFor;PF.trialSkin=f.id;const old=PF.skinSel[f.ty];PF.skinSel[f.ty]=f.id;PF.skinRestore={ty:f.ty,old};renderCards();startRound(f.ty)}
  catch(e){toast(t("pw.tried"),2200);showOv("ovStart")}
});
function openGate(cb,back,msg){   /* cổng phụ huynh: câu hỏi người lớn trước khi sang trang thanh toán / chia sẻ */
  const a=6+Math.floor(Math.random()*4),b=4+Math.floor(Math.random()*5),ans=a+b,opts=shuffle([ans,ans+1+Math.floor(Math.random()*2),ans-1-Math.floor(Math.random()*2)]);
  $("gtH").textContent=t("gt.h");$("gtP").textContent=msg?t(msg)+" "+a+" + "+b+" = ?":t("gt.p",{a,b});$("gtX").textContent=t("gt.x");$("gtNums").innerHTML="";
  opts.forEach(n=>{const x=document.createElement("button");x.type="button";x.textContent=n;x.onclick=()=>{if(n===ans){cb?cb():window.top.location.href=subUrl()}else showOv(back||"ovStart")};$("gtNums").appendChild(x)});showOv("ovGate");
}
let gateBack="ovStart";$("gtX").addEventListener("click",()=>showOv(gateBack));

/* ===== TIẾN ĐỘ HỌC · CHUỗI NGÀY · THẺ KHOE CHO PHỤ HUYNH (lưu trên máy, không gửi đi đâu) ===== */
const PROG_K="pf-prog";
const dayKey=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const Prog={
  load(){const p=LS.get(PROG_K,null);return Object.assign({days:[],items:{},rounds:0,name:"",td:{d:"",n:0}},p&&typeof p==="object"?p:{})},
  save(p){p.days=p.days.slice(-120);LS.set(PROG_K,p)},
  rec(item,ok){if(window.NP&&NP.helper)return;const p=this.load(),o=p.items[item]||(p.items[item]={r:0,w:0});ok?o.r++:o.w++;this.save(p)},
  finish(){if(window.NP&&NP.helper)return null;const p=this.load(),k=dayKey();if(p.days.indexOf(k)<0)p.days.push(k);if(p.td.d!==k)p.td={d:k,n:0};p.td.n++;p.rounds++;this.save(p);return p},
  streak(p){p=p||this.load();const has=new Set(p.days);const d=new Date();let today=has.has(dayKey(d));if(!today)d.setDate(d.getDate()-1);let n=0;while(has.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return{n,today}},
  week(p){p=p||this.load();const has=new Set(p.days),out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push({k:dayKey(d),dow:d.getDay(),on:has.has(dayKey(d)),today:i===0})}return out},
  stats(p){p=p||this.load();const L=LET[LANG],it=p.items,pct=pre=>{let r=0,w=0;for(const k in it)if(k[0]===pre){r+=it[k].r;w+=it[k].w}return r+w?Math.round(100*r/(r+w)):null};
    const known=L.filter(l=>{const o=it["L:"+l];return o&&o.r>=3&&o.r/(o.r+o.w)>=.75}).length;
    const prac=L.filter(l=>{const o=it["L:"+l];return o&&o.w>0&&o.w>=o.r}).sort((a,b)=>it["L:"+b].w-it["L:"+a].w).slice(0,4);
    return{known,total:L.length,prac,S:pct("S"),M:pct("M"),Lp:pct("L"),streak:this.streak(p)}}
};
PF.Prog=Prog;
function pgBtnText(){const n=Prog.streak().n;$("pgBtn").textContent=(n>0?"🔥 "+n+" · ":"📊 ")+t("pg.btn")}
let progFrom="ovStart";
function openProg(from){
  progFrom=from||"ovStart";const p=Prog.load(),st=Prog.stats(p),days=t("days");
  $("pgH").textContent=t("pg.h");$("pgName").placeholder=t("pg.ph");$("pgName").value=p.name||"";
  $("pgStreak").textContent=st.streak.n>0?t("pg.s",{n:st.streak.n}):t("pg.s0");
  $("pgWeek").innerHTML=Prog.week(p).map(d=>'<span class="'+(d.today?"td":"")+(d.on?" on":"")+'"><i>'+(d.on?"⭐":"")+'</i>'+days[d.dow]+'</span>').join("");
  const rows=[["🐤",st.total?t("pg.L",{a:st.known,b:st.total}):"",st.total?100*st.known/st.total:0,st.Lp!=null],["⭐",st.S!=null?t("pg.S",{p:st.S}):t("pg.none"),st.S||0,st.S!=null],["✈️",st.M!=null?t("pg.M",{p:st.M}):t("pg.none"),st.M||0,st.M!=null]];
  rows[0][1]=st.Lp!=null?rows[0][1]:t("pg.none");
  $("pgRows").innerHTML=rows.map(r=>'<div class="pgr"><span class="e">'+r[0]+'</span><div class="m"><span>'+r[1]+'</span><div class="bar"><b style="width:'+Math.round(r[2])+'%"></b></div></div></div>').join("");
  $("pgPrac").textContent=st.Lp==null?"":st.prac.length?t("pg.prac",{l:st.prac.join(" · ")}):t("pg.pracOk");
  $("pgShare").textContent=t("pg.share");$("pgBack").textContent=t("pg.back");showOv("ovProg");
}
$("pgBtn").addEventListener("click",()=>openProg("ovStart"));
$("pgBtn2").addEventListener("click",()=>openProg("ovEnd"));
$("pgBack").addEventListener("click",()=>{if(progFrom==="ovStart")goHome();else showOv(progFrom)});
$("pgName").addEventListener("input",()=>{const p=Prog.load();p.name=$("pgName").value.trim().slice(0,14);Prog.save(p)});
$("pgShare").addEventListener("click",()=>{gateBack="ovProg";openGate(()=>{showOv("ovProg");shareCard()},"ovProg","gt.sh")});
function fitText(x,txt,max,font,min){let sz=max;do{x.font=font.replace("$",sz);if(x.measureText(txt).width<=min||sz<=22)break;sz-=2}while(true);return sz}
function drawCard(){
  const p=Prog.load(),st=Prog.stats(p),W2=1080,H2=1080,cv2=document.createElement("canvas");cv2.width=W2;cv2.height=H2;const x=cv2.getContext("2d");
  const F="'Baloo 2','Nunito',system-ui,-apple-system,'Segoe UI','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif",E="";
  const g=x.createLinearGradient(0,0,W2,H2);g.addColorStop(0,"#ff9a4a");g.addColorStop(1,"#ff5a1f");x.fillStyle=g;x.fillRect(0,0,W2,H2);
  x.globalAlpha=.12;x.fillStyle="#fff";for(let i=0;i<14;i++){x.beginPath();x.arc((i*173)%W2,(i*331)%H2,30+(i%4)*22,0,7);x.fill()}x.globalAlpha=1;
  x.textAlign="center";x.textBaseline="middle";x.fillStyle="#fff";
  x.font="800 46px "+E+F;x.fillText("🐤 "+t("title"),W2/2,92);
  const nm=p.name||t("cd.kid"),line=t("cd.t",{n:nm});fitText(x,line,50,"800 $px "+F,900);x.fillText(line,W2/2,168);
  /* khung chính */
  x.fillStyle="#fff";rr(x,70,230,940,780,48);x.fill();
  x.fillStyle="#ff5a1f";x.font="800 190px "+E+F;x.fillText("🔥 "+st.streak.n,W2/2,370);
  x.fillStyle="#6b5a4c";x.font="800 40px "+F;x.fillText(t("cd.sd"),W2/2,478);
  /* 7 ngày */
  const wk=Prog.week(p),days=t("days");wk.forEach((d,i)=>{const cx=W2/2+(i-3)*110;x.fillStyle=d.on?"#ffb020":"#f0e3d3";x.beginPath();x.arc(cx,570,36,0,7);x.fill();if(d.on){x.fillStyle="#fff";x.font="800 38px "+E+F;x.fillText("⭐",cx,572)}x.fillStyle=d.today?"#3b2a1d":"#9a8672";x.font="800 26px "+F;x.fillText(days[d.dow],cx,634)});
  /* 3 ô thành tích */
  const tiles=[["🐤",st.Lp!=null?st.known+"/"+st.total:"—",t("cd.L")],["⭐",st.S!=null?st.S+"%":"—",t("cd.S")],["✈️",st.M!=null?st.M+"%":"—",t("cd.M")]];
  tiles.forEach((tl,i)=>{const cx=70+60+i*300+135-0,left=110+i*300;x.fillStyle="#fff4e6";rr(x,left,690,270,210,30);x.fill();x.fillStyle="#3b2a1d";x.font="800 54px "+E+F;x.fillText(tl[0],left+135,735);x.font="800 76px "+F;x.fillText(tl[1],left+135,810);x.fillStyle="#8a6f5a";fitText(x,tl[2],28,"800 $px "+F,240);x.fillText(tl[2],left+135,868)});
  if(st.Lp!=null&&st.prac.length){x.fillStyle="#8a6f5a";const s2=t("cd.prac",{l:st.prac.join(" · ")});fitText(x,s2,32,"800 $px "+F,860);x.fillText(s2,W2/2,950)}
  x.fillStyle="#fff";x.font="800 38px "+F;x.fillText(t("cd.foot")+" "+location.host,W2/2,1042);
  return cv2}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
async function shareCard(){
  const cv2=drawCard(),blob=await new Promise(r=>cv2.toBlob(r,"image/png"));if(!blob)return;
  const file=new File([blob],"chim-bay-hoc-vui.png",{type:"image/png"}),text=t("cd.share")+" "+location.origin+"/popplay/";
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:t("title"),text});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="chim-bay-hoc-vui.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(t("pg.shared"),1600);
}
PF.drawCard=drawCard;

/* hỏi số (dùng cho loại Bay đếm sao) */
PF.askNumber=function(n,cb){
  const opts=shuffle([n,n+1,Math.max(0,n-1)===n?n+2:Math.max(0,n-1)].filter((v,i,a)=>a.indexOf(v)===i));while(opts.length<3)opts.push(n+opts.length+1);
  $("qH").textContent=t("q.h");$("qP").textContent=t("q.p");$("nums").innerHTML="";say(t("q.h"));
  paused=true;pausedBy="q";
  opts.slice(0,3).forEach(v=>{const b=document.createElement("button");b.type="button";b.textContent=v;b.onclick=()=>{
    for(const x of $("nums").children){x.disabled=true;if(+x.textContent===n)x.classList.add("ok");else if(x!==b)x.classList.add("no")}
    const ok=v===n;if(ok)sfx.good();else sfx.bad();toast(ok?t("q.right",{n}):t("q.wrong",{n}),1400);
    setTimeout(()=>{showOv(null);paused=false;pausedBy=null;last=performance.now();cb(ok)},1300)};$("nums").appendChild(b)});
  showOv("ovQ");
};

/* ===== BẢN TRẢ PHÍ (máy chủ gửi về cho người có Night Pass; có lưu để dùng khi mất mạng) ===== */
const fetchT=(u,o,ms)=>{const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({signal:c.signal},o)).finally(()=>clearTimeout(id))};
PF.loadPro=async function(trial){
  const tk=passToken(),cacheable=!trial;let src=null,r=null;
  try{r=await fetchT("/api/pro/pop-fly.js"+(trial?"?trial=1":""),{headers:tk?{Authorization:"Bearer "+tk}:{},cache:"no-store"},8000)}catch(e){r=null}
  if(r&&r.ok){src=await r.text();if(cacheable)LS.set("pf-pro-src",{src})}
  else{
    if(r&&r.status>=400&&r.status<500&&r.status!==429){if(r.status===401&&cacheable)try{localStorage.removeItem("pf-pro-src")}catch(e){}throw new Error("pro_"+r.status)}
    const c=cacheable?LS.get("pf-pro-src",null):null,p=LS.get("pass",null);
    if(c&&c.src&&p&&p.exp&&new Date(p.exp)>new Date())src=c.src;else throw new Error("pro_offline");
  }
  new Function("PF",src)(PF);renderCards();
};
PF.lockPro=function(){PF.skins={};PF.pro=null;if(PF.skinRestore){const r=PF.skinRestore;if(r.old)PF.skinSel[r.ty]=r.old;else delete PF.skinSel[r.ty];PF.skinRestore=null}PF.trialSkin=null;renderCards();applyLayout("classic")};

/* ===== NGÔN NGỮ / GIAO DIỆN ===== */
function applyLang(){
  document.documentElement.lang=LANG;document.title=t("docTitle");$("title").textContent=t("title");$("langBtn").textContent=LANG.toUpperCase();$("langBtn").setAttribute("aria-label",t("lang"));
  $("stH").textContent=t("st.h");$("paH").textContent=t("pause");$("resumeBtn").textContent="▶ "+t("resume");$("homeBtn1").textContent=t("home");$("homeBtn2").textContent=t("home");$("againBtn").textContent="▶ "+t("again");$("pgBtn2").textContent="📊";$("pgBtn2").setAttribute("aria-label",t("pg.btn"));pgBtnText();
  $("pauseBtn").setAttribute("aria-label",t("pause"));$("askBtn").setAttribute("aria-label",t("ask.letters",{l:""}));cv.setAttribute("aria-label",t("title"));syncSound();renderCards();
  if(PF.S&&PF.S.askPlain)$("askTxt").textContent=PF.S.askPlain;else if(!PF.S)$("askTxt").textContent=t("st.p");
}
addEventListener("storage",e=>{if(e.key==="theme")document.documentElement.dataset.theme=e.newValue||"light"});

/* ===== CẦU NỐI VỚI TRANG CHA ===== */
if(window.NP){NP.state(()=>null);NP.onPause(()=>pauseRound("parent"),()=>resumeRound("parent"))}
if(passToken()&&!(window.NP&&NP.helper))PF.loadPro(false).catch(()=>{});
applyLang();fit();requestAnimationFrame(loop);
</script>
