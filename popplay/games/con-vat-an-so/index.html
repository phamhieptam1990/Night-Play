<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/device.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Con Vật Ăn Số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"></noscript>
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Con Vật Ăn Số — một con vật to há miệng ở đáy màn hình, số trôi / rơi / đung đưa trên màn. Bé chạm số đúng để cho ăn;
   chạm sai thì con vật ợ một tiếng thật to và nhả ra (không bao giờ thua). Luôn vừa một màn hình. */
:root{--bg:#EFFAE6;--ink:#2a3b1d;--muted:#6b7f58;--panel:#fff;--line:#d4e8c0;--accent:#2fae4a;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--shadow:0 8px 24px rgba(40,90,20,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 158px)*.75),760px)}
:root[data-theme="dark"]{--bg:#16301f;--ink:#EAF8E6;--muted:#a3c7a0;--panel:#22442d;--line:#335c40;--accent:#4fd06a;--on-accent:#06240e;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800}
.hud b{font-size:1.1em}
/* ---- sân khấu ---- */
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sky:linear-gradient(#bfe8ff,#e6f6d8);--gnd:#8fd47a;--bn:#fff;--bni:#2a3b1d;--ib:#fff;--ic:#2a3b1d;--ibd:.8cqw solid rgba(0,0,0,.12);--ir:6cqw;--sh:0 1cqw 3cqw rgba(0,0,0,.18);--ink2:#2a3b1d;--ac:#ffb020;--S:23cqw}
#home,#stage{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:linear-gradient(#bfe8ff,#e6f6d8)}
.lvs{display:flex;gap:2cqw;justify-content:center;align-items:center;background:rgba(255,255,255,.7);border-radius:999px;padding:1.2cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:max(11cqw,38px);border-radius:999px;background:transparent;color:#2a3b1d;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.dbar{flex:none;height:max(10.4cqw,38px);border-radius:999px;background:linear-gradient(90deg,#2fae4a,#2f9ea0);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.5cqw;font-weight:800;font-size:4.6cqw;box-shadow:var(--sh)}
.dbar:active{transform:scale(.98)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.6cqw}
.tile{position:relative;border-radius:6cqw;background:var(--sky);color:var(--ink2);border:.8cqw solid rgba(255,255,255,.9);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:1cqw;overflow:hidden;text-align:center}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:25cqw;line-height:1}.tile b{font-size:5.4cqw;line-height:1.05;font-weight:800}
.tile .sk{position:absolute;right:1.6cqw;top:1.6cqw;width:max(10cqw,38px);height:max(10cqw,38px);border-radius:50%;background:#fff;color:#222;font-size:5cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:3cqw;font-style:normal;background:#fff;border-radius:50%;line-height:1;padding:.2cqw}
.tile .bd{position:absolute;left:2cqw;top:1.6cqw;font-size:4cqw;font-weight:800;opacity:.85}
/* ---- sân khấu chơi ---- */
#stage{background:var(--sky)}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none}.scene svg{width:100%;height:100%;display:block}
.dc{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.dc i{position:absolute;font-style:normal;font-size:6cqw;opacity:.3;animation:drift 10s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(150cqw) rotate(40deg)}}
.bn{position:absolute;left:3cqw;right:3cqw;top:2.4cqw;height:21cqw;z-index:5;display:flex;align-items:center;gap:2.6cqw;padding:1.2cqw 3cqw;background:var(--bn);color:var(--bni);border-radius:5cqw;box-shadow:var(--sh);border:.7cqw solid rgba(255,255,255,.55)}
.bn .rt{flex:1;min-width:0;font-weight:800;font-size:5.4cqw;line-height:1.1}
.bn .rt small{display:block;font-size:3.6cqw;opacity:.85;margin-top:.6cqw}
.bn.flip{background:linear-gradient(135deg,#7a3cff,#c03cff);color:#fff;animation:wob .7s}
.bn.bonus{background:linear-gradient(135deg,#ffd54a,#ffb020);color:#4a2f00}
.bn .rf{flex:none;min-width:15cqw;height:15cqw;padding:0 1.6cqw;border-radius:50%;background:#fff;color:#222;display:grid;place-items:center;font-size:8.5cqw;font-weight:800;line-height:1;border:.8cqw solid rgba(0,0,0,.15)}
.bn .rf.sm{font-size:4.8cqw;letter-spacing:-.1cqw;border-radius:8cqw}
.bn.hint{animation:wob .5s}
@keyframes wob{20%{transform:rotate(-2deg) scale(1.03)}40%{transform:rotate(2deg) scale(1.03)}60%{transform:rotate(-1deg)}80%{transform:rotate(1deg)}}
.fld{position:absolute;inset:0;z-index:4;pointer-events:none}
.itm{position:absolute;left:0;top:0;width:var(--S);height:var(--S);padding:0;background:var(--ib);color:var(--ic);border:var(--ibd);border-radius:var(--ir);box-shadow:var(--sh);font-size:11cqw;font-weight:800;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;will-change:transform}
.itm.pc{font-size:4.4cqw}
.itm .pic{display:grid;grid-template-columns:repeat(2,auto);gap:0;font-size:5.6cqw;line-height:1.05;justify-items:center}
.itm .pic.one{grid-template-columns:auto}
.itm small{font-size:3.6cqw;opacity:.75;line-height:1;margin-top:.2cqw}
.itm.hint{outline:1cqw solid var(--ac);outline-offset:.4cqw;animation:glow .8s ease-in-out infinite alternate}
.itm.held{outline:1cqw solid var(--accent);outline-offset:.4cqw}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25) drop-shadow(0 0 2cqw var(--ac))}}
.itm.fly{transition:transform .38s cubic-bezier(.5,0,.8,.5),opacity .3s .1s;pointer-events:none}
.itm.out{transition:transform .8s cubic-bezier(.2,.7,.4,1),opacity .6s .2s;pointer-events:none}
.itm.back{transition:transform .5s ease}
.ani{position:absolute;left:9cqw;width:82cqw;bottom:-2cqw;z-index:3;pointer-events:none}
.ani svg{width:100%;display:block;overflow:visible;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.8cqw)}}
.ani .lo{transition:transform .16s;transform:translateY(7px)}
.ani.wide .lo{transform:translateY(22px)}
.ani.shut .lo{transform:translateY(-7px)}
.ani.chew .lo{animation:chew .24s 3}
@keyframes chew{0%,100%{transform:translateY(-7px)}50%{transform:translateY(14px)}}
.ani.burp svg{animation:burp .8s}
@keyframes burp{0%{transform:scale(1)}20%{transform:scale(1.12,.92) rotate(-2deg)}40%{transform:scale(.95,1.08) rotate(2deg)}60%{transform:scale(1.06,.96) rotate(-1.5deg)}100%{transform:scale(1)}}
.ani.happy svg{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-3cqw) scale(1.04)}60%{transform:translateY(0) scale(.98)}}
.ani .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.ani{transform-origin:50% 100%;transition:transform .4s}
.ani.f1{transform:scale(1.03)}.ani.f2{transform:scale(1.06)}.ani.f3{transform:scale(1.09)}
.ani .aura{position:absolute;left:6%;right:6%;top:-6%;height:70%;border-radius:50%;opacity:0;transition:opacity .4s;background:radial-gradient(closest-side,rgba(255,224,90,.85),rgba(255,224,90,0));z-index:-1}
.ani.t1 .aura{opacity:.7}.ani.t2 .aura{opacity:.95;animation:aur 1s ease-in-out infinite alternate}.ani.t3 .aura{opacity:1;background:conic-gradient(from 0deg,rgba(255,80,80,.7),rgba(255,220,60,.7),rgba(80,230,120,.7),rgba(80,160,255,.7),rgba(200,90,255,.7),rgba(255,80,80,.7));filter:blur(3cqw);animation:aur .6s ease-in-out infinite alternate}
@keyframes aur{from{transform:scale(.96)}to{transform:scale(1.08)}}
.ani .crown{position:absolute;left:50%;top:-9cqw;font-size:13cqw;line-height:1;font-style:normal;transform:translateX(-50%) scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.ani.t2 .crown,.ani.t3 .crown{transform:translateX(-50%) scale(1)}
.ani.t3 .crown{animation:cw .5s ease-in-out infinite alternate}
@keyframes cw{from{transform:translateX(-50%) rotate(-8deg) scale(1.1)}to{transform:translateX(-50%) rotate(8deg) scale(1.1)}}
.ani.happy .eye{transform:scaleY(.45)}.ani.burp .eye{transform:scale(1.25)}
.ani.hop2 svg{animation:hop2 .7s}
@keyframes hop2{25%{transform:translateY(-6cqw) rotate(-4deg) scale(1.06)}50%{transform:translateY(0) rotate(3deg)}70%{transform:translateY(-3cqw) rotate(-2deg)}}
.tod{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.2s;background:linear-gradient(180deg,rgba(255,120,60,.0),rgba(255,120,60,.34) 70%,rgba(120,40,160,.25))}
.mv{position:absolute;left:0;right:0;top:24cqw;height:40cqw;z-index:1;pointer-events:none;overflow:hidden}
.mv i{position:absolute;font-style:normal;font-size:9cqw;opacity:.55;animation:slide 26s linear infinite}
@keyframes slide{from{transform:translateX(-14cqw)}to{transform:translateX(112cqw)}}
.scene svg{animation:sway 9s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes sway{from{transform:scale(1.03) translateX(-1cqw)}to{transform:scale(1.03) translateX(1cqw)}}
.cmb{position:absolute;right:3cqw;top:25.5cqw;z-index:6;pointer-events:none;padding:.6cqw 3cqw;border-radius:999px;background:linear-gradient(135deg,#ff7a1a,#ff3b6b);color:#fff;font-weight:800;font-size:7.4cqw;line-height:1.1;box-shadow:var(--sh);text-shadow:0 .4cqw 0 rgba(0,0,0,.25)}
.cmb.bump{animation:cbump .45s cubic-bezier(.2,1.8,.4,1)}.cmb.big{background:linear-gradient(135deg,#ffd54a,#ff7a1a);font-size:9cqw}.cmb.mega{background:linear-gradient(135deg,#ff3b6b,#7a3cff,#2fbf71);font-size:10.5cqw}
@keyframes cbump{0%{transform:scale(.4) rotate(-10deg)}60%{transform:scale(1.35) rotate(5deg)}100%{transform:scale(1)}}
.pop.cw{font-size:10cqw;color:#fff5b0;-webkit-text-stroke:.5cqw #8a3a00;paint-order:stroke fill;animation:bigp 1.2s ease-out forwards}
.pop.fx{font-size:8cqw;animation:fxf 1.1s ease-out forwards}
@keyframes fxf{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot,200deg)) scale(1.1)}}
.pop{color:#fff;position:absolute;z-index:7;pointer-events:none;font-weight:800;white-space:nowrap;transform:translate(-50%,-50%);animation:rise 1.1s ease-out forwards;text-shadow:0 .4cqw 0 rgba(0,0,0,.25)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
.pop.bp{font-size:15cqw;color:#fff;-webkit-text-stroke:.5cqw #5a3a00;paint-order:stroke fill;animation:bigp 1.1s ease-out forwards}
@keyframes bigp{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15) rotate(5deg)}100%{opacity:0;transform:translate(-50%,-150%) scale(1.3) rotate(-4deg)}}
.pop.cl{font-size:12cqw;animation:cloud 1s ease-out forwards}
@keyframes cloud{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-130%) scale(1.5)}}
.cdn{position:absolute;inset:0;z-index:9;display:grid;place-items:center;font-size:55cqw;font-weight:800;color:#fff;background:rgba(20,40,20,.5);text-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.paused #stage{filter:blur(3px);pointer-events:none}
.toast{position:absolute;left:50%;top:27cqw;transform:translateX(-50%);z-index:9;padding:1.2cqw 4cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4.2cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:4cqw;text-align:center;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7.4cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700}
.hwA{width:38cqw;flex:none}.hwA svg{width:100%;display:block;overflow:visible}.hwA .lo{transform:translateY(8px)}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2cqw 1.4cqw;font-weight:800;font-size:4.4cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:7cqw;width:8cqw;text-align:center;flex:none;line-height:1}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:1cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow)}
.reward{font-size:20cqw;line-height:1;animation:newpop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes newpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center}
.ib2{width:max(13cqw,40px);height:max(13cqw,40px);border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:max(17cqw,46px);height:max(17cqw,46px);font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.go{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.stat{display:flex;flex-direction:column;gap:1cqw;align-items:center;background:var(--panel);border-radius:5cqw;padding:2.4cqw 5cqw;box-shadow:var(--shadow);font-weight:800}
.stat .big2{font-size:11cqw;line-height:1}.stat .dots{font-size:5.4cqw;letter-spacing:.2cqw;line-height:1.1}.stat span{font-size:4.6cqw}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
.vs{display:flex;align-items:center;justify-content:center;gap:4cqw;font-size:11cqw;font-weight:800}
@media (max-width:360px){.hud{font-size:18px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.scene svg,.mv i,.ani .aura,.ani .crown,.ani.hop2 svg,.cmb.bump,.pop.fx,.pop.cw,.dc i,.reward,.ani svg,.ani .eye,.itm.hint{animation:none}}
/* nút biểu tượng luôn có viền cùng màu biểu tượng để nổi trên mọi nền/giao diện */
.ib,.ib2{border:1.5px solid color-mix(in srgb,currentColor 42%,transparent)!important;box-sizing:border-box}
.ib:not(:disabled),.ib2:not(:disabled){filter:none}
/*skgrid-center*/.skgrid{display:flex!important;flex-wrap:wrap;justify-content:center;--n:3;--gg:2.4cqw;gap:var(--gg)!important}.skgrid>*{flex:0 0 calc((100% - (var(--n) - 1)*var(--gg))/var(--n))!important;min-width:0;box-sizing:border-box}
</style>
<script src="../../../shared/offline.js" defer></script>
<link rel="stylesheet" href="../../../shared/poplandscape.css">
<link rel="stylesheet" href="../../../shared/endui.css"><script src="../../../shared/endui.js" defer></script>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="top">
      <h1 id="title"></h1>
      <button class="ib" id="homeBtn" type="button" hidden>🏠</button>
      <button class="ib" id="soundBtn" type="button">🔊</button>
      <button class="ib" id="langBtn" type="button" style="font-size:14px;font-weight:800">VI</button>
    </div>
    <div class="hud"><span id="hl"></span><span id="hr"></span></div>
  </div>
  <div class="play" id="play">
    <div id="home"></div>
    <div id="stage" hidden>
      <div class="scene" id="scene"></div><div class="dc" id="dc"></div>
      <div class="bn" id="bn"><div class="rt" id="rt"></div><div class="rf" id="rf"></div></div>
      <div class="fld" id="fld"></div>
      <div class="mv" id="mv"></div><div class="tod" id="tod"></div><div class="cmb" id="cmb" hidden></div>

 if(HS&&typeof HS.tk==="string"&&/^h\.\d{13}\.[\w-]{43}$/.test(HS.tk)){const t=Number.isInteger(HS.t)&&HS.t>=0&&HS.t<4?HS.t:0;PF.loadPro(false,HS.tk).then(()=>{if(/^[a-z]{3,10}$/.test(HS.sk||"")&&PF.skins[t][HS.sk])PF.skinSel[t]=HS.sk;renderHome()}).catch(()=>{})}
