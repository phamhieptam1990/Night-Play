<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Làng Của Bé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Làng Của Bé — bé là "trưởng làng" nhí: mỗi bài học xong mở thêm một ngôi nhà / con vật / cửa hàng. 3 khu: chữ cái · số · phép tính. Luôn vừa một màn hình. */
:root{--bg:#FFF6EC;--ink:#3b2a1d;--muted:#8a6f5a;--panel:#fff;--line:#f0d9c0;--accent:#FF5A1F;--on-accent:#fff;--good:#2fbf71;--warn:#ffb020;--shadow:0 8px 24px rgba(120,70,20,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 196px)*.75),520px)}
:root[data-theme="dark"]{--bg:#1B2340;--ink:#F2F4FF;--muted:#a9b2d8;--panel:#26305a;--line:#38437a;--accent:#FF7A45;--on-accent:#2a1204;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.ask{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border-radius:20px;background:var(--panel);box-shadow:var(--shadow)}
.ask .ib{box-shadow:none;background:var(--accent);color:var(--on-accent)}
#askTxt{flex:1;font-size:clamp(16px,5vw,25px);font-weight:800;line-height:1.1;text-align:center}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.sc{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:6px}.dots i{width:13px;height:13px;border-radius:50%;background:var(--line);display:block}.dots i.ok{background:var(--warn)}.dots i.re{background:var(--muted);opacity:.7}.dots i.cur{outline:3px solid var(--accent);outline-offset:1px}
/* ---- sân khấu: mọi cỡ chữ theo cqw nên co giãn đúng ở mọi màn hình ---- */
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sb:linear-gradient(#bfe8ff,#fff3e0);--sp:#fff;--si:#3b2a1d;--sa:#ff5a1f;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid #fff;--sh:0 1cqw 3cqw rgba(0,0,0,.18)}
#village,#lesson{position:absolute;inset:0}
#village{display:flex;flex-direction:column;gap:2cqw;padding:2.5cqw;background:linear-gradient(#a8dcff,#d9f3c9)}
.band{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--sb);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);color:var(--si);padding:1.2cqw 2.4cqw 1.6cqw;text-align:left;overflow:hidden}
.band:active{transform:scale(.99)}
.bh{display:flex;align-items:center;gap:2cqw;min-height:8.5cqw}
.bh .bi{font-size:7cqw;line-height:1}.bh b{flex:1;font-size:4.7cqw;line-height:1.05;font-weight:800;min-width:0}
.pips{display:flex;gap:1cqw}.pips i{width:2.4cqw;height:2.4cqw;border-radius:50%;background:rgba(0,0,0,.18);display:block}.pips i.on{background:var(--sa)}
.bh .sk{width:9cqw;height:9cqw;border-radius:50%;background:var(--sp);font-size:4.6cqw;display:grid;place-items:center;box-shadow:var(--sh);position:relative;flex:none}
.bh .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:2.6cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
.slots{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1cqw;align-items:center;justify-items:center}
.slot{font-size:9.5cqw;line-height:1;display:grid;place-items:center;width:100%;height:100%}
.slot.no{opacity:.28;filter:grayscale(1);font-size:6cqw}
.slot.new{animation:newpop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes newpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.cta{position:absolute;right:2.4cqw;bottom:1.6cqw;font-size:5cqw;background:var(--sa);color:var(--sa2);border-radius:999px;padding:.4cqw 2.6cqw;font-weight:800;box-shadow:var(--sh)}
#lesson{background:var(--sb);color:var(--si)}
#deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#deco i{position:absolute;font-style:normal;font-size:6cqw;opacity:.28;animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(112cqh) rotate(40deg)}}
#act{position:absolute;inset:0}
.paused #act{pointer-events:none;filter:blur(3px)}
.toast{position:absolute;left:50%;top:12cqw;transform:translateX(-50%);z-index:7;padding:1.2cqw 4cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4.2cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
/* ---- hoạt động ---- */
.opts{position:absolute;left:4cqw;right:4cqw;bottom:4cqw;display:flex;gap:3cqw;justify-content:center}
.opt{flex:1;max-width:26cqw;height:19cqw;border-radius:var(--rad);background:var(--sp);color:var(--si);border:var(--bd);box-shadow:var(--sh);font-size:11cqw;font-weight:800}
.opt:active{transform:scale(.94)}.opt.good,.good{background:var(--good)!important;color:#fff!important}
.hint{animation:hint .6s ease-in-out infinite;outline:1cqw solid var(--sa);outline-offset:.5cqw}
@keyframes hint{50%{transform:scale(1.08)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.4cqw)}80%{transform:translateX(1.4cqw)}}
.card3{background:var(--sp);color:var(--si);border:var(--bd);box-shadow:var(--sh);border-radius:var(--rad)}
.env{position:absolute;left:50%;top:10%;transform:translateX(-50%);width:42cqw;height:30cqw;display:grid;place-items:center;transition:transform .5s ease-in,opacity .5s;z-index:3}
.env span{position:absolute;font-size:38cqw;line-height:1;opacity:.95}.env b{position:relative;font-size:19cqw;line-height:1;color:#c0392b;margin-top:4cqw;text-shadow:0 .5cqw 0 #fff}
.hsrow{position:absolute;left:3cqw;right:3cqw;bottom:6cqw;display:flex;gap:2cqw;justify-content:center;align-items:flex-end}
.house{flex:1;position:relative;display:grid;place-items:center;background:none;height:42cqw}
.house i{font-style:normal;font-size:27cqw;line-height:1}.house b{position:absolute;top:50%;left:50%;transform:translate(-50%,-6%);font-size:12.5cqw;color:#fff;text-shadow:0 .6cqw 0 rgba(0,0,0,.45);line-height:1}
.house:active{transform:scale(.95)}
.spk{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:32cqw;height:32cqw;border-radius:50%;display:grid;place-items:center;font-size:17cqw;background:var(--sa);color:var(--sa2);box-shadow:var(--sh);animation:hint 1.2s ease-in-out infinite}
.lrow{position:absolute;left:4cqw;right:4cqw;bottom:6cqw;display:flex;gap:3cqw}
.lcard{flex:1;height:34cqw;border-radius:var(--rad);background:var(--sp);color:var(--si);border:var(--bd);box-shadow:var(--sh);font-size:21cqw;font-weight:800;line-height:1}
.lcard:active{transform:scale(.94)}
.tbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:min(88cqw,76cqh);aspect-ratio:1;border-radius:var(--rad);background:var(--sp);border:var(--bd);box-shadow:var(--sh);overflow:hidden}
#tc{width:100%;height:100%;touch-action:none;display:block}
.tbar{position:absolute;left:8%;right:8%;bottom:3%;height:2.4cqw;border-radius:2cqw;background:rgba(0,0,0,.12);overflow:hidden}.tbar i{display:block;height:100%;width:0;background:var(--good);transition:width .15s}
.tres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;z-index:4;background:color-mix(in srgb,var(--sp) 88%,transparent);border-radius:inherit;font-size:6cqw;font-weight:800}
.tres .big{font-size:42cqw;line-height:1;animation:newpop .8s cubic-bezier(.2,1.6,.4,1) both}
.pic{position:absolute;left:50%;top:7%;transform:translateX(-50%);font-size:34cqw;line-height:1}
.slotsrow{position:absolute;left:0;right:0;top:46%;display:flex;gap:3cqw;justify-content:center}
.sl{width:20cqw;height:22cqw;border-radius:var(--rad);background:rgba(255,255,255,.55);border:.8cqw dashed var(--sa);display:grid;place-items:center;font-size:15cqw;font-weight:800;color:var(--si)}
.sl.f{background:var(--sp);border-style:solid}
.tiles{position:absolute;left:4cqw;right:4cqw;bottom:5cqw;display:flex;gap:2.5cqw;justify-content:center;flex-wrap:wrap}
.tile{width:19cqw;height:21cqw;border-radius:var(--rad);background:var(--sp);color:var(--si);border:var(--bd);box-shadow:var(--sh);font-size:13cqw;font-weight:800}
.tile:disabled{opacity:.25}
.field{position:absolute;left:4cqw;right:4cqw;top:3cqw;height:72cqw}
.an{position:absolute;transform:translate(-50%,-50%);font-size:18cqw;line-height:1;background:none;width:22cqw;height:22cqw;display:grid;place-items:center}
.an b{position:absolute;right:-1cqw;top:-1cqw;min-width:6.5cqw;height:6.5cqw;border-radius:50%;background:var(--sa);color:var(--sa2);font-size:4.4cqw;display:none;place-items:center;line-height:1}
.an.c b{display:grid}.an.c{transform:translate(-50%,-50%) scale(.9)}
.an:active{transform:translate(-50%,-50%) scale(1.1)}
.an.in{opacity:.3;transform:translate(-50%,-50%) scale(.6)}
.basket{position:absolute;left:4cqw;bottom:4cqw;display:flex;align-items:center;gap:2cqw}
.basket span{font-size:20cqw;line-height:1}.basket b{font-size:15cqw;line-height:1;min-width:16cqw;text-align:center;border-radius:var(--rad);background:var(--sp);color:var(--si);padding:1cqw 2cqw;border:var(--bd)}
.go{position:absolute;right:4cqw;bottom:4cqw;width:30cqw;height:20cqw;border-radius:var(--rad);background:var(--good);color:#fff;font-size:12cqw;font-weight:800;box-shadow:var(--sh)}
.dk{width:15cqw;height:17cqw;font-size:11cqw}
.ducks{position:absolute;left:6cqw;right:6cqw;bottom:5cqw;display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw}
.duck{position:relative;width:100%;height:30cqw;border-radius:var(--rad);background:var(--sp);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:grid;place-items:center;font-size:15cqw;line-height:1;padding-bottom:5cqw}
.duck b{position:absolute;bottom:1cqw;font-size:9cqw;background:var(--sa);color:var(--sa2);border-radius:999px;min-width:10cqw;line-height:1.3}
.duck.gone{visibility:hidden}
.oslots{position:absolute;left:2cqw;right:2cqw;top:8cqw;display:flex;gap:1.2cqw;justify-content:center;flex-wrap:nowrap}
.os{width:14.2cqw;height:20cqw;flex:none;border-radius:var(--rad);border:.7cqw dashed var(--sa);background:rgba(255,255,255,.5);display:grid;place-items:center;font-size:7.5cqw;position:relative;padding-bottom:3cqw}
.os b{position:absolute;bottom:.4cqw;font-size:5.6cqw;background:var(--sa);color:var(--sa2);border-radius:999px;min-width:8cqw;line-height:1.3}
.pens{position:absolute;left:3cqw;right:3cqw;top:14cqw;height:74cqw;display:flex;gap:3cqw}
.pen{flex:1;border-radius:var(--rad);background:var(--sp);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;padding:2cqw;overflow:hidden}
.pen .pg{font-size:var(--fs,9cqw);line-height:1.15;text-align:center;word-break:break-all;letter-spacing:.3cqw}
.pen:active{transform:scale(.97)}
.eq{position:absolute;left:3cqw;right:3cqw;top:5cqw;display:flex;align-items:center;justify-content:center;gap:2cqw;font-size:11cqw;font-weight:800;flex-wrap:wrap}
.eq .grp{display:flex;flex-direction:column;align-items:center;gap:.6cqw;padding:1.6cqw 2.2cqw;border-radius:var(--rad);background:var(--sp);border:var(--bd);box-shadow:var(--sh);max-width:38cqw}
.eq .g{font-size:8.2cqw;line-height:1.1;text-align:center;letter-spacing:.2cqw}.eq .grp b{font-size:9cqw;line-height:1}
.eq.num{font-size:20cqw;top:14cqw}
.eq .op{font-size:12cqw;color:var(--sa)}
.plate{position:absolute;left:50%;top:40%;transform:translateX(-50%);width:76cqw;text-align:center}
.plate .cakes{font-size:14cqw;line-height:1.1;min-height:24cqw;letter-spacing:.4cqw}
.plate .cakes s{text-decoration:none;display:inline-block;transition:transform .6s,opacity .6s}.plate .cakes s.gone{opacity:0;transform:translate(14cqw,-10cqw) scale(.3)}
.plate .pl{font-size:16cqw;line-height:.8}
.cat{position:absolute;right:4cqw;top:18cqw;font-size:19cqw;animation:hint 1s ease-in-out 2}
.scale{position:absolute;left:0;right:0;top:20cqw;height:60cqw}
.beam{position:absolute;left:26cqw;right:26cqw;top:16cqw;height:2.4cqw;border-radius:2cqw;background:var(--si);transform:rotate(var(--ang,-9deg));transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.pan{position:absolute;top:2cqw;width:31cqw;min-height:22cqw;transform:translateX(-50%) rotate(calc(var(--ang,-9deg) * -1));transition:transform .8s cubic-bezier(.3,1.4,.5,1);padding:1.6cqw;border-radius:0 0 var(--rad) var(--rad);background:var(--sp);border:var(--bd);box-shadow:var(--sh);text-align:center;font-weight:800;font-size:9cqw;line-height:1.1;color:var(--si)}
.pan.l{left:0}.pan.r{left:100%}.pan .g{font-size:7cqw;letter-spacing:.2cqw}.pan em{display:block;font-style:normal;font-size:7cqw;color:var(--sa)}
.post{position:absolute;left:50%;top:22cqw;width:3.4cqw;height:46cqw;transform:translateX(-50%);background:var(--si);border-radius:2cqw;opacity:.8}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6cqw;padding:4cqw;text-align:center;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7.6cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700}
.stars{font-size:13cqw;letter-spacing:.06em}.reward{font-size:24cqw;line-height:1;animation:newpop .9s cubic-bezier(.2,1.6,.4,1) both}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center}
.ib2{width:13cqw;height:13cqw;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:17cqw;height:17cqw;font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.big{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
.pop{position:absolute;z-index:6;font-size:9cqw;pointer-events:none;animation:popup .9s ease-out forwards}
@keyframes popup{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateY(-22cqw) scale(1.2)}}
@media (max-width:360px){.ask{padding:4px 8px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}.ask{min-height:48px}.hud{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){#deco i,.spk,.hint,.slot.new,.reward{animation:none}}
</style>
<script src="../../../shared/offline.js" defer></script>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="top">
      <h1 id="title"></h1>
      <button class="ib" id="homeBtn" type="button" hidden>🏠</button>
      <button class="ib" id="soundBtn" type="button">🔊</button>
      <button class="ib" id="langBtn" type="button" style="font-size:14px;font-weight:800">VI</button>
    </div>
    <div class="ask"><button class="ib" id="askBtn" type="button">🔊</button><b id="askTxt" aria-live="polite"></b></div>
    <div class="hud"><span class="sc">⭐ <b id="sc">0</b></span><span class="dots" id="dots"></span></div>
  </div>
  <div class="play" id="play">
    <div id="village"></div>
    <div id="lesson" hidden><div id="deco"></div><div id="act"></div></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="ov" id="ovEnd" hidden>
      <h2 id="enH"></h2><div class="stars" id="enStars"></div><div class="reward" id="enR"></div><p id="enP"></p>
      <div class="row"><button class="ib2 main" id="againBtn" type="button">▶</button><button class="ib2" id="homeBtn2" type="button">🏡</button><button class="ib2" id="rankBtn" type="button" hidden>🏆</button></div>
    </div>
    <div class="ov" id="ovSkin" hidden>
      <h2 id="skH"></h2><div class="skgrid" id="skGrid"></div><button class="ghost" id="skBack" type="button"></button>
    </div>
    <div class="ov" id="ovPay" hidden>
      <h2 id="pwH"></h2><p id="pwP"></p>
      <div class="row"><button class="big" id="pwGo" type="button"></button></div>
      <div class="row"><button class="ghost" id="pwTrial" type="button"></button><button class="ghost" id="pwLater" type="button"></button></div>

function applyLang(){
  document.documentElement.lang=LANG;document.title=T("docTitle");$("title").textContent=T("title");$("langBtn").textContent=LANG.toUpperCase();$("langBtn").setAttribute("aria-label",T("lang"));
  $("soundBtn").setAttribute("aria-label",T("sound"));$("homeBtn").setAttribute("aria-label",T("home"));$("askBtn").setAttribute("aria-label",T("ask.again"));$("rankBtn").setAttribute("aria-label",T("rank.btn"));$("homeBtn2").setAttribute("aria-label",T("home"));
  syncSound();
  if(S&&!S.over&&R.ak){$("askTxt").textContent=T(R.ak[0],R.ak[1]);R.speak=T(R.ak[0],R.ak[1])}else if(!S)$("askTxt").textContent=T("ask.home");
  if(!S)renderVillage();else if(S.over)renderEnd(S.score+S.info.stars*10);
}
function syncSound(){$("soundBtn").textContent=sound?"🔊":"🔇"}
$("soundBtn").onclick=()=>{sound=!sound;if(window.NPAudio)NPAudio.set(sound);else if(!sound&&window.speechSynthesis)speechSynthesis.cancel();syncSound()};
$("langBtn").onclick=()=>{const mid=!HELPER&&S&&!S.over&&S.z===0;LANG=LANG==="vi"?"en":"vi";try{localStorage.setItem("lang",LANG)}catch(e){}applyLang();if(mid)startSession(0)};   /* bảng chữ cái vi/en khác nhau → làm lại bài chữ cái bằng bộ chữ mới */
$("askBtn").onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();say(R.speak||T("ask.home"))};
$("homeBtn").onclick=()=>{if(HELPER)return;goHome()};
$("againBtn").onclick=()=>{if(S)startSession(S.z)};
$("homeBtn2").onclick=()=>{const i=S&&S.info;if(i&&i.item)window.LCnew={z:i.z,i:i.idx};goHome()};
$("rankBtn").onclick=()=>{window.NP&&NP.brag&&NP.brag()};
addEventListener("keydown",e=>{if(S&&S.over&&!HELPER&&(e.key==="Enter"||e.key===" ")&&!$("ovEnd").hidden){e.preventDefault();startSession(S.z)}});
addEventListener("storage",e=>{if(e.key==="theme")document.documentElement.dataset.theme=e.newValue||"light"});

/* ===== CẦU NỐI VỚI TRANG CHA ===== */
if(window.NP){
  NP.state(()=>{if(!S||S.over||!lessonOn)return null;const st={z:S.z,r:S.r,sc:S.score,g:S.good,lv:lvOf(S.z),dots:S.dots.slice(0,ROUNDS)};
    if(PF.pro&&!PF.pro.trial&&PF.ticket){st.tk=PF.ticket;const sk=PF.skinSel[S.z];if(sk&&sk!=="basic"&&PF.skins[S.z][sk])st.sk=sk}return st});   /* chơi hộ: bạn chơi tiếp đúng chỗ đang dở */
  NP.onPause(()=>{paused=true;$("play").classList.add("paused");if(window.speechSynthesis)speechSynthesis.cancel()},()=>{paused=false;$("play").classList.remove("paused")});
}
if(passToken()&&!HELPER)PF.loadPro(false).catch(()=>{});
applyLang();
if(HS&&Number.isInteger(HS.z)&&HS.z>=0&&HS.z<3){
  const go=()=>startSession(HS.z,HS),okT=HS.tk&&/^h\.\d{13}\.[\w-]{43}$/.test(HS.tk);
  if(okT)PF.loadPro(false,HS.tk).then(()=>{if(/^[a-z]{3,10}$/.test(HS.sk||"")&&PF.skins[HS.z][HS.sk])PF.skinSel[HS.z]=HS.sk}).catch(()=>{}).finally(go);else go();
}else goHome();
window.LC={get S(){return S},get R(){return R},startSession,goHome,PF,ACT,get prog(){return prog},ok,bad};
</script>
</body>
</html>
