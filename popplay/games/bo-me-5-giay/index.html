<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bố Mẹ Thử Thách 5 Giây</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Bố Mẹ Thử Thách 5 Giây — hai người chung MỘT điện thoại, màn hình chia đôi: nửa trên (lật ngược) cho bố mẹ chọn đáp án trong 5 giây giữa cảnh hỗn loạn,
   nửa dưới là BÉ TRỌNG TÀI: thấy đáp án đúng, rồi chạm ✅ Đúng / ❌ Sai để chấm. Luôn vừa một màn hình. */
:root{--bg:#FFF6EC;--ink:#3b2a1d;--muted:#8a6f5a;--panel:#fff;--line:#f0d9c0;--accent:#FF5A1F;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--warn:#ffb020;--shadow:0 8px 24px rgba(120,70,20,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 150px)*.75),520px)}
:root[data-theme="dark"]{--bg:#1B2340;--ink:#F2F4FF;--muted:#a9b2d8;--panel:#26305a;--line:#38437a;--accent:#FF7A45;--on-accent:#2a1204;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(14px,4.6vw,24px);font-weight:800;line-height:1.05;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800}
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sb:linear-gradient(#ffe3c2,#ffd1e0);--pb:linear-gradient(#e0d4ff,#c6e4ff);--sp:#fff;--si:#3b2a1d;--sa:#ff5a1f;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid rgba(255,255,255,.9);--sh:0 1cqw 3cqw rgba(0,0,0,.18);--mid:rgba(20,20,40,.72)}
#home,#arena{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:linear-gradient(#bfe8ff,#e6f6d8)}
.lvs{display:flex;gap:2cqw;justify-content:center;align-items:center;background:rgba(255,255,255,.7);border-radius:999px;padding:1.2cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:13.5cqw;border-radius:999px;background:transparent;color:#3b2a1d;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.dbar{flex:none;height:14cqw;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7a5cff);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.5cqw;font-weight:800;font-size:4.6cqw;box-shadow:var(--sh)}
.dbar:active{transform:scale(.98)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.6cqw}
.tile{position:relative;border-radius:5cqw;background:var(--sb);color:var(--si);border:.8cqw solid rgba(255,255,255,.9);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:1cqw 1.4cqw;overflow:hidden;text-align:center}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:17cqw;line-height:1}.tile b{font-size:5.2cqw;line-height:1.05;font-weight:800}.tile small{font-size:3.3cqw;line-height:1.1;font-weight:700;opacity:.85}
.tile .sk{position:absolute;right:1.4cqw;top:1.4cqw;width:14cqw;height:14cqw;border-radius:50%;background:var(--sp);font-size:6cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:2.8cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
/* ---- đấu trường ---- */
#arena{display:flex;flex-direction:column}
/* ===== Night Pass: hình giao diện quanh hai nửa, nổ hình theo chủ đề khi bé chấm điểm, phát sáng — bản free không có ===== */
.half .stg-o{position:absolute;z-index:0;pointer-events:none;font-size:8cqw;line-height:1;font-style:normal;opacity:.9;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.3));animation:stgf 3s ease-in-out infinite}
.half .stg-o.a{left:1.6cqw;bottom:1.4cqw}.half .stg-o.b{right:1.6cqw;bottom:1.4cqw;animation-delay:-1.4s}
@keyframes stgf{50%{transform:translateY(-1.4cqw) rotate(6deg)}}
.eb{position:absolute;z-index:9;pointer-events:none;font-size:8cqw;line-height:1;font-style:normal;left:50%;top:50%;animation:ebur 1s ease-out forwards}
@keyframes ebur{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--rt))}}
.pro .qcard{box-shadow:var(--sh),0 0 4cqw color-mix(in srgb,var(--sa) 55%,transparent)}.pro .ab{box-shadow:var(--sh),0 0 2.4cqw color-mix(in srgb,var(--sa) 60%,transparent)}
.pro .ovp.w,.pro .ovp.l{text-shadow:0 0 3cqw var(--sa)}
.tile .tdc{position:absolute;left:2cqw;top:1.8cqw;font-size:5cqw;line-height:1;letter-spacing:.4cqw;pointer-events:none;filter:drop-shadow(0 .4cqw .4cqw rgba(0,0,0,.25))}
@media (prefers-reduced-motion:reduce){.half .stg-o{animation:none}.eb{display:none}}
.half{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:1.6cqw;padding:2cqw 3cqw;overflow:hidden}
.half.kid{background:var(--sb)}.half.par{background:var(--pb);transform:rotate(180deg)}
.half>*{position:relative;z-index:1}.half>.dc{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dc i{position:absolute;font-style:normal;font-size:6cqw;opacity:.26;animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(80cqh) rotate(40deg)}}
@keyframes rise{0%{transform:translateY(80cqh)}100%{transform:translateY(-12cqw)}}
@keyframes fogm{to{transform:translateX(12cqw)}}
.mid{flex:none;height:7.4cqw;display:flex;align-items:center;justify-content:center;gap:4cqw;background:var(--mid);color:#fff;font-weight:800;font-size:4.4cqw;z-index:2}
.tb{flex:none;display:flex;align-items:center;gap:1.6cqw;height:7cqw}
.chr{width:9cqw;height:9cqw;margin:-1cqw 0;flex:none;display:block;animation:hop 1.6s ease-in-out infinite}
.chr svg,.au svg{width:100%;height:100%;display:block;overflow:visible}
.cmb{flex:none;font-weight:800;font-size:3.8cqw;line-height:5cqw;padding:0 1.6cqw;border-radius:999px;background:#ff5a1f;color:#fff;box-shadow:0 .5cqw 0 rgba(0,0,0,.25)}
.cmb:empty{display:none}.cmb.pop{animation:cpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes cpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.au{display:flex;gap:.8cqw;align-items:center}.au svg{width:5.6cqw;height:5.6cqw;animation:hop 1.3s ease-in-out infinite}.au svg:nth-child(2){animation-delay:-.4s}.au svg:nth-child(3){animation-delay:-.8s}
.fx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-8cqw;font-size:5cqw;animation:cfall 1.7s ease-in forwards}
@keyframes cfall{to{transform:translateY(140cqh) rotate(360deg)}}
.cw{position:absolute;left:50%;transform:translateX(-50%);z-index:5;font-weight:800;font-size:10cqw;color:#fff;text-shadow:0 1cqw 0 rgba(0,0,0,.4),0 0 3cqw #ff5a1f;white-space:nowrap;pointer-events:none;animation:cwd 1.4s ease-out forwards}
@keyframes cwd{0%{transform:translateX(-50%) scale(.3);opacity:0}20%{transform:translateX(-50%) scale(1.15);opacity:1}100%{transform:translateX(-50%) translateY(-6cqw) scale(1);opacity:0}}
.lt{position:absolute;inset:-40%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.18),transparent 10%,transparent 50%,rgba(255,255,255,.14) 60%,transparent 70%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gv{transform-origin:30px 30px;animation:gvk .35s ease-in-out 2}@keyframes gvk{50%{transform:rotate(-40deg)}}
.mas{font-size:5.4cqw;line-height:1;flex:none;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-.8cqw) rotate(-6deg)}}
.trk{flex:1;height:2.8cqw;border-radius:999px;background:rgba(0,0,0,.25);overflow:hidden}
.trk i{display:block;height:100%;width:100%;border-radius:999px;background:var(--good);transform-origin:left;transition:background .2s}
.trk.low i{background:var(--bad)}
.sec{flex:none;min-width:5cqw;text-align:center;font-weight:800;font-size:4.8cqw;color:var(--si);background:var(--sp);border-radius:999px;padding:0 1.4cqw;line-height:5.2cqw}
.qcard{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;background:var(--sp);color:var(--si);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);padding:.8cqw 2cqw;text-align:center;overflow:hidden}
.qp{font-size:4cqw;font-weight:800;line-height:1.05;opacity:.9}
.qb{font-size:9.6cqw;font-weight:800;line-height:1.05;word-break:break-word;white-space:nowrap}
.qb .dot.xl{width:10cqw;height:10cqw}
.fl,.wb{display:inline-block}
.az{position:relative;flex:none;width:100%}.az.r1{height:17cqw}.az.r2{height:29cqw}
.ab{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:var(--rad);background:var(--sa);color:var(--sa2);font-size:9.5cqw;font-weight:800;border:var(--bd);box-shadow:var(--sh);padding:0;line-height:1;overflow:hidden;transition:left .2s ease,top .2s ease,opacity .2s}
.ab:active{transform:scale(.94)}
.ab.good{background:var(--good)!important;color:#fff!important}
.ab.bad{background:var(--bad)!important;color:#fff!important;animation:shake .35s}
.ab.pk{outline:1cqw solid #fff;box-shadow:0 0 0 2cqw rgba(255,255,255,.5)}
.half.done .ab:not(.good):not(.bad):not(.pk){opacity:.45}
.dot{display:inline-block;width:6cqw;height:6cqw;border-radius:50%;border:.6cqw solid rgba(0,0,0,.25);vertical-align:middle}.dot.xl{width:10cqw;height:10cqw}
.ab .dot{width:9cqw;height:9cqw}
.t2 .ab{background:#fff;color:#222}.t2 .qcard{background:#fff;color:#222}
.ovp{position:absolute;inset:0;z-index:4;display:grid;place-items:center;align-content:center;font-size:24cqw;line-height:1;pointer-events:none;background:rgba(255,255,255,.25);animation:newpop .45s cubic-bezier(.2,1.6,.4,1) both}
.ovp small{display:block;font-size:6cqw;font-weight:800;color:#fff;background:rgba(20,20,40,.7);border-radius:999px;padding:.6cqw 3cqw;margin-top:1cqw}
.ovp.w{background:rgba(47,191,113,.45)}.ovp.l{background:rgba(229,72,77,.4)}.ovp.s{background:rgba(255,255,255,.18);font-size:15cqw}
@keyframes newpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.4cqw)}80%{transform:translateX(1.4cqw)}}
/* nửa Bé trọng tài */
.kp{flex:none;text-align:center;font-weight:800;font-size:4cqw;line-height:1.05;color:var(--si);background:rgba(255,255,255,.55);border-radius:999px;padding:.8cqw 3cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cards{flex:1;min-height:0;display:flex;gap:2cqw}
.jc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;background:var(--sp);color:var(--si);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);padding:.6cqw;text-align:center;overflow:hidden}
.jc small{font-size:3.2cqw;font-weight:800;opacity:.85;line-height:1}
.jc .jv{display:flex;align-items:center;justify-content:center;gap:1cqw;font-size:11cqw;font-weight:800;line-height:1;flex-direction:column}
.jc.ok{outline:.8cqw solid var(--good)}.jc.pkc{outline:.8cqw solid var(--warn)}.t2 .jc{background:#fff;color:#222}
.jc .pw{font-size:5.2cqw}.jc .jv .dot{width:10cqw;height:10cqw}
.jc.hint{animation:shake .5s 2}
.judge{flex:none;display:flex;gap:2.4cqw}
.jb{flex:1;height:14.5cqw;border-radius:var(--rad);font-size:7cqw;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:1.6cqw;box-shadow:0 1cqw 0 rgba(0,0,0,.25);border:.6cqw solid rgba(255,255,255,.8);line-height:1}
.jb span{font-size:5.4cqw}
.jb.y{background:var(--good)}.jb.n{background:var(--bad)}.jb:active{transform:scale(.95)}
.half.kid.wait .jb{opacity:.35;pointer-events:none}
.jb:disabled{opacity:.35;pointer-events:none}
/* mờ / hỗn loạn */
.f1 .qb,.f1 .qp{animation:fade1 2.2s ease-in-out infinite}
.f2 .qb,.f2 .qp{animation:blink 1.5s steps(1) infinite;filter:blur(.5cqw)}
.f3 .qb,.f3 .qp{animation:blink 1.1s steps(1) infinite;filter:blur(.9cqw)}
.f2 .ab,.f3 .ab{animation:fade1 1.8s ease-in-out infinite}
@keyframes fade1{50%{opacity:.3}}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.06}}
.cl{position:absolute;font-style:normal;font-size:15cqw;line-height:1;z-index:3;pointer-events:none;animation:cloud 3.4s ease-in-out infinite alternate;filter:drop-shadow(0 .6cqw 0 rgba(0,0,0,.12))}
@keyframes cloud{from{transform:translateX(-26cqw)}to{transform:translateX(26cqw)}}
.t1.l3 .wb{animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.cdn{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font-size:55cqw;font-weight:800;color:#fff;background:rgba(20,20,40,.55);text-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.paused #arena{filter:blur(3px);pointer-events:none}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;padding:1.2cqw 4cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4.2cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:4cqw;text-align:center;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7.2cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700}.ov p.fine{font-size:3.4cqw}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2.2cqw 1.4cqw;font-weight:800;font-size:4.2cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:7cqw;width:8cqw;text-align:center;flex:none;line-height:1}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:1cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow)}
.vs{display:flex;align-items:center;justify-content:center;gap:3cqw;font-size:9.5cqw;font-weight:800}.vs span{font-size:7cqw}
.reward{font-size:20cqw;line-height:1;animation:newpop .9s cubic-bezier(.2,1.6,.4,1) both}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center}
.ib2{width:13cqw;height:13cqw;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:17cqw;height:17cqw;font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.big{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
.opps{display:flex;gap:2cqw;justify-content:center;width:100%}
.opb{flex:1;max-width:19cqw;display:flex;flex-direction:column;align-items:center;gap:.2cqw;padding:1.2cqw 0;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:7cqw;line-height:1;font-weight:800}
.opb small{font-size:3.2cqw}.opb.on{outline:.9cqw solid var(--accent)}
@media (max-width:360px){.hud{font-size:18px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:17px}
