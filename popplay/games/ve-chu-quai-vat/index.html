<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vẽ Chữ Thành Quái Vật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Vẽ Chữ Thành Quái Vật — bé TÔ một chữ / số / hình, nét tô biến nó thành một con quái vật dễ thương dựng từ hạt giống (thân = chính chữ đó),
   có tên vui và tiếng kêu riêng. Quái vật vào album sưu tập. Luôn vừa một màn hình, không cuộn. */
:root{--bg:#F4F0FF;--ink:#2d2150;--muted:#7a6aa8;--panel:#fff;--line:#e0d6ff;--accent:#8a5cf6;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--shadow:0 8px 24px rgba(80,50,140,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 150px)*.75),520px)}
:root[data-theme="dark"]{--bg:#1B1740;--ink:#F2F0FF;--muted:#b4abe0;--panel:#2a2460;--line:#3d3580;--accent:#a98bff;--on-accent:#1a1040;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(17px,5vw,25px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800}
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sb:linear-gradient(#e6d9ff,#d3e6ff);--sp:#fff;--si:#2d2150;--sa:#8a5cf6;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid rgba(255,255,255,.9);--sh:0 1cqw 3cqw rgba(0,0,0,.18)}
#home,#studio{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:linear-gradient(#e6d9ff,#d3f1ff)}
.lvs{display:flex;gap:2cqw;justify-content:center;align-items:center;background:rgba(255,255,255,.7);border-radius:999px;padding:1.2cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:14.6cqw;border-radius:999px;background:transparent;color:#2d2150;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.dbar,.abar{flex:none;height:14.2cqw;border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.5cqw;font-weight:800;font-size:4.6cqw;box-shadow:var(--sh);width:100%}
.dbar{background:linear-gradient(90deg,var(--accent),#ff5fa2)}.abar{background:linear-gradient(90deg,#2fbfa0,#3b82f6)}
.dbar:active,.abar:active{transform:scale(.98)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.4cqw}
.tile{position:relative;border-radius:var(--rad);background:var(--sb);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:1cqw;overflow:hidden;text-align:center;cursor:pointer}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:17cqw;line-height:1}.tile b{font-size:5.2cqw;line-height:1.05;font-weight:800}
.tile .cn{font-size:4cqw;font-weight:800;opacity:.75}
.tile .sk{position:absolute;right:1.6cqw;top:1.6cqw;width:13.8cqw;height:13.8cqw;border-radius:50%;background:var(--sp);font-size:6.4cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:3cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
/* ---- xưởng vẽ ---- */
#studio{display:flex;flex-direction:column;align-items:center;gap:2cqw;padding:3cqw;background:var(--sb);overflow:hidden}
#studio>*{position:relative;z-index:1}#studio>.dc{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dc i{position:absolute;font-style:normal;font-size:6cqw;opacity:.26;animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(130cqh) rotate(40deg)}}
.qh{flex:none;height:11cqw;width:100%;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:0 4cqw;border-radius:999px;background:var(--sp);color:var(--si);box-shadow:var(--sh);font-weight:800;font-size:5.4cqw}
.qh>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:1.6cqw;flex:none}.dots i{width:4.2cqw;height:4.2cqw;border-radius:50%;background:rgba(0,0,0,.14)}.dots i.on{background:var(--sa);outline:.6cqw solid var(--sa);outline-offset:.4cqw}.dots i.ok{background:var(--good)}
.tbox{position:relative;flex:none;width:min(92cqw,calc(100cqh - 41cqw));aspect-ratio:1;background:var(--sp);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden}
.tbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hintdot{position:absolute;width:9cqw;height:9cqw;margin:-4.5cqw 0 0 -4.5cqw;border-radius:50%;background:var(--sa);opacity:.8;pointer-events:none;animation:pulse 1s ease-in-out infinite;box-shadow:0 0 0 1cqw rgba(255,255,255,.7)}
@keyframes pulse{50%{transform:scale(1.5);opacity:.35}}
.qbar{flex:none;width:100%;display:flex;align-items:center;gap:3cqw;padding:0 2cqw}
.pbar{flex:1;height:5cqw;border-radius:999px;background:rgba(0,0,0,.14);overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--sa);border-radius:999px;transition:width .15s}
.ib2{width:14cqw;height:14cqw;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:17cqw;height:17cqw;font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.ib2:active{transform:scale(.92)}
.toast{position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:12;padding:1.2cqw 4cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4.2cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.paused #studio{filter:blur(3px);pointer-events:none}
.cdn{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font-size:55cqw;font-weight:800;color:#fff;background:rgba(20,20,40,.55);text-shadow:0 1cqw 0 rgba(0,0,0,.3)}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqw;padding:3.5cqw;text-align:center;background:color-mix(in srgb,var(--bg) 97%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7cqw;font-weight:800;line-height:1.05;max-width:100%}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700;line-height:1.15;max-width:100%}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2.2cqw 1.4cqw;font-weight:800;font-size:4.4cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:7cqw;width:8cqw;text-align:center;flex:none;line-height:1}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:1cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow)}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center;align-items:center}
.go{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
.mc{width:62cqw;height:62cqw;flex:none;display:block;touch-action:manipulation;cursor:pointer}
.mc.idle{animation:bob 1.8s ease-in-out infinite}.mc.jump{animation:jump .5s}
@keyframes bob{50%{transform:translateY(-2cqw) rotate(1.6deg)}}
@keyframes jump{30%{transform:translateY(-6cqw) scale(1.06,.94)}60%{transform:scale(.95,1.06)}}
.view .mc{width:52cqw;height:52cqw}
.stars{font-size:5cqw;font-weight:800;letter-spacing:.3cqw}
#mnNick{width:78%;height:9cqw;border-radius:999px;border:.5cqw solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:4.4cqw;font-weight:800;text-align:center;padding:0 3cqw;-webkit-user-select:text;user-select:text}
.alt{display:flex;gap:1.6cqw;width:100%;justify-content:center}
.alt button{flex:1;height:14.6cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:5.4cqw;font-weight:800;position:relative}
.alt.sv{gap:2.4cqw;flex-wrap:nowrap}.alt.sv button{flex:0 0 21cqw;height:auto;min-height:18cqw;border-radius:4.5cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqw;padding:2cqw .8cqw;font-size:3.5cqw;line-height:1.1;border:1.5px solid color-mix(in srgb,currentColor 38%,transparent)}.alt.sv button b{font-size:7.4cqw;line-height:1}.alt.sv button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbox canvas{cursor:crosshair}
@media (hover:hover) and (pointer:fine){.alt button:hover,.ib2:hover,.go:hover{filter:brightness(1.06);transform:translateY(-1px)}.alt button:active,.ib2:active{transform:scale(.96)}.res3 canvas:hover,.mc:hover{transform:scale(1.03)}}
.alt button.on{background:var(--accent);color:var(--on-accent)}.alt button small{font-size:3.2cqw;margin-left:.6cqw}
.agrid{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(var(--c,6),1fr);grid-auto-rows:1fr;gap:1.4cqw;align-content:start}
.ac{position:relative;border-radius:3cqw;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;min-height:0;aspect-ratio:1;padding:0}
.ac canvas{width:100%;height:100%;display:block}
.ac.em{opacity:.6;font-size:6cqw;color:var(--muted);font-weight:800}.ac.em b{position:absolute;left:.8cqw;top:0;font-size:2.8cqw;opacity:.8}
.ac.em span{font-size:6.5cqw;opacity:.5}.ac.cur{outline:.8cqw solid var(--accent)}
.ac .rn{position:absolute;right:.6cqw;bottom:0;font-size:2.4cqw;line-height:1}
.res3{display:flex;gap:2cqw;justify-content:center;width:100%}.res3 canvas{width:27cqw;height:27cqw;background:var(--panel);border-radius:4cqw;box-shadow:var(--shadow);cursor:pointer}
.sc{font-size:13cqw;font-weight:800;line-height:1}
.vsrow{font-size:6cqw;font-weight:800}
#ovAlb,#ovMon{background:var(--sb);color:var(--si)}#ovAlb>.dc,#ovMon>.dc{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}#ovAlb>*:not(.dc),#ovMon>*:not(.dc){position:relative;z-index:1}
#ovAlb p,#ovMon p,#ovAlb h2,#ovMon h2,#ovMon .stars{color:var(--si)}#ovMon p{opacity:.85}
.sc{position:absolute;inset:0;z-index:0;pointer-events:none}
#studio[data-fam="0"] .sc{background:radial-gradient(ellipse 70% 16% at 25% 102%,rgba(47,191,113,.4),transparent 72%),radial-gradient(ellipse 60% 14% at 85% 104%,rgba(47,191,113,.32),transparent 72%)}
#studio[data-fam="0"] .dc i{animation-name:rise}
#studio[data-fam="1"] .sc{background:repeating-linear-gradient(0deg,rgba(59,130,246,.11) 0 .4cqw,transparent .4cqw 6cqw),repeating-linear-gradient(90deg,rgba(59,130,246,.11) 0 .4cqw,transparent .4cqw 6cqw);animation:grid 6s linear infinite}
#studio[data-fam="2"] .sc{background:radial-gradient(circle at 15% 12%,rgba(255,255,255,.7) 0 9cqw,transparent 9.5cqw),radial-gradient(circle at 80% 20%,rgba(255,255,255,.6) 0 12cqw,transparent 12.5cqw),radial-gradient(circle at 55% 6%,rgba(255,255,255,.5) 0 7cqw,transparent 7.5cqw);animation:cloud 9s ease-in-out infinite alternate}
#studio[data-fam="3"] .sc{background:linear-gradient(160deg,transparent 62%,rgba(120,40,10,.2) 62% 80%,transparent 80%),linear-gradient(200deg,transparent 72%,rgba(120,40,10,.16) 72%)}
@keyframes rise{0%{transform:translateY(130cqh) rotate(0)}100%{transform:translateY(-12cqh) rotate(30deg)}}
@keyframes grid{to{background-position:0 6cqw,6cqw 0}}@keyframes cloud{to{transform:translateX(4cqw)}}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
.cbx{min-height:9cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.cbx b{font-size:7.4cqw;color:var(--sa);text-shadow:0 .5cqw 0 rgba(0,0,0,.12);animation:newpop .6s cubic-bezier(.2,1.8,.4,1) both}.cbx span{font-size:4.6cqw}
.cbn{display:inline-block;padding:0 2.4cqw;border-radius:999px;background:var(--sa);color:var(--sa2);font-size:4.4cqw}
@keyframes newpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cbx b,#studio .sc,#studio .dc i{animation:none!important}}
@media (max-width:360px){.hud{font-size:18px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.dc i,.mc.idle,.hintdot{animation:none}}
/* nút biểu tượng luôn có viền cùng màu biểu tượng để nổi trên mọi nền/giao diện */
.ib,.ib2{border:1.5px solid color-mix(in srgb,currentColor 42%,transparent)!important;box-sizing:border-box}
.ib:not(:disabled),.ib2:not(:disabled){filter:none}
/*skgrid-center*/.skgrid{display:flex!important;flex-wrap:wrap;justify-content:center;--n:3;--gg:2.4cqw;gap:var(--gg)!important}.skgrid>*{flex:0 0 calc((100% - (var(--n) - 1)*var(--gg))/var(--n))!important;min-width:0;box-sizing:border-box}
</style>
<script src="../../../shared/offline.js" defer></script>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="top">
      <h1 id="title"></h1>
      <button class="ib" id="homeBtn" type="button" hidden>🏠</button>
      <button class="ib" id="soundBtn" type="button">🔊</button>
      <button class="ib" id="langBtn" type="button" style="font-size:14px;font-weight:800">VI</button>
    </div>
    <div class="hud"><span id="hl"></span><span id="hr"></span></div>
  </div>
  <div class="play" id="play">
    <div id="home"></div>
    <div id="studio" hidden>
      <div class="dc"></div><div class="sc"></div>
      <div class="qh"><span id="qp"></span><span class="dots" id="dots"></span></div>
      <div class="tbox" id="tbox"><canvas id="tc"></canvas><i class="hintdot" id="hd" hidden></i></div>
      <div class="qbar"><button class="ib2" id="hintBtn" type="button">💡</button><div class="pbar"><i id="pbi"></i></div><button class="ib2" id="clrBtn" type="button">↺</button></div>
    </div>
    <div class="cdn" id="cdn" hidden></div>
    <canvas id="fx" width="400" height="533"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <div class="ov" id="ovHow" hidden>
      <h2 id="hwH"></h2><span class="chip" id="hwC"></span>
      <ul class="hwL" id="hwL"></ul>
      <div class="row"><button class="ib2" id="hwBack" type="button">←</button><button class="go" id="hwGo" type="button"></button></div>
    </div>
    <div class="ov" id="ovCh" hidden>
      <h2 id="chH"></h2><canvas class="mc idle" id="chC" width="360" height="360" style="width:46cqw;height:46cqw"></canvas><p id="chP"></p>
      <div class="row"><button class="ib2" id="chNo" type="button">✕</button><button class="go" id="chGo" type="button"></button></div>
    </div>
    <div class="ov" id="ovMon" hidden><div class="dc"></div>
      <div class="cbx" id="mnCb"></div><h2 id="mnH"></h2><div class="stars" id="mnR"></div><canvas class="mc" id="mnC" width="560" height="560"></canvas><p id="mnP"></p>
      <input id="mnNick" type="text" maxlength="14" autocomplete="off" hidden><p id="mnL" hidden></p>
      <div class="row" id="mnRow"><button class="ib2" id="mnCry" type="button">🔊</button><button class="ib2" id="mnSave" type="button">💾</button><button class="ib2" id="mnShare" type="button" hidden>📤</button><button class="ib2 main" id="mnNext" type="button">▶</button></div>
      <div class="alt sv" id="svRow" hidden><button id="svT" type="button"><b>🖼</b><span id="svTl"></span></button><button id="svW" type="button"><b>📱</b><span id="svWl"></span></button><button id="svP" type="button"><b>🖨</b><span id="svPl"></span></button><button id="svX" type="button"><b>✕</b><span id="svXl"></span></button></div>
    </div>
    <div class="ov" id="ovAlb" hidden><div class="dc"></div>
      <h2 id="alH"></h2><div class="alt" id="alTabs"></div><div class="agrid" id="alGrid"></div>
      <div class="row"><button class="ib2" id="alBack" type="button">←</button></div>
    </div>

  $("pwH").textContent=T("pw.h");$("pwP").textContent=T("pw.p",{name:T("sk."+t+"."+id)});$("pwGo").textContent="🔐 "+T("pw.go");$("pwLater").textContent=T("pw.later");
  $("pwTrial").hidden=LS.get("qv-trial","")===today();$("pwTrial").textContent="🎈 "+T("pw.trial");showOv("ovPay");
}
$("pwLater").onclick=()=>openSkins(skFor);
$("pwGo").onclick=()=>{track("ve-chu-quai-vat_skin","click");openGate(null,"ovPay")};
$("pwTrial").onclick=async()=>{
  try{await PF.loadPro(true);LS.set("qv-trial",today());track("ve-chu-quai-vat_skin","trial");const f=payFor,old=PF.skinSel[f.t];PF.skinSel[f.t]=f.id;PF.skinRestore={t:f.t,old};begin(f.t)}
  catch(e){toast(T("pw.tried"),2200);showOv(null)}
};
function openGate(cb,back,msg){
  if(back)gateBack=back;const a=6+rnd(0,3),b=4+rnd(0,4),ans=a+b,opts=shuf([ans,ans+rnd(1,2),ans-rnd(1,2)]);
  $("gtH").textContent=T("gt.h");$("gtP").textContent=msg?T(msg)+" "+a+" + "+b+" = ?":T("gt.p",{a,b});$("gtX").textContent=T("gt.x");$("gtNums").innerHTML="";
  opts.forEach(n=>{const x=document.createElement("button");x.type="button";x.textContent=n;x.onclick=()=>{if(n===ans){cb?cb():window.top.location.href=subUrl()}else showOv(gateBack)};$("gtNums").appendChild(x)});showOv("ovGate");
}
$("gtX").onclick=()=>showOv(gateBack);
const fetchT=(u,o,ms)=>{const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({signal:c.signal},o)).finally(()=>clearTimeout(id))};
PF.loadPro=async function(trial,ticket){
  const tk=ticket||passToken(),cacheable=!trial&&!ticket;let src=null,r=null;
  try{r=await fetchT("/api/pro/ve-chu-quai-vat.js"+(trial?"?trial=1":""),{headers:tk?{Authorization:"Bearer "+tk}:{},cache:"no-store"},8000)}catch(e){r=null}
  if(r&&r.ok){src=await r.text();if(cacheable)LS.set("qv-pro-src",{src})}
  else{
    if(r&&r.status>=400&&r.status<500&&r.status!==429){if(r.status===401&&cacheable)try{localStorage.removeItem("qv-pro-src")}catch(e){}throw new Error("pro_"+r.status)}
    const c=cacheable?LS.get("qv-pro-src",null):null,p=LS.get("pass",null);
    if(c&&c.src&&p&&p.exp&&new Date(p.exp)>new Date())src=c.src;else throw new Error("pro_offline");
  }
  new Function("PF",src)(PF);if(PF.pro&&!PF.pro.trial){const ad=LS.get("qv-auto",[]);let ch=0;for(let t=0;t<4;t++)if(!ad[t]){ad[t]=1;ch=1;if(PF.skinSel[t]==="basic"){const f=Object.keys(PF.skins[t]).find(i=>i!=="basic");if(f)PF.skinSel[t]=f}}if(ch){LS.set("qv-auto",ad);LS.set("qv-skin",PF.skinSel)}}MC.clear();if(!G&&!$("home").hidden)renderHome();if(cacheable)PF.fetchTicket();
};
PF.fetchTicket=function(){const tk=passToken();if(!tk||HELPER||!PF.pro||PF.pro.trial)return;fetchT("/api/pro/ticket",{method:"POST",headers:{Authorization:"Bearer "+tk},cache:"no-store"},6000).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ticket){PF.ticket=j.ticket;PF.ticketAt=Date.now()}}).catch(()=>{})};
addEventListener("online",()=>{if(!PF.ticket)PF.fetchTicket()});setInterval(()=>{if(PF.pro&&!PF.pro.trial&&(!PF.ticket||Date.now()-(PF.ticketAt||0)>20*36e5))PF.fetchTicket()},60000);
PF.lockPro=function(){for(let t=0;t<4;t++)for(const id of Object.keys(PF.skins[t]))if(id!=="basic")delete PF.skins[t][id];PF.pro=null;MC.clear();if(PF.skinRestore){const r=PF.skinRestore;PF.skinSel[r.t]=r.old||"basic";PF.skinRestore=null}};

/* ===== NGÔN NGỮ / ÂM THANH ===== */
function applyLang(){
  document.documentElement.lang=LANG;document.title=T("docTitle");$("title").textContent=T("title");$("langBtn").textContent=LANG.toUpperCase();$("langBtn").setAttribute("aria-label",T("lang"));
  $("soundBtn").setAttribute("aria-label",T("sound"));$("homeBtn").setAttribute("aria-label",T("home"));$("homeBtn2").setAttribute("aria-label",T("home"));$("rankBtn").setAttribute("aria-label",T("rank.btn"));$("hintBtn").setAttribute("aria-label",T("hint"));syncSound();
  if(!G)renderHome();else{if(G.over)renderEnd();else upd()}
  if(!$("ovMon").hidden)renderMon();if(!$("ovAlb").hidden)renderAlbum();if(!$("ovCh").hidden&&CH)openCh();
}
function syncSound(){$("soundBtn").textContent=sound?"🔊":"🔇"}
$("soundBtn").onclick=()=>{sound=!sound;if(window.NPAudio)NPAudio.set(sound);else if(!sound&&window.speechSynthesis)speechSynthesis.cancel();syncSound()};
$("langBtn").onclick=()=>{LANG=LANG==="vi"?"en":"vi";try{localStorage.setItem("lang",LANG)}catch(e){}applyLang()};
$("homeBtn").onclick=()=>{if(!HELPER)goHome()};
function again(){if(!G)return;if(G.daily)return startDaily();begin(G.t,{lv:G.ch?LVL:G.lv})}
$("againBtn").onclick=again;
$("shareBtn").onclick=()=>openGate(()=>{showOv("ovEnd");doShare()},"ovEnd","gt.sh");
$("albBtn").onclick=()=>openAlbum(G?G.t:0);
$("ovEnd").addEventListener("pointerdown",e=>{if(HELPER||e.target.closest("button")||e.target.closest("canvas")||performance.now()-endAt<450)return;again()});
$("homeBtn2").onclick=goHome;
$("rankBtn").onclick=()=>{window.NP&&NP.brag&&NP.brag()};
/* phím tắt khi chơi trên máy tính: Z/Backspace = quay lại nét vừa vẽ, C = xoá hết, H = gợi ý, Enter/Cách = tiếp tục, S = lưu ảnh, Esc = quay về */
addEventListener("keydown",e=>{if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||e.ctrlKey&&e.key.toLowerCase()!=="z"||e.altKey||e.metaKey)return;const k=e.key.toLowerCase(),vis=id=>!$(id).hidden;
  if(!$("ovGate").hidden){if(k==="escape")$("gtX").click();return}
  if(TR&&!TR.done&&G&&!G.over&&!ovs.some(o=>vis(o))){if(k==="z"||k==="backspace"||k==="delete"){e.preventDefault();$("clrBtn").click();return}if(k==="c"&&TR.reset){e.preventDefault();TR.reset();return}if(k==="h"){e.preventDefault();$("hintBtn").click();return}if(k==="escape"&&!HELPER){e.preventDefault();goHome();return}}
  if(vis("ovMon")){if(k==="escape"){e.preventDefault();if(vis("svRow"))$("svX").click();else $("mnNext").click();return}
    if((k==="enter"||k===" ")&&vis("mnRow")&&!e.repeat){e.preventDefault();$("mnNext").click();return}if(k==="s"&&vis("mnRow")){e.preventDefault();$("mnSave").click();return}if(k==="c"){e.preventDefault();$("mnCry").click();return}
    if(vis("svRow")){const m={"1":"svT","2":"svW","3":"svP"}[k];if(m){e.preventDefault();$(m).click()}}return}
  if(k==="escape"){const m=[["ovAlb","alBack"],["ovSkin","skBack"],["ovHow","hwBack"],["ovCh","chNo"],["ovPay","pwLater"]].find(([o])=>vis(o));if(m){e.preventDefault();$(m[1]).click()}}
});
addEventListener("keydown",e=>{if(G&&G.over&&!HELPER&&(e.key==="Enter"||e.key===" ")&&!e.repeat&&!$("ovEnd").hidden&&performance.now()-endAt>450){e.preventDefault();again()}});
addEventListener("storage",e=>{if(e.key==="theme")document.documentElement.dataset.theme=e.newValue||"light"});

/* ===== CẦU NỐI VỚI TRANG CHA ===== */
if(window.NP){
  NP.state(()=>{if(!G||G.over)return null;const st={t:G.t,lv:G.lv,s:G.seed,r:G.r};if(PF.pro&&!PF.pro.trial&&PF.ticket){st.tk=PF.ticket;const sk=PF.skinSel[G.t];if(sk&&sk!=="basic"&&PF.skins[G.t][sk])st.sk=sk}return st});
  NP.onPause(()=>{paused=true;$("play").classList.add("paused");if(window.speechSynthesis)speechSynthesis.cancel()},()=>{paused=false;$("play").classList.remove("paused")});
}
if(passToken()&&!HELPER)PF.loadPro(false).catch(()=>{});
applyLang();goHome();
if(!HELPER){CH=parseCh();if(CH)openCh();else if(location.hash==="#daily")startDaily()}
else{const HS=window.NP&&NP.initialState,I=(v,a,z)=>Number.isInteger(v)&&v>=a&&v<=z;
  if(HS&&I(HS.t,0,3)&&I(HS.lv,1,3)&&I(HS.s,0,4294967295)&&I(HS.r,0,2)){const go=()=>begin(HS.t,{seed:HS.s,lv:HS.lv,r0:HS.r}),okT=HS.tk&&/^h\.\d{13}\.[\w-]{43}$/.test(HS.tk);
    if(okT)PF.loadPro(false,HS.tk).then(()=>{if(/^[a-z]{3,10}$/.test(HS.sk||"")&&PF.skins[HS.t][HS.sk])PF.skinSel[HS.t]=HS.sk}).catch(()=>{}).finally(go);else go()}}
window.QV={get G(){return G},get TR(){return TR},get MON(){return MON},get CH(){return CH},PF,ITEMS,POOLS,LV,hash,makePlan,makeMonster,composeMonster,monsterImg,layoutOf,cry,renderOut,drawCard,shareText,shareLink,dailyInfo,parseCh,b64e,startDaily,begin,goHome,albGet,albCount,openAlbum,openHow,
  setLv(n){LVL=n},solve(){TR&&TR.solve()},finishTrace(){TR&&TR.solve()},
  async bot(t,lv,seed){begin(t,{seed,lv});for(let i=0;i<3;i++){for(let k=0;k<200&&!(TR&&!TR.done&&G&&G.r===i);k++)await sleep(50);TR.solve();for(let k=0;k<200&&$("ovMon").hidden;k++)await sleep(50);await sleep(60);$("mnNext").click()}return G}};
