<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đoán Xem Bé Mấy Tuổi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"></noscript>
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Đoán Xem Bé Mấy Tuổi — bé làm 10 câu trong 60 giây (chữ cái, con số, phép tính), cuối ván xem "tuổi não" vui của bé.
   CHỈ ĐỂ VUI, không phải đánh giá trí tuệ. Luôn vừa một màn hình. */
:root{--bg:#FFF6EC;--ink:#3b2a1d;--muted:#8a6f5a;--panel:#fff;--line:#f0d9c0;--accent:#8a5cf6;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--warn:#ffb020;--shadow:0 8px 24px rgba(120,70,20,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 150px)*.75),520px)}
:root[data-theme="dark"]{--bg:#1B2340;--ink:#F2F4FF;--muted:#a9b2d8;--panel:#26305a;--line:#38437a;--accent:#a68bff;--on-accent:#1a0f3a;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(17px,5vw,25px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800}
/* ---- sân khấu ---- */
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sb:linear-gradient(#e6d9ff,#cfe6ff);--sp:#fff;--si:#3a2a5a;--sa:#8a5cf6;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid rgba(255,255,255,.9);--sh:0 1cqw 3cqw rgba(0,0,0,.18);--tm:#8a5cf6;--tk:rgba(255,255,255,.7);--mb:#ff9ec4}
/* ===== Night Pass: hình giao diện quanh sân chơi, mỗi lần đúng nổ hình theo chủ đề, phát sáng — bản free không có ===== */
#stage .stg-o{position:absolute;z-index:0;pointer-events:none;font-size:8cqw;line-height:1;font-style:normal;opacity:.9;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.3));animation:stgf 3s ease-in-out infinite}
#stage .stg-o.a{left:1.4cqw;bottom:24cqw}#stage .stg-o.b{right:1.4cqw;bottom:24cqw;animation-delay:-1.4s}#stage .stg-o.c{right:1.6cqw;top:23cqw;font-size:6cqw;animation-delay:-2.2s}
@keyframes stgf{50%{transform:translateY(-1.4cqw) rotate(6deg)}}
.eb{position:absolute;z-index:9;pointer-events:none;font-size:8cqw;line-height:1;font-style:normal;left:50%;top:50%;animation:ebur 1s ease-out forwards}
@keyframes ebur{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--rt))}}
.pro .qcard{box-shadow:var(--sh),0 0 4cqw color-mix(in srgb,var(--sa) 55%,transparent)}.pro .ab{box-shadow:var(--sh),0 0 2.4cqw color-mix(in srgb,var(--sa) 60%,transparent)}
.tile .tdc{position:absolute;left:2cqw;top:1.8cqw;font-size:5cqw;line-height:1;letter-spacing:.4cqw;pointer-events:none;filter:drop-shadow(0 .4cqw .4cqw rgba(0,0,0,.25))}
@media (prefers-reduced-motion:reduce){#stage .stg-o{animation:none}.eb{display:none}}
#home,#stage{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:linear-gradient(#d8ecff,#f1e4ff)}
.lvs{display:flex;gap:2cqw;justify-content:center;align-items:center;background:rgba(255,255,255,.7);border-radius:999px;padding:1.2cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:max(11cqw,38px);border-radius:999px;background:transparent;color:#3b2a1d;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.dbar,.pbar{flex:none;height:max(10.4cqw,38px);border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.5cqw;font-weight:800;font-size:4.6cqw;box-shadow:var(--sh);gap:2cqw}
.dbar{background:linear-gradient(90deg,var(--accent),#ff7a59)}
.pbar{background:rgba(255,255,255,.85);color:#3a2a5a}
.dbar:active,.pbar:active{transform:scale(.98)}
.pbar span,.dbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.4cqw}
.tile{position:relative;border-radius:5cqw;background:var(--sb);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:1cqw;overflow:hidden;text-align:center}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:17cqw;line-height:1}.tile b{font-size:5cqw;line-height:1.05;font-weight:800}.tile small{font-size:3.3cqw;font-weight:700;opacity:.8;line-height:1.1}
.tile .sk{position:absolute;right:1.6cqw;top:1.6cqw;width:max(10cqw,36px);height:max(10cqw,36px);border-radius:50%;background:var(--sp);font-size:5cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:3cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
/* ---- sân chơi ---- */
#stage{display:flex;flex-direction:column;gap:2cqw;padding:3cqw;background:var(--sb);overflow:hidden}
#stage>*{position:relative;z-index:1}#stage>.dc,#stage>.lay{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}#stage>#fx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}#stage>.pop{position:absolute}
.dc i{position:absolute;font-style:normal;font-size:6cqw;opacity:.26;animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(120cqh) rotate(40deg)}}
.sh{flex:none;display:flex;align-items:center;gap:3cqw;height:26cqw;padding-top:5cqw}
.tw{flex:1;min-width:0;display:flex;flex-direction:column;gap:2cqw}
.tm{position:relative;height:5.4cqw;border-radius:999px;background:var(--tk);overflow:hidden;box-shadow:inset 0 .4cqw 1cqw rgba(0,0,0,.15)}
.tm i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,100)*1%);background:var(--tm);border-radius:inherit}
.tm b{display:none;position:absolute;left:calc(var(--p,100)*1%);top:50%;transform:translate(-50%,-50%);font-size:6.4cqw;line-height:1}
.tm.fuse{overflow:visible}.tm.fuse b{display:block}
.tm.seg i{-webkit-mask:repeating-linear-gradient(90deg,#000 0 7%,transparent 7% 8.3%);mask:repeating-linear-gradient(90deg,#000 0 7%,transparent 7% 8.3%);border-radius:0}
.tm.low i{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.dr{display:flex;align-items:center;gap:2cqw;min-height:6.4cqw}
.dots{flex:1;display:flex;gap:1.2cqw;align-items:center;justify-content:space-between}
.cmb{flex:none;min-width:15cqw;text-align:center;font-size:5.2cqw;font-weight:800;line-height:1.2;color:#fff;background:linear-gradient(90deg,#ff9a3a,#ff4f6a);border-radius:999px;padding:.3cqw 2cqw;box-shadow:0 .6cqw 0 rgba(0,0,0,.2);visibility:hidden}
.cmb.on{visibility:visible;animation:newpop .35s cubic-bezier(.2,1.6,.4,1)}.cmb.t1{background:linear-gradient(90deg,#ffb703,#ff7a59)}.cmb.t2{background:linear-gradient(90deg,#ff4f6a,#c04cff);box-shadow:0 0 3cqw #ff4f6a}.cmb.t3{background:linear-gradient(90deg,#ffd54a,#ff4fa3,#7a5cff);box-shadow:0 0 4cqw #ffd54a;font-size:6.2cqw}
.sun{position:absolute;right:-6cqw;top:26cqw;width:34cqw;height:34cqw;border-radius:50%;background:var(--sun,rgba(255,255,255,.7));box-shadow:0 0 9cqw var(--sun,rgba(255,255,255,.7));opacity:.5;animation:bob 7s ease-in-out infinite}
.gnd{position:absolute;left:0;bottom:.4cqw;white-space:nowrap;font-size:9cqw;line-height:1;opacity:.5;animation:slide 50s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.pt{position:absolute;line-height:1;transform:translate(-50%,-50%);animation:fly .95s ease-out forwards}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(200deg) scale(.4);opacity:0}}
.flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.85),transparent 65%);animation:fl .5s forwards}@keyframes fl{from{opacity:1}to{opacity:0}}
.ray{position:absolute;left:50%;top:50%;width:150cqw;height:150cqw;margin:-75cqw;border-radius:50%;background:repeating-conic-gradient(rgba(255,226,110,.6) 0 9deg,transparent 9deg 30deg);animation:ray 1s forwards}@keyframes ray{from{transform:rotate(0) scale(.3);opacity:1}to{transform:rotate(70deg) scale(1);opacity:0}}
.pop{left:50%;top:27cqw;z-index:7;font-size:9.5cqw;font-weight:800;color:#fff;text-shadow:0 .8cqw 0 rgba(0,0,0,.35),0 0 3cqw #ffb703;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-50%)}
.pop.on{animation:popup 1s ease-out}@keyframes popup{0%{transform:translateX(-50%) scale(.4);opacity:0}20%{transform:translateX(-50%) scale(1.15);opacity:1}75%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-5cqw);opacity:0}}
.dots u{flex:1;max-width:7cqw;height:3.6cqw;border-radius:999px;background:rgba(255,255,255,.55);text-decoration:none;border:.35cqw solid rgba(0,0,0,.08)}
.dots u.o{background:var(--good)}.dots u.x{background:var(--warn)}.dots u.cur{background:#fff;border-color:var(--sa)}
.grp{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3cqw}
.qcard{flex:1;max-height:60cqw;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;background:var(--sp);color:var(--si);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);padding:1.5cqw 2.5cqw;text-align:center;overflow:hidden}
.qp{font-size:5cqw;font-weight:800;line-height:1.1;opacity:.85}
.qb{font-size:15cqw;font-weight:800;line-height:1.15;word-break:break-word;max-width:100%}.qb.huge{font-size:26cqw;line-height:1.2}.qb.sym{font-size:20cqw;line-height:1.2}#qb{display:flex;justify-content:center;max-width:100%}.qb.cnt{letter-spacing:.4cqw}
.ans{flex:none;display:flex;gap:3cqw;justify-content:center;width:100%}
.ab{flex:1;max-width:29cqw;height:19cqw;border-radius:var(--rad);background:var(--sa);color:var(--sa2);font-size:10.5cqw;font-weight:800;border:var(--bd);box-shadow:var(--sh);padding:0;line-height:1}
.ab:active{transform:scale(.94)}
.ab.good{background:var(--good)!important;color:#fff!important}
.ab.bad{background:#bbb!important;color:#fff!important;opacity:.55;animation:shake .35s}
@keyframes shake{20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.4cqw)}80%{transform:translateX(1.4cqw)}}
@keyframes newpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-1.6cqw)}}
.cdn{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font-size:55cqw;font-weight:800;color:#fff;background:rgba(40,20,80,.5);text-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.paused #stage{filter:blur(3px);pointer-events:none}
.toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:9;padding:1.2cqw 4cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4.2cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
/* ---- bộ não hoạt hình (nhân vật phụ) ---- */
.mas{--ms:20cqw;position:relative;width:var(--ms);height:var(--ms);flex:none;animation:bob 2.4s ease-in-out infinite}
.mas .m-body{position:absolute;left:10%;right:10%;bottom:6%;height:62%;background:var(--mb);border-radius:50% 50% 46% 46%;box-shadow:inset 0 -.8cqw 0 rgba(0,0,0,.12)}
.mas .m-body::before,.mas .m-body::after{content:"";position:absolute;top:-14%;width:46%;height:46%;border-radius:50%;background:var(--mb)}
.mas .m-body::before{left:2%}.mas .m-body::after{right:2%}
.mas .m-e{position:absolute;top:36%;left:26%;width:12%;height:16%;border-radius:50%;background:#2a1a3a;z-index:1}.mas .m-e.r{left:auto;right:26%}
.mas .m-m{position:absolute;left:50%;top:60%;width:26%;height:14%;transform:translateX(-50%);border:.6cqw solid #2a1a3a;border-top:0;border-radius:0 0 999px 999px;z-index:1}
.mas.yay .m-m{height:22%;background:#a02a4a}.mas.yay{animation:newpop .4s cubic-bezier(.2,1.6,.4,1)}
.mas.oops{animation:shake .5s}.mas.oops .m-m{border-radius:999px 999px 0 0;border:.6cqw solid #2a1a3a;border-bottom:0;top:68%}
.mas .m-aura{display:none;position:absolute;inset:0}
.mas .m-fx{position:absolute;left:-14%;top:-6%;font-size:calc(var(--ms)*.3);line-height:1;z-index:3}
.mas.think .m-m{width:12%;height:12%;left:50%;border:.6cqw solid #2a1a3a;border-radius:50%;top:64%}
.mas.think .m-e{transform:translateX(.6cqw)}
.mas.yay .m-prop,.mas[data-t="1"] .m-prop,.mas[data-t="2"] .m-prop,.mas[data-t="3"] .m-prop{animation:wob .5s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(18deg) scale(1.12)}}
.mas[data-t="1"]{animation:bob 1s ease-in-out infinite}.mas[data-t="2"]{filter:drop-shadow(0 0 1.4cqw #ffd54a);animation:bob .7s ease-in-out infinite}
.mas[data-t="3"]{filter:drop-shadow(0 0 2cqw #ffd54a) drop-shadow(0 0 3cqw #ff4fa3);animation:bob .5s ease-in-out infinite;transform:scale(1.12)}
.mas[data-t="3"] .m-e,.mas[data-t="2"] .m-e{background:#ffd54a;box-shadow:0 0 1cqw #ff9a3a,inset 0 0 0 .3cqw #2a1a3a}
.mas[data-t="3"] .m-m,.mas[data-t="2"] .m-m{height:22%;background:#a02a4a}
.mas .m-hat{position:absolute;left:50%;top:-6%;transform:translateX(-50%);font-size:calc(var(--ms)*.5);line-height:1;z-index:2}
.mas .m-prop{position:absolute;right:-10%;bottom:-4%;font-size:calc(var(--ms)*.42);line-height:1;z-index:2}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqw;padding:3.6cqw;text-align:center;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700;line-height:1.15}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2.4cqw 1.4cqw;font-weight:800;font-size:4.4cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:7cqw;width:8cqw;text-align:center;flex:none;line-height:1}
.chip{min-height:36px;background:var(--panel);color:var(--ink);border-radius:999px;padding:1.2cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center;align-items:center}
.ib2{width:max(13cqw,38px);height:max(13cqw,38px);border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:max(17cqw,44px);height:max(17cqw,44px);font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.cta{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{min-height:38px;background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
/* hồ sơ bé */
.ages{display:flex;gap:1.8cqw;width:100%;justify-content:center}.ages button{flex:1;max-width:14cqw;height:max(13cqw,38px);border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6.6cqw;font-weight:800}
.ages button.on,.nms button.on{background:var(--accent);color:var(--on-accent)}
.nms{display:flex;gap:1.6cqw;flex-wrap:wrap;justify-content:center}.nms button{min-width:38px;height:max(9cqw,36px);padding:0 3.2cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:4.2cqw;font-weight:800}
.nmi{width:100%;height:11.5cqw;border-radius:999px;border:.6cqw solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:5cqw;font-weight:800;text-align:center;padding:0 4cqw;-webkit-user-select:text;user-select:text}
.small{font-size:3.4cqw!important;line-height:1.15}
/* màn kết thúc */
#ovEnd .mas{--ms:24cqw}
