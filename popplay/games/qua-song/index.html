<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Qua Sông Cùng Bé — đố vui đưa mọi người qua sông bằng thuyền (cảnh sát & trộm, bác nông dân, cả nhà, qua cầu đêm).
   Chọn sai chỉ bị nhắc nhẹ và thuyền quay về, không bao giờ "thua". Luôn vừa một màn hình. */
:root{--bg:#FFF6EC;--ink:#3b2a1d;--muted:#8a6f5a;--panel:#fff;--line:#f0d9c0;--accent:#FF5A1F;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--warn:#ffb020;--shadow:0 8px 24px rgba(120,70,20,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 150px)*.75),520px)}
:root[data-theme="dark"]{--bg:#1B2340;--ink:#F2F4FF;--muted:#a9b2d8;--panel:#26305a;--line:#38437a;--accent:#FF7A45;--on-accent:#2a1204;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800}
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:manipulation;
  --sb:linear-gradient(#bfe8ff,#e6f6d8);--pb:linear-gradient(#5ec3ff,#2f8fe0);--sp:#fff;--si:#3b2a1d;--sa:#ff5a1f;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid rgba(255,255,255,.9);--sh:0 1cqw 3cqw rgba(0,0,0,.18)}
#home,#arena{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:var(--sb)}
.lvs{display:flex;gap:2cqw;justify-content:center;align-items:center;background:rgba(255,255,255,.7);border-radius:999px;padding:1.2cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:11cqw;border-radius:999px;background:transparent;color:#3b2a1d;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.4cqw}
.tile{position:relative;border-radius:5cqw;background:var(--sb);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:1cqw;overflow:hidden;text-align:center;cursor:pointer}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:17cqw;line-height:1}.tile b{font-size:4.6cqw;line-height:1.05;font-weight:800}
.tile .sk{position:absolute;right:1.6cqw;top:1.6cqw;width:max(9cqw,36px);height:max(9cqw,36px);border-radius:50%;background:var(--sp);font-size:4.6cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:2.8cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
.tile .bd{position:absolute;left:2cqw;top:1.6cqw;font-size:3.6cqw;font-weight:800;opacity:.85}
.dbar{flex:none;height:10.4cqw;border:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7a5cff);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.5cqw;font-weight:800;font-size:4.6cqw;box-shadow:var(--sh)}
.dbar:active{transform:scale(.98)}
/* ---- sân chơi ---- */
#arena{display:flex;flex-direction:column;background:var(--sb)}
.dc{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dc i{position:absolute;font-style:normal;font-size:6cqw;opacity:.24;animation:drift 10s linear infinite}
@keyframes drift{0%{transform:translateY(-12cqw) rotate(0)}100%{transform:translateY(120cqh) rotate(40deg)}}
.scene{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:34cqw 1fr 34cqw;z-index:1}
.bank{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.4cqw;padding:2cqw 1.2cqw;background:color-mix(in srgb,var(--sp) 72%,transparent);transition:background .25s}
.bank.warn{background:color-mix(in srgb,var(--bad) 40%,var(--sp))}
.river{position:relative;background:var(--pb);overflow:hidden}
.river::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.16) 0 .6cqw,transparent .6cqw 7cqw);animation:flow 3s linear infinite}
@keyframes flow{to{background-position:0 7cqw}}
.boat{position:absolute;bottom:34%;width:92%;display:flex;flex-direction:column;align-items:center;gap:0;transition:left .7s ease-in-out;z-index:2}
.seat .chip2{width:13cqw;height:13cqw;font-size:8cqw}.boat .seat{display:flex;flex-wrap:wrap;justify-content:center;gap:1cqw;min-height:15cqw;width:100%;padding:1cqw 0}
.boat .hull{font-size:19cqw;line-height:1;margin-top:-4cqw;filter:drop-shadow(0 1cqw 0 rgba(0,0,0,.2))}
.bridge .river::before{background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 .5cqw,transparent .5cqw 6cqw)}
.chip2{position:relative;width:15cqw;height:15cqw;border-radius:var(--rad);background:var(--sp);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:grid;place-items:center;font-size:9cqw;line-height:1;padding:0;flex:none}
.chip2:active{transform:scale(.92)}
.chip2.hint{animation:hintp .7s ease-in-out infinite;outline:.9cqw solid var(--warn)}
.chip2.bad{animation:shake .4s;outline:.9cqw solid var(--bad)}
.chip2 .tm{position:absolute;right:-.6cqw;bottom:-.6cqw;min-width:6cqw;height:6cqw;border-radius:3cqw;background:var(--accent);color:var(--on-accent);font-size:3.8cqw;font-weight:800;display:grid;place-items:center;padding:0 1cqw}
.chip2.R1{box-shadow:0 0 0 .7cqw #3b82f6,var(--sh)}.chip2.R2{box-shadow:0 0 0 .7cqw #e5484d,var(--sh)}
@keyframes hintp{50%{transform:scale(1.12)}}
@keyframes shake{20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.4cqw)}80%{transform:translateX(1.4cqw)}}
.ctl{flex:none;display:flex;gap:3.4cqw;align-items:center;justify-content:center;padding:2cqw 3cqw;background:color-mix(in srgb,var(--sp) 86%,transparent);z-index:1}
.ib2{width:13cqw;height:13cqw;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none;min-width:38px;min-height:38px}.ib2.main{width:17cqw;height:17cqw;font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.ib2:active{transform:scale(.92)}.ib2:disabled{opacity:.4}
.ib,.ib2{border:1.5px solid color-mix(in srgb,currentColor 42%,transparent)!important}
.toast{position:absolute;left:50%;top:6cqw;transform:translateX(-50%);z-index:9;padding:1.6cqw 4cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4cqw;line-height:1.25;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:92%;width:max-content}
.toast.on{opacity:1}
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:4cqw;text-align:center;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7.6cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2.2cqw 1.4cqw;font-weight:800;font-size:4.2cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:7cqw;width:8cqw;text-align:center;flex:none;line-height:1}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:1cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow)}
.vs{display:flex;align-items:center;justify-content:center;gap:4cqw;font-size:12cqw;font-weight:800}.vs span{font-size:9cqw}
.reward{font-size:20cqw;line-height:1;animation:newpop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes newpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center}
.btnbig{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.skgrid{display:flex;flex-wrap:wrap;justify-content:center;--n:3;--gg:2.4cqw;gap:var(--gg);width:100%}.skgrid>*{flex:0 0 calc((100% - (var(--n) - 1)*var(--gg))/var(--n));min-width:0;box-sizing:border-box}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
.near{margin:0;text-align:center;font:800 4.2cqw/1.25 var(--display);color:var(--accent);padding:1.6cqw 4cqw;border-radius:4cqw;border:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.ib2.hot{animation:hotp 1s ease-in-out infinite}@keyframes hotp{50%{transform:scale(1.1);box-shadow:0 0 0 1.4cqw color-mix(in srgb,var(--accent) 30%,transparent)}}
.cap{margin:0;font-size:3.4cqw;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.ib2.hot{animation:none}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.dc i,.reward,.river::before,.chip2.hint{animation:none}}
</style>

<script>
"use strict";
const $=id=>document.getElementById(id);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LANG=(()=>{const q=new URLSearchParams(location.search).get("lang");if(q==="vi"||q==="en")return q;try{const s=localStorage.getItem("lang");if(s==="vi"||s==="en")return s}catch(e){}return /^vi/i.test(navigator.language||"")?"vi":"en"})();
let RNG=Math.random;const MR=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=(a,b)=>a+Math.floor(RNG()*(b-a+1)),pick=a=>a[Math.floor(RNG()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const track=(f,k)=>{try{fetch("/api/paywall",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({f,k}),keepalive:true}).catch(()=>{})}catch(e){}};
const subUrl=()=>"../../../subscribe.html?from="+encodeURIComponent("popplay/index.html#qua-song")+"&plan=month";
const passToken=()=>{try{const p=JSON.parse(localStorage.getItem("pass"));return p&&p.token}catch(e){return null}};
const LVE=["🌱","🌿","🌳"];

/* ===== BỘ GIẢI ĐỐ (Dijkstra trên (ai ở bờ nào, thuyền ở bờ nào)) — dùng để biết đường ngắn nhất, chấm điểm và gợi ý ===== */
function bankLists(ents,m){const L=[],R=[];for(let i=0;i<ents.length;i++)((m>>i)&1?R:L).push(i);return[L,R]}

function subsets(here,cap){const out=[];const rec=(idx,cur)=>{if(cur.length&&cur.length<=cap)out.push(cur.slice());if(cur.length>=cap)return;for(let i=idx;i<here.length;i++){cur.push(here[i]);rec(i+1,cur);cur.pop()}};rec(0,[]);return out}
const costOf=(P,sub)=>P.mode==="time"?Math.max.apply(null,sub.map(i=>P.ents[i].t)):1;

 while(pq.length){let bi=0;for(let i=1;i<pq.length;i++)if(pq[i][0]<pq[bi][0])bi=i;const [d,s]=pq.splice(bi,1)[0];if(d>dist.get(s))continue;const m=s>>1,b=s&1;
  if(m===full&&b===1){const p=[];let c=s;while(prev.has(c)){const pr=prev.get(c);p.push(pr[1]);c=pr[0]}return{cost:d,path:p.reverse()}}
  const here=[];for(let i=0;i<n;i++)if(((m>>i)&1)===b)here.push(i);
  for(const sub of subsets(here,P.cap)){if(!sub.some(i=>P.ents[i].row))continue;let nm=m;for(const i of sub)nm^=(1<<i);if(!stateOk(P,nm))continue;const ns=key(nm,b^1),nd=d+costOf(P,sub);if(!dist.has(ns)||nd<dist.get(ns)){dist.set(ns,nd);prev.set(ns,[s,sub]);pq.push([nd,ns])}}}
 return null}

    P={ents:e,cap,mode:"moves",bad:L=>{let c=0,x=0;for(const i of L){if(e[i].k==="C")c++;else x++}return c>0&&x>c},why:()=>({k:"w.rule0"})}}

/* ===== NGÔN NGỮ / ÂM THANH ===== */
function applyLang(){
  document.documentElement.lang=LANG;document.title=T("docTitle");$("title").textContent=T("title");$("langBtn").textContent=LANG.toUpperCase();$("langBtn").setAttribute("aria-label",T("lang"));
  $("soundBtn").setAttribute("aria-label",T("sound"));$("homeBtn").setAttribute("aria-label",T("home"));$("homeBtn2").setAttribute("aria-label",T("home"));$("rankBtn").setAttribute("aria-label",T("rank.btn"));
  $("undoBtn").setAttribute("aria-label","↩");$("hintBtn").setAttribute("aria-label","💡");$("goBtn").setAttribute("aria-label","▶");$("resetBtn").setAttribute("aria-label","🔁");syncSound();
  if(!G)renderHome();else{render();updHud();if(G.over)renderEnd()}
}
function syncSound(){$("soundBtn").textContent=sound?"🔊":"🔇"}
$("soundBtn").onclick=()=>{sound=!sound;if(window.NPAudio)NPAudio.set(sound);else if(!sound&&window.speechSynthesis)speechSynthesis.cancel();syncSound()};
$("langBtn").onclick=()=>{LANG=LANG==="vi"?"en":"vi";try{localStorage.setItem("lang",LANG)}catch(e){}applyLang()};
$("homeBtn").onclick=()=>{if(!HELPER)goHome()};
function retry(){if(!G||HELPER)return;begin(G.t,{lv:G.lv,seed:G.seed,daily:G.daily,ch:G.ch})}
$("retryBtn").onclick=retry;
function again(){if(!G)return;if(G.daily)return startDaily();begin(G.t,{lv:G.lv,seed:G.ch?G.seed:undefined,ch:G.ch})}
$("againBtn").onclick=()=>{if(!G)return;if(G.daily)return startDaily();begin(G.t,{lv:G.lv})};
$("shareBtn").onclick=()=>openGate(()=>{showOv("ovEnd");doShare()},"ovEnd","gt.sh");
$("ovEnd").addEventListener("pointerdown",e=>{if(HELPER||e.target.closest("button")||performance.now()-endAt<450)return;$("againBtn").onclick()});
$("homeBtn2").onclick=goHome;
$("rankBtn").onclick=()=>{window.NP&&NP.brag&&NP.brag()};
addEventListener("keydown",e=>{if(G&&G.over&&!HELPER&&(e.key==="Enter"||e.key===" ")&&!e.repeat&&!$("ovEnd").hidden&&performance.now()-endAt>450){e.preventDefault();$("againBtn").onclick()}});
addEventListener("storage",e=>{if(e.key==="theme")document.documentElement.dataset.theme=e.newValue||"light"});

/* ===== CẦU NỐI VỚI TRANG CHA (chơi hộ: tiếp tục đúng các chuyến đã đi) ===== */
if(window.NP){
  NP.state(()=>{if(!G||G.over)return null;const st={t:G.t,lv:G.lv,s:G.seed,mv:G.mv.slice(0,40),u:G.used};
    if(PF.pro&&!PF.pro.trial&&PF.ticket){st.tk=PF.ticket;const sk=PF.skinSel[G.t];if(sk&&sk!=="basic"&&PF.skins[G.t][sk])st.sk=sk}return st});
  NP.onPause(()=>{paused=true;$("play").classList.add("paused");if(window.speechSynthesis)speechSynthesis.cancel()},()=>{paused=false;$("play").classList.remove("paused")});
}
if(passToken()&&!HELPER)PF.loadPro(false).catch(()=>{});
applyLang();goHome();
if(HELPER){const I=(v,a,z)=>HS&&Number.isInteger(v)&&v>=a&&v<=z;
  if(HS&&I(HS.t,0,3)&&I(HS.lv,1,3)&&I(HS.s,0,4294967295)){const go2=()=>{LVL=HS.lv;begin(HS.t,{seed:HS.s,lv:HS.lv});
      if(Array.isArray(HS.mv))for(const sub of HS.mv.slice(0,40)){if(!Array.isArray(sub)||!sub.length||!sub.every(i=>Number.isInteger(i)&&i>=0&&i<G.P.ents.length&&G.side[i]===G.boat))break;G.load=sub.slice();go()}
      render();updHud()},okT=HS.tk&&/^h\.\d{13}\.[\w-]{43}$/.test(HS.tk);
    if(okT)PF.loadPro(false,HS.tk).then(()=>{if(/^[a-z]{3,10}$/.test(HS.sk||"")&&PF.skins[HS.t][HS.sk])PF.skinSel[HS.t]=HS.sk}).catch(()=>{}).finally(go2);else go2()}}
else{CH=parseCh();if(CH)openCh();else if(location.hash==="#daily")startDaily()}
window.QS={drawCard,shareText,shareLink,dailyInfo,parseCh,b64e,startDaily,get CH(){return CH},get G(){return G},begin,goHome,PF,makePuzzle,solveFrom,tapEnt,go,undo,hint,resetPuz,openHow,get prog(){return prog},setLv(n){LVL=n},mask,
  /* bot: chơi trọn ván theo đường ngắn nhất (opt) hoặc làm sai một lần trước */
  bot(o){o=o||{};if(!G)return null;let g=0;if(o.wrongFirst){for(let i=0;i<G.P.ents.length;i++)if(G.side[i]===G.boat){G.load=[i];break}go()}
    while(!G.over&&g++<200){const sol=solveFrom(G.P,mask(),G.boat);if(!sol)break;G.load=sol.path[0].slice();go()}return{score:G.score,stars:G.stars,used:G.used,opt:G.P.opt}}};
</script>
<script src="../../../shared/season.js"></script>
</body>
</html>
