<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../../shared/guard.js"></script>
<script src="../../../shared/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tên Lửa Của Bé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script>var savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
/* Tên Lửa Của Bé — chạy 10 giây, hết nhiên liệu thì trả lời câu hỏi để chạy tiếp. Bé không bao giờ thua. 4 loại: tên lửa / cá con / tàu hỏa / khủng long. Luôn vừa một màn hình. */
:root{--bg:#EAF6FF;--ink:#1f2f4a;--muted:#5d7090;--panel:#fff;--line:#cfe3f5;--accent:#FF5A4D;--on-accent:#fff;--good:#2fbf71;--bad:#e5484d;--warn:#ffb020;--shadow:0 8px 24px rgba(30,60,110,.16);
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;--w:min(calc(100vw - 24px),calc((100dvh - 150px)*.75),520px)}
:root[data-theme="dark"]{--bg:#141b38;--ink:#F2F4FF;--muted:#a9b2d8;--panel:#26305a;--line:#38437a;--accent:#FF7A6B;--on-accent:#2a0a06;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,.tile:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.side{width:var(--w);display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;padding:2px 14px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:22px;font-weight:800;white-space:nowrap}
.hud span{overflow:hidden;text-overflow:ellipsis}
.play{position:relative;width:var(--w);aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);container-type:size;touch-action:none;
  --sb:linear-gradient(#bfe6ff,#e8f6ff);--sp:#fff;--si:#1f2f4a;--sa:#ff5a4d;--sa2:#fff;--rad:5cqw;--bd:.8cqw solid rgba(255,255,255,.9);--sh:0 1cqw 3cqw rgba(0,0,0,.18)}
#home,#run{position:absolute;inset:0}
#home{display:flex;flex-direction:column;gap:2.4cqw;padding:3cqw;background:linear-gradient(#bfe8ff,#e6f6d8)}
.lvs{flex:none;display:flex;gap:2cqw;justify-content:center;align-items:center;background:rgba(255,255,255,.7);border-radius:999px;padding:1.2cqw 2cqw;box-shadow:var(--sh)}
.lvb{flex:1;height:13.6cqw;border-radius:999px;background:transparent;color:#1f2f4a;font-size:6cqw;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1cqw}
.lvb small{font-size:4.2cqw}
.lvb.on{background:var(--accent);color:var(--on-accent);box-shadow:0 .8cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.dbar{flex:none;height:10.4cqw;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7a5cff);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.5cqw;font-weight:800;font-size:4.6cqw;box-shadow:var(--sh)}
.dbar:active{transform:scale(.98)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.6cqw}
.tile{position:relative;border-radius:5cqw;background:var(--sb);color:var(--si);border:var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;padding:1cqw;overflow:hidden;text-align:center;cursor:pointer}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:24cqw;line-height:1}.tile b{font-size:5.4cqw;line-height:1.05;font-weight:800}
.tile .sk{position:absolute;right:1.6cqw;top:1.6cqw;width:13.6cqw;height:13.6cqw;border-radius:50%;background:var(--sp);font-size:6.4cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.tile .sk i{position:absolute;right:-.8cqw;top:-.8cqw;font-size:3cqw;font-style:normal;background:var(--sp);border-radius:50%;line-height:1;padding:.2cqw}
.tile .bd{position:absolute;left:2.4cqw;top:2cqw;font-size:4cqw;font-weight:800;background:var(--sp);border-radius:999px;padding:.4cqw 1.8cqw;box-shadow:var(--sh)}
/* ---- đường chạy ---- */
#run{background:#9ad;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.fuel{position:absolute;left:3cqw;right:3cqw;top:2.6cqw;height:7cqw;border-radius:999px;background:rgba(255,255,255,.82);box-shadow:var(--sh);display:flex;align-items:center;gap:1.6cqw;padding:0 2.4cqw;font-size:4.8cqw;z-index:2;pointer-events:none}
.fuel .fb{flex:1;height:3.4cqw;border-radius:999px;background:rgba(0,0,0,.14);overflow:hidden}
.fuel .fb i{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#ffb020,#2fbf71)}
.fuel.low .fb i{background:#e5484d}.fuel.low{animation:blink .5s infinite alternate}
@keyframes blink{to{background:rgba(255,220,220,.95)}}
.banner{position:absolute;left:50%;top:24cqw;transform:translateX(-50%);z-index:4;padding:1.6cqw 5cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:5.4cqw;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;animation:newpop .5s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
.cmb{position:absolute;right:3cqw;top:12cqw;z-index:4;padding:.8cqw 3.4cqw;border-radius:999px;background:#ff7a1f;color:#fff;font-weight:800;font-size:6cqw;box-shadow:var(--sh);animation:cpop .4s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}.cmb.t1{background:#ff5a4d}.cmb.t2{background:linear-gradient(90deg,#ff5a4d,#ffb020);font-size:7cqw}.cmb.t3{background:linear-gradient(90deg,#ff3ad0,#ffd54a,#3aa8ff);font-size:8cqw}
@keyframes cpop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.qp{position:absolute;left:2.4cqw;right:2.4cqw;bottom:2.4cqw;z-index:5;display:flex;flex-direction:column;gap:2cqw;padding:2.4cqw;border-radius:var(--rad);background:var(--sp);color:var(--si);border:var(--bd);box-shadow:var(--sh);animation:slideup .35s ease-out both}
@keyframes slideup{from{transform:translateY(30cqw);opacity:0}to{transform:none;opacity:1}}
.qm{display:flex;align-items:center;gap:2cqw;min-height:11cqw}
.mc{font-size:9cqw;line-height:1;flex:none}
.mb{flex:1;min-width:0;font-weight:800;font-size:4.4cqw;line-height:1.12;background:color-mix(in srgb,var(--sa) 14%,var(--sp));border-radius:3.4cqw;padding:1.4cqw 2.6cqw}
.mb.h{background:color-mix(in srgb,var(--warn) 30%,var(--sp))}
.ib3{width:13.6cqw;height:13.6cqw;border-radius:50%;background:var(--sa);color:var(--sa2);font-size:5.4cqw;display:grid;place-items:center;flex:none;box-shadow:var(--sh)}
.qbody{display:flex;align-items:center;justify-content:center;min-height:22cqw;text-align:center;font-weight:800;line-height:1.1}
.qbody .pics{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.6cqw 1cqw;max-width:100%}
.qbody .eq{display:flex;align-items:center;justify-content:center;gap:2cqw;flex-wrap:wrap}
.qbody .eq b{font-size:9cqw}
.qbody .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:.4cqw .8cqw;max-width:42cqw}
.qbody .grp.x span:nth-last-child(-n+9){opacity:.28;filter:grayscale(1)}
.qbody .num{font-size:14cqw}.qbody .cap{display:block;font-size:5.4cqw;opacity:.8}.qbody{max-height:34cqw;overflow:hidden}
.qbody .snd{width:20cqw;height:20cqw;border-radius:50%;background:var(--sa);color:var(--sa2);font-size:10cqw;display:grid;place-items:center;box-shadow:var(--sh)}
.qans{display:flex;gap:2.4cqw;justify-content:center}
.qa{flex:1;max-width:30cqw;min-height:19cqw;border-radius:var(--rad);background:var(--sa);color:var(--sa2);font-size:10cqw;font-weight:800;border:var(--bd);box-shadow:var(--sh);padding:0;line-height:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;overflow:hidden}
.qa:active{transform:scale(.95)}
.qa.sm{font-size:5.2cqw}.qa .pics{display:flex;flex-wrap:wrap;gap:0 .2cqw;justify-content:center;max-width:100%;padding:0 1cqw}
.qa.good{background:var(--good)!important;color:#fff!important}
.qa.bad{background:var(--bad)!important;color:#fff!important;opacity:.6;animation:shake .35s}
.qa.pulse{animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 0 1.4cqw rgba(47,191,113,.55)}}
@keyframes shake{20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.4cqw)}80%{transform:translateX(1.4cqw)}}
@keyframes newpop{0%{transform:translateX(-50%) scale(.3);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.cdn{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font-size:55cqw;font-weight:800;color:#fff;background:rgba(20,20,40,.35);text-shadow:0 1cqw 0 rgba(0,0,0,.3);pointer-events:none}
.paused #run{filter:blur(3px);pointer-events:none}
.toast{position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:9;padding:1.2cqw 4cqw;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:800;font-size:4.2cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
/* ---- lớp phủ ---- */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:4cqw;text-align:center;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink)}
.ov h2{margin:0;font-size:7.4cqw;font-weight:800;line-height:1.05}.ov p{margin:0;font-size:4.2cqw;color:var(--muted);font-weight:700}
.hwL{list-style:none;margin:0;padding:1.4cqw 2cqw;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border-radius:5cqw;box-shadow:var(--shadow)}
.hwL li{display:flex;align-items:center;gap:3cqw;padding:2.2cqw 1.4cqw;font-weight:800;font-size:4.4cqw;line-height:1.2;color:var(--ink)}.hwL li+li{border-top:.4cqw dashed var(--line)}.hwL li b{font-size:7cqw;width:8cqw;text-align:center;flex:none;line-height:1}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:1cqw 4cqw;font-weight:800;font-size:4.4cqw;box-shadow:var(--shadow)}
.stk{display:flex;gap:1.2cqw;justify-content:center;flex-wrap:nowrap;width:100%}
.stk span{flex:1;max-width:11cqw;aspect-ratio:1;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:5.6cqw;display:grid;place-items:center;line-height:1}
.stk span.off{filter:grayscale(1);opacity:.35}.stk span.cur{outline:.9cqw solid var(--accent)}
.stats{display:flex;gap:2cqw;justify-content:center;flex-wrap:wrap}
.reward{font-size:24cqw;line-height:1;animation:rpop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.row{display:flex;gap:2.6cqw;flex-wrap:wrap;justify-content:center}
.ib2{width:14cqw;height:14cqw;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:6cqw;display:grid;place-items:center;flex:none}.ib2.main{width:18cqw;height:18cqw;font-size:8cqw;background:var(--accent);color:var(--on-accent)}
.go{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2.6cqw 7cqw;font-size:5.6cqw;font-weight:800;box-shadow:0 1.2cqw 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--panel);color:var(--ink);border-radius:999px;padding:2.2cqw 5cqw;font-size:4.6cqw;font-weight:800;box-shadow:var(--shadow)}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;width:100%}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1cqw;padding:1.6cqw;border-radius:4cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:3.4cqw;font-weight:800;line-height:1.1}
.skc .sw{width:100%;aspect-ratio:4/3;border-radius:3cqw;display:grid;place-items:center;font-size:10cqw}
.skc.on{outline:.9cqw solid var(--accent)}.skc.lock::after{content:"🔒";position:absolute;right:1.6cqw;top:1.6cqw;font-size:4.4cqw;background:var(--panel);border-radius:50%;padding:.4cqw}
.nums{display:flex;gap:3cqw;justify-content:center}.nums button{width:19cqw;height:19cqw;border-radius:5cqw;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-size:9.5cqw;font-weight:800}
.vs{display:flex;align-items:center;justify-content:center;gap:3cqw;font-size:11cqw;font-weight:800}
@media (max-width:360px){.hud{font-size:18px}}
@media (max-height:520px) and (min-aspect-ratio:11/10){
  :root{--w:calc((100dvh - 16px)*.75)}
  .app{flex-direction:row;align-items:center;justify-content:center;gap:14px}
  .side{width:min(300px,calc(100vw - var(--w) - 44px));justify-content:center}
  .top h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.cmb,.reward,.banner,.qp,.qa.pulse,.fuel.low{animation:none}}
/* nút biểu tượng luôn có viền cùng màu biểu tượng để nổi trên mọi nền/giao diện */
.ib,.ib2{border:1.5px solid color-mix(in srgb,currentColor 42%,transparent)!important;box-sizing:border-box}
.ib:not(:disabled),.ib2:not(:disabled){filter:none}
</style>
<script src="../../../shared/offline.js" defer></script>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="top">
      <h1 id="title"></h1>
      <button class="ib" id="homeBtn" type="button" hidden>🏠</button>
      <button class="ib" id="soundBtn" type="button">🔊</button>
      <button class="ib" id="langBtn" type="button" style="font-size:14px;font-weight:800">VI</button>
    </div>
    <div class="hud"><span id="hl"></span><span id="hr"></span></div>
  </div>
  <div class="play" id="play">
    <div id="home"></div>
    <div id="run" hidden>
      <canvas id="cv"></canvas>
      <div class="fuel" id="fuel"><span id="fi">⛽</span><div class="fb"><i id="ff"></i></div></div>
      <div class="banner" id="banner" hidden></div><div class="cmb" id="cmb" hidden></div>
      <div class="qp" id="qp" hidden>
        <div class="qm"><span class="mc" id="mc">🐱‍🚀</span><span class="mb" id="mb"></span><button class="ib3" id="qsay" type="button">🔊</button></div>
        <div class="qbody" id="qbody"></div>
        <div class="qans" id="qans"></div>
      </div>
    </div>
    <div class="cdn" id="cdn" hidden></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="ov" id="ovHow" hidden>
      <h2 id="hwH"></h2><div class="row"><span class="chip" id="hwC"></span><span class="chip" id="hwK"></span></div>
      <ul class="hwL" id="hwL"></ul>
      <div class="stk" id="hwS"></div>
      <div class="row"><button class="ib2" id="hwBack" type="button">←</button><button class="go" id="hwGo" type="button"></button></div>
    </div>
    <div class="ov" id="ovCh" hidden>
      <h2 id="chH"></h2><div class="vs" id="chV"></div><p id="chP"></p>
      <div class="row"><button class="ib2" id="chNo" type="button">✕</button><button class="go" id="chGo" type="button"></button></div>
    </div>
    <div class="ov" id="ovEnd" hidden>
      <h2 id="enH"></h2><div class="reward" id="enR"></div><div class="stk" id="enS"></div><div class="stats" id="enT"></div><p id="enP"></p>
      <div class="row"><button class="ib2 main" id="againBtn" type="button">▶</button><button class="ib2" id="shareBtn" type="button" hidden>📤</button><button class="ib2" id="homeBtn2" type="button">🏠</button><button class="ib2" id="rankBtn" type="button" hidden>🏆</button></div>
    </div>
    <div class="ov" id="ovSkin" hidden>
      <h2 id="skH"></h2><div class="skgrid" id="skGrid"></div><button class="ghost" id="skBack" type="button"></button>
    </div>
    <div class="ov" id="ovPay" hidden>
      <h2 id="pwH"></h2><p id="pwP"></p>
      <div class="row"><button class="go" id="pwGo" type="button"></button></div>
      <div class="row"><button class="ghost" id="pwTrial" type="button"></button><button class="ghost" id="pwLater" type="button"></button></div>
    </div>
    <div class="ov" id="ovGate" hidden>
      <h2 id="gtH"></h2><p id="gtP"></p><div class="nums" id="gtNums"></div><button class="ghost" id="gtX" type="button"></button>
    </div>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const GID="ten-lua-cua-be";
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LANG=(()=>{const q=new URLSearchParams(location.search).get("lang");if(q==="vi"||q==="en")return q;try{const s=localStorage.getItem("lang");if(s==="vi"||s==="en")return s}catch(e){}return /^vi/i.test(navigator.language||"")?"vi":"en"})();
let RNG=Math.random;const MR=Math.random;   /* RNG: bộ ngẫu nhiên của câu hỏi + đường chạy — đặt theo hạt giống; MR (Math.random) chỉ dùng cho hiệu ứng thẩm mỹ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sub32=(seed,n)=>(seed^Math.imul(n+1,2654435761))>>>0;
const rand=(a,b)=>a+Math.floor(RNG()*(b-a+1)),pick=a=>a[Math.floor(RNG()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const track=(f,k)=>{try{fetch("/api/paywall",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({f,k}),keepalive:true}).catch(()=>{})}catch(e){}};
const subUrl=()=>"../../../subscribe.html?from="+encodeURIComponent("popplay/index.html#"+GID)+"&plan=month";
const passToken=()=>{try{const p=JSON.parse(localStorage.getItem("pass"));return p&&p.token}catch(e){return null}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ===== NGÔN NGỮ ===== */
const I18N={
vi:{title:"Tên Lửa Của Bé",docTitle:"Tên Lửa Của Bé",sound:"Âm thanh",lang:"Ngôn ngữ",home:"Về màn chọn",

    if(obs)ents.push({at:tt,lane,k:"o",v:Math.floor(c*3)});
    if(d<.85||obs){const sl=obs?(G.t===3?lane:1-lane):(c<.5?0:1);ents.push({at:tt+(G.t===3&&obs?0:.0),lane:sl,k:"s",air:G.t===3&&obs})}
    tt+=Math.max(G.t===3?1.3:0,cf.iv*(.85+.3*((a*7.13)%1)))}
  RNG=MR;return ents}

}
function worldGround(c,sk,W,H){

   c.fillStyle=sk.gnd[1];c.fillRect(0,458,360,H+200);
   c.fillStyle="rgba(255,255,255,.35)";for(let i=0;i<8;i++){const u=((W.tt*.25+i*.131)%1);c.beginPath();c.arc((i*71+W.sc*0)%360,470-u*470,3+(i%3)*2,0,7);c.fill()}}
  else if(G.t===2){c.fillStyle="rgba(0,0,0,.12)";for(let i=0;i<4;i++){const x=360-(((W.sc*.2)+i*130)%520)+40;c.beginPath();c.moveTo(x-90,270);c.quadraticCurveTo(x,170+i*14,x+90,270);c.fill()}
   c.fillStyle=sk.gnd[0];c.fillRect(0,278,360,H+300);c.fillStyle=sk.gnd[1];c.fillRect(0,278,360,5);
   for(const ly of [CFG[2].l0,CFG[2].l1]){c.fillStyle="#6b4f34";for(let x=-((W.sc*1)%26);x<360;x+=26)c.fillRect(x,ly+2,12,7);LN(c,0,ly+1,360,ly+1,3,"#cfd3d8");LN(c,0,ly+9,360,ly+9,3,"#9aa0a8")}}
  else if(G.t===3){const gy=CFG[3].gy;c.fillStyle="rgba(0,0,0,.10)";for(let i=0;i<4;i++){const x=360-(((W.sc*.25)+i*140)%560)+60;c.beginPath();c.moveTo(x-100,gy);c.quadraticCurveTo(x,gy-110-i*10,x+100,gy);c.fill()}
   c.fillStyle=sk.gnd[0];c.fillRect(0,gy,360,H+300);c.fillStyle=sk.gnd[1];c.fillRect(0,gy,360,6);c.fillStyle="rgba(0,0,0,.18)";for(let x=-((W.sc*1)%40);x<360;x+=40)c.fillRect(x,gy+16+((x/40|0)%3)*10,14,4)}

const fetchT=(u,o,ms)=>{const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({signal:c.signal},o)).finally(()=>clearTimeout(id))};
PF.loadPro=async function(trial,ticket){
  const tk=ticket||passToken(),cacheable=!trial&&!ticket;let src=null,r=null;
  try{r=await fetchT("/api/pro/"+GID+".js"+(trial?"?trial=1":""),{headers:tk?{Authorization:"Bearer "+tk}:{},cache:"no-store"},8000)}catch(e){r=null}
  if(r&&r.ok){src=await r.text();if(cacheable)LS.set("tl-pro-src",{src})}
  else{
    if(r&&r.status>=400&&r.status<500&&r.status!==429){if(r.status===401&&cacheable)try{localStorage.removeItem("tl-pro-src")}catch(e){}throw new Error("pro_"+r.status)}
    const c=cacheable?LS.get("tl-pro-src",null):null,p=LS.get("pass",null);
    if(c&&c.src&&p&&p.exp&&new Date(p.exp)>new Date())src=c.src;else throw new Error("pro_offline");
  }
  new Function("PF",src)(PF);if(PF.pro&&!PF.pro.trial){const ad=LS.get("tl-auto",[]);let ch=0;for(let t=0;t<4;t++)if(!ad[t]){ad[t]=1;ch=1;if(PF.skinSel[t]==="basic"){const f=Object.keys(PF.skins[t]).find(i=>i!=="basic");if(f)PF.skinSel[t]=f}}if(ch){LS.set("tl-auto",ad);LS.set("tl-skin",PF.skinSel)}}if(!G&&!$("home").hidden)renderHome();if(cacheable)PF.fetchTicket();
};
PF.fetchTicket=function(){const tk=passToken();if(!tk||HELPER||!PF.pro||PF.pro.trial)return;fetchT("/api/pro/ticket",{method:"POST",headers:{Authorization:"Bearer "+tk},cache:"no-store"},6000).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ticket){PF.ticket=j.ticket;PF.ticketAt=Date.now()}}).catch(()=>{})};
addEventListener("online",()=>{if(!PF.ticket)PF.fetchTicket()});setInterval(()=>{if(PF.pro&&!PF.pro.trial&&(!PF.ticket||Date.now()-(PF.ticketAt||0)>20*36e5))PF.fetchTicket()},60000);

 get prog(){return DEST},setLv(n){LVL=n},openHow,
 solve(){if(G&&G.W.ph==="ask"&&!G.qOk)answer(G.q.a)},wrong(){if(G&&G.W.ph==="ask"&&!G.qOk){const i=G.q.opts.findIndex((_,k)=>k!==G.q.a&&!G.qdis.has(k));answer(i)}},
 auto(on){if(G)G.auto=on!==false},

 trace(){const W=G.W;return JSON.stringify([G.qi,Math.round(G.alt*100),G.stars,G.hits,W.ents.map(e=>[e.at.toFixed(3),e.lane,e.k].join()).join("|")])}};
