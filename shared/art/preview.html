<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xem thử linh vật</title>
<style>
body{margin:0;font:600 13px/1.3 system-ui,sans-serif;background:#0E1020;color:#fff;padding:12px}
h2{margin:18px 0 8px;font-size:16px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{border-radius:16px;padding:8px;text-align:center}.dk{background:linear-gradient(165deg,#2b2064,#171236)}.lt{background:linear-gradient(165deg,#ffe3d1,#ffd9a0);color:#2a2350}
.cell svg{width:100%;max-width:180px;height:auto}.sm{display:flex;gap:6px;justify-content:center;align-items:flex-end;margin-top:4px}.sm svg{width:auto}
.nm{margin-top:4px;opacity:.85}
</style></head><body>
<script>
var SK=[["default","Mặc định (miễn phí)"],["badge","Huy hiệu"],["group","Nhóm"],["night","Dạ quang"],["star","Siêu sao"]],N=0;
function inline(txt,skin){var k=++N;txt=txt.replace(/id="([a-zA-Z0-9_-]+)"/g,function(m,i){return 'id="'+i+'-'+k+'"'}).replace(/url\(#([a-zA-Z0-9_-]+)\)/g,function(m,i){return 'url(#'+i+'-'+k+')'});return txt.replace('sk-default','sk-'+skin)}
var q=new URLSearchParams(location.search),files=(q.get("m")||"mascot-pop-pop-fly.svg,mascot-night-xin-nghi.svg").split(",");
files.forEach(function(f){fetch(f).then(function(r){return r.text()}).then(function(t){
 var h=document.createElement("h2");h.textContent=f;document.body.appendChild(h);
 ["dk","lt"].forEach(function(bg){var row=document.createElement("div");row.className="row";SK.forEach(function(s){var c=document.createElement("div");c.className="cell "+bg;c.innerHTML=inline(t,s[0])+'<div class="sm">'+inline(t,s[0]).replace('<svg','<svg width="96" height="96"')+inline(t,s[0]).replace('<svg','<svg width="40" height="40"')+'</div><div class="nm">'+s[1]+'</div>';row.appendChild(c)});document.body.appendChild(row)})})});
</script></body></html>
