<script>
const F=["math","vietnamese","english"],N={math:"Mochi · Toán",vietnamese:"Mầm · Tiếng Việt",english:"Bibi · Tiếng Anh"};
for(const t of ["light","dark"]){const d=document.createElement("div");d.className=t==="dark"?"dark":"";
 d.innerHTML=`<h2>${t==="dark"?"Nền tối":"Nền sáng"}</h2>`;
 for(const sz of [48,96,200]){const r=document.createElement("div");r.className="row";
  for(const f of F){r.innerHTML+=`<div class="c"><img src="mascot-pop-learn-${f}.svg" width="${sz}" height="${sz}" alt=""><small>${N[f]} · ${sz}px</small></div>`}
  d.appendChild(r)}
 document.body.appendChild(d)}
</script>
