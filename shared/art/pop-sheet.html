<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duyệt linh vật Pop Play (bản mặc định)</title>
<style>body{margin:0;background:#171236;color:#fff;font:700 13px system-ui,sans-serif;padding:14px}h1{font-size:18px;margin:0 0 10px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{border-radius:22px;padding:10px 8px 12px;text-align:center;background:linear-gradient(165deg,#2b2064,#171236 80%);border:1.5px solid rgba(170,150,255,.5)}.c svg{width:100%;max-width:200px;height:auto;display:block;margin:0 auto}.n{font-size:15px;font-weight:900;margin-top:4px}.h{opacity:.75;font-size:12px;margin-top:2px}.s{display:flex;gap:6px;justify-content:center;margin-top:6px;align-items:flex-end}.s svg{width:auto}@media(max-width:700px){.g{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<h1>Linh vật Pop Play còn lại — bản MẶC ĐỊNH (chờ duyệt)</h1><div class="g" id="g"></div>
<script>
var L=[["pop-fly","Chim Bay Học Vui","Chim Non Bi (đã duyệt)"],["ten-lua-cua-be","Tên Lửa Của Bé","Phi công Mi"],["be-noi-dung-khong","Bé Nói Đúng Không?","Vẹt Lém Lỉnh"],["doan-tuoi-nao","Đoán Xem Bé Mấy Tuổi","Cú Thông Thái"],["bo-me-5-giay","Bố Mẹ Thử Thách 5 Giây","Bố Mẹ vui tính"],["con-vat-an-so","Con Vật Ăn Số","Cá Sấu Háu Ăn"],["ve-chu-quai-vat","Vẽ Chữ Thành Quái Vật","Quái vật Nét Mực"],["nhay-theo-so","Nhảy Theo Số","Vũ công Nhịp"],["be-dau-bo-me","Bé Đấu Bố Mẹ","Võ sĩ nhí"],["qua-song","Qua Sông Cùng Bé","Bác nông dân"],["thap-vong-mau","Tháp Vòng Màu","Thợ xếp tháp"],["lang-cua-be","Làng Của Bé","Bé Trưởng Làng"]],N=0;
L.forEach(function(x){fetch("mascot-pop-"+x[0]+".svg").then(function(r){return r.text()}).then(function(t){var k=++N;t=t.replace(/id="([a-zA-Z0-9_-]+)"/g,function(m,i){return 'id="'+i+'-'+k+'"'}).replace(/url\(#([a-zA-Z0-9_-]+)\)/g,function(m,i){return "url(#"+i+"-"+k+")"});var d=document.createElement("div");d.className="c";d.style.order=L.indexOf(x);d.innerHTML=t+'<div class="n">'+x[1]+'</div><div class="h">'+x[2]+'</div><div class="s">'+t.replace(/id="([a-zA-Z0-9_-]+)"/g,function(m,i){return 'id="'+i+'-s'+k+'"'}).replace(/url\(#([a-zA-Z0-9_-]+)\)/g,function(m,i){return "url(#"+i+"-s"+k+")"}).replace("<svg ",'<svg width="40" height="40" ')+"</div>";document.getElementById("g").appendChild(d)})});
</script></body></html>
