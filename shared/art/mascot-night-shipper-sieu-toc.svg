<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Shipper Siêu Tốc" class="np-mascot sk-default" data-style="night" data-game="shipper-sieu-toc">
<title>Corgi Giao Hàng — Shipper Siêu Tốc</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (háo hức cười tươi) + một chân mày nhướn, vệt trắng hình tia chớp giữa trán. Đạo cụ nhận diện game (luôn có): thùng hàng SHIP + mũ bảo hiểm xanh. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="shipper-sieu-toc"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#FF9A3C;--p2:#E86A1A;--pa:#2DD4A8;--pb:#FFFFFF;--face:#FFF1DC;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(8 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="156" rx="82" ry="72"/><path d="M52 90L40 20L106 62ZM204 90L216 20L150 62Z"/></g>
<g id="body"><path d="M56 100L42 24L108 66ZM200 100L214 24L148 66Z" fill="var(--c1)"/><path d="M62 90L54 44L92 68ZM194 90L202 44L164 68Z" fill="#FFB3A0" stroke="none"/><ellipse cx="128" cy="158" rx="78" ry="68" fill="var(--c1)"/><path d="M96 96L128 96L148 96L168 150Q128 200 88 150Z" fill="#fff" stroke="none"/><ellipse cx="128" cy="164" rx="40" ry="30" fill="#fff" stroke="none"/><ellipse cx="128" cy="150" rx="9" ry="7" fill="var(--ink)" stroke-width="3"/><path d="M82 82Q84 40 128 38Q172 40 174 82Z" fill="var(--c3)" stroke-width="5"/><path d="M84 74H172" stroke="#fff" stroke-width="6" fill="none"/><path d="M100 224v12M156 224v12" fill="none" stroke-width="7"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="116" r="12" fill="#fff" stroke-width="4"/><circle cx="102" cy="115" r="5" fill="var(--ink)" stroke="none"/><circle cx="104" cy="113" r="2" fill="#fff" stroke="none"/><circle cx="154" cy="116" r="12" fill="#fff" stroke-width="4"/><circle cx="154" cy="115" r="5" fill="var(--ink)" stroke="none"/><circle cx="156" cy="113" r="2" fill="#fff" stroke="none"/><path d="M92 94L112 90" fill="none" stroke-width="5"/><path d="M144 90L164 94" fill="none" stroke-width="5"/></g><g id="mouthg"><path id="mouth" class="m-talk" d="M108 154Q128 190 148 154Z" fill="var(--ink)" stroke-width="4.5"/><path d="M114 156H142V163H114Z" fill="#fff" stroke="none"/></g><path id="mark" d="M132 84L120 100H130L124 112L138 94H128Z" fill="var(--c1)" stroke-width="2.5"/></g>
<g fill="none" stroke-width="5"><path d="M36 150h-28M42 168h-34M36 186h-24" stroke="var(--c4)"/></g><g id="sign"><rect x="178" y="170" width="62" height="52" rx="8" fill="#E3B27A" stroke-width="5"/><path d="M178 190H240" stroke-width="4" fill="none"/><text x="209" y="214" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="14" fill="var(--ink)" stroke="none">SHIP</text></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
