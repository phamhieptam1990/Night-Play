<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Mê Cung Truyền Tay" class="np-mascot sk-default" data-style="night" data-game="me-cung-truyen-tay">
<title>Chuột Lạc Đường — Mê Cung Truyền Tay</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt lim dim nửa mở, một chân mày nhướn, nhếch mép một bên, chiếc răng cửa nhỏ nhô ra. Đạo cụ nhận diện game (luôn có): miếng phô mai có lỗ hình mê cung. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="me-cung-truyen-tay"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#B8BCC8;--p2:#8A8FA0;--pa:#FF9EB5;--pb:#FFD84A;--face:#F1F2F6;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="150" rx="78" ry="74"/><circle cx="66" cy="62" r="36"/><circle cx="190" cy="62" r="36"/></g>
<g id="body"><circle cx="64" cy="64" r="34" fill="var(--c1)"/><circle cx="64" cy="64" r="20" fill="var(--c3)" stroke="none"/><circle cx="192" cy="64" r="34" fill="var(--c1)"/><circle cx="192" cy="64" r="20" fill="var(--c3)" stroke="none"/><ellipse cx="128" cy="152" rx="74" ry="70" fill="var(--c1)"/><ellipse cx="128" cy="184" rx="42" ry="32" fill="var(--face)" stroke-width="4"/><path d="M224 200Q252 180 238 150" fill="none" stroke-width="8" stroke-linecap="round"/><path d="M224 200Q252 180 238 150" fill="none" stroke="var(--c3)" stroke-width="3" stroke-linecap="round"/><ellipse cx="128" cy="140" rx="7" ry="5" fill="var(--c3)" stroke-width="3"/><path d="M100 224v12M156 224v12" fill="none" stroke-width="7"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="102" cy="114" rx="9" ry="10" fill="var(--ink)" stroke="none"/><ellipse cx="154" cy="114" rx="9" ry="10" fill="var(--ink)" stroke="none"/><circle cx="105" cy="111" r="3" fill="#fff" stroke="none"/><circle cx="157" cy="111" r="3" fill="#fff" stroke="none"/><rect x="91" y="102" width="22" height="10" fill="var(--c1)" stroke="none"/><rect x="143" y="102" width="22" height="10" fill="var(--c1)" stroke="none"/></g><path d="M92 99H111M143 99L165 92" fill="none" stroke-width="4.5"/><path id="mouth" class="m-talk" d="M115 144Q132 154 146 136M146 136l5 -3" fill="none" stroke-width="4"/><rect id="mark" x="124" y="156" width="9" height="11" rx="2" fill="#fff" stroke-width="2.5"/></g>
<g id="sign"><path d="M176 218L246 196V232Z" fill="var(--c4)" stroke-width="5"/><path d="M190 222V212H204V220H216V208H228" fill="none" stroke-width="3.5"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
