<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Chim Bay" class="np-mascot sk-default" data-style="pop" data-game="pop-fly">
<title>Chim Non Bi — Chim Bay Học Vui</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to có hai chấm sáng, mỏ cam nhỏ, má hồng, sao vàng nhỏ trên má trái. Đạo cụ nhận diện game (luôn có): đôi cánh xòe + hai thẻ chữ cái A và B bay quanh. Dáng thân đổi ở Dạ quang (cú dẹt, sừng lông) và Siêu sao (áo choàng, đuôi cầu vồng).</desc>
<style>
/* THEME (8 bộ Night Pass) đặt bảng gốc --p1 (thân sáng) --p2 (thân đậm) --pst (viền) --pa (màu nhấn); SKIN biến đổi bảng đó. Không theme: bảng mặc định bên dưới. */
.np-mascot{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#8EE0EE;--p2:#4DB5D1;--pst:#2F8DB0;--pa:#FF6B6B;--belly:#FFF3D4;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--beak:#FFA94D;--beakd:#E8862A;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst);--a:var(--pa);--ax:color-mix(in srgb,var(--a) 85%,#fff)}
.np-mascot.sk-night{--c1:color-mix(in srgb,var(--p1) 62%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a);--belly:#E8E4FF}
.np-mascot.sk-star{--c1:color-mix(in srgb,var(--p1) 68%,#fff);--c2:color-mix(in srgb,var(--p2) 82%,#fff);--st:var(--pst);--belly:#FFF8E0}
.acc,.fx,.shp{display:none}
.sk-default .shp-def,.sk-badge .shp-def,.sk-group .shp-def,.sk-night .shp-night,.sk-star .shp-def{display:inline}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}
.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}
.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}
.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}
@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><g opacity=".95"><ellipse cx="128" cy="46" rx="14" ry="44" transform="rotate(-60 128 110)" fill="#FF6B6B"/><ellipse cx="128" cy="46" rx="14" ry="44" transform="rotate(-30 128 110)" fill="var(--beak)"/><ellipse cx="128" cy="46" rx="14" ry="44" fill="#FFD43B"/><ellipse cx="128" cy="46" rx="14" ry="44" transform="rotate(30 128 110)" fill="#51CF66"/><ellipse cx="128" cy="46" rx="14" ry="44" transform="rotate(60 128 110)" fill="#4DABF7"/></g><path d="M58 104Q36 170 66 228L128 216L190 228Q220 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="wings"><ellipse cx="38" cy="122" rx="17" ry="36" transform="rotate(-38 38 122)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="218" cy="122" rx="17" ry="36" transform="rotate(38 218 122)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><path d="M24 96Q20 112 30 126M232 96Q236 112 226 126" fill="none" stroke="var(--st)" stroke-width="3" stroke-linecap="round" opacity=".6"/></g>
<g id="body"><g class="shp shp-def"><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="128" cy="174" rx="50" ry="38" fill="var(--belly)"/><ellipse cx="98" cy="86" rx="26" ry="12" transform="rotate(-24 98 86)" fill="var(--hl)" opacity=".55"/><ellipse cx="106" cy="223" rx="14" ry="7" fill="var(--beak)" stroke="var(--beakd)" stroke-width="3"/><ellipse cx="150" cy="223" rx="14" ry="7" fill="var(--beak)" stroke="var(--beakd)" stroke-width="3"/><path d="M120 62Q118 44 128 38Q126 52 134 60M134 60Q142 50 150 54" fill="none" stroke="var(--st)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="shp shp-night"><ellipse cx="128" cy="150" rx="98" ry="70" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="128" cy="180" rx="60" ry="32" fill="var(--belly)"/><path d="M96 164q8 6 16 0M120 168q8 6 16 0M144 164q8 6 16 0" fill="none" stroke="var(--st)" stroke-width="3" opacity=".5" stroke-linecap="round"/><ellipse cx="98" cy="100" rx="28" ry="11" transform="rotate(-18 98 100)" fill="var(--hl)" opacity=".4"/><ellipse cx="106" cy="223" rx="15" ry="7" fill="var(--beak)" stroke="var(--beakd)" stroke-width="3"/><ellipse cx="150" cy="223" rx="15" ry="7" fill="var(--beak)" stroke="var(--beakd)" stroke-width="3"/></g>
<path class="rim" d="M50 124Q54 72 100 56" fill="none" stroke="var(--bgx)" stroke-width="4" stroke-linecap="round" opacity=".7"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g>
<g id="blush"><ellipse cx="80" cy="136" rx="11" ry="7" fill="var(--bl)" opacity=".7"/><ellipse cx="176" cy="136" rx="11" ry="7" fill="var(--bl)" opacity=".7"/></g>
<path id="mark" d="M78 118l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#FFD43B" stroke="#E8A317" stroke-width="1.6" stroke-linejoin="round"/>
<path id="beak" d="M113 138Q128 126 143 138Q128 160 113 138Z" fill="var(--beak)" stroke="var(--beakd)" stroke-width="3" stroke-linejoin="round"/></g>
<g id="sign"><g transform="rotate(12 214 62)"><rect x="196" y="44" width="36" height="36" rx="10" fill="#fff" stroke="var(--st)" stroke-width="3"/><path d="M205 71L214 51L223 71M209 64H219" fill="none" stroke="var(--ax)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(-10 40 54)"><rect x="22" y="36" width="36" height="36" rx="10" fill="#fff" stroke="var(--st)" stroke-width="3"/><path d="M33 63V45M33 45H40Q47 45 47 51Q47 55 40 55H33M40 55Q48 55 48 60Q48 63 40 63H33" fill="none" stroke="var(--ax)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="acc-badge" class="acc acc-badge"><path d="M82 80Q84 30 128 28Q172 30 174 80Q150 68 128 68Q106 68 82 80Z" fill="#B9854F" stroke="#7A4E2D" stroke-width="3" stroke-linejoin="round"/><ellipse cx="84" cy="94" rx="10" ry="16" fill="#B9854F" stroke="#7A4E2D" stroke-width="3"/><ellipse cx="172" cy="94" rx="10" ry="16" fill="#B9854F" stroke="#7A4E2D" stroke-width="3"/><circle cx="112" cy="54" r="11" fill="#8FE3FF" fill-opacity=".85" stroke="#7A4E2D" stroke-width="4"/><circle cx="144" cy="54" r="11" fill="#8FE3FF" fill-opacity=".85" stroke="#7A4E2D" stroke-width="4"/><path d="M123 54H133" stroke="#7A4E2D" stroke-width="4"/><path d="M84 176Q128 198 172 176L174 190Q128 212 82 190Z" fill="var(--ax)" stroke="#D94A4A" stroke-width="3" stroke-linejoin="round"/><path d="M168 186Q202 176 216 198Q198 198 172 202Z" fill="var(--ax)" stroke="#D94A4A" stroke-width="3" stroke-linejoin="round"/><path d="M110 212Q119 202 128 209Q137 202 146 212Q137 217 128 214Q119 217 110 212Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><path d="M22 196L70 180L54 208L49 195Z" fill="#fff" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M49 195L70 180" stroke="var(--st)" stroke-width="3"/></g>
<g id="acc-group" class="acc acc-group"><circle cx="100" cy="112" r="20" fill="none" stroke="#5A4630" stroke-width="4"/><circle cx="156" cy="112" r="20" fill="none" stroke="#5A4630" stroke-width="4"/><path d="M120 110H136M80 106L68 100M176 106L188 100" stroke="#5A4630" stroke-width="4" stroke-linecap="round"/><g transform="rotate(32 160 60)"><rect x="152" y="30" width="12" height="46" rx="3" fill="#FFD43B" stroke="#E8A317" stroke-width="3"/><path d="M152 76L158 90L164 76Z" fill="#FFE6C7" stroke="#E8A317" stroke-width="2.5" stroke-linejoin="round"/><rect x="152" y="26" width="12" height="8" rx="3" fill="#FF9DB0" stroke="#E8A317" stroke-width="2.5"/></g><path d="M82 172L172 216" stroke="#8A5A33" stroke-width="8" stroke-linecap="round"/><rect x="170" y="184" width="38" height="34" rx="9" fill="#C98A4B" stroke="#8A5A33" stroke-width="3"/><path d="M170 196H208" stroke="#8A5A33" stroke-width="3"/><circle cx="189" cy="200" r="3.5" fill="#FFD43B"/><path d="M16 192Q36 182 52 194V218Q36 208 16 218ZM52 194Q68 182 88 192V216Q68 208 52 218Z" fill="#fff" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M52 194V218M24 200Q36 196 46 202M60 202Q72 196 82 200" fill="none" stroke="var(--ax)" stroke-width="2.5" stroke-linecap="round"/></g>
<g id="acc-night" class="acc acc-night"><path d="M78 88L66 44L104 74Z" fill="var(--c2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M178 88L190 44L152 74Z" fill="var(--c2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M140 22A19 19 0 1 0 140 62A15 15 0 1 1 140 22Z" fill="#FFE08A" stroke="#E0A02E" stroke-width="2.5" stroke-linejoin="round"/><circle cx="46" cy="188" r="30" fill="var(--bgx)" opacity=".28"/><path d="M38 174Q46 164 54 174" fill="none" stroke="#C98A1B" stroke-width="4" stroke-linecap="round"/><rect x="33" y="176" width="26" height="32" rx="9" fill="#FFD27A" stroke="#C98A1B" stroke-width="3.5"/><path d="M40 184V202M52 184V202" stroke="#C98A1B" stroke-width="2.5"/></g>
<g id="acc-star" class="acc acc-star"><path d="M92 74L100 40L116 58L128 32L140 58L156 40L164 74Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="60" r="4" fill="#FF6B6B"/><circle cx="106" cy="64" r="3" fill="#4DABF7"/><circle cx="150" cy="64" r="3" fill="#51CF66"/><rect x="204" y="160" width="6" height="56" rx="3" transform="rotate(10 207 188)" fill="#FFD43B" stroke="#E8A317" stroke-width="2.5"/><path d="M222 128l4.4 9 10 1.4-7.2 7 1.7 9.9-8.9-4.7-8.9 4.7 1.7-9.9-7.2-7 10-1.4z" fill="#FFD43B" stroke="#E8A317" stroke-width="2.5" stroke-linejoin="round"/></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g>
<g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
