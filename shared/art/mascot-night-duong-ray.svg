<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đường Ray" class="np-mascot sk-default" data-style="night" data-game="duong-ray">
<title>Đầu Tàu Tèo — Đường Ray</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (cau có hét chạy hết tốc lực) + một chân mày nhướn, vệt than đen trên má trái. Đạo cụ nhận diện game (luôn có): đoạn đường ray dưới chân + khói ống. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="duong-ray"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#E94B4B;--p2:#9C2A2A;--pa:#4FD1C5;--pb:#FFD93D;--face:#FFE9D6;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--face)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(3 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><rect x="50" y="76" width="156" height="140" rx="26"/><rect x="92" y="34" width="40" height="46" rx="8"/></g>
<g id="body"><rect x="90" y="30" width="44" height="50" rx="8" fill="var(--c2)"/><path d="M82 34H142" stroke="var(--c4)" stroke-width="9" fill="none"/><rect x="46" y="70" width="164" height="146" rx="26" fill="var(--c1)"/><rect x="46" y="170" width="164" height="30" rx="8" fill="var(--c2)"/><rect x="72" y="84" width="112" height="76" rx="18" fill="var(--face)" stroke-width="4"/><circle cx="82" cy="212" r="20" fill="#3A3A52" stroke-width="5"/><circle cx="174" cy="212" r="20" fill="#3A3A52" stroke-width="5"/><circle cx="82" cy="212" r="7" fill="var(--c4)" stroke-width="3"/><circle cx="174" cy="212" r="7" fill="var(--c4)" stroke-width="3"/><path d="M40 190H20L34 214H52" fill="var(--c4)" stroke-width="4"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="106" cy="118" r="11" fill="#fff" stroke-width="4"/><circle cx="107" cy="119" r="5" fill="var(--ink)" stroke="none"/><circle cx="109" cy="117" r="2" fill="#fff" stroke="none"/><circle cx="150" cy="118" r="11" fill="#fff" stroke-width="4"/><circle cx="151" cy="119" r="5" fill="var(--ink)" stroke="none"/><circle cx="153" cy="117" r="2" fill="#fff" stroke="none"/><path d="M94 96L114 103" fill="none" stroke-width="5"/><path d="M142 103L162 96" fill="none" stroke-width="5"/></g><g id="mouthg"><path id="mouth" class="m-talk" d="M110 144Q128 136 146 144Q142 174 128 174Q114 174 110 144Z" fill="var(--ink)" stroke-width="4.5"/><path d="M118 160Q128 152 138 160Q128 172 118 160Z" fill="#FF6F91" stroke="none"/></g><path id="mark" d="M80 132q8-6 14 0q-2 8-14 6z" fill="var(--ink)" stroke="none" opacity=".75"/></g>
<g fill="none" stroke-width="5"><path d="M40 120h-28M46 138h-34M40 156h-24" stroke="var(--c4)"/></g><g id="sign"><path d="M16 236H240" stroke-width="9" fill="none" stroke="var(--c4)"/><path d="M16 236H240" stroke-width="2" fill="none"/><path d="M40 230V244M80 230V244M120 230V244M160 230V244M200 230V244" stroke-width="5" fill="none"/><circle cx="96" cy="20" r="10" fill="#fff" stroke-width="4"/><circle cx="116" cy="10" r="7" fill="#fff" stroke-width="4"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
