<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bé Đấu Bố Mẹ" class="np-mascot sk-default" data-style="pop" data-game="be-dau-bo-me">
<title>Hổ con Võ sĩ — Bé Đấu Bố Mẹ</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, miếng dán băng cá nhân trên má trái. Đạo cụ nhận diện game (luôn có): găng đấm đỏ + huy hiệu VS. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="be-dau-bo-me"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#FFB24A;--p2:#FF8A1F;--pst:#C25A0A;--k1:var(--pa,#E8454F);--k2:var(--pb,#FFD43B);--bell:#FFF1D6;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="be-dau-bo-me"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="be-dau-bo-me"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M80 130Q128 150 176 130" fill="none" stroke="#fff" stroke-width="4" opacity=".6" stroke-linecap="round"/></g>
<g id="body"><circle cx="64" cy="64" r="24" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><circle cx="64" cy="64" r="13.200000000000001" fill="#FFE0B0"/><circle cx="192" cy="64" r="24" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><circle cx="192" cy="64" r="13.200000000000001" fill="#FFE0B0"/><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><ellipse cx="128" cy="184" rx="50" ry="36" fill="var(--bell)"/><g fill="none" stroke="#5A2A0A" stroke-width="6" stroke-linecap="round"><path d="M52 112l16 6M50 134l18 2M204 112l-16 6M206 134l-18 2M118 56l6 18M138 56l-6 18"/></g><ellipse cx="128" cy="146" rx="32" ry="22" fill="#FFF1D6"/><path d="M60 92Q128 66 196 92Q128 80 60 92Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M196 88q22 6 30 26q-14-6-24-6Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><g fill="var(--k1)" stroke="var(--st)" stroke-width="3"><rect x="18" y="146" width="54" height="50" rx="24"/><rect x="184" y="146" width="54" height="50" rx="24"/></g><path d="M30 160q10-6 22 0M196 160q10-6 22 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><g id="mark" transform="rotate(-24 82 140)"><rect x="70" y="134" width="26" height="12" rx="6" fill="#FFE2C8" stroke="#D8A878" stroke-width="2"/><path d="M80 134v12M86 134v12" stroke="#D8A878" stroke-width="1.6"/></g><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><path id="nose" d="M120 134Q128 129 136 134Q128 144 120 134Z" fill="#E8454F"/></g>
<g id="sign"><path d="M128 178L152 186V208Q152 224 128 232Q104 224 104 208V186Z" fill="#fff" stroke="#8E9BB8" stroke-width="3" stroke-linejoin="round"/><text x="128" y="214" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="17" fill="#E8454F">VS</text></g>
<g id="acc-badge" class="acc acc-badge"><rect x="74" y="190" width="108" height="26" rx="8" fill="#FFD43B" stroke="#C89A0A" stroke-width="3"/><path d="M74 196h108M74 210h108" stroke="#E8A317" stroke-width="2.5"/><circle cx="128" cy="203" r="15" fill="#E8454F" stroke="#B02A32" stroke-width="3"/><path d="M128 195l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#fff"/><path d="M26 82L40 100L54 82Z" fill="#FF6B6B"/><circle cx="40" cy="102" r="11" fill="#FFD43B" stroke="#E8A317" stroke-width="3"/><path d="M40 95l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#fff"/></g><g id="acc-group" class="acc acc-group"><path d="M96 176L128 204L160 176" fill="#fff" stroke="#C8CEDA" stroke-width="3" stroke-linejoin="round"/><rect x="82" y="198" width="92" height="14" rx="7" fill="#2A2A38" stroke="#000" stroke-width="2.5"/><path d="M120 212L110 232M136 212L146 232" stroke="#2A2A38" stroke-width="8" stroke-linecap="round"/><path d="M64 96Q128 74 192 96" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="128" cy="82" r="6" fill="#E8454F"/></g><g id="acc-night" class="acc acc-night"><path d="M60 118Q70 150 128 160Q186 150 196 118Q186 168 128 176Q70 168 60 118Z" fill="#2A2A38" stroke="#000" stroke-width="3" stroke-linejoin="round"/><path d="M200 96q26 2 34 26q-18-8-34-6Z" fill="#E8454F" stroke="#B02A32" stroke-width="3" stroke-linejoin="round"/><g transform="translate(36 150)"><path d="M0 -20L5 -5L20 0L5 5L0 20L-5 5L-20 0L-5 -5Z" fill="#C8CEDA" stroke="#7A8398" stroke-width="3" stroke-linejoin="round"/><circle r="3" fill="#7A8398"/></g><g><circle cx="40" cy="176" r="30" fill="var(--bgx)" opacity=".25"/><path d="M52 152A22 22 0 1 0 52 198A17 17 0 1 1 52 152Z" fill="#FFE08A" stroke="#E0A02E" stroke-width="2.5" stroke-linejoin="round"/></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -8)"><path d="M84 74L92 48L106 62L128 40L150 62L164 48L172 74Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/></g><g fill="#FFD43B" stroke="#C89A0A" stroke-width="3"><rect x="18" y="146" width="54" height="50" rx="24" opacity=".9"/><rect x="184" y="146" width="54" height="50" rx="24" opacity=".9"/></g><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
