<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bé Đấu Bố Mẹ" class="np-mascot sk-default" data-style="pop" data-game="be-dau-bo-me">
<title>Võ sĩ nhí — Bé Đấu Bố Mẹ</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, miếng dán băng cá nhân trên má trái. Đạo cụ nhận diện game (luôn có): găng đấm + huy hiệu VS. BẢN MẪU chờ duyệt (chỉ skin Mặc định).</desc>
<style>
.np-mascot[data-game="be-dau-bo-me"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#FFC9A3;--p2:#F4A27A;--pst:#C97A55;--k1:#E8454F;--k2:#FFD43B;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><rect x="84" y="172" width="88" height="56" rx="28" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="128" cy="128" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><path d="M44 96Q60 70 128 68Q196 70 212 96Q196 84 128 82Q60 84 44 96Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M208 90q22 6 30 26q-14-6-24-6Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><g fill="var(--k1)" stroke="var(--st)" stroke-width="3"><rect x="22" y="150" width="50" height="46" rx="22"/><rect x="184" y="150" width="50" height="46" rx="22"/></g><path d="M34 162q10-6 20 0M196 162q10-6 20 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><g id="mark" transform="rotate(-24 82 138)"><rect x="70" y="132" width="26" height="12" rx="6" fill="#FFE2C8" stroke="#D8A878" stroke-width="2"/><path d="M80 132v12M86 132v12" stroke="#D8A878" stroke-width="1.6"/></g><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/></g>
<g id="sign"><path d="M128 178L152 186V208Q152 224 128 232Q104 224 104 208V186Z" fill="#fff" stroke="#8E9BB8" stroke-width="3" stroke-linejoin="round"/><text x="128" y="214" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="17" fill="#E8454F">VS</text></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g>
<g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</svg>
