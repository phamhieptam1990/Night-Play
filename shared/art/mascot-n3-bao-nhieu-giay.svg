<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bao Nhiêu Giây?" class="np-mascot sk-default" data-style="night" data-game="bao-nhieu-giay">
<title>Rùa Lề Mề — Bao Nhiêu Giây?</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, ba vạch trên trán. Đạo cụ nhận diện game (luôn có): đồng hồ bấm giây. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="bao-nhieu-giay"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#9CF0C0"/><stop offset=".55" stop-color="#43C98A"/><stop offset="1" stop-color="#1F8F5E"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#9CF0C0"/><stop offset=".6" stop-color="#43C98A"/><stop offset="1" stop-color="#1F8F5E"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#F3FFD8"/><stop offset="1" stop-color="#F3FFD8" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"><circle cx="128" cy="128" r="112" fill="#fff" opacity=".14"/><circle cx="128" cy="128" r="112" fill="none" stroke="#fff" stroke-width="6" opacity=".3"/><g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".4"><path d="M128 26v16M128 214v16M26 128h16M214 128h16"/></g><path d="M128 128L128 52M128 128L188 150" stroke="#FF5A6E" stroke-width="7" stroke-linecap="round" opacity=".5"/></g><g id="pose" transform="rotate(-1.2 128 230)">
<g id="charg" transform="translate(14 30) scale(.82)"><ellipse cx="128" cy="168" rx="96" ry="70" fill="#2E9E6A" /><path d="M70 150Q128 90 186 150" fill="none" stroke="#1F7A50" stroke-width="6" opacity=".5"/>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<path d="M62 158Q128 190 194 158L198 178Q128 212 58 178Z" fill="#E8454F"/><path d="M150 180L168 228L148 224L140 190Z" fill="#B02A32"/><path d="M70 170Q128 196 186 170" fill="none" stroke="#fff" stroke-width="3" opacity=".45" stroke-dasharray="8 8"/><ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#1F8F5E" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><circle cx="100" cy="108" r="15" fill="#fff"/><circle cx="156" cy="108" r="15" fill="#fff"/><circle cx="104" cy="105" r="8.5" fill="#2A1A33"/><circle cx="160" cy="105" r="8.5" fill="#2A1A33"/><circle cx="107" cy="102" r="3" fill="#fff"/><circle cx="163" cy="102" r="3" fill="#fff"/><path d="M84 104Q100 86 116 104Q100 98 84 104Z M140 104Q156 86 172 104Q156 98 140 104Z" fill="#43C98A" stroke="#1F7A50" stroke-width="2.5"/><ellipse cx="78" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M114 134Q128 142 142 134" fill="none" stroke="#7A2A3A" stroke-width="4.5" stroke-linecap="round"/></g><g id="mark" stroke="#1F8F5E" stroke-width="5" stroke-linecap="round"><path d="M112 66v12M128 62v14M144 66v12"/></g></g>
</g>
<g id="propg" transform="translate(250 236) scale(1.55) translate(-250 -236)"><g id="sign"><rect x="190" y="124" width="14" height="10" rx="3" fill="#E8454F"/><circle cx="198" cy="166" r="30" fill="#fff" stroke="#E8454F" stroke-width="6"/><path d="M198 166V146M198 166L212 174" stroke="#2A1A33" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
