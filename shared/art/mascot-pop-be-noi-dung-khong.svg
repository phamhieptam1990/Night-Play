<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bé Nói Đúng Không?" class="np-mascot sk-default" data-style="pop" data-game="be-noi-dung-khong">
<title>Vẹt Lém Lỉnh — Bé Nói Đúng Không?</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, ba vạch lông xanh lam bên má trái. Đạo cụ nhận diện game (luôn có): micro vàng + bong bóng thoại. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="be-noi-dung-khong"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#7FE0A0;--p2:#3DBE73;--pst:#25894F;--k1:var(--pa,#FF5A6E);--k2:var(--pb,#FFB020);--bell:#FFF3D4;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="be-noi-dung-khong"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="be-noi-dung-khong"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><g opacity=".95"><ellipse cx="128" cy="52" rx="14" ry="48" transform="rotate(-58 128 120)" fill="#FF6B6B"/><ellipse cx="128" cy="52" rx="14" ry="48" transform="rotate(-29 128 120)" fill="#FFA94D"/><ellipse cx="128" cy="52" rx="14" ry="48" fill="#FFD43B"/><ellipse cx="128" cy="52" rx="14" ry="48" transform="rotate(29 128 120)" fill="#51CF66"/><ellipse cx="128" cy="52" rx="14" ry="48" transform="rotate(58 128 120)" fill="#4DABF7"/></g></g>
<g id="body"><ellipse cx="128" cy="176" rx="62" ry="54" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="128" cy="196" rx="38" ry="30" fill="var(--bell)"/><path d="M104 44Q96 12 118 22Q120 8 132 22Q146 6 150 30Q166 24 152 50Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="128" cy="124" rx="84" ry="80" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="84" rx="26" ry="12" transform="rotate(-24 98 84)" fill="var(--hl)" opacity=".5"/><ellipse cx="46" cy="170" rx="18" ry="34" transform="rotate(-16 46 170)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="210" cy="170" rx="18" ry="34" transform="rotate(16 210 170)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><g id="mark" stroke="#3E7BFF" stroke-width="3.5" stroke-linecap="round"><path d="M70 124l-8 -3"/><path d="M71 133l-9 0"/><path d="M72 142l-8 3"/></g><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><path id="beak" d="M112 136Q128 128 144 136Q140 158 128 164Q116 158 112 136Z" fill="var(--k2)" stroke="#D8860A" stroke-width="3" stroke-linejoin="round"/></g>
<g id="sign"><rect x="196" y="126" width="12" height="52" rx="6" fill="#B0B8C8" stroke="#6E7890" stroke-width="3"/><ellipse cx="202" cy="118" rx="16" ry="18" fill="#FFD43B" stroke="#D8A80A" stroke-width="3"/><path d="M194 112h16M194 120h16" stroke="#D8A80A" stroke-width="2.5"/><g transform="translate(212 56)"><rect x="0" y="0" width="38" height="28" rx="12" fill="#fff" stroke="#9AA3B8" stroke-width="3"/><path d="M8 28L4 40L18 28Z" fill="#fff" stroke="#9AA3B8" stroke-width="3" stroke-linejoin="round"/><path d="M12 10h14M12 17h9" stroke="#3DBE73" stroke-width="3.5" stroke-linecap="round"/></g></g>
<g id="acc-badge" class="acc acc-badge"><path d="M96 176Q128 200 160 176L150 196Q128 214 106 196Z" fill="#E8454F" stroke="#B83A4A" stroke-width="3" stroke-linejoin="round"/><path d="M128 184L112 174V196ZM128 184L144 174V196Z" fill="#FF6B7A" stroke="#B83A4A" stroke-width="3" stroke-linejoin="round"/><path d="M70 150L186 210" stroke="#FFD43B" stroke-width="12" stroke-linecap="round" opacity=".95"/><text x="122" y="186" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="14" fill="#B8840A" transform="rotate(27 122 186)">MC</text></g><g id="acc-group" class="acc acc-group"><path d="M60 112Q60 40 128 38Q196 40 196 112" fill="none" stroke="#FF5A6E" stroke-width="9" stroke-linecap="round"/><rect x="46" y="104" width="24" height="40" rx="11" fill="#FF5A6E" stroke="#B83A4A" stroke-width="3"/><rect x="186" y="104" width="24" height="40" rx="11" fill="#FF5A6E" stroke="#B83A4A" stroke-width="3"/><g fill="#7B4AE2"><path d="M30 70l4 -16 12 -3v18a6 6 0 1 1 -4 -5V58l-4 1v14a6 6 0 1 1 -8 -4Z"/></g></g><g id="acc-night" class="acc acc-night"><g transform="translate(0 -14)"><path d="M76 88Q86 34 132 28Q170 28 182 66Q152 54 128 60Q104 66 76 88Z" fill="#3B3F9A" stroke="#2A1F7A" stroke-width="3" stroke-linejoin="round"/><path d="M72 90Q128 62 186 90" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="184" cy="64" r="10" fill="#fff" stroke="#C9C2FF" stroke-width="2.5"/><path d="M110 56l3 6 6.5 1-4.7 4.5 1.1 6.5-5.9-3.1-5.9 3.1 1.1-6.5-4.7-4.5 6.5-1z" fill="#FFD43B"/></g><g transform="rotate(-12 44 196)"><rect x="14" y="176" width="64" height="40" rx="14" fill="#FFF3F8" stroke="#E8A0C0" stroke-width="3"/><path d="M26 188q12 -4 24 0t24 0" fill="none" stroke="#E8A0C0" stroke-width="2.5" opacity=".7"/></g><g fill="#fff" stroke="#8E9BB8" stroke-width="1.2" font-family="Inter,system-ui,sans-serif" font-weight="900"><text x="188" y="70" font-size="22">Z</text><text x="206" y="54" font-size="16">z</text><text x="220" y="42" font-size="12">z</text></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -6)"><path d="M94 70L102 38L117 55L128 30L139 55L154 38L162 70Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="56" r="4" fill="#FF6B6B"/></g><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
