<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Làng Của Bé" class="np-mascot sk-default" data-style="pop" data-game="lang-cua-be">
<title>Cừu non Trưởng Làng — Làng Của Bé</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, huy hiệu ngôi nhà nhỏ trên mũ. Đạo cụ nhận diện game (luôn có): ngôi nhà nhỏ + cờ làng. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="lang-cua-be"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#FFFFFF;--p2:#E4DEFF;--pst:#9A8EC8;--k1:var(--pa,#3DBE73);--k2:var(--pb,#FFD43B);--bell:#FFFFFF;--face:#FFE0C8;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="lang-cua-be"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="lang-cua-be"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><g fill="url(#pg)" stroke="var(--st)" stroke-width="3"><circle cx="70" cy="92" r="34"/><circle cx="104" cy="62" r="36"/><circle cx="152" cy="62" r="36"/><circle cx="186" cy="92" r="34"/><circle cx="52" cy="140" r="36"/><circle cx="204" cy="140" r="36"/><circle cx="68" cy="190" r="34"/><circle cx="188" cy="190" r="34"/><circle cx="128" cy="200" r="40"/><circle cx="128" cy="118" r="64"/></g><ellipse cx="96" cy="70" rx="24" ry="11" transform="rotate(-24 96 70)" fill="#fff" opacity=".7"/><ellipse cx="128" cy="128" rx="62" ry="58" fill="var(--face)" stroke="var(--st)" stroke-width="3"/><ellipse cx="62" cy="118" rx="14" ry="22" transform="rotate(20 62 118)" fill="var(--face)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="118" rx="14" ry="22" transform="rotate(-20 194 118)" fill="var(--face)" stroke="var(--st)" stroke-width="3"/><path d="M86 196Q128 226 170 196" fill="none" stroke="var(--k1)" stroke-width="16" stroke-linecap="round"/><path d="M92 62Q96 28 128 26Q160 28 164 62Q146 50 128 50Q110 50 92 62Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--face)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--face)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><g id="mark"><path d="M114 46L128 34L142 46V58H114Z" fill="#fff" stroke="#9AA3B8" stroke-width="2.5" stroke-linejoin="round"/><rect x="123" y="48" width="10" height="10" fill="#FF8A4C"/></g><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/></g>
<g id="sign"><path d="M178 200L206 174L234 200V236H178Z" fill="#FFE9C8" stroke="#C89A5A" stroke-width="3" stroke-linejoin="round"/><path d="M172 204L206 170L240 204" fill="none" stroke="#E8454F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="198" y="212" width="16" height="24" rx="4" fill="#B8783C"/><rect x="186" y="208" width="10" height="10" rx="2" fill="#8FD8FF"/><path d="M210 172V138L232 148L210 158" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/></g>
<g id="acc-badge" class="acc acc-badge"><path d="M70 150L188 220" stroke="#E8454F" stroke-width="16" stroke-linecap="round"/><path d="M70 150L188 220" stroke="#FFD43B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/><rect x="30" y="120" width="6" height="84" rx="3" fill="#B0B8C8" stroke="#6E7890" stroke-width="2"/><path d="M36 122h46l-12 16l12 16H36Z" fill="#3DBE73" stroke="#1F8A4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M82 188L96 206L110 188Z" fill="#FF6B6B"/><circle cx="96" cy="208" r="13" fill="#FFD43B" stroke="#E8A317" stroke-width="3"/><path d="M96 201l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#fff"/></g><g id="acc-group" class="acc acc-group"><path d="M28 86Q128 58 228 86Q214 100 128 96Q42 100 28 86Z" fill="#F2D27A" stroke="#C8A040" stroke-width="3" stroke-linejoin="round"/><path d="M78 82Q86 36 128 32Q170 36 178 82Z" fill="#F2D27A" stroke="#C8A040" stroke-width="3" stroke-linejoin="round"/><path d="M80 74H176" stroke="#E8883A" stroke-width="7" stroke-linecap="round"/><g transform="rotate(14 224 170)"><rect x="219" y="112" width="8" height="100" rx="4" fill="#8A5A30" stroke="#5A3A20" stroke-width="2.5"/><path d="M210 112h26l-4 20h-18Z" fill="#B0B8C8" stroke="#6E7890" stroke-width="3" stroke-linejoin="round"/></g></g><g id="acc-night" class="acc acc-night"><g transform="translate(36 180)"><path d="M0 -26V-16" stroke="#8A5A30" stroke-width="3"/><rect x="-14" y="-16" width="28" height="34" rx="12" fill="#FF8A4C" stroke="#B8540A" stroke-width="3"/><circle cy="2" r="32" fill="#FFD27A" opacity=".3"/></g><g fill="#FFF3A0"><circle cx="196" cy="60" r="4"/><circle cx="214" cy="110" r="3.5"/><circle cx="52" cy="70" r="3.5"/><circle cx="224" cy="170" r="4"/><circle cx="200" cy="30" r="3"/></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -6)"><path d="M94 70L102 38L117 55L128 30L139 55L154 38L162 70Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="56" r="4" fill="#FF6B6B"/><circle cx="108" cy="60" r="3" fill="#4DABF7"/><circle cx="148" cy="60" r="3" fill="#51CF66"/></g><g transform="translate(206 220)"><path d="M-30 0L0 -34L30 0V30H-30Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M-38 4L0 -40L38 4" fill="none" stroke="#FFB020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="-7" y="6" width="14" height="24" rx="3" fill="#C89A0A"/></g><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
