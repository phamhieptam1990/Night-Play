<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đập Deadline" class="np-mascot sk-default" data-style="night" data-game="dap-deadline">
<title>Chuột Chũi Thức Khuya — Đập Deadline</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, quầng thâm dưới mắt. Đạo cụ nhận diện game (luôn có): búa gỗ + khăn buộc đầu. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="dap-deadline"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#C99A74"/><stop offset=".55" stop-color="#8A5A3C"/><stop offset="1" stop-color="#5E3A22"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#C99A74"/><stop offset=".6" stop-color="#8A5A3C"/><stop offset="1" stop-color="#5E3A22"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#E8C8A8"/><stop offset="1" stop-color="#E8C8A8" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"><rect x="26" y="34" width="204" height="170" rx="14" fill="#fff" opacity=".16"/><rect x="26" y="34" width="204" height="34" rx="14" fill="#E8454F" opacity=".6"/><g stroke="#fff" stroke-width="3" opacity=".3"><path d="M26 104H230M26 140H230M26 176H230M80 68V204M134 68V204M188 68V204"/></g><text x="128" y="58" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="20" fill="#fff" opacity=".8">DEADLINE</text></g><g id="pose" transform="rotate(-2.4 128 230)">
<g id="charg" transform="translate(14 30) scale(.82)">
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<path d="M64 164Q128 142 192 164L200 222Q128 244 56 222Z" fill="#3A3F6A"/><path d="M64 164Q128 142 192 164" fill="none" stroke="#222645" stroke-width="5" opacity=".5"/><path d="M128 156V234" stroke="#222645" stroke-width="3.5" opacity=".6"/><path d="M96 206Q128 218 160 206L164 226Q128 238 92 226Z" fill="#222645" opacity=".35"/><ellipse cx="60" cy="178" rx="19" ry="27" fill="#3A3F6A" transform="rotate(18 60 178)"/><ellipse cx="196" cy="178" rx="19" ry="27" fill="#3A3F6A" transform="rotate(-18 196 178)"/><ellipse cx="52" cy="72" rx="18" ry="16" fill="#8A5A3C" /><ellipse cx="204" cy="72" rx="18" ry="16" fill="#8A5A3C" /><ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#5E3A22" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><circle cx="92" cy="112" r="7" fill="#1C1020"/><circle cx="164" cy="112" r="7" fill="#1C1020"/><circle cx="94.5" cy="109.5" r="2.6" fill="#fff"/><circle cx="166.5" cy="109.5" r="2.6" fill="#fff"/><ellipse cx="78" cy="128" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="128" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/></g><path d="M128 118l7 10l12 2l-9 8l3 12l-13 -6l-13 6l3 -12l-9 -8l12 -2z" fill="#FF8FA8"/><path d="M96 134l-26 -6M96 142l-28 4M160 134l26 -6M160 142l28 4" stroke="#5E3A22" stroke-width="3" stroke-linecap="round" opacity=".7"/><path id="mark" d="M82 126Q98 134 112 126M144 126Q158 134 174 126" fill="none" stroke="#5E3A22" stroke-width="4" opacity=".55"/></g>
<path d="M52 96Q128 64 204 96" fill="none" stroke="#E8454F" stroke-width="16" stroke-linecap="round"/><path d="M196 92l24 -8l-6 20z" fill="#E8454F"/></g>
<g id="propg" transform="translate(250 236) scale(1) translate(-250 -236)"><g id="sign" transform="rotate(-22 206 166)"><rect x="200" y="124" width="12" height="96" rx="6" fill="#C8924A"/><rect x="176" y="100" width="62" height="34" rx="12" fill="#E8454F"/></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
