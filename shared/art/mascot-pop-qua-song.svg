<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Qua Sông Cùng Bé" class="np-mascot sk-default" data-style="pop" data-game="qua-song">
<title>Bác nông dân — Qua Sông Cùng Bé</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, bộ ria mép nhỏ dưới mũi. Đạo cụ nhận diện game (luôn có): thuyền nhỏ chở sói-dê-cải. BẢN MẪU chờ duyệt (chỉ skin Mặc định).</desc>
<style>
.np-mascot[data-game="qua-song"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#F2C098;--p2:#DDA070;--pst:#A8703F;--k1:#FFD966;--k2:#4A90E8;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><rect x="80" y="172" width="96" height="58" rx="28" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="128" cy="128" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><path d="M30 92Q128 70 226 92Q214 100 128 98Q42 100 30 92Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M62 90Q70 22 128 14Q186 22 194 90Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M66 82H190" stroke="#E8883A" stroke-width="8" stroke-linecap="round"/><path d="M92 38l6 40M112 30l4 50M140 30l-4 50M160 38l-6 40" stroke="#D8AE40" stroke-width="2.5" opacity=".7"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" d="M110 150Q119 143 128 150Q137 143 146 150Q137 158 128 152Q119 158 110 150Z" fill="#6B4A2A"/></g>
<g id="sign"><path d="M168 214H240L230 238H178Z" fill="#B8783C" stroke="#7A4C1E" stroke-width="3" stroke-linejoin="round"/><path d="M164 214Q204 226 244 214" stroke="#4A90E8" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/><circle cx="184" cy="200" r="9" fill="#9AA0B0" stroke="#666C7C" stroke-width="2.5"/><circle cx="206" cy="200" r="9" fill="#FFF3E0" stroke="#C8A878" stroke-width="2.5"/><circle cx="228" cy="200" r="9" fill="#7BD34A" stroke="#4A9A22" stroke-width="2.5"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g>
<g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</svg>
