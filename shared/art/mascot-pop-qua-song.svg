<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Qua Sông Cùng Bé" class="np-mascot sk-default" data-style="pop" data-game="qua-song">
<title>Bò sữa Nông dân — Qua Sông Cùng Bé</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, đốm đen lớn bên trên mắt phải. Đạo cụ nhận diện game (luôn có): thuyền nhỏ chở sói-dê-cải. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="qua-song"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#FFF7EC;--p2:#EADCC4;--pst:#A08A6A;--k1:var(--pa,#FFD966);--k2:var(--pb,#FFB6C1);--bell:#FFE9E0;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="qua-song"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="qua-song"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><ellipse cx="42" cy="92" rx="26" ry="14" transform="rotate(24 42 92)" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="214" cy="92" rx="26" ry="14" transform="rotate(-24 214 92)" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><path d="M74 54L66 22L100 42ZM182 54L190 22L156 42Z" fill="#FFF3D0" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><ellipse cx="62" cy="150" rx="22" ry="26" fill="#3A3A48"/><ellipse cx="186" cy="190" rx="26" ry="20" fill="#3A3A48"/><ellipse cx="128" cy="184" rx="50" ry="36" fill="var(--bell)"/><ellipse cx="128" cy="150" rx="46" ry="30" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><circle cx="112" cy="150" r="5" fill="#C06A7A"/><circle cx="144" cy="150" r="5" fill="#C06A7A"/><path d="M30 90Q128 64 226 90Q214 100 128 96Q42 100 30 90Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M76 88Q84 30 128 24Q172 30 180 88Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M80 80H176" stroke="#E8883A" stroke-width="8" stroke-linecap="round"/><ellipse cx="44" cy="164" rx="16" ry="28" transform="rotate(-22 44 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="212" cy="164" rx="16" ry="28" transform="rotate(22 212 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><ellipse id="mark" cx="172" cy="124" rx="16" ry="12" fill="#3A3A48" opacity=".9"/></g>
<g id="sign"><path d="M168 214H240L230 238H178Z" fill="#B8783C" stroke="#7A4C1E" stroke-width="3" stroke-linejoin="round"/><path d="M164 214Q204 226 244 214" stroke="#4A90E8" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/><circle cx="184" cy="200" r="9" fill="#9AA0B0" stroke="#666C7C" stroke-width="2.5"/><circle cx="206" cy="200" r="9" fill="#FFF3E0" stroke="#C8A878" stroke-width="2.5"/><circle cx="228" cy="200" r="9" fill="#7BD34A" stroke="#4A9A22" stroke-width="2.5"/></g>
<g id="acc-badge" class="acc acc-badge"><path d="M66 84Q74 30 128 26Q182 30 190 84Z" fill="#2A4A8A" stroke="#14264A" stroke-width="3" stroke-linejoin="round"/><path d="M62 84H194" stroke="#fff" stroke-width="9" stroke-linecap="round"/><path d="M128 50V70M118 60h20M120 68q8 10 16 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><g transform="translate(128 206)"><circle r="40" ry="12" cx="0" fill="none"/><ellipse rx="46" ry="14" fill="none" stroke="#fff" stroke-width="12"/><ellipse rx="46" ry="14" fill="none" stroke="#E8454F" stroke-width="12" stroke-dasharray="18 36"/></g></g><g id="acc-group" class="acc acc-group"><path d="M128 14L50 84H206Z" fill="#E8C97A" stroke="#A8803A" stroke-width="3" stroke-linejoin="round"/><path d="M70 66l12 14M96 44l16 34M128 30v50M160 44l-16 34M186 66l-12 14" stroke="#A8803A" stroke-width="2.5" opacity=".7"/><g transform="rotate(-20 30 130)"><path d="M18 40L38 214" stroke="#8A5A30" stroke-width="5" stroke-linecap="round"/><path d="M18 40Q-14 60 -10 120" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M-10 120q4 10 12 4" fill="none" stroke="#C0C0C8" stroke-width="3"/></g></g><g id="acc-night" class="acc acc-night"><g transform="translate(36 176)"><path d="M0 -26V-16" stroke="#8A5A30" stroke-width="3"/><rect x="-14" y="-16" width="28" height="34" rx="12" fill="#FF8A4C" stroke="#B8540A" stroke-width="3"/><path d="M-14 -4h28M-14 8h28" stroke="#B8540A" stroke-width="2" opacity=".6"/><circle cy="2" r="30" fill="#FFD27A" opacity=".3"/></g><g fill="#fff" opacity=".35"><ellipse cx="60" cy="236" rx="40" ry="8"/><ellipse cx="190" cy="232" rx="46" ry="9"/></g><g><circle cx="210" cy="56" r="30" fill="var(--bgx)" opacity=".25"/><path d="M222 32A22 22 0 1 0 222 78A17 17 0 1 1 222 32Z" fill="#FFE08A" stroke="#E0A02E" stroke-width="2.5" stroke-linejoin="round"/></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -4)"><path d="M94 70L102 38L117 55L128 30L139 55L154 38L162 70Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="56" r="4" fill="#FF6B6B"/><circle cx="108" cy="60" r="3" fill="#4DABF7"/><circle cx="148" cy="60" r="3" fill="#51CF66"/></g><g transform="translate(192 232)"><path d="M-36 -22H36L26 0H-26Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M0 -22V-60L24 -42L0 -34" fill="#fff" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/></g><path d="M20 236q16 -10 32 0t32 0" fill="none" stroke="#FFE066" stroke-width="5" stroke-linecap="round"/><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
