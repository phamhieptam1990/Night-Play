<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Vẽ Một Nét" class="np-mascot sk-default" data-style="night" data-game="ve-mot-net">
<title>Bút Chì Liều — Vẽ Một Nét</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt lim dim nửa mở, một chân mày nhướn, nhếch mép một bên, vệt tẩy hồng trên má. Đạo cụ nhận diện game (luôn có): nét vẽ nguệch ngoạc một đường liền. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="ve-mot-net"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#FFD43B;--p2:#F2A81D;--pa:#FF5A8A;--pb:#00E5FF;--face:#FFF3D0;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><path d="M64 74L128 14L192 74V200Q192 222 170 222H86Q64 222 64 200Z"/></g>
<g id="body"><path d="M64 200V76L128 12L192 76V200Q192 224 168 224H88Q64 224 64 200Z" fill="var(--c1)"/><path d="M64 76L128 12L192 76Q128 92 64 76Z" fill="#F5D6A8"/><path d="M110 36L128 12L146 36Q128 44 110 36Z" fill="var(--ink)"/><path d="M128 76V224" stroke="var(--c2)" stroke-width="5" fill="none" opacity=".55"/><rect x="64" y="196" width="128" height="28" rx="8" fill="var(--c3)"/><path d="M64 196H192" stroke-width="4" fill="none"/><path d="M92 224v12M164 224v12" fill="none" stroke-width="8"/><path d="M64 150Q40 156 36 176M192 150Q216 156 220 176" fill="none" stroke-width="10" stroke-linecap="round"/><path d="M64 150Q40 156 36 176M192 150Q216 156 220 176" fill="none" stroke="var(--c1)" stroke-width="4" stroke-linecap="round"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="102" cy="124" rx="9" ry="10" fill="var(--ink)" stroke="none"/><ellipse cx="154" cy="124" rx="9" ry="10" fill="var(--ink)" stroke="none"/><circle cx="105" cy="121" r="3" fill="#fff" stroke="none"/><circle cx="157" cy="121" r="3" fill="#fff" stroke="none"/><rect x="91" y="112" width="22" height="10" fill="var(--c1)" stroke="none"/><rect x="143" y="112" width="22" height="10" fill="var(--c1)" stroke="none"/></g><path d="M92 109H111M143 109L165 102" fill="none" stroke-width="4.5"/><path id="mouth" class="m-talk" d="M115 154Q132 164 146 146M146 146l5 -3" fill="none" stroke-width="4"/><ellipse id="mark" cx="170" cy="150" rx="9" ry="6" fill="var(--c3)" stroke-width="2.5" transform="rotate(-20 170 150)"/></g>
<path id="sign" d="M30 236Q60 200 90 232T150 234Q180 220 210 236T244 214" fill="none" stroke="var(--c4)" stroke-width="7"/>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
