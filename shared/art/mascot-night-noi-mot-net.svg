<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Nối Một Nét" class="np-mascot sk-default" data-style="night" data-game="noi-mot-net">
<title>Nhện Giăng Tơ — Nối Một Nét</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt lim dim nửa mở, một chân mày nhướn, nhếch mép một bên, dấu chấm-vạch-chấm trắng trên trán. Đạo cụ nhận diện game (luôn có): sợi tơ nối các chấm. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="noi-mot-net"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#2D2A4A;--p2:#1A1833;--pa:#00E5FF;--pb:#FF4FA3;--face:#E7E3FF;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="150" rx="74" ry="72"/></g>
<g id="body"><path d="M62 120L22 90L16 120M60 146L14 148M62 172L22 204L30 228M194 120L234 90L240 120M196 146L242 148M194 172L234 204L226 228" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 120L22 90L16 120M60 146L14 148M62 172L22 204L30 228M194 120L234 90L240 120M196 146L242 148M194 172L234 204L226 228" fill="none" stroke="var(--c1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="128" cy="150" rx="70" ry="68" fill="var(--c1)"/><path d="M128 84V120" stroke="var(--c3)" stroke-width="5" fill="none"/><path d="M108 188Q128 204 148 188" stroke="var(--c3)" stroke-width="4" fill="none"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="104" cy="118" rx="9" ry="10" fill="var(--ink)" stroke="none"/><ellipse cx="152" cy="118" rx="9" ry="10" fill="var(--ink)" stroke="none"/><circle cx="107" cy="115" r="3" fill="#fff" stroke="none"/><circle cx="155" cy="115" r="3" fill="#fff" stroke="none"/><rect x="93" y="106" width="22" height="10" fill="var(--c1)" stroke="none"/><rect x="141" y="106" width="22" height="10" fill="var(--c1)" stroke="none"/></g><path d="M94 103H113M141 103L163 96" fill="none" stroke-width="4.5"/><path id="mouth" class="m-talk" d="M115 156Q132 166 146 148M146 148l5 -3" fill="none" stroke-width="4"/><g id="mark" fill="#fff" stroke-width="2.5"><circle cx="112" cy="84" r="4"/><circle cx="144" cy="84" r="4"/><path d="M116 84H140" fill="none" stroke-width="3"/></g></g>
<g id="sign"><path d="M200 0V40L230 74L196 120L232 168" fill="none" stroke="var(--c3)" stroke-width="3.5"/><g fill="var(--c4)" stroke-width="3.5"><circle cx="230" cy="74" r="8"/><circle cx="196" cy="120" r="8"/><circle cx="232" cy="168" r="8"/></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
