<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Xây Cầu Tre" class="np-mascot sk-default" data-style="night" data-game="xay-cau-tre">
<title>Khỉ Thợ Xây — Xây Cầu Tre</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (toe toét hào hứng) + một chân mày nhướn, vệt sơn xanh nhỏ trên má. Đạo cụ nhận diện game (luôn có): bó tre + mũ bảo hộ vàng. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="xay-cau-tre"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#B5651D;--p2:#7A3F0E;--pa:#FFD93D;--pb:#43C46B;--face:#FFE0B8;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="150" rx="80" ry="74"/><circle cx="48" cy="112" r="30"/><circle cx="208" cy="112" r="30"/></g>
<g id="body"><path d="M206 208Q250 196 240 152Q232 134 216 146Q232 156 222 178Q214 190 200 190Z" fill="var(--c2)"/><circle cx="48" cy="114" r="28" fill="var(--c1)"/><circle cx="48" cy="114" r="15" fill="var(--face)" stroke="none"/><circle cx="208" cy="114" r="28" fill="var(--c1)"/><circle cx="208" cy="114" r="15" fill="var(--face)" stroke="none"/><ellipse cx="128" cy="152" rx="76" ry="70" fill="var(--c1)"/><path d="M82 128Q128 100 174 128Q196 160 168 182Q128 206 88 182Q60 160 82 128Z" fill="var(--face)" stroke-width="4"/><ellipse cx="128" cy="172" rx="8" ry="5" fill="var(--ink)" stroke="none"/><path d="M76 84Q80 38 128 36Q176 38 180 84Z" fill="var(--c3)" stroke-width="5"/><path d="M70 84H186" stroke-width="7" fill="var(--c3)"/><rect x="118" y="26" width="20" height="16" rx="5" fill="var(--c3)" stroke-width="4"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="128" r="12" fill="#fff" stroke-width="4"/><circle cx="102" cy="127" r="5" fill="var(--ink)" stroke="none"/><circle cx="104" cy="125" r="2" fill="#fff" stroke="none"/><circle cx="154" cy="128" r="12" fill="#fff" stroke-width="4"/><circle cx="154" cy="127" r="5" fill="var(--ink)" stroke="none"/><circle cx="156" cy="125" r="2" fill="#fff" stroke="none"/><path d="M92 106L112 102" fill="none" stroke-width="5"/><path d="M144 102L164 106" fill="none" stroke-width="5"/></g><g id="mouthg"><path id="mouth" class="m-talk" d="M108 158Q128 194 148 158Z" fill="var(--ink)" stroke-width="4.5"/><path d="M114 160H142V167H114Z" fill="#fff" stroke="none"/></g><ellipse id="mark" cx="176" cy="158" rx="7" ry="5" fill="var(--c4)" stroke-width="2.5"/></g>
<g id="sign" transform="rotate(14 212 170)"><g stroke-width="4"><rect x="192" y="108" width="14" height="116" rx="5" fill="#9BD65C"/><rect x="210" y="104" width="14" height="120" rx="5" fill="#B5E36F"/><rect x="228" y="110" width="14" height="114" rx="5" fill="#9BD65C"/></g><path d="M190 156H244M190 188H244" stroke="var(--c3)" stroke-width="5" fill="none"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
