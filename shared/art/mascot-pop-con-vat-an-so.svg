<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Con Vật Ăn Số" class="np-mascot sk-default" data-style="pop" data-game="con-vat-an-so">
<title>Cá Sấu Háu Ăn — Con Vật Ăn Số</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, chiếc răng khểnh nhô ra ở miệng. Đạo cụ nhận diện game (luôn có): con số 5 đang bị ăn trong miệng. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="con-vat-an-so"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#8EE07A;--p2:#4FBF3E;--pst:#2E8A24;--k1:var(--pa,#FF7A8A);--k2:var(--pb,#FFE9A8);--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="con-vat-an-so"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="con-vat-an-so"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><ellipse cx="128" cy="140" rx="92" ry="80" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><circle cx="92" cy="72" r="26" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><circle cx="164" cy="72" r="26" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="86" rx="26" ry="12" transform="rotate(-24 98 86)" fill="var(--hl)" opacity=".5"/><path d="M52 160Q128 150 204 160Q200 224 128 230Q56 224 52 160Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><path d="M66 164L74 176L82 164L92 178L100 164L110 178L118 164M138 164L146 178L154 164L164 178L172 164L182 178L190 164" fill="var(--k2)" stroke="var(--k2)" stroke-width="2" stroke-linejoin="round"/><ellipse cx="128" cy="216" rx="38" ry="14" fill="var(--k1)" opacity=".6"/><circle cx="116" cy="130" r="3" fill="var(--st)"/><circle cx="140" cy="130" r="3" fill="var(--st)"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" d="M170 160L176 180L184 160Z" fill="#fff" stroke="#E8DFC8" stroke-width="2" stroke-linejoin="round"/></g>
<g id="sign"><circle cx="128" cy="198" r="22" fill="#FFF3B0" stroke="#D8B80A" stroke-width="3"/><text x="128" y="208" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="30" fill="#B85A00">5</text></g>
<g id="acc-badge" class="acc acc-badge"><path d="M80 74Q76 22 100 24Q112 4 128 18Q144 4 156 24Q180 22 176 74Z" fill="#fff" stroke="#C8CEDA" stroke-width="3" stroke-linejoin="round"/><path d="M80 66H176" stroke="#C8CEDA" stroke-width="3"/><g transform="rotate(-28 40 170)"><ellipse cx="40" cy="132" rx="16" ry="20" fill="#C8CEDA" stroke="#7A8398" stroke-width="3"/><rect x="36" y="146" width="8" height="54" rx="4" fill="#B8783C"/></g></g><g id="acc-group" class="acc acc-group"><path d="M60 72Q128 34 196 72" fill="none" stroke="#B8D8FF" stroke-width="12" stroke-linecap="round"/><circle cx="128" cy="40" r="16" fill="#fff" stroke="#8E9BB8" stroke-width="3"/><circle cx="128" cy="40" r="8" fill="#BFE6FF"/><g transform="rotate(-24 38 180)"><rect x="32" y="140" width="10" height="56" rx="5" fill="#FFD43B" stroke="#D8A80A" stroke-width="2.5"/><rect x="26" y="130" width="22" height="16" rx="4" fill="#fff" stroke="#8E9BB8" stroke-width="2.5"/></g></g><g id="acc-night" class="acc acc-night"><path d="M70 86Q128 70 186 86L180 104Q128 92 76 104Z" fill="#6A4AE2" stroke="#3E2AA8" stroke-width="3" stroke-linejoin="round"/><path d="M96 92q8 8 16 0M144 92q8 8 16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><g transform="rotate(-12 44 196)"><rect x="14" y="176" width="64" height="40" rx="14" fill="#FFF3F8" stroke="#E8A0C0" stroke-width="3"/><path d="M26 188q12 -4 24 0t24 0" fill="none" stroke="#E8A0C0" stroke-width="2.5" opacity=".7"/></g><g fill="#fff" stroke="#8E9BB8" stroke-width="1.2" font-family="Inter,system-ui,sans-serif" font-weight="900"><text x="188" y="68" font-size="22">Z</text><text x="206" y="52" font-size="16">z</text><text x="220" y="40" font-size="12">z</text></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -10)"><path d="M94 70L102 38L117 55L128 30L139 55L154 38L162 70Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="56" r="4" fill="#FF6B6B"/><circle cx="108" cy="60" r="3" fill="#4DABF7"/><circle cx="148" cy="60" r="3" fill="#51CF66"/></g><g transform="translate(208 214)"><ellipse rx="26" ry="9" fill="#C89A0A"/><ellipse cy="-8" rx="22" ry="8" fill="#FFD43B" stroke="#C89A0A" stroke-width="2.5"/><ellipse cy="-18" rx="18" ry="7" fill="#FFE066" stroke="#C89A0A" stroke-width="2.5"/></g><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
