<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Con Vật Ăn Số" class="np-mascot sk-default" data-style="pop" data-game="con-vat-an-so">
<title>Cá Sấu Háu Ăn — Con Vật Ăn Số</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, chiếc răng khểnh nhô ra ở miệng. Đạo cụ nhận diện game (luôn có): con số 5 đang bị ăn trong miệng. BẢN MẪU chờ duyệt (chỉ skin Mặc định).</desc>
<style>
.np-mascot[data-game="con-vat-an-so"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#8EE07A;--p2:#4FBF3E;--pst:#2E8A24;--k1:#FF7A8A;--k2:#FFE9A8;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><ellipse cx="128" cy="140" rx="92" ry="80" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><circle cx="92" cy="72" r="26" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><circle cx="164" cy="72" r="26" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="86" rx="26" ry="12" transform="rotate(-24 98 86)" fill="var(--hl)" opacity=".5"/><path d="M52 160Q128 150 204 160Q200 224 128 230Q56 224 52 160Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><path d="M66 164L74 176L82 164L92 178L100 164L110 178L118 164M138 164L146 178L154 164L164 178L172 164L182 178L190 164" fill="var(--k2)" stroke="var(--k2)" stroke-width="2" stroke-linejoin="round"/><ellipse cx="128" cy="216" rx="38" ry="14" fill="var(--k1)" opacity=".6"/><circle cx="116" cy="130" r="3" fill="var(--st)"/><circle cx="140" cy="130" r="3" fill="var(--st)"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" d="M170 160L176 180L184 160Z" fill="#fff" stroke="#E8DFC8" stroke-width="2" stroke-linejoin="round"/></g>
<g id="sign"><circle cx="128" cy="198" r="22" fill="#FFF3B0" stroke="#D8B80A" stroke-width="3"/><text x="128" y="208" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="30" fill="#B85A00">5</text></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g>
<g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</svg>
