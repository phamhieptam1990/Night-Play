<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Mê Cung Truyền Tay" class="np-mascot sk-default" data-style="night" data-game="me-cung-truyen-tay">
<title>Chuột Lạc Đường — Mê Cung Truyền Tay</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, răng cửa nhô ra. Đạo cụ nhận diện game (luôn có): phô mai mê cung. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="me-cung-truyen-tay"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#D4D8E2"/><stop offset=".55" stop-color="#A5ABBC"/><stop offset="1" stop-color="#707690"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#D4D8E2"/><stop offset=".6" stop-color="#A5ABBC"/><stop offset="1" stop-color="#707690"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#F1F2F6"/><stop offset="1" stop-color="#F1F2F6" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="pose" transform="rotate(-1.2 128 230)">
<path d="M222 204Q252 184 238 152" fill="none" stroke="#FF9EB5" stroke-width="6" stroke-linecap="round"/>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<ellipse cx="58" cy="56" rx="34" ry="34" fill="#A5ABBC" /><ellipse cx="58" cy="56" rx="21" ry="21" fill="#FFB3C6" /><ellipse cx="198" cy="56" rx="34" ry="34" fill="#A5ABBC" /><ellipse cx="198" cy="56" rx="21" ry="21" fill="#FFB3C6" /><ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="96" cy="58" rx="28" ry="13" fill="#fff" opacity=".42" transform="rotate(-22 96 58)"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#707690" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><ellipse cx="100" cy="108" rx="14" ry="16.5" fill="#2A1A33"/><circle cx="104" cy="102" r="4.516129032258064" fill="#fff"/><circle cx="96" cy="113" r="2.3333333333333335" fill="#fff" opacity=".85"/><ellipse cx="156" cy="108" rx="14" ry="16.5" fill="#2A1A33"/><circle cx="160" cy="102" r="4.516129032258064" fill="#fff"/><circle cx="152" cy="113" r="2.3333333333333335" fill="#fff" opacity=".85"/><path d="M84 86l18 6M172 86l-18 6" stroke="#2A1A33" stroke-width="5" stroke-linecap="round"/><path d="M178 96q-8 12 0 18q8 -6 0 -18z" fill="#8FD8FF"/><path d="M108 138l6 -8l7 8l7 -8l7 8l7 -8l6 8" fill="#fff" stroke="#7A2A3A" stroke-width="3.5" stroke-linejoin="round"/></g><rect id="mark" x="124" y="152" width="9" height="12" rx="2" fill="#fff" stroke="#C8CEDA" stroke-width="2"/></g>
<g id="sign"><path d="M172 222L246 198V236Z" fill="#FFD84A"/><path d="M188 226V214H202V222H214V210H228" fill="none" stroke="#C99A0A" stroke-width="3.5"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
