<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FFF0A0"/><stop offset=".6" stop-color="#FFD93D"/><stop offset="1" stop-color="#E8A81D"/></radialGradient>
