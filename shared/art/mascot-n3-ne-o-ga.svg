<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Né Ổ Gà Mùa Mưa" class="np-mascot sk-default" data-style="night" data-game="ne-o-ga">
<title>Vịt Áo Mưa — Né Ổ Gà Mùa Mưa</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, giọt nước trên đầu. Đạo cụ nhận diện game (luôn có): ô đỏ + áo mưa + ủng. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="ne-o-ga"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#FFF0A0"/><stop offset=".55" stop-color="#FFD93D"/><stop offset="1" stop-color="#E8A81D"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FFF0A0"/><stop offset=".6" stop-color="#FFD93D"/><stop offset="1" stop-color="#E8A81D"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6C8"/><stop offset="1" stop-color="#FFF6C8" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="pose" transform="rotate(0 128 230)">
<path d="M46 156Q16 150 20 122Q54 126 64 150Z" fill="#F2B81D"/><path d="M210 156Q240 150 236 122Q202 126 192 150Z" fill="#F2B81D"/>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="96" cy="58" rx="28" ry="13" fill="#fff" opacity=".42" transform="rotate(-22 96 58)"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#E8A81D" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><path d="M88 108Q100 120 112 108M144 108Q156 120 168 108" fill="none" stroke="#2A1A33" stroke-width="5" stroke-linecap="round"/><ellipse cx="78" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M116 134Q128 142 140 134" fill="none" stroke="#7A2A3A" stroke-width="4.5" stroke-linecap="round"/></g><path id="mark" d="M128 48q-9 12 0 18q9 -6 0 -18z" fill="#8FD8FF"/></g>
<path d="M70 76Q74 28 128 28Q182 28 186 76Q128 92 70 76Z" fill="#2F9BFF"/><path d="M104 138Q128 126 152 138Q156 160 128 164Q100 160 104 138Z" fill="#FF9F1C"/><g id="sign" transform="rotate(18 212 170)"><path d="M212 176V224" stroke="#8A5A30" stroke-width="5"/><path d="M164 140Q168 94 212 92Q256 94 260 140Q236 126 212 140Q188 126 164 140Z" fill="#E8454F"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
