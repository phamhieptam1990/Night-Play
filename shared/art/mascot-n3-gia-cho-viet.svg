<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đoán Giá Chợ Việt" class="np-mascot sk-default" data-style="night" data-game="gia-cho-viet">
<title>Heo Đất Chốt Đơn — Đoán Giá Chợ Việt</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, khe bỏ tiền trên đầu. Đạo cụ nhận diện game (luôn có): bảng giá 25K. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="gia-cho-viet"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#FF8FBC;--p2:#D5578F;--g0:color-mix(in srgb,var(--p1) 56%,#fff);--g1:var(--p1);--g2:var(--p2);--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.np-mascot.sk-night{--g0:color-mix(in srgb,var(--p1) 26%,#8C8CFF);--g1:color-mix(in srgb,var(--p1) 34%,#4040B8);--g2:color-mix(in srgb,var(--p2) 40%,#1C1C6A)}
.np-mascot.sk-star{--g0:color-mix(in srgb,var(--p1) 38%,#fff);--g1:color-mix(in srgb,var(--p1) 72%,#fff);--g2:color-mix(in srgb,var(--p2) 78%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.sk-badge .base-top,.sk-group .base-top,.sk-night .base-top,.sk-star .base-top{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}@keyframes npa-twinkle{0%,100%{opacity:.35}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" style="stop-color:var(--g0)"/><stop offset=".55" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" style="stop-color:var(--g0)"/><stop offset=".6" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFE0EC"/><stop offset="1" stop-color="#FFE0EC" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"><path d="M20 14H236L226 40Q215 50 204 40Q193 50 182 40Q171 50 160 40Q149 50 138 40Q127 50 116 40Q105 50 94 40Q83 50 72 40Q61 50 50 40Q39 50 30 40Z" fill="#FF6B6B" opacity=".55"/></g><g id="pose" transform="rotate(2.4 128 230)">
<g id="charg" transform="translate(40 30) scale(.82)"><g id="back-star" class="acc acc-star"><path d="M54 120Q26 184 56 244L128 226L200 244Q230 184 202 120Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M76 150Q128 172 180 150" fill="none" stroke="#fff" stroke-width="4" opacity=".6" stroke-linecap="round"/></g>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<path d="M96 150H160L172 226Q128 242 84 226Z" fill="#43C98A"/><path d="M96 150Q128 164 160 150" fill="none" stroke="#1F8F5E" stroke-width="5" opacity=".5"/><rect x="108" y="190" width="40" height="24" rx="8" fill="#1F8F5E" opacity=".3"/><path d="M66 70L52 30L96 52Z" fill="#FF8FBC"/><path d="M190 70L204 30L160 52Z" fill="#FF8FBC"/><ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#D5578F" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><ellipse cx="86" cy="108" rx="9" ry="10.5" fill="url(#e)"/><ellipse cx="170" cy="108" rx="9" ry="10.5" fill="url(#e)"/><circle cx="89" cy="104" r="3.6" fill="#fff"/><circle cx="173" cy="104" r="3.6" fill="#fff"/><path d="M72 94Q86 86 100 94M156 94Q170 86 184 94" fill="none" stroke="#2A1A33" stroke-width="4" stroke-linecap="round"/><ellipse cx="78" cy="134" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="134" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/></g><ellipse cx="128" cy="142" rx="28" ry="20" fill="#FF6FA6"/><ellipse cx="118" cy="142" rx="5" ry="8" fill="#B0306A"/><ellipse cx="138" cy="142" rx="5" ry="8" fill="#B0306A"/><path d="M114 160Q128 170 142 160" fill="none" stroke="#7A2A3A" stroke-width="4" stroke-linecap="round"/><rect id="mark" x="112" y="34" width="32" height="9" rx="4.5" fill="#8A2A5A"/></g>
<g class="keep-top"></g><g id="acc-badge" class="acc acc-badge"><path d="M54 72Q128 32 202 72Q128 58 54 72Z" fill="#43C98A"/><path d="M196 66l24 8l-6 20z" fill="#43C98A"/><g fill="#fff" opacity=".7"><circle cx="90" cy="60" r="3"/><circle cx="128" cy="52" r="3"/><circle cx="166" cy="60" r="3"/></g><path d="M112 160L124 190L134 190L146 160Z" fill="#43C98A" opacity=".85"/><circle cx="128" cy="198" r="15" fill="#FFD43B" stroke="#C89A0A" stroke-width="3.5"/><path d="M128 190l3 6 7 1-5 5 1.4 7-6.4-3.4-6.4 3.4 1.4-7-5-5 7-1z" fill="#fff"/></g><g id="acc-group" class="acc acc-group"><rect x="88" y="-8" width="80" height="56" rx="6" fill="#6A3FC8"/><rect x="62" y="44" width="132" height="12" rx="6" fill="#6A3FC8"/><rect x="88" y="30" width="80" height="11" fill="#FFD43B"/></g><g id="acc-night" class="acc acc-night"><ellipse cx="128" cy="12" rx="46" ry="11" fill="none" stroke="#FFE08A" stroke-width="7"/><ellipse cx="128" cy="12" rx="46" ry="11" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/></g><g id="acc-star" class="acc acc-star"><path d="M76 58L90 28L108 46L128 18L148 46L166 28L180 58Z" fill="#fff" stroke="#FF4FA3" stroke-width="3.5" stroke-linejoin="round"/><circle cx="128" cy="38" r="6" fill="#FF4FA3"/><path d="M112 160L124 190L134 190L146 160Z" fill="#E8454F" opacity=".85"/><circle cx="128" cy="198" r="15" fill="#FFD43B" stroke="#C89A0A" stroke-width="3.5"/><path d="M128 190l3 6 7 1-5 5 1.4 7-6.4-3.4-6.4 3.4 1.4-7-5-5 7-1z" fill="#fff"/></g><g id="fx-night" class="fx fx-night"><ellipse cx="128" cy="124" rx="122" ry="116" fill="none" stroke="var(--bgx)" stroke-width="5" opacity=".9"/><ellipse cx="128" cy="124" rx="132" ry="124" fill="none" stroke="#7CF0FF" stroke-width="2.5" opacity=".5"/><g fill="#fff" class="npa-twinkle"><path d="M30 60l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z"/><path d="M226 120l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z"/></g><g fill="#7CF0FF" class="npa-twinkle" style="animation-delay:.8s"><circle cx="40" cy="170" r="4"/><circle cx="220" cy="46" r="3.5"/><circle cx="24" cy="112" r="3"/></g></g><g id="fx-star" class="fx fx-star"><g fill="#FFE08A" class="npa-twinkle"><path d="M34 70l3 7.4 7.4 3-7.4 3-3 7.4-3-7.4-7.4-3 7.4-3z"/><path d="M222 150l3 7.4 7.4 3-7.4 3-3 7.4-3-7.4-7.4-3 7.4-3z"/><path d="M214 40l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z"/></g><g fill="#FF8AD0" class="npa-twinkle" style="animation-delay:.7s"><circle cx="46" cy="190" r="4"/><circle cx="232" cy="96" r="3.5"/></g></g></g>
