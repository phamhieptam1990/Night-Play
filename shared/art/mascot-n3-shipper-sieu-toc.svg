<path d="M80 66Q82 22 128 20Q174 22 176 66Z" fill="#2DD4A8"/><path d="M82 60H174" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g>
<g id="propg" transform="translate(250 236) scale(1.55) translate(-250 -236)"><g id="sign"><rect x="180" y="170" width="62" height="52" rx="9" fill="#E3B27A"/><path d="M180 190H242" stroke="#B8854E" stroke-width="4"/><text x="211" y="214" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="14" fill="#7A4A00">SHIP</text></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
