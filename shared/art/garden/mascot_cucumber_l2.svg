<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Dưa Leo (linh vật cấp 2 khăn đỏ)" class="np-mascot sk-l2 em-happy" data-style="pop" data-game="garden-crop-cucumber" data-level="2">
<title>Dưa Leo (linh vật cấp 2 khăn đỏ)</title><desc>Chữ ký khuôn mặt: mắt tròn hai điểm sáng, má hồng; riêng Dưa Leo: nốt gai li ti trên thân + hoa vàng nhỏ cài đỉnh đầu. Mỗi cấp thêm một thứ: khăn đỏ, huy chương, vương miện.</desc><style>.np-mascot{--ink:#2A2350;--c1:#9BE37A;--c2:#3FB65A;--st:#217A3A;--bl:#FF9DB0;--l1:#B8F08F;--l2:#5CCB6A;--l3:#217A3A}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-box:fill-box;transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa,:root.np-playing .npa-blink{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-blink{animation:none}}</style><defs><linearGradient id="GB-cucumber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-cucumber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="246" rx="64" ry="7" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path d="M128 40Q130 26 144 22" fill="none" stroke="var(--l3)" stroke-width="6" stroke-linecap="round"/><g transform="translate(148 24)"><ellipse cx="0" cy="-8" rx="6" ry="9" fill="#FFD84A" stroke="#C99700" stroke-width="2" transform="rotate(0)"/><ellipse cx="0" cy="-8" rx="6" ry="9" fill="#FFD84A" stroke="#C99700" stroke-width="2" transform="rotate(72)"/><ellipse cx="0" cy="-8" rx="6" ry="9" fill="#FFD84A" stroke="#C99700" stroke-width="2" transform="rotate(144)"/><ellipse cx="0" cy="-8" rx="6" ry="9" fill="#FFD84A" stroke="#C99700" stroke-width="2" transform="rotate(216)"/><ellipse cx="0" cy="-8" rx="6" ry="9" fill="#FFD84A" stroke="#C99700" stroke-width="2" transform="rotate(288)"/><circle r="5" fill="#FF9F1C"/></g><path d="M128 46C80 46 62 84 62 130C62 190 82 238 128 238C174 238 194 190 194 130C194 84 176 46 128 46Z" fill="url(#GB-cucumber)" stroke="var(--st)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="84" cy="176" r="2.6" fill="var(--st)" opacity="0.5"/><circle cx="100" cy="208" r="2.6" fill="var(--st)" opacity="0.5"/><circle cx="156" cy="208" r="2.6" fill="var(--st)" opacity="0.5"/><circle cx="172" cy="176" r="2.6" fill="var(--st)" opacity="0.5"/><circle cx="90" cy="92" r="2.6" fill="var(--st)" opacity="0.5"/><circle cx="166" cy="92" r="2.6" fill="var(--st)" opacity="0.5"/><circle cx="128" cy="214" r="2.6" fill="var(--st)" opacity="0.5"/><circle cx="76" cy="140" r="2.6" fill="var(--st)" opacity="0.5"/><circle cx="180" cy="140" r="2.6" fill="var(--st)" opacity="0.5"/><path d="M92 70Q86 120 90 180" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.35"/><path d="M180 214Q206 220 214 196Q220 176 202 176" fill="none" stroke="var(--l3)" stroke-width="4" stroke-linecap="round"/><g id="face" transform="translate(128 130) scale(0.92)"><g class="npa-blink"><circle cx="-26" cy="0" r="12.5" fill="#2A2350"/><circle cx="-21.25" cy="-4.