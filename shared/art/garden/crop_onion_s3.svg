<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Hành tím giai đoạn 3" class="np-crop s3" data-style="pop"><title>Hành tím giai đoạn 3</title><desc>Cây trồng Hành tím, giai đoạn 3/4. Phong cách Pop, hoạt ảnh nhẹ.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="ug" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3B5FF"/><stop offset="1" stop-color="#9B4FDB"/></linearGradient></defs><style>.np-crop{--u1:#D9A6FF;--u2:#9449D6;--ud:#5F2A94;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="230" rx="48" ry="11" fill="url(#sg)" stroke="#5C3A1E" stroke-width="3"/><ellipse cx="112" cy="227" rx="14" ry="3" fill="#fff" opacity=".5" transform="rotate(0 112 227)"/><g transform="translate(128 226) scale(1.1) translate(-128 -226)"><g class="npa npa-sway"><path d="M108 222C108 190 111 170 114 110" stroke="var(--l3)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M108 222C108 190 111 170 114 110" stroke="var(--l2)" stroke-width="7" stroke-linecap="round" fill="none"/></g><g class="npa npa-sway d2"><path d="M128 222C128 190 131 170 134 92" stroke="var(--l3)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M128 222C128 190 131 170 134 92" stroke="var(--l2)" stroke-width="7" stroke-linecap="round" fill="none"/></g><g class="npa npa-sway d3"><path d="M148 222C148 190 151 170 154 116" stroke="var(--l3)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M148 222C148 190 151 170 154 116" stroke="var(--l2)" stroke-width="7" stroke-linecap="round" fill="none"/></g><ellipse cx="128" cy="224" rx="20" ry="9" fill="url(#ug)" stroke="var(--ud)" stroke-width="3"/></g></svg>
