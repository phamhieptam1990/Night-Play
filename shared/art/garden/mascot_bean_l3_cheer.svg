<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đậu Đậu (linh vật cấp 3 huy chương, reo mừng)" class="np-mascot sk-l3 em-cheer" data-style="pop" data-game="garden-crop-bean" data-level="3">
<title>Đậu Đậu (linh vật cấp 3 huy chương)</title><desc>Chữ ký khuôn mặt: mắt tròn hai điểm sáng, má hồng; riêng Đậu Đậu: vạch chỉ dọc vỏ quả + một râu xoắn nhỏ trên đầu. Mỗi cấp thêm một thứ: khăn đỏ, huy chương, vương miện.</desc><style>.np-mascot{--ink:#2A2350;--c1:#B5F08A;--c2:#4FBF4A;--st:#2A8A32;--bl:#FF9DB0;--l1:#B5F08A;--l2:#4FBF4A;--l3:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-box:fill-box;transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa,:root.np-playing .npa-blink{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-blink{animation:none}}</style><defs><linearGradient id="GB-bean" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-bean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="246" rx="64" ry="7" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path d="M138 58Q150 34 172 38Q188 42 180 58Q174 66 164 60" fill="none" stroke="var(--l3)" stroke-width="4" stroke-linecap="round"/><path d="M104 62C86 40 62 38 52 50C62 68 88 74 104 62Z" fill="url(#GL-bean)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M128 54C74 54 44 100 52 156C60 214 96 240 128 240C160 240 196 214 204 156C212 100 182 54 128 54Z" fill="url(#GB-bean)" stroke="var(--st)" stroke-width="3.5" stroke-linejoin="round"/><path d="M98 78Q70 120 76 190" fill="none" stroke="var(--st)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/><circle cx="92" cy="214" r="6" fill="var(--st)" opacity="0.28"/><circle cx="128" cy="224" r="6" fill="var(--st)" opacity="0.28"/><circle cx="164" cy="214" r="6" fill="var(--st)" opacity="0.28"/><ellipse cx="86" cy="106" rx="12" ry="24" fill="#fff" opacity=".5" transform="rotate(14 86 106)"/><g id="face" transform="translate(128 148) scale(0.95)"><g class="npa-blink"><circle cx="-26" cy="0" r="12.5" fill="#2A2350"/><circle cx="-21.25" cy="-4.75" r="4.75" fill="#fff"/><circle cx="-30.375" cy="4.75" r="2.375" fill="#fff" opacity=".9"/><circle cx="26" cy="0" r="12.5" fill="#2A2350"/><circle cx="30.75" cy="-4.75" r="4.75" fill="#fff"/><circle cx="21.625" cy="4.75" r="2.375" fill="#fff" opacity=".9"/></g><ellipse cx="-46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><ellipse cx="46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><path d="M-11 10Q0 34 11 10Z" fill="#7A2230" stroke="#2A2350" stroke-width="2.6" stroke-linejoin="round"/><path d="M-5 22Q0 28 5 22" fill="#FF7A8A"/></g><g id="acc-scarf"><path d="M66 194Q128 212 190 194" fill="none" stroke="#9E1B28" stroke-width="15" stroke-linecap="round"/><path d="M66 194Q128 212 190 194" fill="none" stroke="#E5484D" stroke-width="10" stroke-linecap="round"/><path d="M162.1 202l9 28l-15 -2z" fill="#E5484D" stroke="#9E1B28" stroke-width="2.6" stroke-linejoin="round"/></g><g id="acc-medal" transform="translate(168 212)"><path d="M-8 -14L-14 -32M8 -14L14 -32" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/><circle r="13" fill="#FFD24D" stroke="#C9840F" stroke-width="3"/><path d="M0 -7L2.4 -2L8 -1.4L4 2.4L5 8L0 5.4L-5 8L-4 2.4L-8 -1.4L-2.4 -2Z" fill="#fff" stroke="#C9840F" stroke-width="1.4" stroke-linejoin="round"/></g></g>
