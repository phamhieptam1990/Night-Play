ient><linearGradient id="gWall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4D8C4"/></linearGradient><linearGradient id="gStraw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0CB62"/><stop offset="1" stop-color="#D9A93A"/></linearGradient><linearGradient id="gTile3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EE8A56"/><stop offset="1" stop-color="#C95A2B"/></linearGradient><linearGradient id="gTile4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F06A52"/><stop offset="1" stop-color="#B23A2A"/></linearGradient><linearGradient id="gLeafRoof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD35F"/><stop offset="1" stop-color="#3F9A3A"/></linearGradient><linearGradient id="gLeafRoof2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6BC653"/><stop offset="1" stop-color="#2F8A36"/></linearGradient>
