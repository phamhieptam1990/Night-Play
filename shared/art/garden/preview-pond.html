var bu=document.getElementById("bub");for(var i=0;i<14;i++){var e=document.createElement("i");e.className="bubble";var s=6+(i*5)%11;e.style.cssText="left:"+(14+(i*61)%72)+"%;top:"+(52+(i*37)%36)+"%;width:"+s+"px;height:"+s+"px;animation-delay:"+(-(i*.9))+"s;animation-duration:"+(4+(i%4))+"s";bu.appendChild(e)}
function DAILY(){try{var d=JSON.parse(localStorage.getItem("gardenDaily")||"null");if(d&&d.day===new Date().toISOString().slice(0,10))return d}catch(e){}return{day:new Date().toISOString().slice(0,10),water:0,fert:0,fish:0}}function SAVE(d){try{localStorage.setItem("gardenDaily",JSON.stringify(d))}catch(e){}}
function syncFd(){var d=DAILY(),b=document.getElementById("fd");b.textContent=d.fed?"😴 Cá no rồi hôm nay":d.fish?"🍞 Cho cá ăn":"🔒 Cho cá ăn (làm nhiệm vụ)"}
function feed(){var fo=document.getElementById("food");for(var k=0;k<7;k++){(function(k){var p=document.createElement("i");p.className="pellet";p.style.left=(28+Math.random()*44)+"%";p.style.top=(24+Math.random()*10)+"%";p.style.animationDelay=(k*.12)+"s";fo.appendChild(p);setTimeout(function(){p.remove()},3400)})(k)}toast("Cá ăn no rồi, vui quá! 🐟");document.querySelectorAll(".fish").forEach(function(f){f.classList.add("hot");setTimeout(function(){f.classList.remove("hot")},1400)})}
document.getElementById("fd").onclick=function(){var d=DAILY();if(!d.fish){showCard("<h2>🐟 Nhiệm vụ cho cá ăn</h2><span class='chip'>Nhiệm vụ hằng ngày</span><p>Chơi <b>1 bài Tiếng Anh vui</b> để có thức ăn cho cá. Không chấm điểm, bé chơi xong là cá được ăn!</p><div class='acts'><button class='btn g' id='cl'>Để sau</button><button class='btn g' id='sim'>Mô phỏng xong</button><a class='btn' href='../../../learn/index.html?subj=tanh&grade=2&lang=vi&mission=fish' style='display:grid;place-items:center;text-decoration:none'>Học ngay</a></div>",this);document.getElementById("sim").onclick=function(){d.fish=1;SAVE(d);closeCard();toast("Có thức ăn cho cá rồi! Bấm Cho cá ăn nhé");syncFd()};return}if(d.fed){toast("Hôm nay cá no rồi, mai ăn tiếp nhé");return}feed();d.fed=1;SAVE(d);syncFd()};syncFd();
document.getElementById("colb").onclick=function(){showCard("<h2>🐟 Bộ sưu tập cá</h2><span class='chip'>Mở thêm khi bé học giỏi</span><div class='coll'>"+F.map(function(f){return "<div class='ci"+(f.on?"":" lock")+"'>"+SV[f.id]+f.vi+"<small>"+(f.on?"Đã mở":"Chưa mở")+"</small></div>"}).join("")+"</div><div class='acts'><button class='btn g' id='cl'>Đóng</button></div>",this)};
/* LINH VẬT AO: trò chuyện và cùng bé giải bài. Tranh Sen Sen ở shared/art/garden/ao/mascot.svg (Sen Sen, chưa có thì hiện 🪷). */
var PM={name:"Sen Sen",emoji:"🪷",imgs:["ao/mascot.svg"]};
MC.img(document.getElementById("mfimg"),PM);
function rnd(n){return Math.floor(Math.random()*n)}
var QB={
toan:function(){var a=3+rnd(8),b=2+rnd(8),c=a+b;return{q:"Mình cùng tính nhé: "+a+" + "+b+" = ?",ans:String(c),opts:shuffle([c,c+1,c-1].map(String)),hint:"Bắt đầu từ "+a+", đếm thêm "+b+" bước: "+a+", "+(a+1)+", "+(a+2)+"..."}},
tviet:function(){var B=[["Điền chữ: con ...ó (ch hay tr?)","ch",["ch","tr"],"Con vật hay sủa gâu gâu, đọc là chó."],["Điền chữ: ...ẻ em (tr hay ch?)","tr",["tr","ch"],"Mình nói: trẻ em. Âm đầu nghe nhẹ, là tr."],["Từ nào đúng chính tả?","sáng sủa",["sáng sủa","sáng xủa"],"Sáng sủa là rõ ràng, đẹp đẽ. Chữ s ở cả hai tiếng."],["Điền chữ: quả ...ưa (d hay gi?)","d",["d","gi"],"Quả dưa hấu bé hay ăn mùa hè."]],b=B[rnd(B.length)];return{q:b[0],ans:b[1],opts:shuffle(b[2]),hint:b[3]}},
tanh:function(){var B=[["Quả táo tiếng Anh là gì?","apple",["apple","banana","orange"],"Apple, bắt đầu bằng chữ a."],["Con mèo tiếng Anh là gì?","cat",["cat","dog","fish"],"Cat, ba chữ cái, bắt đầu bằng c."],["Màu đỏ tiếng Anh là gì?","red",["red","blue","green"],"Red, giống như quả cà chua chín."],["Số 3 tiếng Anh là gì?","three",["three","two","four"],"Three, ba chữ... bắt đầu bằng th."]],b=B[rnd(B.length)];return{q:b[0],ans:b[1],opts:shuffle(b[2]),hint:b[3]}}};
var SUBJ={toan:["🔢 Toán","toan"],tviet:["📖 Tiếng Việt","tviet"],tanh:["🔤 Tiếng Anh","tanh"]};
function start(){MC.open({who:"sen",name:PM.name+" · bạn ao",emoji:PM.emoji,imgs:PM.imgs,text:"Chào bé! Mình là "+PM.name+". Cùng giải 3 bài rồi cho cá ăn nhé! Bé chọn môn nào?",btns:Object.keys(SUBJ).map(function(k){return[SUBJ[k][0],function(){quiz(k)},"p"]})})}
function quiz(k){var n=0,ok=0;function next(){if(n>=3){return done(k,ok)}var Q=QB[k](),tries=0;n++;
function ask(msg){MC.say((msg?msg+" ":"")+"Bài "+n+"/3. "+Q.q,Q.opts.map(function(o){return[o,function(b){if(o===Q.ans){b.className="ok";ok+=(tries===0?1:0);MC.say("Giỏi quá! Đúng rồi!",[["Bài tiếp ➜",next,"p"]])}else{tries++;b.className="no";if(tries>=2){MC.say("Đáp án là "+Q.ans+". Không sao, mình cùng nhớ nhé! "+Q.hint,[["Bài tiếp ➜",next,"p"]])}else{ask("Gần đúng rồi, thử lại nhé!")}}}]}).concat([["💡 Gợi ý",function(){MC.say(Q.hint,[["Quay lại bài",function(){ask("")}]])}],["🔊",function(){MC.speak(Q.q)}]]))}
ask("")}
next()}
function done(k,ok){var d=DAILY();d.fish=1;SAVE(d);syncFd();MC.say("Xong rồi! Bé làm đúng ngay "+ok+"/3 bài. Mình có thức ăn cho cá rồi, cùng thả nhé! +1 ⭐",[["🍞 Cho cá ăn",function(){MC.close();document.getElementById("fd").click()},"p"],["Làm thêm bài",function(){start()}]]);toast("+1 ⭐ · Cá có thức ăn rồi!")}
document.getElementById("mfab").onclick=start;
</script></body></html>
