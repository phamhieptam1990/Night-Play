<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Dưa leo giai đoạn 3" class="np-crop s3" data-style="pop"><title>Dưa leo giai đoạn 3</title><desc>Cây trồng Dưa leo, giai đoạn 3/4. Phong cách Pop, hoạt ảnh nhẹ.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD14F"/><stop offset="1" stop-color="#3F9B2F"/></linearGradient></defs><style>.np-crop{--c1:#8FD14F;--c2:#3F9B2F;--cd:#25691C;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="230" rx="48" ry="11" fill="url(#sg)" stroke="#5C3A1E" stroke-width="3"/><ellipse cx="112" cy="227" rx="14" ry="3" fill="#fff" opacity=".5" transform="rotate(0 112 227)"/><g transform="translate(128 226) scale(1.1) translate(-128 -226)"><g transform="translate(100 222) rotate(-26)"><ellipse cx="0" cy="-18" rx="30" ry="24" fill="url(#lg)" stroke="var(--l3)" stroke-width="3"/><path d="M0 0V-36M0 -15L-15 -24M0 -15L15 -24" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".4"/></g><g transform="translate(156 222) rotate(26)"><ellipse cx="0" cy="-18" rx="30" ry="24" fill="url(#lg)" stroke="var(--l3)" stroke-width="3"/><path d="M0 0V-36M0 -15L-15 -24M0 -15L15 -24" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".4"/></g><g transform="translate(128 206) rotate(0)"><ellipse cx="0" cy="-16.8" rx="28" ry="22.4" fill="url(#lg)" stroke="var(--l3)" stroke-width="3"/><path d="M0 0V-33.6M0 -14L-14 -22.400000000000002M0 -14L14 -22.400000000000002" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".4"/></g><g transform="translate(144 222) rotate(-14) scale(0.5)"><path d="M-13 0C-15 -34 -9 -60 0 -62C9 -60 15 -34 13 0C12 8 -12 8 -13 0Z" fill="#C5E58C" stroke="#7CA64A" stroke-width="3"/><path d="M-5 -8C-6 -30 -3 -48 -1 -54M5 -8C6 -30 4 -48 2 -54" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".45" fill="none"/><circle cx="-6" cy="-20" r="1.6" fill="var(--cd)"/><circle cx="6" cy="-36" r="1.6" fill="var(--cd)"/></g><g transform="translate(150 172)"><ellipse cx="0" cy="-9" rx="5.6" ry="7.2" fill="#FFE066" stroke="#C9A12E" stroke-width="1.8" transform="rotate(0)"/><ellipse cx="0" cy="-9" rx="5.6" ry="7.2" fill="#FFE066" stroke="#C9A12E" stroke-width="1.8" transform="rotate(72)"/><ellipse cx="0" cy="-9" rx="5.6" ry="7.2" fill="#FFE066" stroke="#C9A12E" stroke-width="1.8" transform="rotate(144)"/><ellipse cx="0" cy="-9" rx="5.6" ry="7.2" fill="#FFE066" stroke="#C9A12E" stroke-width="1.8" transform="rotate(216)"/><ellipse cx="0" cy="-9" rx="5.6" ry="7.2" fill="#FFE066" stroke="#C9A12E" stroke-width="1.8" transform="rotate(288)"/><circle r="4.5" fill="#FFD84D" stroke="#C9A12E" stroke-width="1.8"/></g></g></svg>
