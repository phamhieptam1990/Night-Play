<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Hành tím (chín)" class="np-crop s4" data-style="pop"><title>Hành tím (chín)</title><desc>Cây trồng Hành tím, CHÍN, sẵn sàng thu hoạch. Phong cách Pop, hoạt ảnh nhẹ.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="ug" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3B5FF"/><stop offset="1" stop-color="#9B4FDB"/></linearGradient></defs><style>.np-crop{--u1:#D9A6FF;--u2:#9449D6;--ud:#5F2A94;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="230" rx="48" ry="11" fill="url(#sg)" stroke="#5C3A1E" stroke-width="3"/><ellipse cx="112" cy="227" rx="14" ry="3" fill="#fff" opacity=".5" transform="rotate(0 112 227)"/><g transform="translate(128 226) scale(1.3) translate(-128 -226)"><g class="npa npa-sway"><path d="M108 222C108 190 111 170 114 110" stroke="var(--l3)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M108 222C108 190 111 170 114 110" stroke="var(--l2)" stroke-width="7" stroke-linecap="round" fill="none"/></g><g class="npa npa-sway d2"><path d="M128 222C128 190 131 170 134 92" stroke="var(--l3)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M128 222C128 190 131 170 134 92" stroke="var(--l2)" stroke-width="7" stroke-linecap="round" fill="none"/></g><g class="npa npa-sway d3"><path d="M148 222C148 190 151 170 154 116" stroke="var(--l3)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M148 222C148 190 151 170 154 116" stroke="var(--l2)" stroke-width="7" stroke-linecap="round" fill="none"/></g><g transform="translate(110 238) scale(0.62)"><path d="M0 -62C8 -50 10 -44 20 -36C32 -22 26 -2 0 0C-26 -2 -32 -22 -20 -36C-10 -44 -8 -50 0 -62Z" fill="url(#ug)" stroke="var(--ud)" stroke-width="3.5" stroke-linejoin="round"/><path d="M-6 -4C-14 -22 -10 -40 -2 -54M8 -4C16 -22 12 -40 4 -54" fill="none" stroke="var(--ud)" stroke-width="2.4" opacity=".4" stroke-linecap="round"/><ellipse cx="-10" cy="-30" rx="5" ry="11" fill="#fff" opacity=".5" transform="rotate(14 -10 -30)"/><path d="M-8 2L-12 12M0 2V14M8 2L12 12" stroke="#B8924A" stroke-width="2.4" stroke-linecap="round"/></g><g transform="translate(146 240) scale(0.55)"><path d="M0 -62C8 -50 10 -44 20 -36C32 -22 26 -2 0 0C-26 -2 -32 -22 -20 -36C-10 -44 -8 -50 0 -62Z" fill="url(#ug)" stroke="var(--ud)" stroke-width="3.5" stroke-linejoin="round"/><path d="M-6 -4C-14 -22 -10 -40 -2 -54M8 -4C16 -22 12 -40 4 -54" fill="none" stroke="var(--ud)" stroke-width="2.4" opacity=".4" stroke-linecap="round"/><ellipse cx="-10" cy="-30" rx="5" ry="11" fill="#fff" opacity=".5" transform="rotate(14 -10 -30)"/><path d="M-8 2L-12 12M0 2V14M8 2L12 12" stroke="#B8924A" stroke-width="2.4" stroke-linecap="round"/></g></g><g class="npa npa-twinkle"><path d="M190 81L193 87L199 90L193 93L190 99L187 93L181 90L187 87Z" fill="#fff" class="npa npa-twinkle "/><path d="M70 111L73 117L79 120L73 123L70 129L67 123L61 120L67 117Z" fill="#fff" class="npa npa-twinkle d2"/><path d="M176 151L179 157L185 160L179 163L176 169L173 163L167 160L173 157Z" fill="#fff" class="npa npa-twinkle d3"/></g></svg>
