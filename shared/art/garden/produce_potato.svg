<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Khoai tây thu hoạch" class="np-produce" data-style="pop"><title>Khoai tây thu hoạch</title><desc>Nông sản Khoai tây.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2B97B"/><stop offset="1" stop-color="#B07C40"/></linearGradient></defs><style>.np-produce{--t1:#D9A96B;--t2:#A87238;--td:#6F4A1E;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="244" rx="70" ry="9.8" fill="#000" opacity=".14"/><g transform="translate(100 218) rotate(-10) scale(2.1)"><ellipse cx="0" cy="-14" rx="24" ry="17" fill="url(#tg)" stroke="var(--td)" stroke-width="3.5"/><circle cx="-8" cy="-18" r="2.2" fill="var(--td)" opacity=".7"/><circle cx="9" cy="-10" r="2.2" fill="var(--td)" opacity=".7"/><circle cx="4" cy="-22" r="1.8" fill="var(--td)" opacity=".7"/><ellipse cx="-10" cy="-22" rx="7" ry="3.5" fill="#fff" opacity=".5" transform="rotate(-20 -10 -22)"/></g><g transform="translate(162 230) rotate(14) scale(1.7)"><ellipse cx="0" cy="-14" rx="24" ry="17" fill="url(#tg)" stroke="var(--td)" stroke-width="3.5"/><circle cx="-8" cy="-18" r="2.2" fill="var(--td)" opacity=".7"/><circle cx="9" cy="-10" r="2.2" fill="var(--td)" opacity=".7"/><circle cx="4" cy="-22" r="1.8" fill="var(--td)" opacity=".7"/><ellipse cx="-10" cy="-22" rx="7" ry="3.5" fill="#fff" opacity=".5" transform="rotate(-20 -10 -22)"/></g></svg>
