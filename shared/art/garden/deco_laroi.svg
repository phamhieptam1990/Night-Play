<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đống lá rơi" class="np-deco" data-style="pop"><title>Đống lá rơi</title><desc>Đồ trang trí Đống lá rơi. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB347"/><stop offset="1" stop-color="#E8761C"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A5C"/><stop offset="1" stop-color="#D8452A"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#E8A91C"/></linearGradient></defs><ellipse cx="128" cy="238" rx="76" ry="10.6" fill="#000" opacity=".14"/><ellipse cx="128" cy="214" rx="78" ry="26" fill="url(#a)" stroke="#B5530E" stroke-width="4.5"/><g transform="translate(70 208) rotate(-30)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#b)" stroke="#A8420E" stroke-width="3" stroke-linejoin="round"/><path d="M0 12V-20" stroke="#A8420E" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></g><g transform="translate(96 196) rotate(20)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#c)" stroke="#A8420E" stroke-width="3" stroke-linejoin="round"/><path d="M0 12V-20" stroke="#A8420E" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></g><g transform="translate(128 190) rotate(-10)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#a)" stroke="#A8420E" stroke-width="3" stroke-linejoin="round"/><path d="M0 12V-20" stroke="#A8420E" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></g><g transform="translate(160 196) rotate(30)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#b)" stroke="#A8420E" stroke-width="3" stroke-linejoin="round"/><path d="M0 12V-20" stroke="#A8420E" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></g><g transform="translate(186 208) rotate(-20)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#c)" stroke="#A8420E" stroke-width="3" stroke-linejoin="round"/><path d="M0 12V-20" stroke="#A8420E" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></g><g transform="translate(112 178) rotate(40)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#b)" stroke="#A8420E" stroke-width="3" stroke-linejoin="round"/><path d="M0 12V-20" stroke="#A8420E" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></g><g transform="translate(146 176) rotate(-30)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#c)" stroke="#A8420E" stroke-width="3" stroke-linejoin="round"/><path d="M0 12V-20" stroke="#A8420E" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></g><g transform="translate(128 164) rotate(10)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#a)" stroke="#A8420E" stroke-width="3" stroke-linejoin="round"/><path d="M0 12V-20" stroke="#A8420E" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></g><g class="npa npa-float"><g transform="translate(190 120) rotate(30)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#c)" stroke="#A8420E" stroke-width="3"/></g></g><g class="npa npa-float d2"><g transform="translate(66 110) rotate(-40)"><path d="M0 12C-16 4 -16 -16 0 -26C16 -16 16 4 0 12Z" fill="url(#b)" stroke="#A8420E" stroke-width="3"/></g></g></svg>
