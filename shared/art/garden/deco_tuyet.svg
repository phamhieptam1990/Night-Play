<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Người tuyết" class="np-deco" data-style="pop"><title>Người tuyết</title><desc>Đồ trang trí Người tuyết. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A5C"/><stop offset="1" stop-color="#E8501C"/></linearGradient></defs><ellipse cx="128" cy="240" rx="66" ry="9.2" fill="#000" opacity=".14"/><circle cx="128" cy="192" r="44" fill="url(#a)" stroke="#A9BCD2" stroke-width="4.5"/><circle cx="128" cy="124" r="32" fill="url(#a)" stroke="#A9BCD2" stroke-width="4.5"/><g class="npa npa-sway"><path d="M98 96L158 96L152 64Q128 54 104 64Z" fill="#3A4A7A" stroke="#222E54" stroke-width="4" stroke-linejoin="round"/><rect x="92" y="94" width="72" height="9" rx="4.5" fill="#3A4A7A" stroke="#222E54" stroke-width="3.5"/></g><path d="M100 150Q128 166 156 150L152 162Q128 176 104 162Z" fill="#E03A3A" stroke="#A82424" stroke-width="3.5" stroke-linejoin="round"/><path d="M148 156L160 178L148 176Z" fill="#E03A3A" stroke="#A82424" stroke-width="3" stroke-linejoin="round"/><circle cx="116" cy="120" r="3.6" fill="#2A2A3A"/><circle cx="140" cy="120" r="3.6" fill="#2A2A3A"/><path d="M128 126L150 132L128 136Z" fill="url(#c)" stroke="#B8380E" stroke-width="2.6" stroke-linejoin="round"/><circle cx="128" cy="178" r="4" fill="#2A2A3A"/><circle cx="128" cy="196" r="4" fill="#2A2A3A"/><circle cx="128" cy="212" r="4" fill="#2A2A3A"/><path d="M86 168L58 150M170 168L198 150" stroke="#8A6B3F" stroke-width="5" stroke-linecap="round"/><path d="M62 152L52 144M62 152L54 160M194 152L204 144M194 152L202 160" stroke="#8A6B3F" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="106" cy="176" rx="8" ry="14" fill="#fff" opacity=".5" transform="rotate(20 106 176)"/></svg>
