<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bác Rễ, người làm vườn (bé nhỏ, cấp 1: Chồi non)" class="np-mascot sk-l1" data-mascot="gardener" data-who="chung" data-age="nho" data-level="1" data-style="pop" data-game="garden-gardener">
<title>Bác Rễ (bé nhỏ, cấp 1: Chồi non)</title><desc>Chữ ký khuôn mặt: chân mày nhướn nhẹ, nụ cười hiền, râu ba nhánh rễ. Đạo cụ: bình tưới (cấp 3 trở lên).</desc><style>.np-mascot{--ink:#3B2414;--b1:#F4CC90;--b2:#DCA05C;--bd:#A4662E;--h1:#F9E39A;--h2:#EBBC4E;--h3:#B88420;--rb:#E5484D;--rbd:#A52A2E;--l1:#86E29A;--l2:#34B461;--l3:#1F7F43;--c1:#6ACDEB;--c2:#2E9BC4;--c3:#1F6F8E;--bl:#FF9AAE;--ap:#58BD70;--apd:#2E7F45;}.npa{transform-box:fill-box}.npa-bob{transform-origin:50% 100%;animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){.npa-bob,.npa-blink{animation:none}}html.np-playing .npa-bob,html.np-playing .npa-blink{animation:none}</style><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--b1)"/><stop offset="1" style="stop-color:var(--b2)"/></linearGradient><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--h1)"/><stop offset="1" style="stop-color:var(--h2)"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--l1)"/><stop offset="1" style="stop-color:var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="240" rx="58" ry="8" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path id="body" d="M128 70C70 70 46 120 52 166C58 210 92 232 128 232C164 232 198 210 204 166C210 120 186 70 128 70Z" fill="url(#gb)" stroke="var(--bd)" stroke-width="4" stroke-linejoin="round"/><ellipse cx="96" cy="150" rx="11" ry="24" fill="#fff" opacity=".35" transform="rotate(8 96 150)"/><path d="M113 188Q107 204 98 211M128 192Q129 210 126 222M143 188Q149 204 158 211" fill="none" stroke="var(--bd)" stroke-width="5" stroke-linecap="round"/><ellipse cx="56" cy="178" rx="14" ry="13" fill="var(--b2)" stroke="var(--bd)" stroke-width="3"/><ellipse cx="200" cy="178" rx="14" ry="13" fill="var(--b2)" stroke="var(--bd)" stroke-width="3"/><g id="face"><path d="M86 112Q100 104 114 112M142 112Q156 104 170 112" fill="none" stroke="var(--bd)" stroke-width="4.5" stroke-linecap="round"/><g id="eyes" class="npa-blink"><circle cx="100" cy="134" r="13" fill="var(--ink)"/><circle cx="104.94" cy="129.06" r="4.94" fill="#fff"/><circle cx="95.45" cy="138.94" r="2.47" fill="#fff" opacity=".9"/><circle cx="156" cy="134" r="13" fill="var(--ink)"/><circle cx="160.94" cy="129.06" r="4.94" fill="#fff"/><circle cx="151.45" cy="138.94" r="2.47" fill="#fff" opacity=".9"/></g><ellipse cx="82" cy="154" rx="12" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="174" cy="154" rx="12" ry="7" fill="var(--bl)" opacity=".75"/><path id="mouth" d="M112 158Q128 174 144 158" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/></g><g id="acc-sprout"><path d="M128 72C128 56 126 46 124 38" stroke="var(--l3)" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M124 42C108 44 96 34 94 20C110 20 122 28 124 42Z" fill="url(#gl)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M126 46C142 46 156 36 158 22C142 22 128 30 126 46Z" fill="url(#gl)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/></g></g>
</svg>
