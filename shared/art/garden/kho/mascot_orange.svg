<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cam Cam" class="np-mascot sk-default" data-style="pop" data-game="garden-orange">
<title>Cam Cam</title>
<desc>Linh vật Cam Cam (phong cách Pop). Chữ ký khuôn mặt: chấm rốn cam nhỏ trên đỉnh + hai lá đôi như tai thỏ + mắt tròn xoe. Đạo cụ nhận diện: cờ nhỏ (Tiếng Anh).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFB45A;--c2:#F7780F;--st:#C55A06;--bl:#FF8F7A;--l1:#7BE08A;--l2:#2FAE5B;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><path d="M126 60C108 40 84 38 72 48C84 66 108 70 126 60Z" fill="url(#GL-orange)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><path d="M130 60C148 40 172 38 184 48C172 66 148 70 130 60Z" fill="url(#GL-orange)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="146" r="88" fill="url(#GB-orange)" stroke="var(--st)" stroke-width="3"/><circle cx="128" cy="62" r="6" fill="var(--st)" opacity=".7"/><circle cx="84" cy="200" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="98" cy="214" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="116" cy="222" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="140" cy="222" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="158" cy="214" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="172" cy="200" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="70" cy="178" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="186" cy="178" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="76" cy="106" r="2.4" fill="var(--st)" opacity=".45"/><circle cx="180" cy="106" r="2.4" fill="var(--st)" opacity=".45"/><ellipse cx="90" cy="104" rx="18" ry="10" fill="#fff" opacity=".5" transform="rotate(-30 90 104)"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="122" r="14" fill="var(--ink)"/><circle cx="107" cy="116.5" r="5.2" fill="#fff"/><circle cx="97.5" cy="127" r="2.6" fill="#fff" opacity=".9"/><circle cx="154" cy="122" r="14" fill="var(--ink)"/><circle cx="159" cy="116.5" r="5.2" fill="#fff"/><circle cx="149.5" cy="127" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="78" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="178" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M112 148Q128 172 144 148Q128 154 112 148Z" fill="#8A2B3A" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="128" cy="157" rx="9" ry="5" fill="#FF8FA3"/></g></g>
<g id="prop"><path d="M204 206V138" stroke="#8A5A2B" stroke-width="5" stroke-linecap="round"/><path d="M206 140H238L230 152L238 164H206Z" fill="#fff" stroke="#C73E33" stroke-width="3" stroke-linejoin="round"/><path d="M206 146H236M206 158H236" stroke="#E5484D" stroke-width="4"/><rect x="206" y="140" width="12" height="24" fill="#3B6FE0"/><ellipse cx="200" cy="192" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
