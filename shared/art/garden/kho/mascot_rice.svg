<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Lúa Nước" class="np-mascot sk-default" data-style="pop" data-game="garden-crop-rice">
<title>Lúa Nước</title><desc>Linh vật Lúa Nước (phong cách Pop) trong kho nông sản. Chữ ký khuôn mặt: bông lúa cong rủ trên đầu + chân mày cong cười hiền. Đạo cụ nhận diện môn: quyển sách.</desc><style>.np-mascot{--ink:#2A2350;--c1:#FFE98A;--c2:#F2B52E;--st:#B98410;--bl:#FF9D7A;--l1:#C6F08A;--l2:#7DC54A;--l3:#4F8F2A}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-box:fill-box;transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa,:root.np-playing .npa-blink{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-blink{animation:none}}</style><defs><linearGradient id="GB-rice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-rice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="246" rx="64" ry="7" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path d="M128 84C120 60 100 40 78 40" fill="none" stroke="var(--l3)" stroke-width="4" stroke-linecap="round"/><ellipse cx="110" cy="46" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(-60 110 46)"/><ellipse cx="96" cy="40" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(-60 96 40)"/><ellipse cx="82" cy="40" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(-60 82 40)"/><ellipse cx="70" cy="46" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(-60 70 46)"/><path d="M128 84C128 52 140 30 160 22" fill="none" stroke="var(--l3)" stroke-width="4" stroke-linecap="round"/><ellipse cx="134" cy="38" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(30 134 38)"/><ellipse cx="142" cy="30" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(30 142 30)"/><ellipse cx="152" cy="24" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(30 152 24)"/><ellipse cx="160" cy="24" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(30 160 24)"/><path d="M128 84C140 62 168 54 190 62" fill="none" stroke="var(--l3)" stroke-width="4" stroke-linecap="round"/><ellipse cx="146" cy="62" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(70 146 62)"/><ellipse cx="160" cy="58" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(70 160 58)"/><ellipse cx="174" cy="58" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(70 174 58)"/><ellipse cx="186" cy="64" rx="6.5" ry="10" fill="#FFD04D" stroke="var(--st)" stroke-width="2.2" transform="rotate(70 186 64)"/><path d="M128 76C70 76 50 132 56 178C62 220 98 238 128 238C158 238 194 220 200 178C206 132 186 76 128 76Z" fill="url(#GB-rice)" stroke="var(--st)" stroke-width="3.5" stroke-linejoin="round"/><path d="M86 112Q80 160 90 210M170 112Q176 160 166 210" fill="none" stroke="var(--st)" stroke-width="3" stroke-linecap="round" opacity="0.35"/><ellipse cx="92" cy="112" rx="12" ry="22" fill="#fff" opacity=".5" transform="rotate(8 92 112)"/><ellipse cx="54" cy="196" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="200" cy="196" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><g id="face" transform="translate(128 156) scale(1)"><g class="npa-blink"><circle cx="-26" cy="0" r="12.5" fill="#2A2350"/><circle cx="-21.25" cy="-4.75" r="4.75" fill="#fff"/><circle cx="-30.375" cy="4.75" r="2.375" fill="#fff" opacity=".9"/><circle cx="26" cy="0" r="12.5" fill="#2A2350"/><circle cx="30.75" cy="-4.75" r="4.75" fill="#fff"/><circle cx="21.625" cy="4.75" r="2.375" fill="#fff" opacity=".9"/></g><ellipse cx="-46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><ellipse cx="46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><path d="M-11 10Q0 34 11 10Z" fill="#7A2230" stroke="#2A2350" stroke-width="2.6" stroke-linejoin="round"/><path d="M-5 22Q0 28 5 22" fill="#FF7A8A"/><path d="M-40 -24Q-26 -36 -12 -24M12 -24Q26 -36 40 -24" fill="none" stroke="var(--st)" stroke-width="4" stroke-linecap="round"/></g><g id="prop"><rect x="182" y="152" width="46" height="38" rx="8" fill="#38BDF8" stroke="#0B76B5" stroke-width="3"/><rect x="188" y="158" width="34" height="26" rx="4" fill="#fff"/><path d="M194 166H216M194 173H210M194 180H214" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/></g></g>
</svg>
