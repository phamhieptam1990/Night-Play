<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cà Chua" class="np-mascot sk-default" data-style="pop" data-game="garden-tomato">
<title>Cà Chua</title>
<desc>Linh vật Cà Chua (phong cách Pop). Chữ ký khuôn mặt: nốt tàn nhang ba chấm trên má trái + một lọn lá xoăn trên đỉnh. Đạo cụ nhận diện: cờ nhỏ (Tiếng Anh).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FF7A66;--c2:#E5382B;--st:#B02418;--bl:#FF9DB0;--l1:#7BE08A;--l2:#2FAE5B;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-tomato" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-tomato" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><ellipse cx="128" cy="144" rx="94" ry="86" fill="url(#GB-tomato)" stroke="var(--st)" stroke-width="3"/><path d="M128 66L112 52L96 64L108 74L98 90L118 82L128 96L138 82L158 90L148 74L160 64L144 52Z" fill="url(#GL-tomato)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><path d="M128 66Q128 46 144 38Q156 34 160 42" fill="none" stroke="var(--lst)" stroke-width="5" stroke-linecap="round"/><path d="M150 40Q166 30 168 46" fill="none" stroke="var(--l2)" stroke-width="4" stroke-linecap="round"/><ellipse cx="88" cy="110" rx="18" ry="10" fill="#fff" opacity=".5" transform="rotate(-30 88 110)"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="120" r="14" fill="var(--ink)"/><circle cx="105" cy="114.5" r="5.2" fill="#fff"/><circle cx="95.5" cy="125" r="2.6" fill="#fff" opacity=".9"/><circle cx="156" cy="120" r="14" fill="var(--ink)"/><circle cx="161" cy="114.5" r="5.2" fill="#fff"/><circle cx="151.5" cy="125" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="78" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="178" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><circle cx="72" cy="150" r="2.6" fill="var(--st)" opacity=".6"/><circle cx="82" cy="156" r="2.6" fill="var(--st)" opacity=".6"/><circle cx="68" cy="160" r="2.6" fill="var(--st)" opacity=".6"/><path d="M108 150Q128 172 148 150" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/></g></g>
<g id="prop"><path d="M204 206V138" stroke="#8A5A2B" stroke-width="5" stroke-linecap="round"/><path d="M206 140H238L230 152L238 164H206Z" fill="#fff" stroke="#C73E33" stroke-width="3" stroke-linejoin="round"/><path d="M206 146H236M206 158H236" stroke="#E5484D" stroke-width="4"/><rect x="206" y="140" width="12" height="24" fill="#3B6FE0"/><ellipse cx="200" cy="192" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
