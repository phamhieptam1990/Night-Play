<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bí Đỏ" class="np-mascot sk-default" data-style="pop" data-game="garden-crop-pumpkin">
<title>Bí Đỏ</title><desc>Linh vật Bí Đỏ (phong cách Pop) trong kho nông sản. Chữ ký khuôn mặt: đường vân múi bí dọc thân + râu xoắn xanh cạnh cuống. Đạo cụ nhận diện môn: cờ nhỏ.</desc><style>.np-mascot{--ink:#2A2350;--c1:#FFB45A;--c2:#F2701C;--st:#B84E0E;--bl:#FF8F7A;--l1:#7BE08A;--l2:#2FAE5B;--l3:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-box:fill-box;transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa,:root.np-playing .npa-blink{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-blink{animation:none}}</style><defs><linearGradient id="GB-pumpkin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-pumpkin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="246" rx="64" ry="7" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path d="M128 84Q124 60 134 44" fill="none" stroke="#7A5428" stroke-width="12" stroke-linecap="round"/><path d="M128 84Q124 60 134 44" fill="none" stroke="#A4743A" stroke-width="6" stroke-linecap="round"/><path d="M140 56C156 34 190 36 202 52C186 72 160 74 140 56Z" fill="url(#GL-pumpkin)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M142 50Q124 30 108 40Q96 48 104 58" fill="none" stroke="var(--l3)" stroke-width="4" stroke-linecap="round"/><ellipse cx="128" cy="154" rx="96" ry="78" fill="url(#GB-pumpkin)" stroke="var(--st)" stroke-width="3.5"/><path d="M112 80C80 110 80 200 112 230M144 80C176 110 176 200 144 230M84 94C48 124 52 190 84 218M172 94C208 124 204 190 172 218" fill="none" stroke="var(--st)" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/><ellipse cx="82" cy="118" rx="14" ry="24" fill="#fff" opacity=".5" transform="rotate(20 82 118)"/><ellipse cx="54" cy="196" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="200" cy="196" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><g id="face" transform="translate(128 152) scale(1.1)"><g class="npa-blink"><circle cx="-26" cy="0" r="12.5" fill="#2A2350"/><circle cx="-21.25" cy="-4.75" r="4.75" fill="#fff"/><circle cx="-30.375" cy="4.75" r="2.375" fill="#fff" opacity=".9"/><circle cx="26" cy="0" r="12.5" fill="#2A2350"/><circle cx="30.75" cy="-4.75" r="4.75" fill="#fff"/><circle cx="21.625" cy="4.75" r="2.375" fill="#fff" opacity=".9"/></g><ellipse cx="-46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><ellipse cx="46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><path d="M-11 10Q0 34 11 10Z" fill="#7A2230" stroke="#2A2350" stroke-width="2.6" stroke-linejoin="round"/><path d="M-5 22Q0 28 5 22" fill="#FF7A8A"/></g><g id="prop"><path d="M204 200V132" stroke="#8A5A2B" stroke-width="5" stroke-linecap="round"/><path d="M206 134H238L230 146L238 158H206Z" fill="#fff" stroke="#C73E33" stroke-width="3" stroke-linejoin="round"/><path d="M206 140H236M206 152H236" stroke="#E5484D" stroke-width="4"/></g></g>
</svg>
