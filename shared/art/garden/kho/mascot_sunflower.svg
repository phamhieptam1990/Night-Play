<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Hướng Dương" class="np-mascot sk-default" data-style="pop" data-game="garden-sunflower">
<title>Hướng Dương</title>
<desc>Linh vật Hướng Dương (phong cách Pop). Chữ ký khuôn mặt: vành cánh hoa như bờm sư tử + hai chân mày nhướn ngạc nhiên + nhụy nâu có hạt. Đạo cụ nhận diện: quyển sách (Tiếng Việt).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFE066;--c2:#FFB400;--st:#C98300;--bl:#FF9D7A;--l1:#7BE08A;--l2:#2FAE5B;--lst:#1F7F43;--d1:#F2B65E;--d2:#C98B3C}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-sunflower" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-sunflower" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient><radialGradient id="GD-sunflower" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="var(--d1)"/><stop offset="1" stop-color="var(--d2)"/></radialGradient></defs>
