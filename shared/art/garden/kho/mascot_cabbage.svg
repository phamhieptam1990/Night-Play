<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cải Bắp" class="np-mascot sk-default" data-style="pop" data-game="garden-crop-cabbage">
<title>Cải Bắp</title><desc>Linh vật Cải Bắp (phong cách Pop) trong kho nông sản. Chữ ký khuôn mặt: nếp lá cuộn tròn quanh mặt + hai lá ngoài như đôi tay ôm. Đạo cụ nhận diện môn: quyển sách.</desc><style>.np-mascot{--ink:#2A2350;--c1:#C8F29A;--c2:#5FC25E;--st:#2E8A3E;--bl:#FF9DB0;--l1:#E1FAC2;--l2:#8FDC7A;--l3:#2E8A3E}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-box:fill-box;transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa,:root.np-playing .npa-blink{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-blink{animation:none}}</style><defs><linearGradient id="GB-cabbage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-cabbage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="246" rx="64" ry="7" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path d="M128 232C60 236 30 190 40 140C74 150 108 186 128 232Z" fill="url(#GL-cabbage)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M128 232C196 236 226 190 216 140C182 150 148 186 128 232Z" fill="url(#GL-cabbage)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="142" r="88" fill="url(#GB-cabbage)" stroke="var(--st)" stroke-width="3.5"/><path d="M60 104Q92 70 128 70Q164 70 196 104M52 150Q60 112 96 94M204 150Q196 112 160 94M128 70Q112 84 106 108" fill="none" stroke="var(--st)" stroke-width="3" stroke-linecap="round" opacity="0.45"/><ellipse cx="88" cy="100" rx="16" ry="9" fill="#fff" opacity=".5" transform="rotate(-30 88 100)"/><ellipse cx="54" cy="196" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="200" cy="196" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><g id="face" transform="translate(128 142) scale(1.05)"><g class="npa-blink"><circle cx="-26" cy="0" r="12.5" fill="#2A2350"/><circle cx="-21.25" cy="-4.75" r="4.75" fill="#fff"/><circle cx="-30.375" cy="4.75" r="2.375" fill="#fff" opacity=".9"/><circle cx="26" cy="0" r="12.5" fill="#2A2350"/><circle cx="30.75" cy="-4.75" r="4.75" fill="#fff"/><circle cx="21.625" cy="4.75" r="2.375" fill="#fff" opacity=".9"/></g><ellipse cx="-46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><ellipse cx="46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><path d="M-11 10Q0 34 11 10Z" fill="#7A2230" stroke="#2A2350" stroke-width="2.6" stroke-linejoin="round"/><path d="M-5 22Q0 28 5 22" fill="#FF7A8A"/></g><g id="prop"><rect x="182" y="152" width="46" height="38" rx="8" fill="#38BDF8" stroke="#0B76B5" stroke-width="3"/><rect x="188" y="158" width="34" height="26" rx="4" fill="#fff"/><path d="M194 166H216M194 173H210M194 180H214" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/></g></g>
</svg>
