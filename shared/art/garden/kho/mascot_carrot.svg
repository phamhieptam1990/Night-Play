<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cà Rốt" class="np-mascot sk-default" data-style="pop" data-game="garden-carrot">
<title>Cà Rốt</title>
<desc>Linh vật Cà Rốt (phong cách Pop). Chữ ký khuôn mặt: ba túm lá xanh như tóc mohican + hai chân mày nhướn lên vui. Đạo cụ nhận diện: khối cộng (Toán).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFB04D;--c2:#F2701C;--st:#C75A12;--bl:#FF8F7A;--l1:#7BE08A;--l2:#2FAE5B;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-carrot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-carrot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><path d="M128 62C108 52 94 28 102 12C118 18 126 38 128 62Z" fill="url(#GL-carrot)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><path d="M128 62C148 52 162 28 154 12C138 18 130 38 128 62Z" fill="url(#GL-carrot)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><path d="M128 66C118 46 120 22 128 8C136 22 138 46 128 66Z" fill="url(#GL-carrot)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><path d="M128 62C70 60 50 108 66 152C82 198 112 232 128 238C144 232 174 198 190 152C206 108 186 60 128 62Z" fill="url(#GB-carrot)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M70 120Q82 118 90 124M166 124Q174 118 186 120M84 176Q96 172 104 178M152 178Q160 172 172 176" stroke="var(--st)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".55"/><ellipse cx="98" cy="92" rx="16" ry="9" fill="#fff" opacity=".5" transform="rotate(-28 98 92)"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><path d="M89 96Q100 89 111 96" fill="none" stroke="var(--st)" stroke-width="4" stroke-linecap="round" transform="rotate(-12 100 96)"/><path d="M145 96Q156 89 167 96" fill="none" stroke="var(--st)" stroke-width="4" stroke-linecap="round" transform="rotate(12 156 96)"/><circle cx="100" cy="116" r="14" fill="var(--ink)"/><circle cx="105" cy="110.5" r="5.2" fill="#fff"/><circle cx="95.5" cy="121" r="2.6" fill="#fff" opacity=".9"/><circle cx="156" cy="116" r="14" fill="var(--ink)"/><circle cx="161" cy="110.5" r="5.2" fill="#fff"/><circle cx="151.5" cy="121" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="78" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="178" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M110 143Q128 172 146 143Q128 150 110 143Z" fill="#8A2B3A" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="128" cy="157" rx="9" ry="5" fill="#FF8FA3"/></g></g>
<g id="prop"><rect x="186" y="150" width="44" height="44" rx="12" fill="#7C5CFF" stroke="#4B33B5" stroke-width="3"/><path d="M208 160V184M196 172H220" stroke="#fff" stroke-width="7" stroke-linecap="round"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
