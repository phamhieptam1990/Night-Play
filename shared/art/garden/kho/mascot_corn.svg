FF3A8" stroke="var(--st)" stroke-width="1.6" opacity=".95"/><ellipse cx="105" cy="213" rx="8.5" ry="6.5" fill="#FFF3A8" stroke="var(--st)" stroke-width="1.6" opacity=".95"/><ellipse cx="128" cy="213" rx="8.5" ry="6.5" fill="#FFF3A8" stroke="var(--st)" stroke-width="1.6" opacity=".95"/><ellipse cx="151" cy="213" rx="8.5" ry="6.5" fill="#FFF3A8" stroke="var(--st)" stroke-width="1.6" opacity=".95"/><ellipse cx="174" cy="213" rx="8.5" ry="6.5" fill="#FFF3A8" stroke="var(--st)" stroke-width="1.6" opacity=".95"/><path d="M128 238C78 232 52 200 56 160C86 180 112 204 128 238Z" fill="url(#GL-corn)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><path d="M128 238C178 232 204 200 200 160C170 180 144 204 128 238Z" fill="url(#GL-corn)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="96" cy="84" rx="14" ry="8" fill="#fff" opacity=".5" transform="rotate(-28 96 84)"/></g>
