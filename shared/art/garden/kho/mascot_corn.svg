<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bắp Bắp" class="np-mascot sk-default" data-style="pop" data-game="garden-corn">
<title>Bắp Bắp</title>
<desc>Linh vật Bắp Bắp (phong cách Pop). Chữ ký khuôn mặt: hai lọn râu bắp rủ hai bên + mắt tròn lấp lánh + nụ cười hở răng. Đạo cụ nhận diện: khối cộng (Toán).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFE97A;--c2:#F5B800;--st:#C98C00;--bl:#FF9D7A;--l1:#9BE88A;--l2:#34B461;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-corn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-corn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
