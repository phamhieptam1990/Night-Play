2" transform="rotate(14 128 37)"/><ellipse cx="128" cy="26" rx="6.5" ry="10" fill="#FFD04D" stroke="#C98410" stroke-width="2.2" transform="rotate(-14 128 26)"/><path d="M128 8V36" stroke="#C98410" stroke-width="3" stroke-linecap="round"/></g><ellipse cx="128" cy="150" rx="76" ry="88" fill="url(#GB-wheat)" stroke="var(--st)" stroke-width="3"/><path d="M66 188Q128 210 190 188V206Q128 228 66 206Z" fill="#E5484D" stroke="#B02418" stroke-width="3" stroke-linejoin="round"/><ellipse cx="98" cy="100" rx="16" ry="9" fill="#fff" opacity=".5" transform="rotate(-28 98 100)"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><path d="M88 118Q100 102 112 118M144 118Q156 102 168 118" fill="none" stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round"/><ellipse cx="78" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="178" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M110 143Q128 172 146 143Q128 150 110 143Z" fill="#8A2B3A" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="128" cy="157" rx="9" ry="5" fill="#FF8FA3"/></g></g>
<g id="prop"><rect x="184" y="156" width="46" height="38" rx="8" fill="#38BDF8" stroke="#0B76B5" stroke-width="3"/><rect x="190" y="162" width="34" height="26" rx="4" fill="#fff"/><path d="M196 170H218M196 177H212M196 184H216" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
