<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bông Lúa" class="np-mascot sk-default" data-style="pop" data-game="garden-wheat">
<title>Bông Lúa</title>
<desc>Linh vật Bông Lúa (phong cách Pop). Chữ ký khuôn mặt: ba bông lúa như chỏm tóc + một dải nơ đỏ ở bụng + mắt cười cong. Đạo cụ nhận diện: quyển sách (Tiếng Việt).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFDD7A;--c2:#F2A91E;--st:#C98410;--bl:#FF9D7A;--l1:#FFE9A8;--l2:#E8B440;--lst:#B8860B}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-wheat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-wheat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
