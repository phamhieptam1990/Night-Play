<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Táo Đỏ" class="np-mascot sk-default" data-style="pop" data-game="garden-apple">
<title>Táo Đỏ</title>
<desc>Linh vật Táo Đỏ (phong cách Pop). Chữ ký khuôn mặt: cuống nâu nghiêng + một lá xanh to + vệt bóng trắng hình trăng khuyết + mắt cười híp. Đạo cụ nhận diện: quyển sách (Tiếng Việt).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FF7A7A;--c2:#D9232D;--st:#A8141E;--bl:#FFB09D;--l1:#7BE08A;--l2:#2FAE5B;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-apple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-apple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><path d="M128 78C100 52 50 64 50 118C50 178 90 236 128 226C166 236 206 178 206 118C206 64 156 52 128 78Z" fill="url(#GB-apple)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M130 78Q128 54 142 36" fill="none" stroke="#8A5A2B" stroke-width="7" stroke-linecap="round"/><path d="M140 42C152 14 186 10 206 28C192 52 164 58 140 42Z" fill="url(#GL-apple)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><path d="M76 100Q74 124 84 146" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".55"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="122" r="14" fill="var(--ink)"/><circle cx="107" cy="116.5" r="5.2" fill="#fff"/><circle cx="97.5" cy="127" r="2.6" fill="#fff" opacity=".9"/><circle cx="154" cy="122" r="14" fill="var(--ink)"/><circle cx="159" cy="116.5" r="5.2" fill="#fff"/><circle cx="149.5" cy="127" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="78" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="178" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M110 148Q128 168 146 148" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/><path d="M96 108Q104 100 112 108M144 108Q152 100 160 108" fill="none" stroke="var(--ink)" stroke-width="0"/></g></g>
<g id="prop"><rect x="184" y="156" width="46" height="38" rx="8" fill="#38BDF8" stroke="#0B76B5" stroke-width="3"/><rect x="190" y="162" width="34" height="26" rx="4" fill="#fff"/><path d="M196 170H218M196 177H212M196 184H216" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
