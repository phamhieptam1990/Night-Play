<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Lê Lê" class="np-mascot sk-default" data-style="pop" data-game="garden-pear">
<title>Lê Lê</title>
<desc>Linh vật Lê Lê (phong cách Pop). Chữ ký khuôn mặt: thân hình giọt nước hai tầng + chấm đốm xanh trên má + mắt lim dim hiền. Đạo cụ nhận diện: khối cộng (Toán).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#E4F07A;--c2:#A8D13E;--st:#6E9A22;--bl:#FFB09D;--l1:#7BE08A;--l2:#2FAE5B;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-pear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-pear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><path d="M128 40C100 40 102 76 92 100C58 128 48 164 64 200C82 236 174 236 192 200C208 164 198 128 164 100C154 76 156 40 128 40Z" fill="url(#GB-pear)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M128 42Q128 24 140 14" fill="none" stroke="#8A5A2B" stroke-width="6" stroke-linecap="round"/><path d="M138 24C150 6 176 6 190 20C178 38 154 40 138 24Z" fill="url(#GL-pear)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><circle cx="78" cy="176" r="3" fill="var(--st)" opacity=".4"/><circle cx="86" cy="196" r="3" fill="var(--st)" opacity=".4"/><circle cx="176" cy="184" r="3" fill="var(--st)" opacity=".4"/><circle cx="168" cy="204" r="3" fill="var(--st)" opacity=".4"/><ellipse cx="96" cy="134" rx="13" ry="8" fill="#fff" opacity=".5" transform="rotate(-26 96 134)"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><path d="M88 124Q100 112 112 124M144 124Q156 112 168 124" fill="none" stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round"/><ellipse cx="100" cy="123" rx="2.6" ry="2" fill="var(--ink)"/><ellipse cx="156" cy="123" rx="2.6" ry="2" fill="var(--ink)"/><ellipse cx="82" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="174" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M112 152Q128 166 144 152" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/></g></g>
<g id="prop"><rect x="186" y="150" width="44" height="44" rx="12" fill="#7C5CFF" stroke="#4B33B5" stroke-width="3"/><path d="M208 160V184M196 172H220" stroke="#fff" stroke-width="7" stroke-linecap="round"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
