<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Xoài Ngọt" class="np-mascot sk-default" data-style="pop" data-game="garden-mango">
<title>Xoài Ngọt</title>
<desc>Linh vật Xoài Ngọt (phong cách Pop). Chữ ký khuôn mặt: má lúm đồng tiền bên phải + một lá xoài dài nghiêng + mắt lấp lánh nghiêng nhẹ. Đạo cụ nhận diện: khối cộng (Toán).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFD95A;--c2:#FF9A3C;--st:#D9701A;--bl:#FF8F7A;--l1:#7BE08A;--l2:#2FAE5B;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-mango" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-mango" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><path d="M128 70Q128 52 140 44" fill="none" stroke="#8A5A2B" stroke-width="7" stroke-linecap="round"/><path d="M140 46C150 20 184 14 204 30C190 52 164 58 140 46Z" fill="url(#GL-mango)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><path d="M144 44Q172 34 198 30" fill="none" stroke="var(--lst)" stroke-width="2.6" stroke-linecap="round"/><path d="M122 66C70 62 44 110 54 156C64 204 104 236 140 232C186 226 214 178 204 122C196 82 160 62 122 66Z" fill="url(#GB-mango)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M184 112C196 140 192 184 160 212" fill="none" stroke="#FF7A4A" stroke-width="10" stroke-linecap="round" opacity=".35"/><ellipse cx="86" cy="100" rx="16" ry="10" fill="#fff" opacity=".5" transform="rotate(-30 86 100)"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="120" r="14" fill="var(--ink)"/><circle cx="105" cy="114.5" r="5.2" fill="#fff"/><circle cx="95.5" cy="125" r="2.6" fill="#fff" opacity=".9"/><circle cx="156" cy="118" r="14" fill="var(--ink)"/><circle cx="161" cy="112.5" r="5.2" fill="#fff"/><circle cx="151.5" cy="123" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="78" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="178" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M112 146Q128 164 144 146" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/><path d="M154 152Q160 156 156 162" fill="none" stroke="var(--st)" stroke-width="3.2" stroke-linecap="round"/></g></g>
<g id="prop"><rect x="186" y="150" width="44" height="44" rx="12" fill="#7C5CFF" stroke="#4B33B5" stroke-width="3"/><path d="M208 160V184M196 172H220" stroke="#fff" stroke-width="7" stroke-linecap="round"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
