<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Dâu Dâu" class="np-mascot sk-default" data-style="pop" data-game="garden-strawberry">
<title>Dâu Dâu</title>
<desc>Linh vật Dâu Dâu (phong cách Pop). Chữ ký khuôn mặt: hạt dâu vàng nhỏ khắp thân + miệng chữ ω (mèo con) + nơ lá xanh. Đạo cụ nhận diện: cờ nhỏ (Tiếng Anh).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FF7A95;--c2:#E0334F;--st:#B01E3B;--bl:#FFB6C8;--l1:#7BE08A;--l2:#2FAE5B;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-strawberry" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-strawberry" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><path d="M128 234C72 208 44 150 52 108C60 70 98 64 128 82C158 64 196 70 204 108C212 150 184 208 128 234Z" fill="url(#GB-strawberry)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="70" cy="180" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="90" cy="206" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="112" cy="196" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="146" cy="196" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="168" cy="206" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="186" cy="180" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="160" cy="172" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="96" cy="172" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="128" cy="214" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="64" cy="150" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="192" cy="150" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><ellipse cx="128" cy="186" rx="3.6" ry="5.6" fill="#FFE27A" stroke="var(--st)" stroke-width="1.5" opacity=".95"/><path d="M128 84L106 62L84 70L100 84L84 98L110 92L128 100L146 92L172 98L156 84L172 70L150 62Z" fill="url(#GL-strawberry)" stroke="var(--lst)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="92" cy="104" rx="16" ry="9" fill="#fff" opacity=".5" transform="rotate(-30 92 104)"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="124" r="14" fill="var(--ink)"/><circle cx="105" cy="118.5" r="5.2" fill="#fff"/><circle cx="95.5" cy="129" r="2.6" fill="#fff" opacity=".9"/><circle cx="156" cy="124" r="14" fill="var(--ink)"/><circle cx="161" cy="118.5" r="5.2" fill="#fff"/><circle cx="151.5" cy="129" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="78" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="178" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M110 152Q119 164 128 154Q137 164 146 152" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="prop"><path d="M204 206V138" stroke="#8A5A2B" stroke-width="5" stroke-linecap="round"/><path d="M206 140H238L230 152L238 164H206Z" fill="#fff" stroke="#C73E33" stroke-width="3" stroke-linejoin="round"/><path d="M206 146H236M206 158H236" stroke="#E5484D" stroke-width="4"/><rect x="206" y="140" width="12" height="24" fill="#3B6FE0"/><ellipse cx="200" cy="192" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
