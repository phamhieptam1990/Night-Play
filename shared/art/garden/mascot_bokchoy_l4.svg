<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cải Xanh (linh vật cấp 4 vương miện)" class="np-mascot sk-l4 em-happy" data-style="pop" data-game="garden-crop-bokchoy" data-level="4">
<title>Cải Xanh (linh vật cấp 4 vương miện)</title><desc>Chữ ký khuôn mặt: mắt tròn hai điểm sáng, má hồng; riêng Cải Xanh: hai chân mày nhướn vui + búi lá xanh bung như mái tóc. Mỗi cấp thêm một thứ: khăn đỏ, huy chương, vương miện.</desc><style>.np-mascot{--ink:#2A2350;--c1:#FFFFFF;--c2:#D4EBC2;--st:#8DB07A;--bl:#FF9DB0;--l1:#7EE08F;--l2:#34B461;--l3:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-box:fill-box;transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa,:root.np-playing .npa-blink{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-blink{animation:none}}</style><defs><linearGradient id="GB-bokchoy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-bokchoy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="246" rx="64" ry="7" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path d="M128 90C96 80 70 46 84 14C112 20 134 52 128 90Z" fill="url(#GL-bokchoy)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M128 90C160 80 186 46 172 14C144 20 122 52 128 90Z" fill="url(#GL-bokchoy)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M128 84C112 60 114 28 128 6C142 28 144 60 128 84Z" fill="url(#GL-bokchoy)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M128 76C66 74 46 130 54 178C62 222 100 238 128 238C156 238 194 222 202 178C210 130 190 74 128 76Z" fill="url(#GB-bokchoy)" stroke="var(--st)" stroke-width="3.5" stroke-linejoin="round"/><path d="M84 112Q78 150 86 196M172 112Q178 150 170 196" fill="none" stroke="var(--st)" stroke-width="3" stroke-linecap="round" opacity="0.35"/><ellipse cx="92" cy="120" rx="12" ry="24" fill="#fff" opacity=".5" transform="rotate(8 92 120)"/><g id="face" transform="translate(128 156) scale(1)"><g class="npa-blink"><circle cx="-26" cy="0" r="12.5" fill="#2A2350"/><circle cx="-21.25" cy="-4.75" r="4.75" fill="#fff"/><circle cx="-30.375" cy="4.75" r="2.375" fill="#fff" opacity=".9"/><circle cx="26" cy="0" r="12.5" fill="#2A2350"/><circle cx="30.75" cy="-4.75" r="4.75" fill="#fff"/><circle cx="21.625" cy="4.75" r="2.375" fill="#fff" opacity=".9"/></g><ellipse cx="-46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><ellipse cx="46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><path d="M-10 12Q0 22 10 12" fill="none" stroke="#2A2350" stroke-width="3.6" stroke-linecap="round"/><path d="M-38 -26Q-26 -34 -14 -26M14 -26Q26 -34 38 -26" fill="none" stroke="var(--st)" stroke-width="4" stroke-linecap="round"/></g><g id="acc-scarf"><path d="M62 190Q128 208 194 190" fill="none" stroke="#9E1B28" stroke-width="15" stroke-linecap="round"/><path d="M62 190Q128 208 194 190" fill="none" stroke="#E5484D" stroke-width="10" stroke-linecap="round"/><path d="M164