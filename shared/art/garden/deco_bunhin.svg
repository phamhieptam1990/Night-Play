<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bù nhìn" class="np-deco" data-style="pop"><title>Bù nhìn</title><desc>Đồ trang trí Bù nhìn. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C879"/><stop offset="1" stop-color="#D9A23E"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA8DC"/><stop offset="1" stop-color="#3F78B0"/></linearGradient><linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8A85A"/><stop offset="1" stop-color="#B97A2C"/></linearGradient></defs><ellipse cx="128" cy="240" rx="56" ry="7.8" fill="#000" opacity=".14"/><path d="M128 240V122" stroke="#8A6B3F" stroke-width="9" stroke-linecap="round"/><path d="M52 138L204 138" stroke="#8A6B3F" stroke-width="9" stroke-linecap="round"/><g class="npa npa-sway"><path d="M92 128C92 152 100 178 128 178C156 178 164 152 164 128C150 120 106 120 92 128Z" fill="url(#b)" stroke="#2A5A8A" stroke-width="4.5" stroke-linejoin="round"/><path d="M64 140L96 132L100 148L66 154ZM192 140L160 132L156 148L190 154Z" fill="url(#b)" stroke="#2A5A8A" stroke-width="4" stroke-linejoin="round"/><path d="M50 150L58 138L66 154ZM206 150L198 138L190 154Z" fill="url(#a)" stroke="#B88300" stroke-width="3" stroke-linejoin="round"/><path d="M100 178L90 214M156 178L166 214M128 178V216" stroke="#E0B55A" stroke-width="5" stroke-linecap="round"/><rect x="116" y="146" width="24" height="26" rx="5" fill="#FFB020" stroke="#C27800" stroke-width="3"/><circle cx="128" cy="100" r="28" fill="url(#a)" stroke="#B88300" stroke-width="4.5"/><path d="M82 82L174 82L162 72Q128 28 94 72Z" fill="url(#h)" stroke="#8A5A1A" stroke-width="4.5" stroke-linejoin="round"/><ellipse cx="128" cy="84" rx="48" ry="9" fill="url(#h)" stroke="#8A5A1A" stroke-width="4.5"/><path d="M110 70Q128 60 146 70" fill="none" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/><circle cx="117" cy="100" r="3.6" fill="#2A1A10"/><circle cx="139" cy="100" r="3.6" fill="#2A1A10"/><path d="M116 112Q128 122 140 112" fill="none" stroke="#2A1A10" stroke-width="3.4" stroke-linecap="round"/><circle cx="108" cy="110" r="5" fill="#FF8FA3" opacity=".6"/><circle cx="148" cy="110" r="5" fill="#FF8FA3" opacity=".6"/></g></svg>
