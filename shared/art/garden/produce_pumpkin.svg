<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bí đỏ thu hoạch" class="np-produce" data-style="pop"><title>Bí đỏ thu hoạch</title><desc>Nông sản Bí đỏ.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA64D"/><stop offset="1" stop-color="#EA6A12"/></linearGradient><linearGradient id="pu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#F2A53A"/></linearGradient></defs><style>.np-produce{--p1:#FFA64D;--p2:#EA6A12;--pd:#A8470A;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="244" rx="70" ry="9.8" fill="#000" opacity=".14"/><g transform="translate(128 232) scale(1.7)"><ellipse cx="-22" cy="-32" rx="24" ry="30" fill="url(#pg)" stroke="var(--pd)" stroke-width="3.5"/><ellipse cx="22" cy="-32" rx="24" ry="30" fill="url(#pg)" stroke="var(--pd)" stroke-width="3.5"/><ellipse cx="0" cy="-34" rx="26" ry="33" fill="url(#pg)" stroke="var(--pd)" stroke-width="3.5"/><path d="M-10 -62C-16 -40 -16 -26 -10 -6M10 -62C16 -40 16 -26 10 -6" fill="none" stroke="var(--pd)" stroke-width="2.4" opacity=".5" stroke-linecap="round"/><path d="M-4 -66L-2 -80L6 -80L4 -66Z" fill="#7A9A2A" stroke="#4F6A18" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="-14" cy="-48" rx="6" ry="12" fill="#fff" opacity=".5" transform="rotate(14 -14 -48)"/></g></svg>
