<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Lúa nước thu hoạch" class="np-produce" data-style="pop"><title>Lúa nước thu hoạch</title><desc>Nông sản Lúa nước.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#E3A82A"/></linearGradient><linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BE3FF"/><stop offset="1" stop-color="#4FB6E8"/></linearGradient></defs><style>.np-produce{--r1:#FFE27A;--r2:#E3A82A;--rd:#9C6C12;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="244" rx="70" ry="9.8" fill="#000" opacity=".14"/><g transform="translate(86 250) scale(1.5)"><g transform="translate(0 0) rotate(0)"><path d="M0 0C0 -30 2 -56 22 -72C34 -78 40 -66 38 -56" fill="none" stroke="#C99A22" stroke-width="5" stroke-linecap="round"/><ellipse cx="8" cy="-34" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(30 8 -34)"/><ellipse cx="12" cy="-39" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(44 12 -39)"/><ellipse cx="16" cy="-44" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(58 16 -44)"/><ellipse cx="20" cy="-49" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(72 20 -49)"/><ellipse cx="24" cy="-54" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(86 24 -54)"/><ellipse cx="28" cy="-59" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(100 28 -59)"/><ellipse cx="32" cy="-64" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(114 32 -64)"/></g></g><g transform="translate(120 250) scale(1.5)"><g transform="translate(0 0) rotate(8)"><path d="M0 0C0 -30 2 -56 22 -72C34 -78 40 -66 38 -56" fill="none" stroke="#C99A22" stroke-width="5" stroke-linecap="round"/><ellipse cx="8" cy="-34" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(30 8 -34)"/><ellipse cx="12" cy="-39" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(44 12 -39)"/><ellipse cx="16" cy="-44" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(58 16 -44)"/><ellipse cx="20" cy="-49" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(72 20 -49)"/><ellipse cx="24" cy="-54" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(86 24 -54)"/><ellipse cx="28" cy="-59" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(100 28 -59)"/><ellipse cx="32" cy="-64" rx="4.6" ry="8" fill="url(#rg)" stroke="var(--rd)" stroke-width="2" transform="rotate(114 32 -64)"/></g></g></svg>
