<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cải bắp giai đoạn 2" class="np-crop s2" data-style="pop"><title>Cải bắp giai đoạn 2</title><desc>Cây trồng Cải bắp, giai đoạn 2/4. Phong cách Pop, hoạt ảnh nhẹ.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7F5B0"/><stop offset="1" stop-color="#82C85C"/></linearGradient></defs><style>.np-crop{--b1:#C9F0A0;--b2:#7FC25A;--bd:#3F8A2E;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="230" rx="48" ry="11" fill="url(#sg)" stroke="#5C3A1E" stroke-width="3"/><ellipse cx="112" cy="227" rx="14" ry="3" fill="#fff" opacity=".5" transform="rotate(0 112 227)"/><g transform="translate(128 226) scale(0.7) translate(-128 -226)"><g transform="translate(128 226)"><ellipse cx="-46" cy="-14" rx="30" ry="16" fill="url(#lg)" stroke="var(--l3)" stroke-width="3" transform="rotate(-16 -46 -14)"/><ellipse cx="46" cy="-14" rx="30" ry="16" fill="url(#lg)" stroke="var(--l3)" stroke-width="3" transform="rotate(16 46 -14)"/></g><g transform="translate(128 226)"><ellipse cx="0" cy="-20" rx="26" ry="20" fill="url(#bg)" stroke="var(--bd)" stroke-width="3"/></g></g></svg>
