<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đậu thu hoạch" class="np-produce" data-style="pop"><title>Đậu thu hoạch</title><desc>Nông sản Đậu.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8E86E"/><stop offset="1" stop-color="#5FAF2E"/></linearGradient></defs><style>.np-produce{--e1:#B5E36A;--e2:#5FAF2E;--ed:#38771A;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="244" rx="70" ry="9.8" fill="#000" opacity=".14"/><g transform="translate(80 150) rotate(14) scale(1.7)"><path d="M0 0C-8 18 -6 44 8 62C16 50 14 20 4 0Z" fill="url(#eg)" stroke="var(--ed)" stroke-width="3" stroke-linejoin="round"/><circle cx="2" cy="14" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="4" cy="30" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="7" cy="46" r="2.4" fill="var(--ed)" opacity=".4"/><ellipse cx="-1" cy="22" rx="2" ry="9" fill="#fff" opacity=".5" transform="rotate(8 -1 22)"/></g><g transform="translate(120 140) rotate(2) scale(1.8)"><path d="M0 0C-8 18 -6 44 8 62C16 50 14 20 4 0Z" fill="url(#eg)" stroke="var(--ed)" stroke-width="3" stroke-linejoin="round"/><circle cx="2" cy="14" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="4" cy="30" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="7" cy="46" r="2.4" fill="var(--ed)" opacity=".4"/><ellipse cx="-1" cy="22" rx="2" ry="9" fill="#fff" opacity=".5" transform="rotate(8 -1 22)"/></g><g transform="translate(160 150) rotate(-12) scale(1.7)"><path d="M0 0C-8 18 -6 44 8 62C16 50 14 20 4 0Z" fill="url(#eg)" stroke="var(--ed)" stroke-width="3" stroke-linejoin="round"/><circle cx="2" cy="14" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="4" cy="30" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="7" cy="46" r="2.4" fill="var(--ed)" opacity=".4"/><ellipse cx="-1" cy="22" rx="2" ry="9" fill="#fff" opacity=".5" transform="rotate(8 -1 22)"/></g></svg>
