<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đậu (chín)" class="np-crop s4" data-style="pop"><title>Đậu (chín)</title><desc>Cây trồng Đậu, CHÍN, sẵn sàng thu hoạch. Phong cách Pop, hoạt ảnh nhẹ.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8E86E"/><stop offset="1" stop-color="#5FAF2E"/></linearGradient></defs><style>.np-crop{--e1:#B5E36A;--e2:#5FAF2E;--ed:#38771A;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="230" rx="48" ry="11" fill="url(#sg)" stroke="#5C3A1E" stroke-width="3"/><ellipse cx="112" cy="227" rx="14" ry="3" fill="#fff" opacity=".5" transform="rotate(0 112 227)"/><g transform="translate(128 226) scale(1.3) translate(-128 -226)"><path d="M96 230L140 70M160 230L116 70" stroke="#9A6532" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M96 230L140 70M160 230L116 70" stroke="#D6A066" stroke-width="3" stroke-linecap="round" fill="none"/><g class="npa npa-sway"><path d="M126 226C100 190 156 160 124 120C108 96 140 84 128 70" fill="none" stroke="var(--l3)" stroke-width="5" stroke-linecap="round"/><g transform="translate(112 196) rotate(-50)"><ellipse cx="0" cy="-10.799999999999999" rx="18" ry="14.4" fill="url(#lg)" stroke="var(--l3)" stroke-width="3"/><path d="M0 0V-21.599999999999998M0 -9L-9 -14.4M0 -9L9 -14.4" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".4"/></g><g transform="translate(146 168) rotate(50)"><ellipse cx="0" cy="-10.799999999999999" rx="18" ry="14.4" fill="url(#lg)" stroke="var(--l3)" stroke-width="3"/><path d="M0 0V-21.599999999999998M0 -9L-9 -14.4M0 -9L9 -14.4" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".4"/></g><g transform="translate(114 140) rotate(-50)"><ellipse cx="0" cy="-9.6" rx="16" ry="12.8" fill="url(#lg)" stroke="var(--l3)" stroke-width="3"/><path d="M0 0V-19.2M0 -8L-8 -12.8M0 -8L8 -12.8" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".4"/></g><g transform="translate(140 110) rotate(50)"><ellipse cx="0" cy="-9" rx="15" ry="12" fill="url(#lg)" stroke="var(--l3)" stroke-width="3"/><path d="M0 0V-18M0 -7.5L-7.5 -12M0 -7.5L7.5 -12" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".4"/></g></g><g transform="translate(100 156) rotate(8) scale(0.9)"><path d="M0 0C-8 18 -6 44 8 62C16 50 14 20 4 0Z" fill="url(#eg)" stroke="var(--ed)" stroke-width="3" stroke-linejoin="round"/><circle cx="2" cy="14" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="4" cy="30" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="7" cy="46" r="2.4" fill="var(--ed)" opacity=".4"/><ellipse cx="-1" cy="22" rx="2" ry="9" fill="#fff" opacity=".5" transform="rotate(8 -1 22)"/></g><g transform="translate(150 126) rotate(-6) scale(0.85)"><path d="M0 0C-8 18 -6 44 8 62C16 50 14 20 4 0Z" fill="url(#eg)" stroke="var(--ed)" stroke-width="3" stroke-linejoin="round"/><circle cx="2" cy="14" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="4" cy="30" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="7" cy="46" r="2.4" fill="var(--ed)" opacity=".4"/><ellipse cx="-1" cy="22" rx="2" ry="9" fill="#fff" opacity=".5" transform="rotate(8 -1 22)"/></g><g transform="translate(142 196) rotate(4) scale(0.8)"><path d="M0 0C-8 18 -6 44 8 62C16 50 14 20 4 0Z" fill="url(#eg)" stroke="var(--ed)" stroke-width="3" stroke-linejoin="round"/><circle cx="2" cy="14" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="4" cy="30" r="2.4" fill="var(--ed)" opacity=".4"/><circle cx="7" cy="46" r="2.4" fill="var(--ed)" opacity=".4"/><ellipse cx="-1" cy="22" rx="2" ry="9" fill="#fff" opacity=".5" transform="rotate(8 -1 22)"/></g></g><g class="npa npa-twinkle"><path d="M190 81L193 87L199 90L193 93