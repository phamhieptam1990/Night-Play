<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đài thiên văn" class="np-deco" data-style="pop"><title>Đài thiên văn</title><desc>Đồ trang trí Đài thiên văn. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F7FF"/><stop offset="1" stop-color="#C8D3EC"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6C7BD6"/><stop offset="1" stop-color="#3A47A0"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F5B400"/></linearGradient></defs><ellipse cx="128" cy="240" rx="78" ry="10.9" fill="#000" opacity=".14"/><path d="M70 236V150H186V236Z" fill="url(#a)" stroke="#8FA0C8" stroke-width="5" stroke-linejoin="round"/><path d="M70 150C70 96 96 70 128 70C160 70 186 96 186 150Z" fill="url(#b)" stroke="#262F78" stroke-width="5" stroke-linejoin="round"/><path d="M122 70L136 150L116 150L110 72Z" fill="#1E2660" stroke="#262F78" stroke-width="3" stroke-linejoin="round"/><g class="npa npa-sway"><path d="M132 100L192 56L202 70L142 114Z" fill="url(#c)" stroke="#B88300" stroke-width="4.5" stroke-linejoin="round"/><ellipse cx="198" cy="62" rx="9" ry="14" fill="#fff" stroke="#B88300" stroke-width="3.5" transform="rotate(35 198 62)"/></g><rect x="108" y="190" width="40" height="46" rx="20" fill="#3A47A0" stroke="#262F78" stroke-width="4"/><circle cx="96" cy="170" r="7" fill="url(#c)"/><circle cx="160" cy="170" r="7" fill="url(#c)"/><ellipse cx="98" cy="108" rx="18" ry="8" fill="#fff" opacity=".5" transform="rotate(-30 98 108)"/><g class="npa npa-twinkle"><path d="M44 71L47 77L53 80L47 83L44 89L41 83L35 80L41 77Z" fill="#fff" class="npa npa-twinkle "/><path d="M222 111L225 117L231 120L225 123L222 129L219 123L213 120L219 117Z" fill="#fff" class="npa npa-twinkle d2"/><path d="M60 31L63 37L69 40L63 43L60 49L57 43L51 40L57 37Z" fill="#fff" class="npa npa-twinkle d3"/></g></svg>
