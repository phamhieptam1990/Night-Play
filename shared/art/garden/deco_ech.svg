<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Ếch" class="np-deco" data-style="pop"><title>Ếch</title><desc>Đồ trang trí Ếch. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FE06A"/><stop offset="1" stop-color="#3FA83A"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F7C8"/><stop offset="1" stop-color="#BFE69A"/></linearGradient></defs><ellipse cx="128" cy="238" rx="64" ry="9" fill="#000" opacity=".14"/><g class="npa npa-hop"><ellipse cx="128" cy="196" rx="62" ry="40" fill="url(#a)" stroke="#237A24" stroke-width="5"/><ellipse cx="128" cy="210" rx="38" ry="24" fill="url(#b)" stroke="#9CC878" stroke-width="3"/><path d="M80 224C60 226 52 236 60 238C76 240 92 236 98 228ZM176 224C196 226 204 236 196 238C180 240 164 236 158 228Z" fill="url(#a)" stroke="#237A24" stroke-width="4" stroke-linejoin="round"/><circle cx="98" cy="150" r="22" fill="url(#a)" stroke="#237A24" stroke-width="5"/><circle cx="158" cy="150" r="22" fill="url(#a)" stroke="#237A24" stroke-width="5"/><circle cx="98" cy="150" r="13" fill="#fff"/><circle cx="158" cy="150" r="13" fill="#fff"/><circle cx="101" cy="152" r="7" fill="#1A2A12"/><circle cx="155" cy="152" r="7" fill="#1A2A12"/><circle cx="103" cy="149" r="2.4" fill="#fff"/><circle cx="157" cy="149" r="2.4" fill="#fff"/><path d="M96 190Q128 208 160 190" fill="none" stroke="#237A24" stroke-width="4.5" stroke-linecap="round"/><circle cx="82" cy="196" r="7" fill="#FF8FA3" opacity=".6"/><circle cx="174" cy="196" r="7" fill="#FF8FA3" opacity=".6"/><ellipse cx="108" cy="176" rx="22" ry="6" fill="#fff" opacity=".5" transform="rotate(-10 108 176)"/></g></svg>
