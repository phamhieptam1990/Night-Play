<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Dưa leo thu hoạch" class="np-produce" data-style="pop"><title>Dưa leo thu hoạch</title><desc>Nông sản Dưa leo.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD14F"/><stop offset="1" stop-color="#3F9B2F"/></linearGradient></defs><style>.np-produce{--c1:#8FD14F;--c2:#3F9B2F;--cd:#25691C;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="244" rx="70" ry="9.8" fill="#000" opacity=".14"/><g transform="translate(128 236) rotate(-14) scale(1.6)"><g transform="translate(0 0) rotate(0) scale(1)"><path d="M-13 0C-15 -34 -9 -60 0 -62C9 -60 15 -34 13 0C12 8 -12 8 -13 0Z" fill="url(#cg)" stroke="var(--cd)" stroke-width="3"/><path d="M-5 -8C-6 -30 -3 -48 -1 -54M5 -8C6 -30 4 -48 2 -54" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".45" fill="none"/><circle cx="-6" cy="-20" r="1.6" fill="var(--cd)"/><circle cx="6" cy="-36" r="1.6" fill="var(--cd)"/></g></g></svg>
