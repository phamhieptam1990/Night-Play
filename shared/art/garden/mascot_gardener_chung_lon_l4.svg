<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bác Rễ, người làm vườn (bé lớn, cấp 4: Thợ vườn)" class="np-mascot sk-l4" data-mascot="gardener" data-who="chung" data-age="lon" data-level="4" data-style="pop" data-game="garden-gardener">
<title>Bác Rễ (bé lớn, cấp 4: Thợ vườn)</title><desc>Chữ ký khuôn mặt: chân mày nhướn nhẹ, nụ cười hiền, râu ba nhánh rễ. Đạo cụ: bình tưới (cấp 3 trở lên).</desc><style>.np-mascot{--ink:#3B2414;--b1:#F4CC90;--b2:#DCA05C;--bd:#A4662E;--h1:#F9E39A;--h2:#EBBC4E;--h3:#B88420;--rb:#E5484D;--rbd:#A52A2E;--l1:#86E29A;--l2:#34B461;--l3:#1F7F43;--c1:#6ACDEB;--c2:#2E9BC4;--c3:#1F6F8E;--bl:#FF9AAE;--ap:#58BD70;--apd:#2E7F45;}.npa{transform-box:fill-box}.npa-bob{transform-origin:50% 100%;animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){.npa-bob,.npa-blink{animation:none}}html.np-playing .npa-bob,html.np-playing .npa-blink{animation:none}</style><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--b1)"/><stop offset="1" style="stop-color:var(--b2)"/></linearGradient><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--h1)"/><stop offset="1" style="stop-color:var(--h2)"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--l1)"/><stop offset="1" style="stop-color:var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="240" rx="58" ry="8" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><g transform="translate(128 232) scale(.93 1.07) translate(-128 -232)"><path id="body" d="M128 70C70 70 46 120 52 166C58 210 92 232 128 232C164 232 198 210 204 166C210 120 186 70 128 70Z" fill="url(#gb)" stroke="var(--bd)" stroke-width="4" stroke-linejoin="round"/><ellipse cx="96" cy="150" rx="11" ry="24" fill="#fff" opacity=".35" transform="rotate(8 96 150)"/><g id="acc-apron"><path d="M94 176H162V226Q162 230 158 230H98Q94 230 94 226Z" fill="var(--ap)" stroke="var(--apd)" stroke-width="3" stroke-linejoin="round"/><path d="M100 176L108 158M156 176L148 158" stroke="var(--apd)" stroke-width="5" stroke-linecap="round"/><rect x="110" y="196" width="36" height="22" rx="6" fill="var(--ap)" stroke="var(--apd)" stroke-width="3"/><path d="M114 206H142" stroke="var(--apd)" stroke-width="3" stroke-linecap="round" opacity=".6"/></g><path d="M113 188Q107 204 98 211M128 192Q129 210 126 222M143 188Q149 204 158 211" fill="none" stroke="var(--bd)" stroke-width="5" stroke-linecap="round"/><g id="acc-shovel"><path d="M46 218L62 158" stroke="#A4662E" stroke-width="6" stroke-linecap="round"/><path d="M38 214C30 224 36 238 46 238C56 238 60 226 54 214Z" fill="#B9B2A6" stroke="#6E6A63" stroke-width="3" stroke-linejoin="round"/></g><ellipse cx="62" cy="166" rx="14" ry="13" fill="var(--b2)" stroke="var(--bd)" stroke-width="3"/><g id="acc-can"><path d="M182 168C164 162 162 196 182 194" fill="none" stroke="var(--c3)" stroke-width="6" stroke-linecap="round"/><rect x="178" y="164" width="42" height="34" rx="9" fill="url(#gc)" stroke="var(--c3)" stroke-width="3"/><path d="M220 178L236 160" stroke="var(--c3)" stroke-width="8" stroke-linecap="round"/><path d="M220 178L236 160" stroke="var(--c2)" stroke-width="4" stroke-linecap="round"/><ellipse cx="238" cy="157" rx="7" ry="4" fill="var(--c2)" stroke="var(--c3)" stroke-width="2.4" transform="rotate(-48 238 157)"/><circle cx="244" cy="172" r="3.2" fil