<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sen Sen" class="np-mascot sk-default" data-style="pop" data-game="garden-sen">
<title>Sen Sen</title>
<desc>Linh vật Sen Sen (phong cách Pop). Chữ ký khuôn mặt: búi cánh sen như mái tóc + một giọt nước trên má + mắt to sáng hay hỏi. Đạo cụ nhận diện: vở và bút chì (làm bài cùng bé).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFC2D4;--c2:#F2689A;--st:#C93F73;--bl:#FF7A9D;--l1:#8EE89A;--l2:#2FAE5B;--lst:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-sen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-sen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><ellipse cx="128" cy="222" rx="112" ry="24" fill="url(#GL-sen)" stroke="var(--lst)" stroke-width="3"/><path d="M128 222L128 204" stroke="var(--lst)" stroke-width="3"/><ellipse cx="128" cy="236" rx="76" ry="6" fill="#9BE0F7" opacity=".6"/><ellipse cx="128" cy="62" rx="22" ry="46" fill="var(--c1)" stroke="var(--st)" stroke-width="2.8" transform="rotate(-62 128 150)"/><ellipse cx="128" cy="62" rx="22" ry="46" fill="var(--c1)" stroke="var(--st)" stroke-width="2.8" transform="rotate(-34 128 150)"/><ellipse cx="128" cy="62" rx="22" ry="46" fill="var(--c1)" stroke="var(--st)" stroke-width="2.8" transform="rotate(34 128 150)"/><ellipse cx="128" cy="62" rx="22" ry="46" fill="var(--c1)" stroke="var(--st)" stroke-width="2.8" transform="rotate(62 128 150)"/><ellipse cx="128" cy="62" rx="22" ry="46" fill="url(#GB-sen)" stroke="var(--st)" stroke-width="2.8" transform="rotate(-14 128 150)"/><ellipse cx="128" cy="62" rx="22" ry="46" fill="url(#GB-sen)" stroke="var(--st)" stroke-width="2.8" transform="rotate(14 128 150)"/><circle cx="128" cy="144" r="72" fill="url(#GB-sen)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="108" rx="16" ry="9" fill="#fff" opacity=".5" transform="rotate(-28 98 108)"/></g>
<g id="limbs"><ellipse cx="62" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="130" r="14" fill="var(--ink)"/><circle cx="107" cy="124.5" r="5.2" fill="#fff"/><circle cx="97.5" cy="135" r="2.6" fill="#fff" opacity=".9"/><circle cx="154" cy="130" r="14" fill="var(--ink)"/><circle cx="159" cy="124.5" r="5.2" fill="#fff"/><circle cx="149.5" cy="135" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="80" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="140" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M184 150Q190 160 184 168Q178 160 184 150Z" fill="#9BE0F7" stroke="#3B9BD6" stroke-width="2"/><path d="M112 156Q128 172 144 156" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/></g></g>
<g id="prop"><rect x="184" y="158" width="42" height="36" rx="7" fill="#FFE9A8" stroke="#C9942A" stroke-width="3"/><path d="M192 168H218M192 176H214M192 184H210" stroke="#E0B24A" stroke-width="3" stroke-linecap="round"/><g transform="rotate(32 226 160)"><rect x="220" y="136" width="10" height="44" rx="3" fill="#FFC83D" stroke="#C9942A" stroke-width="2.5"/><path d="M220 136L225 124L230 136Z" fill="#F4C9A0" stroke="#C9942A" stroke-width="2"/><path d="M223 128L225 124L227 128Z" fill="#2A2350"/></g><ellipse cx="194" cy="192" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
