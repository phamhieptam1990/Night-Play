<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Mây Mây" class="np-mascot sk-default" data-style="pop" data-game="garden-may">
<title>Mây Mây</title>
<desc>Linh vật Mây Mây (phong cách Pop), canh hồ mây ở Rừng Chữ. Chữ ký khuôn mặt: đám mây tròn có chỏm mây xoăn như dấu hỏi trên đầu + một ngôi sao nhỏ trên má phải + mắt to sáng hay tò mò. Đạo cụ nhận diện: quyển sách có chữ A (Tiếng Việt).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFFFFF;--c2:#BFE3FF;--st:#6FA8DC;--bl:#FF9DB8;--l1:#E8F6FF;--l2:#A9D8FF;--lst:#6FA8DC}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-may" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-may" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><ellipse cx="128" cy="224" rx="104" ry="20" fill="url(#GL-may)" stroke="var(--lst)" stroke-width="3"/><circle cx="62" cy="214" r="22" fill="url(#GL-may)" stroke="var(--lst)" stroke-width="3"/><circle cx="194" cy="214" r="22" fill="url(#GL-may)" stroke="var(--lst)" stroke-width="3"/><ellipse cx="128" cy="228" rx="86" ry="14" fill="url(#GL-may)"/><circle cx="70" cy="146" r="38" fill="url(#GB-may)" stroke="var(--st)" stroke-width="3"/><circle cx="186" cy="146" r="38" fill="url(#GB-may)" stroke="var(--st)" stroke-width="3"/><circle cx="96" cy="100" r="42" fill="url(#GB-may)" stroke="var(--st)" stroke-width="3"/><circle cx="160" cy="100" r="42" fill="url(#GB-may)" stroke="var(--st)" stroke-width="3"/><circle cx="128" cy="150" r="64" fill="url(#GB-may)" stroke="var(--st)" stroke-width="3"/><circle cx="128" cy="116" r="52" fill="url(#GB-may)"/><path d="M128 56C128 38 150 34 154 48C158 62 138 66 138 80" fill="none" stroke="var(--st)" stroke-width="12" stroke-linecap="round"/><path d="M128 56C128 38 150 34 154 48C158 62 138 66 138 80" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="138" cy="94" r="6" fill="var(--st)"/><circle cx="138" cy="94" r="3" fill="#fff"/><ellipse cx="96" cy="92" rx="16" ry="9" fill="#fff" opacity=".7" transform="rotate(-28 96 92)"/></g>
<g id="limbs"><ellipse cx="62" cy="192" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="130" r="14" fill="var(--ink)"/><circle cx="107" cy="124.5" r="5.2" fill="#fff"/><circle cx="97.5" cy="135" r="2.6" fill="#fff" opacity=".9"/><circle cx="154" cy="130" r="14" fill="var(--ink)"/><circle cx="159" cy="124.5" r="5.2" fill="#fff"/><circle cx="149.5" cy="135" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="80" cy="142" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="142" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M184 138l3 6 6 1-5 4 1 6-5-3-5 3 1-6-5-4 6-1z" fill="#FFD23F" stroke="#C9942A" stroke-width="1.8" stroke-linejoin="round"/><path d="M112 156Q128 172 144 156" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/></g></g>
<g id="prop"><rect x="182" y="152" width="46" height="42" rx="7" fill="#FFB9A0" stroke="#B5533A" stroke-width="3"/><rect x="190" y="152" width="38" height="42" rx="6" fill="#FFF3DC" stroke="#B5533A" stroke-width="3"/><text x="209" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="28" fill="#D94B3A">A</text><ellipse cx="194" cy="192" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
