<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sò Sò" class="np-mascot sk-default" data-style="pop" data-game="garden-so">
<title>Sò Sò</title>
<desc>Linh vật Sò Sò (phong cách Pop), canh vịnh ở Vịnh Từ. Chữ ký khuôn mặt: thân vỏ sò quạt + ngọc trai tròn giữa trán + mi dài ở mắt phải + mắt to sáng hay nói chuyện. Đạo cụ nhận diện: cờ nhỏ (Tiếng Anh).</desc>
<style>.np-mascot{--ink:#2A2350;--hl:#fff;--c1:#FFE3B8;--c2:#FF9F6B;--st:#C5603A;--bl:#FF7A9D;--l1:#B7EEFF;--l2:#3FB6DE;--lst:#2A86B0}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><linearGradient id="GB-so" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-so" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><ellipse cx="128" cy="226" rx="106" ry="20" fill="url(#GL-so)" stroke="var(--lst)" stroke-width="3"/><path d="M52 222q14-9 28 0M104 232q14-9 28 0M160 222q14-9 28 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/><path d="M128 214C60 212 36 170 44 128C52 82 92 54 128 54C164 54 204 82 212 128C220 170 196 212 128 214Z" fill="url(#GB-so)" stroke="var(--st)" stroke-width="3"/><path d="M128 214L56 96" stroke="var(--st)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M128 214L80 96" stroke="var(--st)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M128 214L104 96" stroke="var(--st)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M128 214L128 96" stroke="var(--st)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M128 214L152 96" stroke="var(--st)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M128 214L176 96" stroke="var(--st)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M128 214L200 96" stroke="var(--st)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M100 214Q128 232 156 214L146 200H110Z" fill="var(--c2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M56 118Q128 40 200 118" fill="none" stroke="var(--st)" stroke-width="3" stroke-linecap="round" opacity=".6"/><ellipse cx="84" cy="96" rx="16" ry="9" fill="#fff" opacity=".55" transform="rotate(-30 84 96)"/><circle cx="128" cy="82" r="13" fill="#fff" stroke="#9aa6c8" stroke-width="2.5"/><circle cx="123" cy="77" r="4.5" fill="#fff"/><circle cx="131" cy="86" r="3" fill="#D8E4FF"/></g>
<g id="limbs"><ellipse cx="62" cy="196" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="194" cy="190" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="130" r="14" fill="var(--ink)"/><circle cx="107" cy="124.5" r="5.2" fill="#fff"/><circle cx="97.5" cy="135" r="2.6" fill="#fff" opacity=".9"/><circle cx="154" cy="130" r="14" fill="var(--ink)"/><circle cx="159" cy="124.5" r="5.2" fill="#fff"/><circle cx="149.5" cy="135" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="80" cy="142" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="142" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><path d="M164 118l9-6M168 124l11-2" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round"/><path d="M112 160Q128 176 144 160" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/></g></g>
<g id="prop"><rect x="214" y="104" width="5" height="90" rx="2.5" fill="#8a5a2b" stroke="#5E3A1B" stroke-width="2"/><path d="M219 106H252L242 120L252 134H219Z" fill="#E6584A" stroke="#9a2f24" stroke-width="3" stroke-linejoin="round"/><path d="M226 114H240M226 126H238" stroke="#fff" stroke-width="3" stroke-linecap="round"/><ellipse cx="205" cy="192" rx="15" ry="13" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
</g>
</svg>
