<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Hành Tím (linh vật cấp 3 huy chương)" class="np-mascot sk-l3 em-happy" data-style="pop" data-game="garden-crop-onion" data-level="3">
<title>Hành Tím (linh vật cấp 3 huy chương)</title><desc>Chữ ký khuôn mặt: mắt tròn hai điểm sáng, má hồng; riêng Hành Tím: ngọn hành xanh nhọn trên đỉnh + chùm rễ trắng nhỏ dưới chân. Mỗi cấp thêm một thứ: khăn đỏ, huy chương, vương miện.</desc><style>.np-mascot{--ink:#2A2350;--c1:#E9B8F0;--c2:#A24FC4;--st:#6E2A8E;--bl:#FF8FB5;--l1:#9BE88A;--l2:#34B461;--l3:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-box:fill-box;transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa,:root.np-playing .npa-blink{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-blink{animation:none}}</style><defs><linearGradient id="GB-onion" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-onion" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="246" rx="64" ry="7" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path d="M118 90C112 64 116 38 124 16C128 38 134 64 138 90Z" fill="url(#GL-onion)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M134 92C142 70 156 52 172 44C168 66 158 84 142 98Z" fill="url(#GL-onion)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M104 238Q98 250 90 252M128 240Q128 252 126 254M152 238Q158 250 166 252" fill="none" stroke="#E8DCCB" stroke-width="4" stroke-linecap="round"/><path d="M128 70C122 98 58 108 54 168C52 214 90 240 128 240C166 240 204 214 202 168C198 108 134 98 128 70Z" fill="url(#GB-onion)" stroke="var(--st)" stroke-width="3.5" stroke-linejoin="round"/><path d="M94 118Q70 160 90 224M162 118Q186 160 166 224" fill="none" stroke="var(--st)" stroke-width="3" stroke-linecap="round" opacity="0.4"/><ellipse cx="92" cy="140" rx="12" ry="26" fill="#fff" opacity=".5" transform="rotate(12 92 140)"/><g id="face" transform="translate(128 166) scale(1)"><g class="npa-blink"><circle cx="-26" cy="0" r="12.5" fill="#2A2350"/><circle cx="-21.25" cy="-4.75" r="4.75" fill="#fff"/><circle cx="-30.375" cy="4.75" r="2.375" fill="#fff" opacity=".9"/><circle cx="26" cy="0" r="12.5" fill="#2A2350"/><circle cx="30.75" cy="-4.75" r="4.75" fill="#fff"/><circle cx="21.625" cy="4.75" r="2.375" fill="#fff" opacity=".9"/></g><ellipse cx="-46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><ellipse cx="46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><path d="M-10 12Q0 22 10 12" fill="none" stroke="#2A2350" stroke-width="3.6" stroke-linecap="round"/></g><g id="acc-scarf"><path d="M68 206Q128 224 188 206" fill="none" stroke="#9E1B28" stroke-width="15" stroke-linecap="round"/><path d="M68 206Q128 224 188 206" fill="none" stroke="#E5484D" stroke-width="10" stroke-linecap="round"/><path d="M161 214l9 28l-15 -2z" fill="#E5484D" stroke="#9E1B28" stroke-width="2.6" stroke-linejoin="round"/></g><g id="acc-medal" transform="translate(160 220)"><path d="M-8 -14L-14 -32M8 -14L14 -32" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/><circle r="13" fill="#FFD24D" stroke="#C9840F" stroke-width="3"/><path d="M0 -7L2.4 -2L8 -1.4L4 2.4L5 8L0 5.4L-5 8L-4 2.4L-8 -1.4L-2.4 -2Z" fill="#fff" stroke="#C9840F" stroke-width="1.4" stroke-linejoin="round"/></g></g>
</svg>
