<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Dù hè" class="np-deco" data-style="pop"><title>Dù hè</title><desc>Đồ trang trí Dù hè. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#E03A3A"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F1F1"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F5B400"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C98A"/><stop offset="1" stop-color="#C9A25E"/></linearGradient></defs><ellipse cx="128" cy="238" rx="70" ry="9.8" fill="#000" opacity=".14"/><ellipse cx="128" cy="232" rx="66" ry="12" fill="url(#w)" stroke="#9C7A38" stroke-width="3"/><path d="M128 232V90" stroke="#8A6B3F" stroke-width="7" stroke-linecap="round"/><g class="npa npa-sway"><path d="M30 106C36 52 90 28 128 28C166 28 220 52 226 106C204 92 180 94 164 108C150 92 106 92 92 108C76 94 52 92 30 106Z" fill="url(#a)" stroke="#A82424" stroke-width="5" stroke-linejoin="round"/><path d="M128 28C112 48 106 76 108 98C102 92 96 92 92 108C100 70 110 44 128 28Z" fill="url(#b)" stroke="#D9D9D9" stroke-width="3"/><path d="M128 28C144 48 150 76 148 98C154 92 160 92 164 108C156 70 146 44 128 28Z" fill="url(#b)" stroke="#D9D9D9" stroke-width="3"/><circle cx="128" cy="26" r="7" fill="url(#c)" stroke="#B88300" stroke-width="3"/><ellipse cx="70" cy="66" rx="20" ry="7" fill="#fff" opacity=".5" transform="rotate(-26 70 66)"/></g><circle cx="176" cy="212" r="12" fill="url(#c)" stroke="#B88300" stroke-width="3"/><ellipse cx="172" cy="208" rx="4" ry="4" fill="#fff" opacity=".5" transform="rotate(0 172 208)"/></svg>
