<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Linh vật 2 vườn mới</title><style>
body{margin:0;background:#F6F4F1;color:#1d1a33;font:16px/1.45 system-ui,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:16px}h1{margin:0 0 4px}p{color:#5b5578;margin:0 0 14px}

<figure><div class="big"><img src="ao/mascot_so.svg" alt="Sò Sò"></div><div class="row sea"><img src="ao/mascot_so.svg" alt=""><img src="ao/mascot_so.svg" alt=""></div><figcaption><b>Sò Sò</b><span>Vịnh Từ · vịnh · cầm cờ nhỏ</span></figcaption></figure>
<figure><div class="big"><img src="ao/mascot.svg" alt="Sen Sen"></div><div class="row"><img src="ao/mascot.svg" alt=""><img src="ao/mascot.svg" alt=""></div><figcaption><b>Sen Sen</b><span>Vườn Số (Toán) · ao cá · để so sánh, đã có</span></figcaption></figure>
