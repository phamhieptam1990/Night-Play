<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cải xanh giai đoạn 3" class="np-crop s3" data-style="pop"><title>Cải xanh giai đoạn 3</title><desc>Cây trồng Cải xanh, giai đoạn 3/4. Phong cách Pop, hoạt ảnh nhẹ.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D7EBC8"/></linearGradient></defs><style>.np-crop{--w1:#FFFFFF;--w2:#DDEFD0;--wd:#9DB98A;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="230" rx="48" ry="11" fill="url(#sg)" stroke="#5C3A1E" stroke-width="3"/><ellipse cx="112" cy="227" rx="14" ry="3" fill="#fff" opacity=".5" transform="rotate(0 112 227)"/><g transform="translate(128 226) scale(1.1) translate(-128 -226)"><g transform="translate(128 226)"><g class="npa npa-sway"><path d="M0 0C-9 -22 -7.4399999999999995 -44 -6.2 -56" stroke="url(#wg)" stroke-width="13" stroke-linecap="round" fill="none"/><g transform="rotate(-62) scale(0.7615384615384615 0.7615384615384615)"><path d="M0 0C-26 -14 -34 -52 -8 -78C16 -92 34 -62 24 -30C18 -12 6 -4 0 0Z" fill="url(#lg)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M0 -6C-4 -30 0 -54 4 -70" fill="none" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" opacity=".45"/></g></g><g class="npa npa-sway d2"><path d="M0 0C9 -22 7.4399999999999995 -44 6.2 -56" stroke="url(#wg)" stroke-width="13" stroke-linecap="round" fill="none"/><g transform="rotate(62) scale(0.7615384615384615 0.7615384615384615)"><path d="M0 0C-26 -14 -34 -52 -8 -78C16 -92 34 -62 24 -30C18 -12 6 -4 0 0Z" fill="url(#lg)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M0 -6C-4 -30 0 -54 4 -70" fill="none" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" opacity=".45"/></g></g><g class="npa npa-sway"><path d="M0 0C-9 -22 -4.08 -44 -3.4000000000000004 -56" stroke="url(#wg)" stroke-width="13" stroke-linecap="round" fill="none"/><g transform="rotate(-34) scale(0.8692307692307693 0.8692307692307693)"><path d="M0 0C-26 -14 -34 -52 -8 -78C16 -92 34 -62 24 -30C18 -12 6 -4 0 0Z" fill="url(#lg)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M0 -6C-4 -30 0 -54 4 -70" fill="none" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" opacity=".45"/></g></g><g class="npa npa-sway d2"><path d="M0 0C9 -22 4.08 -44 3.4000000000000004 -56" stroke="url(#wg)" stroke-width="13" stroke-linecap="round" fill="none"/><g transform="rotate(34) scale(0.8692307692307693 0.8692307692307693)"><path d="M0 0C-26 -14 -34 -52 -8 -78C16 -92 34 -62 24 -30C18 -12 6 -4 0 0Z" fill="url(#lg)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M0 -6C-4 -30 0 -54 4 -70" fill="none" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" opacity=".45"/></g></g><g class="npa npa-sway"><path d="M0 0C9 -22 0 -44 0 -56" stroke="url(#wg)" stroke-width="13" stroke-linecap="round" fill="none"/><g transform="rotate(0) scale(1 1)"><path d="M0 0C-26 -14 -34 -52 -8 -78C16 -92 34 -62 24 -30C18 -12 6 -4 0 0Z" fill="url(#lg)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M0 -6C-4 -30 0 -54 4 -70" fill="none" stroke="var(--l3)" stroke-width="2.4" stroke-linecap="round" opacity=".45"/></g></g><ellipse cx="0" cy="-8" rx="17" ry="12" fill="url(#wg)" stroke="var(--wd)" stroke-width="2.5"/></g></g></svg>
