<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bé Rễ, người làm vườn (bé nhỏ, cấp 5: Bác làm vườn)" class="np-mascot sk-l5" data-mascot="gardener" data-who="nu" data-age="nho" data-level="5" data-style="pop" data-game="garden-gardener">
<title>Bé Rễ (bé nhỏ, cấp 5: Bác làm vườn)</title><desc>Chữ ký khuôn mặt: chân mày nhướn nhẹ, nụ cười hiền, mi dài và nơ hồng. Đạo cụ: bình tưới (cấp 3 trở lên).</desc><style>.np-mascot{--ink:#3B2414;--b1:#F4CC90;--b2:#DCA05C;--bd:#A4662E;--h1:#F9E39A;--h2:#EBBC4E;--h3:#B88420;--rb:#E5484D;--rbd:#A52A2E;--l1:#86E29A;--l2:#34B461;--l3:#1F7F43;--c1:#6ACDEB;--c2:#2E9BC4;--c3:#1F6F8E;--bl:#FF9AAE;--ap:#58BD70;--apd:#2E7F45;--rb:#EC4899;--rbd:#BE185D;--ap:#F472B6;--apd:#BE185D;--bl:#FF7FA8;}.npa{transform-box:fill-box}.npa-bob{transform-origin:50% 100%;animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){.npa-bob,.npa-blink{animation:none}}html.np-playing .npa-bob,html.np-playing .npa-blink{animation:none}</style><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--b1)"/><stop offset="1" style="stop-color:var(--b2)"/></linearGradient><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--h1)"/><stop offset="1" style="stop-color:var(--h2)"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--l1)"/><stop offset="1" style="stop-color:var(--l2)"/></linearGradient></defs>
