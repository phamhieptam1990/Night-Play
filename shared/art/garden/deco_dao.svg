<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Hoa đào" class="np-deco" data-style="pop"><title>Hoa đào</title><desc>Đồ trang trí Hoa đào. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
