<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Khoai Tây (linh vật cấp 3 huy chương)" class="np-mascot sk-l3 em-happy" data-style="pop" data-game="garden-crop-potato" data-level="3">
<title>Khoai Tây (linh vật cấp 3 huy chương)</title><desc>Chữ ký khuôn mặt: mắt tròn hai điểm sáng, má hồng; riêng Khoai Tây: đốm mắt khoai nâu li ti + mầm xanh nhỏ nhú trên đầu. Mỗi cấp thêm một thứ: khăn đỏ, huy chương, vương miện.</desc><style>.np-mascot{--ink:#2A2350;--c1:#EBC28A;--c2:#C28A4C;--st:#7A4F22;--bl:#FF9D8A;--l1:#9BE88A;--l2:#34B461;--l3:#1F7F43}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-box:fill-box;transform-origin:50% 50%;animation:npa-blink 4.2s infinite}@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}:root.np-playing .npa,:root.np-playing .npa-blink{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-blink{animation:none}}</style><defs><linearGradient id="GB-potato" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient><linearGradient id="GL-potato" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--l1)"/><stop offset="1" stop-color="var(--l2)"/></linearGradient></defs>
<ellipse cx="128" cy="246" rx="64" ry="7" fill="#000" opacity=".14"/><g id="all" class="npa npa-bob"><path d="M128 80Q126 62 120 52" fill="none" stroke="var(--l3)" stroke-width="5" stroke-linecap="round"/><path d="M120 56C104 54 94 42 96 28C112 28 122 38 120 56Z" fill="url(#GL-potato)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M122 56C138 52 150 42 150 28C134 26 122 38 122 56Z" fill="url(#GL-potato)" stroke="var(--l3)" stroke-width="3" stroke-linejoin="round"/><path d="M104 80C66 84 38 126 48 176C58 222 96 238 140 234C186 230 214 196 208 148C202 104 164 72 128 78C118 78 110 79 104 80Z" fill="url(#GB-potato)" stroke="var(--st)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="78" cy="168" r="3.4" fill="var(--st)" opacity="0.55"/><circle cx="168" cy="112" r="3.4" fill="var(--st)" opacity="0.55"/><circle cx="186" cy="190" r="3.4" fill="var(--st)" opacity="0.55"/><circle cx="96" cy="214" r="3.4" fill="var(--st)" opacity="0.55"/><circle cx="148" cy="218" r="3.4" fill="var(--st)" opacity="0.55"/><circle cx="70" cy="122" r="3.4" fill="var(--st)" opacity="0.55"/><ellipse cx="84" cy="114" rx="16" ry="9" fill="#fff" opacity=".5" transform="rotate(-34 84 114)"/><g id="face" transform="translate(128 154) scale(1)"><g class="npa-blink"><circle cx="-26" cy="0" r="12.5" fill="#2A2350"/><circle cx="-21.25" cy="-4.75" r="4.75" fill="#fff"/><circle cx="-30.375" cy="4.75" r="2.375" fill="#fff" opacity=".9"/><circle cx="26" cy="0" r="12.5" fill="#2A2350"/><circle cx="30.75" cy="-4.75" r="4.75" fill="#fff"/><circle cx="21.625" cy="4.75" r="2.375" fill="#fff" opacity=".9"/></g><ellipse cx="-46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><ellipse cx="46" cy="18" rx="9" ry="6" fill="var(--bl)" opacity=".75"/><path d="M-10 12Q0 22 10 12" fill="none" stroke="#2A2350" stroke-width="3.6" stroke-linecap="round"/></g><g id="acc-scarf"><path d="M64 196Q128 214 192 196" fill="none" stroke="#9E1B28" stroke-width="15" stroke-linecap="round"/><path d="M64 196Q128 214 192 196" fill="none" stroke="#E5484D" stroke-width="10" stroke-linecap="round"/><path d="M163.2 204l9 28l-15 -2z" fill="#E5484D" stroke="#9E1B28" stroke-width="2.6" stroke-linejoin="round"/></g><g id="acc-medal" transform="translate(164 214)"><path d="M-8 -14L-14 -32M8 -14L14 -32" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/><circle r="13" fill="#FFD24D" stroke="#C9840F" stroke-width="3"/><path d="M0 -7L2.4 -2L8 -1.4L4 2.4L5 8L0 5.4L-5 8L-4 2.4L-8 -1.4L-2.4 -2Z" fill="#fff" stroke="#C9840F" stroke-width="1.4" stroke-linejoin="round"/></g></g>
</svg>
