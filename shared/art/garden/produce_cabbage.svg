<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cải bắp thu hoạch" class="np-produce" data-style="pop"><title>Cải bắp thu hoạch</title><desc>Nông sản Cải bắp.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FDB8A"/><stop offset="1" stop-color="#34B461"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4A"/><stop offset="1" stop-color="#7B4E2B"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7F5B0"/><stop offset="1" stop-color="#82C85C"/></linearGradient></defs><style>.np-produce{--b1:#C9F0A0;--b2:#7FC25A;--bd:#3F8A2E;--l1:#6FDB8A;--l2:#34B461;--l3:#1F7F43}</style><ellipse cx="128" cy="244" rx="70" ry="9.8" fill="#000" opacity=".14"/><g transform="translate(128 230) scale(1.45)"><circle cx="0" cy="-42" r="42" fill="url(#bg)" stroke="var(--bd)" stroke-width="4"/><path d="M-40 -30C-20 -40 20 -40 40 -30M-34 -56C-14 -64 14 -64 34 -56M0 -84C-8 -60 -8 -30 0 -2" fill="none" stroke="var(--bd)" stroke-width="3.4" stroke-linecap="round" opacity=".6"/><path d="M-42 -26C-30 -8 -16 -2 0 -2C16 -2 30 -8 42 -26C30 -18 -30 -18 -42 -26Z" fill="#A9DE7E" stroke="var(--bd)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="-16" cy="-62" rx="9" ry="14" fill="#fff" opacity=".5" transform="rotate(24 -16 -62)"/></g></svg>
