<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đèn lồng" class="np-deco" data-style="pop"><title>Đèn lồng</title><desc>Đồ trang trí Đèn lồng. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B5C"/><stop offset="1" stop-color="#D92B2B"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#F5B400"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#FFF3A6" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3A6" stop-opacity="0"/></radialGradient></defs><ellipse cx="128" cy="240" rx="44" ry="6.2" fill="#000" opacity=".14"/><path d="M128 240V222" stroke="#8A6B3F" stroke-width="6" stroke-linecap="round"/><circle cx="128" cy="124" r="70" fill="url(#gl)" class="npa npa-twinkle" style="animation-duration:3.4s"/><g class="npa npa-sway"><path d="M128 42V62" stroke="#B88300" stroke-width="5" stroke-linecap="round"/><rect x="102" y="58" width="52" height="14" rx="5" fill="url(#g)" stroke="#B88300" stroke-width="3.5"/><path d="M104 70C60 82 60 164 104 176L152 176C196 164 196 82 152 70Z" fill="url(#a)" stroke="#A01E1E" stroke-width="5" stroke-linejoin="round"/><path d="M128 72C104 96 104 150 128 176M128 72C152 96 152 150 128 176" fill="none" stroke="#A01E1E" stroke-width="3" opacity=".55"/><rect x="102" y="172" width="52" height="14" rx="5" fill="url(#g)" stroke="#B88300" stroke-width="3.5"/><path d="M114 186L110 220M128 186V226M142 186L146 220" stroke="#F5B400" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="88" cy="108" rx="8" ry="22" fill="#fff" opacity=".5" transform="rotate(12 88 108)"/></g></svg>
