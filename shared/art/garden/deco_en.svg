<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Chim én" class="np-deco" data-style="pop"><title>Chim én</title><desc>Đồ trang trí Chim én. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B4C7A"/><stop offset="1" stop-color="#1E2A4E"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5ECF6"/></linearGradient></defs><ellipse cx="128" cy="236" rx="40" ry="5.6" fill="#000" opacity=".14"/><g class="npa npa-hop"><path d="M58 150C86 120 118 120 140 138C160 118 196 116 220 134C196 138 176 150 164 170C148 190 112 196 86 182C70 174 62 162 58 150Z" fill="url(#a)" stroke="#121B38" stroke-width="5" stroke-linejoin="round"/><path d="M90 160C112 178 146 178 164 166C156 184 130 196 104 190C94 184 90 172 90 160Z" fill="url(#b)" stroke="#B6C3D9" stroke-width="3"/><path d="M140 138L134 100L162 120Z" fill="#E8503A" stroke="#A82C1A" stroke-width="3.5" stroke-linejoin="round"/><path d="M62 152L22 148L58 168Z" fill="#1E2A4E" stroke="#121B38" stroke-width="3.5" stroke-linejoin="round"/><circle cx="148" cy="144" r="5" fill="#fff"/><circle cx="149.5" cy="144" r="2.6" fill="#1A1A2E"/><path d="M160 150L184 156L162 160Z" fill="#FFB020" stroke="#C27800" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="110" cy="138" rx="18" ry="5" fill="#fff" opacity=".5" transform="rotate(-14 110 138)"/></g></svg>
