<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đom đóm" class="np-deco" data-style="pop"><title>Đom đóm</title><desc>Đồ trang trí Đom đóm. Phong cách Pop.</desc><style>.st,.spk{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-sway{animation:npa-sway 4.6s ease-in-out infinite}.npa-sway.d2{animation-delay:-1.3s}.npa-sway.d3{animation-delay:-2.6s}.npa-bob{transform-origin:50% 0;animation:npa-bob 2.6s ease-in-out infinite}.npa-hop{animation:npa-hop 2.4s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}.npa-twinkle.d2{animation-delay:-.7s}.npa-twinkle.d3{animation-delay:-1.4s}.npa-float{transform-origin:50% 50%;animation:npa-float 3.2s ease-in-out infinite}.npa-float.d2{animation-delay:-1.1s}.npa-float.d3{animation-delay:-2.2s}
@keyframes npa-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes npa-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes npa-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes npa-float{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none!important}}</style><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F6FF"/><stop offset="1" stop-color="#B8DDF2"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#F7FF7A" stop-opacity=".95"/><stop offset="1" stop-color="#F7FF7A" stop-opacity="0"/></radialGradient><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F5B400"/></linearGradient></defs><ellipse cx="128" cy="240" rx="52" ry="7.3" fill="#000" opacity=".14"/><ellipse cx="128" cy="144" rx="64" ry="76" fill="url(#gl)" class="npa npa-twinkle" style="animation-duration:3.8s"/><rect x="92" y="78" width="72" height="14" rx="6" fill="url(#c)" stroke="#B88300" stroke-width="3.5"/><path d="M96 92C74 108 70 170 94 224C100 236 156 236 162 224C186 170 182 108 160 92Z" fill="url(#a)" fill-opacity=".55" stroke="#8FB6D6" stroke-width="4.5" stroke-linejoin="round"/><ellipse cx="100" cy="140" rx="7" ry="38" fill="#fff" opacity=".5" transform="rotate(6 100 140)"/><path d="M112 72C112 58 144 58 144 72" fill="none" stroke="#B88300" stroke-width="4" stroke-linecap="round"/><g class="npa npa-twinkle "><circle cx="110" cy="130" r="9" fill="#F7FF7A"/><circle cx="110" cy="130" r="4" fill="#fff"/></g><g class="npa npa-twinkle d2"><circle cx="146" cy="150" r="9" fill="#F7FF7A"/><circle cx="146" cy="150" r="4" fill="#fff"/></g><g class="npa npa-twinkle d3"><circle cx="124" cy="186" r="9" fill="#F7FF7A"/><circle cx="124" cy="186" r="4" fill="#fff"/></g><g class="npa npa-twinkle d2"><circle cx="100" cy="176" r="9" fill="#F7FF7A"/><circle cx="100" cy="176" r="4" fill="#fff"/></g><g class="npa npa-twinkle d3"><circle cx="150" cy="112" r="9" fill="#F7FF7A"/><circle cx="150" cy="112" r="4" fill="#fff"/></g><g class="npa npa-float"><circle cx="206" cy="96" r="6" fill="#F7FF7A"/></g><g class="npa npa-float d2"><circle cx="48" cy="130" r="5" fill="#F7FF7A"/></g></svg>
