</g>
<g id="propg" transform="translate(250 236) scale(1.3) translate(-250 -236)"><g id="sign" transform="rotate(20 206 190)"><circle cx="208" cy="152" r="26" fill="#BEE9FF" fill-opacity=".55" stroke="#FFD93D" stroke-width="7"/><rect x="204" y="178" width="12" height="46" rx="6" fill="#FFD93D"/></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
