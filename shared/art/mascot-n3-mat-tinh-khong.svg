<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<ellipse cx="72" cy="46" rx="24" ry="24" fill="#7BE04A" /><ellipse cx="184" cy="46" rx="24" ry="24" fill="#7BE04A" /><ellipse cx="72" cy="46" rx="15" ry="15" fill="#fff" /><ellipse cx="184" cy="46" rx="15" ry="15" fill="#fff" /><ellipse cx="76" cy="48" rx="8" ry="8" fill="#2A1A33" /><ellipse cx="180" cy="48" rx="8" ry="8" fill="#2A1A33" /><ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="96" cy="58" rx="28" ry="13" fill="#fff" opacity=".42" transform="rotate(-22 96 58)"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#43A81E" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
