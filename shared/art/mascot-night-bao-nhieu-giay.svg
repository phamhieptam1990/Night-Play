<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bao Nhiêu Giây?" class="np-mascot sk-default" data-style="night" data-game="bao-nhieu-giay">
<title>Rùa Lề Mề — Bao Nhiêu Giây?</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (ngáp dài) + một chân mày nhướn, ba vạch đếm giây trên trán. Đạo cụ nhận diện game (luôn có): đồng hồ bấm giây cầm tay. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="bao-nhieu-giay"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#3DDC97;--p2:#1FA36B;--pa:#FF7A45;--pb:#FFE45C;--face:#E8F7C8;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-7 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="168" rx="88" ry="66"/><ellipse cx="128" cy="100" rx="52" ry="48"/></g>
<g id="body"><path d="M54 212L40 232H84L88 212ZM202 212L216 232H172L168 212Z" fill="var(--c1)"/><ellipse cx="128" cy="170" rx="88" ry="62" fill="var(--c2)"/><path d="M86 136L128 120L170 136L170 176L128 192L86 176Z" fill="none" stroke-width="4"/><path d="M128 120V90M86 136L52 150M170 136L204 150M86 176L58 196M170 176L198 196" fill="none" stroke-width="3.5" opacity=".6"/><ellipse cx="128" cy="100" rx="54" ry="48" fill="var(--c1)"/></g>
<g id="face"><g id="eyes" class="npa-blink"><path d="M91 102Q102 112 113 102" fill="none" stroke-width="5"/><path d="M143 102Q154 112 165 102" fill="none" stroke-width="5"/><path d="M92 90L112 92" fill="none" stroke-width="5"/><path d="M144 92L164 90" fill="none" stroke-width="5"/></g><g id="mouthg"><ellipse cx="128" cy="138" rx="13" ry="16" fill="var(--ink)" stroke-width="4"/><path d="M121 146Q128 140 135 146Q128 158 121 146Z" fill="#FF6F91" stroke="none"/></g><g id="mark" fill="none" stroke-width="4"><path d="M114 68V78M128 66V78M142 68V78"/></g></g>
<g id="shoes"><path d="M42 228Q42 216 56 216H72Q84 216 84 228Z" fill="#fff" stroke-width="4.5"/><rect x="40" y="228" width="46" height="8" rx="4" fill="var(--c3x)" stroke-width="4"/><path d="M172 228Q172 216 186 216H202Q214 216 214 228Z" fill="#fff" stroke-width="4.5"/><rect x="170" y="228" width="46" height="8" rx="4" fill="var(--c3x)" stroke-width="4"/></g><g id="sign" transform="rotate(10 204 186)"><rect x="197" y="148" width="14" height="10" rx="3" fill="var(--c4)" stroke-width="4"/><circle cx="204" cy="186" r="28" fill="#fff" stroke-width="5"/><path d="M204 186V168M204 186L218 194" fill="none" stroke-width="4"/><path d="M204 162V166M204 206V210M182 186H186M222 186H226" fill="none" stroke-width="3"/><path d="M204 186L204 168" stroke="var(--c3x)" stroke-width="4"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
