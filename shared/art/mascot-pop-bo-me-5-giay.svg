<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bố Mẹ Thử Thách 5 Giây" class="np-mascot sk-default" data-style="pop" data-game="bo-me-5-giay">
<title>Gấu Bố Mẹ vui tính — Bố Mẹ Thử Thách 5 Giây</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, chiếc nơ đỏ nhỏ trên tai phải. Đạo cụ nhận diện game (luôn có): đồng hồ cát + bàn tay xòe 5 ngón. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="bo-me-5-giay"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#D2A06C;--p2:#B07A44;--pst:#6E4620;--k1:var(--pa,#FF6B6B);--k2:var(--pb,#8A5A30);--bell:#F7E6CC;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="bo-me-5-giay"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="bo-me-5-giay"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-group" class="acc acc-group"><path d="M60 104Q34 170 62 232L128 218L194 232Q222 170 196 104Z" fill="#3DA5F5" stroke="#1F6FB0" stroke-width="3" stroke-linejoin="round"/></g><g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><circle cx="60" cy="62" r="26" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><circle cx="60" cy="62" r="14.3" fill="#F4C4A0"/><circle cx="196" cy="62" r="26" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><circle cx="196" cy="62" r="14.3" fill="#F4C4A0"/><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><ellipse cx="128" cy="184" rx="50" ry="36" fill="var(--bell)"/><ellipse cx="128" cy="146" rx="34" ry="26" fill="#F7E6CC"/><ellipse cx="44" cy="164" rx="16" ry="28" transform="rotate(-22 44 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="212" cy="164" rx="16" ry="28" transform="rotate(22 212 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><g id="mark" transform="translate(192 50)"><path d="M0 8L-16 0V16Z M0 8L16 0V16Z" fill="#FF6B6B" stroke="#C93A3A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="0" cy="8" r="5" fill="#FF9B9B" stroke="#C93A3A" stroke-width="2"/></g><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><ellipse id="nose" cx="128" cy="136" rx="9" ry="6.5" fill="#4A2F1A"/></g>
<g id="sign"><g transform="translate(188 136) scale(.95)"><rect x="6" y="26" width="38" height="30" rx="12" fill="#F7E6CC" stroke="#6E4620" stroke-width="3"/><g fill="#F7E6CC" stroke="#6E4620" stroke-width="3" stroke-linejoin="round"><rect x="2" y="8" width="8" height="26" rx="4" transform="rotate(-24 6 30)"/><rect x="11" y="0" width="8" height="32" rx="4"/><rect x="21" y="-2" width="8" height="34" rx="4"/><rect x="31" y="2" width="8" height="30" rx="4"/><rect x="40" y="10" width="8" height="26" rx="4" transform="rotate(22 44 30)"/></g></g><g transform="translate(14 140)"><path d="M0 0H34L22 24L34 48H0L12 24Z" fill="#fff" stroke="#8E9BB8" stroke-width="3" stroke-linejoin="round"/><path d="M6 6H28L22 22H12Z" fill="#FF6B6B"/><path d="M8 44H26L22 36H12Z" fill="#FF6B6B"/><path d="M-4 0H38M-4 48H38" stroke="#8E9BB8" stroke-width="4" stroke-linecap="round"/></g></g>
<g id="acc-badge" class="acc acc-badge"><path d="M96 168Q128 214 160 168" fill="none" stroke="#2A2A38" stroke-width="3.5"/><rect x="112" y="194" width="32" height="20" rx="8" fill="#B8C0D0" stroke="#6E7890" stroke-width="3"/><circle cx="148" cy="204" r="9" fill="#B8C0D0" stroke="#6E7890" stroke-width="3"/><rect x="26" y="150" width="30" height="40" rx="5" fill="#E8454F" stroke="#B02A32" stroke-width="3" transform="rotate(-12 40 170)"/></g><g id="acc-group" class="acc acc-group"><path d="M70 96Q128 78 186 96" fill="none" stroke="#FF5A5A" stroke-width="10" stroke-linecap="round"/><circle cx="128" cy="204" r="16" fill="#FFD43B" stroke="#E8A317" stroke-width="3"/><path d="M128 194l-9 12h7l-3 9 12-13h-7z" fill="#FF5A5A"/></g><g id="acc-night" class="acc acc-night"><g transform="translate(0 -14)"><path d="M76 88Q86 34 132 28Q170 28 182 66Q152 54 128 60Q104 66 76 88Z" fill="#8A6CFF" stroke="#2A1F7A" stroke-width="3" stroke-linejoin="round"/><path d="M72 90Q128 62 186 90" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="184" cy="64" r="10" fill="#fff" stroke="#C9C2FF" stroke-width="2.5"/><path d="M110 56l3 6 6.5 1-4.7 4.5 1.1 6.5-5.9-3.1-5.9 3.1 1.1-6.5-4.7-4.5 6.5-1z" fill="#FFD43B"/></g><g transform="rotate(-12 44 196)"><rect x="14" y="176" width="64" height="40" rx="14" fill="#FFF3F8" stroke="#E8A0C0" stroke-width="3"/><path d="M26 188q12 -4 24 0t24 0" fill="none" stroke="#E8A0C0" stroke-width="2.5" opacity=".7"/></g><g fill="#fff" stroke="#8E9BB8" stroke-width="1.2" font-family="Inter,system-ui,sans-serif" font-weight="900"><text x="188" y="70" font-size="22">Z</text><text x="206" y="54" font-size="16">z</text><text x="220" y="42" font-size="12">z</text></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -8)"><path d="M84 74L90 46L103 59L114 38L125 59L138 46L144 74Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(168 -2) scale(.7)"><path d="M84 74L90 46L103 59L114 38L125 59L138 46L144 74Z" fill="#FFB020" stroke="#C07A10" stroke-width="3.5" stroke-linejoin="round"/></g><rect x="204" y="150" width="6" height="60" rx="3" transform="rotate(10 207 180)" fill="#FFD43B" stroke="#E8A317" stroke-width="2.5"/><path d="M224 120l4.4 9 10 1.4-7.2 7 1.7 9.9-8.9-4.7-8.9 4.7 1.7-9.9-7.2-7 10-1.4z" fill="#FFD43B" stroke="#E8A317" stroke-width="2.5" stroke-linejoin="round"/></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
