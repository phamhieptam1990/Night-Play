<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bố Mẹ Thử Thách 5 Giây" class="np-mascot sk-default" data-style="pop" data-game="bo-me-5-giay">
<title>Gấu Bố Mẹ vui tính — Bố Mẹ Thử Thách 5 Giây</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, chiếc nơ đỏ nhỏ trên tai phải. Đạo cụ nhận diện game (luôn có): đồng hồ cát + bàn tay xòe 5 ngón. BẢN MẪU chờ duyệt (chỉ skin Mặc định).</desc>
<style>
.np-mascot[data-game="bo-me-5-giay"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#D2A06C;--p2:#B07A44;--pst:#6E4620;--k1:#FF6B6B;--k2:#8A5A30;--bell:#F7E6CC;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><circle cx="60" cy="62" r="26" fill="var(--p1)" stroke="var(--st)" stroke-width="3"/><circle cx="60" cy="62" r="14.3" fill="#F4C4A0"/><circle cx="196" cy="62" r="26" fill="var(--p1)" stroke="var(--st)" stroke-width="3"/><circle cx="196" cy="62" r="14.3" fill="#F4C4A0"/><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><ellipse cx="128" cy="184" rx="50" ry="36" fill="var(--bell)"/><ellipse cx="128" cy="146" rx="34" ry="26" fill="#F7E6CC"/><ellipse cx="44" cy="164" rx="16" ry="28" transform="rotate(-22 44 164)" fill="var(--p2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="212" cy="164" rx="16" ry="28" transform="rotate(22 212 164)" fill="var(--p2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><g id="mark" transform="translate(192 50)"><path d="M0 8L-16 0V16Z M0 8L16 0V16Z" fill="#FF6B6B" stroke="#C93A3A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="0" cy="8" r="5" fill="#FF9B9B" stroke="#C93A3A" stroke-width="2"/></g><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><ellipse id="nose" cx="128" cy="136" rx="9" ry="6.5" fill="#4A2F1A"/></g>
<g id="sign"><g transform="translate(188 136) scale(.95)"><rect x="6" y="26" width="38" height="30" rx="12" fill="#F7E6CC" stroke="#6E4620" stroke-width="3"/><g fill="#F7E6CC" stroke="#6E4620" stroke-width="3" stroke-linejoin="round"><rect x="2" y="8" width="8" height="26" rx="4" transform="rotate(-24 6 30)"/><rect x="11" y="0" width="8" height="32" rx="4"/><rect x="21" y="-2" width="8" height="34" rx="4"/><rect x="31" y="2" width="8" height="30" rx="4"/><rect x="40" y="10" width="8" height="26" rx="4" transform="rotate(22 44 30)"/></g></g><g transform="translate(14 140)"><path d="M0 0H34L22 24L34 48H0L12 24Z" fill="#fff" stroke="#8E9BB8" stroke-width="3" stroke-linejoin="round"/><path d="M6 6H28L22 22H12Z" fill="#FF6B6B"/><path d="M8 44H26L22 36H12Z" fill="#FF6B6B"/><path d="M-4 0H38M-4 48H38" stroke="#8E9BB8" stroke-width="4" stroke-linecap="round"/></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g>
<g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</svg>
