<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Gà Mẹ Bắn Trứng" class="np-mascot sk-default" data-style="night" data-game="ga-me-ban-trung">
<title>Gà Mái Ngầu — Gà Mẹ Bắn Trứng</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, ba tàn nhang má trái. Đạo cụ nhận diện game (luôn có): quả trứng + mũ lưỡi trai. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="ga-me-ban-trung"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FFF0D6"/><stop offset="1" stop-color="#EBCB98"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#FFF0D6"/><stop offset="1" stop-color="#EBCB98"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFF8EA"/><stop offset="1" stop-color="#FFF8EA" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="pose" transform="rotate(1.2 128 230)">

<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="96" cy="58" rx="28" ry="13" fill="#fff" opacity=".42" transform="rotate(-22 96 58)"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#EBCB98" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><ellipse cx="104" cy="108" rx="13" ry="15.5" fill="#2A1A33"/><circle cx="108" cy="102" r="4.193548387096774" fill="#fff"/><circle cx="100" cy="113" r="2.1666666666666665" fill="#fff" opacity=".85"/><ellipse cx="160" cy="108" rx="13" ry="15.5" fill="#2A1A33"/><circle cx="164" cy="102" r="4.193548387096774" fill="#fff"/><circle cx="156" cy="113" r="2.1666666666666665" fill="#fff" opacity=".85"/><path d="M86 94Q104 82 122 100M138 100Q158 82 176 94" fill="none" stroke="#2A1A33" stroke-width="5" stroke-linecap="round"/><ellipse cx="78" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M112 136Q130 146 152 128" fill="none" stroke="#7A2A3A" stroke-width="4.5" stroke-linecap="round"/></g><g id="mark" fill="#C8693A"><circle cx="76" cy="128" r="2.8"/><circle cx="86" cy="134" r="2.8"/><circle cx="76" cy="140" r="2.8"/></g></g>
<path d="M104 40Q96 8 118 18Q122 0 134 18Q152 6 152 36Z" fill="#FF4D6D"/><path d="M86 66Q92 30 128 28Q164 30 170 66Z" fill="#3B82F6"/><path d="M164 60H214Q218 74 202 76H164Z" fill="#3B82F6"/><g id="sign"><ellipse cx="208" cy="190" rx="26" ry="32" fill="#FFF8EC" stroke="#E8D5B0" stroke-width="3" transform="rotate(14 208 190)"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
