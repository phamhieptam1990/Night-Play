<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Gà Mẹ Bắn Trứng" class="np-mascot sk-default" data-style="night" data-game="ga-me-ban-trung">
<title>Gà Mái Ngầu — Gà Mẹ Bắn Trứng</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, ba tàn nhang má trái. Đạo cụ nhận diện game (luôn có): quả trứng + mũ lưỡi trai. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="ga-me-ban-trung"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#FFF0D6;--p2:#EBCB98;--g0:color-mix(in srgb,var(--p1) 56%,#fff);--g1:var(--p1);--g2:var(--p2);--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.np-mascot.sk-night{--g0:color-mix(in srgb,var(--p1) 26%,#8C8CFF);--g1:color-mix(in srgb,var(--p1) 34%,#4040B8);--g2:color-mix(in srgb,var(--p2) 40%,#1C1C6A)}
.np-mascot.sk-star{--g0:color-mix(in srgb,var(--p1) 38%,#fff);--g1:color-mix(in srgb,var(--p1) 72%,#fff);--g2:color-mix(in srgb,var(--p2) 78%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.sk-badge .base-top,.sk-group .base-top,.sk-night .base-top,.sk-star .base-top{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}@keyframes npa-twinkle{0%,100%{opacity:.35}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" style="stop-color:var(--g0)"/><stop offset=".55" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" style="stop-color:var(--g0)"/><stop offset=".6" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFF8EA"/><stop offset="1" stop-color="#FFF8EA" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"><path d="M30 226Q128 254 226 226" fill="none" stroke="#E3B27A" stroke-width="12" stroke-linecap="round" opacity=".8"/></g><g id="pose" transform="rotate(1.2 128 230)">
<g id="charg" transform="translate(14 30) scale(.82)"><g id="back-star" class="acc acc-star"><path d="M54 120Q26 184 56 244L128 226L200 244Q230 184 202 120Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M76 150Q128 172 180 150" fill="none" stroke="#fff" stroke-width="4" opacity=".6" stroke-linecap="round"/></g>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<path d="M84 160H172L184 224Q128 242 72 224Z" fill="#3B82F6"/><path d="M84 160L92 134M172 160L164 134" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/><circle cx="92" cy="170" r="5" fill="#FFD93D"/><circle cx="164" cy="170" r="5" fill="#FFD93D"/><rect x="108" y="190" width="40" height="22" rx="7" fill="#244A9A" opacity=".35"/><ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#EBCB98" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><ellipse cx="104" cy="108" rx="13" ry="16" fill="url(#e)"/><ellipse cx="107" cy="111" rx="6.5" ry="7.8" fill="#C6568A" opacity=".6"/><ellipse cx="108.42" cy="101.5" rx="3.9" ry="4.42" fill="#fff"/><path d="M90 102l-8 -6M93 96l-6 -8M118 102l8 -6M115 96l6 -8" stroke="#2A1A33" stroke-width="3.4" stroke-linecap="round"/><ellipse cx="160" cy="108" rx="13" ry="16" fill="url(#e)"/><ellipse cx="163" cy="111" rx="6.5" ry="7.8" fill="#C6568A" opacity=".6"/><ellipse cx="164.42" cy="101.5" rx="3.9" ry="4.42" fill="#fff"/><path d="M146 102l-8 -6M149 96l-6 -8M174 102l8 -6M171 96l6 -8" stroke="#2A1A33" stroke-width="3.4" stroke-linecap="round"/><path d="M86 94Q104 82 122 100M138 100Q158 82 176 94" fill="none" stroke="#2A1A33" stroke-width="5" stroke-linecap="round"/><ellipse cx="78" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/></g><path d="M116 126L128 118L140 126L128 146Z" fill="#FF9F1C"/><path d="M126 148q2 14 6 0z" fill="#FF4D6D"/><g id="mark" fill="#C8693A"><circle cx="76" cy="128" r="2.8"/><circle cx="86" cy="134" r="2.8"/><circle cx="76" cy="140" r="2.8"/></g></g>
