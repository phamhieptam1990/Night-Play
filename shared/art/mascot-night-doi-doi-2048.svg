<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đổi Đời 2048" class="np-mascot sk-default" data-style="night" data-game="doi-doi-2048">
<title>Mèo Thần Tài — Đổi Đời 2048</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (nháy mắt lè lưỡi) + một chân mày nhướn, chấm vàng nhỏ giữa trán. Đạo cụ nhận diện game (luôn có): tấm vàng 2048 + tay vẫy. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="doi-doi-2048"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#FFFFFF;--p2:#E8E4F4;--pa:#FF4FA3;--pb:#FFC400;--face:#FFFFFF;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-5 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><path d="M64 78L58 30L104 56Q128 50 152 56L198 30L192 78Q214 112 200 160V216H56V160Q42 112 64 78Z"/></g>
<g id="body"><path d="M64 80L58 32L104 58ZM192 80L198 32L152 58Z" fill="var(--c1)"/><path d="M72 78L70 48L94 62ZM184 78L186 48L162 62Z" fill="#FFB3CF" stroke="none"/><rect x="56" y="150" width="144" height="76" rx="30" fill="var(--c1)"/><ellipse cx="128" cy="108" rx="72" ry="58" fill="var(--c1)"/><path d="M92 156Q128 176 164 156L160 186Q128 204 96 186Z" fill="#E8454F" stroke-width="4"/><circle cx="128" cy="184" r="9" fill="var(--c4)" stroke-width="3.5"/><path d="M190 160Q222 140 212 100Q232 90 236 110" fill="none" stroke-width="10" stroke-linecap="round"/><path d="M190 160Q222 140 212 100Q232 90 236 110" fill="none" stroke="var(--c1)" stroke-width="4" stroke-linecap="round"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="102" cy="108" rx="9.5" ry="10.5" fill="var(--ink)" stroke="none"/><circle cx="105" cy="105" r="3" fill="#fff" stroke="none"/><path d="M143 113Q154 101 165 113" fill="none" stroke-width="5"/><path d="M92 88L112 92" fill="none" stroke-width="5"/><path d="M145 91L165 86" fill="none" stroke-width="5"/></g><g id="mouthg"><path id="mouth" class="m-talk" d="M110 134Q128 154 146 132" fill="var(--ink)" stroke-width="4.5"/><path d="M127 144q0 16 7 16q7 0 7 -16z" fill="#FF6F91" stroke-width="3.5"/></g><circle id="mark" cx="128" cy="76" r="5" fill="var(--c4)" stroke-width="2.5"/></g>
<circle cx="72" cy="118" r="7" fill="none" stroke="var(--c4)" stroke-width="5"/><g id="sign"><rect x="12" y="170" width="62" height="42" rx="8" fill="var(--c4)" stroke-width="5" transform="rotate(-10 43 191)"/><text transform="rotate(-10 43 191)" x="43" y="200" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="17" fill="var(--ink)" stroke="none">2048</text></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
