<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Xây Cầu Tre" class="np-mascot sk-default" data-style="night" data-game="xay-cau-tre">
<title>Khỉ Thợ Xây — Xây Cầu Tre</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, vệt sơn xanh trên má. Đạo cụ nhận diện game (luôn có): bó tre + mũ bảo hộ. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="xay-cau-tre"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#D69A5E"/><stop offset=".55" stop-color="#B5651D"/><stop offset="1" stop-color="#7A3F0E"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#D69A5E"/><stop offset=".6" stop-color="#B5651D"/><stop offset="1" stop-color="#7A3F0E"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFE0B8"/><stop offset="1" stop-color="#FFE0B8" stop-opacity=".78"/></radialGradient></defs>
