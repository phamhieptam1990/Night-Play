<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Xây Cầu Tre" class="np-mascot sk-default" data-style="night" data-game="xay-cau-tre">
<title>Khỉ Thợ Xây — Xây Cầu Tre</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, vệt sơn xanh trên má. Đạo cụ nhận diện game (luôn có): bó tre + mũ bảo hộ. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="xay-cau-tre"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#D69A5E"/><stop offset=".55" stop-color="#B5651D"/><stop offset="1" stop-color="#7A3F0E"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#D69A5E"/><stop offset=".6" stop-color="#B5651D"/><stop offset="1" stop-color="#7A3F0E"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFE0B8"/><stop offset="1" stop-color="#FFE0B8" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="pose" transform="rotate(0 128 230)">
<path d="M208 210Q250 198 240 154Q232 136 216 148Q232 158 222 180Z" fill="#7A3F0E"/>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<ellipse cx="44" cy="112" rx="26" ry="26" fill="#B5651D" /><ellipse cx="44" cy="112" rx="15" ry="15" fill="#FFE0B8" /><ellipse cx="212" cy="112" rx="26" ry="26" fill="#B5651D" /><ellipse cx="212" cy="112" rx="15" ry="15" fill="#FFE0B8" /><ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="96" cy="58" rx="28" ry="13" fill="#fff" opacity=".42" transform="rotate(-22 96 58)"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#7A3F0E" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><ellipse cx="100" cy="108" rx="13" ry="15.5" fill="#2A1A33"/><circle cx="104" cy="102" r="4.193548387096774" fill="#fff"/><circle cx="96" cy="113" r="2.1666666666666665" fill="#fff" opacity=".85"/><ellipse cx="156" cy="108" rx="13" ry="15.5" fill="#2A1A33"/><circle cx="160" cy="102" r="4.193548387096774" fill="#fff"/><circle cx="152" cy="113" r="2.1666666666666665" fill="#fff" opacity=".85"/><ellipse cx="78" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M104 130Q128 160 152 130Z" fill="#7A2A3A"/><path d="M114 146Q128 136 142 146Q128 156 114 146Z" fill="#FF7F9A"/></g><ellipse id="mark" cx="182" cy="140" rx="8" ry="5.5" fill="#43C46B"/></g>
<path d="M76 68Q80 20 128 18Q176 20 180 68Z" fill="#FFD93D"/><path d="M70 68H186" stroke="#FFD93D" stroke-width="9" stroke-linecap="round"/><g id="sign" transform="rotate(14 214 170)"><rect x="194" y="108" width="14" height="116" rx="6" fill="#9BD65C"/><rect x="212" y="104" width="14" height="120" rx="6" fill="#B5E36F"/><rect x="230" y="110" width="14" height="114" rx="6" fill="#9BD65C"/><path d="M192 158H246M192 190H246" stroke="#E8A317" stroke-width="5"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
