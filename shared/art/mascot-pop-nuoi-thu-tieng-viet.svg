<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Nuôi Thú Tiếng Việt" class="np-mascot sk-default" data-style="pop" data-game="nuoi-thu-tieng-viet">
<title>Cún Bi — Nuôi Thú Tiếng Việt</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, đốm nâu quanh mắt trái + thẻ tên vàng dấu ✓ trên vòng cổ. Đạo cụ nhận diện game (luôn có): bát ăn xanh có ô chữ A + vòng cổ đỏ thẻ ✓. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="nuoi-thu-tieng-viet"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#FFC46E;--p2:#EE9A3E;--pst:#B8742E;--k1:var(--pa,#E8454F);--k2:var(--pb,#FFD54A);--bell:#FFEBC8;--ear:#B8742E;--patch:#C98438;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="nuoi-thu-tieng-viet"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#2C2A9C);--c2:color-mix(in srgb,var(--p2) 55%,#2C2A9C);--st:color-mix(in srgb,var(--pst) 50%,#2C2A9C)}
.np-mascot[data-game="nuoi-thu-tieng-viet"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><radialGradient id="pg" cx=".36" cy=".28" r=".85"><stop offset="0" style="stop-color:color-mix(in srgb,var(--c1) 62%,#fff)"/><stop offset=".5" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></radialGradient><radialGradient id="pe" cx=".36" cy=".28" r=".85"><stop offset="0" style="stop-color:color-mix(in srgb,var(--ear) 66%,#fff)"/><stop offset="1" style="stop-color:var(--ear)"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
