<g id="body"><g transform="rotate(24 196 190)"><ellipse cx="208" cy="184" rx="12" ry="30" fill="url(#pg)" stroke="var(--st)" stroke-width="3" /></g><g transform="rotate(14 56 100)"><ellipse cx="48" cy="108" rx="22" ry="44" fill="url(#pe)" stroke="var(--st)" stroke-width="3" /><ellipse cx="42" cy="92" rx="5" ry="15" fill="#fff" opacity=".24"/></g><g transform="rotate(-14 200 100)"><ellipse cx="208" cy="108" rx="22" ry="44" fill="url(#pe)" stroke="var(--st)" stroke-width="3" /><ellipse cx="214" cy="92" rx="5" ry="15" fill="#fff" opacity=".24"/></g><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3" /><path d="M57.5 174.4Q128 246.6 198.5 174.4Q128 210.5 57.5 174.4Z" fill="var(--st)" opacity="0.2"/><path d="M200.8 176.9A82.5 78.5 0 0 1 136.6 218.1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".38"/><ellipse cx="97" cy="94.1" rx="25.8" ry="11.5" transform="rotate(-24 97 94.1)" fill="var(--hl)" opacity=".5"/><circle cx="74.7" cy="112.1" r="3.4" fill="var(--hl)" opacity=".75"/><ellipse cx="128" cy="188" rx="48" ry="33" fill="var(--bell)" opacity=".95"/><ellipse cx="128" cy="148" rx="40" ry="26" fill="var(--bell)"/><ellipse cx="44" cy="166" rx="15" ry="26" fill="url(#pg)" stroke="var(--st)" stroke-width="3" transform="rotate(-22 44 166)"/><ellipse cx="212" cy="166" rx="15" ry="26" fill="url(#pg)" stroke="var(--st)" stroke-width="3" transform="rotate(22 212 166)"/><ellipse cx="102" cy="226" rx="17" ry="9" fill="url(#pg)" stroke="var(--st)" stroke-width="3" /><ellipse cx="154" cy="226" rx="17" ry="9" fill="url(#pg)" stroke="var(--st)" stroke-width="3" /></g>
