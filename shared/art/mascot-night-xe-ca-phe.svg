<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Xe Cà Phê Của Tôi" class="np-mascot sk-default" data-style="night" data-game="xe-ca-phe">
<title>Lười Phin Đá — Xe Cà Phê Của Tôi</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt lim dim nửa mở, một chân mày nhướn, nhếch mép một bên, hai sọc tối kéo dài từ mắt. Đạo cụ nhận diện game (luôn có): ly cà phê sữa đá bốc hơi. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="xe-ca-phe"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#B9A28C;--p2:#8C735C;--pa:#FF7A3C;--pb:#4A2C1A;--face:#EBDCCB;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--face)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="150" rx="84" ry="78"/></g>
<g id="body"><path d="M52 144Q20 150 22 204Q40 214 60 190ZM204 144Q236 150 234 204Q216 214 196 190Z" fill="var(--c2)"/><path d="M26 198l-4 14M40 204l-2 14M214 204l2 14M230 198l4 14" fill="none" stroke-width="5"/><ellipse cx="128" cy="152" rx="80" ry="74" fill="var(--c1)"/><ellipse cx="128" cy="116" rx="60" ry="48" fill="var(--face)" stroke-width="4"/><ellipse cx="128" cy="194" rx="42" ry="30" fill="var(--c2)" stroke="none" opacity=".5"/><ellipse cx="128" cy="140" rx="9" ry="6" fill="var(--ink)" stroke="none"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="102" cy="112" rx="9" ry="10" fill="var(--ink)" stroke="none"/><ellipse cx="154" cy="112" rx="9" ry="10" fill="var(--ink)" stroke="none"/><circle cx="105" cy="109" r="3" fill="#fff" stroke="none"/><circle cx="157" cy="109" r="3" fill="#fff" stroke="none"/><rect x="91" y="100" width="22" height="10" fill="var(--face)" stroke="none"/><rect x="143" y="100" width="22" height="10" fill="var(--face)" stroke="none"/></g><path d="M92 97H111M143 97L165 90" fill="none" stroke-width="4.5"/><path id="mouth" class="m-talk" d="M115 150Q132 160 146 142M146 142l5 -3" fill="none" stroke-width="4"/><path id="mark" d="M86 120Q70 138 76 158M170 120Q186 138 180 158" fill="none" stroke="#4A2C1A" stroke-width="9" stroke-linecap="round"/></g>
<g id="sign"><path d="M182 160H238L232 218Q230 230 218 230H202Q190 230 188 218Z" fill="#fff" stroke-width="5"/><path d="M185 184H236L232 218Q230 230 218 230H202Q190 230 188 218Z" fill="var(--c4)" stroke="none"/><path d="M238 172Q258 174 254 194Q250 208 234 206" fill="none" stroke-width="5"/><path d="M196 146q-6-10 0-18M214 146q-6-10 0-18" fill="none" stroke="#fff" stroke-width="4"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
