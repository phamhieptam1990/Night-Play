<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Nhảy Theo Số" class="np-mascot sk-default" data-style="pop" data-game="nhay-theo-so">
<title>Thỏ Vũ công Nhịp — Nhảy Theo Số</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, ngôi sao lấp lánh nhỏ cạnh mắt phải. Đạo cụ nhận diện game (luôn có): nốt nhạc có số nhịp + váy tutu. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="nhay-theo-so"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#FFC1DC;--p2:#FF8FC0;--pst:#C8508A;--k1:var(--pa,#B28CFF);--k2:var(--pb,#FFD43B);--bell:#FFF3F8;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="nhay-theo-so"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="nhay-theo-so"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><ellipse cx="94" cy="34" rx="17" ry="46" transform="rotate(-10 94 34)" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="94" cy="38" rx="8" ry="32" transform="rotate(-10 94 38)" fill="#FF9DB8"/><ellipse cx="168" cy="26" rx="17" ry="46" transform="rotate(22 168 26)" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="168" cy="30" rx="8" ry="32" transform="rotate(22 168 30)" fill="#FF9DB8"/><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><ellipse cx="128" cy="184" rx="50" ry="36" fill="var(--bell)"/><path d="M68 196Q128 178 188 196L202 226Q128 240 54 226Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M72 204Q128 192 184 204" fill="none" stroke="#fff" stroke-width="4" opacity=".6" stroke-linecap="round"/><path d="M40 156Q22 112 42 82" fill="none" stroke="var(--c2)" stroke-width="22" stroke-linecap="round"/><circle cx="42" cy="78" r="13" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="212" cy="168" rx="16" ry="28" transform="rotate(22 212 168)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><circle cx="226" cy="214" r="12" fill="#fff" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" d="M184 98l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FFD43B" stroke="#D8A80A" stroke-width="1.6" stroke-linejoin="round"/><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><path id="nose" d="M122 134Q128 130 134 134Q128 142 122 134Z" fill="#FF6F9C"/></g>
<g id="sign"><circle cx="204" cy="100" r="17" fill="#fff" stroke="#8E9BB8" stroke-width="3"/><text x="204" y="107" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="20" fill="#B28CFF">8</text><path d="M221 100V62L238 68" fill="none" stroke="#B28CFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="acc-badge" class="acc acc-badge"><path d="M52 112Q52 40 128 38Q204 40 204 112" fill="none" stroke="#2A2A38" stroke-width="10" stroke-linecap="round"/><rect x="40" y="102" width="26" height="42" rx="12" fill="#7B4AE2" stroke="#4A2EA8" stroke-width="3"/><rect x="190" y="102" width="26" height="42" rx="12" fill="#7B4AE2" stroke="#4A2EA8" stroke-width="3"/><g transform="translate(36 196)"><circle r="24" fill="#2A2A38" stroke="#000" stroke-width="3"/><circle r="9" fill="#FF5A9A"/><circle r="2.5" fill="#2A2A38"/><path d="M-16 -8A18 18 0 0 1 8 -16" fill="none" stroke="#fff" stroke-width="3" opacity=".5" stroke-linecap="round"/></g></g><g id="acc-group" class="acc acc-group"><path d="M104 52L112 34L128 46L144 34L152 52Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><path d="M64 70L48 58L56 80ZM192 70L208 58L200 80Z" fill="#FF8FC0" stroke="#C8508A" stroke-width="3" stroke-linejoin="round"/><path d="M90 226q-8 8-22 6M166 226q8 8 22 6" fill="none" stroke="#FF8FC0" stroke-width="5" stroke-linecap="round"/></g><g id="acc-night" class="acc acc-night"><path d="M128 -10V28" stroke="#9AA3B8" stroke-width="3"/><g transform="translate(128 44)"><circle r="22" fill="#C8CEDA" stroke="#7A8398" stroke-width="3"/><g stroke="#7A8398" stroke-width="2"><path d="M-22 0H22M0 -22V22M-15 -15L15 15M15 -15L-15 15"/></g><circle cx="-7" cy="-8" r="5" fill="#fff" opacity=".7"/></g><path d="M128 66L60 140M128 66L196 130M128 66L128 150" stroke="#FFE08A" stroke-width="3" opacity=".35"/><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -8)"><path d="M94 70L102 38L117 55L128 30L139 55L154 38L162 70Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="56" r="4" fill="#FF6B6B"/><circle cx="108" cy="60" r="3" fill="#4DABF7"/><circle cx="148" cy="60" r="3" fill="#51CF66"/></g><g transform="translate(206 120) rotate(14)"><rect x="-5" y="0" width="10" height="56" rx="5" fill="#FFD43B" stroke="#C89A0A" stroke-width="2.5"/><circle cy="-6" r="14" fill="#FFE066" stroke="#C89A0A" stroke-width="3"/><path d="M-8 -6h16M-8 -1h16" stroke="#C89A0A" stroke-width="2"/></g><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
