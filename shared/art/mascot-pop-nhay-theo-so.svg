<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Nhảy Theo Số" class="np-mascot sk-default" data-style="pop" data-game="nhay-theo-so">
<title>Vũ công Nhịp — Nhảy Theo Số</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, ngôi sao lấp lánh nhỏ cạnh mắt phải. Đạo cụ nhận diện game (luôn có): nốt nhạc có số nhịp. BẢN MẪU chờ duyệt (chỉ skin Mặc định).</desc>
<style>
.np-mascot[data-game="nhay-theo-so"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#FFB0D4;--p2:#FF7AB6;--pst:#C84A88;--k1:#FFD43B;--k2:#7B4AE2;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><ellipse cx="128" cy="196" rx="52" ry="38" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><path d="M40 150Q22 104 40 74" fill="none" stroke="var(--p2)" stroke-width="22" stroke-linecap="round"/><circle cx="40" cy="70" r="14" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="128" cy="128" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><path d="M46 98Q60 40 128 38Q196 40 210 98Q188 72 128 70Q68 72 46 98Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><circle cx="196" cy="62" r="13" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" d="M184 98l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FFD43B" stroke="#D8A80A" stroke-width="1.6" stroke-linejoin="round"/><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/></g>
<g id="sign"><circle cx="204" cy="202" r="17" fill="#fff" stroke="#8E9BB8" stroke-width="3"/><text x="204" y="209" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="20" fill="#7B4AE2">8</text><path d="M221 202V164L238 170" fill="none" stroke="#7B4AE2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g>
<g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</svg>
