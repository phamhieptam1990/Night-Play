<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cánh Nhỏ Phiêu Lưu" class="np-mascot sk-default" data-style="night" data-game="cozy-wings">
<title>Chim Sẻ Chong Chóng — Cánh Nhỏ Phiêu Lưu</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (hào hứng há mỏ hét) + một chân mày nhướn, hai sọc nâu bên má. Đạo cụ nhận diện game (luôn có): mũ chong chóng trên đầu + cánh nhỏ bất cân xứng. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="cozy-wings"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#FFC93C;--p2:#F29A1F;--pa:#4FC3F7;--pb:#FF5A8A;--face:#FFF3C8;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(7 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="144" rx="84" ry="80"/></g>
<g id="body"><path d="M52 150Q24 120 40 92Q70 100 74 140ZM204 150Q238 100 232 56Q196 80 184 140Z" fill="var(--c2)"/><ellipse cx="128" cy="146" rx="80" ry="76" fill="var(--c1)"/><ellipse cx="128" cy="184" rx="48" ry="34" fill="var(--face)" stroke-width="4"/><path d="M104 226v14M152 226v14" fill="none" stroke-width="7"/><path d="M112 136L128 128L144 136L128 152Z" fill="#FF8A1F" stroke-width="3.5"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="112" r="11" fill="#fff" stroke-width="4"/><circle cx="103" cy="113" r="5" fill="var(--ink)" stroke="none"/><circle cx="105" cy="111" r="2" fill="#fff" stroke="none"/><circle cx="154" cy="112" r="11" fill="#fff" stroke-width="4"/><circle cx="155" cy="113" r="5" fill="var(--ink)" stroke="none"/><circle cx="157" cy="111" r="2" fill="#fff" stroke="none"/><path d="M90 90L110 97" fill="none" stroke-width="5"/><path d="M146 97L166 90" fill="none" stroke-width="5"/></g><g id="mouthg"><path id="mouth" class="m-talk" d="M110 138Q128 130 146 138Q142 168 128 168Q114 168 110 138Z" fill="var(--ink)" stroke-width="4.5"/><path d="M118 154Q128 146 138 154Q128 166 118 154Z" fill="#FF6F91" stroke="none"/></g><g id="mark" fill="none" stroke="#A8571A" stroke-width="4"><path d="M64 132l12 4M66 144l12 -2"/></g></g>
<path d="M56 126Q56 70 128 70Q200 70 200 126" fill="none" stroke-width="9"/><rect x="44" y="108" width="24" height="42" rx="11" fill="var(--c3x)" stroke-width="4.5"/><rect x="188" y="108" width="24" height="42" rx="11" fill="var(--c3x)" stroke-width="4.5"/><g id="sign"><path d="M92 74Q92 40 128 40Q164 40 164 74Z" fill="var(--c3x)" stroke-width="5"/><path d="M128 40V26" stroke-width="4" fill="none"/><path d="M128 26Q104 10 100 28Q112 38 128 26Q152 10 156 28Q144 38 128 26Z" fill="var(--c4)" stroke-width="4"/><circle cx="128" cy="26" r="5" fill="#fff" stroke-width="3"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
