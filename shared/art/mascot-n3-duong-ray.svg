<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đường Ray" class="np-mascot sk-default" data-style="night" data-game="duong-ray">
<title>Đầu Tàu Tèo — Đường Ray</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, vệt than trên má. Đạo cụ nhận diện game (luôn có): ống khói + đường ray. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="duong-ray"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#FF8F8F"/><stop offset=".55" stop-color="#E94B4B"/><stop offset="1" stop-color="#A82A2A"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FF8F8F"/><stop offset=".6" stop-color="#E94B4B"/><stop offset="1" stop-color="#A82A2A"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFE9D6"/><stop offset="1" stop-color="#FFE9D6" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"><path d="M96 120L16 256M160 120L240 256" stroke="#fff" stroke-width="7" opacity=".35"/><g stroke="#FFD93D" stroke-width="7" opacity=".5" stroke-linecap="round"><path d="M70 176H186M52 204H204M34 232H222"/></g></g><g id="pose" transform="rotate(0 128 230)">
<g id="charg" transform="translate(14 30) scale(.82)">
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><rect x="46" y="38" width="164" height="150" rx="58" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#A82A2A" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><rect x="76" y="88" width="32" height="38" rx="11" fill="url(#e)"/><rect x="148" y="88" width="32" height="38" rx="11" fill="url(#e)"/><rect x="82" y="94" width="12" height="15" rx="5" fill="#fff"/><rect x="154" y="94" width="12" height="15" rx="5" fill="#fff"/><path d="M72 80H112M144 80H184" stroke="#2A1A33" stroke-width="6" stroke-linecap="round"/><rect x="104" y="134" width="48" height="16" rx="6" fill="#fff" stroke="#7A2A3A" stroke-width="3.5"/><path d="M116 134V150M128 134V150M140 134V150" stroke="#7A2A3A" stroke-width="2.5"/></g><path id="mark" d="M76 134q8-6 14 0q-2 8-14 6z" fill="#3A2A33" opacity=".6"/></g>
<rect x="94" y="22" width="44" height="40" rx="8" fill="#9C2A2A"/><path d="M86 26H146" stroke="#FFD93D" stroke-width="9" stroke-linecap="round"/><circle cx="104" cy="8" r="9" fill="#fff" opacity=".9"/><circle cx="124" cy="-2" r="7" fill="#fff" opacity=".8"/></g>
<g id="propg" transform="translate(128 250) scale(1.3) translate(-128 -250)"><g id="sign"><path d="M14 238H242" stroke="#FFD93D" stroke-width="9" stroke-linecap="round"/><path d="M40 230V246M84 230V246M128 230V246M172 230V246M216 230V246" stroke="#8A6A3C" stroke-width="5"/></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
