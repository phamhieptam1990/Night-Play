<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đường Ray" class="np-mascot sk-default" data-style="night" data-game="duong-ray">
<title>Đầu Tàu Tèo — Đường Ray</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, vệt than trên má. Đạo cụ nhận diện game (luôn có): ống khói + đường ray. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="duong-ray"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#E94B4B;--p2:#A82A2A;--g0:color-mix(in srgb,var(--p1) 56%,#fff);--g1:var(--p1);--g2:var(--p2);--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.np-mascot.sk-night{--g0:color-mix(in srgb,var(--p1) 26%,#8C8CFF);--g1:color-mix(in srgb,var(--p1) 34%,#4040B8);--g2:color-mix(in srgb,var(--p2) 40%,#1C1C6A)}
.np-mascot.sk-star{--g0:color-mix(in srgb,var(--p1) 38%,#fff);--g1:color-mix(in srgb,var(--p1) 72%,#fff);--g2:color-mix(in srgb,var(--p2) 78%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.sk-badge .base-top,.sk-group .base-top,.sk-night .base-top,.sk-star .base-top{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}@keyframes npa-twinkle{0%,100%{opacity:.35}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" style="stop-color:var(--g0)"/><stop offset=".55" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" style="stop-color:var(--g0)"/><stop offset=".6" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFE9D6"/><stop offset="1" stop-color="#FFE9D6" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"><path d="M96 120L16 256M160 120L240 256" stroke="#fff" stroke-width="7" opacity=".35"/><g stroke="#FFD93D" stroke-width="7" opacity=".5" stroke-linecap="round"><path d="M70 176H186M52 204H204M34 232H222"/></g></g><g id="pose" transform="rotate(0 128 230)">
<g id="charg" transform="translate(14 30) scale(.82)"><g id="back-star" class="acc acc-star"><path d="M54 120Q26 184 56 244L128 226L200 244Q230 184 202 120Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M76 150Q128 172 180 150" fill="none" stroke="#fff" stroke-width="4" opacity=".6" stroke-linecap="round"/></g>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><rect x="46" y="38" width="164" height="150" rx="58" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#A82A2A" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><rect x="76" y="88" width="32" height="38" rx="11" fill="url(#e)"/><rect x="148" y="88" width="32" height="38" rx="11" fill="url(#e)"/><rect x="82" y="94" width="12" height="15" rx="5" fill="#fff"/><rect x="154" y="94" width="12" height="15" rx="5" fill="#fff"/><path d="M72 80H112M144 80H184" stroke="#2A1A33" stroke-width="6" stroke-linecap="round"/><rect x="104" y="134" width="48" height="16" rx="6" fill="#fff" stroke="#7A2A3A" stroke-width="3.5"/><path d="M116 134V150M128 134V150M140 134V150" stroke="#7A2A3A" stroke-width="2.5"/></g><path id="mark" d="M76 134q8-6 14 0q-2 8-14 6z" fill="#3A2A33" opacity=".6"/></g>
<g class="base-top"><rect x="94" y="22" width="44" height="40" rx="8" fill="#9C2A2A"/><path d="M86 26H146" stroke="#FFD93D" stroke-width="9" stroke-linecap="round"/><circle cx="104" cy="8" r="9" fill="#fff" opacity=".9"/><circle cx="124" cy="-2" r="7" fill="#fff" opacity=".8"/></g><rect x="52" y="168" width="152" height="14" rx="6" fill="#FFD93D"/><circle cx="128" cy="198" r="12" fill="#FFF3A0" stroke="#C8A80A" stroke-width="3"/><circle cx="82" cy="226" r="22" fill="#3A3A52"/><circle cx="82" cy="226" r="8" fill="#FFD93D"/><circle cx="174" cy="226" r="22" fill="#3A3A52"/><circle cx="174" cy="226" r="8" fill="#FFD93D"/><g id="acc-badge" class="acc acc-badge"><path d="M64 74Q68 14 128 12Q188 14 192 74Z" fill="#3A6FD8"/><path d="M70 66H186" stroke="#fff" stroke-width="7" opacity=".85"/><rect x="104" y="44" width="48" height="14" rx="7" fill="#1C1426" opacity=".55"/><path d="M112 160L124 190L134 190L146 160Z" fill="#3A6FD8" opacity=".85"/><circle cx="128" cy="198" r="15" fill="#FFD43B" stroke="#C89A0A" stroke-width="3.5"/><path d="M128 190l3 6 7 1-5 5 1.4 7-6.4-3.4-6.4 3.4 1.4-7-5-5 7-1z" fill="#fff"/></g><g id="acc-group" class="acc acc-group"><ellipse cx="116" cy="40" rx="64" ry="22" fill="#E8454F" transform="rotate(-8 116 40)"/><circle cx="148" cy="20" r="6" fill="#222"/></g><g id="acc-night" class="acc acc-night"><path d="M50 104Q50 30 128 30Q206 30 206 104" fill="none" stroke="#7CFFB2" stroke-width="10"/><rect x="34" y="90" width="28" height="50" rx="13" fill="#7CFFB2"/><rect x="194" y="90" width="28" height="50" rx="13" fill="#7CFFB2"/><rect x="34" y="90" width="28" height="50" rx="13" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><rect x="194" y="90" width="28" height="50" rx="13" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/></g><g id="acc-star" class="acc acc-star"><path d="M78 56L86 14L108 38L128 4L148 38L170 14L178 56Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="30" r="5.5" fill="#E8454F"/><path d="M112 160L124 190L134 190L146 160Z" fill="#E8454F" opacity=".85"/><circle cx="128" cy="198" r="15" fill="#FFD43B" stroke="#C89A0A" stroke-width="3.5"/><path d="M128 190l3 6 7 1-5 5 1.4 7-6.4-3.4-6.4 3.4 1.4-7-5-5 7-1z" fill="#fff"/></g><g id="fx-night" class="fx fx-night"><ellipse cx="128" cy="124" rx="122" ry="116" fill="none" stroke="var(--bgx)" stroke-width="5" opacity=".9"/><ellipse cx="128" cy="124" rx="132" ry="124" fill="none" stroke="#7CF0FF" stroke-width="2.5" opacity=".5"/><g fill="#fff" class="npa-twinkle"><path d="M30 60l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z"/><path d="M226 120l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z"/></g><g fill="#7CF0FF" class="npa-twinkle" style="animation-delay:.8s"><circle cx="40" cy="170" r="4"/><circle cx="220" cy="46" r="3.5"/><circle cx="24" cy="112" r="3"/></g></g><g id="fx-star" class="fx fx-star"><g fill="#FFE08A" class="npa-twinkle"><path d="M34 70l3 7.4 7.4 3-7.4 3-3 7.4-3-7.4-7.4-3 7.4-3z"/><path d="M222 150l3 7.4 7.4 3-7.4 3-3 7.4-3-7.4-7.4-3 7.4-3z"/><path d="M214 40l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z"/></g><g fill="#FF8AD0" class="npa-twinkle" style="animation-delay:.7s"><circle cx="46" cy="190" r="4"/><circle cx="232" cy="96" r="3.5"/></g></g></g>
<g id="propg" transform="translate(128 250) scale(1.3) translate(-128 -250)"><g id="sign"><path d="M14 238H242" stroke="#FFD93D" stroke-width="9" stroke-linecap="round"/><path d="M40 230V246M84 230V246M128 230V246M172 230V246M216 230V246" stroke="#8A6A3C" stroke-width="5"/></g></g>
</g></g></svg>
