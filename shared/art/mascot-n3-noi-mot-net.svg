<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Nối Một Nét" class="np-mascot sk-default" data-style="night" data-game="noi-mot-net">
<title>Nhện Giăng Tơ — Nối Một Nét</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, ba chấm trắng trên trán. Đạo cụ nhận diện game (luôn có): sợi tơ nối chấm. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="noi-mot-net"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#6A6A9E"/><stop offset=".55" stop-color="#3E3C70"/><stop offset="1" stop-color="#22214A"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#6A6A9E"/><stop offset=".6" stop-color="#3E3C70"/><stop offset="1" stop-color="#22214A"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#9A98D0"/><stop offset="1" stop-color="#9A98D0" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"><g fill="#fff" opacity=".4"><circle cx="40" cy="50" r="6"/><circle cx="116" cy="26" r="6"/><circle cx="214" cy="60" r="6"/><circle cx="30" cy="170" r="6"/><circle cx="226" cy="176" r="6"/></g><path d="M40 50L116 26L214 60L226 176L30 170Z" fill="none" stroke="#00E5FF" stroke-width="3.5" opacity=".6" stroke-dasharray="10 8"/></g><g id="pose" transform="rotate(1.2 128 230)">
<g id="charg" transform="translate(14 30) scale(.82)"><path d="M52 118L18 94L12 124M50 146L10 150M54 176L22 208L30 232M204 118L238 94L244 124M206 146L246 150M202 176L234 208L226 232" fill="none" stroke="#3E3C70" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<path d="M64 164Q128 142 192 164L200 222Q128 244 56 222Z" fill="#6A3FC8"/><path d="M64 164Q128 142 192 164" fill="none" stroke="#43268A" stroke-width="5" opacity=".5"/><path d="M128 156V234" stroke="#43268A" stroke-width="3.5" opacity=".6"/><path d="M96 206Q128 218 160 206L164 226Q128 238 92 226Z" fill="#43268A" opacity=".35"/><ellipse cx="60" cy="178" rx="19" ry="27" fill="#6A3FC8" transform="rotate(18 60 178)"/><ellipse cx="196" cy="178" rx="19" ry="27" fill="#6A3FC8" transform="rotate(-18 196 178)"/><ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><ellipse cx="128" cy="108" rx="84" ry="74" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#22214A" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><ellipse cx="100" cy="108" rx="13" ry="16" fill="url(#e)"/><ellipse cx="100" cy="115.15" rx="8.06" ry="5.46" fill="#8A6A8E" opacity=".55"/><ellipse cx="104.42" cy="101.5" rx="5.98" ry="6.76" fill="#fff"/><circle cx="95.06" cy="113.46" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="156" cy="108" rx="13" ry="16" fill="url(#e)"/><ellipse cx="156" cy="115.15" rx="8.06" ry="5.46" fill="#8A6A8E" opacity=".55"/><ellipse cx="160.42" cy="101.5" rx="5.98" ry="6.76" fill="#fff"/><circle cx="151.06" cy="113.46" r="2.6" fill="#fff" opacity=".9"/><ellipse cx="78" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="130" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M104 130Q128 160 152 130Z" fill="#7A2A3A"/><path d="M114 146Q128 136 142 146Q128 156 114 146Z" fill="#FF7F9A"/></g><g id="mark" fill="#fff"><circle cx="112" cy="60" r="4"/><circle cx="128" cy="54" r="4"/><circle cx="144" cy="60" r="4"/></g></g>
</g>
<g id="propg" transform="translate(250 0) scale(1.3) translate(-250 0)"><g id="sign"><path d="M196 0V44L228 80L194 124L230 172" fill="none" stroke="#00E5FF" stroke-width="3.5"/><g fill="#FF4FA3"><circle cx="228" cy="80" r="8"/><circle cx="194" cy="124" r="8"/><circle cx="230" cy="172" r="8"/></g></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
