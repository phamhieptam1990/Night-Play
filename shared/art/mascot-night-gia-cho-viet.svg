<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đoán Giá Chợ Việt" class="np-mascot sk-default" data-style="night" data-game="gia-cho-viet">
<title>Heo Đất Chốt Đơn — Đoán Giá Chợ Việt</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt lim dim nửa mở, một chân mày nhướn, nhếch mép một bên, khe bỏ tiền trên đỉnh đầu. Đạo cụ nhận diện game (luôn có): bảng giá 25K cầm tay. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="gia-cho-viet"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#FF9EC4;--p2:#FF6FA6;--pa:#00C2A8;--pb:#FFD93D;--face:#FFD1E3;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="140" rx="92" ry="84"/></g>
<g id="body"><path d="M62 76L52 36L94 60ZM194 76L204 36L162 60Z" fill="var(--c2)"/><ellipse cx="128" cy="144" rx="88" ry="80" fill="var(--c1)"/><ellipse cx="128" cy="168" rx="38" ry="28" fill="#FF7FB0" stroke-width="4"/><ellipse cx="116" cy="168" rx="5" ry="8" fill="var(--ink)" stroke="none"/><ellipse cx="140" cy="168" rx="5" ry="8" fill="var(--ink)" stroke="none"/><path d="M216 168Q250 160 238 190Q226 206 244 214" fill="none" stroke-width="9" stroke-linecap="round"/><path d="M216 168Q250 160 238 190Q226 206 244 214" fill="none" stroke="var(--c1)" stroke-width="4" stroke-linecap="round"/><path d="M96 224v12M160 224v12" fill="none" stroke-width="8"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="102" cy="114" rx="9" ry="10" fill="var(--ink)" stroke="none"/><ellipse cx="154" cy="114" rx="9" ry="10" fill="var(--ink)" stroke="none"/><circle cx="105" cy="111" r="3" fill="#fff" stroke="none"/><circle cx="157" cy="111" r="3" fill="#fff" stroke="none"/><rect x="91" y="102" width="22" height="10" fill="var(--c1)" stroke="none"/><rect x="143" y="102" width="22" height="10" fill="var(--c1)" stroke="none"/></g><path d="M92 99H111M143 99L165 92" fill="none" stroke-width="4.5"/><path id="mouth" class="m-talk" d="M115 144Q132 154 146 136M146 136l5 -3" fill="none" stroke-width="4"/><rect id="mark" x="112" y="66" width="32" height="9" rx="4.5" fill="var(--ink)" stroke="none"/></g>
<g id="sign" transform="rotate(-8 34 190)"><path d="M10 170H62L72 190L62 210H10Z" fill="var(--c4)" stroke-width="5"/><circle cx="20" cy="190" r="4" fill="var(--ink)" stroke="none"/><text x="46" y="198" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="17" fill="var(--ink)" stroke="none">25K</text></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
