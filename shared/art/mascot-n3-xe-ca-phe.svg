<g id="face"><g id="eyes"><ellipse cx="100" cy="108" rx="12" ry="14" fill="#2A1A33"/><ellipse cx="156" cy="108" rx="12" ry="14" fill="#2A1A33"/><circle cx="104" cy="103" r="4.5" fill="#fff"/><circle cx="160" cy="103" r="4.5" fill="#fff"/><circle cx="96" cy="114" r="2.2" fill="#fff" opacity=".8"/><circle cx="152" cy="114" r="2.2" fill="#fff" opacity=".8"/><path d="M84 90Q98 98 116 94M140 94Q158 98 172 90" fill="none" stroke="#7A6048" stroke-width="5" stroke-linecap="round"/><ellipse cx="78" cy="132" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="132" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M116 136Q128 146 140 136" fill="none" stroke="#7A2A3A" stroke-width="4.5" stroke-linecap="round"/></g><ellipse cx="128" cy="130" rx="9" ry="6.5" fill="#3A2A2A"/><ellipse cx="125" cy="128" rx="3" ry="2" fill="#fff" opacity=".6"/><path id="mark" d="M84 112Q66 130 72 152M172 112Q190 130 184 152" fill="none" stroke="#4A2C1A" stroke-width="9" stroke-linecap="round" opacity=".8"/></g>
