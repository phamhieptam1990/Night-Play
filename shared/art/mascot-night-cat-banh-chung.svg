<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cắt Bánh Chưng" class="np-mascot sk-default" data-style="night" data-game="cat-banh-chung">
<title>Chưng Chưng Chảnh — Cắt Bánh Chưng</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (kính râm đen chảnh chọe) + một chân mày nhướn, hạt đậu vàng trên trán. Đạo cụ nhận diện game (luôn có): con dao cắt bánh cầm tay. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="cat-banh-chung"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#2EBD6B;--p2:#17803F;--pa:#FFB300;--pb:#F2C94C;--face:#E9F7C8;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--face)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><path d="M56 220V96Q56 62 90 62H166Q200 62 200 96V220Z"/></g>
<g id="body"><path d="M96 70L86 30L124 60ZM160 70L172 28L132 60Z" fill="var(--c2)"/><rect x="48" y="58" width="160" height="164" rx="26" fill="var(--c1)"/><path d="M74 62V218M182 62V218" fill="none" stroke="var(--c4)" stroke-width="12"/><path d="M52 190H204" fill="none" stroke="var(--c4)" stroke-width="12"/><path d="M74 62V218M182 62V218M52 190H204" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".35"/><rect x="92" y="78" width="72" height="72" rx="20" fill="var(--face)" stroke-width="4"/><path d="M90 220v14M166 220v14" fill="none" stroke-width="12"/></g>
<g id="face"><g id="eyes" class="npa-blink"><rect x="90" y="100" width="34" height="24" rx="8" fill="var(--ink)" stroke-width="4"/><rect x="132" y="100" width="34" height="24" rx="8" fill="var(--ink)" stroke-width="4"/><path d="M124 108H132" fill="none" stroke-width="5"/><path d="M98 106l8 -3M140 106l8 -3" stroke="#fff" stroke-width="3" fill="none"/></g><g id="mouthg"><path id="mouth" class="m-talk" d="M114 142Q130 154 146 134" fill="none" stroke-width="4.5"/><path d="M146 134l5 -3" fill="none" stroke-width="4"/></g><ellipse id="mark" cx="128" cy="88" rx="6" ry="4.5" fill="#F7C531" stroke-width="2.5"/></g>
<path d="M102 140Q128 176 154 140" fill="none" stroke="var(--c4)" stroke-width="6"/><circle cx="128" cy="166" r="9" fill="var(--c4)" stroke-width="4"/><g id="sign" transform="rotate(26 218 160)"><rect x="210" y="170" width="16" height="44" rx="6" fill="var(--c3x)" stroke-width="4"/><path d="M208 168L206 110Q222 104 232 114L228 168Z" fill="#E6EAF2" stroke-width="4"/><path d="M216 120V160" fill="none" stroke="#fff" stroke-width="3"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
