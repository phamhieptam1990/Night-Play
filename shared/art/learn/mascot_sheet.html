<div class="w" id="w"></div>
<script>
const S=[["math","Mochi · Toán"],["vietnamese","Mầm · Tiếng Việt"],["english","Bibi · Tiếng Anh"]];
let h='<h1>3 môn × 5 lớp (cột = môn, hàng = lớp) — hàng cuối: 48px / 96px</h1><div class="g"><div></div>'+S.map(s=>`<div class="h">${s[1]}</div>`).join("");

</script>
