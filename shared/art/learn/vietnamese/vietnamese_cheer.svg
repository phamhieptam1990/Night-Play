<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Mầm — Tiếng Việt (bản gốc)" class="np-mascot sk-default em-cheer" data-style="pop" data-game="learn-vietnamese" data-subject="vietnamese" data-mascot="mam" data-grade="0">
<title>Mầm — Tiếng Việt</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): hai vòng mắt kem lớn viền xanh ngọc, mắt tròn to hai chấm sáng, mỏ vàng nhỏ, má hồng, một chỏm lông cong trên đỉnh đầu. Đạo cụ nhận diện (luôn có): cuốn sách mở trên ngực (bìa xanh ngọc, hai trang trắng) + cánh như hai trang sách.</desc>
<style>
.np-mascot{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--c1:#E8694D;--c2:#C0472F;--st:#8E2F1F;--belly:#FFE9C7;--c3:#2BB5A6;--c3d:#17877C;--beak:#F5B93A;--beakd:#C98A12;--page:#FFFFFF;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff}
.acc,.fx{display:none}
/* cảm xúc */.em{display:none}.em-happy .e-happy,.em-cheer .e-happy,.em-cheer .e-cheer,.em-sad .e-sad,.em-sleepy .e-sleepy,.em-think .e-think,.em-wow .e-wow{display:inline}.em-happy #eyes,.em-cheer #eyes,.em-sleepy #eyes,.em-think #eyes,.em-wow #eyes{display:none}.em-happy #blush,.em-cheer #blush{opacity:1}.em-cheer .m-idle,.em-sad .m-idle,.em-wow .m-idle{display:none}.nosign #sign,.nosign #tail,.nosign #wings,.nosign #tailfeathers{display:none}.em-cheer #all{animation:npa-hop .55s ease-out 2}.em-sad #all{animation:none}.em-sleepy #all{animation:npa-breathe 3.2s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 1.4s ease-in-out infinite}@keyframes npa-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.04)}}@keyframes npa-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@keyframes npa-twinkle{0%,100%{opacity:.3}50%{opacity:1}}
/* skin lớp */.sk-g1 .acc-one,.sk-g1 .acc-badgeone,.sk-g2 .acc-two,.sk-g2 .acc-badgetwo,.sk-g3 .acc-three,.sk-g3 .acc-badgethree,.sk-g4 .acc-four,.sk-g4 .acc-badgefour,.sk-g5 .acc-five,.sk-g5 .acc-badgefive{display:inline}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}
.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa,#all,.npa-twinkle{animation:none!important}}
</style>
<defs><linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="wings"><g transform="rotate(14 60 170)"><rect x="34" y="124" width="52" height="84" rx="22" fill="var(--c2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M48 148H72M48 164H72M48 180H70" stroke="var(--belly)" stroke-width="3" stroke-linecap="round" opacity=".7"/></g><g transform="rotate(-14 196 170)"><rect x="170" y="124" width="52" height="84" rx="22" fill="var(--c2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M184 148H208M184 164H208M186 180H208" stroke="var(--belly)" stroke-width="3" stroke-linecap="round" opacity=".7"/></g></g>
<g id="body"><ellipse cx="128" cy="172" rx="64" ry="58" fill="url(#vg)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="128" cy="186" rx="42" ry="36" fill="var(--belly)"/>
<ellipse cx="108" cy="234" rx="14" ry="7" fill="var(--beak)" stroke="var(--beakd)" stroke-width="3"/><ellipse cx="148" cy="234" rx="14" ry="7" fill="var(--beak)" stroke="var(--beakd)" stroke-width="3"/>
<path d="M58 82L52 38Q56 30 65 36L100 62Z" fill="var(--c1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M198 82L204 38Q200 30 191 36L156 62Z" fill="var(--c1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="128" cy="110" rx="84" ry="68" fill="url(#vg)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="94" cy="68" rx="26" ry="11" transform="rotate(-24 94 68)" fill="var(--hl)" opacity=".55"/></g>
<g id="face"><circle cx="100" cy="112" r="28" fill="var(--belly)" stroke="var(--c3)" stroke-width="4"/><circle cx="156" cy="112" r="28" fill="var(--belly)" stroke="var(--c3)" stroke-width="4"/><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="104" cy="107" r="5" fill="var(--hl)"/><circle cx="96" cy="117" r="2.5" fill="var(--hl)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="160" cy="107" r="5" fill="var(--hl)"/><circle cx="152" cy="117" r="2.5" fill="var(--hl)"/></g><g id="blush"><ellipse cx="70" cy="142" rx="12" ry="8" fill="var(--bl)" opacity=".85"/><ellipse cx="186" cy="142" rx="12" ry="8" fill="var(--bl)" opacity=".85"/></g>
<path d="M112 130Q128 120 144 130Q138 150 128 156Q118 150 112 130Z" fill="var(--beak)" stroke="var(--beakd)" stroke-width="3" stroke-linejoin="round"/>
