troke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 50h14l-14 14h14M214 28h10l-10 10h10" fill="none" stroke="#9AA3FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="acc-one" class="acc acc-one"><path d="M80 182Q128 200 176 182" fill="none" stroke="var(--st)" stroke-linecap="round" stroke-linejoin="round" stroke-width="17"/><path d="M80 182Q128 200 176 182" fill="none" stroke="#FFC94A" stroke-linecap="round" stroke-width="11"/><path d="M150 194L156 216" fill="none" stroke="var(--st)" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M150 194L156 216" fill="none" stroke="#FFC94A" stroke-linecap="round" stroke-width="10"/></g>
