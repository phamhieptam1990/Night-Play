<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bibi — Tiếng Anh lớp 3" class="np-mascot sk-default sk-g3" data-style="pop" data-game="learn-english" data-subject="english" data-mascot="bibi" data-grade="3">
<title>Bibi — Tiếng Anh lớp 3</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): hai mảng mặt trắng quanh mắt, mắt tròn to hai chấm sáng, mỏ cong màu san hô, má hồng, mào ba lông vàng – san hô – xanh dương. Đạo cụ nhận diện (luôn có): bong bóng hội thoại trắng có chữ Hi! cạnh đầu + đuôi hai lông dài xanh dương và san hô.</desc>
<style>
.np-mascot{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--c1:#34D4BE;--c2:#12998A;--st:#0A6A60;--belly:#D8FAF1;--c3:#FF7A6B;--c3d:#D4503F;--wing:#4A8BF5;--wingd:#2358C8;--yel:#FFD24D;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff}
.acc,.fx{display:none}
/* cảm xúc */.em{display:none}.em-happy .e-happy,.em-cheer .e-happy,.em-cheer .e-cheer,.em-sad .e-sad,.em-sleepy .e-sleepy,.em-think .e-think,.em-wow .e-wow{display:inline}.em-happy #eyes,.em-cheer #eyes,.em-sleepy #eyes,.em-think #eyes,.em-wow #eyes{display:none}.em-happy #blush,.em-cheer #blush{opacity:1}.em-cheer .m-idle,.em-sad .m-idle,.em-wow .m-idle{display:none}.em-cheer #all{animation:npa-hop .55s ease-out 2}.em-sad #all{animation:none}.em-sleepy #all{animation:npa-breathe 3.2s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 1.4s ease-in-out infinite}@keyframes npa-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.04)}}@keyframes npa-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@keyframes npa-twinkle{0%,100%{opacity:.3}50%{opacity:1}}
/* skin lớp */.sk-g1 .acc-one,.sk-g1 .acc-badgeone,.sk-g2 .acc-two,.sk-g2 .acc-badgetwo,.sk-g3 .acc-three,.sk-g3 .acc-badgethree,.sk-g4 .acc-four,.sk-g4 .acc-badgefour,.sk-g5 .acc-five,.sk-g5 .acc-badgefive{display:inline}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}
.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa,#all,.npa-twinkle{animation:none!important}}
</style>
<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="70" ry="9" fill="var(--ink)" opacity=".18"/></g>
<g id="all" class="npa npa-bob">
<g id="tailfeathers"><ellipse cx="98" cy="212" rx="12" ry="26" transform="rotate(30 98 212)" fill="var(--wing)" stroke="var(--wingd)" stroke-width="3"/><ellipse cx="158" cy="212" rx="12" ry="26" transform="rotate(-30 158 212)" fill="var(--c3)" stroke="var(--c3d)" stroke-width="3"/></g>
