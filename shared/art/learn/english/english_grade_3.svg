<g id="body"><ellipse cx="128" cy="178" rx="62" ry="52" fill="url(#eg)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="128" cy="190" rx="38" ry="30" fill="var(--belly)"/>
<ellipse cx="108" cy="234" rx="14" ry="7" fill="var(--c3)" stroke="var(--c3d)" stroke-width="3"/><ellipse cx="148" cy="234" rx="14" ry="7" fill="var(--c3)" stroke="var(--c3d)" stroke-width="3"/>
<g id="mark"><ellipse cx="112" cy="46" rx="9" ry="22" transform="rotate(-22 112 46)" fill="var(--yel)" stroke="var(--c3d)" stroke-width="3"/><ellipse cx="144" cy="46" rx="9" ry="22" transform="rotate(22 144 46)" fill="var(--wing)" stroke="var(--wingd)" stroke-width="3"/><ellipse cx="128" cy="38" rx="10" ry="26" fill="var(--c3)" stroke="var(--c3d)" stroke-width="3"/></g>
<ellipse cx="128" cy="114" rx="80" ry="70" fill="url(#eg)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
