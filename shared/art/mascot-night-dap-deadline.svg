<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đập Deadline" class="np-mascot sk-default" data-style="night" data-game="dap-deadline">
<title>Chuột Chũi Thức Khuya — Đập Deadline</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (hoảng hốt nghiến răng, mồ hôi) + một chân mày nhướn, quầng thâm dưới mắt. Đạo cụ nhận diện game (luôn có): cây búa gỗ to + cốc cà phê. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="dap-deadline"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#8A5A3C;--p2:#5E3A22;--pa:#FF4D4D;--pb:#FFE45C;--face:#F2D2B0;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-2 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="150" rx="86" ry="82"/></g>
<g id="body"><ellipse cx="128" cy="150" rx="82" ry="78" fill="var(--c1)"/><ellipse cx="128" cy="172" rx="50" ry="40" fill="var(--c2)"/><path d="M48 176Q24 190 34 214L60 206ZM208 176Q232 190 222 214L196 206Z" fill="var(--c1)"/><path d="M32 208l-6 12M44 212l-2 14M56 210l4 12" fill="none" stroke-width="4"/><ellipse cx="128" cy="152" rx="24" ry="18" fill="#F7A8B8" stroke-width="4"/><path d="M128 140v-12M116 144l-8 -8M140 144l8 -8" fill="none" stroke="#F7A8B8" stroke-width="7"/><path d="M128 140v-12M116 144l-8 -8M140 144l8 -8" fill="none" stroke-width="2" opacity=".6"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="102" cy="110" r="13" fill="#fff" stroke-width="4"/><circle cx="100" cy="112" r="6" fill="var(--ink)" stroke="none"/><circle cx="102" cy="110" r="2" fill="#fff" stroke="none"/><circle cx="154" cy="110" r="13" fill="#fff" stroke-width="4"/><circle cx="156" cy="112" r="6" fill="var(--ink)" stroke="none"/><circle cx="158" cy="110" r="2" fill="#fff" stroke="none"/><path d="M92 92L110 84" fill="none" stroke-width="5"/><path d="M146 84L164 92" fill="none" stroke-width="5"/><path d="M176 92q-8 11 0 17q8 -6 0 -17z" fill="#8FD8FF" stroke-width="3"/></g><g id="mouthg"><path id="mouth" class="m-talk" d="M110 142l6 -7l6 7l6 -7l6 7l6 -7l6 7" fill="#fff" stroke-width="4.5"/></g><g id="mark" fill="none" stroke="#2B1A33" stroke-width="3.5" opacity=".7"><path d="M84 128Q100 136 114 128M142 128Q156 136 172 128"/></g></g>
<path d="M50 108Q128 80 206 108" fill="none" stroke="var(--c3x)" stroke-width="14"/><path d="M50 108Q128 80 206 108" fill="none" stroke-width="3" opacity=".5"/><path d="M200 106l22 -8l-6 20z" fill="var(--c3x)" stroke-width="3.5"/><g id="sign" transform="rotate(-22 206 160)"><rect x="200" y="118" width="12" height="100" rx="5" fill="#C8924A" stroke-width="4"/><rect x="176" y="96" width="62" height="34" rx="9" fill="var(--c3x)" stroke-width="5"/><path d="M186 106V120M228 106V120" stroke="#fff" stroke-width="3.5" fill="none" opacity=".7"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
