<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đoán Xem Bé Mấy Tuổi" class="np-mascot sk-default" data-style="pop" data-game="doan-tuoi-nao">
<title>Cú Thông Thái — Đoán Xem Bé Mấy Tuổi</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, chấm trái tim nhỏ trên trán. Đạo cụ nhận diện game (luôn có): bánh sinh nhật có số tuổi. BẢN MẪU chờ duyệt (chỉ skin Mặc định).</desc>
<style>
.np-mascot[data-game="doan-tuoi-nao"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#C8A5FF;--p2:#9A6CF0;--pst:#6A3FC0;--k1:#FFD43B;--k2:#FF9D3D;--bell:#F7ECFF;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="body"><path d="M56 70L50 26L96 54ZM200 70L206 26L160 54Z" fill="var(--p2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="128" cy="130" rx="88" ry="90" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="90" rx="26" ry="12" transform="rotate(-24 98 90)" fill="var(--hl)" opacity=".5"/><ellipse cx="100" cy="116" rx="34" ry="32" fill="var(--bell)" opacity=".9"/><ellipse cx="156" cy="116" rx="34" ry="32" fill="var(--bell)" opacity=".9"/><ellipse cx="128" cy="190" rx="44" ry="34" fill="var(--bell)"/><path d="M104 176q8 6 16 0M128 182q8 6 16 0" fill="none" stroke="var(--p2)" stroke-width="3" stroke-linecap="round"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" d="M128 70c-6-9-17 0-9 8l9 8 9-8c8-8-3-17-9-8z" fill="#FF6B8A" stroke="#D43E62" stroke-width="2"/><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><path id="beak" d="M118 136L128 156L138 136Z" fill="var(--k2)" stroke="#D8760A" stroke-width="3" stroke-linejoin="round"/></g>
<g id="sign"><ellipse cx="204" cy="212" rx="34" ry="9" fill="#00000022"/><rect x="176" y="168" width="56" height="42" rx="10" fill="#FFE0EC" stroke="#E07BA0" stroke-width="3"/><path d="M176 184q7 8 14 0t14 0 14 0 14 0" fill="none" stroke="#fff" stroke-width="5"/><rect x="200" y="150" width="8" height="18" rx="3" fill="#FFD43B" stroke="#D8A80A" stroke-width="2"/><path d="M204 134q-7 8 0 14q7-6 0-14z" fill="#FF9D3D"/><text x="204" y="204" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="22" fill="#B83A6A">5</text></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g>
<g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</svg>
