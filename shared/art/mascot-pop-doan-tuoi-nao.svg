<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Đoán Xem Bé Mấy Tuổi" class="np-mascot sk-default" data-style="pop" data-game="doan-tuoi-nao">
<title>Cú Thông Thái — Đoán Xem Bé Mấy Tuổi</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, chấm trái tim nhỏ trên trán. Đạo cụ nhận diện game (luôn có): bánh sinh nhật có số tuổi. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="doan-tuoi-nao"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#C8A5FF;--p2:#9A6CF0;--pst:#6A3FC0;--k1:var(--pa,#FFD43B);--k2:var(--pb,#FF9D3D);--bell:#F7ECFF;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="doan-tuoi-nao"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="doan-tuoi-nao"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><path d="M56 70L50 26L96 54ZM200 70L206 26L160 54Z" fill="var(--c2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="128" cy="130" rx="88" ry="90" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="90" rx="26" ry="12" transform="rotate(-24 98 90)" fill="var(--hl)" opacity=".5"/><ellipse cx="100" cy="116" rx="34" ry="32" fill="var(--bell)" opacity=".9"/><ellipse cx="156" cy="116" rx="34" ry="32" fill="var(--bell)" opacity=".9"/><ellipse cx="128" cy="190" rx="44" ry="34" fill="var(--bell)"/><path d="M104 176q8 6 16 0M128 182q8 6 16 0" fill="none" stroke="var(--c2)" stroke-width="3" stroke-linecap="round"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" d="M128 70c-6-9-17 0-9 8l9 8 9-8c8-8-3-17-9-8z" fill="#FF6B8A" stroke="#D43E62" stroke-width="2"/><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><path id="beak" d="M118 136L128 156L138 136Z" fill="var(--k2)" stroke="#D8760A" stroke-width="3" stroke-linejoin="round"/></g>
<g id="sign"><ellipse cx="204" cy="212" rx="34" ry="9" fill="#00000022"/><rect x="176" y="168" width="56" height="42" rx="10" fill="#FFE0EC" stroke="#E07BA0" stroke-width="3"/><path d="M176 184q7 8 14 0t14 0 14 0 14 0" fill="none" stroke="#fff" stroke-width="5"/><rect x="200" y="150" width="8" height="18" rx="3" fill="#FFD43B" stroke="#D8A80A" stroke-width="2"/><path d="M204 134q-7 8 0 14q7-6 0-14z" fill="#FF9D3D"/><text x="204" y="204" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="22" fill="#B83A6A">5</text></g>
<g id="acc-badge" class="acc acc-badge"><path d="M54 74L128 46L202 74L128 100Z" fill="#2A2A48" stroke="#14142A" stroke-width="3" stroke-linejoin="round"/><path d="M96 90V108Q128 122 160 108V90" fill="#3A3A5C" stroke="#14142A" stroke-width="3"/><path d="M202 74V106" stroke="#FFD43B" stroke-width="3.5"/><circle cx="202" cy="112" r="6" fill="#FFD43B"/><g transform="rotate(-18 40 190)"><rect x="18" y="168" width="52" height="30" rx="6" fill="#FFF3D4" stroke="#C8A878" stroke-width="3"/><path d="M26 178h36M26 186h24" stroke="#C8A878" stroke-width="2.5"/><circle cx="58" cy="190" r="7" fill="#E8454F"/></g></g><g id="acc-group" class="acc acc-group"><path d="M62 84Q72 30 128 32Q184 30 194 84Q160 62 128 64Q96 62 62 84Z" fill="#8A5A3A" stroke="#5A3A20" stroke-width="3" stroke-linejoin="round"/><path d="M62 84H194" stroke="#5A3A20" stroke-width="7" stroke-linecap="round"/><circle cx="128" cy="30" r="7" fill="#8A5A3A" stroke="#5A3A20" stroke-width="3"/><g transform="translate(40 178)"><circle cx="0" cy="0" r="20" fill="#BFE6FF" fill-opacity=".6" stroke="#8A5A3A" stroke-width="6"/><path d="M14 14L34 34" stroke="#8A5A3A" stroke-width="8" stroke-linecap="round"/></g></g><g id="acc-night" class="acc acc-night"><g transform="translate(36 176)"><rect x="-8" y="0" width="16" height="42" rx="4" fill="#FFF3D4" stroke="#C8A878" stroke-width="3"/><path d="M0 -4q-9 10 0 20q9-10 0-20z" fill="#FFB020"/><circle cx="0" cy="8" r="22" fill="#FFE08A" opacity=".28"/></g><path d="M52 60l3 7 7 3-7 3-3 7-3-7-7-3 7-3zM204 52l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FFE08A"/><g><circle cx="40" cy="176" r="30" fill="var(--bgx)" opacity=".25"/><path d="M52 152A22 22 0 1 0 52 198A17 17 0 1 1 52 152Z" fill="#FFE08A" stroke="#E0A02E" stroke-width="2.5" stroke-linejoin="round"/></g></g><g id="acc-star" class="acc acc-star"><path d="M70 86Q90 20 128 -6Q166 20 186 86Z" fill="#7048E8" stroke="#4A2EA8" stroke-width="3" stroke-linejoin="round" transform="translate(0 6)"/><path d="M66 90Q128 66 190 90" fill="none" stroke="#FFD43B" stroke-width="8" stroke-linecap="round"/><path d="M118 40l2.4 5 5.4.7-4 3.8 1 5.3-4.8-2.6-4.8 2.6 1-5.3-4-3.8 5.4-.7z" fill="#FFE08A"/><rect x="204" y="150" width="6" height="60" rx="3" transform="rotate(10 207 180)" fill="#FFD43B" stroke="#E8A317" stroke-width="2.5"/><path d="M224 120l4.4 9 10 1.4-7.2 7 1.7 9.9-8.9-4.7-8.9 4.7 1.7-9.9-7.2-7 10-1.4z" fill="#FFD43B" stroke="#E8A317" stroke-width="2.5" stroke-linejoin="round"/></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
