<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Chở Hàng Kiểu Việt" class="np-mascot sk-default" data-style="night" data-game="cho-hang-kieu-viet">
<title>Trâu Nón Lá — Chở Hàng Kiểu Việt</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt lim dim nửa mở, một chân mày nhướn, nhếch mép một bên, nốt ruồi bên má phải. Đạo cụ nhận diện game (luôn có): chồng thùng hàng cột dây. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="cho-hang-kieu-viet"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#9AA3B2;--p2:#6C7686;--pa:#FF9F1C;--pb:#FFE08A;--face:#E4E8EE;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="150" rx="78" ry="76"/><path d="M56 46L128 0L200 46Z"/></g>
<g id="body"><path d="M60 112Q22 100 24 66Q50 70 70 96ZM196 112Q234 100 232 66Q206 70 186 96Z" fill="var(--c2)"/><ellipse cx="128" cy="150" rx="74" ry="72" fill="var(--c1)"/><ellipse cx="128" cy="184" rx="42" ry="30" fill="var(--c4)"/><circle cx="116" cy="188" r="4.5" fill="var(--ink)" stroke="none"/><circle cx="140" cy="188" r="4.5" fill="var(--ink)" stroke="none"/><path d="M64 96Q40 82 44 52Q52 66 78 76Z" fill="#FFF3D0"/><path d="M192 96Q216 82 212 52Q204 66 178 76Z" fill="#FFF3D0"/><path d="M54 70L128 6L202 70Q128 86 54 70Z" fill="#F4E3A8"/><path d="M80 66L128 18L176 66M104 72L128 26L152 72" fill="none" stroke-width="3" opacity=".55"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="102" cy="126" rx="9" ry="10" fill="var(--ink)" stroke="none"/><ellipse cx="154" cy="126" rx="9" ry="10" fill="var(--ink)" stroke="none"/><circle cx="105" cy="123" r="3" fill="#fff" stroke="none"/><circle cx="157" cy="123" r="3" fill="#fff" stroke="none"/><rect x="91" y="114" width="22" height="10" fill="var(--c1)" stroke="none"/><rect x="143" y="114" width="22" height="10" fill="var(--c1)" stroke="none"/></g><path d="M92 111H111M143 111L165 104" fill="none" stroke-width="4.5"/><path id="mouth" class="m-talk" d="M115 156Q132 166 146 148M146 148l5 -3" fill="none" stroke-width="4"/><circle id="mark" cx="174" cy="148" r="4" fill="var(--ink)" stroke="none"/></g>
<g id="sign"><rect x="190" y="176" width="56" height="50" rx="6" fill="#E3B27A" stroke-width="4"/><rect x="196" y="136" width="44" height="40" rx="6" fill="#F0C48C" stroke-width="4"/><rect x="204" y="100" width="30" height="36" rx="6" fill="#E3B27A" stroke-width="4"/><path d="M190 200H246M218 176V226" stroke-width="3.5" fill="none"/><path d="M196 156H240" stroke="var(--c3x)" stroke-width="5" fill="none"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
