<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Né Ổ Gà Mùa Mưa" class="np-mascot sk-default" data-style="night" data-game="ne-o-ga">
<title>Vịt Áo Mưa — Né Ổ Gà Mùa Mưa</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (ỉu xìu cau có vì ướt) + một chân mày nhướn, giọt nước nhỏ trên đầu. Đạo cụ nhận diện game (luôn có): ô đỏ + ủng + áo mưa xanh. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="ne-o-ga"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#FFD93D;--p2:#F2A81D;--pa:#2F9BFF;--pb:#FF5A5A;--face:#FFF3B0;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-3 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="150" rx="84" ry="80"/></g>
<g id="body"><path d="M52 158Q22 150 26 122Q56 126 66 150ZM204 158Q234 150 230 122Q200 126 190 150Z" fill="var(--c2)"/><ellipse cx="128" cy="148" rx="80" ry="76" fill="var(--c1)"/><path d="M52 150Q56 224 128 226Q200 224 204 150Q128 170 52 150Z" fill="var(--c3)"/><path d="M128 160V222" fill="none" stroke-width="4"/><circle cx="128" cy="176" r="4" fill="#fff" stroke="none"/><circle cx="128" cy="196" r="4" fill="#fff" stroke="none"/><path d="M74 84Q74 40 128 40Q182 40 182 84Q128 96 74 84Z" fill="var(--c3)"/><path d="M96 140Q128 130 160 140Q164 164 128 168Q92 164 96 140Z" fill="#FF9F1C" stroke-width="4.5"/><rect x="84" y="226" width="34" height="14" rx="6" fill="#2D2D44" stroke-width="4"/><rect x="138" y="226" width="34" height="14" rx="6" fill="#2D2D44" stroke-width="4"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="104" cy="108" rx="9.5" ry="10.5" fill="var(--ink)" stroke="none"/><ellipse cx="152" cy="108" rx="9.5" ry="10.5" fill="var(--ink)" stroke="none"/><rect x="91" y="94" width="26" height="6" fill="var(--c1)" stroke="none"/><rect x="139" y="94" width="26" height="6" fill="var(--c1)" stroke="none"/><path d="M92 100H116M140 100H164" stroke-width="4.5" fill="none"/><path d="M92 86L114 96" fill="none" stroke-width="5"/><path d="M142 96L164 86" fill="none" stroke-width="5"/></g><g id="mouthg"></g><path id="mark" d="M128 56q-9 12 0 18q9-6 0-18z" fill="#6EC6FF" stroke-width="2.5"/></g>
<g id="sign" transform="rotate(18 212 170)"><path d="M212 176V222" stroke-width="5" fill="none"/><path d="M168 140Q172 96 212 94Q252 96 256 140Q234 128 212 140Q190 128 168 140Z" fill="var(--c4)" stroke-width="5"/><path d="M212 94V140" fill="none" stroke-width="3" opacity=".6"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
