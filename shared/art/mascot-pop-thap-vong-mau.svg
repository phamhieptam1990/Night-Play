d="M226 22A22 22 0 1 0 226 68A17 17 0 1 1 226 22Z" fill="#FFE08A" stroke="#E0A02E" stroke-width="2.5" stroke-linejoin="round"/></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -14)"><path d="M94 70L102 38L117 55L128 30L139 55L154 38L162 70Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="56" r="4" fill="#FF6B6B"/><circle cx="108" cy="60" r="3" fill="#4DABF7"/><circle cx="148" cy="60" r="3" fill="#51CF66"/></g><g transform="translate(216 232)"><ellipse rx="26" ry="9" fill="#FFD43B" stroke="#C89A0A" stroke-width="2.5"/><ellipse cy="-18" rx="22" ry="8" fill="#FFE066" stroke="#C89A0A" stroke-width="2.5"/><ellipse cy="-34" rx="18" ry="7" fill="#FFD43B" stroke="#C89A0A" stroke-width="2.5"/><ellipse cy="-48" rx="14" ry="6" fill="#FFE066" stroke="#C89A0A" stroke-width="2.5"/></g><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
