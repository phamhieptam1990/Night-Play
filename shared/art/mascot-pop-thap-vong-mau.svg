<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Tháp Vòng Màu" class="np-mascot sk-default" data-style="pop" data-game="thap-vong-mau">
<title>Gấu trúc mèo Thợ xếp tháp — Tháp Vòng Màu</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, vệt bụi gỗ nhỏ trên mũi. Đạo cụ nhận diện game (luôn có): tháp vòng nhiều màu. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="thap-vong-mau"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#C9D0DC;--p2:#9AA4B8;--pst:#5A6478;--k1:var(--pa,#FFC83D);--k2:var(--pb,#3A3F52);--bell:#F4F6FA;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="thap-vong-mau"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="thap-vong-mau"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><path d="M214 190Q256 176 244 128Q250 168 210 176Z" fill="var(--c2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M226 168l14 2M232 150l10 6" stroke="#3A3F52" stroke-width="6" stroke-linecap="round"/><circle cx="62" cy="62" r="24" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><circle cx="62" cy="62" r="12" fill="#3A3F52"/><circle cx="194" cy="62" r="24" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><circle cx="194" cy="62" r="12" fill="#3A3F52"/><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><ellipse cx="128" cy="184" rx="50" ry="36" fill="var(--bell)"/><path d="M44 112Q60 92 100 96L128 112L156 96Q196 92 212 112Q206 142 160 138Q136 134 128 124Q120 134 96 138Q50 142 44 112Z" fill="#3A3F52"/><ellipse cx="128" cy="150" rx="36" ry="24" fill="#F4F6FA"/><path d="M56 80Q58 22 128 20Q198 22 200 80Q172 66 128 66Q84 66 56 80Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><rect x="40" y="74" width="176" height="14" rx="7" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><rect x="114" y="18" width="28" height="22" rx="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><ellipse cx="44" cy="164" rx="16" ry="28" transform="rotate(-22 44 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="212" cy="164" rx="16" ry="28" transform="rotate(22 212 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><g id="mark" fill="#B8783C" opacity=".85"><circle cx="124" cy="134" r="2"/><circle cx="131" cy="131" r="2"/><circle cx="134" cy="137" r="2"/></g><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><ellipse id="nose" cx="128" cy="142" rx="8" ry="5.5" fill="#2A2E40"/></g>
<g id="sign"><rect x="212" y="148" width="8" height="84" rx="4" fill="#B8783C" stroke="#7A4C1E" stroke-width="2.5"/><ellipse cx="216" cy="224" rx="26" ry="9" fill="#FF5A6E" stroke="#B83A4A" stroke-width="2.5"/><ellipse cx="216" cy="206" rx="22" ry="8" fill="#FFC83D" stroke="#C89A0A" stroke-width="2.5"/><ellipse cx="216" cy="190" rx="18" ry="7" fill="#4ADBA0" stroke="#1F9A70" stroke-width="2.5"/><ellipse cx="216" cy="175" rx="14" ry="6" fill="#4A90E8" stroke="#2A60B0" stroke-width="2.5"/><ellipse cx="216" cy="162" rx="10" ry="5" fill="#B07AFF" stroke="#7A4AC0" stroke-width="2.5"/></g>
