<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sống Sót Đến Cuối Tháng" class="np-mascot sk-default" data-style="night" data-game="song-sot-cuoi-thang">
<title>Gián Bất Tử — Sống Sót Đến Cuối Tháng</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt lim dim nửa mở, một chân mày nhướn, nhếch mép một bên, vết sẹo chéo trên má. Đạo cụ nhận diện game (luôn có): ví lép chỉ còn một tờ tiền. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="song-sot-cuoi-thang"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#A0522D;--p2:#6B3A1E;--pa:#FFB300;--pb:#7CFFB2;--face:#F4D9B8;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(-4 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="154" rx="80" ry="78"/></g>
<g id="body"><path d="M100 74Q76 30 56 22M156 74Q180 30 200 22" fill="none" stroke-width="9" stroke-linecap="round"/><path d="M100 74Q76 30 56 22M156 74Q180 30 200 22" fill="none" stroke="var(--c1)" stroke-width="3.5" stroke-linecap="round"/><path d="M50 150Q24 150 20 176M52 182Q32 204 36 228M206 150Q232 150 236 176M204 182Q224 204 220 228" fill="none" stroke-width="9" stroke-linecap="round"/><path d="M50 150Q24 150 20 176M52 182Q32 204 36 228M206 150Q232 150 236 176M204 182Q224 204 220 228" fill="none" stroke="var(--c1)" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="128" cy="154" rx="76" ry="74" fill="var(--c1)"/><path d="M128 190V224" stroke="var(--c2)" stroke-width="5" fill="none"/><path d="M128 190Q88 190 74 214M128 190Q168 190 182 214" fill="none" stroke="var(--c2)" stroke-width="5"/></g>
<g id="face"><g id="eyes" class="npa-blink"><ellipse cx="102" cy="118" rx="9" ry="10" fill="var(--ink)" stroke="none"/><ellipse cx="154" cy="118" rx="9" ry="10" fill="var(--ink)" stroke="none"/><circle cx="105" cy="115" r="3" fill="#fff" stroke="none"/><circle cx="157" cy="115" r="3" fill="#fff" stroke="none"/><rect x="91" y="106" width="22" height="10" fill="var(--c1)" stroke="none"/><rect x="143" y="106" width="22" height="10" fill="var(--c1)" stroke="none"/></g><path d="M92 103H111M143 103L165 96" fill="none" stroke-width="4.5"/><path id="mouth" class="m-talk" d="M115 158Q132 168 146 150M146 150l5 -3" fill="none" stroke-width="4"/><path id="mark" d="M74 140L90 158M86 140L94 150" fill="none" stroke="#FFD9B8" stroke-width="4"/></g>
<g id="sign" transform="rotate(-10 204 186)"><rect x="178" y="166" width="56" height="42" rx="8" fill="#6B3A1E" stroke-width="5"/><rect x="186" y="156" width="40" height="22" rx="3" fill="#7CFFB2" stroke-width="4"/><text x="206" y="172" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="12" fill="var(--ink)" stroke="none">1K</text><circle cx="224" cy="190" r="4" fill="var(--c4)" stroke-width="2.5"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
