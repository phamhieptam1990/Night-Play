<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Vẽ Chữ Thành Quái Vật" class="np-mascot sk-default" data-style="pop" data-game="ve-chu-quai-vat">
<title>Quái vật Nét Mực — Vẽ Chữ Thành Quái Vật</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, vết mực loang nhỏ trên má phải. Đạo cụ nhận diện game (luôn có): cọ vẽ + chữ A nguệch ngoạc. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="ve-chu-quai-vat"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#B79CFF;--p2:#7A55E8;--pst:#4C2DB0;--k1:var(--pa,#FF8AD0);--k2:var(--pb,#39E0C8);--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="ve-chu-quai-vat"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="ve-chu-quai-vat"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><g opacity=".95"><ellipse cx="128" cy="52" rx="14" ry="48" transform="rotate(-58 128 120)" fill="#FF6B6B"/><ellipse cx="128" cy="52" rx="14" ry="48" transform="rotate(-29 128 120)" fill="#FFA94D"/><ellipse cx="128" cy="52" rx="14" ry="48" fill="#FFD43B"/><ellipse cx="128" cy="52" rx="14" ry="48" transform="rotate(29 128 120)" fill="#51CF66"/><ellipse cx="128" cy="52" rx="14" ry="48" transform="rotate(58 128 120)" fill="#4DABF7"/></g></g>
<g id="body"><path d="M44 140Q36 64 100 46Q128 38 156 46Q220 64 212 140Q216 196 196 214Q184 232 166 220Q152 238 128 224Q104 238 90 220Q72 232 60 214Q40 196 44 140Z" fill="url(#pg)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="98" cy="86" rx="26" ry="12" transform="rotate(-24 98 86)" fill="var(--hl)" opacity=".5"/><path d="M96 48Q86 16 104 12M160 48Q172 18 154 12" fill="none" stroke="var(--st)" stroke-width="4" stroke-linecap="round"/><circle cx="104" cy="12" r="8" fill="var(--k1)" stroke="var(--st)" stroke-width="3"/><circle cx="154" cy="12" r="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><path d="M82 230q-6 12 4 14q8-2 4-14ZM170 232q-4 10 4 12q8-2 2-12Z" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" d="M170 132q6-5 11 0q5 4 0 9q-6 4-11-1q-3-4 0-8z" fill="#2B1B6B"/><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/></g>
<g id="sign"><g transform="rotate(28 204 164)"><rect x="198" y="120" width="12" height="52" rx="6" fill="#FFD43B" stroke="#D8A80A" stroke-width="3"/><path d="M196 172h16l-3 18q-5 6-10 0z" fill="#B8D8FF" stroke="#6AA0D8" stroke-width="3" stroke-linejoin="round"/><path d="M200 190q4 14 8 0" fill="#2B1B6B"/></g><path d="M28 196l16-40l16 40M34 184h20" fill="none" stroke="#FF8AD0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8 44 176)"/></g>
<g id="acc-badge" class="acc acc-badge"><path d="M62 66Q70 30 128 30Q186 30 194 66Q160 52 128 54Q96 52 62 66Z" fill="#E8454F" stroke="#B02A32" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="26" r="7" fill="#E8454F" stroke="#B02A32" stroke-width="3"/><g transform="translate(40 186) rotate(-14)"><path d="M0 -26Q30 -34 40 -6Q50 24 20 28Q-14 30 -20 8Q-24 -14 0 -26Z" fill="#FFE9C8" stroke="#C89A5A" stroke-width="3"/><circle cx="-4" cy="-8" r="6" fill="#E8454F"/><circle cx="14" cy="-12" r="6" fill="#4A90E8"/><circle cx="20" cy="8" r="6" fill="#4ADBA0"/><circle cx="2" cy="12" r="6" fill="#FFC83D"/></g></g><g id="acc-group" class="acc acc-group"><path d="M128 50V16" stroke="#9AA3B8" stroke-width="6" stroke-linecap="round"/><circle cx="128" cy="12" r="9" fill="#FF5A6E" stroke="#B83A4A" stroke-width="3"/><g fill="#C8CEDA" stroke="#7A8398" stroke-width="2.5"><circle cx="58" cy="132" r="9"/><circle cx="198" cy="132" r="9"/></g><path d="M53 132h10M193 132h10M58 127v10M198 127v10" stroke="#7A8398" stroke-width="2"/><g transform="translate(38 196)"><circle r="16" fill="#C8CEDA" stroke="#7A8398" stroke-width="3"/><circle r="6" fill="#7A8398"/></g></g><g id="acc-night" class="acc acc-night"><ellipse cx="128" cy="130" rx="100" ry="104" fill="none" stroke="#7CF0FF" stroke-width="6" opacity=".8"/><ellipse cx="128" cy="130" rx="112" ry="114" fill="none" stroke="#B79CFF" stroke-width="3" opacity=".5"/><path d="M60 218q-4 12 2 18q8-6 2-18zM194 214q-4 12 2 18q8-6 2-18z" fill="#7CF0FF" opacity=".8"/><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g><g id="acc-star" class="acc acc-star"><path d="M128 56L116 18L140 18Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M120 44l16 -6M122 34l14 -5" stroke="#C89A0A" stroke-width="2.5"/><path d="M40 150Q40 230 70 230M216 150Q216 230 186 230" fill="none" stroke="#FF8AD0" stroke-width="8" stroke-linecap="round"/><path d="M46 160Q50 220 76 224M210 160Q206 220 180 224" fill="none" stroke="#7CF0FF" stroke-width="6" stroke-linecap="round" opacity=".8"/><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
