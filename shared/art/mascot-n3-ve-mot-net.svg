<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Vẽ Một Nét" class="np-mascot sk-default" data-style="night" data-game="ve-mot-net">
<title>Bút Chì Liều — Vẽ Một Nét</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, vệt tẩy hồng trên má. Đạo cụ nhận diện game (luôn có): nét vẽ nguệch ngoạc. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="ve-mot-net"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#FFE98A"/><stop offset=".55" stop-color="#FFD43B"/><stop offset="1" stop-color="#E8A81D"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#FFE98A"/><stop offset=".6" stop-color="#FFD43B"/><stop offset="1" stop-color="#E8A81D"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFF3C8"/><stop offset="1" stop-color="#FFF3C8" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="pose" transform="rotate(-1.2 128 230)">

<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<path d="M128 166L106 154V178ZM128 166L150 154V178Z" fill="#E8454F"/><circle cx="128" cy="166" r="6" fill="#E8454F"/><circle cx="128" cy="166" r="6" fill="#fff" opacity=".25"/><path d="M70 70L128 8L186 70Q128 86 70 70Z" fill="#F5D6A8"/><path d="M110 28L128 8L146 28Q128 36 110 28Z" fill="#2A1A33"/><ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><rect x="46" y="38" width="164" height="150" rx="58" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#E8A81D" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><circle cx="98" cy="108" r="19" fill="#fff"/><circle cx="104" cy="110" r="8" fill="#2A1A33"/><circle cx="107" cy="107" r="3" fill="#fff"/><circle cx="160" cy="110" r="11" fill="#fff"/><circle cx="157" cy="107" r="5.5" fill="#2A1A33"/><circle cx="159" cy="105" r="2" fill="#fff"/><path d="M76 84L118 92M142 96L176 86" stroke="#2A1A33" stroke-width="5" stroke-linecap="round"/><ellipse cx="78" cy="132" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="132" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M100 132Q128 164 156 130Z" fill="#7A2A3A"/><path d="M110 132v8M122 136v8M134 136v8M146 134v8" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><ellipse id="mark" cx="180" cy="134" rx="9" ry="6" fill="#FF5A8A" transform="rotate(-20 180 134)"/></g>
<path id="sign" d="M24 240Q60 204 92 236T152 238Q184 224 214 240T246 218" fill="none" stroke="#00E5FF" stroke-width="8" stroke-linecap="round"/>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
