<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Tên Lửa Của Bé" class="np-mascot sk-default" data-style="pop" data-game="ten-lua-cua-be">
<title>Mèo phi công Mi — Tên Lửa Của Bé</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, ba sọc vằn mèo trên trán. Đạo cụ nhận diện game (luôn có): tên lửa nhỏ cầm tay phải + kính phi công trên mũ. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="ten-lua-cua-be"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#FFC27A;--p2:#F59A3D;--pst:#C26A18;--k1:var(--pa,#7A4E2E);--k2:var(--pb,#FFE08A);--bell:#FFF3D4;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="ten-lua-cua-be"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="ten-lua-cua-be"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><path d="M214 196Q252 176 240 132Q238 166 206 178Z" fill="var(--c2)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M52 92L40 24L104 62ZM204 92L216 24L152 62Z" fill="var(--c1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><path d="M60 80L54 44L88 66ZM196 80L202 44L168 66Z" fill="#FFB0C0"/><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><ellipse cx="128" cy="184" rx="50" ry="36" fill="var(--bell)"/><path d="M58 100Q60 40 128 38Q196 40 198 100Q160 76 128 76Q96 76 58 100Z" fill="var(--k1)" stroke="var(--st)" stroke-width="3" stroke-linejoin="round"/><rect x="84" y="52" width="36" height="24" rx="12" fill="#BFE6FF" stroke="var(--st)" stroke-width="3"/><rect x="136" y="52" width="36" height="24" rx="12" fill="#BFE6FF" stroke="var(--st)" stroke-width="3"/><path d="M120 62h16" stroke="var(--st)" stroke-width="4"/><ellipse cx="44" cy="164" rx="16" ry="28" transform="rotate(-22 44 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="212" cy="164" rx="16" ry="28" transform="rotate(22 212 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--k2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><g id="mark" stroke="#C26A18" stroke-width="3.5" stroke-linecap="round" opacity=".85"><path d="M120 86v8M128 84v10M136 86v8"/></g><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><path id="nose" d="M122 136Q128 132 134 136Q128 144 122 136Z" fill="#FF8FA3" stroke="#C25070" stroke-width="2"/><path d="M62 138h-18M62 148l-16 6M194 138h18M194 148l16 6" stroke="#C26A18" stroke-width="2.5" stroke-linecap="round" opacity=".7"/></g>
<g id="sign" transform="rotate(18 206 168)"><path d="M206 120Q222 144 218 184H194Q190 144 206 120Z" fill="#fff" stroke="#9AA3B8" stroke-width="3" stroke-linejoin="round"/><circle cx="206" cy="150" r="9" fill="#8FD8FF" stroke="#4A9ED0" stroke-width="3"/><path d="M194 168L180 190L194 184ZM218 168L232 190L218 184Z" fill="#FF5A4D" stroke="#C93A30" stroke-width="3" stroke-linejoin="round"/><path d="M198 186Q206 210 214 186Z" fill="#FFB020"/></g>
<g id="acc-badge" class="acc acc-badge"><circle cx="128" cy="118" r="100" fill="#BFE6FF" fill-opacity=".16" stroke="#fff" stroke-width="7"/><path d="M60 62Q76 38 104 34" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/><rect x="22" y="130" width="6" height="74" rx="3" fill="#B0B8C8" stroke="#6E7890" stroke-width="2"/><path d="M28 134h44l-10 14l10 14H28Z" fill="#FF5A4D" stroke="#C93A30" stroke-width="2.5" stroke-linejoin="round"/><circle cx="128" cy="204" r="13" fill="#4A90E8" stroke="#2A60B0" stroke-width="3"/><path d="M128 197l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#fff"/></g><g id="acc-group" class="acc acc-group"><path d="M70 80Q78 32 128 30Q178 32 186 80Z" fill="#fff" stroke="#9AA3B8" stroke-width="3" stroke-linejoin="round"/><path d="M70 80H186" stroke="#4A90E8" stroke-width="9" stroke-linecap="round"/><g transform="rotate(-28 44 176)"><rect x="38" y="140" width="12" height="62" rx="6" fill="#B0B8C8" stroke="#6E7890" stroke-width="3"/><path d="M30 138a14 14 0 0 1 28 0v8H30Z" fill="#B0B8C8" stroke="#6E7890" stroke-width="3"/></g></g><g id="acc-night" class="acc acc-night"><g transform="translate(0 -14)"><path d="M72 92Q80 34 134 28Q176 30 184 78Q150 58 128 62Q100 66 72 92Z" fill="#1B2A6B" stroke="#0E1A4A" stroke-width="3" stroke-linejoin="round"/><path d="M70 94Q128 64 188 94" fill="none" stroke="#7CF0FF" stroke-width="7" stroke-linecap="round"/><path d="M104 50l2.4 5 5.4.7-4 3.8 1 5.3-4.8-2.6-4.8 2.6 1-5.3-4-3.8 5.4-.7zM146 44l2 4 4.4.6-3.2 3.1.8 4.3-4-2.1-4 2.1.8-4.3-3.2-3.1 4.4-.6z" fill="#FFE08A"/></g><g transform="translate(30 178) rotate(-30)"><rect x="-8" y="-6" width="38" height="16" rx="6" fill="#4A5A7A" stroke="#222B45" stroke-width="3"/><path d="M30 -2L96 -26V34L30 12Z" fill="#FFF3A0" opacity=".55"/></g></g><g id="acc-star" class="acc acc-star"><g transform="translate(0 -6)"><path d="M70 90Q80 36 128 30Q176 36 186 90Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M60 92Q128 66 196 92" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".6"/><circle cx="128" cy="62" r="8" fill="#E8454F"/></g><g transform="translate(214 150)"><path d="M0 -40Q16 -16 12 24H-12Q-16 -16 0 -40Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3"/><circle cy="-8" r="8" fill="#fff" stroke="#C89A0A" stroke-width="2.5"/><path d="M-12 16L-26 36L-12 30ZM12 16L26 36L12 30Z" fill="#FF8A1F" stroke="#C25A0A" stroke-width="2.5"/></g><g fill="#FFE08A"><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path d="M220 140l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
