<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sếp Ơi Em Xin Nghỉ" class="np-mascot sk-default" data-style="night" data-game="xin-nghi">
<title>Nhân viên Xin Nghỉ</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mặt kem hình bầu dục, mắt lim dim "ổn mà", chân mày phải nhướn, chân mày trái có vết cắt, nhếch mép một bên. Đạo cụ nhận diện game (luôn có): tờ đơn xin nghỉ có hình ô dù bãi biển cầm ở tay trái. Dáng thân đổi: hoodie (Mặc định/Huy hiệu/Nhóm), áo khoác dài (Dạ quang), vest vai rộng (Siêu sao).</desc>
<style>
/* THEME (8 bộ Night Pass) đặt bảng gốc --p1 --p2 --pa --pb; SKIN biến đổi bảng đó. Không theme: bảng mặc định. */
.np-mascot{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#8B5CFF;--p2:#5B2FE0;--pa:#FF4FA3;--pb:#D7FF3F;--face:#FFE9D6;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.np-mascot.sk-night{--c1:color-mix(in srgb,var(--p2) 50%,#0f1040);--c2:color-mix(in srgb,var(--p2) 25%,#070820)}
.np-mascot.sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 85%,#fff)}
.acc,.fx,.shp,.hp{display:none}
.sk-default .shp-def,.sk-badge .shp-def,.sk-group .shp-def,.sk-night .shp-night,.sk-star .shp-star{display:inline}
.sk-default .hp,.sk-badge .hp,.sk-group .hp,.sk-night .hp{display:inline}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}
.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}
.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes npa-twinkle{0%,100%{opacity:.3}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}
@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="238" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round">
<g id="pose" transform="rotate(-5 128 232)">
<g id="body">
<g class="shp shp-def"><rect x="62" y="70" width="148" height="146" rx="60" fill="var(--c3x)" stroke-width="5"/><rect x="54" y="62" width="148" height="146" rx="60" fill="var(--c1)" stroke-width="5"/><path d="M82 186H174L166 208H90Z" fill="var(--c2)" stroke-width="5"/><path d="M114 160V184M142 160V184" fill="none" stroke-width="4"/><circle cx="114" cy="186" r="4.5" fill="var(--c4)" stroke-width="3"/><circle cx="142" cy="186" r="4.5" fill="var(--c4)" stroke-width="3"/></g>
<g class="shp shp-night"><rect x="64" y="70" width="140" height="154" rx="46" fill="var(--c3x)" stroke-width="5"/><rect x="58" y="62" width="140" height="154" rx="46" fill="var(--c1)" stroke-width="5"/><path d="M128 150V214" fill="none" stroke-width="4"/><path d="M84 170V208M172 170V208" fill="none" stroke="var(--c3)" stroke-width="3.5"/><path d="M92 156L128 186L164 156" fill="none" stroke-width="4"/></g>
<g class="shp shp-star"><rect x="62" y="70" width="168" height="146" rx="54" fill="var(--c3x)" stroke-width="5"/><rect x="46" y="62" width="168" height="146" rx="54" fill="var(--c1)" stroke-width="5"/><path d="M98 160L112 202L128 196ZM158 160L144 202L128 196Z" fill="var(--c2)" stroke-width="4"/><path d="M110 164L128 198L146 164Z" fill="#fff" stroke-width="4"/></g>
<rect x="84" y="206" width="40" height="22" rx="11" fill="#fff" stroke-width="5"/><rect x="86" y="221" width="36" height="8" rx="4" fill="var(--c4)" stroke-width="3"/><rect x="134" y="206" width="40" height="22" rx="11" fill="#fff" stroke-width="5"/><rect x="136" y="221" width="36" height="8" rx="4" fill="var(--c4)" stroke-width="3"/>
<ellipse cx="128" cy="112" rx="64" ry="56" fill="var(--c2)" stroke-width="5"/>
<path class="rim" d="M52 124Q50 74 92 58" fill="none" stroke="var(--bgx)" stroke-width="4" opacity=".75"/></g>
<g id="hp" class="hp"><path d="M72 98Q72 38 128 38Q184 38 184 98" fill="none" stroke-width="8"/><rect x="60" y="90" width="22" height="40" rx="10" fill="var(--c4)" stroke-width="5"/><rect x="174" y="90" width="22" height="40" rx="10" fill="var(--c4)" stroke-width="5"/></g>
<g id="face"><ellipse cx="128" cy="118" rx="52" ry="42" fill="var(--face)" stroke-width="4"/>
<g id="eyes" class="npa-blink"><ellipse cx="102" cy="114" rx="10" ry="11" fill="var(--ink)" stroke="none"/><ellipse cx="154" cy="114" rx="10" ry="11" fill="var(--ink)" stroke="none"/><rect x="90" y="101" width="24" height="9" fill="var(--face)" stroke="none"/><rect x="142" y="101" width="24" height="9" fill="var(--face)" stroke="none"/><path d="M90 110H114M142 110H166" fill="none" stroke-width="4"/><circle cx="106" cy="117" r="2.6" fill="#fff" stroke="none"/><circle cx="158" cy="117" r="2.6" fill="#fff" stroke="none"/></g>
<path id="mark" d="M88 96H97M103 96H114M98 90L103 101" fill="none" stroke-width="4.5"/><path d="M144 90L168 98" fill="none" stroke-width="5"/>
<path id="mouth" class="m-talk" d="M112 150Q132 160 152 142" fill="none" stroke-width="4"/><path d="M152 142l6-3" fill="none" stroke-width="3.5"/></g>
<g id="sign"><g transform="rotate(-14 36 176)"><rect x="16" y="150" width="40" height="52" rx="5" fill="#fff" stroke-width="4"/><path d="M23 160H49M23 167H44" fill="none" stroke-width="2.5" opacity=".55"/><path d="M24 188Q36 174 48 188Z" fill="var(--c3x)" stroke-width="3"/><path d="M36 188V198" fill="none" stroke-width="3"/><path d="M22 199Q29 195 36 199T50 199" fill="none" stroke-width="2.5" opacity=".7"/></g><ellipse cx="56" cy="190" rx="12" ry="16" fill="var(--c1)" stroke-width="5"/></g>
<ellipse id="handR" cx="200" cy="190" rx="12" ry="16" fill="var(--c1)" stroke-width="5"/>
