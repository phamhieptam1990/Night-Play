<g id="acc-group" class="acc acc-group"><path d="M82 62Q84 14 128 14Q172 14 174 62Z" fill="var(--c3)" stroke-width="5"/><path d="M172 58H222Q224 72 206 74H170Z" fill="var(--c3)" stroke-width="5"/><circle cx="128" cy="15" r="5" fill="var(--c4)" stroke-width="3"/><rect x="100" y="170" width="24" height="15" rx="7" fill="var(--ink)" stroke-width="3"/><rect x="132" y="170" width="24" height="15" rx="7" fill="var(--ink)" stroke-width="3"/><path d="M124 176H132" fill="none" stroke-width="3"/><path d="M92 166Q128 202 164 166" fill="none" stroke="#FFD43B" stroke-width="4" stroke-dasharray="1 6"/><g transform="rotate(10 216 170)"><rect x="204" y="124" width="22" height="92" rx="11" fill="var(--c4)" stroke-width="4"/><circle cx="215" cy="132" r="5" fill="#fff" stroke-width="3"/><circle cx="215" cy="208" r="5" fill="#fff" stroke-width="3"/></g></g>
<g id="acc-night" class="acc acc-night"><rect x="80" y="62" width="96" height="16" rx="8" fill="var(--ink)" stroke-width="3"/><path d="M90 70H166" fill="none" stroke="var(--c3)" stroke-width="3"/><circle cx="96" cy="70" r="2.5" fill="var(--c4)" stroke="none"/><circle cx="160" cy="70" r="2.5" fill="var(--c4)" stroke="none"/><circle cx="208" cy="168" r="30" fill="var(--bgx)" opacity=".25" stroke="none"/><rect x="196" y="148" width="24" height="40" rx="5" fill="var(--ink)" stroke-width="3.5"/><rect x="199" y="152" width="18" height="30" rx="3" fill="var(--c3)" stroke="none" opacity=".9"/><path d="M96 168Q128 198 160 168" fill="none" stroke="var(--c3)" stroke-width="3.5" stroke-dasharray="2 7"/><circle cx="128" cy="192" r="8" fill="var(--c3)" stroke-width="3"/></g>
<g id="acc-star" class="acc acc-star"><path d="M90 52L98 16L114 34L128 8L142 34L158 16L166 52Z" fill="#FFD43B" stroke-width="5"/><circle cx="128" cy="38" r="4.5" fill="var(--c3)" stroke="none"/><path d="M98 196h12v10H98z" fill="#fff" stroke-width="3"/><rect x="190" y="146" width="34" height="46" rx="5" fill="#FFF6DE" stroke-width="4"/><path d="M197 158H217M197 166H217M197 174H210" fill="none" stroke-width="2.5" opacity=".55"/><circle cx="214" cy="184" r="6" fill="#E63946" stroke-width="3"/><path d="M124 172H132L134 192L128 198L122 192Z" fill="#FFD43B" stroke-width="3.5"/></g>
<g id="fx-night" class="fx fx-night" stroke="none"><rect x="54" y="56" width="148" height="162" rx="50" fill="none" stroke="var(--bgx)" stroke-width="4.5" opacity=".95"/><path class="npa-twinkle" d="M30 62l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.7s" d="M226 92l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#39F5FF"/></g>
