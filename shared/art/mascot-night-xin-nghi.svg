<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sếp Ơi Em Xin Nghỉ" class="np-mascot sk-default" data-style="night" data-game="xin-nghi">
<title>Nhân viên Xin Nghỉ</title>
<style>
.np-mascot{--c1:#8B5CFF;--c2:#5B2FE0;--c3:#FF4FA3;--c4:#D7FF3F;--face:#FFE9D6;--ink:#12102B}
.np-mascot.sk-group{--c1:#2EC9FF;--c2:#1590D6;--c3:#FFB020;--c4:#FF4FA3}
.np-mascot.sk-night{--c1:#24266E;--c2:#15174A;--c3:#39F5FF;--c4:#FF4FA3}
.np-mascot.sk-star{--c1:#FFD83D;--c2:#F0A81C;--c3:#FF4FA3;--c4:#8B5CFF}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}
.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}
.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes npa-twinkle{0%,100%{opacity:.3}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}
@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="238" rx="68" ry="8" fill="var(--ink)" opacity=".22"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round">
<g id="pose" transform="rotate(-5 128 232)">
<g id="body"><rect x="62" y="70" width="148" height="146" rx="60" fill="var(--c3)" stroke-width="5"/>
<rect x="54" y="62" width="148" height="146" rx="60" fill="var(--c1)" stroke-width="5"/>
<ellipse cx="128" cy="112" rx="64" ry="56" fill="var(--c2)" stroke-width="5"/>
<path d="M82 186H174L166 208H90Z" fill="var(--c2)" stroke-width="5"/>
<path d="M114 160V184M142 160V184" fill="none" stroke-width="4"/><circle cx="114" cy="186" r="4.5" fill="var(--c4)" stroke-width="3"/><circle cx="142" cy="186" r="4.5" fill="var(--c4)" stroke-width="3"/>
<path d="M80 198l2.4 5 5.4.7-4 3.8 1 5.3-4.8-2.6-4.8 2.6 1-5.3-4-3.8 5.4-.7z" fill="var(--c4)" stroke-width="2.5"/>
<rect x="84" y="206" width="40" height="22" rx="11" fill="#fff" stroke-width="5"/><rect x="86" y="221" width="36" height="8" rx="4" fill="var(--c4)" stroke-width="3"/>
<rect x="134" y="206" width="40" height="22" rx="11" fill="#fff" stroke-width="5"/><rect x="136" y="221" width="36" height="8" rx="4" fill="var(--c4)" stroke-width="3"/>
<path d="M72 98Q72 38 128 38Q184 38 184 98" fill="none" stroke-width="8"/><rect x="60" y="90" width="22" height="40" rx="10" fill="var(--c4)" stroke-width="5"/><rect x="174" y="90" width="22" height="40" rx="10" fill="var(--c4)" stroke-width="5"/></g>
<g id="face"><ellipse cx="128" cy="118" rx="52" ry="42" fill="var(--face)" stroke-width="4"/>
<g id="eyes" class="npa-blink"><ellipse cx="102" cy="114" rx="10" ry="11" fill="var(--ink)" stroke="none"/><ellipse cx="154" cy="114" rx="10" ry="11" fill="var(--ink)" stroke="none"/><rect x="90" y="101" width="24" height="9" fill="var(--face)" stroke="none"/><rect x="142" y="101" width="24" height="9" fill="var(--face)" stroke="none"/><path d="M90 110H114M142 110H166" fill="none" stroke-width="4"/><circle cx="106" cy="117" r="2.6" fill="#fff" stroke="none"/><circle cx="158" cy="117" r="2.6" fill="#fff" stroke="none"/></g>
<path d="M88 96H114M144 90L168 98" fill="none" stroke-width="5"/>
<path id="mouth" d="M112 150Q132 160 152 142" fill="none" stroke-width="4"/><path d="M152 142l6-3" fill="none" stroke-width="3.5"/></g>
<g id="acc-badge" class="acc acc-badge"><circle cx="164" cy="176" r="11" fill="#FFD43B" stroke-width="4"/><path d="M164 169l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#fff" stroke="none"/><path d="M96 168c-5-6-14 1-8 8l8 8 8-8c6-7-3-14-8-8z" fill="var(--c4)" stroke-width="3.5"/></g>
<g id="acc-group" class="acc acc-group"><path d="M84 64Q88 18 128 18Q168 18 172 64Z" fill="var(--c3)" stroke-width="5"/><path d="M170 60H218Q220 74 202 76H168Z" fill="var(--c3)" stroke-width="5"/><circle cx="128" cy="19" r="5" fill="var(--c4)" stroke-width="3"/><rect x="78" y="102" width="46" height="30" rx="13" fill="var(--ink)" stroke-width="4"/><rect x="132" y="102" width="46" height="30" rx="13" fill="var(--ink)" stroke-width="4"/><path d="M124 112H132" fill="none" stroke-width="5"/><path d="M88 110l12-2M142 110l12-2" fill="none" stroke="#fff" stroke-width="3"/></g>
<g id="acc-night" class="acc acc-night"><path d="M96 166Q128 196 160 166" fill="none" stroke="var(--c3)" stroke-width="4" stroke-dasharray="2 7"/><circle cx="128" cy="190" r="9" fill="var(--c3)" stroke-width="3.5"/><circle cx="132" cy="187" r="8" fill="var(--c1)" stroke="none"/></g>
<g id="acc-star" class="acc acc-star"><path d="M90 52L98 18L114 36L128 10L142 36L158 18L166 52Z" fill="#FFD43B" stroke-width="5"/><circle cx="128" cy="38" r="4.5" fill="var(--c3)" stroke="none"/><path d="M96 168Q128 198 160 168" fill="none" stroke="#FFD43B" stroke-width="5"/><circle cx="128" cy="192" r="8" fill="#FFD43B" stroke-width="3.5"/></g>
</g>
<g id="fx-night" class="fx fx-night" stroke="none"><rect x="50" y="56" width="156" height="154" rx="64" fill="none" stroke="var(--c3)" stroke-width="3" opacity=".7"/><path class="npa-twinkle" d="M30 62l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#39F5FF"/><path class="npa-twinkle" style="animation-delay:.7s" d="M226 92l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FF4FA3"/></g>
<g id="fx-star" class="fx fx-star" stroke="none"><circle class="npa-twinkle" cx="34" cy="66" r="5" fill="#FF4FA3"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="226" cy="84" r="5" fill="#2EC9FF"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="220" cy="38" r="4" fill="#D7FF3F"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="46" cy="28" r="4" fill="#8B5CFF"/></g>
</g>
</svg>
