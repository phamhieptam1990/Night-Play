<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cắt Bánh Chưng" class="np-mascot sk-default" data-style="night" data-game="cat-banh-chung">
<title>Chưng Chưng Chảnh — Cắt Bánh Chưng</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, hạt đậu vàng trên trán. Đạo cụ nhận diện game (luôn có): con dao cắt bánh. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="cat-banh-chung"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.acc,.fx{display:none}.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" stop-color="#7FE0A0"/><stop offset=".55" stop-color="#2EBD6B"/><stop offset="1" stop-color="#17803F"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#7FE0A0"/><stop offset=".6" stop-color="#2EBD6B"/><stop offset="1" stop-color="#17803F"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFF3C8"/><stop offset="1" stop-color="#FFF3C8" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"><g stroke="#FFD93D" stroke-width="9" opacity=".6" stroke-linecap="round"><path d="M40 96V232M216 96V232M24 168H232"/></g></g><g id="pose" transform="rotate(0 128 230)">
<g id="charg" transform="translate(14 30) scale(.82)">
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<path d="M96 150H160L172 226Q128 242 84 226Z" fill="#fff"/><path d="M96 150Q128 164 160 150" fill="none" stroke="#9AA3B8" stroke-width="5" opacity=".5"/><rect x="108" y="190" width="40" height="24" rx="8" fill="#9AA3B8" opacity=".3"/><ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><rect x="46" y="38" width="164" height="150" rx="58" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#17803F" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><rect x="76" y="94" width="44" height="30" rx="12" fill="#1C1426"/><rect x="136" y="94" width="44" height="30" rx="12" fill="#1C1426"/><path d="M120 104H136" stroke="#1C1426" stroke-width="5"/><path d="M84 101l10 -3M144 101l10 -3" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".8"/><ellipse cx="78" cy="132" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="132" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M110 134Q128 148 148 130" fill="none" stroke="#7A2A3A" stroke-width="4.5" stroke-linecap="round"/></g><ellipse cx="128" cy="66" rx="7" ry="5" fill="#FFC83D" id="mark"/></g>
<path d="M96 40L84 6L124 34ZM160 40L174 4L134 34Z" fill="#2EBD6B"/></g>
<g id="propg" transform="translate(250 236) scale(1.55) translate(-250 -236)"><g id="sign" transform="rotate(24 214 170)"><rect x="206" y="176" width="16" height="44" rx="7" fill="#E8454F"/><path d="M204 172L202 110Q220 102 232 114L228 172Z" fill="#E6EAF2" stroke="#9AA3B8" stroke-width="3"/></g></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g></g></svg>
