<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cắt Bánh Chưng" class="np-mascot sk-default" data-style="night" data-game="cat-banh-chung">
<title>Chưng Chưng Chảnh — Cắt Bánh Chưng</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt to hai chấm sáng, má hồng, biểu cảm riêng, hạt đậu vàng trên trán. Đạo cụ nhận diện game (luôn có): con dao cắt bánh. Phong cách Night 3D mềm. Chi tiết nhỏ dùng màu cứng.</desc>
<style>.np-mascot[data-game="cat-banh-chung"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#2EBD6B;--p2:#17803F;--g0:color-mix(in srgb,var(--p1) 56%,#fff);--g1:var(--p1);--g2:var(--p2);--sh:color-mix(in srgb,var(--bg2) 55%,#000)}
.np-mascot.sk-night{--g0:color-mix(in srgb,var(--p1) 26%,#8C8CFF);--g1:color-mix(in srgb,var(--p1) 34%,#4040B8);--g2:color-mix(in srgb,var(--p2) 40%,#1C1C6A)}
.np-mascot.sk-star{--g0:color-mix(in srgb,var(--p1) 38%,#fff);--g1:color-mix(in srgb,var(--p1) 72%,#fff);--g2:color-mix(in srgb,var(--p2) 78%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.sk-badge .base-top,.sk-group .base-top,.sk-night .base-top,.sk-star .base-top{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-twinkle{animation:npa-twinkle 2s ease-in-out infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}@keyframes npa-twinkle{0%,100%{opacity:.35}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}</style>
<defs><radialGradient id="h" cx=".34" cy=".26" r=".85"><stop offset="0" style="stop-color:var(--g0)"/><stop offset=".55" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></radialGradient>
<radialGradient id="b" cx=".4" cy=".25" r=".9"><stop offset="0" style="stop-color:var(--g0)"/><stop offset=".6" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></radialGradient>
<radialGradient id="e" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#6A4A5E"/><stop offset=".6" stop-color="#2A1A33"/><stop offset="1" stop-color="#140B1C"/></radialGradient>
<radialGradient id="v" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#FFF3C8"/><stop offset="1" stop-color="#FFF3C8" stop-opacity=".78"/></radialGradient></defs>
<g id="shadow"><ellipse cx="128" cy="240" rx="76" ry="9" fill="var(--sh)" opacity=".5"/></g>
<g id="all" class="npa npa-breathe"><g id="scene"></g><g id="pose" transform="rotate(0 128 230)">
<g id="charg" transform="translate(14 30) scale(.82)"><g id="back-star" class="acc acc-star"><path d="M54 120Q26 184 56 244L128 226L200 244Q230 184 202 120Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><path d="M76 150Q128 172 180 150" fill="none" stroke="#fff" stroke-width="4" opacity=".6" stroke-linecap="round"/></g>
<g id="body"><ellipse cx="128" cy="184" rx="68" ry="54" fill="url(#b)"/><ellipse cx="128" cy="190" rx="42" ry="34" fill="url(#v)"/>
<ellipse cx="62" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(18 62 176)"/><ellipse cx="194" cy="176" rx="17" ry="26" fill="url(#b)" transform="rotate(-18 194 176)"/>
<ellipse cx="98" cy="232" rx="24" ry="13" fill="url(#b)"/><ellipse cx="158" cy="232" rx="24" ry="13" fill="url(#b)"/>
<path d="M96 150H160L172 226Q128 242 84 226Z" fill="#fff"/><path d="M96 150Q128 164 160 150" fill="none" stroke="#9AA3B8" stroke-width="5" opacity=".5"/><rect x="108" y="190" width="40" height="24" rx="8" fill="#9AA3B8" opacity=".3"/><ellipse cx="128" cy="170" rx="58" ry="12" fill="#000" opacity=".16"/><rect x="46" y="38" width="164" height="150" rx="58" fill="url(#h)"/><ellipse cx="94" cy="56" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-24 94 56)"/><ellipse cx="70" cy="86" rx="7" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-50 70 86)"/><path d="M204 84Q216 112 198 150" fill="none" stroke="#fff" stroke-width="6" opacity=".22" stroke-linecap="round"/><path d="M60 176Q70 210 100 226" fill="none" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/><path d="M52 132Q60 176 100 186" fill="none" stroke="#17803F" stroke-width="10" opacity=".14" stroke-linecap="round"/></g>
<g id="face"><g id="eyes"><rect x="76" y="94" width="44" height="30" rx="12" fill="#1C1426"/><rect x="136" y="94" width="44" height="30" rx="12" fill="#1C1426"/><path d="M120 104H136" stroke="#1C1426" stroke-width="5"/><path d="M84 101l10 -3M144 101l10 -3" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".8"/><ellipse cx="78" cy="132" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><ellipse cx="178" cy="132" rx="13" ry="8" fill="#FF8FA8" opacity=".55"/><path d="M110 134Q128 148 148 130" fill="none" stroke="#7A2A3A" stroke-width="4.5" stroke-linecap="round"/></g><ellipse cx="128" cy="66" rx="7" ry="5" fill="#FFC83D" id="mark"/></g>
<g class="keep-top"><path d="M48 52H208M48 170H208M62 40V182M194 40V182" stroke="#F2D88A" stroke-width="7" stroke-linecap="round" opacity=".9"/><path d="M62 40V182M194 40V182" stroke="#C9A85A" stroke-width="2" opacity=".6"/><path d="M96 40L84 6L124 34ZM160 40L174 4L134 34Z" fill="#2EBD6B"/></g><g id="acc-badge" class="acc acc-badge"><path d="M82 56Q66 20 98 18Q104 -4 128 6Q152 -4 158 18Q190 20 174 56Z" fill="#fff"/><rect x="84" y="50" width="88" height="16" rx="6" fill="#fff"/><path d="M96 58H160" stroke="#C8CEDA" stroke-width="3"/><path d="M112 160L124 190L134 190L146 160Z" fill="#E8454F" opacity=".85"/><circle cx="128" cy="198" r="15" fill="#FFD43B" stroke="#C89A0A" stroke-width="3.5"/><path d="M128 190l3 6 7 1-5 5 1.4 7-6.4-3.4-6.4 3.4 1.4-7-5-5 7-1z" fill="#fff"/></g><g id="acc-group" class="acc acc-group"><path d="M54 72Q128 32 202 72Q128 58 54 72Z" fill="#E8454F"/><path d="M196 66l24 8l-6 20z" fill="#E8454F"/><g fill="#fff" opacity=".7"><circle cx="90" cy="60" r="3"/><circle cx="128" cy="52" r="3"/><circle cx="166" cy="60" r="3"/></g></g><g id="acc-night" class="acc acc-night"><g><path d="M128 36V12" stroke="#8A5A30" stroke-width="4"/><rect x="108" y="-16" width="40" height="34" rx="14" fill="#FF8A4C" stroke="#B8540A" stroke-width="3"/><path d="M108 0H148M108 10H148" stroke="#B8540A" stroke-width="2.5" opacity=".6"/><circle cx="128" cy="2" r="30" fill="#FFD27A" opacity=".3"/></g></g><g id="acc-star" class="acc acc-star"><path d="M78 56L86 14L108 38L128 4L148 38L170 14L178 56Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="30" r="5.5" fill="#E8454F"/><path d="M112 160L124 190L134 190L146 160Z" fill="#E8454F" opacity=".85"/><circle cx="128" cy="198" r="15" fill="#FFD43B" stroke="#C89A0A" stroke-width="3.5"/><path d="M128 190l3 6 7 1-5 5 1.4 7-6.4-3.4-6.4 3.4 1.4-7-5-5 7-1z" fill="#fff"/></g><g id="fx-night" class="fx fx-night"><ellipse cx="128" cy="124" rx="122" ry="116" fill="none" stroke="var(--bgx)" stroke-width="5" opacity=".9"/><ellipse cx="128" cy="124" rx="132" ry="124" fill="none" stroke="#7CF0FF" stroke-width="2.5" opacity=".5"/><g fill="#fff" class="npa-twinkle"><path d="M30 60l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z"/><path d="M226 120l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z"/></g><g fill="#7CF0FF" class="npa-twinkle" style="animation-delay:.8s"><circle cx="40" cy="170" r="4"/><circle cx="220" cy="46" r="3.5"/><circle cx="24" cy="112" r="3"/></g></g><g id="fx-star" class="fx fx-star"><g fill="#FFE08A" class="npa-twinkle"><path d="M34 70l3 7.4 7.4 3-7.4 3-3 7.4-3-7.4-7.4-3 7.4-3z"/><path d="M222 150l3 7.4 7.4 3-7.4 3-3 7.4-3-7.4-7.4-3 7.4-3z"/><path d="M214 40l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z"/></g><g fill="#FF8AD0" class="npa-twinkle" style="animation-delay:.7s"><circle cx="46" cy="190" r="4"/><circle cx="232" cy="96" r="3.5"/></g></g></g>
