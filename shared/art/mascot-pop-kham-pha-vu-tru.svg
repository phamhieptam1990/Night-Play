<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Khám Phá Vũ Trụ" class="np-mascot sk-default" data-style="pop" data-game="kham-pha-vu-tru">
<title>Koala Phi Hành Gia — Khám Phá Vũ Trụ</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): mắt tròn to hai chấm sáng, má hồng, miệng cười nhỏ, vầng trăng khuyết vàng bên thái dương phải. Đạo cụ nhận diện game (luôn có): hành tinh có vành đai trên tay. 5 skin (1 miễn phí). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="kham-pha-vu-tru"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF8A4C;--p1:#C3C9DC;--p2:#9AA3C0;--pst:#5E6890;--k1:var(--pa,#FFD43B);--k2:var(--pb,#9AA3C0);--bell:#F3F5FC;--bl:#FF9DB0;--ink:#2A2350;--hl:#fff;--sh:color-mix(in srgb,var(--bg2) 55%,#000);--c1:var(--p1);--c2:var(--p2);--st:var(--pst)}
.np-mascot[data-game="kham-pha-vu-tru"].sk-night{--c1:color-mix(in srgb,var(--p1) 60%,#0b0c3a);--c2:color-mix(in srgb,var(--p2) 55%,#0b0c3a);--st:color-mix(in srgb,var(--pst) 50%,#0b0c3a)}
.np-mascot[data-game="kham-pha-vu-tru"].sk-star{--c1:color-mix(in srgb,var(--p1) 70%,#fff);--c2:color-mix(in srgb,var(--p2) 84%,#fff)}
.acc,.fx{display:none}
.sk-badge .acc-badge,.sk-group .acc-group,.sk-night .acc-night,.sk-star .acc-star,.sk-night .fx-night,.sk-star .fx-star{display:inline}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-bob{animation:npa-bob 2.4s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 4.2s infinite}.npa-twinkle{animation:npa-twinkle 1.8s ease-in-out infinite}
@keyframes npa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes npa-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}@keyframes npa-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
:root.np-playing .npa,:root.np-playing .npa-twinkle{animation:none}@media (prefers-reduced-motion:reduce){.npa,.npa-twinkle{animation:none}}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
<g id="shadow"><ellipse cx="128" cy="237" rx="72" ry="9" fill="var(--sh)" opacity=".4"/></g>
<g id="all" class="npa npa-bob">
<g id="back-star" class="acc acc-star"><path d="M58 104Q34 170 64 232L128 218L192 232Q222 170 198 104Z" fill="#E63946" stroke="#B42330" stroke-width="3" stroke-linejoin="round"/></g>
<g id="body"><circle cx="54" cy="70" r="34" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><circle cx="54" cy="70" r="18.700000000000003" fill="#F3F5FC"/><circle cx="202" cy="70" r="34" fill="var(--c1)" stroke="var(--st)" stroke-width="3"/><circle cx="202" cy="70" r="18.700000000000003" fill="#F3F5FC"/><ellipse cx="128" cy="140" rx="86" ry="82" fill="url(#pg)" stroke="var(--st)" stroke-width="3"/><ellipse cx="98" cy="88" rx="26" ry="12" transform="rotate(-24 98 88)" fill="var(--hl)" opacity=".5"/><ellipse cx="128" cy="184" rx="50" ry="36" fill="var(--bell)"/><ellipse cx="44" cy="164" rx="16" ry="28" transform="rotate(-22 44 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="212" cy="164" rx="16" ry="28" transform="rotate(22 212 164)" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="102" cy="226" rx="16" ry="8" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/><ellipse cx="154" cy="226" rx="16" ry="8" fill="var(--c2)" stroke="var(--st)" stroke-width="3"/></g>
<g id="face"><g id="eyes" class="npa-blink"><circle cx="100" cy="112" r="14" fill="var(--ink)"/><circle cx="156" cy="112" r="14" fill="var(--ink)"/><circle cx="105" cy="106" r="5" fill="#fff"/><circle cx="161" cy="106" r="5" fill="#fff"/><circle cx="96" cy="118" r="2.5" fill="#fff"/><circle cx="152" cy="118" r="2.5" fill="#fff"/></g><g id="blush"><ellipse cx="80" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/><ellipse cx="176" cy="138" rx="11" ry="7" fill="var(--bl)" opacity=".75"/></g><path id="mark" transform="translate(18 -6) scale(.85)" d="M176 94A14 14 0 1 0 176 122A10.5 10.5 0 1 1 176 94Z" fill="#FFD43B" stroke="#C89A0A" stroke-width="2" stroke-linejoin="round"/><path id="mouth" class="m-talk" d="M114 144Q128 158 142 144" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><ellipse id="nose" cx="128" cy="134" rx="15" ry="10" fill="#3A3F5C"/><ellipse cx="123" cy="130" rx="4.5" ry="2.5" fill="#fff" opacity=".6"/></g>
<g id="sign"><circle cx="206" cy="176" r="20" fill="#C79BFF" stroke="#6A3FC0" stroke-width="3"/><ellipse cx="206" cy="176" rx="34" ry="9" fill="none" stroke="#FFD43B" stroke-width="5" transform="rotate(-20 206 176)"/><circle cx="199" cy="169" r="5" fill="#fff" opacity=".55"/></g>
<g id="acc-badge" class="acc acc-badge"><path d="M114 188L128 206L142 188Z" fill="#FF6B6B"/><circle cx="128" cy="208" r="13" fill="#FFD43B" stroke="#E8A317" stroke-width="3"/><path d="M128 201l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#fff"/><path d="M62 84Q48 110 62 140M194 84Q208 110 194 140" fill="none" stroke="#FFD43B" stroke-width="5" stroke-linecap="round"/><g fill="#FFD43B"><ellipse cx="54" cy="100" rx="6" ry="3.5" transform="rotate(-30 54 100)"/><ellipse cx="52" cy="118" rx="6" ry="3.5"/><ellipse cx="56" cy="134" rx="6" ry="3.5" transform="rotate(30 56 134)"/><ellipse cx="202" cy="100" rx="6" ry="3.5" transform="rotate(30 202 100)"/><ellipse cx="204" cy="118" rx="6" ry="3.5"/><ellipse cx="200" cy="134" rx="6" ry="3.5" transform="rotate(-30 200 134)"/></g></g><g id="acc-group" class="acc acc-group"><ellipse cx="128" cy="112" rx="98" ry="92" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-width="7"/><path d="M62 70Q76 40 104 34" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/><g transform="translate(40 186)"><path d="M0 -26Q16 -4 12 22H-12Q-16 -4 0 -26Z" fill="#fff" stroke="#9AA3B8" stroke-width="3"/><circle cy="-4" r="6" fill="#4A90E8"/><path d="M-12 12L-24 28L-12 24ZM12 12L24 28L12 24Z" fill="#E8454F"/></g></g><g id="acc-night" class="acc acc-night"><path d="M72 88Q82 34 128 28Q176 30 186 80Q154 58 128 62Q100 66 72 88Z" fill="#5B4BD8" stroke="#2A1F7A" stroke-width="3" stroke-linejoin="round"/><path d="M70 90Q128 62 188 90" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="184" cy="62" r="10" fill="#fff" stroke="#C9C2FF" stroke-width="2.5"/><path d="M52 152A22 22 0 1 0 52 198A17 17 0 1 1 52 152Z" fill="#FFE08A" stroke="#E0A02E" stroke-width="2.5" stroke-linejoin="round"/></g><g id="acc-star" class="acc acc-star"><path d="M94 70L102 38L117 55L128 30L139 55L154 38L162 70Z" fill="#FFD43B" stroke="#E8A317" stroke-width="3" stroke-linejoin="round"/><circle cx="128" cy="56" r="4" fill="#FF6B6B"/><path d="M40 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#FFE08A"/></g>
<g id="fx-night" class="fx fx-night"><circle cx="128" cy="146" r="108" fill="none" stroke="var(--bgx)" stroke-width="6" opacity=".75"/><path class="npa-twinkle" d="M34 74l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--bgx)"/><path class="npa-twinkle" style="animation-delay:.6s" d="M222 100l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#FFE08A"/></g><g id="fx-star" class="fx fx-star"><circle class="npa-twinkle" cx="30" cy="96" r="5" fill="#FF6B6B"/><circle class="npa-twinkle" style="animation-delay:.4s" cx="228" cy="104" r="5" fill="var(--bgx)"/><circle class="npa-twinkle" style="animation-delay:.9s" cx="236" cy="60" r="4" fill="#51CF66"/><circle class="npa-twinkle" style="animation-delay:1.3s" cx="20" cy="40" r="4" fill="#CC5DE8"/></g>
</g>
</svg>
