<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Mắt Tinh Không?" class="np-mascot sk-default" data-style="night" data-game="mat-tinh-khong">
<title>Tắc Kè Soi — Mắt Tinh Không?</title>
<desc>Chữ ký khuôn mặt (giữ nguyên ở mọi skin): biểu cảm riêng (thè lưỡi, hai mắt nhìn hai hướng) + một chân mày nhướn, đốm tím tròn trên má phải. Đạo cụ nhận diện game (luôn có): kính lúp cầm tay + hai mắt lồi. Phong cách Night (sticker). Chi tiết nhỏ dùng màu cứng.</desc>
<style>
.np-mascot[data-game="mat-tinh-khong"]{--bg1:#2b2064;--bg2:#171236;--bgx:#FF4FA3;--p1:#7BE04A;--p2:#43A81E;--pa:#B05CFF;--pb:#FFE45C;--face:#F2FFD6;--ink:#12102B;--c1:var(--p1);--c2:var(--p2);--c3:var(--pa);--c4:var(--pb);--c3x:var(--c3);--sh:color-mix(in srgb,var(--bg2) 55%,#000);--lid:var(--c1)}
.acc,.fx{display:none}
.npa{transform-box:fill-box;transform-origin:50% 100%}.npa-breathe{animation:npa-breathe 3.2s ease-in-out infinite}.npa-blink{transform-origin:50% 50%;animation:npa-blink 5s infinite}
@keyframes npa-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}@keyframes npa-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
:root.np-playing .npa{animation:none}@media (prefers-reduced-motion:reduce){.npa{animation:none}}
</style>
<g id="shadow"><ellipse cx="130" cy="240" rx="70" ry="8" fill="var(--sh)" opacity=".45"/></g>
<g id="all" class="npa npa-breathe" stroke="var(--ink)" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
<g id="pose" transform="rotate(5 128 232)">
<g id="sil" transform="translate(8 8)" fill="var(--c3x)"><ellipse cx="128" cy="150" rx="86" ry="76"/><circle cx="84" cy="64" r="32"/><circle cx="172" cy="64" r="32"/></g>
<g id="body"><path d="M210 196Q256 190 244 150Q232 130 216 146Q236 150 224 176Q214 184 204 180Z" fill="var(--c2)"/><ellipse cx="128" cy="152" rx="82" ry="72" fill="var(--c1)"/><ellipse cx="128" cy="186" rx="48" ry="30" fill="var(--face)" stroke-width="4"/><path d="M62 150l-14 -8M60 170l-16 0" stroke="var(--c2)" stroke-width="7" fill="none"/><circle cx="84" cy="64" r="30" fill="var(--c1)"/><circle cx="172" cy="64" r="30" fill="var(--c1)"/><circle cx="84" cy="64" r="20" fill="#fff" stroke-width="4"/><circle cx="172" cy="64" r="20" fill="#fff" stroke-width="4"/><circle cx="90" cy="66" r="9" fill="var(--ink)" stroke="none"/><circle cx="178" cy="62" r="9" fill="var(--ink)" stroke="none"/><circle cx="93" cy="63" r="3" fill="#fff" stroke="none"/><circle cx="181" cy="59" r="3" fill="#fff" stroke="none"/><path d="M62 52Q84 38 106 52M150 50L194 38" fill="none" stroke-width="4"/></g>
<g id="face"><g id="eyes" class="npa-blink"></g><g id="mouthg"><path id="mouth" class="m-talk" d="M125 164q0 16 7 16q7 0 7 -16z" fill="#FF6F91" stroke-width="3.5"/><path d="M114 164Q128 172 146 162" fill="none" stroke-width="4.5"/></g><circle id="mark" cx="176" cy="150" r="8" fill="var(--c3)" stroke-width="3"/></g>
<g id="shoes"><path d="M50 226Q50 214 64 214H80Q92 214 92 226Z" fill="#fff" stroke-width="4.5"/><rect x="48" y="226" width="46" height="8" rx="4" fill="var(--c3x)" stroke-width="4"/><path d="M164 226Q164 214 178 214H194Q206 214 206 226Z" fill="#fff" stroke-width="4.5"/><rect x="162" y="226" width="46" height="8" rx="4" fill="var(--c3x)" stroke-width="4"/></g><g id="sign" transform="rotate(20 206 182)"><circle cx="208" cy="152" r="26" fill="#BEE9FF" fill-opacity=".55" stroke-width="6"/><path d="M196 140Q202 134 210 134" fill="none" stroke="#fff" stroke-width="4"/><rect x="204" y="178" width="12" height="50" rx="6" fill="var(--c4)" stroke-width="5"/></g>
<g id="acc-badge" class="acc acc-badge"></g><g id="acc-group" class="acc acc-group"></g><g id="acc-night" class="acc acc-night"></g><g id="acc-star" class="acc acc-star"></g><g id="fx-night" class="fx fx-night"></g><g id="fx-star" class="fx fx-star"></g>
</g>
</g>
</svg>
