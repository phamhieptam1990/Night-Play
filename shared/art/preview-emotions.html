<div class="g" id="g"></div>
<script>
const S=[["math","Mochi"],["vietnamese","Mầm"],["english","Bibi"]],E=["","em-happy","em-cheer","em-sad","em-sleepy"],EN=["Bình thường","Vui","Mừng rỡ","Buồn nhẹ","Buồn ngủ"];
const g=document.getElementById("g");g.innerHTML='<div></div>'+EN.map(e=>`<div class="h">${e}</div>`).join("");
(async()=>{for(const [id,n] of S){g.insertAdjacentHTML("beforeend",`<div class="h">${n}</div>`);
 const t=await (await fetch(`learn/${id}/${id}_grade_3.svg`)).text();
 for(const e of E){const d=document.createElement("div");d.innerHTML=t.replace(/id="(mg|vg|eg)"/,'id="$1'+e+'"').replace(/url\(#(mg|vg|eg)\)/g,'url(#$1'+e+')');const s=d.firstElementChild;if(e)s.classList.add(e);g.appendChild(d)}}})();
