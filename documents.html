<!doctype html>
<html lang="vi" data-app="hub">
<head>
<meta charset="utf-8">
<script src="shared/guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tài liệu và chính sách của Play Hub: bảo mật, khiếu nại, giá, thanh toán, điều kiện, đổi trả hoàn tiền, hỗ trợ.">
<link rel="icon" type="image/svg+xml" sizes="any" href="/shared/favicon.svg">
<title>Tài liệu · Play Hub</title>
<script>
try{var t=localStorage.getItem("theme")}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
(function(){var q=new URLSearchParams(location.search).get("lang"),s=null;try{s=localStorage.getItem("lang")}catch(e){}
var l=[q,s].find(function(x){return x==="vi"||x==="en"})||(/^vi/i.test(navigator.language||"")?"vi":"en");document.documentElement.lang=l;})();
</script>
<link rel="preload" href="shared/fonts/inter-var-latin-vi.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/theme.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.35;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1000px;width:100%;margin:0 auto;flex-wrap:wrap}
.back{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink);text-decoration:none;flex:none}
.back svg{width:22px;height:22px}
h1{margin:0;font-size:clamp(19px,4.5vw,26px);line-height:1.2;flex:none;margin-right:auto}
@media (max-width:350px){h1{display:none}.seg{margin-right:auto}}
@media (max-width:400px){h1{font-size:17px}header{gap:6px}.btn{width:40px!important;height:40px}.back{width:40px;height:40px}}
.seg{display:inline-flex;flex:none;background:var(--panel);box-shadow:var(--shadow);border-radius:22px;padding:3px}
.seg button{font:inherit;border:0;background:none;color:var(--muted);border-radius:19px;height:36px;min-width:40px;padding:0 10px;font-weight:800;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sel{flex:1 1 100%;order:3;position:relative;min-width:0}
.sel select{width:100%;height:44px;appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:0 40px 0 14px;text-overflow:ellipsis;box-shadow:var(--shadow)}
.sel svg{position:absolute;right:12px;top:50%;width:18px;height:18px;margin-top:-9px;pointer-events:none;color:var(--muted)}
.acts{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;font-weight:800;font-size:14px;text-decoration:none;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn.p{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn svg{width:18px;height:18px}
main{flex:1;min-height:0;max-width:1000px;width:100%;margin:0 auto;padding:0 16px 12px;display:flex}
iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff}
@media (max-width:480px){.btn span{display:none}.btn{width:44px;padding:0}}
@media (min-width:700px){.sel{flex:1 1 0;order:0}}
@media (max-height:480px){header{padding:4px 16px;flex-wrap:nowrap}.sel{flex:1 1 0;order:0}.back,.btn,.sel select{height:38px}.seg button{height:32px}.back{width:38px}h1{display:none}main{padding-bottom:6px}}
</style>
</head>
<body>
<header>
  <a class="back" href="play/index.html" aria-label="Về trang chủ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <h1 id="ttl">Tài liệu</h1>
  <div class="seg" role="group" aria-label="Language"><button type="button" data-l="vi">VI</button><button type="button" data-l="en">EN</button></div>
  <div class="acts">
    <a class="btn" id="open" target="_blank" rel="noopener" aria-label="Mở trong tab mới"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Mở</span></a>
    <a class="btn p" id="dl" download aria-label="Tải PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Tải PDF</span></a>
  </div>
  <label class="sel"><select id="pick" aria-label="Chọn tài liệu"></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></label>
</header>
<main><iframe id="view" title="Tài liệu"></iframe></main>
<script>
/* [tên vi, tên en, tệp (vi), tệp (en), tệp song ngữ VI+EN dùng cho nút Tải PDF]. PDF tiếng Việt: legal/*-vi.pdf hoặc legal/tailieu/NN-xxx.pdf; tiếng Anh: legal/*-en.pdf hoặc legal/tailieu/NN-xxx-en.pdf */
var DOCS=[
 ["Chính sách bảo mật","Privacy Policy","legal/privacy-vi.pdf","legal/privacy-en.pdf","legal/tailieu/01-privacy-vi-en.pdf"],
 ["Phương thức tiếp nhận và giải quyết phản ánh, yêu cầu, khiếu nại","How we receive and resolve feedback, requests and complaints","legal/tailieu/02-tiep-nhan-giai-quyet-khieu-nai.pdf","legal/tailieu/02-tiep-nhan-giai-quyet-khieu-nai-en.pdf","legal/tailieu/02-tiep-nhan-giai-quyet-khieu-nai-vi-en.pdf"],
 ["Chính sách giá","Pricing policy","legal/tailieu/03-chinh-sach-gia.pdf","legal/tailieu/03-chinh-sach-gia-en.pdf","legal/tailieu/03-chinh-sach-gia-vi-en.pdf"],
 ["Chính sách về thanh toán","Payment policy","legal/tailieu/04-chinh-sach-thanh-toan.pdf","legal/tailieu/04-chinh-sach-thanh-toan-en.pdf","legal/tailieu/04-chinh-sach-thanh-toan-vi-en.pdf"],
 ["Các điều kiện hoặc hạn chế trong việc cung cấp hàng hóa hoặc dịch vụ trên nền tảng","Conditions and restrictions on providing goods or services","legal/tailieu/05-dieu-kien-han-che-cung-cap-dich-vu.pdf","legal/tailieu/05-dieu-kien-han-che-cung-cap-dich-vu-en.pdf","legal/tailieu/05-dieu-kien-han-che-cung-cap-dich-vu-vi-en.pdf"],
 ["Chính sách giao hàng, đổi trả và hoàn tiền / phương thức cung cấp, chấm dứt dịch vụ và hoàn tiền","Delivery, return and refund / service provision, termination and refund","legal/tailieu/06-giao-nhan-doi-tra-hoan-tien.pdf","legal/tailieu/06-giao-nhan-doi-tra-hoan-tien-en.pdf","legal/tailieu/06-giao-nhan-doi-tra-hoan-tien-vi-en.pdf"],
 ["Hình thức hỗ trợ trực tuyến","Online support","legal/tailieu/07-ho-tro-truc-tuyen.pdf","legal/tailieu/07-ho-tro-truc-tuyen-en.pdf","legal/tailieu/07-ho-tro-truc-tuyen-vi-en.pdf"],
 ["Tài liệu khác: Điều khoản sử dụng và quy chế hoạt động","Other: Terms of Use and operating rules","legal/terms-vi.pdf","legal/terms-en.pdf","legal/tailieu/08-terms-vi-en.pdf"]];
var UI={vi:{t:"Tài liệu",open:"Mở trong tab mới",dl:"Tải PDF (VI + EN)",pick:"Chọn tài liệu",back:"Về trang chủ",o:"Mở",site:"Play Hub"},en:{t:"Documents",open:"Open in new tab",dl:"Download PDF (VI + EN)",pick:"Choose a document",back:"Back to home",o:"Open",site:"Play Hub"}};
var de=document.documentElement,pick=document.getElementById("pick"),cur=0;
function lg(){return de.lang==="en"?"en":"vi"}
function paint(){
  var l=lg(),u=UI[l],k=l==="en"?1:0,fk=l==="en"?3:2;
  document.getElementById("ttl").textContent=u.t;
  document.querySelector(".back").setAttribute("aria-label",u.back);
  var o=document.getElementById("open");o.setAttribute("aria-label",u.open);o.lastChild.textContent=u.o;
  var d=document.getElementById("dl");d.setAttribute("aria-label",u.dl);d.lastChild.textContent=l==="en"?"Download PDF":"Tải PDF";d.title=u.dl;
  pick.setAttribute("aria-label",u.pick);
  pick.innerHTML=DOCS.map(function(x,i){return '<option value="'+i+'">'+(i+1)+'. '+x[k]+'</option>'}).join("");
  pick.value=cur;
  var f=DOCS[cur][fk];
  var v=document.getElementById("view");if(v.getAttribute("data-f")!==f){v.setAttribute("data-f",f);v.src=f+"#view=FitH"}
  var bi=DOCS[cur][4];o.href=f;d.href=bi;d.setAttribute("download",bi.split("/").pop());
  document.title=DOCS[cur][k]+" · "+u.site;
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.l===l))});
}
function show(i){cur=Math.max(0,Math.min(DOCS.length-1,i|0));paint();try{var q=new URLSearchParams(location.search);q.set("doc",cur+1);history.replaceState(null,"","?"+q)}catch(e){}}
pick.addEventListener("change",function(){show(pick.value)});
document.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){
  de.lang=b.dataset.l;try{localStorage.setItem("lang",b.dataset.l)}catch(e){}paint()})});
addEventListener("storage",function(e){if(e.key==="lang"&&(e.newValue==="vi"||e.newValue==="en")){de.lang=e.newValue;paint()}});
show((parseInt(new URLSearchParams(location.search).get("doc"),10)||1)-1);
</script>
</body>
</html>
