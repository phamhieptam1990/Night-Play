/* Cùng phong cách landing /hoc/: aurora, thẻ kính, gradient theo môn. Vào là học liền: câu đầu tiên hiện ngay. */
body{--s1:#0B6B4F;--s2:#0F8A66;--sg:#3DD6A0;--sx:#FFB020}

.aur i:nth-child(2){width:50vmax;height:50vmax;right:-15vmax;top:5vmax;background:var(--s2);opacity:.42;animation:f2 19s ease-in-out infinite alternate}
.aur i:nth-child(3){width:38vmax;height:38vmax;left:25%;bottom:-22vmax;background:var(--sx);opacity:.32;animation:f1 22s ease-in-out infinite alternate-reverse}
:root:not([data-theme=dark]) .aur i{opacity:.26}
.aur::after{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(1.5px 1.5px at 20px 30px,var(--ink) 50%,transparent 52%),radial-gradient(1.5px 1.5px at 110px 90px,var(--ink) 50%,transparent 52%),radial-gradient(1px 1px at 170px 20px,var(--ink) 50%,transparent 52%);background-size:200px 130px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
:root:not([data-theme=dark]) .aur::after{opacity:.1}
@keyframes f1{to{transform:translate(8vmax,6vmax) scale(1.15)}}

/* thanh trên */

.rev i{width:44px;height:5px;border-radius:3px;background:var(--ink2);opacity:.5}

@media (min-width:701px) and (min-height:431px){.top.tuck{max-height:80px;padding:10px 12px 4px 16px;opacity:1;overflow:visible;pointer-events:auto}body.tucked .rev{display:none}}

.prog{flex:none;display:flex;align-items:center;gap:8px}.prog .streak:empty{display:none}.q h1 em{text-shadow:none}
/* vào trang: thanh năng lượng hiện lần lượt từng đoạn, ô ⭐ nảy vào */
@keyframes dIn{from{opacity:0;transform:translateY(-10px) scaleX(.3)}to{opacity:1;transform:none}}
@keyframes sIn{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.15)}100%{opacity:1;transform:none}}

.prog.intro .star{animation:sIn .55s .45s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion:reduce){.prog.intro .dots i,.prog.intro .dots .rn,.prog.intro .star{animation:none}}.prog{width:100%}.prog .star{min-width:64px;justify-content:center}

.dots .rn{position:absolute;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;overflow:hidden;z-index:2;background:linear-gradient(135deg,var(--s1),var(--s2));border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);transition:left .6s cubic-bezier(.3,1.3,.4,1)}

.dots .rn img{position:absolute;height:auto;max-width:none;width:var(--iw);left:var(--il);top:var(--it)}

.streak{flex:none;font-weight:800;font-size:14px;min-width:3.5em;text-align:right;opacity:.9}
.mit{flex:none;display:flex;align-items:center;gap:10px}

.sbd{position:relative;overflow:hidden}.sbd img{position:absolute;width:175%;left:-37%;top:-10%}

.rmas{width:132px;height:132px;margin:0 auto -4px}.rmas svg{width:100%;height:100%;display:block}

.q{position:relative;flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:safe center;gap:10px;text-align:left;padding:22px;border-radius:30px;background:linear-gradient(145deg,color-mix(in srgb,var(--sg) 18%,var(--panel)),var(--panel));border:1.5px solid color-mix(in srgb,var(--sg) 45%,var(--line));box-shadow:0 18px 50px -14px color-mix(in srgb,var(--s2) 60%,transparent)}
.q::before{content:attr(data-ic);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(46vw,260px);line-height:1;opacity:.05;pointer-events:none;filter:saturate(1.4)}
.q small{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

.q h1,.q h1.mid,.q h1.long,.q h1.eq{text-align:center}   /* MỌI câu hỏi canh giữa ngang (và dọc: .q justify-content:safe center), kể cả câu dài và bảng nhiều dòng (GAME_RULES 0a-34) */
.q h1.eq{white-space:nowrap}
.qd.fld.txt{font-size:clamp(20px,5.8vw,28px);min-height:60px}.qd.fld.txt input.qi{text-align:center}.qk.qt1{grid-template-columns:1fr}.qk.qt1 .kb.go{grid-column:1}.sayb{min-height:64px;font-size:20px}.dpic{display:inline-block;font-size:44px;line-height:1.1;margin:2px 0 6px}
.lsn{display:inline-grid;place-items:center;width:84px;height:84px;margin:4px auto;border-radius:50%;border:2px solid #E59A00;font-size:40px;line-height:1;cursor:pointer;background:linear-gradient(135deg,#FFE08A,#FFB020);box-shadow:0 10px 24px -10px #E59A00}.lsn:active{transform:scale(.94)}   /* biểu thức toàn số/dấu (a + b ? c − d): luôn MỘT hàng, fitQ() tự co chữ cho vừa, không ngắt xuống hàng dưới */
.q h1.mid{font-size:clamp(26px,7.6vw,46px);line-height:1.15}
.q h1.long{font-size:clamp(20px,5.4vw,30px);line-height:1.4;letter-spacing:0;font-weight:700}.q h1{width:100%;text-wrap:pretty;color:var(--ink);text-shadow:0 1px 0 color-mix(in srgb,var(--bg) 60%,transparent)}
.ab.long{font-size:clamp(14px,3.9vw,18px);line-height:1.2}
.q h1 em.bl{display:inline-block;width:1.5em;height:.9em;vertical-align:-.1em;margin:0 .08em;border:.07em dashed color-mix(in srgb,var(--ink) 60%,transparent);border-radius:.22em;background:color-mix(in srgb,var(--ink) 12%,transparent)!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:transparent;-webkit-text-fill-color:transparent;overflow:hidden;text-indent:-9em;white-space:nowrap;box-sizing:border-box;animation:blp 1.6s ease-in-out infinite alternate}@keyframes blp{to{background-color:color-mix(in srgb,var(--ink) 24%,transparent)}}@media (prefers-reduced-motion:reduce){.q h1 em.bl{animation:none}}
.q h1 em{font-style:normal;background:linear-gradient(100deg,var(--sg),var(--sx));-webkit-background-clip:text;background-clip:text;color:transparent}

.q.pop{animation:pop .35s}
/* mỗi câu mới: thẻ nảy lên, nhãn môn trượt vào, câu hỏi hiện rõ dần từ dưới lên, loa nảy vào */
@keyframes qIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes qSp{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.15)}100%{opacity:1;transform:none}}
/* câu ngắn, chữ lớn (phép tính, một từ): đặt chính giữa bảng; câu dài vẫn canh trái từ trên xuống */
.q.short{justify-content:center;align-items:center;text-align:center;padding-top:16px}.q.short h1{text-align:center}

.qd.ph{opacity:.45}.qd.okk{border-color:#34D399}.qd.fld{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px}.qd.fld:focus-within{border-color:var(--sg);box-shadow:0 0 0 3px color-mix(in srgb,var(--sg) 25%,transparent)}.qd input.qi{flex:1;min-width:0;width:100%;align-self:stretch;min-height:48px;box-sizing:border-box;text-align:center;font:inherit;color:var(--ink);background:transparent;border:0;outline:0;padding:0;caret-color:var(--sg)}.qd input.qi::placeholder{color:var(--ink);opacity:.35}.qd .un{font-size:.5em;font-weight:800;opacity:.7;white-space:nowrap}.qd.okk input.qi{color:#059669}

.dragging{opacity:.3}

.qp .ab.tl,.qc .ab.tl,.qslot.fill{cursor:grab}

.ans[data-k=find] .ab,.ans[data-k=find] .ab.long{font-size:clamp(28px,9vw,40px);border-radius:18px}

.bln.long{font-size:15px}

@keyframes blnb{50%{transform:translateY(-12px)}}
.bln.popd{animation:blnp .45s ease-out forwards}@keyframes blnp{40%{transform:scale(1.35)}100%{transform:scale(1.7);opacity:0}}
.bln.no{animation:blnx .5s forwards;filter:saturate(.3)}@keyframes blnx{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}100%{opacity:.25;transform:translateY(18px) scale(.9)}}
.bln.hint{outline:4px solid #34D399;outline-offset:3px}

.nlw{position:relative;padding:0 16px;--steps:10}
.nlw::before{content:"";position:absolute;left:16px;right:16px;top:50%;height:14px;margin-top:-4px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px calc(100% / var(--steps)));opacity:.35;pointer-events:none}

.nlr::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:-14px;border-radius:50%;background:#fff;border:5px solid var(--sg);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.nlr::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid var(--sg)}
.nll{display:flex;justify-content:space-between;padding:0 8px;font-weight:800;font-size:14px;color:var(--ink2)}
.qdone{min-height:50px;font-size:24px}

.qclk .ck{stroke:var(--ink2)}.qclk .hh{stroke:var(--ink);stroke-width:5;stroke-linecap:round}.qclk .mh{stroke:var(--sg);stroke-width:3.2;stroke-linecap:round}.qclk .cc{fill:var(--ink)}
.qbins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbin{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-height:104px;padding:8px;border-radius:18px;border:2.5px dashed color-mix(in srgb,var(--sg) 60%,var(--line));background:color-mix(in srgb,var(--sg) 10%,transparent);color:var(--ink);text-align:center}
.qbin b{font-size:15px;font-weight:900}
.qbin.hot{background:color-mix(in srgb,var(--sg) 24%,transparent);border-style:solid}
.qz{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}

function fitQ(){

  while(n++ < 90 && over()){   /* hình (SVG) co trước, tối thiểu 44px; rồi mới tới chữ (tối thiểu 13px) */
    if(sv.length && sz > 44){ sz -= 4; sv.forEach(x => { x.style.width = sz + "px"; x.style.height = sz + "px"; }); }

}
const SRC = ["https://vbpl.moj.gov.vn/bogiaoducdaotao/Pages/vbpq-toanvan.aspx?ItemID=146721", "https://moet.gov.vn/content/vanban/Lists/VBPQ/Attachments/1453/vbhn-322018-202021-ttbgddt-trinh-ky-xt.pdf", "https://moet.gov.vn/content/tintuc/Lists/News/Attachments/8421/chuong-trinh-tong-the-ctgdpt-2018.pdf"];
const esc = x => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const SC2 = {toan:["#34D399","#0EA5E9"],tviet:["#FFB020","#FB5A7A"],tanh:["#60A5FA","#A78BFA"]};
function buildFooter(){
  const t = T[lang], en = lang === "en", pre = en ? "/en" : "", y = new Date().getFullYear();
  $("fc").textContent = "© " + y + " Học Vui · Play Hub";
  $("fi").textContent = t.fi; $("fi").setAttribute("aria-label", t.fiAria);
  const L = (h, n) => '<a href="' + h + '">' + esc(n) + '</a>';
  $("fl").innerHTML = L(pre + "/hoc/" + SLUG[subj] + "/#chuongtrinh", t.srcLink) + L("../privacy.html", t.pri) + L("../terms.html", t.terms) + L("mailto:support@nightplay.vn", t.contact);
  const subs = Object.keys(T.vi.sn).map(k => '<a href="' + pre + "/hoc/" + SLUG[k] + '/" style="--c1:' + SC2[k][0] + ";--c2:" + SC2[k][1] + '"><span class="hd"><img src="' + hd(k) + '" alt=""></span><span><b>' + esc(t.brand[k][0]) + "</b><small>" + esc(t.brand[k][1]) + "</small></span></a>").join("");
  const srcs = t.srcs.map((n, i) => '<li><a href="' + SRC[i] + '" target="_blank" rel="noopener noreferrer">' + esc(n) + "</a></li>").join("");
  $("infoBox").innerHTML = '<button class="x" id="ix" type="button" aria-label="' + esc(t.close) + '">✕</button><div class="ib2"><span class="lg" aria-hidden="true">✨</span><div><b id="iT">Học Vui</b><span>' + esc(t.tagline) + '</span></div></div>' +
    "<h4>" + esc(t.iSubj) + '</h4><div class="isj">' + subs + "</div>" +
    "<h4>" + esc(t.iPar) + '</h4><ul class="il">' + "<li>" + L(pre + "/hoc/" + SLUG[subj] + "/#chuongtrinh", t.iPath) + "</li><li>" + L("../privacy.html", t.pri) + "</li><li>" + L("../terms.html", t.terms) + "</li><li>" + L("mailto:support@nightplay.vn", t.contact + ": support@nightplay.vn") + "</li><li>" + L("../play/index.html", t.hub) + "</li>" + (DEV ? "<li>" + L("mascot-review.html", "🐾 Linh vật (duyệt)") + "</li>" : "") + "</ul>" +
    "<h4>" + esc(t.iSrc) + '</h4><ul class="il src">' + srcs + "</ul>" +
    '<p class="cp">' + esc(t.iData) + "</p>";
  $("ix").onclick = closeInfo;
}

function closeInfo(){ $("info").hidden = true; $("fi").focus(); }
let ps = subj, pg = grade;
const SC = {toan:["#34D399","#0EA5E9"],tviet:["#FFB020","#FB5A7A"],tanh:["#60A5FA","#A78BFA"]};
function sheet(){
  const t = T[lang]; ps = subj; pg = grade; $("shT").textContent = t.shT; $("shS").textContent = t.shS; $("shG").textContent = t.shG; $("go").setAttribute("aria-label", t.go);
  const keys = Object.keys(t.sn), S = $("pS"); S.textContent = "";
  keys.forEach(k => { const b = document.createElement("button"); b.type = "button"; b.innerHTML = '<span class="hd"><img src="' + hd(k) + '" alt=""></span>'; b.style.setProperty("--c1", SC[k][0]); b.style.setProperty("--c2", SC[k][1]); b.setAttribute("aria-label", t.sn[k]); b.setAttribute("aria-pressed", String(k === ps));
    b.onclick = () => { ps = k; document.body.dataset.subj = k; Array.from(S.children).forEach((x, i) => x.setAttribute("aria-pressed", String(keys[i] === k))); }; S.appendChild(b); });
  const G = $("pG"); G.textContent = ""; for(let i = 1; i <= 5; i++){ const b = document.createElement("button"); b.type = "button"; b.textContent = i; b.setAttribute("aria-pressed", String(i === pg)); b.setAttribute("aria-label", t.grade + " " + i); b.onclick = () => { pg = i; Array.from(G.children).forEach((x, j) => x.setAttribute("aria-pressed", String(j + 1 === i))); }; G.appendChild(b); }
  $("res").hidden = true; $("sheet").hidden = false; $("go").focus();
}
function speak(){
  if(!("speechSynthesis" in window)) return; const b = bank[cur]; if(!b) return;
  const vi = lang === "vi", map = vi ? {"×":" nhân ","+":" cộng ","−":" trừ ","÷":" chia ","=":" bằng ","%":" phần trăm "} : {"×":" times ","+":" plus ","−":" minus ","÷":" divided by ","=":" equals ","%":" percent "};
  /* ĐỌC ĐỀ GỌN: chỉ đọc CÂU HỎI (phần trước hàng hình đầu tiên); emoji trong câu hỏi đổi thành tên đồ vật MỘT lần ("Có mấy 🍇?" → "Có mấy chùm nho?"),
     không bao giờ để máy đọc từng hình ("chùm nho, chùm nho, chùm nho, dâu tây…"). Hình nằm ở hàng đếm/bảng dưới câu hỏi thì bỏ qua khi đọc. */
  const EMO = /\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu;
  const nameE = e => (window.LearnTypes && LearnTypes.nameOf && LearnTypes.nameOf(e, vi ? "vi" : "en")) || "";
  const cleanSpeak = html => { let t = String(html).split(/<br\s*\/?>/i).map(x => x.replace(/<[^>]+>/g, "")).filter(x => x.trim() && (/\p{L}/u.test(x.replace(EMO, "")) || !EMO.test((EMO.lastIndex = 0, x)))).join(". ");   /* bỏ các dòng chỉ có hình (hàng đếm), giữ dòng có chữ (bảng, đề nhiều dòng) */ const seen = {}; t = t.replace(EMO, e => { if(seen[e]) return ""; seen[e] = 1; return nameE(e) ? " " + nameE(e) + " " : " "; }); return t.replace(/\s+/g, " ").trim(); };
  let txt = b.speak != null ? String(b.speak).replace(EMO, " ").replace(/\s+/g, " ").trim() : cleanSpeak(b.q).replace(/[×+−÷=%]/g, c => map[c]).replace(/\?/g, " ")   /* dấu ? không đọc thành chữ */.replace(/_+/g, vi ? " chỗ trống " : " blank ");
  if(b.speak == null && subj === "tanh" && grade <= 2) txt = vi ? "Đây là gì?" : "What is this?";
  if(window.Voice){ Voice.say(txt, subj, b.speakLang || (subj === "tanh" ? "en" : (vi ? "vi" : "en")), { fail: () => LM.say(T[lang].noVoice) }); return; }   /* giọng chung: tệp thu sẵn nếu có, không thì giọng máy tốt nhất + cao độ riêng từng nhân vật (learn/voice.js) */
  try{ const lg = b.speakLang ? (b.speakLang === "vi" ? "vi-VN" : "en-US") : (subj === "tanh" ? "en-US" : (vi ? "vi-VN" : "en-US")), busy = speechSynthesis.speaking || speechSynthesis.pending; if(busy) speechSynthesis.cancel();
    /* nếu đang đọc dở thì hủy rồi chờ một nhịp (Chrome bỏ speak() ngay sau cancel()); nếu không thì đọc NGAY trong cú chạm (Safari chỉ cho phát trong cú chạm) */
    const go = () => { const u = new SpeechSynthesisUtterance(txt); u.lang = lg; u.rate = .9; let ok = false;
      const vs = speechSynthesis.getVoices(), vo = vs.find(x => x.lang === lg) || vs.find(x => x.lang.slice(0, 2) === lg.slice(0, 2)); if(vo) u.voice = vo;
      u.onstart = () => { ok = true; }; u.onerror = e => { if(e.error !== "canceled" && e.error !== "interrupted") LM.say(T[lang].noVoice); };
      if(speechSynthesis.paused) speechSynthesis.resume(); speechSynthesis.speak(u);
      /* 2 giây mà chưa bắt đầu đọc = máy chưa có giọng / bị tắt tiếng: báo cho bé và phụ huynh biết thay vì im lặng */
      setTimeout(() => { if(!ok && !speechSynthesis.speaking) LM.say(T[lang].noVoice); }, 2000); };
    clearTimeout(window.__spT); if(busy) window.__spT = setTimeout(go, 70); else go(); }catch(e){}
}
$("pick").onclick = sheet; $("change").onclick = sheet;
$("go").onclick = () => { if(subj !== ps || grade !== pg) TOPIC_ID = null; subj = ps; grade = pg; if(window.LearnSlot){ LearnSlot.set(grade, subj); if(window.Farm) Farm.resetCache(); } ls("learn:subj", subj); ls("learn:grade", grade); chrome(); start(); };

LearnLimit.guard({ busy: () => $("res").hidden && $("sheet").hidden, copy: () => { const u = PARENT_COPY.UI[lang]; return { t: u.lock.t, p: u.lock.p, hub: u.lock.hub, parent: u.lock.parent, hubUrl: hubUrl(), parentUrl: "parent/?lang=" + lang }; } });

document.addEventListener("pointerdown", e => { GESTURE = true; if(!$("mnu").hidden && !e.target.closest("#mnu,#mn")) closeMenu(); }, true);
stars = +ls("learn:stars") || 0;
LM.bind({ box: $("masBox"), bubble: $("say"), base: "../shared/art/learn/", lang, idleMs: 15000, onTap: speak });
$("mas").onclick = () => LM.poke();
/* dùng bàn phím: Tab tới linh vật là nghe đọc câu hỏi (Enter/Space để nghe lại) */
$("mas").addEventListener("focus", () => { let v = false; try{ v = $("mas").matches(":focus-visible"); }catch(e){} if(v) speak(); });
/* tự thu thanh trên sau 3 giây không chạm; chạm mép trên, vuốt xuống, hoặc dùng bàn phím trong thanh thì hiện lại */
document.querySelector(".prog").classList.add("intro"); setTimeout(() => document.querySelector(".prog").classList.remove("intro"), 1400);
(function(){
  const top = document.querySelector("header.top"), rev = $("rev"); if(!top || !rev) return; let T = 0, y0 = null;
  const busy = () => !$("mnu").hidden || !!document.querySelector(".ov:not([hidden])") || top.contains(document.activeElement);
  const hide = () => { if(busy()){ arm(); return; } top.classList.add("tuck"); document.body.classList.add("tucked"); };
  const show = () => { top.classList.remove("tuck"); document.body.classList.remove("tucked"); arm(); };
  function arm(){ clearTimeout(T); T = setTimeout(hide, 3000); }
  rev.addEventListener("click", show);
  addEventListener("pointerdown", e => { if(top.classList.contains("tuck") && e.clientY < 36) show(); else if(!top.classList.contains("tuck")) arm(); }, { passive: true });
  addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchmove", e => { if(y0 != null && top.classList.contains("tuck") && e.touches[0].clientY - y0 > 28){ y0 = null; show(); } }, { passive: true });
  addEventListener("wheel", e => { if(e.deltaY < 0 && top.classList.contains("tuck")) show(); }, { passive: true });
  top.addEventListener("focusin", show);
  arm();
})();
["pointerdown", "keydown"].forEach(e => document.addEventListener(e, () => LM.wake(), true));
if(TRIP_ID && window.Story){ fetch("content/trips/" + TRIP_ID + ".json").then(r => r.json()).then(t => { TRIP = t; subj = t.subject; chrome(); start(); }).catch(() => { chrome(); start(); }); }
else { chrome(); start(); }
