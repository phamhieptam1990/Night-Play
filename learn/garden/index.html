<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>Vườn Học Vui</title>
<!-- Trang vườn VIẾT TAY (không sinh). CSS và JS KHÔNG khai ở đây: danh sách + thứ tự nằm ở garden-layout.js (STYLES, SCRIPTS, START).
     Thêm tính năng = thêm css/NN-ten.css và/hoặc garden-ten.js rồi thêm tên vào garden-layout.js. Dữ liệu cây/ô: shared/art/garden/garden-data.js (SINH bởi scripts/learn/gen-scene-art.js). -->
<style>
/* chặn phóng to NGUYÊN TRANG bằng hai ngón (làm nút ＋ － trôi mất khỏi màn hình và kẹt không thu nhỏ được); vườn tự xử lý kẹp hai ngón bằng setZoom */
html,body,.fsw{touch-action:pan-x pan-y}
/* chuyển qua lại giữa các vườn (lớp × môn) */
.gsw{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 52px);transform:translateX(-50%);z-index:31;display:flex;align-items:center;gap:4px;padding:4px;border-radius:99px;background:rgba(22,17,48,.74);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.gsw a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:22px;text-decoration:none;color:#fff;font:800 14px/1 system-ui,sans-serif;padding:0 6px;opacity:.7}
.gsw a img{width:36px;height:36px;object-fit:contain}
.gsw a[aria-current=true]{opacity:1;background:linear-gradient(135deg,var(--a,#34D399),var(--b,#0EA5E9));box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.gsw a[aria-current=true] span{margin:0 8px 0 2px}.gsw span{display:none}
.gsw .gsn{display:flex;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid rgba(255,255,255,.25)}.gsw .gnb{position:relative;min-width:34px;height:44px;border-radius:18px;font-size:17px;font-weight:900;color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;opacity:.8}.gsw .gnb[aria-current=true]{opacity:1;background:#fff;color:#1b1340}.gsw .gnb i{position:absolute;right:1px;top:1px;font-style:normal;font-size:10px;color:#4ade80}.gsw .gnb.lk{opacity:.35;font-size:14px}
@media (max-width:400px){.gsw .gnb{min-width:28px;font-size:15px}.gsw .gsn{padding-right:3px;margin-right:1px}}
@media (max-width:400px){.gsw{max-width:calc(100vw - 12px);gap:0;padding:3px}.gsw a{min-width:38px;padding:0 2px}.gsw a img{width:32px;height:32px}}
@media (max-height:430px){.gsw{top:6px;left:auto;right:64px;transform:none}}
</style>

<script>
(function(){
var S=window.LearnSlot; if(!S) return;
var p=S.parts(), g=p?p.grade:(+(function(){try{return S.raw.get("learn:grade")}catch(e){return 1}})()||1), cur=p?p.subj:"";
if(!(g>=1&&g<=5)) g=1;
var M={toan:["math","Mochi","Toán","#34D399","#0EA5E9"],tviet:["vietnamese","Mầm","Tiếng Việt","#FFB020","#FB5A7A"],tanh:["english","Bibi","Tiếng Anh","#60A5FA","#A78BFA"]};
function u(gr,sj){return "index.html?grade="+gr+"&subj="+sj}
var bar=document.createElement("nav"); bar.className="gsw"; bar.id="gsw"; bar.setAttribute("aria-label","Chuyển vườn");
var cur0=cur,h="";
var P=window.LearnPath, lg=+(function(){try{return S.raw.get("learn:grade")}catch(e){return 1}})()||1;
function doneG(gr,sj){try{var ts=P.topics(sj,gr);return ts.length>0&&ts.every(function(t){return P.completed(gr,sj,t.id)})}catch(e){return false}}
h+='<span class="gsn" role="group" aria-label="Chọn lớp">';
for(var gi=1;gi<=5;gi++){var tg=cur||"toan",on=gi===g,ok=on||gi===lg||doneG(gi,tg);
  h+=ok?'<a class="gnb" href="'+u(gi,tg)+'" aria-label="Lớp '+gi+(doneG(gi,tg)?" đã học xong":"")+'"'+(on?' aria-current="true"':'')+'>'+gi+(doneG(gi,tg)&&!on?'<i>✓</i>':'')+'</a>':'';}   /* lớp chưa học xong và không phải lớp đang học: ẩn (chỉ hiện lớp đã active) */
h+='</span>';
Object.keys(M).forEach(function(k){var m=M[k];h+='<a href="'+u(g,k)+'" title="'+m[2]+'" aria-label="Vườn '+m[2]+'"'+(k===cur?' aria-current="true" style="--a:'+m[3]+';--b:'+m[4]+'"':"")+'><img src="../../shared/art/learn/'+m[0]+'/'+m[0]+'_head.svg" alt=""><span>'+m[2]+'</span></a>'});
bar.innerHTML=h; document.body.appendChild(bar);
})();
</script>
