location.replace((sj==="tviet"?"../vuon-thu/index.html?grade=":"../khu-cho/index.html?grade=")+g)}catch(e){}})();</script><script src="../js/page-loading.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>Vườn Học Vui</title>

<script>
/* Chọn môn + lớp: dùng chung bảng của Vườn Thú / Khu Chợ (learn/grade-bar.js): MỘT nút linh vật góc trái, bấm xổ 3 linh vật môn + các lớp đã mở. */
(function(){
var S=window.LearnSlot, B=window.LearnGradeBar; if(!S||!B) return;
var p=S.parts(), lg=+(function(){try{return S.raw.get("learn:grade")}catch(e){return 1}})()||1, g=p?p.grade:lg, cur=p&&p.subj?p.subj:"toan", P=window.LearnPath, top=Math.max(g,lg,1), gi;
if(!(g>=1&&g<=5)) g=1;
function doneG(gr){try{var ts=P.topics(cur,gr);return ts.length>0&&ts.every(function(t){return P.completed(gr,cur,t.id)})}catch(e){return false}}
for(gi=1;gi<=5;gi++) if(doneG(gi)) top=Math.max(top,gi);
var head=cur==="tviet"?"vietnamese":cur==="tanh"?"english":"math";
B.mount({ side:"left", persist:false, subject:cur, max:Math.min(5,top), get:function(){return g}, icon:function(){return "../../shared/art/learn/"+head+"/"+head+"_head.svg"},
  onChange:function(n){ location.href="index.html?grade="+n+"&subj="+cur; } });
})();
</script>
