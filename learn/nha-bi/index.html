<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Nhà của thú cưng</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/worldkit/world-kit.css">
<link rel="stylesheet" href="css/10-shell.css">
<link rel="stylesheet" href="css/30-mg.css">
<link rel="stylesheet" href="css/40-room.css">
<link rel="stylesheet" href="css/50-fx.css">
<link rel="stylesheet" href="css/60-zones.css">
<link rel="stylesheet" href="css/70-ui.css">
<link rel="stylesheet" href="css/80-learn.css">
<link rel="stylesheet" href="css/90-collection.css">
<link rel="stylesheet" href="css/95-evolve.css">
</head>
<body>
<div class="app">
  <div class="play" id="play">
      <section class="scr" id="room">
        <div class="rm" id="rm" data-zone="living">
          <div class="rbox">
            <div class="ce"></div>
            <div class="wb"><div class="bunt"></div><div class="props" id="props"></div></div>
            <div class="wl"></div><div class="wr"></div><div class="fl"><div class="shine"></div></div>
          </div>
          <div class="pw" id="pw"><div class="in"><img id="pet" alt="">
            <img class="evo" id="evo" alt="" hidden><img class="mud" alt=""><img class="fit" id="fit" alt="" hidden>
            <div class="foam" id="foam"></div></div><img class="want" id="want" alt="" hidden></div>
          <div class="say" id="say"></div><div class="dark" id="dark"></div><div class="rstats" id="rStats"></div>
        </div>
        <div class="dock" id="dock"><div class="tray" id="tray"></div><div class="zbar" id="zbar" role="tablist"></div></div>
      </section>
      <div class="ov" id="ovEnd" hidden>
        <h2 id="enH"></h2><div class="ris" id="enR"></div>
        <div class="row"><button class="ib2" id="enNo" data-nic="close" type="button" aria-label="Xong"></button>
<button class="go" id="enGo" data-nic="play" type="button" aria-label="Chơi lại"></button></div>
      </div>
      <div class="mgh" id="mgh" hidden><span class="mgs-n"><img src="art/sao.svg" alt=""><b id="mgScore">0</b></span>
<div class="mgtb"><i id="mgTime"></i></div><span class="mgc" id="mgCombo"></span></div><div class="cdn" id="mgCd" hidden></div>
      <div class="toast" id="toast" role="status"></div>
  </div>
</div>
<script src="../../shared/worldkit/world-kit.js"></script>
<script src="../gifts.js"></script>
<script src="js/data/pet-g1.js"></script><script src="js/data/pet-g2.js"></script><script src="js/data/pet-g3.js"></script><script src="js/data/pet-g4.js"></script><script src="js/data/pet-g5.js"></script>
<script src="js/data/world.js"></script><script src="js/data/world-scenes.js"></script>
<script src="js/store.js"></script><script src="js/sfx.js"></script><script src="js/ui.js"></script><script src="js/icons.js"></script><script src="js/drag.js"></script>
<script src="js/room.js"></script><script src="js/zones.js"></script><script src="js/rewards.js"></script>
<script src="js/care-bath.js"></script><script src="js/care-feed.js"></script><script src="js/care-play.js"></script><script src="js/care-sleep.js"></script>
<script src="js/care-yard.js"></script><script src="js/mg.js"></script><script src="js/mg-stars.js"></script><script src="js/mg-ball.js"></script>
<script src="js/habit.js"></script><script src="js/bag.js"></script><script src="js/hud.js"></script>
<script src="js/evolve.js"></script><script src="js/lesson-gifts.js"></script><script src="js/collection.js"></script><script src="js/app.js"></script>
</body>
</html>
