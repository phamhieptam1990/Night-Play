    <section class="sec" id="s-set" aria-labelledby="h2s"><h2 id="h2s"></h2><div class="card" id="set"></div></section>
    <section class="sec" id="s-plus" aria-labelledby="h2p" hidden></section>
    </div>
    <a class="btn ghost" id="exit" href="/learn/index.html"></a>
    <p class="priv" id="priv"></p>
