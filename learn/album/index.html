<!doctype html>
<html lang="vi" data-app="hub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Học Vui: Bộ sưu tập</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" sizes="any" href="/shared/favicon.svg">
<script>try{var t=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");</script>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/theme.css">
<link rel="stylesheet" href="../content/buddy.css">
<style>
/* BỘ SƯU TẬP BẠN SỐ & BẠN CHỮ. Bé nhìn hình là chính: ít chữ. Bạn đã gặp = quái vật đủ màu; bạn chưa gặp = bóng mờ có dấu ?. Popup nền màu, chữ sáng (GAME_RULES 0a-33). */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;font-family:var(--font,Inter,system-ui,sans-serif);background:radial-gradient(120% 60% at 50% 0,color-mix(in srgb,#8B5CFF 22%,transparent),transparent 60%),var(--bg);color:var(--ink)}
button,a{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.ib{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;font-size:22px;font-weight:800;text-decoration:none;color:#fff;background:linear-gradient(150deg,#3B4A63,#1E293B);border:1.5px solid rgba(255,255,255,.2)}
.bar h1{flex:1;min-width:0;margin:0;font-size:clamp(19px,5vw,24px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{flex:none;min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 16px;border-radius:99px;font-weight:900;font-size:18px;color:#4a2c00;background:linear-gradient(135deg,#FFE08A,#FFB020);border:2px solid #E59A00}
.wrap{max-width:760px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.pbar{height:12px;border-radius:99px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;margin:4px 0 18px}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#34D399,#FFB020,#FB5A7A);transition:width .6s}
h2{margin:18px 0 10px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
h2 small{font-size:15px;font-weight:800;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:12px 6px 10px;border-radius:24px;border:1.5px solid color-mix(in srgb,var(--bc) 55%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--bc) 32%,var(--panel)),var(--panel));color:var(--ink);text-align:center}
.card .nm{font-weight:900;font-size:14px;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.card:active{transform:scale(.97)}
.card.lock{background:color-mix(in srgb,var(--ink) 6%,var(--panel));border:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.card.lock .bd{opacity:.2}
.card.lock .bd-eyes,.card.lock .bd-mouth,.card.lock .bd-obj{display:none}
.card.lock::after{content:"?";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:46px;font-weight:900;color:color-mix(in srgb,var(--ink) 55%,transparent)}
.card.lock .nm{visibility:hidden}
.card.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card.new::before{content:"✨";position:absolute;right:8px;top:6px;font-size:20px}
/* popup xem bạn: nền màu + chữ sáng, nằm trọn trong màn hình */
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,6,30,.62)}
.pop{position:relative;width:min(100%,420px);max-height:calc(100dvh - 32px);overflow:auto;padding:22px 18px 18px;border-radius:30px;text-align:center;color:#fff;background:linear-gradient(155deg,#5B3FD1,#241659);border:2px solid color-mix(in srgb,var(--bc) 70%,#fff);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pop .big{display:flex;justify-content:center;margin:6px 0 4px}
.pop h3{margin:6px 0 6px;font-size:24px;font-weight:900}
.pop p{margin:0 auto 14px;max-width:320px;font-size:17px;line-height:1.4;font-weight:700;color:rgba(255,255,255,.92)}
.pop .row{display:flex;justify-content:center;gap:12px}
.pop .btn{min-width:64px;min-height:56px;padding:0 22px;border-radius:99px;border:0;font-size:26px;font-weight:900;color:#4a2c00;background:linear-gradient(135deg,#FFE08A,#FFB020);box-shadow:0 6px 0 #E59A00}
.pop .x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:0;font-size:20px;font-weight:900;color:#fff;background:rgba(255,255,255,.18)}
.empty{margin:30px auto;max-width:360px;text-align:center;font-size:56px}
:focus-visible{outline:3px solid #FFB020;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card.shake{animation:none}.pbar i{transition:none}}
</style>
</head>
<body>
<header class="top" id="top"><div class="bar"><a class="ib" id="back" href="../me/index.html" aria-label="Quay lại">←</a><h1 id="ttl">Bộ sưu tập</h1><span class="cnt" id="cnt" aria-live="polite">0/0</span></div></header>
<main class="wrap">
  <div class="pbar" aria-hidden="true"><i id="pb"></i></div>
  <h2 id="hn">🔢 <span>Bạn Số</span> <small id="cn"></small></h2>
  <div class="grid" id="gn"></div>
  <h2 id="hc">🔤 <span>Bạn Chữ</span> <small id="cc"></small></h2>
  <div class="grid" id="gc"></div>
</main>
<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="pn"><div class="pop" id="pop"></div></div>
<script src="../content/buddies.js"></script>
<script src="../buddy.js"></script>
<script src="../album.js"></script>
<script src="../voice.js"></script>
<script>
const $=id=>document.getElementById(id), B=window.LEARN_BUDDIES||{}, esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q=new URLSearchParams(location.search); const from=q.get("from"); if(from==="lop"){ $("back").href="../index.html"; }
const seen=(()=>{try{return +localStorage.getItem("learn:albumSeen")||0}catch(e){return 0}})();
function draw(){
  const got=Album.all(), keys=Object.keys(B), nums=keys.filter(k=>/^\d+$/.test(k)), lets=keys.filter(k=>!/^\d+$/.test(k));
  const cNum=nums.filter(k=>got[k]).length, cLet=lets.filter(k=>got[k]).length, all=cNum+cLet;
  $("cnt").textContent="📖 "+all+"/"+keys.length; $("pb").style.width=Math.round(all/Math.max(1,keys.length)*100)+"%";
  $("cn").textContent=cNum+"/"+nums.length; $("cc").textContent=cLet+"/"+lets.length;
  const mk=(k,host)=>{const d=B[k],has=!!got[k],b=document.createElement("button");b.type="button";b.className="card"+(has?"":" lock")+(has&&got[k].t>seen&&seen?" new":"");b.style.setProperty("--bc",d.c);
    b.setAttribute("aria-label",has?d.name:"Bạn chưa gặp");b.innerHTML=LearnBuddy.html(k,{size:78,obj:false})+'<span class="nm">'+esc(d.name)+"</span>";
    b.onclick=()=>{ if(has) openBuddy(k); else { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); } }; host.appendChild(b);};
  $("gn").textContent=""; $("gc").textContent=""; nums.forEach(k=>mk(k,$("gn"))); lets.forEach(k=>mk(k,$("gc")));
  $("hn").hidden=!nums.length; $("gn").hidden=!nums.length; $("hc").hidden=!lets.length; $("gc").hidden=!lets.length;
}
let lastFocus=null;
function openBuddy(k){
  const d=B[k]; lastFocus=document.activeElement; const pop=$("pop"); pop.style.setProperty("--bc",d.c);
  pop.innerHTML='<button class="x" id="px" type="button" aria-label="Đóng">✕</button><div class="big">'+LearnBuddy.html(k,{size:170})+'</div><h3 id="pn">'+esc(d.name)+"</h3><p>"+esc(d.rhyme)+'</p><div class="row"><button class="btn" id="ps" type="button" aria-label="Nghe">🔊</button></div>';
  $("ov").hidden=false; $("px").onclick=closeBuddy; $("ps").onclick=()=>{ if(window.Voice) Voice.say(d.say+". "+d.rhyme,"narr","vi",{profile:"lesson"}); }; $("px").focus();
  const bd=pop.querySelector(".bd"); LearnBuddy.jump(bd); LearnBuddy.talk(bd,1800); if(window.Voice) Voice.say(d.say+". "+d.rhyme,"narr","vi",{profile:"lesson"});
}
function closeBuddy(){ $("ov").hidden=true; if(window.Voice) Voice.stop(); if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
$("ov").addEventListener("click",e=>{ if(e.target===$("ov")) closeBuddy(); });
addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("ov").hidden) closeBuddy(); });
draw(); try{ localStorage.setItem("learn:albumSeen",String(Date.now())); }catch(e){}
</script>
<script src="../../shared/offline.js" defer></script>
<script src="../../shared/updated.js"></script>
</body>
</html>
