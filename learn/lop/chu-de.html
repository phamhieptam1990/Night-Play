<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học Vui · Chi tiết chủ đề</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" sizes="any" href="/shared/favicon.svg">
<script>try{var t=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");</script>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
body{--k1:#34D399;--k2:#0EA5E9;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a,button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ib{flex:none;min-width:48px;height:48px;border-radius:24px;display:grid;place-items:center;background:rgba(22,17,48,.72);color:#fff;border:1px solid rgba(255,255,255,.2);text-decoration:none;font-weight:800;font-size:22px;padding:0 12px}
.bar b{flex:1;min-width:0;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--panel);font-weight:800;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px 16px 60px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--k1) 50%,var(--panel)),color-mix(in srgb,var(--k2) 40%,var(--panel)));border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.hero .big{flex:none;font-size:clamp(48px,14vw,76px);line-height:1;letter-spacing:6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.hero .mas{flex:none;width:clamp(60px,16vw,92px);height:clamp(60px,16vw,92px)}.hero .mas img{width:100%;height:100%;object-fit:contain}
.hero h1{margin:0;font-size:clamp(22px,6vw,32px);font-weight:900;line-height:1.15}
.hero p{margin:4px 0 0;font-weight:700;color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:800;background:var(--panel);border:1px solid var(--line)}
.chip.g{background:color-mix(in srgb,#16a34a 22%,var(--panel))}.chip.a{background:color-mix(in srgb,#F59E0B 24%,var(--panel))}
section{margin:22px 0 0}
h2{margin:0 0 8px;font-size:clamp(18px,4.8vw,22px);font-weight:900}
h2 small{font-weight:700;color:var(--muted);font-size:13px;margin-left:6px}
.card{padding:14px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
ul.l{margin:0;padding-left:20px}ul.l li{margin:4px 0}
.say{font-weight:800}
.q{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.q:first-child{border-top:0}
.q .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;color:#0b1020;background:linear-gradient(135deg,var(--k1),var(--k2))}
.q .b{min-width:0}.q .k{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.q .t{font-weight:800}.q .o{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:3px 10px;border-radius:10px;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--line) 60%,transparent)}.opt.ok{background:#16a34a;color:#fff}
.note{margin-top:4px;font-size:14px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{padding:10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center}.stats b{display:block;font-size:22px;font-weight:900}.stats span{font-size:12.5px;font-weight:700;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{min-height:52px;padding:0 22px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;text-decoration:none;color:#0b1020;background:linear-gradient(90deg,var(--k1),var(--k2))}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.src{margin-top:26px;font-size:13px;color:var(--muted)}
@media (max-width:560px){.hero{flex-direction:column;align-items:flex-start;gap:8px}}
@media print{.bar,.cta{display:none}body{background:#fff;color:#000}.hero,.card,.stats div{box-shadow:none}}
</style>
</head>
<body>
<div class="bar"><a class="ib" id="back" href="index.html" aria-label="Quay lại">←</a><b id="ttl">Chi tiết chủ đề</b><button class="pr" id="pr" type="button">🖨️ In</button></div>
<main id="m"></main>
<script src="../content/curriculum.js"></script>
<script src="../content/teasers.js"></script>
<script src="../content/parent-copy.js"></script>
<script src="../content/bank.js"></script>
<script src="../lang-skills.js"></script>
<script src="../engine.js"></script>
<script src="../path.js"></script>
<script>window.LearnLessons={reg:function(o){window.LearnLessons.cur=o;window.dispatchEvent(new Event("lesson"))}};</script>
<script src="../content/lessons/index.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id), P=window.LearnPath;
const q=new URLSearchParams(location.search), grade=+q.get("grade"), subj=q.get("subj"), topic=q.get("topic");
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
let lang=q.get("lang")||ls("lang"); if(lang!=="en") lang="vi";
const MAS={toan:["math","Mochi","#34D399","#0EA5E9","Toán"],tviet:["vietnamese","Mầm","#FFB020","#FB5A7A","Tiếng Việt"],tanh:["english","Bibi","#60A5FA","#A78BFA","Tiếng Anh"]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KIND={game:"Trò chơi",say:"Học",tapcount:"Chạm đếm",merge:"Gộp lại",take:"Bớt đi",choose:"Câu hỏi",sum:"Tóm tắt"};
if(!(grade>=1&&grade<=5)||!MAS[subj]||!topic){location.replace("index.html");return}
const M=MAS[subj]; document.body.style.setProperty("--k1",M[2]); document.body.style.setProperty("--k2",M[3]);
$("back").href="index.html?"+new URLSearchParams({grade,subj,lang}).toString()+"#s-"+subj;
$("pr").onclick=()=>window.print();
const t=P.topics(subj,grade).find(x=>x.id===topic);
if(!t){location.replace("index.html");return}
const TE=(window.LEARN_TEASERS||{})[topic]||["📚",""];
const hasL=P.hasLesson(topic), skills=(window.LearnEngine?LearnEngine.topicSkills(subj,grade,topic):[]);
const rec=P.get(grade,subj,topic), st=P.status(subj,grade,topic);
document.title="Học Vui · "+t.name+" · Lớp "+grade; $("ttl").textContent=t.name;
const testUrl="../index.html?"+new URLSearchParams({grade,subj,topic,lang}).toString(), learnUrl="bai.html?"+new URLSearchParams({grade,subj,topic,lang}).toString();
const SK=(window.PARENT_COPY&&PARENT_COPY.SKILL)||{};
function render(L){
  let h='';
  h+='<div class="hero"><span class="big" aria-hidden="true">'+esc(TE[0])+'</span><div><h1>'+esc(t.name)+'</h1><p>'+esc(M[4])+' · Lớp '+grade+' · '+esc(t.tag||"")+'</p></div></div>';
  h+='<div class="meta"><span class="chip '+(hasL?"g":"a")+'">'+(hasL?"📖 Đã có bài học":"Bài học đang soạn")+'</span>'+(skills.length?'<span class="chip">📝 Có bài kiểm tra</span>':'<span class="chip a">Bài kiểm tra đang soạn</span>')+'<span class="chip">Linh vật: '+esc(M[1])+'</span></div>';
  if(TE[1]) h+='<section><h2>🤔 Câu hỏi gợi mở cho bé</h2><div class="card say">'+esc(TE[1])+'</div></section>';
  h+='<section><h2>Bé sẽ học gì?<small>theo chương trình GDPT 2018</small></h2><div class="card"><ul class="l">'+(t.sub||[]).map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div></section>';
  if(L){
    const n=L.screens.length, m=L.tryit.length, mins=Math.max(3,Math.round((n*35+m*30)/60));
    h+='<section><h2>Bài học trong ứng dụng<small>'+n+' màn học · '+m+' câu thử cùng · khoảng '+mins+' phút</small></h2><div class="card">';
    L.screens.forEach((s,i)=>{
      let body='<div class="t">'+esc(s.t)+'</div>';
      if(s.art) body+='<div class="note">Hình: '+esc(s.art.replace(/\n/g," "))+'</div>';
      if(s.shapes) body+='<div class="note">Hình học: '+s.shapes.map(x=>({circle:"hình tròn",square:"hình vuông",triangle:"hình tam giác",rect:"hình chữ nhật"}[x]||x)).join(", ")+'</div>';
      if(s.en) body+='<div class="note">Từ tiếng Anh (chạm để nghe): '+s.en.map(esc).join(" · ")+'</div>';
      if(s.chips) body+='<div class="note">Chạm để nghe: '+s.chips.map(c=>esc(c[0])+" ("+esc(c[1])+")").join(" · ")+'</div>';
      if(s.k==="game") body+='<div class="note">'+s.rounds.length+' lượt chơi, bé nghe đề rồi chạm ô đúng (không cần đọc):</div><ul class="l">'+s.rounds.map(r=>'<li>'+esc(r.say)+(r.art?' '+esc(r.art):'')+' → <b>'+esc(r.opts[r.ok])+'</b> (ô khác: '+r.opts.filter((_,j)=>j!==r.ok).map(esc).join(', ')+')</li>').join('')+'</ul><div class="note">'+esc(s.done)+'</div>';
      if(s.k==="choose") body+='<div class="o">'+s.opts.map((o,j)=>'<span class="opt'+(j===s.ok?" ok":"")+'">'+esc(o)+(j===s.ok?" ✓":"")+'</span>').join("")+'</div><div class="note">Đúng: '+esc(s.yes)+' · Gợi ý khi sai: '+esc(s.no)+'</div>';
      if(s.k==="tapcount") body+='<div class="note">Bé chạm từng '+esc(s.e)+' để đếm đến '+s.n+'. '+esc(s.done)+'</div>';
      if(s.k==="merge") body+='<div class="note">Bé chạm “Gộp lại”: '+s.a+' + '+s.b+'. '+esc(s.done)+'</div>';
      if(s.k==="take") body+='<div class="note">Bé chạm bớt '+s.m+' trong '+s.n+'. '+esc(s.done)+'</div>';
      if(s.k==="sum") body+='<ul class="l">'+s.pts.map(p=>'<li>'+esc(p)+'</li>').join("")+'</ul>';
      h+='<div class="q"><span class="n">'+(i+1)+'</span><div class="b"><div class="k">'+KIND[s.k]+'</div>'+body+'</div></div>';
    });
    h+='</div></section><section><h2>Thử cùng<small>không tính điểm, có gợi ý</small></h2><div class="card">';
    L.tryit.forEach((x,i)=>{h+='<div class="q"><span class="n">'+(i+1)+'</span><div class="b"><div class="t">'+esc(x.q)+'</div><div class="o">'+x.opts.map((o,j)=>'<span class="opt'+(j===x.ok?" ok":"")+'">'+esc(o)+(j===x.ok?" ✓":"")+'</span>').join("")+'</div><div class="note">Gợi ý: '+esc(x.hint)+'</div></div></div>'});
    h+='</div></section>';
    const sum=L.screens.find(s=>s.k==="sum");
    if(sum) h+='<section><h2>Điều bé cần nhớ<small>ba mẹ có thể hỏi lại bé</small></h2><div class="card"><ul class="l">'+sum.pts.map(p=>'<li>'+esc(p)+'</li>').join("")+'</ul></div></section>';
  } else {
    h+='<section><h2>Bài học trong ứng dụng</h2><div class="card">Bài học của chủ đề này đang được soạn. Trong lúc chờ, bé vẫn làm được bài kiểm tra nếu chủ đề đã có.</div></section>';
  }
  h+='<section><h2>Bài kiểm tra<small>5 câu, đạt từ 3 câu đúng là qua</small></h2><div class="card">'+(t.ready?'Chủ đề làm quen: bé hoàn thành bằng trò chơi nghe và chạm, không có bài kiểm tra chữ.':skills.length?'<p style="margin:0 0 6px">Các kỹ năng được kiểm tra:</p><ul class="l">'+skills.map(id=>'<li>'+esc((SK[id]||[id])[0])+'</li>').join("")+'</ul>':'Chủ đề này chưa có kỹ năng kiểm tra riêng.')+'</div></section>';
  const stn={new:"Chưa học",learned:"Đã học",passed:"Đã qua kiểm tra",star:"Thành thạo"}[st];
  h+='<section><h2>Tiến độ của bé<small>lưu trên máy này</small></h2><div class="stats"><div><b>'+esc(stn)+'</b><span>trạng thái</span></div><div><b>'+rec.t+'</b><span>lần kiểm tra</span></div><div><b>'+(rec.b?"⭐".repeat(rec.b):"—")+'</b><span>kết quả tốt nhất</span></div></div></section>';
  h+='<div class="cta">'+(hasL?'<a class="btn" href="'+esc(learnUrl)+'">📖 Cho bé học bài này</a>':'')+(skills.length?'<a class="btn'+(hasL?" ghost":"")+'" href="'+esc(testUrl)+'">📝 Làm bài kiểm tra</a>':'')+'</div>';
  h+='<p class="src">Theo chương trình GDPT 2018 (Thông tư 32/2018/TT-BGDĐT). Bài học và câu hỏi do Học Vui tự soạn, không chép sách giáo khoa.</p>';
  $("m").innerHTML=h;
}
if(hasL){
  window.addEventListener("lesson",()=>render(window.LearnLessons.cur));
  const sc=document.createElement("script");sc.src="../content/lessons/"+encodeURIComponent(topic)+".js";sc.onerror=()=>render(null);document.head.appendChild(sc);
} else render(null);
})();
</script>
<script src="../icons.js"></script>
</body>
</html>
