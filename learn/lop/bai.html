.spark{position:absolute;pointer-events:none;font-size:26px;animation:spk .9s forwards}@keyframes spk{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id), P=window.LearnPath;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const q=new URLSearchParams(location.search), grade=+q.get("grade"), subj=q.get("subj"), topic=q.get("topic");document.body.dataset.subj=subj;document.body.dataset.grade=grade; if(grade===1) document.documentElement.classList.add("g1");

const MAS={toan:["math","#34D399","#0EA5E9"],tviet:["vietnamese","#FFB020","#FB5A7A"],tanh:["english","#60A5FA","#A78BFA"]};

const back="index.html?"+new URLSearchParams({grade,subj,lang}).toString();
$("back").href=back;

  const R=s.rounds; let ri=0;
  function round(){
    stage.innerHTML=""; const r=R[ri];
    const pr=document.createElement("div");pr.className="gprog";R.forEach((_,i)=>{const d=document.createElement("i");d.className=(i<ri?"on":"")+(i===ri?" cur on":"");pr.appendChild(d)});stage.appendChild(pr);
    if(r.art){const a=document.createElement("div");a.className="art";a.textContent=r.art;stage.appendChild(a)}
    speakIn(r.say); mood("grade");
    const box=document.createElement("div");box.className="tiles"+(r.opts.length===2?" two":"");stage.appendChild(box);
    const order=shuffle(r.opts.map((t,i)=>({t,ok:i===r.ok}))); let wrong=0,solved=false;
    order.forEach(o=>{const b=document.createElement("button");b.type="button";b.className="tile";if(window.LearnBuddy&&LearnBuddy.has(o.t)){b.innerHTML=LearnBuddy.html(o.t,{size:Math.min(104,innerWidth*.24),obj:false});b.style.fontSize="0"}else b.textContent=o.t;b.setAttribute("aria-label",o.t);
      b.onclick=()=>{ if(solved) return;
        if(o.ok){solved=true;b.classList.add("ok");mood("happy");speakIn("Đúng rồi!");setTimeout(()=>{ri++;if(ri>=R.length){stage.innerHTML="";fin(stage,s.done||"Giỏi quá!",nl)}else round()},1000);return}
        wrong++;b.classList.add("no");b.disabled=true;
        if(wrong>=2){solved=true;[...box.children].forEach(x=>{if(x.getAttribute("aria-label")===order.find(z=>z.ok).t)x.classList.add("ok")});speakIn("Đáp án đây nè!");setTimeout(()=>{ri++;if(ri>=R.length){stage.innerHTML="";fin(stage,s.done||"Giỏi quá!",nl)}else round()},1500)}
        else {speakIn("Thử lại nhé!");setTimeout(()=>{if(!solved)speakIn(r.say)},900)}
      };box.appendChild(b)});
  }
  round();
}
function endScreen(stage){
  P.markLearned(grade,subj,topic); const rw=P.complete(grade,subj,topic); mood("cheer"); setNext(true,COPY.test);
  speakIn(rw.first?"Bé học xong rồi! Bé có 3 nhiệm vụ mới trong vườn!":COPY.ready);
  $("m").classList.add("end");
  if(window.LearnCelebrate) LearnCelebrate.show(rw.first?5:3,{lang:"vi",grade,key:subj+":"+topic,quiet:!AUTO});   /* chúc mừng toàn màn hình: thú nhảy, sao nổ, nhạc ngẫu nhiên */
  const w=document.createElement("div");w.className="endw";
  w.innerHTML='<img class="em" alt="" src="'+art("cheer")+'"><h2>Bé học xong rồi! 🎉</h2>'+(rw.first?'<div class="rw"><b>🎁 +3 nhiệm vụ</b><b>🌱 +2 hạt</b></div>':'<p>Bài này bé đã nhận phần thưởng rồi.</p>')+'<p>Giờ mình làm bài kiểm tra nhé!</p>';
  const acts=document.createElement("div");acts.className="acts";
  if(rw.first){const g=document.createElement("a");g.className="go2";g.href="../garden/index.html?"+new URLSearchParams({grade,subj}).toString();g.textContent="🌱 Vào vườn";acts.appendChild(g)}
  if(window.Album){const al=document.createElement("a");al.className="go2 alt";al.href="../album/index.html?from=lop";al.textContent="📖 Bộ sưu tập "+Album.count()+"/"+Album.total();acts.appendChild(al)}
  const r=document.createElement("button");r.type="button";r.className="go2 alt";r.textContent=COPY.again;r.onclick=()=>show(0);acts.appendChild(r);
  w.appendChild(acts);stage.appendChild(w);
}
$("nx").onclick=()=>{
  if($("nx").disabled) return;
  if(idx===steps.length-1){ location.href="../index.html?"+new URLSearchParams({grade,subj,topic,lang}).toString(); return; }
  show(idx+1);
};
$("bk").onclick=()=>show(idx-1);
/* đường tắt: bé đã học rồi hoặc đã thành thạo thì có nút kiểm tra luôn */
function shortcut(){
  if(!P.canTest(subj,grade,topic)||!P.hasTest(subj,grade,topic)) return;   /* chủ đề làm quen (trò chơi) không có bài kiểm tra */
  const a=document.createElement("a");a.className="bk";a.style.padding="0 16px";a.textContent="⏭";a.setAttribute("aria-label",COPY.skip);a.title=COPY.skip;
  a.href="../index.html?"+new URLSearchParams({grade,subj,topic,lang}).toString();document.querySelector(".foot").insertBefore(a,$("nx"));
}
if(MAS[subj]&&grade>=1&&grade<=5&&/^[A-Za-z0-9_-]{1,40}$/.test(topic||"")&&P.hasLesson(topic)&&!P.unlocked(subj,grade,topic)){ location.replace("index.html?"+new URLSearchParams({grade,subj,lang}).toString()); return; }   /* không nhảy bài: học xong chủ đề trước mới mở chủ đề này */
if(!(grade>=1&&grade<=5)||!MAS[subj]||!/^[A-Za-z0-9_-]{1,40}$/.test(topic||"")||!P.hasLesson(topic)){ location.replace("index.html"+(MAS[subj]&&grade>=1&&grade<=5?"?"+new URLSearchParams({grade,subj,lang}).toString():"")); return; }
if(false){ location.replace("index.html"); return; }
window.addEventListener("lesson",()=>{L=window.LearnLessons.cur;shortcut();build()});
const sc=document.createElement("script");sc.src="../content/lessons/"+encodeURIComponent(topic)+".js";
sc.onerror=()=>{ location.replace("../index.html?"+new URLSearchParams({grade,subj,topic,lang}).toString()); };
document.head.appendChild(sc);
})();
</script>
