  <h1 id="ttl">Chọn lớp</h1>
  <a class="ib" id="toGarden" href="../garden/index.html" aria-label="Khu vườn">🌱</a>
  <a class="ib" id="toMe" href="../me/index.html" aria-label="Của bé">🌈</a>
</header>
<div class="guide" id="guide"><button class="gmas" id="gmas" type="button" aria-label="Linh vật hướng dẫn"><span id="gbox" aria-hidden="true"></span></button><p class="gbub" id="gbub" role="status" aria-live="polite"></p></div>
<main>
  <p class="lead" id="lead"></p>
  <div id="v"></div>
</main>
<script src="../slot.js"></script>
<script src="../content/phrases.js"></script>
<script src="../mascot-kit.js"></script>
<script src="../content/curriculum.js"></script>
<script src="../content/teasers.js"></script>
<script src="../content/bank.js"></script>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id), P=window.LearnPath;
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
let lang=ls("lang"); if(lang!=="en"&&lang!=="vi") lang=/^en/i.test(navigator.language||"")?"en":"vi";
const q=new URLSearchParams(location.search); if(q.get("lang")==="en"||q.get("lang")==="vi") lang=q.get("lang");
const vi=lang==="vi";
const SN={toan:["Toán","Math"],tviet:["Tiếng Việt","Vietnamese"],tanh:["Tiếng Anh","English"]};
const MAS={toan:["math","Mochi","#34D399","#0EA5E9"],tviet:["vietnamese","Mầm","#FFB020","#FB5A7A"],tanh:["english","Bibi","#60A5FA","#A78BFA"]};
const ST={new:"📚",learned:"📖",passed:"✅",star:"⭐"};
const T={
  pick:vi?"Chọn lớp":"Pick your grade", lead1:vi?"Bé học lớp mấy?":"Which grade are you in?", gr:vi?"Lớp":"Grade",
  map:vi?"Lớp":"Grade", lead2:vi?"Chọn khu vườn để học nhé":"Pick a garden to learn in",
  topics:vi?"chủ đề":"topics", done:vi?"đã qua":"passed", other:vi?"Lớp khác":"Other grade",
  lead3:vi?"Học bài, rồi làm bài kiểm tra nhé":"Learn first, then take the quiz",
  soon:vi?"Sắp có bài học":"Lessons coming soon", test:vi?"Làm bài kiểm tra":"Take the quiz",
  nt:vi?"Sắp có bài kiểm tra":"Quiz coming soon", lock:vi?"Học bài trước nhé":"Learn first", ready:vi?"Bài học + kiểm tra":"Lesson + quiz",
  rename:vi?"Đặt tên cho khu vườn":"Name your garden",visit:vi?"🌱 Vào vườn":"🌱 Visit",hintName:vi?"Tên vui thôi nhé, đừng dùng tên thật hay số điện thoại.":"Just a fun name. No real names or phone numbers.",badName:vi?"Tên 2–20 chữ, không dùng ký tự lạ nhé.":"2–20 letters please.",cancel:vi?"Thôi":"Cancel",save:vi?"Lưu":"Save",old:vi?"🌳 Vườn cũ của bé":"🌳 Your first garden",
  course:vi?"Chương trình học":"Curriculum",sub:vi?"Toán · Tiếng Việt · Tiếng Anh, lớp 1 đến lớp 5, bám theo chương trình GDPT 2018":"Maths, Vietnamese and English for grades 1–5, following Vietnam’s 2018 curriculum",map:vi?"Bản đồ chương trình":"Curriculum map",lgL:vi?"Đã có bài học":"Lesson ready",lgP:vi?"Đã qua kiểm tra":"Passed",lgN:vi?"Sắp có":"Coming soon",learn:vi?"Học":"Learn",quiz:vi?"Kiểm tra":"Quiz",more:vi?"Xem thêm":"More",less:vi?"Thu gọn":"Show less",all:vi?"Tất cả lớp và môn":"All grades and subjects",legend:vi?"📖 số bài học đã có / số chủ đề · ✅ chủ đề đã qua kiểm tra. Chạm vào ô để xem chi tiết.":"📖 lessons ready / topics · ✅ quizzes passed. Tap a cell for details.",hasLesson:vi?"Có bài học":"Lesson ready",hasLessonN:vi?"bài học":"lessons",
  stn:{new:vi?"Chưa học":"Not started",learned:vi?"Đã học":"Learned",passed:vi?"Đã qua kiểm tra":"Passed",star:vi?"Thành thạo":"Mastered"}
};
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const hd=(s,g)=>"../../shared/art/learn/"+MAS[s][0]+"/"+MAS[s][0]+"_grade_"+g+".svg";
function url(p){const u=new URLSearchParams(p);if(lang==="en")u.set("lang","en");return "?"+u.toString()}
function gardenUrl(g,s){return "../garden/index.html?"+new URLSearchParams({grade:g,subj:s}).toString()}
const IDEAS=["🌟 Vườn Sao","🍓 Vườn Dâu","🌈 Vườn Cầu Vồng","🐝 Vườn Ong","🦋 Vườn Bướm","🍀 Vườn May Mắn"];
function okName(n){ n=n.replace(/\s+/g," ").trim(); if(n.length<2||n.length>20) return ""; if(!/^[\p{L}\p{N}\p{Extended_Pictographic} ]+$/u.test(n)) return ""; const L=window.LearnMascot; if(L&&L.clean&&L.clean(n)!==n) return ""; return n; }
function rename(id,m,done){
  const o=el('<div class="ov" role="dialog" aria-modal="true" style="--k1:'+m[2]+';--k2:'+m[3]+'"><div class="dlg"><h2>'+T.rename+'</h2><input maxlength="20" autocomplete="off" aria-label="'+T.rename+'"><div class="chips"></div><p class="hint">'+T.hintName+'</p><p class="err" role="alert"></p><div class="acts"><button type="button" class="no">'+T.cancel+'</button><button type="button" class="ok">'+T.save+'</button></div></div></div>');
  const inp=o.querySelector("input"); inp.value=LearnSlot.name(id);
  IDEAS.forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>{inp.value=t.replace(/^\S+\s/,"")};o.querySelector(".chips").appendChild(b)});
  o.querySelector(".no").onclick=()=>o.remove();
  o.querySelector(".ok").onclick=()=>{const n=okName(inp.value); if(!n){o.querySelector(".err").textContent=T.badName;return} LearnSlot.setName(id,n); o.remove(); done()};
  o.onkeydown=e=>{if(e.key==="Escape")o.remove()};
  document.body.appendChild(o); inp.focus(); inp.select();
}

const FOCUS=(g)=>{try{return window.LEARN_CURRICULUM.subjects.toan.grades[g-1].focus||""}catch(e){return ""}};
function chip(c,t){return '<span class="chip2 '+c+'">'+t+'</span>'}
function topicCard(s,g,t,m,i){
  const st=P.status(s,g,t.id), hasL=P.hasLesson(t.id), hasT=P.hasTest(s,g,t.id), passed=(st==="passed"||st==="star");
  let target=null,cta="",chips="";
  if(hasL){ target="bai.html?"+new URLSearchParams({grade:g,subj:s,topic:t.id,lang}).toString(); cta=T.learn; chips+=chip("g","📖 "+T.hasLesson); }
  else if(hasT){ target="../index.html?"+new URLSearchParams({grade:g,subj:s,topic:t.id,lang}).toString(); cta=T.quiz; chips+=chip("a",T.soon); }
  else chips+=chip("a",T.nt);
  if(st!=="new") chips+=chip("b",(passed?"✅ ":"")+T.stn[st]);
  const detail="chu-de.html?"+new URLSearchParams({grade:g,subj:s,topic:t.id,lang}).toString();
  const TE=(window.LEARN_TEASERS||{})[t.id]||["📚",""];
  const subs=(t.sub||[]).slice(0,2).map(esc).join(" · ");
  const pic='<div class="pic"><span class="big" aria-hidden="true">'+esc(TE[0])+'</span><span class="ttl"><small>'+esc(t.tag||"")+'</small>'+esc(t.name)+'</span></div>';
  const card=el('<article class="tp'+(passed?" done":"")+'" data-s="'+s+'"><span class="n" aria-hidden="true">'+(passed?"✓":i+1)+'</span>'+(target?'<a class="tpa" href="'+esc(target)+'" aria-label="'+esc(t.name)+'">'+pic+'</a>':'<div class="tpa">'+pic+'</div>')+'<div class="tpb">'+(TE[1]?'<p class="ask">🤔 '+esc(TE[1])+'</p>':'')+'<p class="subtxt">'+subs+'</p><div class="chips2">'+chips+'</div><div class="acts2">'+(target?'<a class="cta'+(hasL?"":" ghost")+'" href="'+esc(target)+'">'+cta+' ›</a>':'')+'<a class="more" href="'+esc(detail)+'">'+T.more+' ›</a></div></div></article>');
  card.addEventListener("pointerenter",()=>guideReact("topic"));
  card.querySelector(".more").addEventListener("click",()=>guideReact("more"));
  return card;
}
function dotsOf(s,gr){return P.topics(s,gr).map(t=>{const st=P.status(s,gr,t.id);return '<i class="'+((st==="passed"||st==="star")?"ok":P.hasLesson(t.id)?"on":"")+'"></i>'}).join("")}
/* ---- LINH VẬT HƯỚNG DẪN: môn bé chọn thì linh vật môn đó làm chủ đạo (đổi màu trang, nói, phản ứng) ---- */
const LM=window.LearnMascot, THEME={toan:["#34D399","#0EA5E9"],tviet:["#FFB020","#FB5A7A"],tanh:["#60A5FA","#A78BFA"]};
const GL={
  toan:{pick:["Mochi đây! Mình học Toán nhé!","Toán vui lắm! Chọn chủ đề nào!"],topic:["Chủ đề này hay lắm! Bấm Học nhé!","Mochi đếm cùng bé nhé!","Bé thích chủ đề nào?"],more:["Ba mẹ cùng xem chi tiết nhé!"],hero:["Chào bé! Chọn môn rồi chọn chủ đề nhé!"],tip:["Bấm nút Học để bắt đầu nhé!"]},
  tviet:{pick:["Mầm đây! Mình cùng học chữ nhé!","Chữ nào cũng vui! Chọn nào!"],topic:["Mầm kể bé nghe chuyện này nhé!","Chủ đề này hay quá! Bấm Học!","Bé thích chủ đề nào?"],more:["Ba mẹ cùng xem chi tiết nhé!"],hero:["Chào bé! Chọn môn rồi chọn chủ đề nhé!"],tip:["Bấm nút Học để bắt đầu nhé!"]},
  tanh:{pick:["Bibi here! Mình học tiếng Anh nhé!","Hi hi! Chọn chủ đề nào!"],topic:["Hello! Bấm Học để nghe Bibi nhé!","Chủ đề này vui lắm đó!","Bé thích chủ đề nào?"],more:["Ba mẹ cùng xem chi tiết nhé!"],hero:["Hi bé! Chọn môn rồi chọn chủ đề nhé!"],tip:["Bấm nút Học để bắt đầu nhé!"]}
};
let active="", guideOK=false, gT=0, quietT=0, lastReact=0, gradeNow=1;
const pickL=a=>a[Math.floor(Math.random()*a.length)];
function gSay(text){ if(!LM||!text) return; const b=$("gbub"); b.classList.remove("quiet"); LM.say(text); clearTimeout(quietT); quietT=setTimeout(()=>b.classList.add("quiet"),7000); }
function guideReact(kind){
  if(!LM||!guideOK) return; const now=Date.now(); if(kind==="topic"&&now-lastReact<3000) return; lastReact=now;
  LM.wake(true); LM.emote(kind==="more"?"happy":"think",1500); gSay(pickL(GL[active][kind]||GL[active].topic));
}
function applyTheme(s){ const c=THEME[s]; document.body.style.setProperty("--c1",c[0]); document.body.style.setProperty("--c2",c[1]); document.body.style.setProperty("--k1",c[0]);
  document.querySelectorAll(".hmb").forEach(b=>{b.classList.toggle("on",b.dataset.s===s);b.classList.toggle("dim",b.dataset.s!==s)}); }
function setActive(s,why){
  if(!MAS[s]||!LM) return; const changed=s!==active; active=s; applyTheme(s); try{localStorage.setItem("learn:subj",s)}catch(e){}
  if(!changed&&guideOK){ if(why==="pick") guideReact("topic"); return; }
  LM.show(s,gradeNow).then(ok=>{ guideOK=ok; if(!ok){ $("gbox").innerHTML='<img src="'+hd(s,gradeNow)+'" alt="">'; return; }
    LM.emote("wow",1600); const g=$("gmas"); g.classList.remove("poke"); void g.offsetWidth; g.classList.add("poke");
    gSay(why==="hero"?pickL(GL[s].hero):pickL(GL[s].pick)); clearTimeout(gT); gT=setTimeout(()=>{ if(Date.now()-lastReact>5000) gSay(pickL(GL[s].tip)); },9000); });
}
function initGuide(g,start,v){
  gradeNow=g; if(!LM) return;
  LM.bind({box:$("gbox"),bubble:$("gbub"),base:"../../shared/art/learn/",lang,idleMs:20000});
  $("gmas").onclick=()=>{ if(!guideOK) return; LM.poke(); const b=$("gbub"); b.classList.remove("quiet"); clearTimeout(quietT); quietT=setTimeout(()=>b.classList.add("quiet"),6000); const gm=$("gmas"); gm.classList.remove("poke"); void gm.offsetWidth; gm.classList.add("poke"); };
  /* bé bấm linh vật ở đầu trang / chip môn: chọn môn đó + cuộn tới môn */
  const go=(sj)=>{ setActive(sj,"pick"); const t=$("s-"+sj); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); };
  document.querySelectorAll(".hmb").forEach(b=>b.addEventListener("click",()=>go(b.dataset.s)));
  v.querySelectorAll(".pill.s").forEach(a=>a.addEventListener("click",()=>setActive(a.dataset.s,"pick")));
  v.querySelectorAll(".sj").forEach(sec=>{ const sj=sec.id.slice(2); sec.addEventListener("pointerenter",()=>{ if(sj!==active) setActive(sj,"pick"); }); sec.addEventListener("focusin",()=>{ if(sj!==active) setActive(sj,"pick"); }); });
  /* điện thoại (một cột): theo môn đang ở giữa màn hình khi cuộn */
  let sT=0; v.addEventListener("scroll",()=>{ if(matchMedia("(min-width:760px)").matches) return; clearTimeout(sT); sT=setTimeout(()=>{
    const probe=window.innerHeight*0.38; let best="";
    v.querySelectorAll(".sj").forEach(sec=>{ const r=sec.getBoundingClientRect(); if(r.top<=probe&&r.bottom>probe) best=sec.id.slice(2); });
    if(best&&best!==active) setActive(best,"pick"); },260); },{passive:true});
  setActive(start,"hero");
}
function overview(g,focusSubj,v){
  P.setGrade(g); $("ttl").textContent=vi?"Học Vui":"Fun Learning"; $("lead").hidden=true; $("back").href="../../hoc/";
  v.className="scroll";
  let nT=0,nL=0,nP=0; for(let gr=1;gr<=5;gr++) P.SUBJ.forEach(s=>{const ts=P.topics(s,gr); nT+=ts.length; nL+=ts.filter(t=>P.hasLesson(t.id)).length; nP+=P.summary(s,gr).done});
  const top2=el('<div class="top2"></div>'); v.appendChild(top2);
  top2.appendChild(el('<section class="hero"><div class="gm">'+P.SUBJ.map(s=>'<button type="button" class="hmb" data-s="'+s+'" aria-label="'+esc(SN[s][vi?0:1])+'"><img src="'+hd(s,g)+'" alt=""></button>').join("")+'</div><h2>'+T.course+'</h2><p>'+T.sub+'</p><div class="stats"><div><b>'+nT+'</b><span>'+T.topics+'</span></div><div><b>'+nL+'</b><span>'+T.hasLessonN+'</span></div><div><b>'+nP+'</b><span>'+T.done+'</span></div></div></section>'));
  /* BẢN ĐỒ 5 lớp × 3 môn: mỗi chấm = một chủ đề (đặc = đã có bài học, có lõi = đã qua kiểm tra) */
  let head=""; P.SUBJ.forEach(s=>{head+='<th scope="col"><img src="'+hd(s,1)+'" alt=""><span>'+esc(SN[s][vi?0:1])+'</span></th>'});
  let rows=""; for(let gr=1;gr<=5;gr++){ let cells=""; P.SUBJ.forEach(s=>{const ts=P.topics(s,gr), nl=ts.filter(t=>P.hasLesson(t.id)).length, m=MAS[s];
      cells+='<td><a class="cell" style="--k1:'+m[2]+'" href="'+url({grade:gr,subj:s})+'" aria-label="'+esc(SN[s][vi?0:1])+" "+T.gr+" "+gr+": "+nl+"/"+ts.length+'"><b>'+nl+'/'+ts.length+'</b><span class="dots">'+dotsOf(s,gr)+'</span></a></td>'});
    rows+='<tr'+(gr===g?' class="cur"':"")+'><th scope="row"><a class="gl" href="'+url({grade:gr})+'">'+gr+'</a></th>'+cells+'</tr>'; }
  top2.appendChild(el('<section class="card0"><h2>'+T.map+'</h2><p class="hint2"><i><u class="on"></u> '+T.lgL+'</i><i><u class="ok"></u> '+T.lgP+'</i><i><u></u> '+T.lgN+'</i></p><table class="mx"><thead><tr><td></td>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></section>'));
  /* thanh điều hướng dính: chọn lớp + nhảy tới môn */
  let pills=""; for(let gr=1;gr<=5;gr++) pills+='<a class="pill" href="'+url({grade:gr})+'"'+(gr===g?' aria-current="true"':"")+'>'+T.gr+" "+gr+'</a>';
  let sp=""; P.SUBJ.forEach(s=>{const m=MAS[s]; sp+='<a class="pill s" style="--k1:'+m[2]+'" href="#s-'+s+'" data-s="'+s+'"><img src="'+hd(s,g)+'" alt="">'+esc(SN[s][vi?0:1])+'</a>'});
  v.appendChild(el('<nav class="nav" id="nav" aria-label="'+T.gr+'"><div class="pills">'+pills+'</div><div class="pills">'+sp+'</div></nav>'));
  const WOW={1:"Cùng khám phá những con số và chữ cái đầu tiên nhé!",2:"Bảng nhân, truyện vui và nhiều từ tiếng Anh mới đang chờ bạn!",3:"Phân số, góc vuông và những bài văn đầu tiên đang chờ bạn!",4:"Cùng giải những bài toán nhiều bước và đọc truyện thật hay!",5:"Số thập phân, phần trăm và thử thách vào lớp 6 đang chờ!"};
  v.appendChild(el('<section class="gh" id="gh"><div class="gm">'+P.SUBJ.map(s=>'<button type="button" class="hmb" data-s="'+s+'" aria-label="'+esc(SN[s][vi?0:1])+'"><img src="'+hd(s,g)+'" alt=""></button>').join("")+'</div><div class="gt"><h2>'+T.gr+" "+g+'</h2>'+(vi?'<p class="wow">✨ '+WOW[g]+'</p>':'')+'<p>'+esc(FOCUS(g))+'</p></div></section>'));
  const cols=el('<div class="cols"></div>'); v.appendChild(cols);
  P.SUBJ.forEach(s=>{
    const m=MAS[s], ts=P.topics(s,g), x=P.summary(s,g), nl=ts.filter(t=>P.hasLesson(t.id)).length, id=g+":"+s, pct=ts.length?Math.round(nl/ts.length*100):0;
    const sec=el('<section class="sj" id="s-'+s+'" style="--k1:'+m[2]+';--k2:'+m[3]+'"><header><span class="mas"><img src="'+hd(s,g)+'" alt=""></span><span class="tx" style="flex:1;min-width:0"><h3>'+esc(SN[s][vi?0:1])+" · "+esc(m[1])+'</h3><small>'+ts.length+" "+T.topics+" · 📖 "+nl+" "+T.hasLessonN+" · ✅ "+x.done+" "+T.done+'</small><div class="bar" role="img" aria-label="'+pct+'%"><i style="width:'+pct+'%"></i></div></span></header><div class="gr"><span class="gn">🌱 '+esc(LearnSlot.name(id))+'</span><button type="button" class="gb ren" aria-label="'+T.rename+'">✏️</button><a class="gb" href="'+gardenUrl(g,s)+'">'+T.visit+'</a></div><div class="rail"></div></section>');
    sec.querySelector(".ren").onclick=()=>rename(id,m,()=>{sec.querySelector(".gn").textContent="🌱 "+LearnSlot.name(id)});
    const rail=sec.querySelector(".rail"); ts.forEach((t,i)=>rail.appendChild(topicCard(s,g,t,m,i)));
    cols.appendChild(sec);
  });
  v.querySelectorAll(".pill.s").forEach(a=>a.onclick=e=>{e.preventDefault();const t=$("s-"+a.dataset.s);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
  { let st=focusSubj&&MAS[focusSubj]?focusSubj:(ls("learn:subj")||"toan"); if(!MAS[st]) st="toan"; initGuide(g,st,v); }
  if(LearnSlot.hasLegacy()){ const o=el('<a class="card old" style="--k1:#34D399;--k2:#0EA5E9" href="../garden/index.html"><span class="tx"><b>'+T.old+'</b></span><span class="go" aria-hidden="true">›</span></a>'); o.onclick=()=>LearnSlot.setLegacy(); v.appendChild(o); }
  if(focusSubj&&MAS[focusSubj]){ const t=$("s-"+focusSubj); if(t) setTimeout(()=>t.scrollIntoView({block:"start"}),60); }
  else { const c=v.querySelector(".pill[aria-current]"); if(c){ const pc=c.parentElement; pc.scrollLeft=c.offsetLeft-(pc.clientWidth-c.offsetWidth)/2; } }
}
function view(){
  let g=+q.get("grade"); if(!(g>=1&&g<=5)) g=P.grade()||1;
  const s=q.get("subj"); overview(g, MAS[s]?s:"", $("v"));
}
view();
})();
</script>
