<!doctype html>
<html lang="vi" data-app="hub">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pop Play · Night Play</title>
<meta name="description" content="Chọn thế giới của bạn: Pop Play cho bé, Night Play cho người lớn.">

<meta name="theme-color" content="#F6F4F1">

<script>
try{var t=localStorage.getItem("theme")}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:4px solid #7C5CFF;outline-offset:3px}
.nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.2px}
.mark svg{width:34px;height:34px}
.tools{position:relative;display:flex;gap:10px;align-items:center}
.ico{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap;box-shadow:var(--shadow)}
.pill svg{width:20px;height:20px;flex:none}
@media (max-width:520px){.pill{width:44px;padding:0}.pill span{display:none}}
.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
#langMenu{position:absolute;top:54px;right:0;min-width:150px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:none;z-index:6}
#langMenu.on{display:block}
#langMenu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:none;font-size:16px;font-weight:600}
#langMenu button[aria-checked=true]{background:var(--ink);color:var(--bg)}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.6vh,28px);padding:0 16px;overflow-y:auto}
h1{margin:0;text-align:center;font-size:clamp(26px,min(5vw,6vh),46px);line-height:1.1;letter-spacing:-.8px;font-weight:800}
.sub{margin:-6px 0 0;text-align:center;color:var(--muted);font-size:clamp(14px,2vh,17px)}
.cards{width:100%;max-width:1000px;display:grid;gap:clamp(12px,2.5vw,24px);grid-template-columns:1fr 1fr}
@media (max-width:700px){.cards{grid-template-columns:1fr}}
.card{position:relative;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,12px);padding:clamp(14px,2.6vh,26px);border-radius:28px;text-decoration:none;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-4px)}
.card:active{transform:scale(.985)}
.pop{background:linear-gradient(145deg,#FFE1C4,#FF9A5A);color:#2B1708}
.night{background:linear-gradient(145deg,#2A2160,#0E1020);color:#F1F2FF}
.tiles{display:flex;gap:10px}
.tiles svg{width:clamp(52px,min(11vw,11vh),96px);aspect-ratio:1;border-radius:clamp(12px,2vh,20px);box-shadow:0 4px 10px rgba(0,0,0,.2);flex:none}
.tag{align-self:flex-start;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.pop .tag{background:rgba(255,255,255,.65)}
.night .tag{background:rgba(155,131,255,.25);color:#CFC4FF}
.card h2{margin:0;font-size:clamp(22px,min(3.6vw,4.4vh),34px);line-height:1.1;font-weight:800;letter-spacing:-.4px}
.card p{margin:0;font-size:clamp(13.5px,1.9vh,16px);opacity:.85;max-width:34ch}
.go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:11px 20px;border-radius:999px;font-weight:800;font-size:16px}
.pop .go{background:#FF5A1F;color:#fff}
.night .go{background:#9B83FF;color:#0E0A24}
.go svg{width:18px;height:18px;transition:transform .18s}
.card:hover .go svg{transform:translateX(4px)}
@media (max-height:720px) and (max-width:700px){.card p{display:none}.tiles svg{width:48px}}
@media (max-height:680px) and (max-width:700px){.sub{display:none}.nav{padding:6px 16px}main{gap:10px}.cards{gap:10px}.card{padding:10px 14px;gap:4px}.tiles svg{width:38px}.tag{padding:2px 10px;font-size:11px}.card h2{font-size:20px}.go{padding:8px 16px;font-size:15px}.foot{padding:4px 16px 8px}}
@media (max-height:600px) and (max-width:700px){.tiles{display:none}.card{padding:10px 14px}}
@media (max-height:480px){.cards{grid-template-columns:1fr 1fr}.sub{display:none}.nav{padding:4px 16px}main{gap:8px;padding-bottom:4px}h1{font-size:22px}.cards{gap:10px}.card{padding:10px 14px;gap:4px}.card p{display:none}.tiles svg{width:40px}.tag{padding:2px 10px;font-size:11px}.card h2{font-size:20px}.go{padding:7px 16px;font-size:15px}.foot{padding:2px 16px 6px}}
.foot{flex:none;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:8px 16px 12px;font-size:13px;color:var(--muted)}
.foot nav{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.foot a{text-decoration:none;font-weight:600}.foot a:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.card,.go svg{transition:none}}
</style>
<script src="shared/offline.js" defer></script>

<script>
const i18n = {
  vi:{ name:"Tiếng Việt", h1:"Chọn thế giới của bạn", sub:"Hai nơi chơi game riêng, không quảng cáo, không theo dõi cá nhân.",
       tPop:"Dành cho bé", dPop:"Game vui, an toàn, màu sắc tươi sáng cho các bé.", gPop:"Vào Pop Play",
       tNight:"Dành cho người lớn", dNight:"Game thư giãn buổi tối: bài, cờ, xếp hình và hơn thế nữa.", gNight:"Vào Night Play",
       pass:"Night Pass", upgrade:"Night Pass: mở tất cả game", theme:"Sáng / Tối", lang:"Ngôn ngữ", privacy:"Quyền riêng tư", contact:"Liên hệ", rights:"Bảo lưu mọi quyền." },
  en:{ name:"English", h1:"Choose your world", sub:"Two separate play spaces. No ads, no personal tracking.",
       tPop:"For kids", dPop:"Fun, safe, brightly colored games made for little ones.", gPop:"Enter Pop Play",
       tNight:"For grown-ups", dNight:"Evening unwind games: cards, chess, puzzles and more.", gNight:"Enter Night Play",
       pass:"Night Pass", upgrade:"Night Pass: unlock all games", theme:"Light / Dark", lang:"Language", privacy:"Privacy", contact:"Contact", rights:"All rights reserved." }
};
const $ = id => document.getElementById(id);
let lang = (() => {
  try{ const s = localStorage.getItem("lang"); if(s && i18n[s]) return s; }catch(e){}
  for(const l of (navigator.languages || [navigator.language || ""])){ const c = String(l).split("-")[0].toLowerCase(); if(i18n[c]) return c; }
  return "vi";
})();
function applyLang(){
  const t = i18n[lang];
  document.documentElement.lang = lang;
  ["h1","sub","tPop","dPop","gPop","tNight","dNight","gNight"].forEach(k => { $(k).textContent = t[k]; });
  $("priv").textContent = t.privacy; $("mail").textContent = t.contact;
  $("copy").textContent = "© " + new Date().getFullYear() + " Play Hub. " + t.rights;
  $("passBtn").href = "subscribe.html?from=index.html&lang=" + lang; $("passBtn").lastChild.textContent = t.pass; $("passBtn").setAttribute("aria-label", t.upgrade);
  $("themeBtn").setAttribute("aria-label", t.theme); $("langBtn").setAttribute("aria-label", t.lang);
  /* Truyền ngôn ngữ sang landing để khớp */
  $("aPop").href = "popplay/index.html"; $("aNight").href = "cozyplay/index.html";
  menu.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", b.dataset.l === lang));
}
const menu = $("langMenu"), langBtn = $("langBtn");
for(const k in i18n){
  const b = document.createElement("button");
  b.type = "button"; b.dataset.l = k; b.setAttribute("role", "menuitemradio"); b.textContent = i18n[k].name;
  b.addEventListener("click", () => { lang = k; try{ localStorage.setItem("lang", k); }catch(e){} applyLang(); toggleMenu(false); });
  menu.appendChild(b);
}
function toggleMenu(on){ menu.classList.toggle("on", on); langBtn.setAttribute("aria-expanded", on); }
langBtn.addEventListener("click", e => { e.stopPropagation(); toggleMenu(!menu.classList.contains("on")); });
document.addEventListener("click", e => { if(!e.target.closest("#langMenu")) toggleMenu(false); });
const THEME_COLOR = { light:"#F6F4F1", dark:"#12141F" };
function setTheme(t, save){
  document.documentElement.dataset.theme = t;
  document.querySelector("meta[name=theme-color]").content = THEME_COLOR[t];
  if(save) try{ localStorage.setItem("theme", t); }catch(e){}
}
$("themeBtn").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
setTheme(document.documentElement.dataset.theme);
/* Căn giữa theo CHIỀU CAO MÀN HÌNH, lấy HAI CARD làm tâm (tiêu đề nằm phía trên, không tính vào),
   vì chữ ở trên làm mắt thấy cả khối bị trôi xuống. Bù bằng padding, chỉ khi còn dư chỗ (không làm nội dung bị cuộn). */
function balance(){
  const main = document.querySelector("main"), n = document.querySelector(".nav").offsetHeight, f = document.querySelector(".foot").offsetHeight;
  main.style.paddingTop = main.style.paddingBottom = "0px";
  const h1 = document.getElementById("h1").getBoundingClientRect(), c = document.querySelector(".cards").getBoundingClientRect();
  const above = c.top - h1.top, slack = Math.max(0, main.clientHeight - (c.bottom - h1.top));
  const want = (n - f) + above, pad = Math.floor(Math.min(Math.abs(want), Math.max(0, slack - 28)));   // chừa >= 14px phía trên tiêu đề
  if(want >= 0) main.style.paddingBottom = pad + "px"; else main.style.paddingTop = pad + "px";
}
const _apply = applyLang; applyLang = function(){ _apply(); balance(); };
addEventListener("resize", balance); addEventListener("load", balance);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(balance);
applyLang();
</script>
