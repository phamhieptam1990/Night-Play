function renderPlan(){
  var x=X(),p=pass(),exp=p&&p.exp?new Date(p.exp):null,left=exp?exp-Date.now():0,ok=exp&&left>0;

    var r=await fetch("/api/pass",{headers:{Authorization:"Bearer "+p.token},cache:"no-store"});
    if(!r.ok)throw 0;srv=await r.json();
    try{var q=pass()||p;if(srv.exp){q.exp=new Date(srv.exp).toISOString();localStorage.setItem("pass",JSON.stringify(q))}}catch(e){}
  }catch(e){srv=false}
  renderPlan();renderDev();
}
async function signOut(){
  var x=X(),b=$("bSign"),m=$("mSign");b.disabled=true;b.textContent=x.signing;
  try{var p=pass(),r=await fetch("/api/pass/signout-others",{method:"POST",headers:{Authorization:"Bearer "+p.token}}),j=await r.json();if(!r.ok)throw 0;await loadSrv();var mm=$("mSign");if(mm){mm.className="msg ok";mm.textContent=x.signedOut(j.removed)}}
  catch(e){b.disabled=false;b.textContent=x.signout;m.className="msg bad";m.textContent=x.signErr}
}
function renderRest(){
  var x=X(),p=pass(),em=restEmail||(p&&p.email)||"";
  $("cPlan").hidden=$("cDev").hidden=restOpen;
  if(!restOpen){$("cRest").innerHTML='<div class="rrow"><span class="mut">'+esc(x.restQ)+'</span><button class="btn" id="rOpen" type="button">'+esc(x.rest)+'</button></div>';$("rOpen").onclick=function(){restOpen=true;restStep=0;renderRest()};return}
  var h='<h2>'+esc(x.rest)+'</h2><p class="mut" style="margin:0 0 8px">'+esc(x.restP)+'</p>';
  if(restStep===0)h+='<label class="mut" for="rE">'+esc(x.email)+'</label><input id="rE" type="email" inputmode="email" autocomplete="email" value="'+esc(em)+'">';
  else h+='<label class="mut" for="rO">'+esc(x.otp)+'</label><input id="rO" class="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">';
  h+='<div class="row"><button class="btn" id="rBk" type="button">←</button><button class="btn p" id="rGo" type="button">'+esc(restStep===0?x.send:x.ok)+'</button></div><div class="msg" id="rM" role="status"></div>';
  $("cRest").innerHTML=h;
  $("rGo").onclick=restStep===0?restSend:restVerify;
  var o=$("rO");if(o){o.oninput=function(){o.value=o.value.replace(/\D/g,"").slice(0,6)};o.onkeydown=function(e){if(e.key==="Enter")restVerify()};o.focus()}
  var e=$("rE");if(e)e.onkeydown=function(ev){if(ev.key==="Enter")restSend()};
  $("rBk").onclick=function(){if(restStep===1){restStep=0}else restOpen=false;renderRest()};
}
function msg(c,t){var m=$("rM");if(m){m.className="msg "+c;m.textContent=t}}
async function api(path,body){
  var r=await fetch("/api"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw{status:r.status};return d;
}
async function restSend(){
  var x=X(),em=$("rE").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){msg("bad",x.emailBad);return}
  $("rGo").disabled=true;
  try{await api("/restore",{email:em});restEmail=em;restStep=1;renderRest();msg("ok",x.sent)}
  catch(e){$("rGo").disabled=false;msg("bad",e&&e.status===429?x.slow:x.net)}
}
async function restVerify(){
  var x=X(),b=$("rGo");if(b.disabled)return;b.disabled=true;
  try{
    var d=await api("/restore/verify",{email:restEmail,otp:$("rO").value.trim()});
    if(!d.active||!d.token){b.disabled=false;msg("bad",x.none2);return}
    try{localStorage.setItem("pass",JSON.stringify({plan:d.plan,exp:new Date(d.exp).toISOString(),email:restEmail,token:d.token}))}catch(e){}
    restStep=0;restOpen=false;renderAll();loadSrv();
  }catch(e){b.disabled=false;msg("bad",e&&e.status===429?x.slow:e&&e.status?x.bad:x.net)}
}
function renderTrial(){
  var x=X(),st=window.NPTrial?NPTrial.state():"pass",c=$("cTrial");
  if(st==="pass"){c.hidden=true;return}
  c.hidden=false;var m=Math.max(1,Math.ceil((window.NPTrial?NPTrial.left():0)/60000));
  if(st==="avail")c.innerHTML='<div class="tx"><b>🎁 '+esc(x.trAv)+'</b>'+esc(x.trAvS)+'</div><button class="btn p" id="trGo" type="button">'+esc(x.trGo)+'</button>';
  else if(st==="on")c.innerHTML='<div class="tx"><b>⏳ '+esc(x.trOn)+'</b>'+esc(x.trOnS(m))+'</div>';
  else c.innerHTML='<div class="tx"><b>🔒 '+esc(x.trUsed)+'</b>'+esc(x.trUsedS)+'</div><a class="btn p" href="'+sub()+'">'+esc(x.buy)+'</a>';
  var g=$("trGo");if(g)g.onclick=function(){NPTrial.start();renderAll()};
}
var trI=0;function trTick(){clearInterval(trI);if(window.NPTrial&&NPTrial.state()==="on"){trI=setInterval(function(){if(NPTrial.state()!=="on"){clearInterval(trI);NPTrial.cleanup();if(window.NPFont)NPFont.apply();if(window.NPGrad)NPGrad.set(NPGrad.get());renderAll()}else renderTrial()},15000)}}
function renderFont(){
  var x=X(),ok=window.NPFont&&NPFont.active(),cur=window.NPFont?NPFont.get():"";
  var opts=[["",x.fntDef,"Inter"]].concat(window.NPFont?NPFont.list.map(function(f){return [f[0],f[2],f[1]]}):[]);
  var h='<h2>'+esc(x.fnt)+'</h2><div class="fonts">'+opts.map(function(o){
    return '<button type="button" class="btn" data-f="'+o[0]+'" aria-pressed="'+(cur===o[0])+'"'+(ok||o[0]===""?"":" disabled")+'><span class="fs" data-npkeep style="font-family:\''+(o[0]?o[2]:"Inter")+'\',Inter,sans-serif">'+esc(x.fntSample)+'</span><span class="fn">'+(ok||o[0]===""?"":"🔒 ")+esc(o[1])+'</span></button>'}).join("")+'</div>';
  h+=ok?'<p class="lockmsg">'+esc(x.fntNote)+'</p>':'';
  $("cFont").innerHTML=h;
  $("cFont").querySelectorAll("button[data-f]").forEach(function(b){b.onclick=function(){if(!window.NPFont)return;if(b.dataset.f&&!NPFont.active())return;NPFont.set(b.dataset.f);renderFont()}});
}
function renderGrad(){
  var x=X(),ok=window.NPGrad&&NPGrad.active(),cur=window.NPGrad?NPGrad.get():"",dark=de.dataset.theme==="dark",vi=L()==="vi";
  var h='<h2>'+esc(x.grad)+'</h2><div class="grads"><button type="button" class="none" data-g="" aria-pressed="'+(cur==="")+'">'+esc(x.gradNone)+'</button>';
  (window.NPGrad?NPGrad.list:[]).forEach(function(g){var nm=vi?g[1]:g[2];h+='<button type="button" data-g="'+g[0]+'" aria-pressed="'+(cur===g[0])+'" aria-label="'+esc(nm)+'" style="background:'+(dark?g[3]:g[4])+'"'+(ok?"":" disabled")+'>'+(ok?"":"🔒 ")+esc(nm)+'</button>'});
  h+='</div>'+(ok?'<p class="lockmsg">'+esc(x.gradNote)+'</p>':'');
  var fo=window.NPGrad&&NPGrad.fxOn();
  h+='<div class="kv" style="margin-top:6px;align-items:center"><span>'+esc(x.fx)+'</span><span class="sw" style="flex:none"><button type="button" class="btn" id="fxOn" aria-pressed="'+!!fo+'"'+(ok?"":" disabled")+'>'+esc(x.fxOn)+'</button><button type="button" class="btn" id="fxOff" aria-pressed="'+!fo+'"'+(ok?"":" disabled")+'>'+esc(x.fxOff)+'</button></span></div>';
  h+='<div class="row" style="margin-top:6px"><a class="btn p" href="nightpass-theme.html?lang='+L()+'">🎨 '+esc(x.prev)+'</a></div>';
  $("cGrad").innerHTML=h;
  $("fxOn").onclick=function(){NPGrad.setFx(true);renderGrad()};$("fxOff").onclick=function(){NPGrad.setFx(false);renderGrad()};
  $("cGrad").querySelectorAll("button[data-g]").forEach(function(b){b.onclick=function(){if(!window.NPGrad)return;if(b.dataset.g&&!NPGrad.active())return;NPGrad.set(b.dataset.g);renderGrad()}});
}
function renderLook(){
  var x=X(),cur=null;try{cur=localStorage.getItem("theme")}catch(e){}
  $("thH").textContent=x.th;$("lgH").textContent=x.lg;
  var opts=[[null,x.thA],["light",x.thL],["dark",x.thD]];
  $("swTheme").innerHTML=opts.map(function(o){return '<button type="button" class="btn" data-v="'+(o[0]||"")+'" aria-pressed="'+((cur||"")===(o[0]||""))+'">'+esc(o[1])+'</button>'}).join("");
  $("swTheme").querySelectorAll("button").forEach(function(b){b.onclick=function(){var v=b.dataset.v;try{if(v)localStorage.setItem("theme",v);else localStorage.removeItem("theme")}catch(e){}
    de.dataset.theme=v||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");renderLook();renderGrad()}});
  $("swLang").innerHTML=["vi","en"].map(function(l){return '<button type="button" class="btn" data-l="'+l+'" aria-pressed="'+(L()===l)+'">'+(l==="vi"?"Tiếng Việt":"English")+'</button>'}).join("");
  $("swLang").querySelectorAll("button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
  $("skH").textContent=x.sk;$("skP").textContent=x.skP;$("skGo").textContent=x.skGo;$("skGo2").textContent=x.skGo2;
}
function renderSupport(){
  var x=X(),p=pass(),em=(p&&p.email)||"",ex=p&&p.exp?fmt(new Date(p.exp)):"";
  $("rfH").textContent=x.rf;$("rfP").textContent=x.rfP;$("rfBtn").textContent=x.rfBtn;
  var body=(L()==="vi"?"Email mua: ":"Purchase email: ")+em+"\n"+(L()==="vi"?"Hạn gói: ":"Plan expiry: ")+ex+"\n"+(L()==="vi"?"Mã đơn (NP…): ":"Order code (NP…): ")+"\n";
  $("rfBtn").href="mailto:"+MAIL+"?subject="+encodeURIComponent(x.rfSub)+"&body="+encodeURIComponent(body);
  $("lMail").href="mailto:"+MAIL;$("lMail").textContent=x.lMail+" · "+MAIL;
  $("dcH").textContent=x.dc;$("lDoc").textContent=x.lDoc;$("lPay").textContent=x.lPay;$("lPrice").textContent=x.lPrice;
  $("hlH").textContent=x.hl;$("lChk").textContent=x.lChk;
  ["lDoc","lPay","lPrice"].forEach(function(i){var a=$(i);a.href=a.getAttribute("href").split("&")[0]});
}
function renderAll(){
  var x=X();$("ttl").textContent=x.ttl;document.title=x.ttl;
  var b=$("back");b.setAttribute("aria-label",x.back);b.href=fromPath();
  ["tb0","tb1","tb2","tb3"].forEach(function(id,i){var e=$(id);e.textContent=x["t"+i];e.setAttribute("aria-selected",String(tab===i))});
  for(var i=0;i<4;i++)$("p"+i).classList.toggle("on",tab===i);
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.l===L()))});
  renderPlan();renderDev();renderRest();renderLook();renderTrial();renderFont();renderGrad();renderSupport();trTick();
}
function setLang(l){de.lang=l;try{localStorage.setItem("lang",l)}catch(e){}renderAll()}
document.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){tab=+b.dataset.t;try{var q=new URLSearchParams(location.search);q.set("tab",tab);history.replaceState(null,"","?"+q)}catch(e){}renderAll()}});
addEventListener("storage",function(e){if(e.key==="lang"&&(e.newValue==="vi"||e.newValue==="en")){de.lang=e.newValue;renderAll()}});
tab=Math.max(0,Math.min(3,parseInt(new URLSearchParams(location.search).get("tab"),10)||0));
renderAll();loadSrv();
if(location.hash==="#restore"){tab=0;renderAll();var re=$("rE");re&&re.focus()}
</script>
