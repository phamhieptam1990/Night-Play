var de=document.documentElement,$=function(i){return document.getElementById(i)},tab=0,srv=null,restStep=0,restEmail="",restOpen=false;

function renderPlan(){
  var x=X(),p=pass(),exp=p&&p.exp?new Date(p.exp):null,left=exp?exp-Date.now():0,ok=exp&&left>0;
  var nm=p?(x[{day:"pDay",week:"pWeek",month:"pMonth",year:"pYear"}[p.plan]]||x.pDef):"";
  var h='<h2>'+esc(x.plan)+'</h2>';
  if(!p||!exp){h+='<div class="big">'+esc(x.none)+'</div><div class="mut">'+esc(x.noneS)+'</div><div class="row"><a class="btn p" href="'+sub()+'">'+esc(x.buy)+'</a></div>'}
  else{
    var d=Math.floor(left/864e5),hr=Math.floor(left/36e5);

async function loadSrv(){
  var p=pass();if(!p||!p.token){srv=null;renderDev();return}
  try{
    var r=await fetch("/api/pass",{headers:{Authorization:"Bearer "+p.token},cache:"no-store"});
    if(!r.ok)throw 0;srv=await r.json();
    try{var q=pass()||p;if(srv.exp){q.exp=new Date(srv.exp).toISOString();localStorage.setItem("pass",JSON.stringify(q))}}catch(e){}
  }catch(e){srv=false}
