<!doctype html>
<html lang="vi" data-app="cozyplay">
<head>
<meta charset="utf-8">
<script src="../shared/guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F0FA">
<link rel="icon" href="data:,">
<title>Night Play</title>
<script>
/* Theme theo chuẩn của dự án: localStorage "theme" → nếu chưa chọn thì theo hệ điều hành */
try{var savedTheme=localStorage.getItem("theme")}catch(e){}
document.documentElement.dataset.theme=savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
(function(){
  var q=new URLSearchParams(location.search).get("lang"),s=null;
  try{s=localStorage.getItem("lang")}catch(e){}
  var l=[q,s].find(function(x){return x==="vi"||x==="en"})||(/^vi/i.test(navigator.language||"")?"vi":"en");
  document.documentElement.lang=l;
})();
</script>
<link rel="preload" href="../shared/fonts/inter-var-latin-vi.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/layout.css">
<link rel="stylesheet" href="../shared/bars.css">
<style>
/* Màu nền, chữ, thẻ, viền, nhấn: lấy từ shared/theme.css (cùng bảng màu Night Play với trang game).
   Dưới đây chỉ đặt tên gọi riêng của trang admin + màu biểu đồ/trạng thái (đã qua validator). */
:root{
  color-scheme:light;
  --page:var(--bg); --surface:var(--panel); --border:var(--line);
  --hover:color-mix(in srgb,var(--ink) 7%,transparent);
  --grid:color-mix(in srgb,var(--line) 55%,var(--panel)); --axis:var(--line);
  --s1:#6a48f0; --s2:#eb6834; --s3:#1baf7a;                                   /* chuỗi biểu đồ: tím thương hiệu, cam, xanh ngọc */
  --st-warning:#fab219; --st-serious:#ec835a; --st-critical:#d03b3b; --st-good:#0ca30c;
  --bad-text:#b42323;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --s1:#8d74f4; --s2:#d95926; --s3:#199e70; --bad-text:#ec6b6b;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--font);overflow:hidden;display:flex;flex-direction:column;height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .sub{color:var(--ink2);font-size:13px}
h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
h2{font-size:14px;margin:0;font-weight:600}

/* khung 1 màn hình */
.shell{flex:1;min-height:0;width:100%;max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.top .tools{margin-left:auto}
.asof{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:help}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.2px}
nav.tabs{display:flex;gap:4px;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--surface)}
.tab{border:0;background:none;border-radius:999px;padding:6px 14px;color:var(--ink2);display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tab:hover{background:var(--hover)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.count{min-width:20px;padding:0 6px;border-radius:10px;background:var(--st-serious);color:#0b0b0b;font-size:12px;font-weight:600;text-align:center;line-height:20px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;color:var(--ink2)}
.btn:hover,.seg button:hover{background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default;background:var(--surface)}
.ico{width:38px;height:38px;padding:0;border:0;box-shadow:var(--shadow);display:inline-grid;place-items:center}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sun{display:none} [data-theme=dark] .sun{display:block} [data-theme=dark] .moon{display:none}

main{flex:1;min-height:0;margin-top:12px;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px}

/* tổng quan */
.kpis{flex:none;display:grid;gap:12px;grid-template-columns:minmax(0,2fr) repeat(5,minmax(0,1fr))}
.tile{min-width:0;display:block;color:inherit;text-decoration:none;padding:12px 14px}
a.tile:hover{background:var(--hover)}
.tile .label{color:var(--ink2);font-size:13px}
.tile .val{font-size:24px;font-weight:600;line-height:1.25;margin-top:2px}
.tile.hero .val{font-size:48px;line-height:1.1}
.tile .note{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--st-serious);margin-right:8px}
.panels{flex:1;min-height:0;display:grid;gap:12px;grid-template-columns:repeat(12,1fr);grid-template-rows:1fr 1fr}
.p-rev,.p-traf{grid-column:span 6} .p-plans{grid-column:span 4} .p-games{grid-column:span 5} .p-live{grid-column:span 3}
.panel{overflow:hidden}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.s2{stroke:var(--s2)} .chart .ln.s3{stroke:var(--s3)}
.chart .dt.s2{fill:var(--s2)} .chart .dt.s3{fill:var(--s3)} .chart .ring{fill:var(--surface)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;flex:1;justify-content:flex-end;color:var(--ink2);font-size:13px;margin-right:6px}
.lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.lg b{color:var(--ink);font-weight:600}
.tip .k{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip .k.s2{background:var(--s2)} .tip .k.s3{background:var(--s3)}
.glist{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hg-row{display:grid;grid-template-columns:20px minmax(80px,1fr) 2fr 62px;gap:8px;align-items:center}
.hg-rank{color:var(--muted);font-variant-numeric:tabular-nums}
.hg-name{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.hg-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hg-name small{color:var(--muted);font-size:12px}
.hg-trend{text-align:right;color:var(--ink2);font-size:12px;white-space:nowrap}
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--st-good);margin-right:8px;vertical-align:middle}
.live-total{display:flex;align-items:center;font-size:15px;margin-bottom:8px;color:var(--ink2)}
.live-total b{font-size:32px;font-weight:600;line-height:1;color:var(--ink);margin-right:6px}
#live{flex:1;min-height:0;overflow:hidden}
.lv-list{display:grid;gap:6px}
.lv-row{display:flex;justify-content:space-between;gap:8px}
.lv-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .lv-name small{color:var(--muted)}
.panel{min-height:0;display:flex;flex-direction:column}
.card-h{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.linkbtn{background:none;border:0;color:var(--ink2);padding:0;text-decoration:underline;text-underline-offset:3px}
.chart{flex:1;min-height:0;position:relative}
.chart svg{display:block}
.chart .gl{stroke:var(--grid);stroke-width:1} .chart .bl{stroke:var(--axis);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .bar{fill:var(--s1)}
.chart .hit{fill:transparent;outline:none}
.chart .hov{fill:var(--hover);opacity:0;pointer-events:none}
.chart .hit:hover+.hov,.chart .hit:focus+.hov{opacity:1}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.14);white-space:nowrap;display:none}
.tip b{display:block;font-size:13px} .tip span{color:var(--ink2)}
.tablewrap{flex:1;min-height:0;overflow:auto}
.rank{display:grid;gap:14px;align-content:center;flex:1}
.rk-row{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center}
.rk-name{color:var(--ink2)}
.rk-bar{display:flex;align-items:center;gap:8px;min-height:24px}
.rk-fill{height:16px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px;flex:none}
.rk-val{white-space:nowrap} .rk-val small{color:var(--muted)}

/* danh sách + phân trang */
.toolbar{flex:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1}
.field{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px}
input.field{min-width:220px}
.listcard{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px}
.tbl{flex:1;min-height:0;overflow:hidden;transition:opacity .15s}
.tbl[aria-busy="true"]{opacity:.5}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
th{height:36px;font-weight:600;color:var(--ink2);text-align:left;padding:0 10px;border-bottom:1px solid var(--axis);white-space:nowrap}
td{height:40px;padding:0 10px;border-bottom:1px solid var(--grid);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:6px}
.badge i{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.empty{color:var(--muted);padding:32px 0;text-align:center}
.pager{flex:none;min-height:57px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--grid)}
.pager .pg{display:flex;gap:6px;align-items:center}
@media (max-height:640px),(max-width:480px){#pwHint{display:none}}
.pager .btn{padding:4px 10px;min-width:34px}
.hint{color:var(--muted);font-size:12px}

/* Pass: thanh công cụ, ngăn kéo chi tiết, biểu mẫu thao tác */
.toolbar .btn.csv{white-space:nowrap;order:5;margin-left:auto}
.seg button[aria-pressed="true"]:hover{background:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.go:hover{background:var(--accent)}
.btn.danger{background:var(--st-critical);border-color:var(--st-critical);color:#fff}
.btn.danger:hover{background:var(--st-critical)}
.link{background:none;border:0;padding:0;color:var(--ink);text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px}
tr.row-open{cursor:pointer} tr.row-open:hover td{background:var(--hover)}
#dBack{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.42)}
#drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(580px,100vw);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 32px rgba(0,0,0,.25)}
.dhead{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--grid)}
.dhead h2{font-size:16px;overflow-wrap:anywhere}
.dbody{flex:1;min-height:0;overflow:auto;padding:12px 16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.dbody>*{min-width:0}
.dbody h3{font-size:13px;margin:0 0 6px;font-weight:600;color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 12px}
.kv div{min-width:0} .kv small{display:block;color:var(--muted);font-size:12px} .kv b{font-weight:600;overflow-wrap:anywhere}
.dtbl{max-height:210px;overflow:auto;border:1px solid var(--grid);border-radius:10px}
.dtbl table{font-size:12.5px} .dtbl td{height:34px} .dtbl th{height:32px;position:sticky;top:0;background:var(--surface)}
.actbox{border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:10px}
.actbox label{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:3px}
.actbox .field{width:100%;border-radius:10px}
.actbox .seg{flex-wrap:wrap;border-radius:14px}
.actmsg{min-height:20px;font-size:13px}.actmsg.ok{color:var(--st-good)}.actmsg.bad{color:var(--bad-text)}
.warnbox{border:1px solid var(--st-warning);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink2)}
@media (max-width:760px),(max-height:640px){#drawer{width:100vw;border-left:0}.dhead{padding:10px 12px}.dbody{padding:10px 12px 16px}}

/* đăng nhập */
.login{max-width:360px;margin:12vh auto 0}
.login-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.login form{display:grid;gap:12px;margin-top:12px}
.login input{width:100%;border:1px solid var(--axis);background:var(--page);border-radius:8px;padding:10px 12px}
.login .go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:10px 12px;font-weight:700}
.err{color:var(--bad-text);min-height:20px;font-size:13px}

/* màn hình nhỏ hoặc thấp: vẫn vừa một khung, KHÔNG cuộn — tuỳ chọn gom vào menu, mỗi lần hiện một khung, danh sách dạng thẻ */
.pnav,#moreBtn{display:none}
.top{position:relative}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px),(max-height:640px){
  .shell{padding:8px 12px}
  .top{flex-wrap:nowrap;gap:8px}
  .brand h1{display:none} .brand svg{width:30px;height:30px}
  nav.tabs{flex:1;min-width:0}
  .tab{flex:1;min-width:0;justify-content:center;padding:6px;font-size:13px;gap:5px;overflow:hidden;text-overflow:ellipsis}
  #moreBtn{display:inline-grid;flex:none}
  .tools{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:30;flex-direction:column;align-items:stretch;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.22);min-width:260px}
  .tools.open{display:flex}
  .tools .seg{align-self:stretch}.tools .seg button{flex:1;white-space:nowrap;padding:6px 8px}
  .tools .ico{align-self:center}
  .tools .asof{text-align:center}
  main{margin-top:8px}.view{gap:8px}
  .tile{padding:6px 10px}.tile .label{font-size:12px}
  .tile .val,.tile.hero .val{font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .note{display:none}
  .tile.hero{grid-column:auto}
  .pnav{display:flex;gap:6px;flex:none}
  .pnav button{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 6px;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pnav button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
  .panels{display:flex}
  .panels>.panel{display:none;flex:1;min-width:0}
  .panels[data-p="rev"]>.p-rev,.panels[data-p="traf"]>.p-traf,.panels[data-p="plans"]>.p-plans,.panels[data-p="games"]>.p-games,.panels[data-p="live"]>.p-live{display:flex}
  .toolbar .grow{display:none}
  .field,input.field{min-width:0;flex:1}
  .toolbar select.field{flex:0 0 auto;max-width:48%}
  .toolbar input.field{flex:1 1 120px}
  .listcard{padding:0 12px}
  .crow{height:56px;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-content:center;border-bottom:1px solid var(--grid);overflow:hidden}
  .crow>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .c2{color:var(--muted);font-size:12px}
  .crow .r{text-align:right}
  .pager{min-height:48px;padding:6px 0;justify-content:center}
  .pager>.sub:first-child,.pager [data-go=first],.pager [data-go=last]{display:none}
  .card-h{flex-wrap:wrap;row-gap:2px}
  .card-h h2{white-space:nowrap}
  .card-h .legend{order:3;flex-basis:100%;justify-content:flex-start;margin:0}
  .linkbtn{white-space:nowrap}
}
@media (max-width:420px){
  .brand{display:none}
  nav.tabs{gap:1px;padding:2px}
  .tab{flex:1 1 auto;padding:5px 3px;font-size:11.5px;gap:3px}.count{min-width:16px;padding:0 4px;font-size:11px;line-height:16px}
  .tile{padding:4px 10px}.tile .label{font-size:11.5px;line-height:1.3}.tile .val,.tile.hero .val{font-size:17px;line-height:1.25}
  .site-foot nav{gap:0 12px}.site-foot nav a{font-size:12px}
}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px) and (max-height:640px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:640px){.site-foot .mark,#copy{display:none}.site-foot{padding:2px 12px}.site-foot nav a{padding:5px 0;font-size:12.5px}}
</style>
</head>
<body>
<div class="shell">

  <section id="login" class="login card" hidden>
    <div class="login-top">
      <h1 data-i18n="loginTitle"></h1>
      <div class="seg langseg" role="group" data-i18n-attr="aria-label:langLabel">
        <button type="button" data-lang="vi" lang="vi" aria-label="Tiếng Việt" aria-pressed="false">VI</button>
        <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
      </div>
    </div>
    <p class="sub" data-i18n="loginHint"></p>
    <form id="loginForm">
      <label class="sr" for="key" data-i18n="keyLabel"></label>
      <input id="key" type="password" autocomplete="current-password" data-i18n-attr="placeholder:keyLabel" required>
      <div class="err" id="loginErr" role="alert"></div>
      <button class="btn go" type="submit" data-i18n="loginBtn"></button>
    </form>
  </section>

  <header class="top" id="topbar" hidden>
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="var(--accent)"/><path d="M42 40A16 16 0 1 1 26 14a13 13 0 0 0 16 26z" fill="var(--on-accent)"/><circle cx="44" cy="20" r="2.5" fill="var(--on-accent)"/></svg><h1>Night Play</h1></div>
    <nav class="tabs" role="tablist" data-i18n-attr="aria-label:navLabel">
      <button class="tab" role="tab" id="tab-overview" data-tab="overview" aria-controls="v-overview" aria-selected="true" data-i18n="tabOverview"></button>
      <button class="tab" role="tab" id="tab-review" data-tab="review" aria-controls="v-review" aria-selected="false" tabindex="-1"><span data-i18n="tabReview"></span> <span class="count" id="reviewBadge" hidden></span></button>
      <button class="tab" role="tab" id="tab-orders" data-tab="orders" aria-controls="v-orders" aria-selected="false" tabindex="-1" data-i18n="tabOrders"></button>
      <button class="tab" role="tab" id="tab-passes" data-tab="passes" aria-controls="v-passes" aria-selected="false" tabindex="-1" data-i18n="tabPasses"></button>
    </nav>
    <button class="btn ico" id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="tools" data-i18n-attr="aria-label:menu;title:menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    <div class="tools" id="tools">
      <div class="seg" role="group" data-i18n-attr="aria-label:rangeLabel" id="range">
        <button data-d="7" aria-pressed="false"></button>
        <button data-d="30" aria-pressed="true"></button>

class AuthError extends Error {}
async function api(path, post) {
  const key = store.get("adm_key");
  if (!key) { showLogin(); throw new AuthError(); }
  let r;
  try { r = await fetch("/api/admin/" + path, { method: post ? "POST" : "GET", headers: Object.assign({ Authorization: "Bearer " + key }, post ? { "Content-Type": "application/json" } : {}), body: post ? JSON.stringify(post) : undefined, cache: "no-store" }); }
  catch(e){ throw new ApiError("errNet"); }
  if (r.status === 401) { store.del("adm_key"); showLogin("errKey"); throw new AuthError(); }
  let j = null; if (!r.ok) { try { j = await r.json(); } catch(e){} }
  if (r.status === 503 && !(j && j.error === "migration_required")) { showLogin("errDisabled"); throw new AuthError(); }
  const code = j && I18N.vi["e_" + j.error] ? "e_" + j.error : "";
  if (code) throw new ApiError(code);
  if (r.status === 429) throw new ApiError("errRate");
  if (!r.ok) throw new ApiError("errServer", { n: r.status });
  return r.json();
}
/* tải CSV theo bộ lọc hiện tại: fetch + blob (khoá chỉ nằm trong header, không nằm trong URL) */
async function downloadCsv(kind, btn) {
  const key = store.get("adm_key"); if (!key) return showLogin();
  const params = kind === "passes" ? { status: $("pStatus").value, q: $("pQ").value.trim() } : { status: $("oStatus").value, q: $("oQ").value.trim() };
  const old = btn.textContent; btn.disabled = true; btn.textContent = t("exportBusy");
  try {
    const r = await fetch("/api/admin/" + kind + ".csv?" + new URLSearchParams(params), { headers: { Authorization: "Bearer " + key }, cache: "no-store" });
    if (r.status === 401) { store.del("adm_key"); showLogin("errKey"); return; }
    if (!r.ok) throw new Error("http");
    const url = URL.createObjectURL(await r.blob()), a = document.createElement("a");
    a.href = url; a.download = "night-play-" + kind + "-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e) { alert(t("exportFail")); }
  finally { btn.disabled = false; btn.textContent = old; }
}

/* khung vẽ chung: kích thước theo khung chứa, trục Y, nhãn trục X */
function niceMax(v){ if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function plot(el, rows, maxVal) {
  const W = Math.floor(el.clientWidth), H = Math.floor(el.clientHeight); if (W < 100 || H < 100) return null;
  const m = { l: 44, r: 12, t: 8, b: 26 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = niceMax(maxVal), ticks = ih > 160 ? 4 : 2, band = iw / rows.length, y = v => m.t + ih - v / max * ih;
  const every = Math.ceil(rows.length / Math.max(2, Math.floor(iw / 56)));
  let grid = "";
  for (let i = 0; i <= ticks; i++) { const v = max / ticks * i, yy = y(v);
    grid += '<line class="' + (i ? "gl" : "bl") + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (m.l - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + compact(v) + "</text>"; }
  const xl = rows.map((r, i) => i % every === 0 ? '<text x="' + (m.l + band * i + band / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + dayLabel(r.day) + "</text>" : "").join("");
  const hits = rows.map((r, i) => '<rect class="hit" data-i="' + i + '" tabindex="0" x="' + (m.l + band * i) + '" y="' + m.t + '" width="' + band + '" height="' + ih + '" aria-label="' + esc(dayLabel(r.day) + ": " + hitLabel(r)) + '"/>' +
    '<rect class="hov" x="' + (m.l + band * i) + '" y="' + m.t + '" width="' + band + '" height="' + ih + '"/>').join("");
  return { W, H, m, iw, ih, band, y, grid, xl, hits, cx: i => m.l + band * i + band / 2, base: m.t + ih };
}

function wireTip(el, rows, html) {

function drawRevenue() {
  const el = $("chart"), rows = stats.daily;
  hitLabel = r => t("hitRev", { v: money(r.revenue), n: r.orders });
  const P = plot(el, rows, Math.max(...rows.map(r => r.revenue))); if (!P) return;
  const bw = Math.min(24, Math.max(3, P.band - 4));

  rows.forEach((r, i) => { if (r.revenue <= 0) return;
    const top = P.y(r.revenue), x = P.cx(i) - bw / 2, rr = Math.min(4, P.base - top, bw / 2);
    bars += '<path class="bar" d="M' + x + "," + P.base + "V" + (top + rr) + "Q" + x + "," + top + " " + (x + rr) + "," + top + "H" + (x + bw - rr) + "Q" + (x + bw) + "," + top + " " + (x + bw) + "," + (top + rr) + "V" + P.base + 'Z"/>'; });
  el.innerHTML = '<svg width="' + P.W + '" height="' + P.H + '" role="img" aria-label="' + esc(t("revAria", { v: money(stats.totals.revenuePeriod) })) + '">' + P.grid + bars + P.xl + P.hits + "</svg>";

  const path = { grant: "grant", revoke: "revoke", devices: "devices/delete", email: "email" }[D.act], uid = D.uid;
  D.busy = true; $("actGo").disabled = true; $("actMsg").className = "actmsg"; $("actMsg").textContent = t("aBusy");
  try { await api("passes/" + uid + "/" + path, st.body); D.flash = { cls: "ok", text: t("aDone") }; }
  catch(err) { if (err instanceof AuthError) { D.busy = false; return; } D.flash = { cls: "bad", text: errText(err) }; }
  D.busy = false;
  if (D.uid !== uid) return;
  if (D.flash.cls === "ok") { await loadDetail(); if (lists[curList()].rows) loadList(curList()); }
  else { $("actMsg").className = "actmsg bad"; $("actMsg").textContent = D.flash.text; syncForm(); }
});
$("dClose").addEventListener("click", closeDrawer);
$("dBack").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });
document.addEventListener("click", e => { const o = e.target.closest("[data-open]"); if (o && !e.target.closest("#drawer")) openDrawer(o.dataset.open, e.target.closest("button,[data-open]")); });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[role=button][data-open]")) { e.preventDefault(); openDrawer(e.target.dataset.open, e.target); } });

$("rResult").addEventListener("change", () => loadList("review", true));
$("oStatus").addEventListener("change", () => loadList("orders", true));
let qt; $("oQ").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => loadList("orders", true), 300); });

/* ---------- điều khiển chung ---------- */
async function start() {
  if (!store.get("adm_key")) return showLogin();
  if (await loadStats()) selectTab(location.hash.slice(1) || "overview");
}
async function refresh() {
  if (await loadStats()) { if (tab === "overview") renderOverview(); else loadList(curList()); }
}
$("loginForm").addEventListener("submit", e => { e.preventDefault(); store.set("adm_key", $("key").value.trim()); $("key").value = ""; start(); });
$("logout").addEventListener("click", () => { closeDrawer(); store.del("adm_key"); stats = null; updatedAt = null; showLogin(); });
$("refresh").addEventListener("click", refresh);
$("range").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]"); if (!b) return;
  days = +b.dataset.d; store.set("adm_days", days);
  $("range").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  refresh();
});
$("range").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.d === days ? "true" : "false"));
document.querySelectorAll("[data-toggle]").forEach(btn => btn.addEventListener("click", () => {
  const k = btn.dataset.toggle, chart = $(k === "rev" ? "chart" : "tChart"), table = $(k === "rev" ? "revTable" : "trafTable");
  tv[k] = !tv[k];
  chart.hidden = tv[k]; table.hidden = !tv[k];
  btn.textContent = tv[k] ? t("viewChart") : t("viewTable"); btn.setAttribute("aria-pressed", String(tv[k]));
  if (!tv[k]) drawCharts();
}));
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!stats) return; if (tab === "overview") { drawPlans(); drawGames(); drawLive(); drawCharts(); } else loadList(curList()); }, 150); });

/* màn hình gọn: menu tuỳ chọn + chọn khung hiển thị */
const tools = $("tools"), more = $("moreBtn");
const setMore = on => { tools.classList.toggle("open", on); more.setAttribute("aria-expanded", String(on)); };
more.addEventListener("click", e => { e.stopPropagation(); setMore(!tools.classList.contains("open")); });
document.addEventListener("click", e => { if (!e.target.closest("#tools")) setMore(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setMore(false); });
function setPanel(p) {
  document.querySelector(".panels").dataset.p = p;
  $("pnav").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === p)));
  if (stats) { drawPlans(); drawGames(); drawLive(); drawCharts(); }
}
$("pnav").addEventListener("click", e => { const b = e.target.closest("button[data-p]"); if (b) setPanel(b.dataset.p); });

/* ---------- footer + khởi động ---------- */
$("fMail").href = "mailto:" + ((window.SITE && SITE.email) || "");
applyStatic();
start();
</script>
<script src="../shared/updated.js"></script>
<script src="../shared/bars.js"></script>
</body>
</html>
